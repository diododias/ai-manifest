e": "Padrão de documentação", "status": "canonical", "updated": "2026-08-09", "html": "<h1 id=\"docs-documentation-standard~padrão-de-documentação\">Padrão de documentação</h1>\n<blockquote>\n<p>Como escrever documentos do Agent Team que servem ao leitor apressado e ao leitor detalhista no mesmo arquivo.</p>\n</blockquote>\n<h2 id=\"docs-documentation-standard~em-2-minutos\">Em 2 minutos</h2>\n<p>Todo documento canônico atende dois leitores. O primeiro chega sem contexto, tem poucos minutos e quer decidir se vale a pena continuar. O segundo já decidiu que vale e precisa do detalhe operacional para executar. Atender apenas um dos dois produz documentação que cansa ou documentação que não sustenta a operação.</p>\n<p>A solução adotada é <strong>um documento por tema, com duas camadas dentro dele</strong>. A camada rápida fica no topo, em prosa, e responde \"o que é isto, para que serve e o que muda no meu trabalho\". A camada detalhada vem abaixo, organizada em blocos navegáveis, e responde \"como executo isto na prática\".</p>\n<table>\n<thead>\n<tr>\n<th>Camada</th>\n<th>Onde fica</th>\n<th>Formato</th>\n<th>Tamanho alvo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Rápida</td>\n<td>Logo após o título</td>\n<td>Prosa corrida + uma tabela-âncora</td>\n<td>200–400 palavras</td>\n</tr>\n<tr>\n<td>Mapa</td>\n<td>Entre as duas camadas</td>\n<td>Tabela de seções com \"leia se você…\"</td>\n<td>5–15 linhas</td>\n</tr>\n<tr>\n<td>Detalhada</td>\n<td>Restante do documento</td>\n<td>Blocos com abertura em prosa, tabelas e diagramas</td>\n<td>sem limite</td>\n</tr>\n</tbody>\n</table>\n<p>A regra que resolve o problema de \"bullets massivos\" é simples: <strong>nenhuma seção começa com uma lista, e nenhuma lista carrega o significado sozinha</strong>. Listas descrevem itens; prosa e tabelas descrevem relações.</p>\n<hr>\n<h2 id=\"docs-documentation-standard~mapa-deste-documento\">Mapa deste documento</h2>\n<table>\n<thead>\n<tr>\n<th>Seção</th>\n<th>Responde</th>\n<th>Leia se você…</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-documentation-standard~1-as-duas-camadas\">1. As duas camadas</a></td>\n<td>Como estruturar o topo e o corpo</td>\n<td>vai escrever ou reescrever um documento</td>\n</tr>\n<tr>\n<td><a href=\"#docs-documentation-standard~2-regras-de-formatação\">2. Regras de formatação</a></td>\n<td>Quando usar prosa, tabela, lista ou diagrama</td>\n<td>está corrigindo um documento denso</td>\n</tr>\n<tr>\n<td><a href=\"#docs-documentation-standard~3-front-matter-e-estado\">3. Front matter e estado</a></td>\n<td>Quais metadados são obrigatórios</td>\n<td>está criando um arquivo novo</td>\n</tr>\n<tr>\n<td><a href=\"#docs-documentation-standard~4-navegação-e-links\">4. Navegação e links</a></td>\n<td>Como um documento aponta para os outros</td>\n<td>está movendo ou renomeando arquivos</td>\n</tr>\n<tr>\n<td><a href=\"#docs-documentation-standard~5-checklist-de-revisão\">5. Checklist de revisão</a></td>\n<td>Como validar antes do PR</td>\n<td>está fechando uma alteração de documentação</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-documentation-standard~1-as-duas-camadas\">1. As duas camadas</h2>\n<h3 id=\"docs-documentation-standard~11-camada-rápida--em-2-minutos\">1.1 Camada rápida — \"Em 2 minutos\"</h3>\n<p>É a primeira seção de todo documento canônico, sempre com esse título. Ela é escrita para alguém que já conhece workflows de desenvolvimento e quer avaliar o projeto antes de investir tempo. Não é um resumo executivo genérico: é o argumento central do documento em prosa.</p>\n<p>Um bloco \"Em 2 minutos\" bem escrito contém três movimentos, nesta ordem:</p>\n<ol>\n<li><strong>O problema</strong> que o documento existe para resolver, em uma ou duas frases concretas.</li>\n<li><strong>A resposta</strong> do Agent Team a esse problema, com o mecanismo principal nomeado.</li>\n<li><strong>Uma tabela-âncora</strong> com as 3 a 7 entidades centrais do tema — papéis, fases, gates, artefatos — que o leitor detalhista vai reencontrar depois, mais desenvolvidas.</li>\n</ol>\n<p>O que não entra na camada rápida: exceções, casos de borda, listas de responsabilidades completas, nomes de arquivos internos e qualquer coisa que só faça sentido depois de contexto.</p>\n<h3 id=\"docs-documentation-standard~12-mapa-do-documento\">1.2 Mapa do documento</h3>\n<p>Uma tabela curta entre as camadas, com três colunas: seção, pergunta que ela responde e para quem ela é. O mapa transforma um documento longo em algo que se navega por intenção, e não por rolagem. Documentos abaixo de 150 linhas podem omiti-lo.</p>\n<p><strong>Documentos curtos de contrato</strong> — os workflows em <code>docs/workflows/</code>, por exemplo — são exceção às duas camadas. Eles já cabem em uma tela, abrem com um parágrafo de propósito seguido da tabela de contrato, e não ganham nada com um bloco \"Em 2 minutos\" separado. A regra prática: se o documento inteiro é lido em menos tempo do que o resumo economizaria, não há resumo a escrever.</p>\n<h3 id=\"docs-documentation-standard~13-camada-detalhada\">1.3 Camada detalhada</h3>\n<p>O corpo do documento é dividido em <strong>blocos numerados</strong>, e cada bloco segue o mesmo ritmo:</p>\n<ul>\n<li>um parágrafo de abertura que explica por que aquele bloco existe e como ele se conecta ao anterior;</li>\n<li>o conteúdo estruturado — tabela, diagrama, sequência numerada ou lista curta;</li>\n<li>quando houver decisão envolvida, uma frase final de consequência: o que acontece se a regra não for seguida.</li>\n</ul>\n<p>Blocos com mais de 120 linhas devem virar um documento próprio, referenciado a partir do mapa.</p>\n<hr>\n<h2 id=\"docs-documentation-standard~2-regras-de-formatação\">2. Regras de formatação</h2>\n<h3 id=\"docs-documentation-standard~21-a-escolha-do-formato\">2.1 A escolha do formato</h3>\n<p>A pergunta a fazer antes de escrever qualquer bloco é \"que tipo de informação é esta?\". Cada tipo tem um formato correto, e usar lista para tudo é a causa raiz da documentação cansativa.</p>\n<table>\n<thead>\n<tr>\n<th>Tipo de informação</th>\n<th>Formato correto</th>\n<th>Formato errado comum</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Relação entre entidades (quem decide o quê, quem entrega para quem)</td>\n<td>Tabela</td>\n<td>Lista de bullets</td>\n</tr>\n<tr>\n<td>Sequência com ordem e dependência</td>\n<td>Lista numerada ou diagrama Mermaid</td>\n<td>Bullets</td>\n</tr>\n<tr>\n<td>Argumento, motivo, trade-off</td>\n<td>Prosa</td>\n<td>Bullets</td>\n</tr>\n<tr>\n<td>Enumeração curta sem estrutura interna</td>\n<td>Lista com até 5 itens</td>\n<td>Tabela</td>\n</tr>\n<tr>\n<td>Estrutura hierárquica (pastas, artefatos)</td>\n<td>Bloco <code>text</code> ou árvore</td>\n<td>Bullets aninhados</td>\n</tr>\n<tr>\n<td>Contrato de entrada/saída</td>\n<td>Tabela de duas colunas</td>\n<td>Subtítulos repetidos</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-documentation-standard~22-limites-que-evitam-a-parede-de-bullets\">2.2 Limites que evitam a parede de bullets</h3>\n<p>Seis limites, em ordem de impacto:</p>\n<table>\n<thead>\n<tr>\n<th>Limite</th>\n<th>Regra</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Abertura</strong></td>\n<td>Nenhuma seção <code>##</code> começa com uma lista — sempre há ao menos uma frase antes</td>\n</tr>\n<tr>\n<td><strong>Tamanho</strong></td>\n<td>Listas param em 7 itens; acima disso, agrupe em subcategorias nomeadas ou converta em tabela</td>\n</tr>\n<tr>\n<td><strong>Paralelismo</strong></td>\n<td>Se todos os itens seguem o padrão <code>**Campo:** valor</code>, isso é uma tabela, não uma lista</td>\n</tr>\n<tr>\n<td><strong>Profundidade</strong></td>\n<td>Sem bullets aninhados além do segundo nível; hierarquia mais profunda vira subtítulo ou bloco de código</td>\n</tr>\n<tr>\n<td><strong>Adjacência</strong></td>\n<td>Duas listas nunca se tocam; se houver duas seguidas sem prosa entre elas, o bloco precisa ser reescrito</td>\n</tr>\n<tr>\n<td><strong>Proporção</strong></td>\n<td>Em documentos canônicos, no máximo 30% das linhas devem ser bullets</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Exceções à regra de abertura.</strong> Três tipos de lista carregam o significado sozinhos e podem abrir uma seção: listas de links ou referências, checklists com <code>- [ ]</code>, e listas de perguntas usadas para conduzir uma discussão. Subseções <code>###</code> que são enumerações puras também podem abrir com lista, desde que a seção <code>##</code> que as contém tenha prosa.</p>\n<h3 id=\"docs-documentation-standard~23-recursos-visuais\">2.3 Recursos visuais</h3>\n<p>Diagramas Mermaid são obrigatórios em qualquer documento que descreva fluxo entre fases, agentes ou gates — um <code>flowchart LR</code> no início da seção poupa dezenas de linhas de texto. Tabelas de contrato (entrada, quem consolida, quem colabora, saída, owner, gate) devem manter sempre a mesma ordem de colunas entre documentos, para que o leitor reconheça o padrão sem reler o cabeçalho.</p>\n<p>Separadores <code>---</code> marcam a troca de bloco temático, não a troca de subtítulo. Ênfase em negrito serve para nomear a entidade sendo definida, não para dar destaque emocional.</p>\n<hr>\n<h2 id=\"docs-documentation-standard~3-front-matter-e-estado\">3. Front matter e estado</h2>\n<p>Todo documento destinado a leitores humanos em <code>docs/</code> começa com front matter YAML. Os pacotes de agente (<code>docs/agents/&lt;agente&gt;/*.md</code>) são exceção: são consumidos pela ferramenta de execução e seguem o formato que ela espera.</p>\n<pre><code class=\"language-yaml\">---\ntitle: &lt;título legível, prefixado por &quot;Agent Team —&quot; nos canônicos&gt;\nstatus: canonical | proposed | reference\nupdated_at: YYYY-MM-DD\n---\n</code></pre>\n<p>O campo <code>status</code> comunica ao leitor o peso da informação e evita que material histórico oriente decisão corrente.</p>\n<table>\n<thead>\n<tr>\n<th>Estado</th>\n<th>Significado</th>\n<th>Efeito prático</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>canonical</code></td>\n<td>Referência vigente do sistema</td>\n<td>Conflitos são resolvidos a favor deste documento</td>\n</tr>\n<tr>\n<td><code>proposed</code></td>\n<td>Pronto para validação em piloto</td>\n<td>Pode ser seguido, mas ainda muda</td>\n</tr>\n<tr>\n<td><code>reference</code></td>\n<td>Apoio à compreensão ou apresentação</td>\n<td>Não cria obrigação</td>\n</tr>\n</tbody>\n</table>\n<p>Não existe estado <code>archived</code>. Documentação que deixou de descrever o fluxo vigente é removida no mesmo PR que a substitui — o histórico permanece recuperável no Git, e o repositório passa a conter apenas uma versão de cada tema.</p>\n<p>Quando um conceito muda, a alteração entra primeiro no documento <code>canonical</code> e só depois é propagada para os especializados. O caminho inverso produz divergência silenciosa.</p>\n<hr>\n<h2 id=\"docs-documentation-standard~4-navegação-e-links\">4. Navegação e links</h2>\n<p>Cada documento abre com uma linha de citação (<code>&gt;</code>) que o resume em uma frase e, quando aplicável, uma segunda linha com os documentos vizinhos. Todos os links internos são relativos ao arquivo, nunca absolutos ao repositório, para que o repositório continue navegável em qualquer host.</p>\n<p>A hierarquia de <code>docs/</code> é fixa. Os documentos de modelo operacional ficam na raiz de <code>docs/</code>, sem pasta intermediária, porque são a camada conceitual do repositório inteiro; as pastas existem apenas onde há um conjunto homogêneo de arquivos.</p>\n<pre><code class=\"language-text\">docs/\n├── README.md                    # índice e mapa de leitura por perfil\n├── operating-model.md           # fonte canônica: papéis, decisões e ciclo\n├── operating-model-90-10.md     # gates, risco e autonomia progressiva\n├── repo-harness.md              # o contrato executável de um repositório\n├── end-to-end-journey.md        # a jornada completa em um diagrama\n├── journey-by-phase.md          # a mesma jornada, um bloco por vez\n├── documentation-standard.md    # este padrão\n├── site.html                    # documentação navegável em página única\n├── agents/                      # catálogo, contratos e pacotes importáveis\n├── workflows/                   # contratos de colaboração multiagente\n└── diagrams/                    # organização de workspace e fontes de verdade\n</code></pre>\n<p>O repositório não mantém pasta de arquivo histórico. Documentação que deixou de valer é removida, e o histórico fica no Git — manter versões superadas ao lado das vigentes cria ambiguidade sobre qual delas orienta uma decisão.</p>\n<p>Ao mover ou renomear um arquivo, os links que apontavam para ele precisam ser corrigidos no mesmo commit. Link quebrado em documentação canônica é defeito, não pendência.</p>\n<hr>\n<h2 id=\"docs-documentation-standard~5-checklist-de-revisão\">5. Checklist de revisão</h2>\n<p>Antes de abrir o PR de uma alteração de documentação, confirme:</p>\n<table>\n<thead>\n<tr>\n<th>Verificação</th>\n<th>Critério</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Camada rápida</td>\n<td>Existe \"Em 2 minutos\", em prosa, com tabela-âncora</td>\n</tr>\n<tr>\n<td>Abertura de seções</td>\n<td>Nenhuma seção começa com lista</td>\n</tr>\n<tr>\n<td>Densidade</td>\n<td>Nenhuma lista com mais de 7 itens; bullets abaixo de 30% das linhas</td>\n</tr>\n<tr>\n<td>Formato</td>\n<td>Relações estão em tabela; sequências, em lista numerada ou diagrama</td>\n</tr>\n<tr>\n<td>Front matter</td>\n<td><code>title</code>, <code>status</code> e <code>updated_at</code> presentes e corretos</td>\n</tr>\n<tr>\n<td>Links</td>\n<td>Todos os links relativos resolvem para arquivos existentes</td>\n</tr>\n<tr>\n<td>Propagação</td>\n<td>A fonte canônica foi atualizada antes dos documentos derivados</td>\n</tr>\n</tbody>\n</table>\n<p>Documentos que descrevem instruções executadas por agentes — <code>skills/*/SKILL.md</code> e os pacotes em <code>docs/agents/&lt;agente&gt;/</code> — seguem regras próprias de concisão e podem usar listas densas de forma intencional. Este padrão se aplica à documentação destinada a leitores humanos.</p>", "toc": [{"level": 2, "id": "docs-documentation-standard~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-documentation-standard~mapa-deste-documento", "text": "Mapa deste documento"}, {"level": 2, "id": "docs-documentation-standard~1-as-duas-camadas", "text": "1. As duas camadas"}, {"level": 3, "id": "docs-documentation-standard~11-camada-rápida--em-2-minutos", "text": "1.1 Camada rápida — \"Em 2 minutos\""}, {"level": 3, "id": "docs-documentation-standard~12-mapa-do-documento", "text": "1.2 Mapa do documento"}, {"level": 3, "id": "docs-documentation-standard~13-camada-detalhada", "text": "1.3 Camada detalhada"}, {"level": 2, "id": "docs-documentation-standard~2-regras-de-formatação", "text": "2. Regras de formatação"}, {"level": 3, "id": "docs-documentation-standard~21-a-escolha-do-formato", "text": "2.1 A escolha do formato"}, {"level": 3, "id": "docs-documentation-standard~22-limites-que-evitam-a-parede-de-bullets", "text": "2.2 Limites que evitam a parede de bullets"}, {"level": 3, "id": "docs-documentation-standard~23-recursos-visuais", "text": "2.3 Recursos visuais"}, {"level": 2, "id": "docs-documentation-standard~3-front-matter-e-estado", "text": "3. Front matter e estado"}, {"level": 2, "id": "docs-documentation-standard~4-navegação-e-links", "text": "4. Navegação e links"}, {"level": 2, "id": "docs-documentation-standard~5-checklist-de-revisão", "text": "5. Checklist de revisão"}], "text": " padrão de documentação como escrever documentos do agent team que servem ao leitor apressado e ao leitor detalhista no mesmo arquivo. em 2 minutos todo documento canônico atende dois leitores. o primeiro chega sem contexto, tem poucos minutos e quer decidir se vale a pena continuar. o segundo já decidiu que vale e precisa do detalhe operacional para executar. atender apenas um dos dois produz documentação que cansa ou documentação que não sustenta a operação. a solução adotada é um documento por tema, com duas camadas dentro dele . a camada rápida fica no topo, em prosa, e responde \"o que é isto, para que serve e o que muda no meu trabalho\". a camada detalhada vem abaixo, organizada em blocos navegáveis, e responde \"como executo isto na prática\". camada onde fica formato tamanho alvo rápida logo após o título prosa corrida + uma tabela-âncora 200–400 palavras mapa entre as duas camadas tabela de seções com \"leia se você…\" 5–15 linhas detalhada restante do documento blocos com abertura em prosa, tabelas e diagramas sem limite a regra que resolve o problema de \"bullets massivos\" é simples: nenhuma seção começa com uma lista, e nenhuma lista carrega o significado sozinha . listas descrevem itens; prosa e tabelas descrevem relações. mapa deste documento seção responde leia se você… 1. as duas camadas como estruturar o topo e o corpo vai escrever ou reescrever um documento 2. regras de formatação quando usar prosa, tabela, lista ou diagrama está corrigindo um documento denso 3. front matter e estado quais metadados são obrigatórios está criando um arquivo novo 4. navegação e links como um documento aponta para os outros está movendo ou renomeando arquivos 5. checklist de revisão como validar antes do pr está fechando uma alteração de documentação 1. as duas camadas 1.1 camada rápida — \"em 2 minutos\" é a primeira seção de todo documento canônico, sempre com esse título. ela é escrita para alguém que já conhece workflows de desenvolvimento e quer avaliar o projeto antes de investir tempo. não é um resumo executivo genérico: é o argumento central do documento em prosa. um bloco \"em 2 minutos\" bem escrito contém três movimentos, nesta ordem: o problema que o documento existe para resolver, em uma ou duas frases concretas. a resposta do agent team a esse problema, com o mecanismo principal nomeado. uma tabela-âncora com as 3 a 7 entidades centrais do tema — papéis, fases, gates, artefatos — que o leitor detalhista vai reencontrar depois, mais desenvolvidas. o que não entra na camada rápida: exceções, casos de borda, listas de responsabilidades completas, nomes de arquivos internos e qualquer coisa que só faça sentido depois de contexto. 1.2 mapa do documento uma tabela curta entre as camadas, com três colunas: seção, pergunta que ela responde e para quem ela é. o mapa transforma um documento longo em algo que se navega por intenção, e não por rolagem. documentos abaixo de 150 linhas podem omiti-lo. documentos curtos de contrato — os workflows em docs/workflows/ , por exemplo — são exceção às duas camadas. eles já cabem em uma tela, abrem com um parágrafo de propósito seguido da tabela de contrato, e não ganham nada com um bloco \"em 2 minutos\" separado. a regra prática: se o documento inteiro é lido em menos tempo do que o resumo economizaria, não há resumo a escrever. 1.3 camada detalhada o corpo do documento é dividido em blocos numerados , e cada bloco segue o mesmo ritmo: um parágrafo de abertura que explica por que aquele bloco existe e como ele se conecta ao anterior; o conteúdo estruturado — tabela, diagrama, sequência numerada ou lista curta; quando houver decisão envolvida, uma frase final de consequência: o que acontece se a regra não for seguida. blocos com mais de 120 linhas devem virar um documento próprio, referenciado a partir do mapa. 2. regras de formatação 2.1 a escolha do formato a pergunta a fazer antes de escrever qualquer bloco é \"que tipo de informação é esta?\". cada tipo tem um formato correto, e usar lista para tudo é a causa raiz da documentação cansativa. tipo de informação formato correto formato errado comum relação entre entidades (quem decide o quê, quem entrega para quem) tabela lista de bullets sequência com ordem e dependência lista numerada ou diagrama mermaid bullets argumento, motivo, trade-off prosa bullets enumeração curta sem estrutura interna lista com até 5 itens tabela estrutura hierárquica (pastas, artefatos) bloco text ou árvore bullets aninhados contrato de entrada/saída tabela de duas colunas subtítulos repetidos 2.2 limites que evitam a parede de bullets seis limites, em ordem de impacto: limite regra abertura nenhuma seção ## começa com uma lista — sempre há ao menos uma frase antes tamanho listas param em 7 itens; acima disso, agrupe em subcategorias nomeadas ou converta em tabela paralelismo se todos os itens seguem o padrão **campo:** valor , isso é uma tabela, não uma lista profundidade sem bullets aninhados além do segundo nível; hierarquia mais profunda vira subtítulo ou bloco de código adjacência duas listas nunca se tocam; se houver duas seguidas sem prosa entre elas, o bloco precisa ser reescrito proporção em documentos canônicos, no máximo 30% das linhas devem ser bullets exceções à regra de abertura. três tipos de lista carregam o significado sozinhos e podem abrir uma seção: listas de links ou referências, checklists com - [ ] , e listas de perguntas usadas para conduzir uma discussão. subseções ### que são enumerações puras também podem abrir com lista, desde que a seção ## que as contém tenha prosa. 2.3 recursos visuais diagramas mermaid são obrigatórios em qualquer documento que descreva fluxo entre fases, agentes ou gates — um flowchart lr no início da seção poupa dezenas de linhas de texto. tabelas de contrato (entrada, quem consolida, quem colabora, saída, owner, gate) devem manter sempre a mesma ordem de colunas entre documentos, para que o leitor reconheça o padrão sem reler o cabeçalho. separadores --- marcam a troca de bloco temático, não a troca de subtítulo. ênfase em negrito serve para nomear a entidade sendo definida, não para dar destaque emocional. 3. front matter e estado todo documento destinado a leitores humanos em docs/ começa com front matter yaml. os pacotes de agente ( docs/agents/&lt;agente&gt;/*.md ) são exceção: são consumidos pela ferramenta de execução e seguem o formato que ela espera. --- title: &lt;título legível, prefixado por &quot;agent team —&quot; nos canônicos&gt; status: canonical | proposed | reference updated_at: yyyy-mm-dd --- o campo status comunica ao leitor o peso da informação e evita que material histórico oriente decisão corrente. estado significado efeito prático canonical referência vigente do sistema conflitos são resolvidos a favor deste documento proposed pronto para validação em piloto pode ser seguido, mas ainda muda reference apoio à compreensão ou apresentação não cria obrigação não existe estado archived . documentação que deixou de descrever o fluxo vigente é removida no mesmo pr que a substitui — o histórico permanece recuperável no git, e o repositório passa a conter apenas uma versão de cada tema. quando um conceito muda, a alteração entra primeiro no documento canonical e só depois é propagada para os especializados. o caminho inverso produz divergência silenciosa. 4. navegação e links cada documento abre com uma linha de citação ( &gt; ) que o resume em uma frase e, quando aplicável, uma segunda linha com os documentos vizinhos. todos os links internos são relativos ao arquivo, nunca absolutos ao repositório, para que o repositório continue navegável em qualquer host. a hierarquia de docs/ é fixa. os documentos de modelo operacional ficam na raiz de docs/ , sem pasta intermediária, porque são a camada conceitual do repositório inteiro; as pastas existem apenas onde há um conjunto homogêneo de arquivos. docs/ ├── readme.md # índice e mapa de leitura por perfil ├── operating-model.md # fonte canônica: papéis, decisões e ciclo ├── operating-model-90-10.md # gates, risco e autonomia progressiva ├── repo-harness.md # o contrato executável de um repositório ├── end-to-end-journey.md # a jornada completa em um diagrama ├── journey-by-phase.md # a mesma jornada, um bloco por vez ├── documentation-standard.md # este padrão ├── site.html # documentação navegável em página única ├── agents/ # catálogo, contratos e pacotes importáveis ├── workflows/ # contratos de colaboração multiagente └── diagrams/ # organização de workspace e fontes de verdade o repositório não mantém pasta de arquivo histórico. documentação que deixou de valer é removida, e o histórico fica no git — manter versões superadas ao lado das vigentes cria ambiguidade sobre qual delas orienta uma decisão. ao mover ou renomear um arquivo, os links que apontavam para ele precisam ser corrigidos no mesmo commit. link quebrado em documentação canônica é defeito, não pendência. 5. checklist de revisão antes de abrir o pr de uma alteração de documentação, confirme: verificação critério camada rápida existe \"em 2 minutos\", em prosa, com tabela-âncora abertura de seções nenhuma seção começa com lista densidade nenhuma lista com mais de 7 itens; bullets abaixo de 30% das linhas formato relações estão em tabela; sequências, em lista numerada ou diagrama front matter title , status e updated_at presentes e corretos links todos os links relativos resolvem para arquivos existentes propagação a fonte canônica foi atualizada antes dos documentos derivados documentos que descrevem instruções executadas por agentes — skills/*/skill.md e os pacotes em docs/agents/&lt;agente&gt;/ — seguem regras próprias de concisão e podem usar listas densas de forma intencional. este padrão se aplica à documentação destinada a leitores humanos. "}, {"id": "docs-workflows-readme", "path": "docs/workflows/README.md", "section": "Workflows", "title": "Mapa dos workflows", "status": "proposed", "updated": "2026-08-09", "html": "<h1 id=\"docs-workflows-readme~workflows-multiagente\">Workflows multiagente</h1>\n<blockquote>\n<p>O contrato de colaboração entre agentes em cada uma das 11 etapas da jornada: quem faz o quê, em que ordem, o que atravessa a fronteira e quando escalar.</p>\n</blockquote>\n<h2 id=\"docs-workflows-readme~em-2-minutos\">Em 2 minutos</h2>\n<p>O <a href=\"#docs-agents-catalog\">catálogo de agentes</a> define cada papel isoladamente. Um workflow define o que acontece <strong>entre</strong> eles: a sequência de missões, os artefatos que atravessam as fronteiras, como contribuições independentes convergem em um único artefato, e o ponto em que uma decisão deve ser escalada ao humano responsável.</p>\n<p>Os workflows detalham a colaboração. Eles não substituem os contratos individuais do catálogo, a autoridade do <a href=\"#docs-operating-model\">modelo operacional</a> nem os gates do <a href=\"#docs-operating-model-90-10\">modelo 90/10</a>. O que cada repositório precisa carregar para que esses workflows rodem com agentes está no <a href=\"#docs-repo-harness\">repo harness</a>.</p>\n<p>Duas distinções resolvem a maior parte das dúvidas na prática:</p>\n<table>\n<thead>\n<tr>\n<th>Distinção</th>\n<th>O que significa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Catálogo vs. execução</strong></td>\n<td><code>docs/workflows/</code> é o catálogo canônico e versionado; a execução acontece no workspace do owner, em <code>projects/&lt;project&gt;/</code>. Nada de uma execução é gravado no catálogo.</td>\n</tr>\n<tr>\n<td><strong>Canônico vs. trânsito</strong></td>\n<td>Artefatos persistentes vivem na fonte canônica do domínio; <code>.coordination/</code> e <code>memory.md</code> são auxiliares e um handoff só termina quando o artefato final chegou à fonte canônica.</td>\n</tr>\n</tbody>\n</table>\n<p>Cada etapa tem um único agente que <strong>consolida</strong> a saída, e um ou mais agentes que <strong>colaboram ou desafiam</strong>. A crítica sempre vem de uma instância independente de quem produziu o artefato.</p>\n<hr>\n<h2 id=\"docs-workflows-readme~modo-dry-run\">Modo dry-run</h2>\n<p>Workflows podem ser executados em modo de experimentação sem gerar artefatos persistentes.</p>\n<p><strong>Como ativar:</strong> passe <code>mode: dry-run</code> no início da missão ou prefixe o comando com <code>--dry-run</code>.</p>\n<p><strong>Comportamento esperado:</strong>\n- O agente executa todo o raciocínio, análises e rascunhos normalmente.\n- Não cria nem modifica arquivos em <code>projects/</code>, <code>engineering/</code>, <code>execution/</code> ou qualquer outra pasta de artefatos.\n- Pode imprimir o que <em>teria</em> gerado diretamente na conversa.\n- Não atualiza <code>BOARD.md</code>, <code>STATUS.md</code>, Work Items nem handoffs.</p>\n<p><strong>Quando usar:</strong> explorar um workflow desconhecido, testar uma abordagem antes de comprometê-la, ou validar o comportamento do agente sem efeitos colaterais.</p>\n<h2 id=\"docs-workflows-readme~onde-o-workflow-vive-e-onde-a-execução-acontece\">Onde o workflow vive e onde a execução acontece</h2>\n<p><code>docs/workflows/</code> é o <strong>catálogo canônico e versionado</strong> dos workflows reutilizáveis. Ele não recebe artefatos de uma execução concreta.</p>\n<p>Cada usuário ou papel executa o workflow dentro de seu próprio workspace. A instalação desse workspace deve conter <code>docs/workflows/</code> para registrar os workflows habilitados, sua versão, permissões, integrações e adaptações locais. Essa camada local referencia o workflow canônico — não o copia nem passa a ser fonte de verdade concorrente.</p>\n<pre><code class=\"language-text\">&lt;workspace-do-usuario&gt;/\n├── docs/\n│   └── workflows/              # bindings locais para docs/workflows/\n├── projects/\n│   └── &lt;project&gt;/              # artefatos persistentes de uma execução\n├── .coordination/              # handoffs e bloqueios temporários (oculto)\n├── memory.md                   # contexto retomável do agente, nunca fonte canônica\n└── repos/                      # somente no workspace técnico, quando aplicável\n</code></pre>\n<p>Antes de iniciar uma missão, o agente resolve: <code>workspace do owner → projects/&lt;project&gt; → Work Item → fontes canônicas</code>. Ele nunca grava no catálogo global um <code>PB</code>, <code>PRD</code>, plano, evidência ou handoff de uma execução.</p>\n<h2 id=\"docs-workflows-readme~localização-dos-artefatos-por-workflow\">Localização dos artefatos por workflow</h2>\n<p>Os nomes abaixo usam <code>&lt;pm-workspace&gt;</code>, <code>&lt;ux-workspace&gt;</code> e <code>&lt;tech-lead-workspace&gt;</code> para representar workspaces individuais, e <code>&lt;project&gt;</code> para o identificador comum entre eles.</p>\n<table>\n<thead>\n<tr>\n<th>Workflow</th>\n<th>Fontes e artefatos persistentes</th>\n<th>Trânsito temporário</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Intake</td>\n<td><code>&lt;pm-workspace&gt;/projects/&lt;project&gt;/work-items/</code></td>\n<td><code>&lt;pm-workspace&gt;/.coordination/inbox/</code> e <code>handoffs/</code></td>\n</tr>\n<tr>\n<td>Discovery e research</td>\n<td>PM: <code>&lt;pm-workspace&gt;/projects/&lt;project&gt;/discovery/</code>; UX: <code>&lt;ux-workspace&gt;/projects/&lt;project&gt;/research/</code> e <code>journeys/</code>; viabilidade técnica: <code>&lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/engineering/architecture/</code></td>\n<td><code>.coordination/handoffs/</code> de cada workspace</td>\n</tr>\n<tr>\n<td>Produto e UX</td>\n<td>PM: <code>&lt;pm-workspace&gt;/projects/&lt;project&gt;/requirements/prd/</code>, <code>strategy/</code>, <code>decisions/</code>; UX: <code>&lt;ux-workspace&gt;/projects/&lt;project&gt;/flows/</code>, <code>specifications/</code>, <code>prototypes/</code> e <code>validation/</code></td>\n<td>handoffs em <code>&lt;pm-workspace&gt;/projects/&lt;project&gt;/handoffs/</code> e <code>&lt;ux-workspace&gt;/projects/&lt;project&gt;/handoffs/</code></td>\n</tr>\n<tr>\n<td>Especificação técnica</td>\n<td><code>&lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/plans/active/</code>, <code>engineering/specs/</code>, <code>engineering/adr/</code> e <code>work-items/</code></td>\n<td><code>execution/handoffs/</code></td>\n</tr>\n<tr>\n<td>Implementação</td>\n<td><code>&lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/work-items/</code>, <code>execution/evidence/</code> e <code>repos/worktrees/&lt;org&gt;/&lt;repo&gt;/&lt;work-item&gt;/</code></td>\n<td><code>.coordination/active/</code> e <code>execution/handoffs/</code></td>\n</tr>\n<tr>\n<td>Validação e PR</td>\n<td><code>&lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/execution/reviews/</code> e <code>execution/evidence/</code></td>\n<td><code>.coordination/blockers/</code> para exceções ativas</td>\n</tr>\n<tr>\n<td>Homologação</td>\n<td>PM: <code>&lt;pm-workspace&gt;/projects/&lt;project&gt;/validation/</code>; UX: <code>&lt;ux-workspace&gt;/projects/&lt;project&gt;/validation/</code>; Tech Lead: <code>&lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/execution/evidence/</code></td>\n<td>handoff para release</td>\n</tr>\n<tr>\n<td>Produção e observação</td>\n<td><code>&lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/execution/evidence/</code>, <code>LEARNINGS.md</code> (candidatos) e o registro autorizado de release</td>\n<td>incidente, alerta e rollback em .coordination/` até serem promovidos</td>\n</tr>\n<tr>\n<td>Conhecimento e melhoria</td>\n<td>fonte canônica do domínio; Tech Lead: <code>projects/&lt;project&gt;/LEARNINGS.md</code>; PM: novo item em <code>projects/&lt;project&gt;/work-items/</code></td>\n<td>propostas e hipóteses em <code>.coordination/</code>, até decisão do owner</td>\n</tr>\n</tbody>\n</table>\n<p><code>.coordination/</code> e <code>memory.md</code> são auxiliares: um handoff só se torna concluído quando seu artefato final está na fonte canônica do projeto. Se uma subpasta necessária ainda não existir, ela deve ser criada sob <code>projects/&lt;project&gt;/</code> no workspace que detém o domínio — nunca sob o catálogo global ou como diretório genérico de outro usuário.</p>\n<h2 id=\"docs-workflows-readme~mapa-da-jornada\">Mapa da jornada</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">Etapa</th>\n<th>Workflow</th>\n<th>Agente que consolida</th>\n<th>Agentes que colaboram ou desafiam</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">0</td>\n<td><a href=\"#docs-workflows-00-intake-and-triage\">Intake e triagem</a></td>\n<td>Intake Agent</td>\n<td>Product Manager Agent; Meeting Context quando houver reunião</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">1</td>\n<td><a href=\"#docs-workflows-01-discovery-and-research\">Discovery e research</a></td>\n<td>Product Manager Agent</td>\n<td>UX Specification; Tech Lead Discovery; Adversarial PM quando houver proposta candidata</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">2</td>\n<td><a href=\"#docs-workflows-02-product-and-ux-planning\">Planejamento de produto e UX</a></td>\n<td>Product Manager Agent + UX Specification</td>\n<td>Adversarial Product Manager; especialistas de pesquisa, conteúdo ou prototipação</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">3</td>\n<td><a href=\"#docs-workflows-03-technical-specification\">Especificação técnica</a></td>\n<td>Specification Tech Lead</td>\n<td>Adversarial Tech Lead; Security/Data/Platform quando necessário</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">4</td>\n<td><a href=\"#docs-workflows-04-autonomous-implementation\">Implementação autônoma</a></td>\n<td>Orchestrator Agent</td>\n<td>Software Engineer Agents</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">5</td>\n<td><a href=\"#docs-workflows-05-adversarial-validation\">Validação adversarial</a></td>\n<td>QA / Validation Agent</td>\n<td>Security Review; Architecture Review; Adversarial Code Reviewer</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">6</td>\n<td><a href=\"#docs-workflows-06-pr-and-merge\">PR e merge</a></td>\n<td>PR Agent</td>\n<td>Reviewer Agents</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">7</td>\n<td><a href=\"#docs-workflows-07-release-candidate-validation\">Homologação</a></td>\n<td>Product Validation Agent</td>\n<td>Release Agent</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">8</td>\n<td><a href=\"#docs-workflows-08-production-release-and-observation\">Produção e observação</a></td>\n<td>Release Agent</td>\n<td>Observability Agent</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">9</td>\n<td><a href=\"#docs-workflows-09-knowledge-curation\">Curadoria de conhecimento</a></td>\n<td>Knowledge Agent</td>\n<td>Critic Agent quando a alteração for sensível</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">10</td>\n<td><a href=\"#docs-workflows-10-continuous-improvement\">Telemetria e melhoria contínua</a></td>\n<td>Auto Dream Agent</td>\n<td>Telemetry; Observability; Critic Agent</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"docs-workflows-readme~contrato-comum\">Contrato comum</h2>\n<p>Todo workflow explicita seis coisas. A ausência de qualquer uma delas torna o workflow inexecutável por um agente sem negociação humana.</p>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>Define</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>artefatos de entrada e critérios para iniciar</td>\n</tr>\n<tr>\n<td>Missões</td>\n<td>dependências e o que pode rodar em paralelo</td>\n</tr>\n<tr>\n<td>Consolidação</td>\n<td>o único agente responsável pela saída</td>\n</tr>\n<tr>\n<td>Handoffs</td>\n<td>fatos, evidências, hipóteses, riscos e perguntas em aberto</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>gate de saída e destino em caso de falha</td>\n</tr>\n<tr>\n<td>Escalonamento</td>\n<td>condição de parada e owner humano da decisão</td>\n</tr>\n</tbody>\n</table>\n<p>O orquestrador distribui contexto mínimo e controla dependências — ele não substitui o consolidado do agente primário nem a decisão do owner humano. Agentes de crítica são sempre instâncias independentes de quem produziu o artefato avaliado.</p>\n<h2 id=\"docs-workflows-readme~convenções-de-execução\">Convenções de execução</h2>\n<p><strong>Formato.</strong> Toda missão usa o envelope de saída do <a href=\"#docs-agents-catalog~23-envelope-padrão-de-saída\">catálogo</a>, e um handoff referencia artefatos versionados em vez de copiar o contexto inteiro.</p>\n<p><strong>Convergência.</strong> Uma contribuição não vira decisão pelo simples fato de estar no consolidado: divergências e riscos residuais permanecem explícitos. O workflow termina com artefato coerente e evidence pack, nunca com respostas isoladas dos agentes.</p>\n<p><strong>Revisão.</strong> Nova informação material devolve o workflow ao agente responsável pela revisão, e invalida a aprovação relacionada quando a política determinar.</p>\n<p><strong>Bindings locais.</strong> O binding em <code>&lt;workspace&gt;/docs/workflows/</code> declara a versão do workflow canônico e pode <strong>restringir</strong> ferramentas, permissões e integrações. Ele não pode ampliar autonomia nem alterar gates sem a decisão prevista no modelo operacional — essa assimetria é intencional.</p>", "toc": [{"level": 2, "id": "docs-workflows-readme~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-workflows-readme~modo-dry-run", "text": "Modo dry-run"}, {"level": 2, "id": "docs-workflows-readme~onde-o-workflow-vive-e-onde-a-execução-acontece", "text": "Onde o workflow vive e onde a execução acontece"}, {"level": 2, "id": "docs-workflows-readme~localização-dos-artefatos-por-workflow", "text": "Localização dos artefatos por workflow"}, {"level": 2, "id": "docs-workflows-readme~mapa-da-jornada", "text": "Mapa da jornada"}, {"level": 2, "id": "docs-workflows-readme~contrato-comum", "text": "Contrato comum"}, {"level": 2, "id": "docs-workflows-readme~convenções-de-execução", "text": "Convenções de execução"}], "text": " workflows multiagente o contrato de colaboração entre agentes em cada uma das 11 etapas da jornada: quem faz o quê, em que ordem, o que atravessa a fronteira e quando escalar. em 2 minutos o catálogo de agentes define cada papel isoladamente. um workflow define o que acontece entre eles: a sequência de missões, os artefatos que atravessam as fronteiras, como contribuições independentes convergem em um único artefato, e o ponto em que uma decisão deve ser escalada ao humano responsável. os workflows detalham a colaboração. eles não substituem os contratos individuais do catálogo, a autoridade do modelo operacional nem os gates do modelo 90/10 . o que cada repositório precisa carregar para que esses workflows rodem com agentes está no repo harness . duas distinções resolvem a maior parte das dúvidas na prática: distinção o que significa catálogo vs. execução docs/workflows/ é o catálogo canônico e versionado; a execução acontece no workspace do owner, em projects/&lt;project&gt;/ . nada de uma execução é gravado no catálogo. canônico vs. trânsito artefatos persistentes vivem na fonte canônica do domínio; .coordination/ e memory.md são auxiliares e um handoff só termina quando o artefato final chegou à fonte canônica. cada etapa tem um único agente que consolida a saída, e um ou mais agentes que colaboram ou desafiam . a crítica sempre vem de uma instância independente de quem produziu o artefato. modo dry-run workflows podem ser executados em modo de experimentação sem gerar artefatos persistentes. como ativar: passe mode: dry-run no início da missão ou prefixe o comando com --dry-run . comportamento esperado: - o agente executa todo o raciocínio, análises e rascunhos normalmente. - não cria nem modifica arquivos em projects/ , engineering/ , execution/ ou qualquer outra pasta de artefatos. - pode imprimir o que teria gerado diretamente na conversa. - não atualiza board.md , status.md , work items nem handoffs. quando usar: explorar um workflow desconhecido, testar uma abordagem antes de comprometê-la, ou validar o comportamento do agente sem efeitos colaterais. onde o workflow vive e onde a execução acontece docs/workflows/ é o catálogo canônico e versionado dos workflows reutilizáveis. ele não recebe artefatos de uma execução concreta. cada usuário ou papel executa o workflow dentro de seu próprio workspace. a instalação desse workspace deve conter docs/workflows/ para registrar os workflows habilitados, sua versão, permissões, integrações e adaptações locais. essa camada local referencia o workflow canônico — não o copia nem passa a ser fonte de verdade concorrente. &lt;workspace-do-usuario&gt;/ ├── docs/ │ └── workflows/ # bindings locais para docs/workflows/ ├── projects/ │ └── &lt;project&gt;/ # artefatos persistentes de uma execução ├── .coordination/ # handoffs e bloqueios temporários (oculto) ├── memory.md # contexto retomável do agente, nunca fonte canônica └── repos/ # somente no workspace técnico, quando aplicável antes de iniciar uma missão, o agente resolve: workspace do owner → projects/&lt;project&gt; → work item → fontes canônicas . ele nunca grava no catálogo global um pb , prd , plano, evidência ou handoff de uma execução. localização dos artefatos por workflow os nomes abaixo usam &lt;pm-workspace&gt; , &lt;ux-workspace&gt; e &lt;tech-lead-workspace&gt; para representar workspaces individuais, e &lt;project&gt; para o identificador comum entre eles. workflow fontes e artefatos persistentes trânsito temporário intake &lt;pm-workspace&gt;/projects/&lt;project&gt;/work-items/ &lt;pm-workspace&gt;/.coordination/inbox/ e handoffs/ discovery e research pm: &lt;pm-workspace&gt;/projects/&lt;project&gt;/discovery/ ; ux: &lt;ux-workspace&gt;/projects/&lt;project&gt;/research/ e journeys/ ; viabilidade técnica: &lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/engineering/architecture/ .coordination/handoffs/ de cada workspace produto e ux pm: &lt;pm-workspace&gt;/projects/&lt;project&gt;/requirements/prd/ , strategy/ , decisions/ ; ux: &lt;ux-workspace&gt;/projects/&lt;project&gt;/flows/ , specifications/ , prototypes/ e validation/ handoffs em &lt;pm-workspace&gt;/projects/&lt;project&gt;/handoffs/ e &lt;ux-workspace&gt;/projects/&lt;project&gt;/handoffs/ especificação técnica &lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/plans/active/ , engineering/specs/ , engineering/adr/ e work-items/ execution/handoffs/ implementação &lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/work-items/ , execution/evidence/ e repos/worktrees/&lt;org&gt;/&lt;repo&gt;/&lt;work-item&gt;/ .coordination/active/ e execution/handoffs/ validação e pr &lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/execution/reviews/ e execution/evidence/ .coordination/blockers/ para exceções ativas homologação pm: &lt;pm-workspace&gt;/projects/&lt;project&gt;/validation/ ; ux: &lt;ux-workspace&gt;/projects/&lt;project&gt;/validation/ ; tech lead: &lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/execution/evidence/ handoff para release produção e observação &lt;tech-lead-workspace&gt;/projects/&lt;project&gt;/execution/evidence/ , learnings.md (candidatos) e o registro autorizado de release incidente, alerta e rollback em .coordination/` até serem promovidos conhecimento e melhoria fonte canônica do domínio; tech lead: projects/&lt;project&gt;/learnings.md ; pm: novo item em projects/&lt;project&gt;/work-items/ propostas e hipóteses em .coordination/ , até decisão do owner .coordination/ e memory.md são auxiliares: um handoff só se torna concluído quando seu artefato final está na fonte canônica do projeto. se uma subpasta necessária ainda não existir, ela deve ser criada sob projects/&lt;project&gt;/ no workspace que detém o domínio — nunca sob o catálogo global ou como diretório genérico de outro usuário. mapa da jornada etapa workflow agente que consolida agentes que colaboram ou desafiam 0 intake e triagem intake agent product manager agent; meeting context quando houver reunião 1 discovery e research product manager agent ux specification; tech lead discovery; adversarial pm quando houver proposta candidata 2 planejamento de produto e ux product manager agent + ux specification adversarial product manager; especialistas de pesquisa, conteúdo ou prototipação 3 especificação técnica specification tech lead adversarial tech lead; security/data/platform quando necessário 4 implementação autônoma orchestrator agent software engineer agents 5 validação adversarial qa / validation agent security review; architecture review; adversarial code reviewer 6 pr e merge pr agent reviewer agents 7 homologação product validation agent release agent 8 produção e observação release agent observability agent 9 curadoria de conhecimento knowledge agent critic agent quando a alteração for sensível 10 telemetria e melhoria contínua auto dream agent telemetry; observability; critic agent contrato comum todo workflow explicita seis coisas. a ausência de qualquer uma delas torna o workflow inexecutável por um agente sem negociação humana. item define entrada artefatos de entrada e critérios para iniciar missões dependências e o que pode rodar em paralelo consolidação o único agente responsável pela saída handoffs fatos, evidências, hipóteses, riscos e perguntas em aberto saída gate de saída e destino em caso de falha escalonamento condição de parada e owner humano da decisão o orquestrador distribui contexto mínimo e controla dependências — ele não substitui o consolidado do agente primário nem a decisão do owner humano. agentes de crítica são sempre instâncias independentes de quem produziu o artefato avaliado. convenções de execução formato. toda missão usa o envelope de saída do catálogo , e um handoff referencia artefatos versionados em vez de copiar o contexto inteiro. convergência. uma contribuição não vira decisão pelo simples fato de estar no consolidado: divergências e riscos residuais permanecem explícitos. o workflow termina com artefato coerente e evidence pack, nunca com respostas isoladas dos agentes. revisão. nova informação material devolve o workflow ao agente responsável pela revisão, e invalida a aprovação relacionada quando a política determinar. bindings locais. o binding em &lt;workspace&gt;/docs/workflows/ declara a versão do workflow canônico e pode restringir ferramentas, permissões e integrações. ele não pode ampliar autonomia nem alterar gates sem a decisão prevista no modelo operacional — essa assimetria é intencional. "}, {"id": "docs-workflows-00-intake-and-triage", "path": "docs/workflows/00-intake-and-triage.md", "section": "Workflows", "title": "00 · Intake e triagem", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-00-intake-and-triage~workflow--intake-e-triagem\">Workflow — intake e triagem</h1>\n<p>Transforma uma solicitação bruta em um Work Item rastreável, sem permitir que triagem automática se torne decisão de prioridade.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>solicitação, incidente, feedback, oportunidade ou context pack de reunião</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Intake Agent</td>\n</tr>\n<tr>\n<td>Colaboram</td>\n<td>Meeting Context Agent quando a origem for reunião; Product Manager Agent para enriquecer contexto de produto</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>Work Item com problema, origem, produto, owner, duplicidades, dependências, risco preliminar e lacunas</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>Product Manager</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>problema, rastreabilidade, responsável e contexto mínimo explícitos</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[Solicitação ou transcrição] --&gt; B{Origem é reunião?}\n    B -- sim --&gt; C[Meeting Context Agent\\ncontext pack]\n    B -- não --&gt; D[Intake Agent]\n    C --&gt; D\n    D --&gt; E[Product Manager Agent\\ncontexto e duplicidades]\n    E --&gt; F[Intake Agent\\nconsolida Work Item]\n    F --&gt; G{Gate de triagem}\n    G -- completo --&gt; H[PM prioriza ou rejeita]\n    G -- lacuna --&gt; I[perguntas para origem ou PM]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[Solicitação ou transcrição] --&gt; B{Origem é reunião?}\n    B -- sim --&gt; C[Meeting Context Agent\\ncontext pack]\n    B -- não --&gt; D[Intake Agent]\n    C --&gt; D\n    D --&gt; E[Product Manager Agent\\ncontexto e duplicidades]\n    E --&gt; F[Intake Agent\\nconsolida Work Item]\n    F --&gt; G{Gate de triagem}\n    G -- completo --&gt; H[PM prioriza ou rejeita]\n    G -- lacuna --&gt; I[perguntas para origem ou PM]</code></pre></details></div>\n<h2 id=\"docs-workflows-00-intake-and-triage~sequência\">Sequência</h2>\n<ol>\n<li>O Meeting Context Agent, se acionado, separa fatos, decisões provisórias e itens que exigem confirmação; seu output é somente contexto de entrada.</li>\n<li>O Intake Agent normaliza a demanda, vincula fontes e procura duplicidades e dependências.</li>\n<li>O Product Manager Agent complementa valor, stakeholder, produto afetado e perguntas de negócio, sem definir a prioridade final.</li>\n<li>O Intake Agent consolida um único Work Item e registra a origem de cada afirmação relevante.</li>\n<li>O PM decide priorizar, devolver para esclarecimento ou encerrar.</li>\n</ol>\n<h2 id=\"docs-workflows-00-intake-and-triage~escalonamento\">Escalonamento</h2>\n<p>Escalar ao PM quando o problema não puder ser identificado, houver conflito entre solicitações ou a prioridade exigir julgamento. Duplicidade não autoriza encerrar um item sem vínculo explícito ao item que o absorveu.</p>", "toc": [{"level": 2, "id": "docs-workflows-00-intake-and-triage~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-00-intake-and-triage~escalonamento", "text": "Escalonamento"}], "text": " workflow — intake e triagem transforma uma solicitação bruta em um work item rastreável, sem permitir que triagem automática se torne decisão de prioridade. aspecto contrato entrada solicitação, incidente, feedback, oportunidade ou context pack de reunião consolida intake agent colaboram meeting context agent quando a origem for reunião; product manager agent para enriquecer contexto de produto saída work item com problema, origem, produto, owner, duplicidades, dependências, risco preliminar e lacunas owner humano product manager gate problema, rastreabilidade, responsável e contexto mínimo explícitos − ajustado + ajustar flowchart lr a[solicitação ou transcrição] --&gt; b{origem é reunião?} b -- sim --&gt; c[meeting context agent\\ncontext pack] b -- não --&gt; d[intake agent] c --&gt; d d --&gt; e[product manager agent\\ncontexto e duplicidades] e --&gt; f[intake agent\\nconsolida work item] f --&gt; g{gate de triagem} g -- completo --&gt; h[pm prioriza ou rejeita] g -- lacuna --&gt; i[perguntas para origem ou pm] ver código do diagrama flowchart lr a[solicitação ou transcrição] --&gt; b{origem é reunião?} b -- sim --&gt; c[meeting context agent\\ncontext pack] b -- não --&gt; d[intake agent] c --&gt; d d --&gt; e[product manager agent\\ncontexto e duplicidades] e --&gt; f[intake agent\\nconsolida work item] f --&gt; g{gate de triagem} g -- completo --&gt; h[pm prioriza ou rejeita] g -- lacuna --&gt; i[perguntas para origem ou pm] sequência o meeting context agent, se acionado, separa fatos, decisões provisórias e itens que exigem confirmação; seu output é somente contexto de entrada. o intake agent normaliza a demanda, vincula fontes e procura duplicidades e dependências. o product manager agent complementa valor, stakeholder, produto afetado e perguntas de negócio, sem definir a prioridade final. o intake agent consolida um único work item e registra a origem de cada afirmação relevante. o pm decide priorizar, devolver para esclarecimento ou encerrar. escalonamento escalar ao pm quando o problema não puder ser identificado, houver conflito entre solicitações ou a prioridade exigir julgamento. duplicidade não autoriza encerrar um item sem vínculo explícito ao item que o absorveu. "}, {"id": "docs-workflows-01-discovery-and-research", "path": "docs/workflows/01-discovery-and-research.md", "section": "Workflows", "title": "01 · Discovery e research", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-01-discovery-and-research~workflow--discovery-e-research\">Workflow — discovery e research</h1>\n<p>Investiga problema, usuário e viabilidade em paralelo para produzir um <code>PB.md</code> que preserve incertezas; não antecipa a solução técnica nem transforma hipótese em requisito.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>Work Item priorizado, dados disponíveis, pesquisas, restrições e perguntas</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Product Manager Agent</td>\n</tr>\n<tr>\n<td>Colaboram</td>\n<td>UX Specification Agent; Tech Lead Discovery Agent; Adversarial Product Manager Agent quando houver hipótese/proposta candidata</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td><code>PB.md</code>, evidências, jornada inicial, restrições, risco preliminar e perguntas abertas</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>PM; UX e Tech Lead respondem pelos respectivos domínios</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>problema, usuário, experiência desejada e viabilidade inicial cobertos</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[Work Item priorizado] --&gt; B[PM Agent\\nproblema, valor, outcome]\n    A --&gt; C[UX Spec Agent\\nusuário, jornada, research]\n    A --&gt; D[TL Discovery Agent\\nviabilidade, dependências, riscos]\n    B --&gt; E[PM Agent\\nPB.md inicial]\n    C --&gt; E\n    D --&gt; E\n    E --&gt; F[Adversarial PM\\ncritica hipóteses e gaps]\n    F --&gt; G[PM Agent\\nconsolida respostas]\n    G --&gt; H{Gate H1}\n    H -- avançar --&gt; I[Planejamento de produto e UX]\n    H -- ajustar --&gt; B</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[Work Item priorizado] --&gt; B[PM Agent\\nproblema, valor, outcome]\n    A --&gt; C[UX Spec Agent\\nusuário, jornada, research]\n    A --&gt; D[TL Discovery Agent\\nviabilidade, dependências, riscos]\n    B --&gt; E[PM Agent\\nPB.md inicial]\n    C --&gt; E\n    D --&gt; E\n    E --&gt; F[Adversarial PM\\ncritica hipóteses e gaps]\n    F --&gt; G[PM Agent\\nconsolida respostas]\n    G --&gt; H{Gate H1}\n    H -- avançar --&gt; I[Planejamento de produto e UX]\n    H -- ajustar --&gt; B</code></pre></details></div>\n<h2 id=\"docs-workflows-01-discovery-and-research~sequência\">Sequência</h2>\n<ol>\n<li>PM, UX e Tech Lead Discovery recebem a mesma pergunta de discovery, fontes autorizadas e limites de tempo.</li>\n<li>As três investigações acontecem em paralelo; cada uma separa evidência, inferência, hipótese e pergunta.</li>\n<li>O PM Agent consolida o <code>PB.md</code> e preserva riscos, desacordos e lacunas apontados por UX e Tech Lead.</li>\n<li>Havendo uma proposta candidata ou uma hipótese de alto impacto, o Adversarial PM tenta invalidá-la antes da consolidação final.</li>\n<li>O PM apresenta em H1 apenas a síntese decisória: problema, valor, evidências, restrições, riscos e recomendação.</li>\n</ol>\n<h2 id=\"docs-workflows-01-discovery-and-research~regras-de-colaboração\">Regras de colaboração</h2>\n<p>Três limites mantêm o discovery no seu escopo. A consulta ao Tech Lead Discovery é de viabilidade e risco inicial — arquitetura final pertence à especificação técnica. O UX pode devolver a hipótese de problema quando a evidência de usuário a contradisser, e essa devolução não é uma objeção a ser negociada. A crítica adversarial produz findings rastreáveis; ela não reescreve o <code>PB.md</code> silenciosamente.</p>\n<h2 id=\"docs-workflows-01-discovery-and-research~escalonamento\">Escalonamento</h2>\n<p>Escalar se a evidência crítica estiver ausente, se valor e viabilidade entrarem em conflito sem alternativa clara, ou se um risco ultrapassar a autonomia autorizada. H1 decide investir, ajustar, adiar ou encerrar; não resolve detalhes de execução.</p>", "toc": [{"level": 2, "id": "docs-workflows-01-discovery-and-research~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-01-discovery-and-research~regras-de-colaboração", "text": "Regras de colaboração"}, {"level": 2, "id": "docs-workflows-01-discovery-and-research~escalonamento", "text": "Escalonamento"}], "text": " workflow — discovery e research investiga problema, usuário e viabilidade em paralelo para produzir um pb.md que preserve incertezas; não antecipa a solução técnica nem transforma hipótese em requisito. aspecto contrato entrada work item priorizado, dados disponíveis, pesquisas, restrições e perguntas consolida product manager agent colaboram ux specification agent; tech lead discovery agent; adversarial product manager agent quando houver hipótese/proposta candidata saída pb.md , evidências, jornada inicial, restrições, risco preliminar e perguntas abertas owner humano pm; ux e tech lead respondem pelos respectivos domínios gate problema, usuário, experiência desejada e viabilidade inicial cobertos − ajustado + ajustar flowchart lr a[work item priorizado] --&gt; b[pm agent\\nproblema, valor, outcome] a --&gt; c[ux spec agent\\nusuário, jornada, research] a --&gt; d[tl discovery agent\\nviabilidade, dependências, riscos] b --&gt; e[pm agent\\npb.md inicial] c --&gt; e d --&gt; e e --&gt; f[adversarial pm\\ncritica hipóteses e gaps] f --&gt; g[pm agent\\nconsolida respostas] g --&gt; h{gate h1} h -- avançar --&gt; i[planejamento de produto e ux] h -- ajustar --&gt; b ver código do diagrama flowchart lr a[work item priorizado] --&gt; b[pm agent\\nproblema, valor, outcome] a --&gt; c[ux spec agent\\nusuário, jornada, research] a --&gt; d[tl discovery agent\\nviabilidade, dependências, riscos] b --&gt; e[pm agent\\npb.md inicial] c --&gt; e d --&gt; e e --&gt; f[adversarial pm\\ncritica hipóteses e gaps] f --&gt; g[pm agent\\nconsolida respostas] g --&gt; h{gate h1} h -- avançar --&gt; i[planejamento de produto e ux] h -- ajustar --&gt; b sequência pm, ux e tech lead discovery recebem a mesma pergunta de discovery, fontes autorizadas e limites de tempo. as três investigações acontecem em paralelo; cada uma separa evidência, inferência, hipótese e pergunta. o pm agent consolida o pb.md e preserva riscos, desacordos e lacunas apontados por ux e tech lead. havendo uma proposta candidata ou uma hipótese de alto impacto, o adversarial pm tenta invalidá-la antes da consolidação final. o pm apresenta em h1 apenas a síntese decisória: problema, valor, evidências, restrições, riscos e recomendação. regras de colaboração três limites mantêm o discovery no seu escopo. a consulta ao tech lead discovery é de viabilidade e risco inicial — arquitetura final pertence à especificação técnica. o ux pode devolver a hipótese de problema quando a evidência de usuário a contradisser, e essa devolução não é uma objeção a ser negociada. a crítica adversarial produz findings rastreáveis; ela não reescreve o pb.md silenciosamente. escalonamento escalar se a evidência crítica estiver ausente, se valor e viabilidade entrarem em conflito sem alternativa clara, ou se um risco ultrapassar a autonomia autorizada. h1 decide investir, ajustar, adiar ou encerrar; não resolve detalhes de execução. "}, {"id": "docs-workflows-02-product-and-ux-planning", "path": "docs/workflows/02-product-and-ux-planning.md", "section": "Workflows", "title": "02 · Produto e UX", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-02-product-and-ux-planning~workflow--planejamento-de-produto-e-ux\">Workflow — planejamento de produto e UX</h1>\n<p>Converte o problema aprovado em escopo, experiência e critérios de aceite coerentes. Produto e UX são coautores de artefatos distintos; o PM consolida o compromisso de produto.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td><code>PB.md</code>, decisão H1, evidências de usuário e restrições conhecidas</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Product Manager Agent para <code>PRD.md</code>; UX Specification Agent para UX spec</td>\n</tr>\n<tr>\n<td>Colaboram</td>\n<td>Adversarial Product Manager; agentes de research, conteúdo e prototipação quando necessários</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td><code>PRD.md</code>, jornada e fluxo desejados, UX spec, protótipo proporcional, critérios de UX e aceite</td>\n</tr>\n<tr>\n<td>Owners humanos</td>\n<td>PM para produto e UX para experiência</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>rastreabilidade <code>PB → PRD</code>, gaps críticos tratados, sucesso mensurável</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[PB.md aprovado] --&gt; B[PM Agent\\nPRD candidato]\n    A --&gt; C[UX Spec Agent\\nfluxo, estados e validação]\n    C --&gt; B\n    B --&gt; D[Adversarial PM\\nambiguidades e cenários adversos]\n    D --&gt; E[PM + UX Agents\\nresposta e consolidação]\n    E --&gt; F{Gate de produto e UX}\n    F -- aprovado --&gt; G[H2: decisão humana]\n    F -- gap --&gt; B\n    G -- aprovar --&gt; H[Especificação técnica]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[PB.md aprovado] --&gt; B[PM Agent\\nPRD candidato]\n    A --&gt; C[UX Spec Agent\\nfluxo, estados e validação]\n    C --&gt; B\n    B --&gt; D[Adversarial PM\\nambiguidades e cenários adversos]\n    D --&gt; E[PM + UX Agents\\nresposta e consolidação]\n    E --&gt; F{Gate de produto e UX}\n    F -- aprovado --&gt; G[H2: decisão humana]\n    F -- gap --&gt; B\n    G -- aprovar --&gt; H[Especificação técnica]</code></pre></details></div>\n<h2 id=\"docs-workflows-02-product-and-ux-planning~sequência\">Sequência</h2>\n<ol>\n<li>O PM Agent propõe objetivo, escopo, fora de escopo, métricas e critérios de produto no <code>PRD.md</code>.</li>\n<li>O UX Specification Agent define jornada, fluxos, estados, conteúdo, acessibilidade, hipóteses e plano de validação; restrições descobertas devem retornar ao PRD.</li>\n<li>Pesquisadores, UX writers e agentes de prototipação só entram por necessidade explícita e entregam insumos ao UX Agent, não versões concorrentes da fonte canônica.</li>\n<li>O Adversarial PM avalia problema, métricas, escopo implícito, casos-limite e coerência entre PRD e UX spec.</li>\n<li>PM e UX Agents registram a resposta a cada finding; o PM consolida o <code>PRD.md</code> e H2 fixa o compromisso.</li>\n</ol>\n<h2 id=\"docs-workflows-02-product-and-ux-planning~escalonamento\">Escalonamento</h2>\n<p>Escalar aos owners quando produto e experiência exigirem trade-off de escopo, faltar evidência para hipótese crítica ou houver objetivo incompatível. Nenhum agente aprova seu próprio artefato; H2 aprova decisão, não edição linha a linha.</p>", "toc": [{"level": 2, "id": "docs-workflows-02-product-and-ux-planning~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-02-product-and-ux-planning~escalonamento", "text": "Escalonamento"}], "text": " workflow — planejamento de produto e ux converte o problema aprovado em escopo, experiência e critérios de aceite coerentes. produto e ux são coautores de artefatos distintos; o pm consolida o compromisso de produto. aspecto contrato entrada pb.md , decisão h1, evidências de usuário e restrições conhecidas consolida product manager agent para prd.md ; ux specification agent para ux spec colaboram adversarial product manager; agentes de research, conteúdo e prototipação quando necessários saída prd.md , jornada e fluxo desejados, ux spec, protótipo proporcional, critérios de ux e aceite owners humanos pm para produto e ux para experiência gate rastreabilidade pb → prd , gaps críticos tratados, sucesso mensurável − ajustado + ajustar flowchart lr a[pb.md aprovado] --&gt; b[pm agent\\nprd candidato] a --&gt; c[ux spec agent\\nfluxo, estados e validação] c --&gt; b b --&gt; d[adversarial pm\\nambiguidades e cenários adversos] d --&gt; e[pm + ux agents\\nresposta e consolidação] e --&gt; f{gate de produto e ux} f -- aprovado --&gt; g[h2: decisão humana] f -- gap --&gt; b g -- aprovar --&gt; h[especificação técnica] ver código do diagrama flowchart lr a[pb.md aprovado] --&gt; b[pm agent\\nprd candidato] a --&gt; c[ux spec agent\\nfluxo, estados e validação] c --&gt; b b --&gt; d[adversarial pm\\nambiguidades e cenários adversos] d --&gt; e[pm + ux agents\\nresposta e consolidação] e --&gt; f{gate de produto e ux} f -- aprovado --&gt; g[h2: decisão humana] f -- gap --&gt; b g -- aprovar --&gt; h[especificação técnica] sequência o pm agent propõe objetivo, escopo, fora de escopo, métricas e critérios de produto no prd.md . o ux specification agent define jornada, fluxos, estados, conteúdo, acessibilidade, hipóteses e plano de validação; restrições descobertas devem retornar ao prd. pesquisadores, ux writers e agentes de prototipação só entram por necessidade explícita e entregam insumos ao ux agent, não versões concorrentes da fonte canônica. o adversarial pm avalia problema, métricas, escopo implícito, casos-limite e coerência entre prd e ux spec. pm e ux agents registram a resposta a cada finding; o pm consolida o prd.md e h2 fixa o compromisso. escalonamento escalar aos owners quando produto e experiência exigirem trade-off de escopo, faltar evidência para hipótese crítica ou houver objetivo incompatível. nenhum agente aprova seu próprio artefato; h2 aprova decisão, não edição linha a linha. "}, {"id": "docs-workflows-03-technical-specification", "path": "docs/workflows/03-technical-specification.md", "section": "Workflows", "title": "03 · Especificação técnica", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-03-technical-specification~workflow--especificação-técnica\">Workflow — especificação técnica</h1>\n<p>Transforma produto e UX aprovados em uma estratégia técnica executável, criticada por uma instância independente antes de ser dividida em tarefas.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td><code>PB.md</code>, <code>PRD.md</code>, UX spec, arquitetura, contratos, SLOs e risco</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Specification Tech Lead Agent</td>\n</tr>\n<tr>\n<td>Colaboram</td>\n<td>Adversarial Tech Lead; especialista de Security, Data ou Platform quando o risco exigir</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td><code>PLAN.md</code>, <code>SPEC.md</code>, <code>TASKS.md</code>, <code>CHECKLIST.md</code>, ADR e planos de teste/rollout/rollback quando aplicáveis</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>rastreabilidade, tarefas verificáveis, trade-offs e gaps críticos tratados</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[PRD + UX spec aprovados] --&gt; B[Specification TL\\nplano, SPEC e tarefas]\n    B --&gt; C{Especialista necessário?}\n    C -- sim --&gt; D[Security/Data/Platform\\nrestrições e controles]\n    C -- não --&gt; E[Adversarial TL]\n    D --&gt; E\n    E --&gt; F[Specification TL\\nresponde findings]\n    F --&gt; G{Gate técnico}\n    G -- ADR, exceção ou R3/R4 --&gt; H[H3: Tech Lead decide]\n    G -- padrão --&gt; I[Implementação]\n    H -- aceitar --&gt; I\n    H -- revisar --&gt; B</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[PRD + UX spec aprovados] --&gt; B[Specification TL\\nplano, SPEC e tarefas]\n    B --&gt; C{Especialista necessário?}\n    C -- sim --&gt; D[Security/Data/Platform\\nrestrições e controles]\n    C -- não --&gt; E[Adversarial TL]\n    D --&gt; E\n    E --&gt; F[Specification TL\\nresponde findings]\n    F --&gt; G{Gate técnico}\n    G -- ADR, exceção ou R3/R4 --&gt; H[H3: Tech Lead decide]\n    G -- padrão --&gt; I[Implementação]\n    H -- aceitar --&gt; I\n    H -- revisar --&gt; B</code></pre></details></div>\n<h2 id=\"docs-workflows-03-technical-specification~sequência\">Sequência</h2>\n<ol>\n<li>O Specification Tech Lead avalia alternativas e registra arquitetura, contratos, dados, testes, telemetria e estratégia de entrega.</li>\n<li>Especialistas são consultados antes da crítica quando há requisito de segurança, dados, plataforma ou domínio que não possa ser tratado por inferência.</li>\n<li>O Adversarial Tech Lead desafia a proposta com cenários de falha, acoplamentos, migrações, rollback, testabilidade e custo operacional.</li>\n<li>O Specification Tech Lead responde findings na fonte canônica e mantém riscos residuais visíveis; a crítica não altera a especificação diretamente.</li>\n<li>H3 somente é acionado por nova ADR, exceção ou risco R3/R4. Sem isso, o gate direciona para implementação.</li>\n</ol>\n<h2 id=\"docs-workflows-03-technical-specification~encerramento\">Encerramento</h2>\n<p>Antes de fechar a rodada, registre:</p>\n<table>\n<thead>\n<tr>\n<th>Artefato</th>\n<th>Destino</th>\n<th>Obrigatório</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Rascunho intermediário do SPEC (pré-revisão adversarial)</td>\n<td><code>plans/assets/03-technical-specification/&lt;date-id&gt;/drafts/</code></td>\n<td>se houve iteração</td>\n</tr>\n<tr>\n<td>Transcrição de reunião ou sessão</td>\n<td><code>plans/assets/03-technical-specification/&lt;date-id&gt;/transcripts/</code></td>\n<td>se houve material externo</td>\n</tr>\n<tr>\n<td>Review adversarial do Adversarial TL Agent</td>\n<td><code>execution/reviews/spec-&lt;SPEC-id&gt;.md</code></td>\n<td>sim</td>\n</tr>\n<tr>\n<td>SPEC finalizado</td>\n<td><code>engineering/specs/&lt;SPEC-id&gt;.md</code></td>\n<td>sim</td>\n</tr>\n<tr>\n<td>ADR quando aplicável</td>\n<td><code>engineering/adr/&lt;ADR-id&gt;.md</code></td>\n<td>quando decisão estrutural</td>\n</tr>\n<tr>\n<td>Plano ativo</td>\n<td><code>plans/active/&lt;PLAN-id&gt;.md</code></td>\n<td>sim</td>\n</tr>\n<tr>\n<td>Work Items criados</td>\n<td><code>work-items/&lt;WI-id&gt;.md</code></td>\n<td>sim</td>\n</tr>\n<tr>\n<td>STATUS.md</td>\n<td>fase atual, plano ativo, próximo gate</td>\n<td>sim</td>\n</tr>\n<tr>\n<td><code>MEMORY.md</code></td>\n<td>decisões e trade-offs desta rodada</td>\n<td>sim</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"docs-workflows-03-technical-specification~escalonamento\">Escalonamento</h2>\n<p>Escalar quando o trade-off for estrutural, depender de acesso ou fornecedor, alterar contrato público ou não tiver mitigação suficiente. O agente não pode reduzir risco apenas por conveniência de entrega.</p>", "toc": [{"level": 2, "id": "docs-workflows-03-technical-specification~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-03-technical-specification~encerramento", "text": "Encerramento"}, {"level": 2, "id": "docs-workflows-03-technical-specification~escalonamento", "text": "Escalonamento"}], "text": " workflow — especificação técnica transforma produto e ux aprovados em uma estratégia técnica executável, criticada por uma instância independente antes de ser dividida em tarefas. aspecto contrato entrada pb.md , prd.md , ux spec, arquitetura, contratos, slos e risco consolida specification tech lead agent colaboram adversarial tech lead; especialista de security, data ou platform quando o risco exigir saída plan.md , spec.md , tasks.md , checklist.md , adr e planos de teste/rollout/rollback quando aplicáveis owner humano tech lead gate rastreabilidade, tarefas verificáveis, trade-offs e gaps críticos tratados − ajustado + ajustar flowchart lr a[prd + ux spec aprovados] --&gt; b[specification tl\\nplano, spec e tarefas] b --&gt; c{especialista necessário?} c -- sim --&gt; d[security/data/platform\\nrestrições e controles] c -- não --&gt; e[adversarial tl] d --&gt; e e --&gt; f[specification tl\\nresponde findings] f --&gt; g{gate técnico} g -- adr, exceção ou r3/r4 --&gt; h[h3: tech lead decide] g -- padrão --&gt; i[implementação] h -- aceitar --&gt; i h -- revisar --&gt; b ver código do diagrama flowchart lr a[prd + ux spec aprovados] --&gt; b[specification tl\\nplano, spec e tarefas] b --&gt; c{especialista necessário?} c -- sim --&gt; d[security/data/platform\\nrestrições e controles] c -- não --&gt; e[adversarial tl] d --&gt; e e --&gt; f[specification tl\\nresponde findings] f --&gt; g{gate técnico} g -- adr, exceção ou r3/r4 --&gt; h[h3: tech lead decide] g -- padrão --&gt; i[implementação] h -- aceitar --&gt; i h -- revisar --&gt; b sequência o specification tech lead avalia alternativas e registra arquitetura, contratos, dados, testes, telemetria e estratégia de entrega. especialistas são consultados antes da crítica quando há requisito de segurança, dados, plataforma ou domínio que não possa ser tratado por inferência. o adversarial tech lead desafia a proposta com cenários de falha, acoplamentos, migrações, rollback, testabilidade e custo operacional. o specification tech lead responde findings na fonte canônica e mantém riscos residuais visíveis; a crítica não altera a especificação diretamente. h3 somente é acionado por nova adr, exceção ou risco r3/r4. sem isso, o gate direciona para implementação. encerramento antes de fechar a rodada, registre: artefato destino obrigatório rascunho intermediário do spec (pré-revisão adversarial) plans/assets/03-technical-specification/&lt;date-id&gt;/drafts/ se houve iteração transcrição de reunião ou sessão plans/assets/03-technical-specification/&lt;date-id&gt;/transcripts/ se houve material externo review adversarial do adversarial tl agent execution/reviews/spec-&lt;spec-id&gt;.md sim spec finalizado engineering/specs/&lt;spec-id&gt;.md sim adr quando aplicável engineering/adr/&lt;adr-id&gt;.md quando decisão estrutural plano ativo plans/active/&lt;plan-id&gt;.md sim work items criados work-items/&lt;wi-id&gt;.md sim status.md fase atual, plano ativo, próximo gate sim memory.md decisões e trade-offs desta rodada sim escalonamento escalar quando o trade-off for estrutural, depender de acesso ou fornecedor, alterar contrato público ou não tiver mitigação suficiente. o agente não pode reduzir risco apenas por conveniência de entrega. "}, {"id": "docs-workflows-04-autonomous-implementation", "path": "docs/workflows/04-autonomous-implementation.md", "section": "Workflows", "title": "04 · Implementação autônoma", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-04-autonomous-implementation~workflow--implementação-autônoma\">Workflow — implementação autônoma</h1>\n<p>Executa tarefas elegíveis em unidades pequenas e isoladas. O Orchestrator coordena dependências e evidências; cada Software Engineer Agent é dono de uma missão, nunca do estado global.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>tarefa elegível, <code>SPEC.md</code>, critérios, permissões, risco e gates</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Orchestrator Agent</td>\n</tr>\n<tr>\n<td>Colaboram</td>\n<td>um ou mais Software Engineer Agents</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>diff rastreável, testes, documentação afetada, resultados locais e handoff para validação</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>Tech Lead por política e exceção</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>hooks locais e critérios da tarefa aprovados</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[TASKS.md] --&gt; B[Orchestrator\\nDAG e missões elegíveis]\n    B --&gt; C[Engineer A\\ntarefa isolada]\n    B --&gt; D[Engineer B\\ntarefa independente]\n    C --&gt; E[hooks e evidências locais]\n    D --&gt; E\n    E -- falha corrigível --&gt; C\n    E -- aprovado --&gt; F[Orchestrator\\nconsolida handoff]\n    E -- repetida ou decisão --&gt; G[escalonamento ao Tech Lead]\n    F --&gt; H[Validação adversarial]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[TASKS.md] --&gt; B[Orchestrator\\nDAG e missões elegíveis]\n    B --&gt; C[Engineer A\\ntarefa isolada]\n    B --&gt; D[Engineer B\\ntarefa independente]\n    C --&gt; E[hooks e evidências locais]\n    D --&gt; E\n    E -- falha corrigível --&gt; C\n    E -- aprovado --&gt; F[Orchestrator\\nconsolida handoff]\n    E -- repetida ou decisão --&gt; G[escalonamento ao Tech Lead]\n    F --&gt; H[Validação adversarial]</code></pre></details></div>\n<h2 id=\"docs-workflows-04-autonomous-implementation~sequência\">Sequência</h2>\n<ol>\n<li>O Orchestrator cria o DAG a partir de <code>TASKS.md</code>, seleciona apenas missões com dependências satisfeitas e distribui o contexto mínimo.</li>\n<li>Cada Engineer Agent declara escopo, arquivos, branch/worktree e validações; trabalho concorrente no mesmo repositório usa isolamento por Work Item.</li>\n<li>O Engineer implementa a menor mudança, atualiza testes e documentação e executa os gates locais.</li>\n<li>Falhas corrigíveis re
