er-input", "text": "User Input"}, {"level": 2, "id": "skills-check-pr-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-check-pr-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-check-pr-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-check-pr-skill~1-localizar-o-pr", "text": "1. Localizar o PR"}, {"level": 3, "id": "skills-check-pr-skill~2-coletar-informações-do-pr", "text": "2. Coletar informações do PR"}, {"level": 3, "id": "skills-check-pr-skill~3-analisar-status", "text": "3. Analisar status"}, {"level": 3, "id": "skills-check-pr-skill~4-identificar-pendências", "text": "4. Identificar pendências"}, {"level": 3, "id": "skills-check-pr-skill~5-gerar-resumo", "text": "5. Gerar resumo"}, {"level": 3, "id": "skills-check-pr-skill~6-reportar-no-chat", "text": "6. Reportar no chat"}, {"level": 2, "id": "skills-check-pr-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-check-pr-skill~done-when", "text": "Done When"}], "text": " check-pr consulta, sem modificar, o estado de um pull request, suas revisões, threads resolvidas e checks. use quando o usuário pedir status, pendências ou bloqueios de um pr aberto. user input $arguments you must consider the user input before proceeding (if not empty). goal verificar o status atual da revisão do pr, identificar pendências e resumir o que precisa ser feito. inputs obrigatório: pr aberto (número ou branch) execution steps 1. localizar o pr se $arguments contém número, use-o. caso contrário, encontre o pr da branch atual: bash gh pr list --head &lt;branch-name&gt; --json number,title,state 2. coletar informações do pr # status geral gh pr view &lt;number&gt; --json state,reviewdecision,mergedat,closedat,isdraft # reviews gh pr view &lt;number&gt; --json reviews --jq '.reviews[] | {author: .author.login, state: .state, body: .body}' # repositório das threads owner=$(gh repo view --json owner --jq '.owner.login') repo=$(gh repo view --json name --jq '.name') # threads inline (inclui caminho, linha e resolução) gh api graphql -f query='query($owner:string!, $repo:string!, $number:int!) { repository(owner:$owner, name:$repo) { pullrequest(number:$number) { reviewthreads(first:100) { nodes { isresolved comments(first:100) { nodes { author { login } body path line } } } } } } }' -f owner=&quot;$owner&quot; -f repo=&quot;$repo&quot; -f number=&lt;number&gt; # check ci gh pr checks &lt;number&gt; 3. analisar status reviews revisor status ação reviewer1 ✅ approved — reviewer2 🔄 changes_requested verificar comentários reviewer3 ⏳ pending aguardando comentários não resolvidos comentário arquivo linha resolvido? ... ... ... ✅ / ❌ ci/cd check status build ✅ / ❌ test ✅ / ❌ lint ✅ / ❌ 4. identificar pendências threads inline não resolvidas; não infira resolução a partir de comentários gerais. checks ci falhando. draft status (se aplicável). merge blockers (proteção de branch, approvals faltando). 5. gerar resumo # status do pr #&lt;number&gt; — &lt;título&gt; **branch:** &lt;branch&gt; **estado:** open / draft / approved / changes requested --- ## reviews | revisor | status | data | |---------|--------|------| | ... | ... | ... | ## pendências ### comentários a resolver - [ ] &lt;comentário 1&gt; — &lt;arquivo&gt;:&lt;linha&gt; - [ ] &lt;comentário 2&gt; — &lt;arquivo&gt;:&lt;linha&gt; ### ci/cd - [ ] &lt;check que falhou&gt; — &lt;erro&gt; ### aprovações - ✅ x de y aprovações necessárias ## próximos passos 1. &lt;ação 1&gt; 2. &lt;ação 2&gt; 6. reportar no chat resumo: status geral, aprovações, pendências. comentários que precisam de ação. checks ci que estão falhando. estimativa de pronto para merge. convenções não modifique o pr — apenas leitura. status é snapshot no momento da consulta. português. done when [ ] status do pr verificado (reviews, comments, ci) [ ] pendências identificadas e listadas [ ] resumo de próximos passos gerado [ ] status reportado no chat "}, {"id": "skills-update-docs-skill", "path": "skills/update-docs/SKILL.md", "section": "Skills", "title": "update-docs", "status": "", "updated": "", "html": "<h1 id=\"skills-update-docs-skill~update-docs\">update-docs</h1><blockquote><p>Compara implementação, PRD e SPEC, registra desvios e atualiza documentação aprovada. Use após validação de uma entrega quando for necessário preservar rastreabilidade entre o planejado e o entregue.</p></blockquote><h2 id=\"skills-update-docs-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-update-docs-skill~goal\">Goal</h2>\n<p>Sincronizar PRD e SPEC com o que foi efetivamente implementado, documentando desvios e atualizando documentação.</p>\n<h2 id=\"skills-update-docs-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>. Não\nreescreva requisitos, critérios de aceite ou status de aprovação para acomodar\no código: registre a divergência primeiro e só atualize o baseline após decisão\nexplícita.</p>\n<h2 id=\"skills-update-docs-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>.agents/prd/&lt;feature-slug&gt;/PRD.md</code></li>\n<li><strong>Obrigatório:</strong> <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code></li>\n<li><strong>Obrigatório:</strong> código implementado</li>\n<li><strong>Opcional:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/tracking.md</code></li>\n</ul>\n<h2 id=\"skills-update-docs-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-update-docs-skill~1-localizar-a-feature\">1. Localizar a feature</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira do contexto.</li>\n<li>Verifique se os artefatos existem.</li>\n</ul>\n<h3 id=\"skills-update-docs-skill~2-carregar-artefatos\">2. Carregar artefatos</h3>\n<ul>\n<li>Leia <code>PRD.md</code> — versão planejada.</li>\n<li>Leia <code>SPEC.md</code> — versão técnica planejada.</li>\n<li>Analise o código implementado (diff).</li>\n</ul>\n<h3 id=\"skills-update-docs-skill~3-identificar-desvios\">3. Identificar desvios</h3>\n<p>Compare planejado vs implementado:</p>\n<table>\n<thead>\n<tr>\n<th>Artefato</th>\n<th>Item</th>\n<th>Planejado</th>\n<th>Implementado</th>\n<th>Desvio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PRD</td>\n<td>HIST-01</td>\n<td>...</td>\n<td>...</td>\n<td>✅ Iguais / ⚠️ Diferente / ❌ Não implementado</td>\n</tr>\n<tr>\n<td>SPEC</td>\n<td>CT-01</td>\n<td>...</td>\n<td>...</td>\n<td>...</td>\n</tr>\n</tbody>\n</table>\n<p>Classifique desvios:\n- <strong>Sem desvio:</strong> implementação idêntica ao planejado.\n- <strong>Desvio menor:</strong> ajuste que não impacta requisitos (refactor, rename).\n- <strong>Desvio de escopo:</strong> implementou algo a mais ou a menos.\n- <strong>Desvio técnico:</strong> abordagem diferente da planejada.\n- <strong>Não implementado:</strong> item do planejado que ficou de fora.</p>\n<h3 id=\"skills-update-docs-skill~4-atualizar-prd-após-decisão-registrada\">4. Atualizar PRD após decisão registrada</h3>\n<ul>\n<li>Registre o resultado e o link para <code>desvios.md</code> no changelog.</li>\n<li>Marque histórias como implementadas somente se os critérios acordados foram atendidos.</li>\n<li>Para desvio de escopo ou requisito, preserve o baseline e registre decisão, dono e data antes de alterá-lo.</li>\n</ul>\n<h3 id=\"skills-update-docs-skill~5-atualizar-spec-após-decisão-registrada\">5. Atualizar SPEC após decisão registrada</h3>\n<ul>\n<li>Registre evidência da implementação e o link para <code>desvios.md</code> no changelog.</li>\n<li>Altere a solução ou os CTs somente com decisão técnica explícita; não transforme um desvio em requisito silenciosamente.</li>\n</ul>\n<h3 id=\"skills-update-docs-skill~6-atualizar-readme-se-aplicável\">6. Atualizar README (se aplicável)</h3>\n<ul>\n<li>Se a feature muda comportamento visível, atualize README.</li>\n<li>Se adiciona dependência, documente.</li>\n<li>Se muda setup/instruções, atualize.</li>\n</ul>\n<h3 id=\"skills-update-docs-skill~7-gerar-relatório-de-desvios\">7. Gerar relatório de desvios</h3>\n<p>Gere <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/desvios.md</code>:</p>\n<pre><code class=\"language-markdown\"># Desvios — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n\n---\n\n## Resumo\n\n| Tipo | Quantidade |\n|------|-----------|\n| ✅ Sem desvio | X |\n| ⚠️ Desvio menor | X |\n| 🔵 Desvio de escopo | X |\n| 🟣 Desvio técnico | X |\n| ❌ Não implementado | X |\n\n---\n\n## Desvios Detalhados\n\n### &lt;Item&gt;\n- **Artefato:** PRD / SPEC\n- **Item:** &lt;ID ou nome&gt;\n- **Planejado:** &lt;o que estava planejado&gt;\n- **Implementado:** &lt;o que foi feito&gt;\n- **Impacto:** &lt;qual o impacto do desvio&gt;\n- **Justificativa:** &lt;por que o desvio&gt;\n\n---\n\n## Ações Necessárias\n\n- &lt;atualizações pendentes&gt;\n- &lt;docs que precisam de update&gt;\n</code></pre>\n<h3 id=\"skills-update-docs-skill~8-reportar-no-chat\">8. Reportar no chat</h3>\n<ul>\n<li>Resumo: X itens sem desvio, Y com desvio, Z não implementados.</li>\n<li>Desvios que precisam de atenção.</li>\n<li>Docs atualizados.</li>\n</ul>\n<h2 id=\"skills-update-docs-skill~convenções\">Convenções</h2>\n<ul>\n<li>Desvios nunca são apagados — documentados para rastreabilidade.</li>\n<li>PRD e SPEC são fontes da verdade — devem refletir implementação real.</li>\n<li>Português.</li>\n</ul>\n<h2 id=\"skills-update-docs-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] PRD atualizado com status e desvios</li>\n<li>[ ] SPEC atualizada com status e desvios</li>\n<li>[ ] README atualizado (se aplicável)</li>\n<li>[ ] <code>desvios.md</code> gerado</li>\n<li>[ ] Resultado reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-update-docs-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-update-docs-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-update-docs-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-update-docs-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-update-docs-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-update-docs-skill~1-localizar-a-feature", "text": "1. Localizar a feature"}, {"level": 3, "id": "skills-update-docs-skill~2-carregar-artefatos", "text": "2. Carregar artefatos"}, {"level": 3, "id": "skills-update-docs-skill~3-identificar-desvios", "text": "3. Identificar desvios"}, {"level": 3, "id": "skills-update-docs-skill~4-atualizar-prd-após-decisão-registrada", "text": "4. Atualizar PRD após decisão registrada"}, {"level": 3, "id": "skills-update-docs-skill~5-atualizar-spec-após-decisão-registrada", "text": "5. Atualizar SPEC após decisão registrada"}, {"level": 3, "id": "skills-update-docs-skill~6-atualizar-readme-se-aplicável", "text": "6. Atualizar README (se aplicável)"}, {"level": 3, "id": "skills-update-docs-skill~7-gerar-relatório-de-desvios", "text": "7. Gerar relatório de desvios"}, {"level": 3, "id": "skills-update-docs-skill~8-reportar-no-chat", "text": "8. Reportar no chat"}, {"level": 2, "id": "skills-update-docs-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-update-docs-skill~done-when", "text": "Done When"}], "text": " update-docs compara implementação, prd e spec, registra desvios e atualiza documentação aprovada. use após validação de uma entrega quando for necessário preservar rastreabilidade entre o planejado e o entregue. user input $arguments you must consider the user input before proceeding (if not empty). goal sincronizar prd e spec com o que foi efetivamente implementado, documentando desvios e atualizando documentação. contrato de artefatos siga o contrato compartilhado . não reescreva requisitos, critérios de aceite ou status de aprovação para acomodar o código: registre a divergência primeiro e só atualize o baseline após decisão explícita. inputs obrigatório: .agents/prd/&lt;feature-slug&gt;/prd.md obrigatório: .agents/spec/&lt;feature-slug&gt;/spec.md obrigatório: código implementado opcional: teamwork/plan/feature-plan-&lt;feature-slug&gt;/tracking.md execution steps 1. localizar a feature se $arguments contém slug, use-o. caso contrário, infira do contexto. verifique se os artefatos existem. 2. carregar artefatos leia prd.md — versão planejada. leia spec.md — versão técnica planejada. analise o código implementado (diff). 3. identificar desvios compare planejado vs implementado: artefato item planejado implementado desvio prd hist-01 ... ... ✅ iguais / ⚠️ diferente / ❌ não implementado spec ct-01 ... ... ... classifique desvios: - sem desvio: implementação idêntica ao planejado. - desvio menor: ajuste que não impacta requisitos (refactor, rename). - desvio de escopo: implementou algo a mais ou a menos. - desvio técnico: abordagem diferente da planejada. - não implementado: item do planejado que ficou de fora. 4. atualizar prd após decisão registrada registre o resultado e o link para desvios.md no changelog. marque histórias como implementadas somente se os critérios acordados foram atendidos. para desvio de escopo ou requisito, preserve o baseline e registre decisão, dono e data antes de alterá-lo. 5. atualizar spec após decisão registrada registre evidência da implementação e o link para desvios.md no changelog. altere a solução ou os cts somente com decisão técnica explícita; não transforme um desvio em requisito silenciosamente. 6. atualizar readme (se aplicável) se a feature muda comportamento visível, atualize readme. se adiciona dependência, documente. se muda setup/instruções, atualize. 7. gerar relatório de desvios gere teamwork/plan/feature-plan-&lt;feature-slug&gt;/desvios.md : # desvios — &lt;feature name&gt; **feature:** &lt;slug&gt; **data:** &lt;yyyy-mm-dd&gt; --- ## resumo | tipo | quantidade | |------|-----------| | ✅ sem desvio | x | | ⚠️ desvio menor | x | | 🔵 desvio de escopo | x | | 🟣 desvio técnico | x | | ❌ não implementado | x | --- ## desvios detalhados ### &lt;item&gt; - **artefato:** prd / spec - **item:** &lt;id ou nome&gt; - **planejado:** &lt;o que estava planejado&gt; - **implementado:** &lt;o que foi feito&gt; - **impacto:** &lt;qual o impacto do desvio&gt; - **justificativa:** &lt;por que o desvio&gt; --- ## ações necessárias - &lt;atualizações pendentes&gt; - &lt;docs que precisam de update&gt; 8. reportar no chat resumo: x itens sem desvio, y com desvio, z não implementados. desvios que precisam de atenção. docs atualizados. convenções desvios nunca são apagados — documentados para rastreabilidade. prd e spec são fontes da verdade — devem refletir implementação real. português. done when [ ] prd atualizado com status e desvios [ ] spec atualizada com status e desvios [ ] readme atualizado (se aplicável) [ ] desvios.md gerado [ ] resultado reportado no chat "}, {"id": "docs-diagrams-tech-lead-workspace", "path": "docs/diagrams/tech-lead-workspace.md", "section": "Workspaces", "title": "Anatomia do workspace", "status": "proposed", "updated": "2026-08-09", "html": "<h1 id=\"docs-diagrams-tech-lead-workspace~agent-team--workspace-do-tech-lead\">Agent Team — workspace do Tech Lead</h1>\n<blockquote>\n<p>Como organizar em disco o contexto, o planejamento, a execução e o aprendizado de vários projetos operados por múltiplos agentes ao mesmo tempo.</p>\n</blockquote>\n<h2 id=\"docs-diagrams-tech-lead-workspace~em-2-minutos\">Em 2 minutos</h2>\n<p>Quando vários agentes trabalham em paralelo sobre os mesmos projetos, o problema deixa de ser \"onde guardo este arquivo\" e passa a ser \"qual dos três lugares onde este dado aparece é o verdadeiro\". Sem uma resposta explícita, agentes começam a divergir silenciosamente e o trabalho se corrompe sem que ninguém perceba.</p>\n<p>Este documento resolve isso com uma separação: <strong>o projeto é a unidade de organização do trabalho; o repositório é a unidade de organização do código</strong>. Um projeto pode envolver vários repositórios, e um repositório pode servir a mais de um projeto. A partir daí, cada tipo de informação tem exatamente um dono declarado na <a href=\"#docs-diagrams-tech-lead-workspace~7-regras-de-fonte-de-verdade\">tabela de fonte de verdade</a>.</p>\n<table>\n<thead>\n<tr>\n<th>Área</th>\n<th>Guarda</th>\n<th>Não guarda</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>docs/</code></td>\n<td>conhecimento válido para vários projetos: padrões, playbooks, templates, portfólio</td>\n<td>PRDs, specs e decisões de um projeto</td>\n</tr>\n<tr>\n<td><code>projects/&lt;slug&gt;/</code></td>\n<td>tudo que é específico do projeto, do contexto às evidências</td>\n<td>código-fonte</td>\n</tr>\n<tr>\n<td><code>repos/</code></td>\n<td>clones locais e worktrees, espelhando a identidade do GitHub</td>\n<td>artefatos de planejamento</td>\n</tr>\n<tr>\n<td><code>plans/</code></td>\n<td>estratégia de execução e material bruto de sessão</td>\n<td>conclusões canônicas</td>\n</tr>\n<tr>\n<td><code>memory/</code></td>\n<td>contexto operacional temporário do agente</td>\n<td>conhecimento validado</td>\n</tr>\n<tr>\n<td><code>coordination/</code></td>\n<td>comunicação transitória entre agentes</td>\n<td>qualquer coisa persistente</td>\n</tr>\n</tbody>\n</table>\n<p>Duas regras derivam disso e valem para qualquer agente: uma informação nunca é autoritativa em dois lugares, e resumos apontam para a fonte original em vez de reproduzi-la.</p>\n<hr>\n<h2 id=\"docs-diagrams-tech-lead-workspace~mapa-do-documento\">Mapa do documento</h2>\n<table>\n<thead>\n<tr>\n<th>Seção</th>\n<th>Responde</th>\n<th>Leia se você…</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-diagrams-tech-lead-workspace~1-objetivo\">1–2. Objetivo e estrutura</a></td>\n<td>Como a pasta é organizada</td>\n<td>vai criar o workspace</td>\n</tr>\n<tr>\n<td><a href=\"#docs-diagrams-tech-lead-workspace~3-responsabilidade-de-cada-área\">3. Responsabilidade de cada área</a></td>\n<td>O que entra em cada diretório</td>\n<td>está em dúvida sobre onde salvar algo</td>\n</tr>\n<tr>\n<td><a href=\"#docs-diagrams-tech-lead-workspace~4-board-e-work-items\">4. BOARD e Work Items</a></td>\n<td>Como o trabalho é rastreado</td>\n<td>vai operar o board</td>\n</tr>\n<tr>\n<td><a href=\"#docs-diagrams-tech-lead-workspace~5-workflow-multiagente\">5. Workflow multiagente</a></td>\n<td>Como as etapas se conectam ao workspace</td>\n<td>vai rodar um workflow aqui</td>\n</tr>\n<tr>\n<td><a href=\"#docs-diagrams-tech-lead-workspace~6-arquivos-fundamentais\">6. Arquivos fundamentais</a></td>\n<td>O conteúdo mínimo de cada arquivo-chave</td>\n<td>vai escrever <code>WORKSPACE.md</code> ou <code>AGENTS.md</code></td>\n</tr>\n<tr>\n<td><a href=\"#docs-diagrams-tech-lead-workspace~7-regras-de-fonte-de-verdade\">7–8. Fonte de verdade e convenções</a></td>\n<td>Onde está a verdade e como nomear as coisas</td>\n<td>vai automatizar algo sobre o workspace</td>\n</tr>\n<tr>\n<td><a href=\"#docs-diagrams-tech-lead-workspace~9-implantação-incremental\">9–10. Implantação</a></td>\n<td>Em que ordem adotar</td>\n<td>está começando</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Vizinhos:</strong> <a href=\"#docs-operating-model\">sistema operacional do trio humano</a> · <a href=\"#docs-agents-catalog\">catálogo de agentes</a> · <a href=\"#docs-operating-model-90-10\">modelo operacional 90/10</a> · <a href=\"#docs-workflows-readme\">workflows canônicos</a> · <a href=\"#docs-repo-harness\">repo harness</a>.</p>\n<p>Este documento organiza o trabalho <strong>fora</strong> do código. O que cada repositório carrega dentro de si — <code>AGENTS.md</code>, rules, hooks, <code>CODEOWNERS</code> e evidência — é o <a href=\"#docs-repo-harness\">repo harness</a>, e a fronteira entre os dois está definida lá.</p>\n<p>Uma implementação navegável deste contrato está em <a href=\"../workspaces/tech-lead/WORKSPACE.md\" class=\"ext\" title=\"workspaces/tech-lead/WORKSPACE.md — arquivo do repositório\"><code>workspaces/tech-lead/</code></a>. Os workflows reutilizáveis ficam no catálogo global; o workspace mantém apenas seus bindings locais e os artefatos de execução por projeto.</p>\n<hr>\n<h2 id=\"docs-diagrams-tech-lead-workspace~1-objetivo\">1. Objetivo</h2>\n<p>Organizar o contexto, o planejamento, a execução e o aprendizado de todos os projetos sob responsabilidade do Tech Lead em um único workspace, compartilhado pelos seus agentes.</p>\n<p>O modelo separa explicitamente seis coisas que costumam se misturar: conhecimento global válido para vários projetos, fonte de verdade de cada projeto, código-fonte e checkouts dos repositórios GitHub, coordenação do trabalho entre agentes, memória operacional, e a distinção entre aprendizado ainda candidato e conhecimento já validado.</p>\n<p>O princípio central é: <strong>o projeto é a unidade principal de organização do trabalho, enquanto o repositório é a unidade de organização do código</strong>. Um projeto pode envolver vários repositórios e um repositório pode atender mais de um projeto.</p>\n<h2 id=\"docs-diagrams-tech-lead-workspace~2-estrutura-recomendada\">2. Estrutura recomendada</h2>\n<pre><code class=\"language-text\">tech-lead/\n├── AGENTS.md\n├── WORKSPACE.md\n├── BOARD.md\n│\n├── docs/\n│   ├── portfolio/\n│   │   └── PROJECTS.md\n│   ├── standards/\n│   │   ├── architecture.md\n│   │   ├── coding.md\n│   │   ├── testing.md\n│   │   └── security.md\n│   ├── playbooks/\n│   │   ├── create-project.md\n│   │   ├── incident-response.md\n│   │   ├── release.md\n│   │   └── technical-discovery.md\n│   ├── workflows/\n│   │   └── README.md          # bindings locais para workflows canônicos\n│   └── templates/\n│       ├── adr.md\n│       ├── plan.md\n│       ├── spec.md\n│       ├── work-item.md\n│       └── handoff.md\n│\n├── projects/\n│   ├── README.md\n│   └── &lt;project-slug&gt;/\n│       ├── README.md\n│       ├── CONTEXT.md\n│       ├── STATUS.md\n│       │\n│       ├── product/\n│       │   ├── prd/\n│       │   ├── requirements/\n│       │   └── glossary.md\n│       │\n│       ├── ux/\n│       │   ├── research/\n│       │   ├── flows/\n│       │   └── handoffs/\n│       │\n│       ├── engineering/\n│       │   ├── architecture/\n│       │   ├── adr/\n│       │   ├── specs/\n│       │   ├── api/\n│       │   ├── diagrams/\n│       │   └── repositories.yaml\n│       │\n│       ├── plans/\n│       │   ├── active/\n│       │   ├── archive/\n│       │   └── assets/\n│       │       └── &lt;workflow&gt;/\n│       │           └── &lt;data&gt;-&lt;session-id&gt;/\n│       │\n│       ├── work-items/\n│       │   ├── WI-001.md\n│       │   ├── WI-002.md\n│       │   └── README.md\n│       │\n│       ├── execution/\n│       │   ├── handoffs/\n│       │   ├── reviews/\n│       │   └── evidence/\n│       │\n│       ├── LEARNINGS.md\n│       │   ├── candidates/\n│       │   └── accepted/\n│       │\n│       └── memory/\n│           ├── current-state.md\n│           ├── decisions-summary.md\n│           └── history/\n│\n├── repos/\n│   ├── README.md\n│   ├── registry.yaml\n│   ├── github/\n│   │   └── &lt;organization&gt;/\n│   │       └── &lt;repository&gt;/\n│   └── worktrees/\n│       └── &lt;organization&gt;/\n│           └── &lt;repository&gt;/\n│               └── &lt;work-item&gt;/\n│\n├── .coordination/\n│   ├── active/\n│   ├── handoffs/\n│   ├── blockers/\n│   └── inbox/\n│\n├── memory/\n│   ├── workspace.md\n│   ├── agents/\n│   └── history/\n│\n└── archive/\n</code></pre>\n<h2 id=\"docs-diagrams-tech-lead-workspace~3-responsabilidade-de-cada-área\">3. Responsabilidade de cada área</h2>\n<h3 id=\"docs-diagrams-tech-lead-workspace~31-docs--conhecimento-global\">3.1 <code>docs/</code> — conhecimento global</h3>\n<p>Armazena somente conteúdo aplicável a vários projetos:</p>\n<ul>\n<li>padrões de arquitetura, código, testes e segurança;</li>\n<li>playbooks operacionais;</li>\n<li>bindings locais para os <a href=\"#docs-workflows-readme\">workflows canônicos</a>, com versão, permissões e integrações autorizadas;</li>\n<li>templates;</li>\n<li>visão do portfólio.</li>\n</ul>\n<p>PRDs, specs e decisões específicas não devem ser duplicados aqui. Eles pertencem ao projeto correspondente.</p>\n<p>O diretório <code>docs/workflows/</code> não armazena saídas de execução. <code>PLAN.md</code>, <code>SPEC.md</code>, <code>ADR.md</code>, Work Items, reviews, evidence packs e handoffs persistentes pertencem a <code>projects/&lt;project&gt;/</code>; <code>coordination/</code> serve apenas para a comunicação transitória entre agentes.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~32-projectsproject-slug--fonte-de-verdade-do-projeto\">3.2 <code>projects/&lt;project-slug&gt;/</code> — fonte de verdade do projeto</h3>\n<p>Centraliza todo o material específico do projeto:</p>\n<ul>\n<li>contexto e status;</li>\n<li>PRDs e requisitos;</li>\n<li>pesquisa e especificações de UX;</li>\n<li>arquitetura, ADRs, APIs e specs técnicas;</li>\n<li>planos ativos e arquivados;</li>\n<li>itens de trabalho;</li>\n<li>handoffs, reviews e evidências;</li>\n<li>aprendizados e memória operacional do projeto.</li>\n</ul>\n<p>Um agente deve conseguir entrar nessa pasta e encontrar o contexto necessário sem pesquisar o workspace inteiro.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~33-repos--código-fonte-dos-repositórios-github\">3.3 <code>repos/</code> — código-fonte dos repositórios GitHub</h3>\n<p>Contém os clones locais dos repositórios usados pelos agentes. A organização recomendada preserva a identidade do GitHub:</p>\n<pre><code class=\"language-text\">repos/github/&lt;organization&gt;/&lt;repository&gt;/\n</code></pre>\n<p>Exemplo:</p>\n<pre><code class=\"language-text\">repos/github/acme/checkout-api/\nrepos/github/acme/checkout-web/\nrepos/github/acme/design-system/\n</code></pre>\n<p>O diretório <code>repos/</code> não substitui <code>projects/</code>:</p>\n<table>\n<thead>\n<tr>\n<th>Conceito</th>\n<th>Responsabilidade</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>projects/</code></td>\n<td>Por que, o que e quando será construído</td>\n</tr>\n<tr>\n<td><code>repos/</code></td>\n<td>Onde o código é implementado e versionado</td>\n</tr>\n<tr>\n<td>GitHub</td>\n<td>Remote oficial, colaboração, PRs, checks e releases</td>\n</tr>\n</tbody>\n</table>\n<p>Não devem existir clones duplicados dentro de cada projeto. A ligação é declarada em <code>projects/&lt;project&gt;/engineering/repositories.yaml</code>.</p>\n<p>Exemplo:</p>\n<pre><code class=\"language-yaml\">project: checkout\nrepositories:\n  - id: checkout-api\n    github: acme/checkout-api\n    local_path: repos/github/acme/checkout-api\n    role: backend\n    required: true\n  - id: checkout-web\n    github: acme/checkout-web\n    local_path: repos/github/acme/checkout-web\n    role: frontend\n    required: true\n  - id: design-system\n    github: acme/design-system\n    local_path: repos/github/acme/design-system\n    role: shared-library\n    required: false\n</code></pre>\n<h4 id=\"docs-diagrams-tech-lead-workspace~registro-global-de-repositórios\">Registro global de repositórios</h4>\n<p><code>repos/registry.yaml</code> é o inventário operacional dos clones disponíveis:</p>\n<pre><code class=\"language-yaml\">repositories:\n  - id: checkout-api\n    github: acme/checkout-api\n    local_path: repos/github/acme/checkout-api\n    default_branch: main\n    kind: service\n    projects:\n      - checkout\n    owner: payments-team\n    status: active\n</code></pre>\n<p>Esse registro deve armazenar metadados e relações, não informações voláteis como o SHA atual ou se o checkout está limpo. Estado Git deve ser consultado diretamente no repositório.</p>\n<h4 id=\"docs-diagrams-tech-lead-workspace~worktrees-para-agentes-concorrentes\">Worktrees para agentes concorrentes</h4>\n<p>O clone em <code>repos/github/</code> é a cópia canônica local. Quando mais de um agente precisar atuar no mesmo repositório, cada missão deve usar um worktree isolado:</p>\n<pre><code class=\"language-text\">repos/worktrees/&lt;organization&gt;/&lt;repository&gt;/&lt;work-item&gt;/\n</code></pre>\n<p>Exemplo:</p>\n<pre><code class=\"language-text\">repos/worktrees/acme/checkout-api/WI-031/\nrepos/worktrees/acme/checkout-api/WI-044/\n</code></pre>\n<p>O Work Item deve registrar <code>repository</code>, <code>worktree</code>, <code>branch</code> e <code>base_branch</code>. Worktrees encerrados devem ser removidos somente depois de confirmar que commits e evidências foram preservados.</p>\n<h4 id=\"docs-diagrams-tech-lead-workspace~cuidados-de-armazenamento-e-indexação\">Cuidados de armazenamento e indexação</h4>\n<p><code>repos/</code> deve permanecer em disco local confiável — pastas sincronizadas por serviços de nuvem podem corromper ou degradar <code>.git</code>, e a falha costuma aparecer tarde. Da indexação documental devem ficar de fora <code>.git/</code>, <code>node_modules/</code>, artefatos de build, caches e dependências.</p>\n<p>Segredos, arquivos <code>.env</code> e credenciais nunca são copiados para documentação, memória ou handoffs. Cada repositório mantém seu próprio <code>AGENTS.md</code>, README, regras de build e instruções locais, e <code>repos/README.md</code> explica como clonar, atualizar, criar worktrees e validar os repositórios deste workspace.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~34-plans--planejamento-dentro-do-projeto\">3.4 <code>plans/</code> — planejamento dentro do projeto</h3>\n<p>Planos globais perdem rapidamente a ligação com contexto, execução e evidências. Por isso, cada projeto possui:</p>\n<ul>\n<li><code>active/</code>: planos em elaboração ou execução;</li>\n<li><code>archive/</code>: planos concluídos, cancelados ou substituídos;</li>\n<li><code>assets/</code>: material bruto que sustenta análises e discussões do workflow — transcrições, printscreens, e-mails, PDFs, documentos Word e afins.</li>\n</ul>\n<p>Todo plano deve declarar projeto, status, responsável e Work Items relacionados.</p>\n<h4 id=\"docs-diagrams-tech-lead-workspace~plansassets--material-bruto-isolado-por-sessão\"><code>plans/assets/</code> — material bruto isolado por sessão</h4>\n<p>Cada execução de um workflow (intake, discovery, especificação técnica etc.) grava seu material bruto em uma pasta própria, para que uma nova tentativa nunca colida com a anterior:</p>\n<pre><code class=\"language-text\">plans/assets/&lt;workflow&gt;/&lt;YYYY-MM-DD&gt;-&lt;session-id&gt;/\n</code></pre>\n<ul>\n<li><code>&lt;workflow&gt;</code> identifica o workflow ou a skill que gerou o material, por exemplo <code>01-discovery-and-research</code> ou <code>technical-discovery</code>.</li>\n<li><code>&lt;session-id&gt;</code> é um identificador curto e único da execução (<code>mission_id</code> ou run id). Reexecutar um workflow por resultado insatisfatório cria uma nova pasta; a anterior permanece no histórico, mas deixa de ser referenciada.</li>\n<li>Dentro da pasta da sessão, use subpastas por tipo somente quando houver mais de um arquivo do mesmo tipo: <code>transcripts/</code>, <code>screenshots/</code>, <code>emails/</code>, <code>documents/</code>.</li>\n<li><code>plans/assets/</code> nunca é fonte canônica. A conclusão, decisão ou requisito extraído do material vai para o artefato do domínio correto (<code>product/</code>, <code>ux/</code>, <code>engineering/</code> ou o plano); o asset fica como rastro auditável, referenciado por caminho.</li>\n<li>O <code>STATUS.md</code> ou o Work Item correspondente deve indicar qual sessão de <code>plans/assets/</code> sustenta a versão vigente de um artefato quando isso não for óbvio.</li>\n</ul>\n<pre><code class=\"language-yaml\">---\nid: PLAN-014\nproject: checkout\nstatus: active\nowner: tech-lead\nwork_items:\n  - WI-031\n  - WI-032\nupdated_at: 2026-08-08\n---\n</code></pre>\n<h3 id=\"docs-diagrams-tech-lead-workspace~35-memory--memória-operacional\">3.5 <code>memory/</code> — memória operacional</h3>\n<p>A memória ajuda os agentes a continuar uma execução. Pode conter:</p>\n<ul>\n<li>estado observado;</li>\n<li>resumos de sessões;</li>\n<li>contexto temporário;</li>\n<li>comandos úteis;</li>\n<li>ponteiros para documentos oficiais.</li>\n</ul>\n<p>Memória não é fonte de verdade. Quando uma informação se torna durável, deve ser promovida:</p>\n<table>\n<thead>\n<tr>\n<th>Informação</th>\n<th>Destino oficial</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Decisão técnica</td>\n<td>ADR</td>\n</tr>\n<tr>\n<td>Requisito</td>\n<td>PRD ou spec</td>\n</tr>\n<tr>\n<td>Trabalho necessário</td>\n<td>Work Item</td>\n</tr>\n<tr>\n<td>Evidência de execução</td>\n<td><code>execution/evidence/</code></td>\n</tr>\n<tr>\n<td>Aprendizado validado</td>\n<td><code>LEARNINGS.md (aceitos)</code> ou <code>docs/</code></td>\n</tr>\n</tbody>\n</table>\n<p>A memória da raiz contém apenas informações do workspace. Memória específica permanece dentro do projeto.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~36-learningsmd--aprendizado-curado\">3.6 <code>LEARNINGS.md</code> — aprendizado curado</h3>\n<p>Possui dois estágios:</p>\n<ul>\n<li><code>candidates/</code>: observações ainda não confirmadas;</li>\n<li><code>accepted/</code>: aprendizados validados e reutilizáveis no projeto.</li>\n</ul>\n<p>Quando um aprendizado passa a valer para vários projetos, ele deve ser promovido para <code>docs/standards/</code> ou <code>docs/playbooks/</code>.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~37-coordination--comunicação-entre-agentes\">3.7 <code>coordination/</code> — comunicação entre agentes</h3>\n<p>Guarda somente coordenação transversal e temporária:</p>\n<ul>\n<li><code>active/</code>: missões em andamento e seus responsáveis;</li>\n<li><code>handoffs/</code>: passagem explícita de contexto entre agentes;</li>\n<li><code>blockers/</code>: impedimentos que precisam de resolução externa;</li>\n<li><code>inbox/</code>: entradas ainda não triadas.</li>\n</ul>\n<p>Depois da conclusão, o conteúdo durável deve ser incorporado ao projeto e o material transitório pode ser arquivado.</p>\n<h2 id=\"docs-diagrams-tech-lead-workspace~4-board-e-work-items\">4. BOARD e Work Items</h2>\n<p>O <code>BOARD.md</code> não deve ser o banco de dados principal. Vários agentes editando o mesmo arquivo aumentam o risco de conflito e sobrescrita.</p>\n<p>A fonte de verdade é um arquivo por Work Item:</p>\n<pre><code class=\"language-text\">projects/checkout/work-items/WI-031.md\n</code></pre>\n<h3 id=\"docs-diagrams-tech-lead-workspace~41-modelo-de-work-item\">4.1 Modelo de Work Item</h3>\n<pre><code class=\"language-markdown\">---\nid: WI-031\ntitle: Implementar idempotência no processamento do pagamento\nproject: checkout\nstatus: implementation\npriority: high\nowner: agent-backend\nreviewer: tech-lead\nrepositories:\n  - id: checkout-api\n    branch: feat/WI-031-payment-idempotency\n    base_branch: main\n    worktree: repos/worktrees/acme/checkout-api/WI-031\ndepends_on:\n  - WI-027\nblocked_by: []\nupdated_at: 2026-08-08T14:30:00-03:00\n---\n\n## Objetivo\n\nImpedir processamento duplicado de eventos de pagamento.\n\n## Critérios de aceite\n\n- [ ] Eventos repetidos não geram nova cobrança\n- [ ] Estado permanece consistente após retry\n- [ ] Testes cobrem concorrência e redelivery\n\n## Plano relacionado\n\n`PLAN-014`\n\n## Evidências\n\nPreencher durante a implementação.\n\n## Histórico\n\n- 2026-08-08: item refinado pelo agente de arquitetura.\n</code></pre>\n<h3 id=\"docs-diagrams-tech-lead-workspace~42-papel-do-boardmd\">4.2 Papel do <code>BOARD.md</code></h3>\n<p>O board da raiz oferece uma visão consolidada do portfólio:</p>\n<pre><code class=\"language-markdown\"># Board\n\n## Backlog\n\n- `WI-045` — checkout\n\n## Refinement\n\n- `WI-018` — identity\n\n## Ready\n\n- `WI-031` — checkout\n\n## Implementation\n\n- `WI-009` — catalog\n\n## Blocked\n\n- `WI-014` — identity — aguardando decisão de segurança\n\n## Review\n\n- `WI-028` — checkout\n\n## Done\n\n- `WI-007` — catalog\n</code></pre>\n<p>Idealmente, esse arquivo deve ser regenerável a partir do campo <code>status</code> dos Work Items. Para reduzir contenção, agentes atualizam seus próprios Work Items; um agente coordenador atualiza ou regenera o board.</p>\n<h2 id=\"docs-diagrams-tech-lead-workspace~5-workflow-multiagente\">5. Workflow multiagente</h2>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[&quot;Intake&quot;] --&gt; B[&quot;Refinement&quot;]\n    B --&gt; C[&quot;Ready&quot;]\n    C --&gt; D[&quot;Planning&quot;]\n    D --&gt; E[&quot;Implementation&quot;]\n    E --&gt; F[&quot;Technical Review&quot;]\n    F --&gt; G[&quot;Validation&quot;]\n    G --&gt; H[&quot;Done&quot;]\n\n    B --&gt; X[&quot;Blocked&quot;]\n    D --&gt; X\n    E --&gt; X\n    F --&gt; X\n    X --&gt; B</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[&quot;Intake&quot;] --&gt; B[&quot;Refinement&quot;]\n    B --&gt; C[&quot;Ready&quot;]\n    C --&gt; D[&quot;Planning&quot;]\n    D --&gt; E[&quot;Implementation&quot;]\n    E --&gt; F[&quot;Technical Review&quot;]\n    F --&gt; G[&quot;Validation&quot;]\n    G --&gt; H[&quot;Done&quot;]\n\n    B --&gt; X[&quot;Blocked&quot;]\n    D --&gt; X\n    E --&gt; X\n    F --&gt; X\n    X --&gt; B</code></pre></details></div>\n<h3 id=\"docs-diagrams-tech-lead-workspace~51-contrato-de-saída-por-etapa\">5.1 Contrato de saída por etapa</h3>\n<table>\n<thead>\n<tr>\n<th>Etapa</th>\n<th>Condição de saída</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Intake</td>\n<td>Work Item criado e associado a um projeto</td>\n</tr>\n<tr>\n<td>Refinement</td>\n<td>Escopo, critérios de aceite, risco e dependências definidos</td>\n</tr>\n<tr>\n<td>Ready</td>\n<td>Sem dúvida ou bloqueio relevante para iniciar</td>\n</tr>\n<tr>\n<td>Planning</td>\n<td>Plano técnico e divisão do trabalho registrados</td>\n</tr>\n<tr>\n<td>Implementation</td>\n<td>Artefatos produzidos e evidências coletadas</td>\n</tr>\n<tr>\n<td>Technical Review</td>\n<td>Revisão técnica registrada e pendências resolvidas</td>\n</tr>\n<tr>\n<td>Validation</td>\n<td>Critérios de aceite comprovados</td>\n</tr>\n<tr>\n<td>Done</td>\n<td>Resultado entregue e documentação atualizada</td>\n</tr>\n</tbody>\n</table>\n<p><code>Blocked</code> não é uma etapa normal: é um estado de exceção. Todo bloqueio deve informar causa, impacto, responsável pela resolução e próxima ação.</p>\n<h2 id=\"docs-diagrams-tech-lead-workspace~6-arquivos-fundamentais\">6. Arquivos fundamentais</h2>\n<h3 id=\"docs-diagrams-tech-lead-workspace~61-workspacemd\">6.1 <code>WORKSPACE.md</code></h3>\n<p>É a porta de entrada. Deve explicar:</p>\n<ul>\n<li>como navegar pelo workspace;</li>\n<li>quais são os projetos ativos;</li>\n<li>onde cada tipo de informação pertence;</li>\n<li>como iniciar e concluir uma missão;</li>\n<li>quais documentos são fontes de verdade.</li>\n</ul>\n<h3 id=\"docs-diagrams-tech-lead-workspace~62-agentsmd\">6.2 <code>AGENTS.md</code></h3>\n<p>Define regras obrigatórias para todos os agentes:</p>\n<ol>\n<li>Ler <code>WORKSPACE.md</code> e o <code>AGENTS.md</code> aplicável.</li>\n<li>Ler <code>CONTEXT.md</code> e <code>STATUS.md</code> antes de atuar em um projeto.</li>\n<li>Consultar <code>engineering/repositories.yaml</code> para localizar os repositórios envolvidos.</li>\n<li>Ler o <code>AGENTS.md</code> e as instruções locais de cada repositório antes de alterar código.</li>\n<li>Criar ou assumir um Work Item antes de modificar artefatos.</li>\n<li>Declarar repositório, branch, worktree e escopo da mudança.</li>\n<li>Verificar o estado Git e preservar alterações preexistentes.</li>\n<li>Não sobrescrever trabalho de outro agente.</li>\n<li>Registrar decisões, validações e evidências.</li>\n<li>Produzir handoff explícito ao trocar de agente.</li>\n<li>Não transformar memória temporária em fonte de verdade.</li>\n<li>Não marcar um item como concluído sem comprovar os critérios de aceite.</li>\n</ol>\n<h3 id=\"docs-diagrams-tech-lead-workspace~63-projectsprojectcontextmd\">6.3 <code>projects/&lt;project&gt;/CONTEXT.md</code></h3>\n<p>Explica o projeto de forma relativamente estável:</p>\n<ul>\n<li>problema e objetivo;</li>\n<li>usuários e stakeholders;</li>\n<li>limites de escopo;</li>\n<li>arquitetura atual;</li>\n<li>sistemas e repositórios relacionados;</li>\n<li>glossário e restrições relevantes.</li>\n</ul>\n<h3 id=\"docs-diagrams-tech-lead-workspace~64-projectsprojectstatusmd\">6.4 <code>projects/&lt;project&gt;/STATUS.md</code></h3>\n<p>É um resumo executivo curto e atual:</p>\n<pre><code class=\"language-markdown\"># Status\n\n- Fase: implementação\n- Objetivo atual: tornar pagamentos idempotentes\n- Plano ativo: `PLAN-014`\n- Itens em execução: `WI-031`, `WI-032`\n- Bloqueios: definição do prazo de retenção\n- Última atualização: 2026-08-08\n</code></pre>\n<h2 id=\"docs-diagrams-tech-lead-workspace~7-regras-de-fonte-de-verdade\">7. Regras de fonte de verdade</h2>\n<table>\n<thead>\n<tr>\n<th>Assunto</th>\n<th>Fonte de verdade</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Prioridade entre projetos</td>\n<td><code>BOARD.md</code> e <code>docs/portfolio/PROJECTS.md</code></td>\n</tr>\n<tr>\n<td>Contexto de um projeto</td>\n<td><code>projects/&lt;project&gt;/CONTEXT.md</code></td>\n</tr>\n<tr>\n<td>Estado atual do projeto</td>\n<td><code>projects/&lt;project&gt;/STATUS.md</code></td>\n</tr>\n<tr>\n<td>Requisito de produto</td>\n<td><code>product/prd/</code> ou <code>product/requirements/</code></td>\n</tr>\n<tr>\n<td>Experiência do usuário</td>\n<td><code>ux/</code></td>\n</tr>\n<tr>\n<td>Decisão arquitetural</td>\n<td><code>engineering/adr/</code></td>\n</tr>\n<tr>\n<td>Especificação técnica</td>\n<td><code>engineering/specs/</code></td>\n</tr>\n<tr>\n<td>Relação entre projeto e repositórios</td>\n<td><code>projects/&lt;project&gt;/engineering/repositories.yaml</code></td>\n</tr>\n<tr>\n<td>Inventário dos clones locais</td>\n<td><code>repos/registry.yaml</code></td>\n</tr>\n<tr>\n<td>Código-fonte e estado do checkout</td>\n<td>repositório em <code>repos/github/</code> ou worktree ativo</td>\n</tr>\n<tr>\n<td>Remote, PRs, checks e releases</td>\n<td>GitHub</td>\n</tr>\n<tr>\n<td>Estratégia de execução</td>\n<td><code>plans/active/</code></td>\n</tr>\n<tr>\n<td>Material bruto de uma sessão de workflow</td>\n<td><code>plans/assets/&lt;workflow&gt;/&lt;data&gt;-&lt;session-id&gt;/</code> (não autoritativo)</td>\n</tr>\n<tr>\n<td>Estado de uma unidade de trabalho</td>\n<td>arquivo em <code>work-items/</code></td>\n</tr>\n<tr>\n<td>Prova de conclusão</td>\n<td><code>execution/evidence/</code></td>\n</tr>\n<tr>\n<td>Contexto temporário do agente</td>\n<td><code>memory/</code></td>\n</tr>\n</tbody>\n</table>\n<p>Uma informação não deve existir como conteúdo autoritativo em dois locais. Arquivos de resumo devem apontar para a fonte original.</p>\n<h2 id=\"docs-diagrams-tech-lead-workspace~8-convenções-operacionais\">8. Convenções operacionais</h2>\n<h3 id=\"docs-diagrams-tech-lead-workspace~81-identificadores\">8.1 Identificadores</h3>\n<p>Identificadores estáveis são o que permite automatizar qualquer coisa sobre o workspace.</p>\n<table>\n<thead>\n<tr>\n<th>Entidade</th>\n<th>Formato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Projeto</td>\n<td>slug estável, por exemplo <code>checkout</code></td>\n</tr>\n<tr>\n<td>Plano</td>\n<td><code>PLAN-NNN</code></td>\n</tr>\n<tr>\n<td>Work Item</td>\n<td><code>WI-NNN</code></td>\n</tr>\n<tr>\n<td>ADR</td>\n<td><code>ADR-NNN</code></td>\n</tr>\n<tr>\n<td>Handoff</td>\n<td><code>HANDOFF-&lt;work-item&gt;-&lt;origem&gt;-&lt;destino&gt;.md</code></td>\n</tr>\n</tbody>\n</table>\n<p>Quando identificadores puderem colidir entre projetos, use o prefixo do projeto — <code>CHK-WI-031</code>.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~82-estados-permitidos\">8.2 Estados permitidos</h3>\n<pre><code class=\"language-text\">backlog\nrefinement\nready\nplanning\nimplementation\nreview\nvalidation\nblocked\ndone\ncancelled\n</code></pre>\n<p>Os valores devem ser estáveis e escritos sempre da mesma forma para permitir automação.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~83-handoff-mínimo\">8.3 Handoff mínimo</h3>\n<p>Um handoff que não permite ao receptor retomar sozinho o trabalho não é um handoff — é um pedido de reunião. O conteúdo mínimo:</p>\n<table>\n<thead>\n<tr>\n<th>Bloco</th>\n<th>Registra</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Identificação</td>\n<td>missão e Work Item; agente ou papel de destino</td>\n</tr>\n<tr>\n<td>Código</td>\n<td>repositórios, branches, worktrees e commits envolvidos; arquivos alterados</td>\n</tr>\n<tr>\n<td>Resultado</td>\n<td>o que foi feito; decisões tomadas; evidências disponíveis</td>\n</tr>\n<tr>\n<td>Continuidade</td>\n<td>pendências e riscos; próxima ação esperada</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-diagrams-tech-lead-workspace~84-concorrência-entre-agentes\">8.4 Concorrência entre agentes</h3>\n<p>O risco em um workspace multiagente é a sobrescrita silenciosa. As regras abaixo existem para tornar cada conflito visível antes que ele destrua trabalho.</p>\n<p><strong>Sobre responsabilidade.</strong> Cada missão ativa tem um único agente responsável, com responsabilidade e horário de início registrados no Work Item. Dois agentes não editam simultaneamente o mesmo artefato sem divisão explícita.</p>\n<p><strong>Sobre o código.</strong> Agentes concorrentes no mesmo repositório usam branches e worktrees separados por Work Item, e alterações locais preexistentes nunca são descartadas ou incorporadas sem autorização.</p>\n<p><strong>Sobre o registro.</strong> O board é consolidado por um coordenador, não editado livremente por todos, e achados transitórios ficam em arquivos separados — um grande arquivo compartilhado de anotações vira ponto de conflito garantido.</p>\n<h2 id=\"docs-diagrams-tech-lead-workspace~9-implantação-incremental\">9. Implantação incremental</h2>\n<h3 id=\"docs-diagrams-tech-lead-workspace~fase-1--contrato-mínimo\">Fase 1 — contrato mínimo</h3>\n<p>Criar somente:</p>\n<pre><code class=\"language-text\">AGENTS.md\nWORKSPACE.md\nBOARD.md\nrepos/\n├── README.md\n├── registry.yaml\n└── github/&lt;organization&gt;/&lt;repository&gt;/\nprojects/&lt;piloto&gt;/\n├── README.md\n├── CONTEXT.md\n├── STATUS.md\n├── engineering/repositories.yaml\n├── plans/active/\n├── work-items/\n└── execution/evidence/\n</code></pre>\n<h3 id=\"docs-diagrams-tech-lead-workspace~fase-2--templates-e-coordenação\">Fase 2 — templates e coordenação</h3>\n<p>Torna o contrato repetível. Adicione templates de plano, ADR, Work Item e handoff; introduza <code>.coordination/</code>; padronize metadados, estados, branches e worktrees por Work Item. Valide o resultado com um projeto real antes de seguir.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~fase-3--memória-e-aprendizado\">Fase 3 — memória e aprendizado</h3>\n<p>Introduz o que sobrevive entre missões: memória por projeto, o fluxo <code>candidate → accepted → promoted</code> para aprendizados, e a política de retenção e arquivamento de contexto temporário.</p>\n<h3 id=\"docs-diagrams-tech-lead-workspace~fase-4--automação\">Fase 4 — automação</h3>\n<p>Só faz sentido depois que as três fases anteriores produzirem dados consistentes. As verificações automáticas se dividem em três frentes:</p>\n<table>\n<thead>\n<tr>\n<th>Frente</th>\n<th>Verifica</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Consolidação</strong></td>\n<td>regenerar <code>BOARD.md</code> a partir dos Work Items; gerar relatórios de status e bloqueios</td>\n</tr>\n<tr>\n<td><strong>Integridade</strong></td>\n<td>itens sem owner, critérios ou evidências; links e identificadores; divergências entre <code>registry.yaml</code>, projetos e clones</td>\n</tr>\n<tr>\n<td><strong>Higiene</strong></td>\n<td>worktrees órfãos e branches sem Work Item relacionado; memória com decisão ainda não promovida</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"docs-diagrams-tech-lead-workspace~10-decisão-recomendada\">10. Decisão recomendada</h2>\n<p>Adotar <code>projects/&lt;project&gt;/</code> como unidade central do trabalho, mover <code>plans/</code> para dentro de cada projeto e usar <code>repos/</code> como localização canônica dos checkouts de código.</p>\n<p>Manter na raiz apenas elementos transversais:</p>\n<ul>\n<li><code>docs/</code>: conhecimento global curado;</li>\n<li><code>repos/</code>: repositórios GitHub e worktrees locais;</li>\n<li><code>.coordination/</code>: comunicação temporária entre agentes;</li>\n<li><code>memory/</code>: memória do workspace;</li>\n<li><code>BOARD.md</code>: visão consolidada do portfólio;</li>\n<li><code>archive/</code>: material global desativado.</li>\n</ul>\n<p>Essa divisão separa claramente documentação, planejamento e código; reduz duplicidade; melhora a navegação; limita conflitos entre agentes; e torna explícita a fonte de verdade de cada informação.</p>", "toc": [{"level": 2, "id": "docs-diagrams-tech-lead-workspace~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~mapa-do-documento", "text": "Mapa do documento"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~1-objetivo", "text": "1. Objetivo"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~2-estrutura-recomendada", "text": "2. Estrutura recomendada"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~3-responsabilidade-de-cada-área", "text": "3. Responsabilidade de cada área"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~31-docs--conhecimento-global", "text": "3.1 docs/ — conhecimento global"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~32-projectsproject-slug--fonte-de-verdade-do-projeto", "text": "3.2 projects/&lt;project-slug&gt;/ — fonte de verdade do projeto"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~33-repos--código-fonte-dos-repositórios-github", "text": "3.3 repos/ — código-fonte dos repositórios GitHub"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~34-plans--planejamento-dentro-do-projeto", "text": "3.4 plans/ — planejamento dentro do projeto"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~35-memory--memória-operacional", "text": "3.5 memory/ — memória operacional"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~36-learningsmd--aprendizado-curado", "text": "3.6 LEARNINGS.md — aprendizado curado"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~37-coordination--comunicação-entre-agentes", "text": "3.7 coordination/ — comunicação entre agentes"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~4-board-e-work-items", "text": "4. BOARD e Work Items"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~41-modelo-de-work-item", "text": "4.1 Modelo de Work Item"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~42-papel-do-boardmd", "text": "4.2 Papel do BOARD.md"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~5-workflow-multiagente", "text": "5. Workflow multiagente"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~51-contrato-de-saída-por-etapa", "text": "5.1 Contrato de saída por etapa"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~6-arquivos-fundamentais", "text": "6. Arquivos fundamentais"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~61-workspacemd", "text": "6.1 WORKSPACE.md"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~62-agentsmd", "text": "6.2 AGENTS.md"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~63-projectsprojectcontextmd", "text": "6.3 projects/&lt;project&gt;/CONTEXT.md"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~64-projectsprojectstatusmd", "text": "6.4 projects/&lt;project&gt;/STATUS.md"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~7-regras-de-fonte-de-verdade", "text": "7. Regras de fonte de verdade"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~8-convenções-operacionais", "text": "8. Convenções operacionais"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~81-identificadores", "text": "8.1 Identificadores"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~82-estados-permitidos", "text": "8.2 Estados permitidos"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~83-handoff-mínimo", "text": "8.3 Handoff mínimo"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~84-concorrência-entre-agentes", "text": "8.4 Concorrência entre agentes"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~9-implantação-incremental", "text": "9. Implantação incremental"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~fase-1--contrato-mínimo", "text": "Fase 1 — contrato mínimo"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~fase-2--templates-e-coordenação", "text": "Fase 2 — templates e coordenação"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~fase-3--memória-e-aprendizado", "text": "Fase 3 — memória e aprendizado"}, {"level": 3, "id": "docs-diagrams-tech-lead-workspace~fase-4--automação", "text": "Fase 4 — automação"}, {"level": 2, "id": "docs-diagrams-tech-lead-workspace~10-decisão-recomendada", "text": "10. Decisão recomendada"}], "text": " agent team — workspace do tech lead como organizar em disco o contexto, o planejamento, a execução e o aprendizado de vários projetos operados por múltiplos agentes ao mesmo tempo. em 2 minutos quando vários agentes trabalham em paralelo sobre os mesmos projetos, o problema deixa de ser \"onde guardo este arquivo\" e passa a ser \"qual dos três lugares onde este dado aparece é o verdadeiro\". sem uma resposta explícita, agentes começam a divergir silenciosamente e o trabalho se corrompe sem que ninguém perceba. este documento resolve isso com uma separação: o projeto é a unidade de organização do trabalho; o repositório é a unidade de organização do código . um projeto pode envolver vários repositórios, e um repositório pode servir a mais de um projeto. a partir daí, cada tipo de informação tem exatamente um dono declarado na tabela de fonte de verdade . área guarda não guarda docs/ conhecimento válido para vários projetos: padrões, playbooks, templates, portfólio prds, specs e decisões de um projeto projects/&lt;slug&gt;/ tudo que é específico do projeto, do contexto às evidências código-fonte repos/ clones locais e worktrees, espelhando a identidade do github artefatos de planejamento plans/ estratégia de execução e material bruto de sessão conclusões canônicas memory/ contexto operacional temporário do agente conhecimento validado coordination/ comunicação transitória entre agentes qualquer coisa persistente duas regras derivam disso e valem para qualquer agente: uma informação nunca é autoritativa em dois lugares, e resumos apontam para a fonte original em vez de reproduzi-la. mapa do documento seção responde leia se você… 1–2. objetivo e estrutura como a pasta é organizada vai criar o workspace 3. responsabilidade de cada área o que entra em cada diretório está em dúvida sobre onde salvar algo 4. board e work items como o trabalho é rastreado vai operar o board 5. workflow multiagente como as etapas se conectam ao workspace vai rodar um workflow aqui 6. arquivos fundamentais o conteúdo mínimo de cada arquivo-chave vai escrever workspace.md ou agents.md 7–8. fonte de verdade e convenções onde está a verdade e como nomear as coisas vai automatizar algo sobre o workspace 9–10. implantação em que ordem adotar está começando vizinhos: sistema operacional do trio humano · catálogo de agentes · modelo operacional 90/10 · workflows canônicos · repo harness . este documento organiza o trabalho fora do código. o que cada repositório carrega dentro de si — agents.md , rules, hooks, codeowners e evidência — é o repo harness , e a fronteira entre os dois está definida lá. uma implementação navegável deste contrato está em workspaces/tech-lead/ . os workflows reutilizáveis ficam no catálogo global; o workspace mantém apenas seus bindings locais e os artefatos de execução por projeto. 1. objetivo organizar o contexto, o planejamento, a execução e o aprendizado de todos os projetos sob responsabilidade do tech lead em um único workspace, compartilhado pelos seus agentes. o modelo separa explicitamente seis coisas que costumam se misturar: conhecimento global válido para vários projetos, fonte de verdade de cada projeto, código-fonte e checkouts dos repositórios github, coordenação do trabalho entre agentes, memória operacional, e a distinção entre aprendizado ainda candidato e conhecimento já validado. o princípio central é: o projeto é a unidade principal de organização do trabalho, enquanto o repositório é a unidade de organização do código . um projeto pode envolver vários repositórios e um repositório pode atender mais de um projeto. 2. estrutura recomendada tech-lead/ ├── agents.md ├── workspace.md ├── board.md │ ├── docs/ │ ├── portfolio/ │ │ └── projects.md │ ├── standards/ │ │ ├── architecture.md │ │ ├── coding.md │ │ ├── testing.md │ │ └── security.md │ ├── playbooks/ │ │ ├── create-project.md │ │ ├── incident-response.md │ │ ├── release.md │ │ └── technical-discovery.md │ ├── workflows/ │ │ └── readme.md # bindings locais para workflows canônicos │ └── templates/ │ ├── adr.md │ ├── plan.md │ ├── spec.md │ ├── work-item.md │ └── handoff.md │ ├── projects/ │ ├── readme.md │ └── &lt;project-slug&gt;/ │ ├── readme.md │ ├── context.md │ ├── status.md │ │ │ ├── product/ │ │ ├── prd/ │ │ ├── requirements/ │ │ └── glossary.md │ │ │ ├── ux/ │ │ ├── research/ │ │ ├── flows/ │ │ └── handoffs/ │ │ │ ├── engineering/ │ │ ├── architecture/ │ │ ├── adr/ │ │ ├── specs/ │ │ ├── api/ │ │ ├── diagrams/ │ │ └── repositories.yaml │ │ │ ├── plans/ │ │ ├── active/ │ │ ├── archive/ │ │ └── assets/ │ │ └── &lt;workflow&gt;/ │ │ └── &lt;data&gt;-&lt;session-id&gt;/ │ │ │ ├── work-items/ │ │ ├── wi-001.md │ │ ├── wi-002.md │ │ └── readme.md │ │ │ ├── execution/ │ │ ├── handoffs/ │ │ ├── reviews/ │ │ └── evidence/ │ │ │ ├── learnings.md │ │ ├── candidates/ │ │ └── accepted/ │ │ │ └── memory/ │ ├── current-state.md │ ├── decisions-summary.md │ └── history/ │ ├── repos/ │ ├── readme.md │ ├── registry.yaml │ ├── github/ │ │ └── &lt;organization&gt;/ │ │ └── &lt;repository&gt;/ │ └── worktrees/ │ └── &lt;organization&gt;/ │ └── &lt;repository&gt;/ │ └── &lt;work-item&gt;/ │ ├── .coordination/ │ ├── active/ │ ├── handoffs/ │ ├── blockers/ │ └── inbox/ │ ├── memory/ │ ├── workspace.md │ ├── agents/ │ └── history/ │ └── archive/ 3. responsabilidade de cada área 3.1 docs/ — conhecimento global armazena somente conteúdo aplicável a vários projetos: padrões de arquitetura, código, testes e segurança; playbooks operacionais; bindings locais para os workflows canônicos , com versão, permissões e integrações autorizadas; templates; visão do portfólio. prds, specs e decisões específicas não devem ser duplicados aqui. eles pertencem ao projeto correspondente. o diretório docs/workflows/ não armazena saídas de execução. plan.md , spec.md , adr.md , work items, reviews, evidence packs e handoffs persistentes pertencem a projects/&lt;project&gt;/ ; coordination/ serve apenas para a comunicação transitória entre agentes. 3.2 projects/&lt;project-slug&gt;/ — fonte de verdade do projeto centraliza todo o material específico do projeto: contexto e status; prds e requisitos; pesquisa e especificações de ux; arquitetura, adrs, apis e specs técnicas; planos ativos e arquivados; itens de trabalho; handoffs, reviews e evidências; aprendizados e memória operacional do projeto. um agente deve conseguir entrar nessa pasta e encontrar o contexto necessário sem pesquisar o workspace inteiro. 3.3 repos/ — código-fonte dos repositórios github contém os clones locais dos repositórios usados pelos agentes. a organização recomendada preserva a identidade do github: repos/github/&lt;organization&gt;/&lt;repository&gt;/ exemplo: repos/github/acme/checkout-api/ repos/github/acme/checkout-web/ repos/github/acme/design-system/ o diretório repos/ não substitui projects/ : conceito responsabilidade projects/ por que, o que e quando será construído repos/ onde o código é implementado e versionado github remote oficial, colaboração, prs, checks e releases não devem existir clones duplicados dentro de cada projeto. a ligação é declarada em projects/&lt;project&gt;/engineering/repositories.yaml . exemplo: project: checkout repositories: - id: checkout-api github: acme/checkout-api local_path: repos/github/acme/checkout-api role: backend required: true - id: checkout-web github: acme/checkout-web local_path: repos/github/acme/checkout-web role: frontend required: true - id: design-system github: acme/design-system local_path: repos/github/acme/design-system role: shared-library required: false registro global de repositórios repos/registry.yaml é o inventário operacional dos clones disponíveis: repositories: - id: checkout-api github: acme/checkout-api local_path: repos/github/acme/checkout-api default_branch: main kind: service projects: - checkout owner: payments-team status: active esse registro deve armazenar metadados e relações, não informações voláteis como o sha atual ou se o checkout está limpo. estado git deve ser consultado diretamente no repositório. worktrees para agentes concorrentes o clone em repos/github/ é a cópia canônica local. quando mais de um agente precisar atuar no mesmo repositório, cada missão deve usar um worktree isolado: repos/worktrees/&lt;organization&gt;/&lt;repository&gt;/&lt;work-item&gt;/ exemplo: repos/worktrees/acme/checkout-api/wi-031/ repos/worktrees/acme/checkout-api/wi-044/ o work item deve registrar repository , worktree , branch e base_branch . worktrees encerrados devem ser removidos somente depois de confirmar que commits e evidências foram preservados. cuidados de armazenamento e indexação repos/ deve permanecer em disco local confiável — pastas sincronizadas por serviços de nuvem podem corromper ou degradar .git , e a falha costuma aparecer tarde. da indexação documental devem ficar de fora .git/ , node_modules/ , artefatos de build, caches e dependências. segredos, arquivos .env e credenciais nunca são copiados para documentação, memória ou handoffs. cada repositório mantém seu próprio agents.md , readme, regras de build e instruções locais, e repos/readme.md explica como clonar, atualizar, criar worktrees e validar os repositórios deste workspace. 3.4 plans/ — planejamento dentro do projeto planos globais perdem rapidamente a ligação com contexto, execução e evidências. por isso, cada projeto possui: active/ : planos em elaboração ou execução; archive/ : planos concluídos, cancelados ou substituídos; assets/ : material bruto que sustenta análises e discussões do workflow — transcrições, printscreens, e-mails, pdfs, documentos word e afins. todo plano deve declarar projeto, status, responsável e work items relacionados. plans/assets/ — material bruto isolado por sessão cada execução de um workflow (intake, discovery, especificação técnica etc.) grava seu material bruto em uma pasta própria, para que uma nova tentativa nunca colida com a anterior: plans/assets/&lt;workflow&gt;/&lt;yyyy-mm-dd&gt;-&lt;session-id&gt;/ &lt;workflow&gt; identifica o workflow ou a skill que gerou o material, por exemplo 01-discovery-and-research ou technical-discovery . &lt;session-id&gt; é um identificador curto e único da execução ( mission_id ou run id). reexecutar um workflow por resultado insatisfatório cria uma nova pasta; a anterior permanece no histórico, mas deixa de ser referenciada. dentro da pasta da sessão, use subpastas por tipo somente quando houver mais de um arquivo do mesmo tipo: transcripts/ , screenshots/ , emails/ , documents/ . plans/assets/ nunca é fonte canônica. a conclusão, decisão ou requisito extraído do material vai para o artefato do domínio correto ( product/ , ux/ , engineering/ ou o plano); o asset fica como rastro auditável, referenciado por caminho. o status.md ou o work item correspondente deve indicar qual sessão de plans/assets/ sustenta a versão vigente de um artefato quando isso não for óbvio. --- id: plan-014 project: checkout status: active owner: tech-lead work_items: - wi-031 - wi-032 updated_at: 2026-08-08 --- 3.5 memory/ — memória operacional a memória ajuda os agentes a continuar uma execução. pode conter: estado observado; resumos de sessões; contexto temporário; comandos úteis; ponteiros para documentos oficiais. memória não é fonte de verdade. quando uma informação se torna durável, deve ser promovida: informação destino oficial decisão técnica adr requisito prd ou spec trabalho necessário work item evidência de execução execution/evidence/ aprendizado validado learnings.md (aceitos) ou docs/ a memória da raiz contém apenas informações do workspace. memória específica permanece dentro do projeto. 3.6 learnings.md — aprendizado curado possui dois estágios: candidates/ : observações ainda não confirmadas; accepted/ : aprendizados validados e reutilizáveis no projeto. quando um aprendizado passa a valer para vários projetos, ele deve ser promovido para docs/standards/ ou docs/playbooks/ . 3.7 coordination/ — comunicação entre agentes guarda somente coordenação transversal e temporária: active/ : missões em andamento e seus responsáveis; handoffs/ : passagem explícita de contexto entre agentes; blockers/ : impedimentos que precisam de resolução externa; inbox/ : entradas ainda não triadas. depois da conclusão, o conteúdo durável deve ser incorporado ao projeto e o material transitório pode ser arquivado. 4. board e work items o board.md não deve ser o banco de dados principal. vários agentes editando o mesmo arquivo aumentam o risco de conflito e sobrescrita. a fonte de verdade é um arquivo por work item: projects/checkout/work-items/wi-031.md 4.1 modelo de work item --- id: wi-031 title: implementar idempotência no processamento do pagamento project: checkout status: implementation priority: high owner: agent-backend reviewer: tech-lead repositories: - id: checkout-api branch: feat/wi-031-payment-idempotency base_branch: main worktree: repos/worktrees/acme/checkout-api/wi-031 depends_on: - wi-027 blocked_by: [] updated_at: 2026-08-08t14:30:00-03:00 --- ## objetivo impedir processamento duplicado de eventos de pagamento. ## critérios de aceite - [ ] eventos repetidos não geram nova cobrança - [ ] estado permanece consistente após retry - [ ] testes cobrem concorrência e redelivery ## plano relacionado `plan-014` ## evidências preencher durante a implementação. ## histórico - 2026-08-08: item refinado pelo agente de arquitetura. 4.2 papel do board.md o board da raiz oferece uma visão consolidada do portfólio: # board ## backlog - `wi-045` — checkout ## refinement - `wi-018` — identity ## ready - `wi-031` — checkout ## implementation - `wi-009` — catalog ## blocked - `wi-014` — identity — aguardando decisão de segurança ## review - `wi-028` — checkout ## done - `wi-007` — catalog idealmente, esse arquivo deve ser regenerável a partir do campo status dos work items. para reduzir contenção, agentes atualizam seus próprios work items; um agente coordenador atualiza ou regenera o board. 5. workflow multiagente − ajustado + ajustar flowchart lr a[&quot;intake&quot;] --&gt; b[&quot;refinement&quot;] b --&gt; c[&quot;ready&quot;] c --&gt; d[&quot;planning&quot;] d --&gt; e[&quot;implementation&quot;] e --&gt; f[&quot;technical review&quot;] f --&gt; g[&quot;validation&quot;] g --&gt; h[&quot;done&quot;] b --&gt; x[&quot;blocked&quot;] d --&gt; x e --&gt; x f --&gt; x x --&gt; b ver código do diagrama flowchart lr a[&quot;intake&quot;] --&gt; b[&quot;refinement&quot;] b --&gt; c[&quot;ready&quot;] c --&gt; d[&quot;planning&quot;] d --&gt; e[&quot;implementation&quot;] e --&gt; f[&quot;technical review&quot;] f --&gt; g[&quot;validation&quot;] g --&gt; h[&quot;done&quot;] b --&gt; x[&quot;blocked&quot;] d --&gt; x e --&gt; x f --&gt; x x --&gt; b 5.1 contrato de saída por etapa etapa condição de saída intake work item criado e associado a um projeto refinement escopo, critérios de aceite, risco e dependências definidos ready sem dúvida ou bloqueio relevante para iniciar planning plano técnico e divisão do trabalho registrados implementation artefatos produzidos e evidências coletadas technical review revisão técnica registrada e pendências resolvidas validation critérios de aceite comprovados done resultado entregue e documentação atualizada blocked não é uma etapa normal: é um estado de exceção. todo bloqueio deve informar causa, impacto, responsável pela resolução e próxima ação. 6. arquivos fundamentais 6.1 workspace.md é a porta de entrada. deve explicar: como navegar pelo workspace; quais são os projetos ativos; onde cada tipo de informação pertence; como iniciar e concluir uma missão; quais documentos são fontes de verdade. 6.2 agents.md define regras obrigatórias para todos os agentes: ler workspace.md e o agents.md aplicável. ler context.md e status.md antes de atuar em um projeto. consultar engineering/repositories.yaml para localizar os repositórios envolvidos. ler o agents.md e as instruções locais de cada repositório antes de alterar código. criar ou assumir um work item antes de modificar artefatos. declarar repositório, branch, worktree e escopo da mudança. verificar o estado git e preservar alterações preexistentes. não sobrescrever trabalho de outro agente. registrar decisões, validações e evidências. produzir handoff explícito ao trocar de agente. não transformar memória temporária em fonte de verdade. não marcar um item como concluído sem comprovar os critérios de aceite. 6.3 projects/&lt;project&gt;/context.md explica o projeto de forma relativamente estável: problema e objetivo; usuários e stakeholders; limites de escopo; arquitetura atual; sistemas e repositórios relacionados; glossário e restrições relevantes. 6.4 projects/&lt;project&gt;/status.md é um resumo executivo curto e atual: # status - fase: implementação - objetivo atual: tornar pagamentos idempotentes - plano ativo: `plan-014` - itens em execução: `wi-031`, `wi-032` - bloqueios: definição do prazo de retenção - última atualização: 2026-08-08 7. regras de fonte de verdade assunto fonte de verdade prioridade entre projetos board.md e docs/portfolio/projects.md contexto de um projeto projects/&lt;project&gt;/context.md estado atual do projeto projects/&lt;project&gt;/status.md requisito de produto product/prd/ ou product/requirements/ experiência do usuário ux/ decisão arquitetural engineering/adr/ especificação técnica engineering/specs/ relação entre projeto e repositórios projects/&lt;project&gt;/engineering/repositories.yaml inventário dos clones locais repos/registry.yaml código-fonte e estado do checkout repositório em repos/github/ ou worktree ativo remote, prs, checks e releases github estratégia de execução plans/active/ material bruto de uma sessão de workflow plans/assets/&lt;workflow&gt;/&lt;data&gt;-&lt;session-id&gt;/ (não autoritativo) estado de uma unidade de trabalho arquivo em work-items/ prova de conclusão execution/evidence/ contexto temporário do agente memory/ uma informação não deve existir como conteúdo autoritativo em dois locais. arquivos de resumo devem apontar para a fonte original. 8. convenções operacionais 8.1 identificadores identificadores estáveis são o que permite automatizar qualquer coisa sobre o workspace. entidade formato projeto slug estável, por exemplo checkout plano plan-nnn work item wi-nnn adr adr-nnn handoff handoff-&lt;work-item&gt;-&lt;origem&gt;-&lt;destino&gt;.md quando identificadores puderem colidir entre projetos, use o prefixo do projeto — chk-wi-031 . 8.2 estados permitidos backlog refinement ready planning implementation review validation blocked done cancelled os valores devem ser estáveis e escritos sempre da mesma forma para permitir automação. 8.3 handoff mínimo um handoff que não permite ao receptor retomar sozinho o trabalho não é um handoff — é um pedido de reunião. o conteúdo mínimo: bloco registra identificação missão e work item; agente ou papel de destino código repositórios, branches, worktrees e commits envolvidos; arquivos alterados resultado o que foi feito; decisões tomadas; evidências disponíveis continuidade pendências e riscos; próxima ação esperada 8.4 concorrência entre agentes o risco em um workspace multiagente é a sobrescrita silenciosa. as regras abaixo existem para tornar cada conflito visível antes que ele destrua trabalho. sobre responsabilidade. cada missão ativa tem um único agente responsável, com responsabilidade e horário de início registrados no work item. dois agentes não editam simultaneamente o mesmo artefato sem divisão explícita. sobre o código. agentes concorrentes no mesmo repositório usam branches e worktrees separados por work item, e alterações locais preexistentes nunca são descartadas ou incorporadas sem autorização. sobre o registro. o board é consolidado por um coordenador, não editado livremente por todos, e achados transitórios ficam em arquivos separados — um grande arquivo compartilhado de anotações vira ponto de conflito garantido. 9. implantação incremental fase 1 — contrato mínimo criar somente: agents.md workspace.md board.md repos/ ├── readme.md ├── registry.yaml └── github/&lt;organization&gt;/&lt;repository&gt;/ projects/&lt;piloto&gt;/ ├── readme.md ├── context.md ├── status.md ├── engineering/repositories.yaml ├── plans/active/ ├── work-items/ └── execution/evidence/ fase 2 — templates e coordenação torna o contrato repetível. adicione templates de plano, adr, work item e handoff; introduza .coordination/ ; padronize metadados, estados, branches e worktrees por work item. valide o resultado com um projeto real antes de seguir. fase 3 — memória e aprendizado introduz o que sobrevive entre missões: memória por projeto, o fluxo candidate → accepted → promoted para aprendizados, e a política de retenção e arquivamento de contexto temporário. fase 4 — automação só faz sentido depois que as três fases anteriores produzirem dados consistentes. as verificações automáticas se dividem em três frentes: frente verifica consolidação regenerar board.md a partir dos work items; gerar relatórios de status e bloqueios integridade itens sem owner, critérios ou evidências; links e identificadores; divergências entre registry.yaml , projetos e clones higiene worktrees órfãos e branches sem work item relacionado; memória com decisão ainda não promovida 10. decisão recomendada adotar projects/&lt;project&gt;/ como unidade central do trabalho, mover plans/ para dentro de cada projeto e usar repos/ como localização canônica dos checkouts de código. manter na raiz apenas elementos transversais: docs/ : conhecimento global curado; repos/ : repositórios github e worktrees locais; .coordination/ : comunicação temporária entre agentes; memory/ : memória do workspace; board.md : visão consolidada do portfólio; archive/ : material global desativado. essa divisão separa claramente documentação, planejamento e código; reduz duplicidade; melhora a navegação; limita conflitos entre agentes; e torna explícita a fonte de verdade de cada informação. "}, {"id": "workspaces-readme", "path": "workspaces/README.md", "section": "Workspaces", "title": "Workspaces de exemplo", "status": "", "updated": "", "html": "<h1 id=\"workspaces-readme~workspaces-de-exemplo\">Workspaces de exemplo</h1>\n<p>Esta área contém implementações concretas dos workspaces operacionais descritos na arquitetura do Agent Team.</p>\n<p>Cada papel possui uma raiz independente para que seus contratos, exemplos e fontes de verdade possam evoluir sem misturar responsabilidades:</p>\n<ul>\n<li><a href=\"../workspaces/tech-lead/README.md\" class=\"ext\" title=\"workspaces/tech-lead/README.md — arquivo do repositório\"><code>tech-lead/</code></a>: viabilidade, arquitetura, implementação e risco operacional;</li>\n<li><a href=\"../workspaces/ux/README.md\" class=\"ext\" title=\"workspaces/ux/README.md — arquivo do repositório\"><code>ux/</code></a>: pesquisa, experiência, acessibilidade e validação com usuários;</li>\n<li><a href=\"../workspaces/pm/README.md\" class=\"ext\" title=\"workspaces/pm/README.md — arquivo do repositório\"><code>pm/</code></a>: valor, prioridade, requisitos e resultados de produto.</li>\n</ul>\n<p>Os exemplos não são o workspace de produção de uma equipe. Nomes, organizações, repositórios e estados são fictícios e devem ser substituídos ao copiar a estrutura.</p>\n<h2 id=\"workspaces-readme~workflows-dentro-de-cada-workspace\">Workflows dentro de cada workspace</h2>\n<p>Os contratos reutilizáveis ficam no <a href=\"#docs-workflows-readme\">catálogo global de workflows</a>. Cada workspace de usuário deve manter <code>docs/workflows/</code> como camada de binding local: quais workflows estão habilitados, qual versão canônica é usada, permissões, integrações e roteamento de handoffs.</p>\n<p>Artefatos de uma execução não pertencem a <code>docs/workflows/</code>. Eles ficam em <code>projects/&lt;project&gt;/</code>, no workspace dono do domínio: o PM registra discovery, PRD, decisões e Work Items; UX registra research, jornadas, fluxos, especificações e validações; o Tech Lead registra planos em <code>projects/&lt;project&gt;/plans/active/</code>, specs, ADRs, evidências, reviews e worktrees. <code>..coordination/</code> é somente trânsito temporário.</p>\n<p>Material bruto que sustenta as análises e discussões de um workflow — transcrições, printscreens, e-mails, PDFs, documentos Word e afins — fica em <code>projects/&lt;project&gt;/plans/assets/&lt;workflow&gt;/&lt;YYYY-MM-DD&gt;-&lt;session-id&gt;/</code>, em qualquer um dos três workspaces. Cada execução usa sua própria pasta de sessão; reexecutar um workflow por resultado insatisfatório nunca sobrescreve ou mistura material com a tentativa anterior. <code>plans/assets/</code> não é fonte canônica — a conclusão vai para o artefato do domínio correto, e o asset permanece como rastro auditável. Ver a skill <a href=\"#skills-workspace-projects-skill\"><code>workspace-projects</code></a> para o detalhamento completo.</p>\n<h2 id=\"workspaces-readme~ownership-entre-workspaces\">Ownership entre workspaces</h2>\n<table>\n<thead>\n<tr>\n<th>Domínio</th>\n<th>Fonte canônica</th>\n<th>Os demais workspaces recebem</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Valor, prioridade, outcome e requisitos</td>\n<td><code>pm/</code></td>\n<td>decisão aprovada e handoff de produto</td>\n</tr>\n<tr>\n<td>Evidência de usuário, jornada e experiência</td>\n<td><code>ux/</code></td>\n<td>UX spec, critérios e handoff de experiência</td>\n</tr>\n<tr>\n<td>Arquitetura, implementação e risco operacional</td>\n<td><code>tech-lead/</code></td>\n<td>viabilidade, contratos técnicos e evidence pack</td>\n</tr>\n</tbody>\n</table>\n<p>Uma informação autoritativa não deve ser mantida em dois workspaces. Quando uma IA precisar de contexto de outro domínio, deve seguir o link até a fonte ou usar um snapshot identificado como não autoritativo e confirmar sua validade antes de agir.</p>", "toc": [{"level": 2, "id": "workspaces-readme~workflows-dentro-de-cada-workspace", "text": "Workflows dentro de cada workspace"}, {"level": 2, "id": "workspaces-readme~ownership-entre-workspaces", "text": "Ownership entre workspaces"}], "text": " workspaces de exemplo esta área contém implementações concretas dos workspaces operacionais descritos na arquitetura do agent team. cada papel possui uma raiz independente para que seus contratos, exemplos e fontes de verdade possam evoluir sem misturar responsabilidades: tech-lead/ : viabilidade, arquitetura, implementação e risco operacional; ux/ : pesquisa, experiência, acessibilidade e validação com usuários; pm/ : valor, prioridade, requisitos e resultados de produto. os exemplos não são o workspace de p
