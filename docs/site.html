tornam ao mesmo agente dentro dos limites de tentativa e tempo. O Orchestrator bloqueia dependentes até a evidência existir.</li>\n<li>O Orchestrator consolida o estado, não o código: produz a lista de mudanças, evidências, dependências resolvidas e pendências para validação.</li>\n</ol>\n<h2 id=\"docs-workflows-04-autonomous-implementation~regras-de-colaboração\">Regras de colaboração</h2>\n<p>Como esta é a etapa mais paralela do fluxo, as regras existem para evitar que dois agentes destruam o trabalho um do outro. Agentes não editam simultaneamente o mesmo artefato sem divisão explícita, e nenhuma tarefa usa branch, worktree ou alterações preexistentes de outra missão sem autorização. Por fim, a conclusão local não substitui a validação adversarial — gates verdes indicam que a mudança está pronta para ser atacada, não que está aprovada.</p>\n<h2 id=\"docs-workflows-04-autonomous-implementation~encerramento\">Encerramento</h2>\n<p>Antes de fechar a rodada, registre:</p>\n<table>\n<thead>\n<tr>\n<th>Artefato</th>\n<th>Destino</th>\n<th>Obrigatório</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Código implementado</td>\n<td>worktree em <code>repos/worktrees/</code> (fora do workspace)</td>\n<td>sim</td>\n</tr>\n<tr>\n<td>Work Item atualizado</td>\n<td><code>work-items/&lt;WI-id&gt;.md</code> — status, branch, worktree</td>\n<td>sim</td>\n</tr>\n<tr>\n<td>STATUS.md</td>\n<td>fase <code>implementation</code>, próximo gate <code>technical review</code></td>\n<td>sim</td>\n</tr>\n<tr>\n<td><code>MEMORY.md</code></td>\n<td>progresso e bloqueios relevantes</td>\n<td>se houve mudança</td>\n</tr>\n</tbody>\n</table>\n<p>Nenhum arquivo de implementação vai para <code>plans/assets/</code>. O rastro auditável da implementação é o diff no repositório e as evidências em <code>execution/evidence/</code>.</p>\n<h2 id=\"docs-workflows-04-autonomous-implementation~escalonamento\">Escalonamento</h2>\n<p>Escalar por falha repetida, requisito contraditório, dependência circular, necessidade de permissão ou risco acima da missão. O escalonamento contém decisão solicitada, opções, impacto e evidências, não apenas logs.</p>", "toc": [{"level": 2, "id": "docs-workflows-04-autonomous-implementation~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-04-autonomous-implementation~regras-de-colaboração", "text": "Regras de colaboração"}, {"level": 2, "id": "docs-workflows-04-autonomous-implementation~encerramento", "text": "Encerramento"}, {"level": 2, "id": "docs-workflows-04-autonomous-implementation~escalonamento", "text": "Escalonamento"}], "text": " workflow — implementação autônoma executa tarefas elegíveis em unidades pequenas e isoladas. o orchestrator coordena dependências e evidências; cada software engineer agent é dono de uma missão, nunca do estado global. aspecto contrato entrada tarefa elegível, spec.md , critérios, permissões, risco e gates consolida orchestrator agent colaboram um ou mais software engineer agents saída diff rastreável, testes, documentação afetada, resultados locais e handoff para validação owner humano tech lead por política e exceção gate hooks locais e critérios da tarefa aprovados − ajustado + ajustar flowchart lr a[tasks.md] --&gt; b[orchestrator\\ndag e missões elegíveis] b --&gt; c[engineer a\\ntarefa isolada] b --&gt; d[engineer b\\ntarefa independente] c --&gt; e[hooks e evidências locais] d --&gt; e e -- falha corrigível --&gt; c e -- aprovado --&gt; f[orchestrator\\nconsolida handoff] e -- repetida ou decisão --&gt; g[escalonamento ao tech lead] f --&gt; h[validação adversarial] ver código do diagrama flowchart lr a[tasks.md] --&gt; b[orchestrator\\ndag e missões elegíveis] b --&gt; c[engineer a\\ntarefa isolada] b --&gt; d[engineer b\\ntarefa independente] c --&gt; e[hooks e evidências locais] d --&gt; e e -- falha corrigível --&gt; c e -- aprovado --&gt; f[orchestrator\\nconsolida handoff] e -- repetida ou decisão --&gt; g[escalonamento ao tech lead] f --&gt; h[validação adversarial] sequência o orchestrator cria o dag a partir de tasks.md , seleciona apenas missões com dependências satisfeitas e distribui o contexto mínimo. cada engineer agent declara escopo, arquivos, branch/worktree e validações; trabalho concorrente no mesmo repositório usa isolamento por work item. o engineer implementa a menor mudança, atualiza testes e documentação e executa os gates locais. falhas corrigíveis retornam ao mesmo agente dentro dos limites de tentativa e tempo. o orchestrator bloqueia dependentes até a evidência existir. o orchestrator consolida o estado, não o código: produz a lista de mudanças, evidências, dependências resolvidas e pendências para validação. regras de colaboração como esta é a etapa mais paralela do fluxo, as regras existem para evitar que dois agentes destruam o trabalho um do outro. agentes não editam simultaneamente o mesmo artefato sem divisão explícita, e nenhuma tarefa usa branch, worktree ou alterações preexistentes de outra missão sem autorização. por fim, a conclusão local não substitui a validação adversarial — gates verdes indicam que a mudança está pronta para ser atacada, não que está aprovada. encerramento antes de fechar a rodada, registre: artefato destino obrigatório código implementado worktree em repos/worktrees/ (fora do workspace) sim work item atualizado work-items/&lt;wi-id&gt;.md — status, branch, worktree sim status.md fase implementation , próximo gate technical review sim memory.md progresso e bloqueios relevantes se houve mudança nenhum arquivo de implementação vai para plans/assets/ . o rastro auditável da implementação é o diff no repositório e as evidências em execution/evidence/ . escalonamento escalar por falha repetida, requisito contraditório, dependência circular, necessidade de permissão ou risco acima da missão. o escalonamento contém decisão solicitada, opções, impacto e evidências, não apenas logs. "}, {"id": "docs-workflows-05-adversarial-validation", "path": "docs/workflows/05-adversarial-validation.md", "section": "Workflows", "title": "05 · Validação adversarial", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-05-adversarial-validation~workflow--validação-adversarial\">Workflow — validação adversarial</h1>\n<p>Valida a mudança por perspectivas independentes e converte achados em um evidence pack único. Os reviewers não assumem que o resultado dos testes do autor é suficiente.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>diff, PRD, UX spec, SPEC, <code>CHECKLIST.md</code>, resultados locais e risco</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>QA / Validation Agent</td>\n</tr>\n<tr>\n<td>Colaboram</td>\n<td>Security Review; Architecture Review; Adversarial Code Reviewer</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>checklist comprovado, findings classificados, evidências reproduzíveis e recomendação de gate</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>Tech Lead; PM e UX para seus critérios</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>todos os checks obrigatórios aprovados e nenhum bloqueador aberto</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[Mudança pronta] --&gt; B[QA\\ncritérios e cenários]\n    A --&gt; C[Security\\nsegurança e privacidade]\n    A --&gt; D[Architecture\\nfronteiras e contratos]\n    A --&gt; E[Code Reviewer\\ncorretude e manutenção]\n    B --&gt; F[QA\\nconsolida evidence pack]\n    C --&gt; F\n    D --&gt; F\n    E --&gt; F\n    F --&gt; G{CI fast e deep lanes}\n    G -- falha corrigível --&gt; H[Implementação]\n    G -- aprovado --&gt; I[PR e merge]\n    G -- exceção --&gt; J[Tech Lead]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[Mudança pronta] --&gt; B[QA\\ncritérios e cenários]\n    A --&gt; C[Security\\nsegurança e privacidade]\n    A --&gt; D[Architecture\\nfronteiras e contratos]\n    A --&gt; E[Code Reviewer\\ncorretude e manutenção]\n    B --&gt; F[QA\\nconsolida evidence pack]\n    C --&gt; F\n    D --&gt; F\n    E --&gt; F\n    F --&gt; G{CI fast e deep lanes}\n    G -- falha corrigível --&gt; H[Implementação]\n    G -- aprovado --&gt; I[PR e merge]\n    G -- exceção --&gt; J[Tech Lead]</code></pre></details></div>\n<h2 id=\"docs-workflows-05-adversarial-validation~sequência\">Sequência</h2>\n<ol>\n<li>O QA Agent deriva cobertura da <code>CHECKLIST.md</code> e executa cenários nominal, erro, recuperação, regressão e casos-limite.</li>\n<li>Security, Architecture e Code Reviewer investigam em paralelo seus domínios e apresentam findings com evidência, severidade, impacto e ação sugerida.</li>\n<li>O QA Agent consolida sem silenciar divergências, mapeando cada critério para evidência ou gap.</li>\n<li>CI decide os checks requeridos pela classe de risco e pelos paths alterados. Findings corrigíveis voltam à implementação; toda correção material recebe nova validação proporcional.</li>\n</ol>\n<h2 id=\"docs-workflows-05-adversarial-validation~encerramento\">Encerramento</h2>\n<p>Antes de fechar a rodada, registre:</p>\n<table>\n<thead>\n<tr>\n<th>Artefato</th>\n<th>Destino</th>\n<th>Obrigatório</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Review do Code Reviewer</td>\n<td><code>execution/reviews/code-&lt;WI-id&gt;.md</code></td>\n<td>sim</td>\n</tr>\n<tr>\n<td>Review do Security Agent</td>\n<td><code>execution/reviews/security-&lt;WI-id&gt;.md</code></td>\n<td>quando aplicável</td>\n</tr>\n<tr>\n<td>Review do Architecture Agent</td>\n<td><code>execution/reviews/architecture-&lt;WI-id&gt;.md</code></td>\n<td>quando aplicável</td>\n</tr>\n<tr>\n<td>Evidence pack consolidado (QA Agent)</td>\n<td><code>execution/evidence/&lt;WI-id&gt;.md</code></td>\n<td>sim</td>\n</tr>\n<tr>\n<td>Work Item atualizado</td>\n<td><code>work-items/&lt;WI-id&gt;.md</code> — status e link para evidence</td>\n<td>sim</td>\n</tr>\n<tr>\n<td>STATUS.md</td>\n<td>fase <code>review</code>, próximo gate: <code>PR / loop back</code></td>\n<td>sim</td>\n</tr>\n</tbody>\n</table>\n<p>Achados abertos em qualquer review bloqueiam o gate. Cada resolução exige evidência referenciada no arquivo de review correspondente, não apenas texto.</p>\n<h2 id=\"docs-workflows-05-adversarial-validation~escalonamento\">Escalonamento</h2>\n<p>Escalar falso positivo, exceção, requisito ausente ou divergência sem regra de desempate. O QA Agent não pode fechar sozinho um achado de outro reviewer sem evidência de revalidação.</p>", "toc": [{"level": 2, "id": "docs-workflows-05-adversarial-validation~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-05-adversarial-validation~encerramento", "text": "Encerramento"}, {"level": 2, "id": "docs-workflows-05-adversarial-validation~escalonamento", "text": "Escalonamento"}], "text": " workflow — validação adversarial valida a mudança por perspectivas independentes e converte achados em um evidence pack único. os reviewers não assumem que o resultado dos testes do autor é suficiente. aspecto contrato entrada diff, prd, ux spec, spec, checklist.md , resultados locais e risco consolida qa / validation agent colaboram security review; architecture review; adversarial code reviewer saída checklist comprovado, findings classificados, evidências reproduzíveis e recomendação de gate owner humano tech lead; pm e ux para seus critérios gate todos os checks obrigatórios aprovados e nenhum bloqueador aberto − ajustado + ajustar flowchart lr a[mudança pronta] --&gt; b[qa\\ncritérios e cenários] a --&gt; c[security\\nsegurança e privacidade] a --&gt; d[architecture\\nfronteiras e contratos] a --&gt; e[code reviewer\\ncorretude e manutenção] b --&gt; f[qa\\nconsolida evidence pack] c --&gt; f d --&gt; f e --&gt; f f --&gt; g{ci fast e deep lanes} g -- falha corrigível --&gt; h[implementação] g -- aprovado --&gt; i[pr e merge] g -- exceção --&gt; j[tech lead] ver código do diagrama flowchart lr a[mudança pronta] --&gt; b[qa\\ncritérios e cenários] a --&gt; c[security\\nsegurança e privacidade] a --&gt; d[architecture\\nfronteiras e contratos] a --&gt; e[code reviewer\\ncorretude e manutenção] b --&gt; f[qa\\nconsolida evidence pack] c --&gt; f d --&gt; f e --&gt; f f --&gt; g{ci fast e deep lanes} g -- falha corrigível --&gt; h[implementação] g -- aprovado --&gt; i[pr e merge] g -- exceção --&gt; j[tech lead] sequência o qa agent deriva cobertura da checklist.md e executa cenários nominal, erro, recuperação, regressão e casos-limite. security, architecture e code reviewer investigam em paralelo seus domínios e apresentam findings com evidência, severidade, impacto e ação sugerida. o qa agent consolida sem silenciar divergências, mapeando cada critério para evidência ou gap. ci decide os checks requeridos pela classe de risco e pelos paths alterados. findings corrigíveis voltam à implementação; toda correção material recebe nova validação proporcional. encerramento antes de fechar a rodada, registre: artefato destino obrigatório review do code reviewer execution/reviews/code-&lt;wi-id&gt;.md sim review do security agent execution/reviews/security-&lt;wi-id&gt;.md quando aplicável review do architecture agent execution/reviews/architecture-&lt;wi-id&gt;.md quando aplicável evidence pack consolidado (qa agent) execution/evidence/&lt;wi-id&gt;.md sim work item atualizado work-items/&lt;wi-id&gt;.md — status e link para evidence sim status.md fase review , próximo gate: pr / loop back sim achados abertos em qualquer review bloqueiam o gate. cada resolução exige evidência referenciada no arquivo de review correspondente, não apenas texto. escalonamento escalar falso positivo, exceção, requisito ausente ou divergência sem regra de desempate. o qa agent não pode fechar sozinho um achado de outro reviewer sem evidência de revalidação. "}, {"id": "docs-workflows-06-pr-and-merge", "path": "docs/workflows/06-pr-and-merge.md", "section": "Workflows", "title": "06 · PR e merge", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-06-pr-and-merge~workflow--pr-e-merge\">Workflow — PR e merge</h1>\n<p>Empacota a mudança validada para uma decisão de integração proporcional ao risco. A PR não é uma segunda implementação: é a síntese auditável das evidências e dos hotspots.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>diff validado, commits, CI, checklist e evidence pack de validação</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>PR Agent</td>\n</tr>\n<tr>\n<td>Colaboram</td>\n<td>Reviewer Agents e Code Owners exigidos pela política</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>PR rastreável, descrição de risco, aprovações válidas e decisão de merge</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>Tech Lead ou Code Owner conforme risco</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>CI verde, branch atualizada, aprovações exigidas e nenhuma exceção pendente</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[Evidence pack de validação] --&gt; B[PR Agent\\nPR e resumo de hotspots]\n    B --&gt; C[Reviewer Agents\\nreview independente]\n    C --&gt; D[PR Agent\\nconsolida comentários]\n    D --&gt; E{Há ajuste?}\n    E -- sim --&gt; F[Implementação + revalidação]\n    E -- não --&gt; G{Política de risco}\n    G --&gt; H[H4 quando exigido]\n    H --&gt; I[Merge protegido]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[Evidence pack de validação] --&gt; B[PR Agent\\nPR e resumo de hotspots]\n    B --&gt; C[Reviewer Agents\\nreview independente]\n    C --&gt; D[PR Agent\\nconsolida comentários]\n    D --&gt; E{Há ajuste?}\n    E -- sim --&gt; F[Implementação + revalidação]\n    E -- não --&gt; G{Política de risco}\n    G --&gt; H[H4 quando exigido]\n    H --&gt; I[Merge protegido]</code></pre></details></div>\n<h2 id=\"docs-workflows-06-pr-and-merge~sequência\">Sequência</h2>\n<ol>\n<li>O PR Agent gera descrição, comportamento alterado, risco, arquivos sensíveis, evidências, rollback e itens fora de escopo.</li>\n<li>Reviewer Agents revisam corretude, segurança, arquitetura, testes, documentação e observabilidade dentro do próprio contrato, sem reproduzir o pacote inteiro de validação.</li>\n<li>O PR Agent registra cada comentário e rota correções para implementação. Mudança material invalida aprovações e evidências afetadas.</li>\n<li>H4 e o merge protegido obedecem à política R0–R4; o agente apenas prepara a recomendação.</li>\n</ol>\n<h2 id=\"docs-workflows-06-pr-and-merge~escalonamento\">Escalonamento</h2>\n<p>Escalar quando uma aprovação exigida estiver indisponível, houver exceção de política, conflito de review ou CI não reproduzível. A ausência de resposta nunca conta como aprovação.</p>", "toc": [{"level": 2, "id": "docs-workflows-06-pr-and-merge~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-06-pr-and-merge~escalonamento", "text": "Escalonamento"}], "text": " workflow — pr e merge empacota a mudança validada para uma decisão de integração proporcional ao risco. a pr não é uma segunda implementação: é a síntese auditável das evidências e dos hotspots. aspecto contrato entrada diff validado, commits, ci, checklist e evidence pack de validação consolida pr agent colaboram reviewer agents e code owners exigidos pela política saída pr rastreável, descrição de risco, aprovações válidas e decisão de merge owner humano tech lead ou code owner conforme risco gate ci verde, branch atualizada, aprovações exigidas e nenhuma exceção pendente − ajustado + ajustar flowchart lr a[evidence pack de validação] --&gt; b[pr agent\\npr e resumo de hotspots] b --&gt; c[reviewer agents\\nreview independente] c --&gt; d[pr agent\\nconsolida comentários] d --&gt; e{há ajuste?} e -- sim --&gt; f[implementação + revalidação] e -- não --&gt; g{política de risco} g --&gt; h[h4 quando exigido] h --&gt; i[merge protegido] ver código do diagrama flowchart lr a[evidence pack de validação] --&gt; b[pr agent\\npr e resumo de hotspots] b --&gt; c[reviewer agents\\nreview independente] c --&gt; d[pr agent\\nconsolida comentários] d --&gt; e{há ajuste?} e -- sim --&gt; f[implementação + revalidação] e -- não --&gt; g{política de risco} g --&gt; h[h4 quando exigido] h --&gt; i[merge protegido] sequência o pr agent gera descrição, comportamento alterado, risco, arquivos sensíveis, evidências, rollback e itens fora de escopo. reviewer agents revisam corretude, segurança, arquitetura, testes, documentação e observabilidade dentro do próprio contrato, sem reproduzir o pacote inteiro de validação. o pr agent registra cada comentário e rota correções para implementação. mudança material invalida aprovações e evidências afetadas. h4 e o merge protegido obedecem à política r0–r4; o agente apenas prepara a recomendação. escalonamento escalar quando uma aprovação exigida estiver indisponível, houver exceção de política, conflito de review ou ci não reproduzível. a ausência de resposta nunca conta como aprovação. "}, {"id": "docs-workflows-07-release-candidate-validation", "path": "docs/workflows/07-release-candidate-validation.md", "section": "Workflows", "title": "07 · Homologação", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-07-release-candidate-validation~workflow--homologação\">Workflow — homologação</h1>\n<p>Confirma, em ambiente representativo, que a mudança integrada entrega os critérios de produto e experiência. Release prepara o ambiente; Product Validation consolida o aceite funcional.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>artefato imutável integrado, critérios de aceite, ambiente de preview/staging e dados seguros</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Product Validation Agent</td>\n</tr>\n<tr>\n<td>Colabora</td>\n<td>Release Agent</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>release candidate aprovado ou devolvido, demo/evidências e pendências registradas</td>\n</tr>\n<tr>\n<td>Owners humanos</td>\n<td>PM para valor; UX para experiência; stakeholder quando necessário</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>critérios de aceite validados ou plano de correção explícito</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[Artefato integrado] --&gt; B[Release Agent\\npreview e dados seguros]\n    B --&gt; C[Product Validation\\nsmoke, E2E e critérios]\n    C --&gt; D[Release Agent\\ndemo e evidências]\n    D --&gt; E{Gate de release candidate}\n    E -- aprovado --&gt; F[Produção e observação]\n    E -- falha --&gt; G[Implementação]\n    E -- decisão de produto/UX --&gt; H[PM ou UX]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[Artefato integrado] --&gt; B[Release Agent\\npreview e dados seguros]\n    B --&gt; C[Product Validation\\nsmoke, E2E e critérios]\n    C --&gt; D[Release Agent\\ndemo e evidências]\n    D --&gt; E{Gate de release candidate}\n    E -- aprovado --&gt; F[Produção e observação]\n    E -- falha --&gt; G[Implementação]\n    E -- decisão de produto/UX --&gt; H[PM ou UX]</code></pre></details></div>\n<h2 id=\"docs-workflows-07-release-candidate-validation~sequência\">Sequência</h2>\n<ol>\n<li>O Release Agent cria o ambiente a partir do artefato imutável e fornece dados de teste seguros.</li>\n<li>O Product Validation Agent confirma critérios de produto e UX por smoke, E2E, comparação visual e demonstração quando aplicável.</li>\n<li>O Release Agent anexa a evidência de ambiente e execução; o Product Validation Agent consolida aceite ou gaps.</li>\n<li>Falha de implementação retorna ao workflow de implementação; decisão de escopo ou experiência retorna aos seus owners e às etapas de produto/UX quando necessário.</li>\n</ol>\n<h2 id=\"docs-workflows-07-release-candidate-validation~escalonamento\">Escalonamento</h2>\n<p>Escalar se ambiente, dado de teste, critério de aceite ou comportamento esperado estiver ausente. Homologação não compensa requisito indefinido por aprovação informal.</p>", "toc": [{"level": 2, "id": "docs-workflows-07-release-candidate-validation~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-07-release-candidate-validation~escalonamento", "text": "Escalonamento"}], "text": " workflow — homologação confirma, em ambiente representativo, que a mudança integrada entrega os critérios de produto e experiência. release prepara o ambiente; product validation consolida o aceite funcional. aspecto contrato entrada artefato imutável integrado, critérios de aceite, ambiente de preview/staging e dados seguros consolida product validation agent colabora release agent saída release candidate aprovado ou devolvido, demo/evidências e pendências registradas owners humanos pm para valor; ux para experiência; stakeholder quando necessário gate critérios de aceite validados ou plano de correção explícito − ajustado + ajustar flowchart lr a[artefato integrado] --&gt; b[release agent\\npreview e dados seguros] b --&gt; c[product validation\\nsmoke, e2e e critérios] c --&gt; d[release agent\\ndemo e evidências] d --&gt; e{gate de release candidate} e -- aprovado --&gt; f[produção e observação] e -- falha --&gt; g[implementação] e -- decisão de produto/ux --&gt; h[pm ou ux] ver código do diagrama flowchart lr a[artefato integrado] --&gt; b[release agent\\npreview e dados seguros] b --&gt; c[product validation\\nsmoke, e2e e critérios] c --&gt; d[release agent\\ndemo e evidências] d --&gt; e{gate de release candidate} e -- aprovado --&gt; f[produção e observação] e -- falha --&gt; g[implementação] e -- decisão de produto/ux --&gt; h[pm ou ux] sequência o release agent cria o ambiente a partir do artefato imutável e fornece dados de teste seguros. o product validation agent confirma critérios de produto e ux por smoke, e2e, comparação visual e demonstração quando aplicável. o release agent anexa a evidência de ambiente e execução; o product validation agent consolida aceite ou gaps. falha de implementação retorna ao workflow de implementação; decisão de escopo ou experiência retorna aos seus owners e às etapas de produto/ux quando necessário. escalonamento escalar se ambiente, dado de teste, critério de aceite ou comportamento esperado estiver ausente. homologação não compensa requisito indefinido por aprovação informal. "}, {"id": "docs-workflows-08-production-release-and-observation", "path": "docs/workflows/08-production-release-and-observation.md", "section": "Workflows", "title": "08 · Produção e observação", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-08-production-release-and-observation~workflow--produção-e-observação\">Workflow — produção e observação</h1>\n<p>Libera um release candidate com exposição controlada e usa sinais operacionais para avançar, pausar ou reverter. O Release Agent executa a política; o Observability Agent interpreta e evidencia a saúde.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>release candidate aprovado, rollout/rollback, SLOs, alertas e autorizações</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Release Agent</td>\n</tr>\n<tr>\n<td>Colabora</td>\n<td>Observability Agent</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>versão liberada, health report, changelog e rollback/pausa quando aplicável</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>Tech Lead; PM coaprova R3/R4</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>ambiente autorizado, migração compatível e janela pós-deploy sem regressão relevante</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[Release candidate] --&gt; B{Política exige H5?}\n    B -- sim --&gt; C[H5: aprovar exposição]\n    B -- não --&gt; D[Release Agent\\ncanary, flag ou rollout]\n    C --&gt; D\n    D --&gt; E[Observability Agent\\nSLOs, erros e baseline]\n    E --&gt; F{Saúde do rollout}\n    F -- saudável --&gt; G[ampliar e concluir]\n    F -- regressão --&gt; H[pausar ou rollback]\n    H --&gt; I[Implementação ou incidente]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[Release candidate] --&gt; B{Política exige H5?}\n    B -- sim --&gt; C[H5: aprovar exposição]\n    B -- não --&gt; D[Release Agent\\ncanary, flag ou rollout]\n    C --&gt; D\n    D --&gt; E[Observability Agent\\nSLOs, erros e baseline]\n    E --&gt; F{Saúde do rollout}\n    F -- saudável --&gt; G[ampliar e concluir]\n    F -- regressão --&gt; H[pausar ou rollback]\n    H --&gt; I[Implementação ou incidente]</code></pre></details></div>\n<h2 id=\"docs-workflows-08-production-release-and-observation~sequência\">Sequência</h2>\n<ol>\n<li>O Release Agent verifica artefato, ambiente, secrets autorizados, migração, backup e capacidade de rollback.</li>\n<li>H5 é aplicado conforme o risco; R3/R4 requerem aprovação explícita antes de produção.</li>\n<li>O Release Agent executa a estratégia autorizada. O Observability Agent compara erros, latência, SLOs e métricas de produto com o baseline.</li>\n<li>Sinal de regressão dispara pausa ou rollback conforme política, com evidence pack para o Tech Lead; estabilidade completa a janela pós-deploy.</li>\n</ol>\n<h2 id=\"docs-workflows-08-production-release-and-observation~escalonamento\">Escalonamento</h2>\n<p>Escalar quando rollback automático não for seguro, os sinais forem contraditórios ou o impacto exceder o plano de mitigação. O agente não pode manter exposição crescente diante de alerta crítico não explicado.</p>", "toc": [{"level": 2, "id": "docs-workflows-08-production-release-and-observation~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-08-production-release-and-observation~escalonamento", "text": "Escalonamento"}], "text": " workflow — produção e observação libera um release candidate com exposição controlada e usa sinais operacionais para avançar, pausar ou reverter. o release agent executa a política; o observability agent interpreta e evidencia a saúde. aspecto contrato entrada release candidate aprovado, rollout/rollback, slos, alertas e autorizações consolida release agent colabora observability agent saída versão liberada, health report, changelog e rollback/pausa quando aplicável owner humano tech lead; pm coaprova r3/r4 gate ambiente autorizado, migração compatível e janela pós-deploy sem regressão relevante − ajustado + ajustar flowchart lr a[release candidate] --&gt; b{política exige h5?} b -- sim --&gt; c[h5: aprovar exposição] b -- não --&gt; d[release agent\\ncanary, flag ou rollout] c --&gt; d d --&gt; e[observability agent\\nslos, erros e baseline] e --&gt; f{saúde do rollout} f -- saudável --&gt; g[ampliar e concluir] f -- regressão --&gt; h[pausar ou rollback] h --&gt; i[implementação ou incidente] ver código do diagrama flowchart lr a[release candidate] --&gt; b{política exige h5?} b -- sim --&gt; c[h5: aprovar exposição] b -- não --&gt; d[release agent\\ncanary, flag ou rollout] c --&gt; d d --&gt; e[observability agent\\nslos, erros e baseline] e --&gt; f{saúde do rollout} f -- saudável --&gt; g[ampliar e concluir] f -- regressão --&gt; h[pausar ou rollback] h --&gt; i[implementação ou incidente] sequência o release agent verifica artefato, ambiente, secrets autorizados, migração, backup e capacidade de rollback. h5 é aplicado conforme o risco; r3/r4 requerem aprovação explícita antes de produção. o release agent executa a estratégia autorizada. o observability agent compara erros, latência, slos e métricas de produto com o baseline. sinal de regressão dispara pausa ou rollback conforme política, com evidence pack para o tech lead; estabilidade completa a janela pós-deploy. escalonamento escalar quando rollback automático não for seguro, os sinais forem contraditórios ou o impacto exceder o plano de mitigação. o agente não pode manter exposição crescente diante de alerta crítico não explicado. "}, {"id": "docs-workflows-09-knowledge-curation", "path": "docs/workflows/09-knowledge-curation.md", "section": "Workflows", "title": "09 · Curadoria de conhecimento", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-09-knowledge-curation~workflow--curadoria-de-conhecimento\">Workflow — curadoria de conhecimento</h1>\n<p>Mantém as fontes canônicas alinhadas à entrega sem transformar memória temporária em verdade permanente. A crítica independente é obrigatória para alteração sensível ou conclusão de baixa confiança.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>decisões, PR, release, evidências de homologação, incidentes e fontes canônicas afetadas</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Knowledge Agent</td>\n</tr>\n<tr>\n<td>Colabora</td>\n<td>Critic Agent quando a mudança for sensível, contraditória ou de baixa confiança</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>documentação e conhecimento reutilizável atualizados, ou proposta explícita para revisão</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>owner do domínio alterado</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>rastreabilidade, atualidade e ausência de contradições não resolvidas</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[Entrega, decisão ou incidente] --&gt; B[Knowledge Agent\\nmapa de fontes afetadas]\n    B --&gt; C[proposta de atualização]\n    C --&gt; D{Sensível ou incerta?}\n    D -- sim --&gt; E[Critic Agent\\ncontesta evidência]\n    E --&gt; F[Knowledge Agent\\nconsolida ou preserva hipótese]\n    D -- não --&gt; F\n    F --&gt; G{Gate de conhecimento}\n    G -- aprovado --&gt; H[fontes canônicas]\n    G -- pendência --&gt; I[owner do domínio]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[Entrega, decisão ou incidente] --&gt; B[Knowledge Agent\\nmapa de fontes afetadas]\n    B --&gt; C[proposta de atualização]\n    C --&gt; D{Sensível ou incerta?}\n    D -- sim --&gt; E[Critic Agent\\ncontesta evidência]\n    E --&gt; F[Knowledge Agent\\nconsolida ou preserva hipótese]\n    D -- não --&gt; F\n    F --&gt; G{Gate de conhecimento}\n    G -- aprovado --&gt; H[fontes canônicas]\n    G -- pendência --&gt; I[owner do domínio]</code></pre></details></div>\n<h2 id=\"docs-workflows-09-knowledge-curation~sequência\">Sequência</h2>\n<ol>\n<li>O Knowledge Agent relaciona mudança e evidência às fontes canônicas afetadas e identifica conteúdo obsoleto ou contraditório.</li>\n<li>Ele propõe a atualização com origem, data, contexto de aplicação e limites de validade.</li>\n<li>Para memória sensível, baixa confiança ou contradição, o Critic Agent verifica se a conclusão é sustentada; hipótese inconclusiva permanece identificada como tal.</li>\n<li>O Knowledge Agent consolida somente o que passou pelo gate e entrega links para auditoria ao owner do domínio.</li>\n</ol>\n<h2 id=\"docs-workflows-09-knowledge-curation~escalonamento\">Escalonamento</h2>\n<p>Escalar ao owner se não houver fonte canônica definida, se a evidência conflitar ou se a alteração puder afetar política, segurança ou decisão vigente.</p>", "toc": [{"level": 2, "id": "docs-workflows-09-knowledge-curation~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-09-knowledge-curation~escalonamento", "text": "Escalonamento"}], "text": " workflow — curadoria de conhecimento mantém as fontes canônicas alinhadas à entrega sem transformar memória temporária em verdade permanente. a crítica independente é obrigatória para alteração sensível ou conclusão de baixa confiança. aspecto contrato entrada decisões, pr, release, evidências de homologação, incidentes e fontes canônicas afetadas consolida knowledge agent colabora critic agent quando a mudança for sensível, contraditória ou de baixa confiança saída documentação e conhecimento reutilizável atualizados, ou proposta explícita para revisão owner humano owner do domínio alterado gate rastreabilidade, atualidade e ausência de contradições não resolvidas − ajustado + ajustar flowchart lr a[entrega, decisão ou incidente] --&gt; b[knowledge agent\\nmapa de fontes afetadas] b --&gt; c[proposta de atualização] c --&gt; d{sensível ou incerta?} d -- sim --&gt; e[critic agent\\ncontesta evidência] e --&gt; f[knowledge agent\\nconsolida ou preserva hipótese] d -- não --&gt; f f --&gt; g{gate de conhecimento} g -- aprovado --&gt; h[fontes canônicas] g -- pendência --&gt; i[owner do domínio] ver código do diagrama flowchart lr a[entrega, decisão ou incidente] --&gt; b[knowledge agent\\nmapa de fontes afetadas] b --&gt; c[proposta de atualização] c --&gt; d{sensível ou incerta?} d -- sim --&gt; e[critic agent\\ncontesta evidência] e --&gt; f[knowledge agent\\nconsolida ou preserva hipótese] d -- não --&gt; f f --&gt; g{gate de conhecimento} g -- aprovado --&gt; h[fontes canônicas] g -- pendência --&gt; i[owner do domínio] sequência o knowledge agent relaciona mudança e evidência às fontes canônicas afetadas e identifica conteúdo obsoleto ou contraditório. ele propõe a atualização com origem, data, contexto de aplicação e limites de validade. para memória sensível, baixa confiança ou contradição, o critic agent verifica se a conclusão é sustentada; hipótese inconclusiva permanece identificada como tal. o knowledge agent consolida somente o que passou pelo gate e entrega links para auditoria ao owner do domínio. escalonamento escalar ao owner se não houver fonte canônica definida, se a evidência conflitar ou se a alteração puder afetar política, segurança ou decisão vigente. "}, {"id": "docs-workflows-10-continuous-improvement", "path": "docs/workflows/10-continuous-improvement.md", "section": "Workflows", "title": "10 · Melhoria contínua", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-workflows-10-continuous-improvement~workflow--telemetria-e-melhoria-contínua\">Workflow — telemetria e melhoria contínua</h1>\n<p>Converte o histórico do sistema de trabalho em aprendizado validado ou demanda priorizável. Telemetry fornece dados íntegros; Auto Dream formula conclusões; Critic impede que um padrão aparente vire regra sem evidência.</p>\n<table>\n<thead>\n<tr>\n<th>Aspecto</th>\n<th>Contrato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entrada</td>\n<td>sessões, gates, retries, feedbacks, incidentes, métricas de custo/qualidade/autonomia e demandas anteriores</td>\n</tr>\n<tr>\n<td>Consolida</td>\n<td>Auto Dream Agent</td>\n</tr>\n<tr>\n<td>Colaboram</td>\n<td>Telemetry Agent, Observability Agent e Critic Agent independente</td>\n</tr>\n<tr>\n<td>Saída</td>\n<td>proposta de atualização de memória, demanda de melhoria, relatório semanal e hipóteses em observação</td>\n</tr>\n<tr>\n<td>Owner humano</td>\n<td>trio; PM ordena backlog; owner do domínio decide a execução</td>\n</tr>\n<tr>\n<td>Gate</td>\n<td>evidência, contexto, confiança, privacidade e contradições tratados</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    A[Eventos e sessões] --&gt; B[Telemetry\\ncoleta e correlação]\n    A --&gt; C[Observability\\nsaúde e incidentes]\n    B --&gt; D[Auto Dream\\npadrões e hipóteses]\n    C --&gt; D\n    D --&gt; E[Critic Agent\\nconfirma ou contesta]\n    E --&gt; F{Resultado}\n    F -- aprendizado validado --&gt; G[proposta para MEMORY.md]\n    F -- falha ou atrito --&gt; H[demanda no backlog]\n    G --&gt; I{H6 se sensível}\n    H --&gt; I\n    I --&gt; J[próximo ciclo]</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    A[Eventos e sessões] --&gt; B[Telemetry\\ncoleta e correlação]\n    A --&gt; C[Observability\\nsaúde e incidentes]\n    B --&gt; D[Auto Dream\\npadrões e hipóteses]\n    C --&gt; D\n    D --&gt; E[Critic Agent\\nconfirma ou contesta]\n    E --&gt; F{Resultado}\n    F -- aprendizado validado --&gt; G[proposta para MEMORY.md]\n    F -- falha ou atrito --&gt; H[demanda no backlog]\n    G --&gt; I{H6 se sensível}\n    H --&gt; I\n    I --&gt; J[próximo ciclo]</code></pre></details></div>\n<h2 id=\"docs-workflows-10-continuous-improvement~sequência\">Sequência</h2>\n<ol>\n<li>Telemetry coleta eventos correlacionáveis e remove secrets e dados pessoais antes da análise. Observability acrescenta sinais de saúde, incidentes e rollbacks.</li>\n<li>Auto Dream agrupa os dados por etapa, causa e impacto, compara com baseline e separa padrão, hipótese e ocorrência isolada.</li>\n<li>O Critic Agent avalia conclusão, evidências, contradições e generalização indevida; é independente do Auto Dream.</li>\n<li>Auto Dream consolida dois destinos: aprendizado com contexto e validade para <code>MEMORY.md</code>, ou demanda de melhoria com sintoma, evidência, impacto, causa provável, critério de aceite e owner recomendado.</li>\n<li>H6 revisa mudança sensível de memória, P0/P1 e alteração de gate; itens de baixo risco podem seguir por amostragem.</li>\n</ol>\n<h2 id=\"docs-workflows-10-continuous-improvement~escalonamento\">Escalonamento</h2>\n<p>Falha de coleta abre alerta, não conclusão silenciosa. Baixa confiança mantém hipótese em observação; contradição bloqueia atualização automática. O Auto Dream não aprova alterações nos próprios gates.</p>", "toc": [{"level": 2, "id": "docs-workflows-10-continuous-improvement~sequência", "text": "Sequência"}, {"level": 2, "id": "docs-workflows-10-continuous-improvement~escalonamento", "text": "Escalonamento"}], "text": " workflow — telemetria e melhoria contínua converte o histórico do sistema de trabalho em aprendizado validado ou demanda priorizável. telemetry fornece dados íntegros; auto dream formula conclusões; critic impede que um padrão aparente vire regra sem evidência. aspecto contrato entrada sessões, gates, retries, feedbacks, incidentes, métricas de custo/qualidade/autonomia e demandas anteriores consolida auto dream agent colaboram telemetry agent, observability agent e critic agent independente saída proposta de atualização de memória, demanda de melhoria, relatório semanal e hipóteses em observação owner humano trio; pm ordena backlog; owner do domínio decide a execução gate evidência, cont
