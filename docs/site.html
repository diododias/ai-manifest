hange failure rate e tempo de recuperação; violações arquiteturais, segurança e dependências; falsos positivos e tempo gasto por gate</td>\n</tr>\n<tr>\n<td><strong>Agentes e custo</strong></td>\n<td>trio</td>\n<td>tokens, custo e duração por fase, agente e entrega; taxa de sucesso sem intervenção; tentativas até conclusão; falhas por tool, skill, prompt e modelo; qualidade do evidence pack; tempo humano em exceções; atualidade e uso da base de conhecimento</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model~108-saídas-e-encerramento\">10.8 Saídas e encerramento</h3>\n<p>O ciclo entrega <code>MEMORY.md</code> atualizado com aprendizados validados, demandas de melhoria criadas ou enriquecidas no backlog, relatório semanal curto com padrões, tendências e qualidade dos dados, métricas do sistema atualizadas, hipóteses inconclusivas mantidas em observação, e experimentos com owner, baseline, prazo e critério de sucesso.</p>\n<p><strong>Gate de conclusão:</strong> fontes processadas e rastreáveis; qualidade e lacunas dos dados explícitas; aprendizados separados de hipóteses; falhas relevantes convertidas em demandas; duplicidades e contradições tratadas; mudanças sensíveis revisadas; nenhum dado confidencial persistido indevidamente.</p>\n<h3 id=\"docs-operating-model~109-falhas-do-próprio-ciclo\">10.9 Falhas do próprio ciclo</h3>\n<p>O ciclo precisa falhar de forma visível. Falha de coleta abre alerta e impede conclusão silenciosamente parcial. Baixa confiança mantém o item como hipótese. Contradição bloqueia atualização automática da memória. Demanda sem evidência permanece como rascunho. Um agente não pode aprovar alteração nos próprios gates. E incidentes do Auto Dream entram no próximo ciclo de análise.</p>\n<hr>\n<h2 id=\"docs-operating-model~11-evidence-pack-apresentado-às-pessoas\">11. Evidence pack apresentado às pessoas</h2>\n<p>Toda decisão humana recebe um pacote curto, desenhado para permitir decidir sem reler todas as sessões — mas preservando os links para auditoria.</p>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pergunta de decisão</td>\n<td>uma frase</td>\n</tr>\n<tr>\n<td>Recomendação</td>\n<td>posição dos agentes</td>\n</tr>\n<tr>\n<td>Alternativas</td>\n<td>opções consideradas e descartadas</td>\n</tr>\n<tr>\n<td>Riscos e trade-offs</td>\n<td>o que se ganha e o que se aceita</td>\n</tr>\n<tr>\n<td>Delta</td>\n<td>mudanças desde a última aprovação</td>\n</tr>\n<tr>\n<td>Evidências</td>\n<td>resultado dos gates executados</td>\n</tr>\n<tr>\n<td>Pendências</td>\n<td>exceções e nível de confiança</td>\n</tr>\n<tr>\n<td>Impacto</td>\n<td>em produto, experiência e engenharia</td>\n</tr>\n<tr>\n<td>Links</td>\n<td>artefatos completos, código e execução</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h1 id=\"docs-operating-model~parte-iv--o-que-sustenta\">Parte IV — O que sustenta</h1>\n<h2 id=\"docs-operating-model~12-repo-harness\">12. Repo harness</h2>\n<h3 id=\"docs-operating-model~121-papel\">12.1 Papel</h3>\n<p>O harness é o que torna o repositório compreensível para pessoas e agentes ao mesmo tempo. Ele converte padrões de engenharia em regras executáveis, oferece caminhos seguros e repetíveis para mudanças, reduz a dependência de contexto informal ou individual, e produz feedback acionável e evidência auditável.</p>\n<p>Distinguem-se dois harnesses, e confundi-los produz duplicidade silenciosa. O <strong>repo harness</strong> vive dentro de cada repositório de código e viaja junto com o clone; o <strong>workspace</strong> organiza o trabalho do agente fora do código. A regra de decisão é simples: se a informação continua verdadeira quando outro time clona o repositório, ela é harness.</p>\n<h3 id=\"docs-operating-model~122-as-cinco-camadas\">12.2 As cinco camadas</h3>\n<p>O repo harness se organiza em cinco camadas cumulativas. Cada uma elimina uma classe de falha, e a ordem de construção segue o retorno decrescente — contexto é o mais barato e o que mais reduz retrabalho; evidência só tem valor quando existe algo verificado para registrar.</p>\n<table>\n<thead>\n<tr>\n<th>Camada</th>\n<th>Responde</th>\n<th>Materializa em</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Contexto</strong></td>\n<td>o que este repositório é e quais regras valem</td>\n<td><code>AGENTS.md</code>, <code>docs/rules/</code></td>\n</tr>\n<tr>\n<td><strong>Procedimento</strong></td>\n<td>como executar uma tarefa recorrente do jeito certo</td>\n<td>skills, comandos, scripts</td>\n</tr>\n<tr>\n<td><strong>Verificação</strong></td>\n<td>o que precisa ser verdade antes de avançar</td>\n<td>hooks, CI, políticas de merge</td>\n</tr>\n<tr>\n<td><strong>Permissão</strong></td>\n<td>o que este agente pode tocar e o que exige gente</td>\n<td><code>CODEOWNERS</code>, settings, ambientes</td>\n</tr>\n<tr>\n<td><strong>Evidência</strong></td>\n<td>como provar depois que estava correto</td>\n<td>evidence pack, logs, artefatos</td>\n</tr>\n</tbody>\n</table>\n<p>A maturidade do harness é teto da autonomia, nunca consequência dela. O detalhamento — estrutura de arquivos, conteúdo de cada camada, o que muda com Agent Teams, níveis <code>HL0–HL3</code> e checklist de conformidade — está em <a href=\"#docs-repo-harness\">repo harness</a>. A escada de gates está em <a href=\"#docs-operating-model-90-10~6-arquitetura-de-gates\">modelo operacional 90/10</a>.</p>\n<h3 id=\"docs-operating-model~123-skills\">12.3 Skills</h3>\n<p>Skills nativas do Agent Team, em <a href=\"../skills\" class=\"ext\" title=\"skills — arquivo do repositório\"><code>skills/</code></a>:</p>\n<table>\n<thead>\n<tr>\n<th>Grupo</th>\n<th>Skills</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Discovery, especificação e planejamento</td>\n<td><code>business-discovery</code>, <code>technical-discovery</code>, <code>write-feature</code>, <code>review-prd</code>, <code>create-spec</code>, <code>review-spec</code>, <code>review-cross-prd-spec</code>, <code>refine-spec</code></td>\n</tr>\n<tr>\n<td>Implementação e validação</td>\n<td><code>implement</code>, <code>dev-flow</code>, <code>fix-bug</code>, <code>analyse-bug</code>, <code>test-integration-local</code></td>\n</tr>\n<tr>\n<td>Revisão, publicação e documentação</td>\n<td><code>code-review</code>, <code>commit</code>, <code>update-pr</code>, <code>check-pr</code>, <code>update-docs</code></td>\n</tr>\n<tr>\n<td>Operação do workspace</td>\n<td><code>workspace-memory</code>, <code>workspace-projects</code>, <code>workspace-board</code></td>\n</tr>\n</tbody>\n</table>\n<p>Extensões recomendadas, ainda não implementadas: intake e deduplicação; pesquisa e síntese de UX; threat modeling e privacidade; migração, rollout e rollback; incident response e post-mortem; telemetria e avaliação de agentes; atualização e verificação de documentação.</p>\n<p>Toda skill declara objetivo, inputs, outputs, tools permitidas, critérios de parada, exemplos e testes.</p>\n<h3 id=\"docs-operating-model~124-regras-para-gates-baseados-em-ia\">12.4 Regras para gates baseados em IA</h3>\n<p>IA pode recomendar, explicar e priorizar achados — mas bloqueio automático exige regra reproduzível e evidência verificável, e achado probabilístico exige confirmação independente. O mesmo agente não produz e aprova sozinho a própria mudança, e agentes não alteram gates dentro do mesmo fluxo avaliado.</p>\n<p>Mudança em rules, hooks ou CI eleva o risco automaticamente. Qualquer bypass exige pessoa autorizada, motivo, validade e plano de correção.</p>\n<h3 id=\"docs-operating-model~125-tools-por-capacidade\">12.5 Tools por capacidade</h3>\n<p>As ferramentas são opções de implementação; o contrato do fluxo não deve depender de uma marca específica.</p>\n<table>\n<thead>\n<tr>\n<th>Capacidade</th>\n<th>Opções de implementação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Gestão, decisão e colaboração</td>\n<td>backlog e roadmap (Linear, Jira, GitHub Projects); documentos e decisões (Markdown no repositório, Obsidian, Notion); comunicação (Slack, Teams); ADRs versionados e decision log</td>\n</tr>\n<tr>\n<td>Pesquisa, experiência e design</td>\n<td>repositório de research ou Dovetail; Figma, FigJam ou Penpot; Storybook e tokens versionados; testes de usabilidade, axe/Lighthouse e regressão visual</td>\n</tr>\n<tr>\n<td>Código e compreensão da codebase</td>\n<td>LSP, lint e formatação; typecheck e análise estática; Serena; Dora; busca estrutural, grafo de dependências e análise arquitetural; ambientes reproduzíveis e containers</td>\n</tr>\n<tr>\n<td>Redução e gestão de contexto</td>\n<td>RTK; índices de codebase e recuperação semântica autorizada; compactação de logs e evidence packs; budgets de contexto, tokens e custo por fase</td>\n</tr>\n<tr>\n<td>Qualidade e segurança</td>\n<td>frameworks de teste e mutation testing; SAST/code scanning (CodeQL); secret scanning; dependency review, SBOM e licenças; DAST e testes de contrato; policy as code</td>\n</tr>\n<tr>\n<td>CI/CD e operação</td>\n<td>GitHub Actions, GitLab CI ou Buildkite; preview environments e IaC; feature flags e rollout gradual; artifact registry e attestation; canary e rollback automatizado</td>\n</tr>\n<tr>\n<td>Observabilidade e telemetria</td>\n<td>OpenTelemetry; backend de observabilidade (Grafana stack, Datadog, New Relic); error tracking (Sentry); product analytics (PostHog, Amplitude); avaliação de prompts/agentes; dashboards de custo, qualidade, autonomia e fluxo</td>\n</tr>\n<tr>\n<td>Portal e conhecimento</td>\n<td>Backstage Software Catalog/TechDocs ou equivalente para ownership, catálogo e descoberta em escala</td>\n</tr>\n</tbody>\n</table>\n<p>Os artefatos que constituem o conhecimento do produto são fixos, independentemente da ferramenta escolhida:</p>\n<table>\n<thead>\n<tr>\n<th>Artefato</th>\n<th>Responde</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>PRD.md</code></td>\n<td>por que e o que será entregue</td>\n</tr>\n<tr>\n<td>Especificação de UX</td>\n<td>jornada, fluxo, estados, conteúdo e acessibilidade</td>\n</tr>\n<tr>\n<td><code>SPEC.md</code></td>\n<td>comportamento e contratos esperados</td>\n</tr>\n<tr>\n<td><code>ADR.md</code></td>\n<td>decisões e consequências arquiteturais</td>\n</tr>\n<tr>\n<td><code>AGENTS.md</code></td>\n<td>instruções operacionais para agentes</td>\n</tr>\n<tr>\n<td><code>README.md</code></td>\n<td>uso, execução e visão geral do repositório</td>\n</tr>\n<tr>\n<td>Histórico de PRs</td>\n<td>mudanças, evidências e decisões locais</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model~126-contrato-de-avaliação-de-uma-ferramenta\">12.6 Contrato de avaliação de uma ferramenta</h3>\n<p>Antes de adotar qualquer ferramenta, registre: problema que resolve e owner; etapa, input e output atendidos; integração com fontes canônicas; permissões, dados enviados e retenção; custo financeiro e cognitivo; API, automação e exportabilidade; evidência produzida e capacidade de auditoria; lock-in e plano de saída; métrica de sucesso e data de revisão.</p>\n<h3 id=\"docs-operating-model~127-referências-oficiais\">12.7 Referências oficiais</h3>\n<ul>\n<li><a href=\"https://docs.github.com/en/actions/concepts/workflows-and-actions/workflows\">GitHub Actions — workflows</a></li>\n<li><a href=\"https://docs.github.com/en/code-security/concepts/code-scanning/codeql/codeql-code-scanning\">GitHub CodeQL — code scanning</a></li>\n<li><a href=\"https://docs.github.com/en/code-security/concepts/supply-chain-security/supply-chain-security\">GitHub — segurança da cadeia de suprimentos</a></li>\n<li><a href=\"https://opentelemetry.io/docs/specs/otel/metrics/\">OpenTelemetry — métricas e correlação entre sinais</a></li>\n<li><a href=\"https://backstage.io/docs/features/software-catalog/\">Backstage — Software Catalog</a></li>\n<li><a href=\"https://backstage.io/docs/features/techdocs/\">Backstage — TechDocs</a></li>\n</ul>\n<p>Essas referências sustentam as capacidades sugeridas; não constituem decisão de adoção. A escolha passa pelo contrato de avaliação acima.</p>\n<hr>\n<h2 id=\"docs-operating-model~13-governança-e-segurança\">13. Governança e segurança</h2>\n<p>A governança do modelo se apoia em três camadas. A camada de <strong>acesso</strong> define permissões mínimas por agente e por etapa, exige aprovação humana para ações irreversíveis ou externas, mantém segredos fora de prompts, logs e artefatos, e minimiza, protege e retém dados pessoais por política.</p>\n<p>A camada de <strong>rastreabilidade</strong> liga demanda, decisão, código e evidência, e registra autoria, ferramentas, modelos e versões utilizadas. A camada de <strong>contenção</strong> define critérios claros para interromper, escalar ou pedir decisão, documenta exceções com prazo e responsável, segrega produção, validação e aprovação, mantém kill switch e revogação de credenciais, e audita periodicamente as permissões de agentes e integrações.</p>\n<h3 id=\"docs-operating-model~131-contrato-de-escalonamento\">13.1 Contrato de escalonamento</h3>\n<p>Um agente para e escala quando encontra requisito contraditório ou sem owner, confiança abaixo do limite definido, duas ou mais tentativas de correção sem progresso, mudança fora do escopo aprovado, necessidade de nova permissão ou acesso externo, falha não reproduzível ou evidência inconsistente, decisão irreversível ou impacto não calculável, ou divergência entre agentes sem critério objetivo de desempate.</p>\n<hr>\n<h2 id=\"docs-operating-model~14-classificação-de-risco-e-autonomia\">14. Classificação de risco e autonomia</h2>\n<h3 id=\"docs-operating-model~141-classes-de-risco\">14.1 Classes de risco</h3>\n<table>\n<thead>\n<tr>\n<th>Classe</th>\n<th>Caracteriza</th>\n<th>Exige</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>R0 — mínimo</strong></td>\n<td>documentação, texto e formatação; sem mudança de comportamento, dados, secrets ou contratos</td>\n<td>merge automático após gates; review humano por amostragem</td>\n</tr>\n<tr>\n<td><strong>R1 — baixo</strong></td>\n<td>refatoração interna ou mudança localizada, coberta por testes existentes, sem migração, segurança ou integração crítica</td>\n<td>aprovação curta; deploy automático com observação</td>\n</tr>\n<tr>\n<td><strong>R2 — médio</strong></td>\n<td>novo comportamento ou mudança de contrato interno/integração; impacto reversível mas relevante</td>\n<td>aprovação de produto ou Code Owner; canary e rollback</td>\n</tr>\n<tr>\n<td><strong>R3 — alto</strong></td>\n<td>dados persistidos, migrações, contratos públicos, autenticação, privacidade, pagamentos ou operação crítica</td>\n<td>aprovações humana de produto e técnica antes de produção</td>\n</tr>\n<tr>\n<td><strong>R4 — crítico</strong></td>\n<td>impacto regulatório, financeiro, destrutivo ou de grande alcance</td>\n<td>plano de mudança e rollback revisados manualmente; dupla aprovação, segregação de função e acompanhamento humano</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Regras de classificação.</strong> Um agente propõe o risco e outro tenta elevá-lo; o maior risco justificado prevalece. Redução manual exige justificativa registrada, mudança de escopo recalcula o risco, paths sensíveis elevam risco automaticamente, e dúvida não resolvida impede R0/R1.</p>\n<h3 id=\"docs-operating-model~142-autonomia-progressiva\">14.2 Autonomia progressiva</h3>\n<table>\n<thead>\n<tr>\n<th>Nível</th>\n<th>Significa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>A0 — assistido</strong></td>\n<td>pessoas aprovam todas as transições</td>\n</tr>\n<tr>\n<td><strong>A1 — execução autônoma</strong></td>\n<td>agentes executam; pessoas aprovam decisões e merge</td>\n</tr>\n<tr>\n<td><strong>A2 — merge por risco</strong></td>\n<td>R0/R1 podem integrar por política</td>\n</tr>\n<tr>\n<td><strong>A3 — entrega autônoma controlada</strong></td>\n<td>baixo risco chega à produção com rollback comprovado</td>\n</tr>\n<tr>\n<td><strong>A4 — orientado a exceções</strong></td>\n<td>fluxo saudável ocorre sem intervenção; pessoas tratam decisões e anomalias</td>\n</tr>\n</tbody>\n</table>\n<p>Elevar autonomia exige, simultaneamente: histórico suficiente, baixa taxa de falha, gates confiáveis, poucos falsos positivos, rollback testado e telemetria íntegra. Nenhum desses critérios sozinho autoriza a subida.</p>\n<hr>\n<h1 id=\"docs-operating-model~parte-v--evolução\">Parte V — Evolução</h1>\n<h2 id=\"docs-operating-model~15-fases-de-adoção\">15. Fases de adoção</h2>\n<table>\n<thead>\n<tr>\n<th>Fase</th>\n<th>Objetivo</th>\n<th>Movimentos principais</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>1 — Piloto assistido</strong></td>\n<td>provar o contrato</td>\n<td>um repositório e fluxo de baixo risco; papéis, artefatos e gates mínimos; aprovação humana em todas as transições; medir tempo, retrabalho, custo e falhas</td>\n</tr>\n<tr>\n<td><strong>2 — Padronização</strong></td>\n<td>tornar repetível</td>\n<td>templates reutilizáveis; consolidar rules, skills, hooks e PR template; critérios comuns de entrada e saída; exceções documentadas por tipo de repositório; instituir as cerimônias do trio</td>\n</tr>\n<tr>\n<td><strong>3 — Automação</strong></td>\n<td>reduzir intervenção</td>\n<td>roteamento automático entre agentes; gates por risco e paths; atualização automática de status, artefatos e evidências; telemetria ponta a ponta; escalar para pessoas somente decisões e exceções</td>\n</tr>\n<tr>\n<td><strong>4 — Escala e melhoria contínua</strong></td>\n<td>ampliar com segurança</td>\n<td>expandir para outros times e repositórios; comparar fluxos sem ranking simplista; evoluir skills a partir de falhas recorrentes; revisar semanalmente regras, métricas e conhecimento; elevar autonomia por evidência</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-operating-model~16-métricas-iniciais-do-modelo\">16. Métricas iniciais do modelo</h2>\n<p>As métricas orientam investigação. <strong>Nenhuma delas, isoladamente, representa produtividade ou qualidade do trio</strong> — e usar uma delas como meta individual corrompe o sinal.</p>\n<table>\n<thead>\n<tr>\n<th>Dimensão</th>\n<th>Métricas</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fluxo</td>\n<td>lead time (backlog→homologação); cycle time (implementação→merge); aprovação na primeira revisão e por gate; retrabalho após validação ou homologação</td>\n</tr>\n<tr>\n<td>Qualidade</td>\n<td>defeitos e regressões após entrega; cobertura dos critérios de aceite; falsos positivos por gate</td>\n</tr>\n<tr>\n<td>Automação</td>\n<td>% de gates automatizados; % de trabalho autônomo por classe de risco; falhas, retries e escalonamentos por fase</td>\n</tr>\n<tr>\n<td>Custo humano</td>\n<td>tempo humano em exceções e aprovações; custo por etapa, agente, modelo e entrega</td>\n</tr>\n<tr>\n<td>Conhecimento</td>\n<td>atualidade e uso da base de conhecimento; qualidade e completude do evidence pack</td>\n</tr>\n<tr>\n<td>Resultado</td>\n<td>outcome e adoção por entrega</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-operating-model~17-decisões-ainda-em-aberto\">17. Decisões ainda em aberto</h2>\n<p>Estas pendências são reconhecidas e não bloqueiam o piloto, mas devem ser fechadas antes de escalar:</p>\n<table>\n<thead>\n<tr>\n<th>Tema</th>\n<th>Pendência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Orquestração</td>\n<td>ferramenta que orquestrará o Agent Team</td>\n</tr>\n<tr>\n<td>Autonomia</td>\n<td>limites de autonomia de cada papel</td>\n</tr>\n<tr>\n<td>Artefatos</td>\n<td>formato canônico e ciclo de vida</td>\n</tr>\n<tr>\n<td>Risco</td>\n<td>critério de risco por tipo de mudança; gates obrigatórios por linguagem e repositório</td>\n</tr>\n<tr>\n<td>Exceções</td>\n<td>responsável por aprovar exceção fora do trio</td>\n</tr>\n<tr>\n<td>Ambientes</td>\n<td>estratégia para integração e homologação</td>\n</tr>\n<tr>\n<td>Medição</td>\n<td>como medir custo, qualidade e ganho de produtividade</td>\n</tr>\n<tr>\n<td>Distribuição</td>\n<td>como versionar e distribuir rules e skills compartilhadas</td>\n</tr>\n<tr>\n<td>Telemetria</td>\n<td>onde ficará a fonte canônica</td>\n</tr>\n<tr>\n<td>Registro</td>\n<td>qual ferramenta será sistema de registro para backlog e decisões</td>\n</tr>\n<tr>\n<td>Dados</td>\n<td>política de retenção das sessões e dados dos agentes</td>\n</tr>\n<tr>\n<td>Processo</td>\n<td>quais cerimônias podem ser eliminadas após maturidade comprovada</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-operating-model~18-próximos-passos-para-o-piloto-de-três-pessoas\">18. Próximos passos para o piloto de três pessoas</h2>\n<ol>\n<li>Escolher o repositório e um caso R1 real.</li>\n<li>Nomear PM, UX e Tech Lead e registrar seus direitos de decisão.</li>\n<li>Mapear o fluxo atual e os principais gargalos.</li>\n<li>Definir o conjunto mínimo de agentes e permissões.</li>\n<li>Criar templates mínimos de <code>PB</code>, <code>PRD</code>, UX spec, <code>SPEC</code> e evidence pack.</li>\n<li>Implementar gates essenciais no repo harness.</li>\n<li>Instrumentar IDs, eventos, custo, duração e resultados dos gates.</li>\n<li>Executar um ciclo completo de ponta a ponta.</li>\n<li>Realizar H6 com dados do ciclo e criar no máximo três melhorias prioritárias.</li>\n<li>Repetir por três ciclos antes de elevar autonomia ou adicionar cerimônias.</li>\n</ol>\n<hr>\n<h2 id=\"docs-operating-model~resultado-esperado\">Resultado esperado</h2>\n<p>O trio mantém autoridade clara sobre produto, experiência e tecnologia, enquanto os agentes absorvem a maior parte da pesquisa operacional, produção, crítica, execução, validação e documentação.</p>\n<p>O sistema não depende de heroísmo nem de contexto oral: cada passagem possui contrato, cada decisão possui owner, cada entrega possui evidência e cada ciclo deixa o próximo mais seguro, rápido e autônomo.</p>", "toc": [{"level": 2, "id": "docs-operating-model~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-operating-model~mapa-do-documento", "text": "Mapa do documento"}, {"level": 2, "id": "docs-operating-model~1-propósito", "text": "1. Propósito"}, {"level": 2, "id": "docs-operating-model~2-princípios-operacionais", "text": "2. Princípios operacionais"}, {"level": 2, "id": "docs-operating-model~3-modelo-de-atuação-dos-agent-teams", "text": "3. Modelo de atuação dos Agent Teams"}, {"level": 3, "id": "docs-operating-model~31-estrutura-mínima-de-uma-missão", "text": "3.1 Estrutura mínima de uma missão"}, {"level": 2, "id": "docs-operating-model~4-o-trio-humano", "text": "4. O trio humano"}, {"level": 3, "id": "docs-operating-model~41-product-manager--dono-do-valor-e-da-prioridade", "text": "4.1 Product Manager — dono do valor e da prioridade"}, {"level": 3, "id": "docs-operating-model~42-ux--dono-da-experiência-e-da-evidência-sobre-o-usuário", "text": "4.2 UX — dono da experiência e da evidência sobre o usuário"}, {"level": 3, "id": "docs-operating-model~43-tech-lead--dono-da-integridade-técnica-e-do-risco-operacional", "text": "4.3 Tech Lead — dono da integridade técnica e do risco operacional"}, {"level": 3, "id": "docs-operating-model~44-responsabilidade-compartilhada", "text": "4.4 Responsabilidade compartilhada"}, {"level": 2, "id": "docs-operating-model~5-direitos-de-decisão", "text": "5. Direitos de decisão"}, {"level": 3, "id": "docs-operating-model~51-regra-de-desempate", "text": "5.1 Regra de desempate"}, {"level": 2, "id": "docs-operating-model~6-contrato-de-passagem-entre-os-três-profissionais", "text": "6. Contrato de passagem entre os três profissionais"}, {"level": 3, "id": "docs-operating-model~61-definition-of-ready-para-execução-agentica", "text": "6.1 Definition of Ready para execução agentica"}, {"level": 3, "id": "docs-operating-model~62-definition-of-done-do-ciclo", "text": "6.2 Definition of Done do ciclo"}, {"level": 2, "id": "docs-operating-model~7-cerimônias-humanas", "text": "7. Cerimônias humanas"}, {"level": 3, "id": "docs-operating-model~71-ritmo-contínuo", "text": "7.1 Ritmo contínuo"}, {"level": 3, "id": "docs-operating-model~72-marcos-de-decisão-h1h6", "text": "7.2 Marcos de decisão H1–H6"}, {"level": 3, "id": "docs-operating-model~73-revisões-periódicas", "text": "7.3 Revisões periódicas"}, {"level": 2, "id": "docs-operating-model~8-ciclo-de-desenvolvimento-de-ponta-a-ponta", "text": "8. Ciclo de desenvolvimento de ponta a ponta"}, {"level": 3, "id": "docs-operating-model~80-intake-e-triagem-de-backlog", "text": "8.0 Intake e triagem de backlog"}, {"level": 3, "id": "docs-operating-model~81-discovery", "text": "8.1 Discovery"}, {"level": 3, "id": "docs-operating-model~82-planejamento-de-produto-e-experiência", "text": "8.2 Planejamento de produto e experiência"}, {"level": 3, "id": "docs-operating-model~83-especificação-técnica", "text": "8.3 Especificação técnica"}, {"level": 3, "id": "docs-operating-model~84-implementação", "text": "8.4 Implementação"}, {"level": 3, "id": "docs-operating-model~85-validação-adversarial", "text": "8.5 Validação adversarial"}, {"level": 3, "id": "docs-operating-model~86-code-review-pr-e-decisão-de-merge", "text": "8.6 Code review, PR e decisão de merge"}, {"level": 3, "id": "docs-operating-model~87-homologação", "text": "8.7 Homologação"}, {"level": 3, "id": "docs-operating-model~88-entrega-e-observação", "text": "8.8 Entrega e observação"}, {"level": 3, "id": "docs-operating-model~89-atualização-da-base-de-conhecimento", "text": "8.9 Atualização da base de conhecimento"}, {"level": 2, "id": "docs-operating-model~10-telemetria-e-melhoria-contínua--auto-dream", "text": "10. Telemetria e melhoria contínua — Auto Dream"}, {"level": 3, "id": "docs-operating-model~101-por-que-telemetria-e-melhoria", "text": "10.1 Por que \"Telemetria e melhoria\""}, {"level": 3, "id": "docs-operating-model~102-eventos-e-correlação-mínima", "text": "10.2 Eventos e correlação mínima"}, {"level": 3, "id": "docs-operating-model~103-entradas-do-ciclo", "text": "10.3 Entradas do ciclo"}, {"level": 3, "id": "docs-operating-model~104-pipeline-automatizado", "text": "10.4 Pipeline automatizado"}, {"level": 3, "id": "docs-operating-model~105-loop-a--aprendizado-validado", "text": "10.5 Loop A — aprendizado validado"}, {"level": 3, "id": "docs-operating-model~106-loop-b--falha-ou-oportunidade-de-melhoria", "text": "10.6 Loop B — falha ou oportunidade de melhoria"}, {"level": 3, "id": "docs-operating-model~107-painel-mínimo-do-trio", "text": "10.7 Painel mínimo do trio"}, {"level": 3, "id": "docs-operating-model~108-saídas-e-encerramento", "text": "10.8 Saídas e encerramento"}, {"level": 3, "id": "docs-operating-model~109-falhas-do-próprio-ciclo", "text": "10.9 Falhas do próprio ciclo"}, {"level": 2, "id": "docs-operating-model~11-evidence-pack-apresentado-às-pessoas", "text": "11. Evidence pack apresentado às pessoas"}, {"level": 2, "id": "docs-operating-model~12-repo-harness", "text": "12. Repo harness"}, {"level": 3, "id": "docs-operating-model~121-papel", "text": "12.1 Papel"}, {"level": 3, "id": "docs-operating-model~122-as-cinco-camadas", "text": "12.2 As cinco camadas"}, {"level": 3, "id": "docs-operating-model~123-skills", "text": "12.3 Skills"}, {"level": 3, "id": "docs-operating-model~124-regras-para-gates-baseados-em-ia", "text": "12.4 Regras para gates baseados em IA"}, {"level": 3, "id": "docs-operating-model~125-tools-por-capacidade", "text": "12.5 Tools por capacidade"}, {"level": 3, "id": "docs-operating-model~126-contrato-de-avaliação-de-uma-ferramenta", "text": "12.6 Contrato de avaliação de uma ferramenta"}, {"level": 3, "id": "docs-operating-model~127-referências-oficiais", "text": "12.7 Referências oficiais"}, {"level": 2, "id": "docs-operating-model~13-governança-e-segurança", "text": "13. Governança e segurança"}, {"level": 3, "id": "docs-operating-model~131-contrato-de-escalonamento", "text": "13.1 Contrato de escalonamento"}, {"level": 2, "id": "docs-operating-model~14-classificação-de-risco-e-autonomia", "text": "14. Classificação de risco e autonomia"}, {"level": 3, "id": "docs-operating-model~141-classes-de-risco", "text": "14.1 Classes de risco"}, {"level": 3, "id": "docs-operating-model~142-autonomia-progressiva", "text": "14.2 Autonomia progressiva"}, {"level": 2, "id": "docs-operating-model~15-fases-de-adoção", "text": "15. Fases de adoção"}, {"level": 2, "id": "docs-operating-model~16-métricas-iniciais-do-modelo", "text": "16. Métricas iniciais do modelo"}, {"level": 2, "id": "docs-operating-model~17-decisões-ainda-em-aberto", "text": "17. Decisões ainda em aberto"}, {"level": 2, "id": "docs-operating-model~18-próximos-passos-para-o-piloto-de-três-pessoas", "text": "18. Próximos passos para o piloto de três pessoas"}, {"level": 2, "id": "docs-operating-model~resultado-esperado", "text": "Resultado esperado"}], "text": " agent team — sistema operacional do trio humano visão canônica do agent team: como um núcleo de product manager, ux e tech lead dirige agentes especializados do backlog à produção sem perder controle, evidência ou rastreabilidade. em 2 minutos quando agentes de ia assumem a produção de código, o gargalo se desloca. escrever deixa de ser caro; o que fica caro é decidir o que construir, provar que foi construído certo e impedir que decisões, código e documentação se separem. um time pequeno que não trata esse deslocamento acaba gerando volume sem confiança. o agent team responde com uma inversão: as três pessoas operam o sistema em vez de executar o trabalho. o trio define intenção, prioridade, risco e aprovação; agentes especializados pesquisam, especificam, implementam, criticam, validam e documentam dentro de escopo autorizado. nenhuma passagem entre fases acontece por conversa — cada uma tem entrada, saída, owner humano, gate e evidência, materializados em artefatos versionados. elemento o que é por que existe trio humano pm, ux e tech lead, cada um dono de um domínio evita decisão sem responsável agent team time temporário de agentes montado por fase especialização sem custo fixo de headcount agente adversarial instância independente que ataca a proposta quem produz não valida a própria mudança gate critério objetivo de passagem entre fases impede avanço sem evidência evidence pack pacote curto que sustenta uma decisão humana decidir sem reler sessões inteiras classe de risco (r0–r4) peso da mudança define quanto de autonomia é permitido nível de autonomia (a0–a4) quanto o sistema roda sem intervenção cresce só com histórico e gates confiáveis três regras sustentam o resto: quem propõe não é quem aprova; aprovação exige evidência explícita e silêncio nunca equivale a aprovação; autonomia só aumenta quando métricas e gates demonstram que é seguro. mapa do documento parte seções responde leia se você… i — fundamentos 1–3 para que o modelo existe e como agentes atuam quer entender a lógica antes dos detalhes ii — quem decide 4–7 papéis, direitos de decisão, handoffs e cerimônias vai assumir um dos três papéis iii — como o trabalho anda 8–11 o ciclo de ponta a ponta e o loop de melhoria vai executar ou instrumentar o fluxo iv — o que sustenta 12–14 harness, governança, risco e autonomia vai configurar o repositório e os gates para montar ou auditar um repositório operado por agentes, o detalhamento está em repo harness . | v — evolução | 15–18 | fases de adoção, métricas e pendências | vai implantar o modelo em um time | documentos vizinhos: modelo operacional 90/10 · repo harness · fluxo visual completo · fluxos por fase · workflows multiagente · catálogo de agentes · workspace do tech lead . parte i — fundamentos 1. propósito o objetivo do modelo é transformar uma necessidade de negócio em software validado por meio de um núcleo humano pequeno que dirige uma força de trabalho de agentes especializados. isso exige combinar agentes, pessoas e automações mantendo decisões, código e documentação sincronizados, produzir evidência em todas as etapas e escalar a entrega sem abrir mão de segurança e governança. duas consequências disso são intencionais. a primeira é que a atenção humana fica reservada para intenção, julgamento, risco e responsabilidade — não para execução repetitiva. a segunda é que execução, validação e coleta de evidências se tornam progressivamente autônomas, e o próprio sistema de trabalho melhora a cada ciclo. a divisão de trabalho que torna isso possível é a seguinte: ator dirige product manager valor, prioridade e resultado de negócio ux entendimento do usuário, experiência e qualidade de uso tech lead viabilidade, arquitetura, qualidade técnica e risco operacional agentes pesquisa, proposta, implementação, crítica, validação e documentação automações verificações determinísticas, bloqueios e rastreabilidade o trio não tenta executar manualmente todo o trabalho. ele opera o sistema que executa. 2. princípios operacionais os princípios abaixo resolvem, antecipadamente, as disputas mais comuns em um fluxo com agentes. estão agrupados por aquilo que protegem. autoridade e responsabilidade. pessoas definem prioridade, restrições, limites de autonomia e aprovação final; agentes executam trabalho especializado e produzem evidências. cada etapa tem entrada, saída, owner humano e critério de passagem. o responsável humano decide, o agente primário prepara e recomenda, e divergências relevantes entre agentes são resolvidas pelo owner humano do domínio. integridade da validação. quem produz uma mudança não é o único responsável por validá-la. a etapa termina com um artefato coerente, não com análises isoladas. uma mudança material invalida a aprovação relacionada, e ausência de resposta nunca equivale a aprovação. qualidade da decisão. aprovação humana deve receber síntese, alternativas, riscos e evidências — nunca contexto bruto. comunicação assíncrona é o padrão; reunião existe para decidir, não para narrar status. segurança da evolução. mudanças pequenas, reversíveis e rastreáveis reduzem risco e retrabalho. o repositório concentra regras e contexto executável do produto, o harness transforma padrões em verificações repetíveis, e a autonomia aumenta apenas quando métricas e gates demonstram segurança. 3. modelo de atuação dos agent teams cada fase pode acionar um time temporário de agentes especializados, dissolvido ao final. isso permite ter dezenas de especializações sem manter nenhuma delas ociosa. o catálogo de agentes define os contratos e limites de cada papel. a dinâmica interna do time é sempre a mesma. um agente primário conduz e consolida o artefato da fase, enquanto cada agente analisa o problema a partir de uma responsabilidade explícita. agentes adversariais procuram ambiguidades, gaps, riscos e suposições frágeis. as contribuições e divergências são registradas antes da consolidação, e o owner humano intervém apenas em decisão de valor, experiência, risco ou exceção — não em toda execução. o contexto passa entre fases por artefatos versionados e evidence packs. nenhum agente recebe acesso amplo: cada um opera com acesso mínimo, escopo delimitado e condição objetiva de parada. 3.1 estrutura mínima de uma missão toda missão entregue a um agente declara, no mínimo, os campos abaixo. missão sem esses campos não deve ser executada. campo define objetivo e resultado esperado o que a missão precisa produzir contexto e fontes canônicas onde está a verdade sobre o tema escopo e fora de escopo o limite da autonomia concedida artefato de entrada e de saída o que se lê e o que se escreve critérios de aceite como saber que terminou gates obrigatórios o que precisa passar antes de avançar ferramentas e permissões o que o agente pode acionar classe de risco quanto de verificação a mudança exige condição de escalonamento quando parar e chamar uma pessoa owner humano da decisão quem responde pelo resultado parte ii — quem decide 4. o trio humano cada papel é dono de um domínio e traz decisões próprias para a mesa. nenhum dos três é um \"tradutor\" passivo dos outros: eles constroem juntos o contrato que os agentes executarão. 4.1 product manager — dono do valor e da prioridade o pm responde pela pergunta \"vale a pena construir isto, agora, para este resultado?\". ele mantém visão, objetivos, outcomes e roadmap, ordena o backlog por valor, urgência, risco e aprendizado, e formula o problema antes de comprometer uma solução. também identifica stakeholders e restrições comerciais, define escopo, fora de escopo e critérios de sucesso, e garante rastreabilidade entre problema, investimento, entrega e resultado. na operação diária, cabe ao pm decidir avançar, ajustar, adiar ou encerrar um item; homologar valor com stakeholders e registrar pendências; priorizar melhorias originadas pela telemetria; e operar os agentes de intake, discovery, pesquisa, planejamento e validação de produto. recebe entrega estratégia e objetivos do negócio backlog ordenado e com owner necessidades de clientes e stakeholders objetivo e outcome esperado pesquisas e evidências de ux pb.md aprovado e prd.md consolidado métricas de produto e operação escopo e fora de escopo explícitos restrições, riscos e estimativas do tech lead métricas e critérios de sucesso feedback de homologação e produção decisões h1, h2 e aceite de produto incidentes, custo do fluxo e oportunidades prioridade das melhorias e comunicação de resultado não é responsabilidade exclusiva do pm: desenhar sozinho a experiência, definir arquitetura ou solução técnica, aprovar exceção técnica sem o tech lead, ou substituir evidência de usuário por opinião de stakeholder. 4.2 ux — dono da experiência e da evidência sobre o usuário o ux responde por \"isto resolve o problema de quem vai usar, e resolve bem?\". planeja e executa pesquisa proporcional ao risco, representa necessidades, contexto e limitações dos usuários, e mapeia jornadas, fluxos, tarefas e pontos de fricção. define princípios de experiência, conteúdo e interação, e especifica os estados nominal, vazio, loading, erro, permissão e recuperação — o conjunto que costuma ser esquecido e vira retrabalho. também garante acessibilidade, consistência e usabilidade, produz protótipos na fidelidade necessária para decidir, e valida hipóteses antes e depois da implementação. recebe entrega problema, segmento e outcome do pm evidência e sín s são pontos de decisão , não pontos de relato. preparação, análise, atualização de status e geração de artefatos ficam com os agentes e automações; a pessoa entra para decidir. os marcos h1 a h6 aparecem no ciclo da parte iii como gates com nome. 7.1 ritmo contínuo cerimônia cadência owner decide pulso assíncrono diário diária, ≤10 min de leitura trio o que está bloqueado e quem desbloqueia triagem e prioridade semanal, 30–45 min pm o que entra, o que sai e o que precisa de discovery o pulso diário é alimentado por agentes com estado do fluxo, mudanças, bloqueios, risco e decisões requeridas. a pauta cobre apenas bloqueios, novas informações e pedidos de decisão, e o resultado registra owners, prazo da decisão e replanejamento. não deve virar reunião diária de relato individual. a triagem recebe novos itens, métricas, feedback, incidentes, dependências e capacidade, e devolve backlog ordenado com owner, risco inicial e próximos discoveries. o gate é ter contexto, prioridade e responsável minimamente claros. 7.2 marcos de decisão h1–h6 marco cerimônia owner cadência gate h1 kickoff de discovery pm por oportunidade, 30–45 min missão, timebox e agentes definidos h2 refinamento de produto e experiência pm (ux co-owner) por item candidato, 45–60 min gaps críticos tratados e sucesso mensurável h3 revisão de solução e risco tech lead sob demanda, 30–60 min rastreabilidade e validação viável h4 review de entrega pm/ux/tech lead por critério por incremento, 20–30 min revisão aprovada, ci verde, sem bloqueadores h5 decisão de release tech lead (pm coaprova r3/r4) por release, 10–20 min ambiente, migração, observabilidade e rollback verificados h6 telemetria e melhoria trio, facilitação rotativa semanal, 45–60 min evidência rastreável e hipótese separada de aprendizado h1 — kickoff de discovery. parte do intake consolidado, evidências existentes e perguntas abertas. o pm traz problema, valor, stakeholders e outcome; o ux traz as lacunas sobre o usuário e o plano de pesquisa; o tech lead traz restrições, dependências e risco de viabilidade. sai com missão de discovery, pb.md inicial, agentes acionados e timebox. a decisão final é avançar, ajustar, adiar ou encerrar. h2 — refinamento de produto e experiência. a pergunta é \"é isto que construiremos, para quem e com qual resultado?\". entram pb.md , pesquisa, jornada, protótipo, prd proposto e crítica adversarial. saem prd.md , especificação de ux, critérios de aceite e escopo aprovado. h3 — revisão de solução e risco. obrigatória para adr, exceção ou risco elevado. entram plan.md , spec.md , adr, alternativas, threat model, plano de testes e crítica adversarial. o pm avalia impacto em outcome, prazo e escopo; o ux avalia impacto em jornada, conteúdo, acessibilidade e estados. saem decisão técnica, trade-offs aceitos, tarefas executáveis e riscos com owner. h4 — review de entrega. a pergunta é \"entrega o outcome acordado, funciona bem e pode ser integrada?\". entram demo preparada por agentes, evidence pack, critérios de aceite e mudanças desde h2/h3. saem aceite, ajustes, novos itens ou rejeição justificada. h5 — decisão de release. síncrona apenas quando o risco exigir. entram release candidate, risco, rollout, rollback, slos e sinais de saúde. saem liberar, pausar, reduzir exposição ou retornar à implementação. h6 — telemetria e melhoria. a pergunta é \"o sistema aprendeu corretamente e qual melhoria merece investimento?\". entram relatório de telemetria, padrões, incidentes, custo, feedback e propostas do auto dream. saem memória validada, demandas p0–p3, owners, experimentos e alterações de processo. 7.3 revisões periódicas a revisão mensal do sistema (60–90 min, trio mais sponsor ou enablement quando necessário) olha tendências de outcome, qualidade, fluxo, custo, autonomia e falsos positivos dos gates, e ajusta capacidade, políticas, ferramentas, gates e nível de autonomia. a regra que protege essa reunião: nunca usar uma métrica isolada para elevar autonomia. a quarterly outcome review (60–90 min, owner pm) revisa outcomes, estratégia, pesquisas, saúde técnica, custo e aprendizados acumulados, e define prioridades do próximo ciclo, apostas encerradas e capacidades a desenvolver. parte iii — como o trabalho anda 8. ciclo de desenvolvimento de ponta a ponta o ciclo tem dez etapas, cada uma com workflow próprio, owner humano, time de agentes e gate. a visão em diagrama está em fluxo da jornada ; o detalhamento por fase, em jornada por fases . # etapa owner humano agentes gate cerimônia 0 intake e triagem pm intake + product manager problema, prioridade e responsável claros triagem 1 discovery pm (ux e tl por domínio) product discovery team problema validado e viabilidade avaliada h1 2 produto e experiência pm / ux product planning team gaps tratados e critérios aprovados h2 3 especificação técnica tech lead technical specification team trade-offs registrados e tarefas executáveis h3 4 implementação tech lead por exceção orchestrator + software engineer verificações locais aprovadas — 5 validação adversarial tech lead (pm/ux por critério) qa, security, architecture, reviewer checklist completo, sem bloqueadores — 6 pr e merge tech lead ou code owner pr + reviewer ci verde e aprovações válidas h4 7 homologação pm / ux release + product validation critérios validados ou plano de correção — 8 entrega e observação tech lead (pm em r3/r4) release + observability janela pós-deploy sem regressão h5 9 curadoria de conhecimento owner do domínio alterado knowledge documentação atual e sem contradições — 8.0 intake e triagem de backlog registra, deduplica, contextualiza e prioriza necessidades. recebe problema, oportunidade, solicitação, feedback, incidente ou melhoria; valida campos, relaciona produto e repositório, identifica duplicidade e propõe risco. entrega work item priorizável com contexto inicial, owner e risco preliminar. 8.1 discovery compreende problema, usuário, contexto, valor e viabilidade inicial. o product discovery team reúne product manager agent, ux specification agent e tech lead discovery agent em investigação paralela: cada um registra hipóteses no seu domínio, o product manager agent sintetiza e os demais criticam a síntese. entrega pb.md com problema, usuários, jornada, valor, restrições e riscos, acompanhado de evidências e perguntas abertas. o gate exige problema validado, experiência desejada compreendida e viabilidade inicial avaliada. 8.2 planejamento de produto e experiência transforma o problema em proposta clara, testável e utilizável. o product planning team reúne product manager agent, ux specification agent e adversarial product manager agent, mais agentes de pesquisa, conteúdo ou prototipação quando necessários. a dinâmica é proposta → protótipo e especificação de ux → crítica adversarial → revisão → consolidação. entrega prd.md , jornada e fluxo desejados, wireframe ou protótipo na fidelidade necessária, estados, conteúdo e critérios de acessibilidade, e critérios de sucesso e aceite. o conteúdo mínimo do prd cobre objetivos, usuários, jornadas, escopo, fora de escopo, requisitos e métricas. 8.3 especificação técnica define como construir, validar, liberar e operar a solução. o technical specification team reúne specification tech lead agent e adversarial tech lead agent, com security, data ou platform agent quando o risco exigir. a dinâmica é especificação → revisão crítica → resposta aos gaps → decisão. artefato conteúdo plan.md estratégia de implementação adr.md decisões arquiteturais relevantes e consequências spec.md comportamento e contratos técnicos tasks.md unidades pequenas de execução checklist.md critérios verificáveis de aceite planos complementares testes, rollout, rollback e observabilidade conforme risco o gate exige gaps críticos tratados, trade-offs registrados e tarefas executáveis. 8.4 implementação implementa uma tarefa pequena por vez . o orchestrator agent distribui e os software engineer agents executam, apoiados pelo repo harness, pelas skills e pelas ferramentas de código. recebe tarefa, spec, critérios, contexto, permissões e gates; entrega código, testes, documentação, commits e evidências em um diff rastreável. a ação humana só ocorre diante de decisão, exceção ou escalonamento. 8.5 validação adversarial prova aderência à especificação e procura falhas que o autor não encontrou. agentes de validation/qa, security, architecture e reviewer executam testes, verificação de segurança, análise arquitetural, acessibilidade, regressão e mutation testing quando aplicável. entrega evidências vinculadas a cada critério e achados classificados. o gate exige checklist completo e ausência de bloqueadores. 8.6 code review, pr e decisão de merge avalia qualidade, risco, manutenibilidade e prontidão para integração. pr agent e reviewer agent analisam diff, commits, resultados de validação e evidence pack, cobrindo código, testes, impacto arquitetural, contratos e documentação. o gate exige revisão aprovada, ci verde, branch atualizada e aprovações válidas. 8.7 homologação confirma valor e comportamento em cenário representativo. release agent e product validation agent preparam preview, smoke, e2e, acessibilidade e demonstração, e coletam evidências. o pm responde por valor, o ux por experiência e o stakeholder participa quando necessário. o gate exige critérios de aceite validados ou plano de correção explícito. 8.8 entrega e observação libera com exposição controlada e prova saúde no uso real. release agent e observability agent conduzem deploy progressivo, feature flag quando aplicável, monitoramento e comparação com baseline. entrega versão liberada, sinais de saúde, changelog e — quando necessário — rollback ou pausa. o gate exige ambiente autorizado, migração compatível e janela pós-deploy sem regressão relevante. 8.9 atualização da base de conhecimento mantém a documentação alinhada ao produto real, de forma contínua e com revisão automatizada semanal. o knowledge agent consolida decisões, aprendizados e mudanças a partir de decisões, código, pr, homologação, release e incidentes, e procura contradições e obsolescência. o gate exige documentação atual, rastreável e sem contradições não resolvidas. 10. telemetria e melhoria contínua — auto dream esta é a etapa que fecha o ciclo sobre o próprio sistema de trabalho. o workflow de telemetria e melhoria contínua roda com coleta contínua, síntese semanal e execução extraordinária após incidente relevante. os agentes envolvidos são telemetry/observability agent, auto dream agent e um critic agent independente; o owner é o trio, e cada demanda retorna ao owner do domínio. a cerimônia associada é h6. o escopo é deliberadamente amplo: produto, ux, engenharia, agentes, prompts, processo, harness, skills, scripts, ferramentas, hooks, gates, documentação e arquitetura do workflow. 10.1 por que \"telemetria e melhoria\" \"auto dream\" descreve um mecanismo; \"telemetria e melhoria\" descreve o resultado operacional: enxergar como o sistema se comporta, distinguir sinal de ruído e converter evidência em aprendizado ou ação. sem telemetria, melhoria contínua vira opinião. sem retorno ao backlog e à memória, telemetria vira dashboard decorativo. 10.2 eventos e correlação mínima cada evento relevante carrega, quando aplicável, os campos abaixo. o padrão recomendado é instrumentar logs, métricas e traces correlacionáveis, com taxonomia versionada e política de retenção. dimensão campos identidade work_item_id , produto, repositório, session/run id, timestamp execução fase, agente, modelo, versão de prompt/skill, tool usada resultado input, output, status, retry, fallback, bloqueio, escalonamento custo duração, tokens, custo, tamanho de contexto verificação gate, resultado, evidência e duração decisão decisão humana, owner e motivo rastreio commit, pr, release, ambiente, classe de risco, nível de autonomia proteção anonimização e tratamento de dados sensíveis 10.3 entradas do ciclo o ciclo consome sessões e decisões dos agentes, evidence packs e feedbacks humanos, falhas, retries, bloqueios e escalonamentos, resultados de hooks, ci, homologação e deploy, incidentes, rollbacks e defeitos escapados, métricas de tempo, custo, qualidade, ux e autonomia, feedback de usuário e sinais de produto, e as demandas de melhoria geradas anteriormente. 10.4 pipeline automatizado coletar sessões e eventos continuamente. remover secrets e dados pessoais antes da análise. validar completude, correlação e qualidade dos dados. agrupar eventos por etapa, causa e tipo de impacto. identificar padrões recorrentes e ocorrências isoladas. comparar resultados com baseline e períodos anteriores. distinguir aprendizado reutilizável de problema operacional. procurar duplicidade, contradição e obsolescência na memória. produzir evidências e nível de confiança para cada conclusão. submeter conclusões a um critic agent independente. consolidar itens confirmados e manter hipóteses inconclusivas em observação. 10.5 loop a — aprendizado validado identifica o que funcionou, para quem e em qual contexto, e registra evidências, origem, data e condições de reutilização. antes de propor inclusão, atualização ou remoção no memory.md , verifica duplicidade, contradição e validade temporal. duas travas protegem esse loop: preferência isolada não vira regra global, e memória sensível exige aprovação humana. gate de memória: evidência vinculada à conclusão, escopo e contexto de aplicação explícitos, ausência de secrets ou dados pessoais, nenhuma contradição não resolvida, conhecimento acionável e reutilizável, e mudança sensível revisada por pessoa responsável. 10.6 loop b — falha ou oportunidade de melhoria descreve sintoma, impacto e etapa afetada; identifica causa provável e evidências; registra frequência e alcance; propõe ação corretiva e resultado esperado; gera demanda rastreável no backlog; relaciona sessões, execuções e incidentes de origem; e detecta e vincula duplicidades. os tipos de melhoria previstos cobrem produto ou experiência, processo ou cerimônia, harness, skill ou prompt, script, ferramenta ou integração, hook ou gate, arquitetura do workflow, documentação, contexto ou memória, e observabilidade, segurança ou custo. campo da demanda conteúdo título orientado ao problema sintoma e impacto o que se observa e o que custa evidências e frequência origem e recorrência hipótese de causa-raiz explicação candidata melhoria proposta ação corretiva critério de aceite mensurável prioridade e risco sugeridos p0–p3 e classe r owner recomendado quem deveria assumir links sessões e artefatos relacionados priorização. p0 é risco crítico, segurança ou perda de dados; p1, falha recorrente que bloqueia o fluxo; p2, retrabalho, custo ou baixa confiabilidade; p3, otimização incremental. frequência não substitui impacto. o auto dream recomenda, o owner humano decide e o pm ordena o backlog. 10.7 painel mínimo do trio dimensão owner indicadores produto e ux pm + ux outcome e adoção; conversão ou conclusão da tarefa principal; erros de usuário, abandono e tempo na tarefa; feedback qualitativo e defeitos de experiência; acessibilidade e critérios de ux não atendidos fluxo trio lead time (backlog→homologação); cycle time (implementação→merge); tempo por fase e tempo esperando decisão humana; aprovação na primeira passagem por gate; retrabalho após validação; bloqueios, retries e escalonamentos; % de gates automatizados; % de execução autônoma por classe de risco engenharia tech lead falhas de build, testes e ci; defeitos e regressões pós-entrega; cobertura dos critérios de aceite; change failure rate e tempo de recuperação; violações arquiteturais, segurança e dependências; falsos positivos e tempo gasto por gate agentes e custo trio tokens, custo e duração por fase, agente e entrega; taxa de sucesso sem intervenção; tentativas até conclusão; falhas por tool, skill, prompt e modelo; qualidade do evidence pack; tempo humano em exceções; atualidade e uso da base de conhecimento 10.8 saídas e encerramento o ciclo entrega memory.md atualizado com aprendizados validados, demandas de melhoria criadas ou enriquecidas no backlog, relatório semanal curto com padrões, tendências e qualidade dos dados, métricas do sistema atualizadas, hipóteses inconclusivas mantidas em observação, e experimentos com owner, baseline, prazo e critério de sucesso. gate de conclusão: fontes processadas e rastreáveis; qualidade e lacunas dos dados explícitas; aprendizados separados de hipóteses; falhas relevantes convertidas em demandas; duplicidades e contradições tratadas; mudanças sensíveis revisadas; nenhum dado confidencial persistido indevidamente. 10.9 falhas do próprio ciclo o ciclo precisa falhar de forma visível. falha de coleta abre alerta e impede conclusão silenciosamente parcial. baixa confiança mantém o item como hipótese. contradição bloqueia atualização automática da memória. demanda sem evidência permanece como rascunho. um agente não pode aprovar alteração nos próprios gates. e incidentes do auto dream entram no próximo ciclo de análise. 11. evidence pack apresentado às pessoas toda decisão humana recebe um pacote curto, desenhado para permitir decidir sem reler todas as sessões — mas preservando os links para auditoria. item conteúdo pergunta de decisão uma frase recomendação posição dos agentes alternativas opções consideradas e descartadas riscos e trade-offs o que se ganha e o que se aceita delta mudanças desde a última aprovação evidências resultado dos gates executados pendências exceções e nível de confiança impacto em produto, experiência e engenharia links artefatos completos, código e execução parte iv — o que sustenta 12. repo harness 12.1 papel o harness é o que torna o repositório compreensível para pessoas e agentes ao mesmo tempo. ele converte padrões de engenharia em regras executáveis, oferece caminhos seguros e repetíveis para mudanças, reduz a dependência de contexto informal ou individual, e produz feedback acionável e evidência auditável. distinguem-se dois harnesses, e confundi-los produz duplicidade silenciosa. o repo harness vive dentro de cada repositório de código e viaja junto com o clone; o workspace organiza o trabalho do agente fora do código. a regra de decisão é simples: se a informação continua verdadeira quando outro time clona o repositório, ela é harness. 12.2 as cinco camadas o repo harness se organiza em cinco camadas cumulativas. cada uma elimina uma classe de falha, e a ordem de construção segue o retorno decrescente — contexto é o mais barato e o que mais reduz retrabalho; evidência só tem valor quando existe algo verificado para registrar. camada responde materializa em contexto o que este repositório é e quais regras valem agents.md , docs/rules/ procedimento como executar uma tarefa recorrente do jeito certo skills, comandos, scripts verificação o que precisa ser verdade antes de avançar hooks, ci, políticas de merge permissão o que este agente pode tocar e o que exige gente codeowners , settings, ambientes evidência como provar depois que estava correto evidence pack, logs, artefatos a maturidade do harness é teto da autonomia, nunca consequência dela. o detalhamento — estrutura de arquivos, conteúdo de cada camada, o que muda com agent teams, níveis hl0–hl3 e checklist de conformidade — está em repo harness . a escada de gates está em modelo operacional 90/10 . 12.3 skills skills nativas do agent team, em skills/ : grupo skills discovery, especificação e planejamento business-discovery , technical-discovery , write-feature , review-prd , create-spec , review-spec , review-cross-prd-spec , refine-spec implementação e validação implement , dev-flow , fix-bug , analyse-bug , test-integration-local revisão, publicação e documentação code-review , commit , update-pr , check-pr , update-docs operação do workspace workspace-memory , workspace-projects , workspace-board extensões recomendadas, ainda não implementadas: intake e deduplicação; pesquisa e síntese de ux; threat modeling e privacidade; migração, rollout e rollback; incident response e post-mortem; telemetria e avaliação de agentes; atualização e verificação de documentação. toda skill declara objetivo, inputs, outputs, tools permitidas, critérios de parada, exemplos e testes. 12.4 regras para gates baseados em ia ia pode recomendar, explicar e priorizar achados — mas bloqueio automático exige regra reproduzível e evidência verificável, e achado probabilístico exige confirmação independente. o mesmo agente não produz e aprova sozinho a própria mudança, e agentes não alteram gates dentro do mesmo fluxo avaliado. mudança em rules, hooks ou ci eleva o risco automaticamente. qualquer bypass exige pessoa autorizada, motivo, validade e plano de correção. 12.5 tools por capacidade as ferramentas são opções de implementação; o contrato do fluxo não deve depender de uma marca específica. capacidade opções de implementação gestão, decisão e colaboração backlog e roadmap (linear, jira, github projects); documentos e decisões (markdown no repositório, obsidian, notion); comunicação (slack, teams); adrs versionados e decision log pesquisa, experiência e design repositório de research ou dovetail; figma, figjam ou penpot; storybook e tokens versionados; testes de usabilidade, axe/lighthouse e regressão visual código e compreensão da codebase lsp, lint e formatação; typecheck e análise estática; serena; dora; busca estrutural, grafo de dependências e análise arquitetural; ambientes reproduzíveis e containers redução e gestão de contexto rtk; índices de codebase e recuperação semântica autorizada; compactação de logs e evidence packs; budgets de contexto, tokens e custo por fase qualidade e segurança frameworks de teste e mutation testing; sast/code scanning (codeql); secret scanning; dependency review, sbom e licenças; dast e testes de contrato; policy as code ci/cd e operação github actions, gitlab ci ou buildkite; preview environments e iac; feature flags e rollout gradual; artifact registry e attestation; canary e rollback automatizado observabilidade e telemetria opentelemetry; backend de observabilidade (grafana stack, datadog, new relic); error tracking (sentry); product analytics (posthog, amplitude); avaliação de prompts/agentes; dashboards de custo, qualidade, autonomia e fluxo portal e conhecimento backstage software catalog/techdocs ou equivalente para ownership, catálogo e descoberta em escala os artefatos que constituem o conhecimento do produto são fixos, independentemente da ferramenta escolhida: artefato responde prd.md por que e o que será entregue especificação de ux jornada, fluxo, estados, conteúdo e acessibilidade spec.md comportamento e contratos esperados adr.md decisões e consequências arquiteturais agents.md instruções operacionais para agentes readme.md uso, execução e visão geral do repositório histórico de prs mudanças, evidências e decisões locais 12.6 contrato de avaliação de uma ferramenta antes de adotar qualquer ferramenta, registre: problema que resolve e owner; etapa, input e output atendidos; integração com fontes canônicas; permissões, dados enviados e retenção; custo financeiro e cognitivo; api, automação e exportabilidade; evidência produzida e capacidade de auditoria; lock-in e plano de saída; métrica de sucesso e data de revisão. 12.7 referências oficiais github actions — workflows github codeql — code scanning github — segurança da cadeia de suprimentos opentelemetry — métricas e correlação entre sinais backstage — software catalog backstage — techdocs essas referências sustentam as capacidades sugeridas; não constituem decisão de adoção. a escolha passa pelo contrato de avaliação acima. 13. governança e segurança a governança do modelo se apoia em três camadas. a camada de acesso define permissões mínimas por agente e por etapa, exige aprovação humana para ações irreversíveis ou externas, mantém segredos fora de prompts, logs e artefatos, e minimiza, protege e retém dados pessoais por política. a camada de rastreabilidade liga demanda, decisão, código e evidência, e registra autoria, ferramentas, modelos e versões utilizadas. a camada de contenção define critérios claros para interromper, escalar ou pedir decisão, documenta exceções com prazo e responsável, segrega produção, validação e aprovação, mantém kill switch e revogação de credenciais, e audita periodicamente as permissões de agentes e integrações. 13.1 contrato de escalonamento um agente para e escala quando encontra requisito contraditório ou sem owner, confiança abaixo do limite definido, duas ou mais tentativas de correção sem progresso, mudança fora do escopo aprovado, necessidade de nova permissão ou acesso externo, falha não reproduzível ou evidência inconsistente, decisão irreversível ou impacto não calculável, ou divergência entre agentes sem critério objetivo de desempate. 14. classificação de risco e autonomia 14.1 classes de risco classe caracteriza exige r0 — mínimo documentação, texto e formatação; sem mudança de comportamento, dados, secrets ou contratos merge automático após gates; review humano por amostragem r1 — baixo refatoração interna ou mudança localizada, coberta por testes existentes, sem migração, segurança ou integração crítica aprovação curta; deploy automático com observação r2 — médio novo comportamento ou mudança de contrato interno/integração; impacto reversível mas relevante aprovação de produto ou code owner; canary e rollback r3 — alto dados persistidos, migrações, contratos públicos, autenticação, privacidade, pagamentos ou operação crítica aprovações humana de produto e técnica antes de produção r4 — crítico impacto regulatório, financeiro, destrutivo ou de grande alcance plano de mudança e rollback revisados manualmente; dupla aprovação, segregação de função e acompanhamento humano regras de classificação. um agente propõe o risco e outro tenta elevá-lo; o maior risco justificado prevalece. redução manual exige justificativa registrada, mudança de escopo recalcula o risco, paths sensíveis elevam risco automaticamente, e dúvida não resolvida impede r0/r1. 14.2 autonomia progressiva nível significa a0 — assistido pessoas aprovam todas as transições a1 — execução autônoma agentes executam; pessoas aprovam decisões e merge a2 — merge por risco r0/r1 podem integrar por política a3 — entrega autônoma controlada baixo risco chega à produção com rollback comprovado a4 — orientado a exceções fluxo saudável ocorre sem intervenção; pessoas tratam decisões e anomalias elevar autonomia exige, simultaneamente: histórico suficiente, baixa taxa de falha, gates confiáveis, poucos falsos positivos, rollback testado e telemetria íntegra. nenhum desses critérios sozinho autoriza a subida. parte v — evolução 15. fases de adoção fase objetivo movimentos principais 1 — piloto assistido provar o contrato um repositório e fluxo de baixo risco; papéis, artefatos e gates mínimos; aprovação humana em todas as transições; medir tempo, retrabalho, custo e falhas 2 — padronização tornar repetível templates reutilizáveis; consolidar rules, skills, hooks e pr template; critérios comuns de entrada e saída; exceções documentadas por tipo de repositório; instituir as cerimônias do trio 3 — automação reduzir intervenção roteamento automático entre agentes; gates por risco e paths; atualização automática de status, artefatos e evidências; telemetria ponta a ponta; escalar para pessoas somente decisões e exceções 4 — escala e melhoria contínua ampliar com segurança expandir para outros times e repositórios; comparar fluxos sem ranking simplista; evoluir skills a partir de falhas recorrentes; revisar semanalmente regras, métricas e conhecimento; elevar autonomia por evidência 16. métricas iniciais do modelo as métricas orientam investigação. nenhuma delas, isoladamente, representa produtividade ou qualidade do trio — e usar uma delas como meta individual corrompe o sinal. dimensão métricas fluxo lead time (backlog→homologação); cycle time (implementação→merge); aprovação na primeira revisão e por gate; retrabalho após validação ou homologação qualidade defeitos e regressões após entrega; cobertura dos critérios de aceite; falsos positivos por gate automação % de gates automatizados; % de trabalho autônomo por classe de risco; falhas, retries e escalonamentos por fase custo humano tempo humano em exceções e aprovações; custo por etapa, agente, modelo e entrega conhecimento atualidade e uso da base de conhecimento; qualidade e completude do evidence pack resultado outcome e adoção por entrega 17. decisões ainda em aberto estas pendências são reconhecidas e não bloqueiam o piloto, mas devem ser fechadas antes de escalar: tema pendência orquestração ferramenta que orquestrará o agent team autonomia limites de autonomia de cada papel artefatos formato canônico e ciclo de vida risco critério de risco por tipo de mudança; gates obrigatórios por linguagem e repositório exceções responsável por aprovar exceção fora do trio ambientes estratégia para integração e homologação medição como medir custo, qualidade e ganho de produtividade distribuição como versionar e distribuir rules e skills compartilhadas telemetria onde ficará a fonte canônica registro qual ferramenta será sistema de registro para backlog e decisões dados política de retenção das sessões e dados dos agentes processo quais cerimônias podem ser eliminadas após maturidade comprovada 18. próximos passos para o piloto de três pessoas escolher o repositório e um caso r1 real. nomear pm, ux e tech lead e registrar seus direitos de decisão. mapear o fluxo atual e os principais gargalos. definir o conjunto mínimo de agentes e permissões. criar templates mínimos de pb , prd , ux spec, spec e evidence pack. implementar gates essenciais no repo harness. instrumentar ids, eventos, custo, duração e resultados dos gates. executar um ciclo completo de ponta a ponta. realizar h6 com dados do ciclo e criar no máximo três melhorias prioritárias. repetir por três ciclos antes de elevar autonomia ou adicionar cerimônias. resultado esperado o trio mantém autoridade clara sobre produto, experiência e tecnologia, enquanto os agentes absorvem a maior parte da pesquisa operacional, produção, crítica, execução, validação e documentação. o sistema não depende de heroísmo nem de contexto oral: cada passagem possui contrato, cada decisão possui owner, cada entrega possui evidência e cada ciclo deixa o próximo mais seguro, rápido e autônomo. "}, {"id": "docs-operating-model-90-10", "path": "docs/operating-model-90-10.md", "section": "Modelo operacional", "title": "Modelo 90/10: gates e autonomia", "status": "proposed", "updated": "2026-08-09", "html": "<h1 id=\"docs-operating-model-90-10~agent-team--modelo-operacional-9010\">Agent Team — modelo operacional 90/10</h1>\n<blockquote>\n<p>Como chegar a ~90% do trabalho operacional executado sem intervenção humana, mantendo 100% das decisões de risco sob responsabilidade de uma pessoa.</p>\n</blockquote>\n<h2 id=\"docs-operating-model-90-10~em-2-minutos\">Em 2 minutos</h2>\n<p>O modelo 90/10 é o desdobramento operacional do <a href=\"#docs-operating-model\">sistema operacional do trio humano</a>. Ele responde a uma pergunta específica: <strong>onde exatamente o humano entra, por quanto tempo, e o que ele precisa ver para decidir?</strong></p>\n<p>A resposta é substituir review de processo por review de decisão. Ninguém acompanha o diff inteiro nem lê o PRD linha por linha. Em cada checkpoint, o sistema entrega uma pergunta objetiva, a recomendação dos agentes, as alternativas descartadas, os riscos e as evidências dos gates — e a pessoa responde. São seis checkpoints em todo o ciclo, somando algo entre 30 e 45 minutos de tempo humano por entrega R1/R2.</p>\n<table>\n<thead>\n<tr>\n<th>Checkpoint</th>\n<th>Decisão</th>\n<th>Quando</th>\n<th style=\"text-align: right;\">Tempo esperado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>H1</strong></td>\n<td>Vale investir?</td>\n<td>após discovery</td>\n<td style=\"text-align: right;\">5–10 min</td>\n</tr>\n<tr>\n<td><strong>H2</strong></td>\n<td>É isto que construiremos?</td>\n<td>após PRD</td>\n<td style=\"text-align: right;\">10–15 min</td>\n</tr>\n<tr>\n<td><strong>H3</strong></td>\n<td>Aceitamos o trade-off?</td>\n<td>apenas ADR, exceção ou R3/R4</td>\n<td style=\"text-align: right;\">10–20 min</td>\n</tr>\n<tr>\n<td><strong>H4</strong></td>\n<td>Podemos integrar?</td>\n<td>antes do merge, conforme risco</td>\n<td style=\"text-align: right;\">5–15 min</td>\n</tr>\n<tr>\n<td><strong>H5</strong></td>\n<td>Podemos expor o risco?</td>\n<td>produção R3/R4</td>\n<td style=\"text-align: right;\">3–10 min</td>\n</tr>\n<tr>\n<td><strong>H6</strong></td>\n<td>O sistema aprendeu corretamente?</td>\n<td>ciclo semanal do Auto Dream</td>\n<td style=\"text-align: right;\">10–20 min</td>\n</tr>\n</tbody>\n</table>\n<p>O que sustenta esses números não é confiança no agente: é a <strong>arquitetura de gates</strong>. Cinco camadas de verificação — local, CI, merge, ambiente e pós-deploy — filtram tudo que é determinístico antes de qualquer pessoa ser chamada. A autonomia sobe de A0 a A4 apenas quando essas camadas demonstram baixo índice de falsos positivos e rollback confiável.</p>\n<hr>\n<h2 id=\"docs-operating-model-90-10~mapa-do-documento\">Mapa do documento</h2>\n<table>\n<thead>\n<tr>\n<th>Seção</th>\n<th>Responde</th>\n<th>Leia se você…</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~1-o-que-90-significa\">1. O que 90% significa</a></td>\n<td>O que o número mede e o que não mede</td>\n<td>quer evitar a leitura errada da meta</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~2-review-de-decisão\">2. Review de decisão</a></td>\n<td>Como o humano decide sem ler tudo</td>\n<td>vai desenhar o evidence pack</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~3-classificação-de-risco\">3. Classificação de risco</a></td>\n<td>R0 a R4 e o que cada classe exige</td>\n<td>vai definir política de aprovação</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~4-fluxo-operacional-de-ponta-a-ponta\">4. Fluxo operacional</a></td>\n<td>O que acontece em cada uma das 11 etapas</td>\n<td>vai operar o fluxo</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~5-como-reduzir-ainda-mais-os-reviews\">5. Reduzindo reviews</a></td>\n<td>Onde cortar intervenção com segurança</td>\n<td>já rodou alguns ciclos</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~6-arquitetura-de-gates\">6. Arquitetura de gates</a></td>\n<td>As cinco camadas de verificação</td>\n<td>vai configurar o harness</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~7-autonomia-progressiva\">7. Autonomia progressiva</a></td>\n<td>A0 a A4 e critérios de subida</td>\n<td>vai propor elevar autonomia</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~8-métricas-e-metas\">8. Métricas e metas</a></td>\n<td>Como saber se está funcionando</td>\n<td>vai instrumentar o fluxo</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model-90-10~9-implementação-do-modelo\">9. Implementação</a></td>\n<td>Em que ordem construir</td>\n<td>está começando do zero</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Vizinhos:</strong> <a href=\"#docs-operating-model\">sistema operacional do trio humano</a> · <a href=\"#docs-end-to-end-journey\">fluxo visual completo</a> · <a href=\"#docs-journey-by-phase\">fluxos por fase</a> · <a href=\"#docs-workflows-readme\">workflows multiagente</a>.</p>\n<p>As subseções do fluxo operacional indicam <strong>o que</strong> deve ser feito; os <a href=\"#docs-workflows-readme\">workflows</a> descrevem <strong>como</strong> os agentes colaboram, fazem handoff, criticam e consolidam cada saída.</p>\n<hr>\n<h2 id=\"docs-operating-model-90-10~1-o-que-90-significa\">1. O que 90% significa</h2>\n<p>O objetivo é automatizar aproximadamente 90% do trabalho operacional, reservando o tempo humano para decisões de valor, risco e responsabilidade. Agentes produzem, criticam, corrigem e comprovam o próprio trabalho; reviews extensos dão lugar a checkpoints curtos orientados a evidência; e a autonomia cresce à medida que o fluxo demonstra segurança.</p>\n<p>A leitura correta do número importa, porque a leitura errada destrói o modelo:</p>\n<table>\n<thead>\n<tr>\n<th>90% <strong>significa</strong></th>\n<th>90% <strong>não significa</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>90% das atividades executadas sem intervenção manual</td>\n<td>90% das decisões delegadas aos agentes</td>\n</tr>\n<tr>\n<td>Redução de tempo humano sem aumento de falhas, risco ou retrabalho</td>\n<td>Eliminação da responsabilidade humana sobre produto e produção</td>\n</tr>\n<tr>\n<td>Gates aplicados a todo trabalho autônomo</td>\n<td>Autorização para agentes ignorarem gates ou ampliarem o próprio acesso</td>\n</tr>\n<tr>\n<td>Medição por tempo e por resultado</td>\n<td>Medição apenas por quantidade de tarefas</td>\n</tr>\n</tbody>\n</table>\n<p>A divisão de responsabilidade que produz esse número: <strong>agentes</strong> fazem pesquisa, síntese, especificação, código, testes e evidências; <strong>automações</strong> fazem validações determinísticas, bloqueios e rastreabilidade; <strong>humanos</strong> definem prioridade, escolhas irreversíveis, exceções e aceite; e o <strong>sistema</strong> cuida de roteamento, registro, observação e escalonamento.</p>\n<hr>\n<h2 id=\"docs-operating-model-90-10~2-review-de-decisão\">2. Review de decisão</h2>\n<p>O princípio central é que o humano não revisa o processo — ele responde a uma pergunta objetiva. Para cada checkpoint, o sistema apresenta decisão recomendada, alternativas, riscos e evidências, com tempo esperado e critérios explícitos. Duas travas protegem o mecanismo: falta de resposta não equivale a aprovação, e mudança material invalida a aprovação relacionada.</p>\n<p>O evidence pack é o que torna isso viável. Ele contém:</p>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Decisão solicitada</td>\n<td>uma frase</td>\n</tr>\n<tr>\n<td>Recomendação</td>\n<td>posição dos agentes</td>\n</tr>\n<tr>\n<td>Alternativas</td>\n<td>opções consideradas e descartadas</td>\n</tr>\n<tr>\n<td>Riscos e trade-offs</td>\n<td>o que se aceita ao aprovar</td>\n</tr>\n<tr>\n<td>Delta</td>\n<td>mudanças desde o último checkpoint</td>\n</tr>\n<tr>\n<td>Evidências</td>\n<td>resultado dos gates executados</td>\n</tr>\n<tr>\n<td>Pendências</td>\n<td>exceções e nível de confiança</td>\n</tr>\n<tr>\n<td>Links</td>\n<td>artefatos completos, código e execução</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-operating-model-90-10~3-classificação-de-risco\">3. Classificação de risco</h2>\n<p>A classe de risco é o que determina quantas aprovações a mudança exige e quanto de automação ela pode usar.</p>\n<table>\n<thead>\n<tr>\n<th>Classe</th>\n<th>Caracteriza</th>\n<th>Aprovação e entrega</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>R0 — mínimo</strong></td>\n<td>documentação, texto e formatação; sem mudança de comportamento, dados, secrets ou contratos</td>\n<td>merge automático após gates; review humano por amostragem</td>\n</tr>\n<tr>\n<td><strong>R1 — baixo</strong></td>\n<td>refatoração interna ou mudança localizada, coberta por testes existentes; sem migração, segurança ou integração crítica</td>\n<td>uma aprovação humana curta no PR; deploy automático com observação</td>\n</tr>\n<tr>\n<td><strong>R2 — médio</strong></td>\n<td>novo comportamento de produto ou mudança de contrato interno/integração; impacto reversível mas relevante</td>\n<td>aprovação de produto ou Code Owner; canary e rollback automatizados</td>\n</tr>\n<tr>\n<td><strong>R3 — alto</strong></td>\n<td>dados persistidos, migrações, contratos públicos, autenticação, autorização, secrets, privacidade, pagamentos, disponibilidade ou operação crítica</td>\n<td>aprovações humana de produto e técnica; aprovação explícita antes de produção</td>\n</tr>\n<tr>\n<td><strong>R4 — crítico</strong></td>\n<td>impacto regulatório, financeiro ou destrutivo; ação irreversível ou de grande alcance</td>\n<td>plano de mudança e rollback revisados manualmente; dupla aprovação, segregação de função e acompanhamento humano durante a liberação</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Regras da classificação.</strong> Um agente propõe o risco e outro tenta elevá-lo; o maior risco justificado prevalece. Redução manual exige justificativa registrada, mudança de escopo recalcula o risco, paths sensíveis elevam risco automaticamente, e dúvida não resolvida impede classificação como R0 ou R1.</p>\n<hr>\n<h2 id=\"docs-operating-model-90-10~4-fluxo-operacional-de-ponta-a-ponta\">4. Fluxo operacional de ponta a ponta</h2>\n<h3 id=\"docs-operating-model-90-10~40-entrada-e-triagem\">4.0 Entrada e triagem</h3>\n<p>Intake Agent e Product Manager Agent recebem a solicitação. As automações validam campos obrigatórios, identificam duplicidade e dependências, relacionam demanda, produto e repositório, e classificam tipo e risco inicial. A saída é um Work Item com contexto, prioridade proposta e owner.</p>\n<p><strong>Gate automático:</strong> item completo, rastreável e sem duplicidade conhecida. <strong>Ação humana:</strong> priorizar ou rejeitar — 2 a 5 minutos.</p>\n<h3 id=\"docs-operating-model-90-10~41-discovery-multiagente\">4.1 Discovery multiagente</h3>\n<p>O Agent Team reúne Product Manager Agent, UX Specification Agent e Tech Lead Discovery Agent. Os três investigam em paralelo e registram hipóteses e evidências; o Product Manager Agent consolida o <code>PB.md</code> e os demais criticam a síntese.</p>\n<p>As automações validam a estrutura do <code>PB.md</code>, verificam links e fontes, detectam afirmações sem evidência, identificam perguntas e riscos sem owner, e comparam a descoberta com demandas similares.</p>\n<p><strong>Gate automático:</strong> problema, usuário, experiência e viabilidade cobertos.</p>\n<blockquote>\n<p><strong>H1 — vale avançar?</strong> Responsável: PM ou sponsor. Revisa problema, usuário, valo
