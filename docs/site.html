r, restrições e riscos. Decide avançar, ajustar, adiar ou encerrar. <strong>5–10 minutos.</strong></p>\n</blockquote>\n<h3 id=\"docs-operating-model-90-10~42-planejamento-de-produto\">4.2 Planejamento de produto</h3>\n<p>Product Manager Agent propõe o <code>PRD.md</code>; o Adversarial Product Manager Agent procura ambiguidades e gaps; o primeiro responde e revisa o documento. Gaps não resolvidos são escalados.</p>\n<p>As automações validam template e campos obrigatórios, detectam termos vagos ou não mensuráveis, exigem critérios de aceite observáveis, e verificam rastreabilidade <code>PB → PRD</code>, escopo, fora de escopo e métricas.</p>\n<p><strong>Gate automático:</strong> PRD completo e crítica adversarial respondida.</p>\n<blockquote>\n<p><strong>H2 — é isto que construiremos?</strong> Responsável: PM ou stakeholder. Revisa <strong>decisões e gaps</strong>, não o documento linha por linha. Decide aprovar, reduzir, ampliar ou devolver. <strong>10–15 minutos.</strong></p>\n</blockquote>\n<h3 id=\"docs-operating-model-90-10~43-especificação-técnica\">4.3 Especificação técnica</h3>\n<p>O Specification Tech Lead Agent propõe arquitetura e decomposição; o Adversarial Tech Lead Agent avalia gaps, riscos e trade-offs. As decisões são consolidadas em <code>ADR.md</code> e <code>SPEC.md</code>, e o trabalho é dividido em tarefas verificáveis.</p>\n<p>As automações validam a estrutura dos artefatos, verificam rastreabilidade <code>PRD → SPEC → TASKS</code>, detectam ciclos e violações arquiteturais conhecidas, identificam contratos e paths sensíveis, validam dependências e ordem das tarefas, e geram threat model quando aplicável.</p>\n<p><strong>Gate automático:</strong> especificação consistente e gaps críticos tratados.</p>\n<blockquote>\n<p><strong>H3 — decisão técnica excepcional.</strong> Obrigatório em R3, R4, nova ADR ou exceção arquitetural; dispensável em R0–R2 sem decisão estrutural nova. Responsável: Tech Lead, arquiteto ou especialista do domínio. Revisa decisão, alternativas descartadas e impacto futuro. <strong>10–20 minutos.</strong></p>\n</blockquote>\n<h3 id=\"docs-operating-model-90-10~44-implementação-autônoma\">4.4 Implementação autônoma</h3>\n<p>Orchestrator Agent e Software Engineer Agents selecionam a próxima tarefa elegível, criam branch ou worktree isolado, implementam a mudança mínima, criam ou atualizam testes, executam validações locais, corrigem falhas automaticamente, registram commits pequenos e rastreáveis, e atualizam a documentação afetada.</p>\n<table>\n<thead>\n<tr>\n<th>Gate</th>\n<th>Verifica</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Pre-commit</strong></td>\n<td>formatação, lint e typecheck; unit tests afetados; testes de arquitetura rápidos; secrets e arquivos proibidos; consistência básica dos artefatos</td>\n</tr>\n<tr>\n<td><strong>Pre-push</strong></td>\n<td>build reproduzível; suíte ampliada de testes; cobertura mínima e mutation delta; análise estática e dependências; código morto e contratos quebrados</td>\n</tr>\n</tbody>\n</table>\n<p>A correção automática opera até um limite de tentativas e tempo. Falha repetida, conflito de requisito ou risco elevado disparam escalonamento. <strong>Nenhuma ação humana durante o fluxo saudável.</strong></p>\n<h3 id=\"docs-operating-model-90-10~45-validação-adversarial\">4.5 Validação adversarial</h3>\n<p>QA/Validation, Security Review, Architecture Review e Adversarial Code Reviewer validam cada critério de aceite, testam caminhos felizes, erros e casos-limite, comparam a implementação com <code>PRD</code> e <code>SPEC</code>, procuram regressões, vulnerabilidades e violações, e produzem evidências reproduzíveis.</p>\n<p>A CI opera em duas faixas: a <strong>fast lane</strong> (lint, typecheck, unit tests e arquitetura) roda em todo push; a <strong>deep lane</strong> (integração, TAAC, mutação e segurança) roda conforme risco, paths e impacto.</p>\n<p><strong>Gate automático:</strong> todos os checks obrigatórios aprovados. <strong>Ação humana:</strong> somente para falso positivo, exceção ou gap de requisito.</p>\n<h3 id=\"docs-operating-model-90-10~46-pr-e-decisão-de-merge\">4.6 PR e decisão de merge</h3>\n<p>PR Agent e Reviewer Agents geram descrição e evidence pack, resumem o comportamento alterado, destacam arquivos e trechos de maior risco, solicitam Code Owners conforme paths, exigem status checks da fonte autorizada, e invalidam aprovação após mudança material. A revisão dos agentes cobre corretude e completude, segurança e privacidade, arquitetura e contratos, testes e manutenibilidade, documentação e observabilidade.</p>\n<blockquote>\n<p><strong>H4 — podemos integrar?</strong> O peso da aprovação varia por classe de risco:</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>Risco</th>\n<th>Aprovação exigida</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>R0</td>\n<td>merge automático; revisão humana por amostragem</td>\n</tr>\n<tr>\n<td>R1</td>\n<td>uma revisão rápida do owner</td>\n</tr>\n<tr>\n<td>R2</td>\n<td>uma aprovação do responsável afetado</td>\n</tr>\n<tr>\n<td>R3</td>\n<td>aprovação técnica + aprovação do owner</td>\n</tr>\n<tr>\n<td>R4</td>\n<td>dupla aprovação com segregação de função</td>\n</tr>\n</tbody>\n</table>\n<p>O humano revisa evidence pack, hotspots e exceções — <strong>5 a 15 minutos</strong>. O gate de merge exige aprovações, CI verde e branch atualizada.</p>\n<h3 id=\"docs-operating-model-90-10~47-homologação-automatizada\">4.7 Homologação automatizada</h3>\n<p>Release Agent e Product Validation Agent operam em preview ou staging isolado. As automações fazem deploy do artefato imutável, seed de dados seguros, smoke, E2E e testes sintéticos, comparação visual quando aplicável, validação automática dos critérios de aceite, e geração de demonstração e evidências.</p>\n<p>A ação humana se limita a revisar experiência nova ou mudança R2+. A saída é um release candidate aprovado ou devolvido.</p>\n<h3 id=\"docs-operating-model-90-10~48-liberação-em-produção\">4.8 Liberação em produção</h3>\n<p>Release Agent e Observability Agent aplicam feature flag, canary, blue/green ou rollout progressivo. Os gates automáticos exigem artefato assinado e rastreável, ambiente e secrets autorizados, migração validada e compatível, backup e rollback verificados, e SLOs e alertas configurados.</p>\n<blockquote>\n<p><strong>H5 — podemos expor o risco?</strong> R0/R1 fazem deploy automático; R2 tem aprovação opcional conforme criticidade do produto; R3/R4 exigem aprovação explícita antes de produção. Responsável: Product Owner mais responsável técnico quando necessário. Revisa impacto, plano de rollout, rollback e sinais de saúde. <strong>3–10 minutos.</strong></p>\n</blockquote>\n<h3 id=\"docs-operating-model-90-10~49-observação-e-aprendizado\">4.9 Observação e aprendizado</h3>\n<p>Observability Agent e Knowledge Agent monitoram erros, latência, SLOs e métricas de produto, comparam baseline e comportamento após deploy, pausam rollout ou revertem automaticamente, atualizam changelog e documentação, e registram falhas e novos itens no backlog.</p>\n<p><strong>Gate pós-deploy:</strong> janela de observação sem regressão relevante. <strong>Ação humana:</strong> apenas quando o rollback não for seguro ou automático.</p>\n<h3 id=\"docs-operating-model-90-10~410-melhoria-contínua--auto-dream\">4.10 Melhoria contínua — Auto Dream</h3>\n<p>O Auto Dream Agent roda em agenda semanal, com execução extraordinária após incidente relevante. O objetivo é transformar o histórico operacional em memória e melhorias concretas, com escopo sobre produto, agentes, prompts, processo, harness, skills, scripts, gates e fluxo.</p>\n<p><strong>Entradas:</strong> sessões e decisões dos agentes; evidence packs e feedbacks humanos; falhas, retries, bloqueios e escalonamentos; resultados de hooks, CI, homologação e deploy; incidentes, rollbacks e defeitos escapados; métricas de tempo, custo, qualidade e autonomia; demandas de melhoria geradas anteriormente.</p>\n<p><strong>Pipeline.</strong> Coletar sessões e eventos da semana → remover secrets e dados pessoais → agrupar por etapa, causa e tipo de impacto → identificar padrões recorrentes e ocorrências isoladas → comparar com semanas anteriores → distinguir aprendizado reutilizável de problema operacional → procurar contradições com a memória existente → produzir evidências e nível de confiança → submeter a um Critic Agent independente → consolidar somente itens confirmados ou explicitamente sinalizados como hipótese.</p>\n<p><strong>Caminho A — aprendizado validado.</strong> Identifica o que funcionou e em qual contexto, registra evidências e condições de reutilização, verifica duplicidade, contradição e validade temporal, e propõe inclusão, atualização ou remoção no <code>MEMORY.md</code> preservando origem e data. Preferência isolada não vira regra global.</p>\n<p>O <strong>gate de memória</strong> exige evidência vinculada à conclusão, escopo e contexto explícitos, ausência de secrets ou dados pessoais, nenhuma contradição não resolvida, conhecimento acionável e reutilizável, e aprovação humana para mudança sensível.</p>\n<p><strong>Caminho B — falha ou oportunidade.</strong> Descreve o sintoma, identifica causa provável e evidências, registra frequência, impacto e etapa afetada, propõe ação corretiva e resultado esperado, classifica o tipo de melhoria (processo, harness, skill ou prompt, script ou ferramenta, hook ou gate, arquitetura do workflow, documentação ou contexto), gera demanda rastreável no backlog, relaciona sessões e incidentes de origem, e vincula duplicadas.</p>\n<table>\n<thead>\n<tr>\n<th>Campo da demanda</th>\n<th>Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Título</td>\n<td>orientado ao problema</td>\n</tr>\n<tr>\n<td>Sintoma e impacto</td>\n<td>o que se observa e o que custa</td>\n</tr>\n<tr>\n<td>Evidências e frequência</td>\n<td>origem e recorrência</td>\n</tr>\n<tr>\n<td>Hipótese de causa-raiz</td>\n<td>explicação candidata</td>\n</tr>\n<tr>\n<td>Melhoria proposta</td>\n<td>ação corretiva</td>\n</tr>\n<tr>\n<td>Critério de aceite</td>\n<td>mensurável</td>\n</tr>\n<tr>\n<td>Prioridade e risco</td>\n<td>P0–P3 e classe R</td>\n</tr>\n<tr>\n<td>Owner recomendado</td>\n<td>quem deveria assumir</td>\n</tr>\n<tr>\n<td>Links</td>\n<td>sessões e artefatos relacionados</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Priorização.</strong> P0 é risco crítico, segurança ou perda de dados; P1, falha recorrente que bloqueia o fluxo; P2, retrabalho, custo ou baixa confiabilidade; P3, otimização incremental. Frequência não substitui impacto, e o Auto Dream recomenda enquanto o responsável humano controla a prioridade final.</p>\n<blockquote>\n<p><strong>H6 — o sistema aprendeu corretamente?</strong> Obrigatório para mudanças sensíveis no <code>MEMORY.md</code>, P0/P1 e alteração de gates; por amostragem para aprendizados de baixo risco e demandas P2/P3. Responsável: owner do Agent Team ou Engineering Enablement. Decide aprovar, ajustar, descartar ou solicitar mais evidências. <strong>10–20 minutos por ciclo semanal.</strong></p>\n</blockquote>\n<p><strong>Saídas:</strong> <code>MEMORY.md</code> atualizado, demandas criadas ou enriquecidas no backlog, relatório semanal curto com padrões e tendências, métricas do sistema atualizadas, e hipóteses inconclusivas mantidas em observação.</p>\n<p><strong>Gate de conclusão:</strong> fontes processadas e rastreáveis; aprendizados separados de hipóteses; falhas relevantes convertidas em demandas; duplicidades e contradições tratadas; mudanças sensíveis revisadas; nenhum dado confidencial persistido indevidamente.</p>\n<p><strong>Falhas do próprio ciclo.</strong> Falha de coleta abre alerta em vez de produzir conclusão parcial silenciosa. Baixa confiança mantém o item como hipótese. Contradição bloqueia atualização automática da memória. Demanda sem evidência permanece como rascunho. O agente não aprova alterações nos próprios gates. E incidentes do Auto Dream entram no próximo ciclo de análise.</p>\n<hr>\n<h2 id=\"docs-operating-model-90-10~5-como-reduzir-ainda-mais-os-reviews\">5. Como reduzir ainda mais os reviews</h2>\n<p>Cada corte abaixo só é seguro depois que o histórico demonstrar que o gate correspondente é confiável. Reduzir review antes disso não aumenta autonomia — aumenta risco não observado.</p>\n<table>\n<thead>\n<tr>\n<th>Movimento</th>\n<th>Pré-requisito</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Combinar H2 e H3 em mudanças pequenas e conhecidas</td>\n<td>padrão já validado em ciclos anteriores</td>\n</tr>\n<tr>\n<td>Eliminar H3 quando não houver ADR, exceção ou risco relevante</td>\n<td>classificação de risco confiável</td>\n</tr>\n<tr>\n<td>Aplicar H4 por amostragem em R0</td>\n<td>histórico de defeitos escapados baixo</td>\n</tr>\n<tr>\n<td>Tornar H5 automático em R0/R1</td>\n<td>rollback comprovado em produção</td>\n</tr>\n<tr>\n<td>Mostrar somente diferenças desde a última aprovação</td>\n<td>evidence pack com delta</td>\n</tr>\n<tr>\n<td>Direcionar o humano aos hotspots, não ao diff completo</td>\n<td>análise de risco por trecho</td>\n</tr>\n<tr>\n<td>Usar Code Owners apenas para paths realmente sensíveis</td>\n<td>mapeamento de paths revisado</td>\n</tr>\n<tr>\n<td>Criar políticas diferentes por risco e tipo de repositório</td>\n<td>política parametrizável</td>\n</tr>\n<tr>\n<td>Remover gates sem valor</td>\n<td>medição de falsos positivos</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-operating-model-90-10~6-arquitetura-de-gates\">6. Arquitetura de gates</h2>\n<p>As cinco camadas formam uma escada de custo crescente. O objetivo é que o feedback barato chegue primeiro e que nada que possa ser verificado por máquina chegue a uma pessoa.</p>\n<table>\n<thead>\n<tr>\n<th>Camada</th>\n<th>Latência</th>\n<th>Verifica</th>\n<th>Falha bloqueia</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Local</strong></td>\n<td>segundos a poucos minutos</td>\n<td>checks determinísticos e de baixo custo, com instrução clara de correção</td>\n<td>commit ou push</td>\n</tr>\n<tr>\n<td><strong>CI</strong></td>\n<td>minutos</td>\n<td>build, testes, segurança e arquitetura em ambiente limpo; seleciona checks por risco e paths</td>\n<td>merge</td>\n</tr>\n<tr>\n<td><strong>Merge</strong></td>\n<td>decisão consolidada</td>\n<td>aprovações e status checks; proveniência da automação; bypass silencioso e force push; invalidação após mudança material</td>\n<td>integração</td>\n</tr>\n<tr>\n<td><strong>Ambiente</strong></td>\n<td>antes da exposição</td>\n<td>liberação de secrets após autorização; branches e artefatos permitidos; aprovação conforme risco; observabilidade e change management</td>\n<td>deploy</td>\n</tr>\n<tr>\n<td><strong>Pós-deploy</strong></td>\n<td>janela de observação</td>\n<td>comparação com baseline; interrupção diante de regressão; reversão automática quando seguro; incidente quando exigir ação humana</td>\n<td>rollout</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model-90-10~61-regras-para-gates-baseados-em-ia\">6.1 Regras para gates baseados em IA</h3>\n<p>IA pode recomendar, explicar e priorizar achados. <strong>Bloqueio automático, não</strong> — ele exige regra reproduzível e evidência verificável, e achado probabilístico exige confirmação independente.</p>\n<p>Três separações são inegociáveis: o mesmo agente não produz e aprova a própria mudança; agentes não alteram gates dentro do mesmo fluxo avaliado; e mudança em rules, hooks ou CI eleva o risco automaticamente. Qualquer bypass exige pessoa autorizada, motivo e prazo de correção.</p>\n<h3 id=\"docs-operating-model-90-10~62-contrato-de-escalonamento\">6.2 Contrato de escalonamento</h3>\n<p>O agente para e devolve a decisão diante de requisito contraditório ou sem owner, confiança abaixo do limite definido, duas ou mais tentativas de correção sem progresso, mudança fora do escopo aprovado, necessidade de nova permissão ou acesso externo, falha não reproduzível ou evidência inconsistente, decisão irreversível ou impacto não calculável, ou divergência entre agentes sem critério objetivo de desempate.</p>\n<hr>\n<h2 id=\"docs-operating-model-90-10~7-autonomia-progressiva\">7. Autonomia progressiva</h2>\n<table>\n<thead>\n<tr>\n<th>Nível</th>\n<th>O sistema faz</th>\n<th>O humano faz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>A0 — assistido</strong></td>\n<td>executa sob supervisão</td>\n<td>aprova todas as transições — indicado para início do piloto</td>\n</tr>\n<tr>\n<td><strong>A1 — execução autônoma</strong></td>\n<td>implementação e validação</td>\n<td>mantém H1, H2, H4 e H5</td>\n</tr>\n<tr>\n<td><strong>A2 — merge por risco</strong></td>\n<td>auto-merge em R0</td>\n<td>review curto em R1; owners específicos em R2+</td>\n</tr>\n<tr>\n<td><strong>A3 — entrega autônoma controlada</strong></td>\n<td>deploy automático em R0/R1, com rollback e observabilidade obrigatórios</td>\n<td>atua em exceções e riscos altos</td>\n</tr>\n<tr>\n<td><strong>A4 — orientado a exceções</strong></td>\n<td>opera o fluxo saudável sem intervenção</td>\n<td>recebe apenas decisões e incidentes relevantes; audita por amostragem</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Critério para elevar autonomia.</strong> Todos os itens abaixo, simultaneamente: volume mínimo de entregas observado; baixa taxa de defeitos escapados; rollback testado e confiável; gates com poucos falsos positivos; risco classificado corretamente; evidências completas e auditáveis; e tempo humano realmente reduzido.</p>\n<hr>\n<h2 id=\"docs-operating-model-90-10~8-métricas-e-metas\">8. Métricas e metas</h2>\n<h3 id=\"docs-operating-model-90-10~81-métricas-do-modelo\">8.1 Métricas do modelo</h3>\n<table>\n<thead>\n<tr>\n<th>Dimensão</th>\n<th>Métricas</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Autonomia</td>\n<td>% de etapas concluídas sem intervenção; % de mudanças por classe de risco</td>\n</tr>\n<tr>\n<td>Tempo humano</td>\n<td>minutos humanos por entrega; tempo aguardando aprovação; decisões devolvidas por falta de contexto</td>\n</tr>\n<tr>\n<td>Qualidade dos gates</td>\n<td>aprovação na primeira passagem; falsos positivos por gate; retrabalho após H2, H3 e H4</td>\n</tr>\n<tr>\n<td>Resultado</td>\n<td>defeitos escapados para produção; rollbacks automáticos e manuais</td>\n</tr>\n<tr>\n<td>Custo e fluxo</td>\n<td>custo de agentes por entrega; lead time e cycle time</td>\n</tr>\n<tr>\n<td>Rastreabilidade</td>\n<td>cobertura entre artefatos</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model-90-10~82-meta-inicial-sugerida\">8.2 Meta inicial sugerida</h3>\n<table>\n<thead>\n<tr>\n<th>Meta</th>\n<th>Valor</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Atividades executadas por agentes</td>\n<td>80–90%</td>\n</tr>\n<tr>\n<td>Tempo humano por entrega R1/R2</td>\n<td>até 30–45 minutos</td>\n</tr>\n<tr>\n<td>Aprovações baseadas apenas em confiança no agente</td>\n<td>zero</td>\n</tr>\n<tr>\n<td>Merges protegidos por gates verificáveis</td>\n<td>100%</td>\n</tr>\n<tr>\n<td>Mudanças R3/R4 com owner e rollback definidos</td>\n<td>100%</td>\n</tr>\n<tr>\n<td>Auto-merge</td>\n<td>somente após evidência do piloto</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-operating-model-90-10~9-implementação-do-modelo\">9. Implementação do modelo</h2>\n<table>\n<thead>\n<tr>\n<th>Etapa</th>\n<th>Entrega</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>1 — Contrato mínimo</strong></td>\n<td>classes de risco; responsáveis humanos; templates dos artefatos; formato do evidence pack; condições de escalonamento</td>\n</tr>\n<tr>\n<td><strong>2 — Harness mínimo</strong></td>\n<td><code>AGENTS.md</code>, rules e skills; pre-commit e pre-push; CI fast lane e deep lane; proteção de branch e status checks; <code>CODEOWNERS</code> para paths sensíveis — detalhado em <a href=\"#docs-repo-harness\">repo harness</a></td>\n</tr>\n<tr>\n<td><strong>3 — Piloto controlado</strong></td>\n<td>um fluxo R1 real em autonomia A0/A1; medição de tempo humano e falhas; ajuste de gates e templates; validação de rollback e rastreabilidade</td>\n</tr>\n<tr>\n<td><strong>4 — Automação do roteamento</strong></td>\n<td>classificação automática de risco; acionamento de Agent Teams por etapa; evidence packs automáticos; solicitação apenas dos reviewers necessários; escalonamento com contexto completo</td>\n</tr>\n<tr>\n<td><strong>5 — Autonomia progressiva</strong></td>\n<td>auto-merge em R0; deploy automático em R0/R1; ampliação por evidência, não por expectativa; auditoria humana por amostragem</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model-90-10~91-próximo-detalhamento-recomendado\">9.1 Próximo detalhamento recomendado</h3>\n<p>Definir o schema do Work Item; criar o template do evidence pack; desenhar a matriz <code>risco × gates × aprovações</code>; especificar os prompts e contratos de cada agente; definir os eventos que movimentam o workflow; criar o primeiro repo harness de referência; e simular uma entrega R1 de ponta a ponta.</p>\n<hr>\n<h2 id=\"docs-operating-model-90-10~referências-operacionais\">Referências operacionais</h2>\n<ul>\n<li><a href=\"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets\">GitHub Rulesets e regras disponíveis</a></li>\n<li><a href=\"https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners\">GitHub Code Owners</a></li>\n<li><a href=\"https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments\">GitHub deployment environments</a></li>\n<li><a href=\"https://www.nist.gov/publications/secure-software-development-framework-ssdf-version-11-recommendations-mitigating-risk\">NIST Secure Software Development Framework</a></li>\n</ul>", "toc": [{"level": 2, "id": "docs-operating-model-90-10~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-operating-model-90-10~mapa-do-documento", "text": "Mapa do documento"}, {"level": 2, "id": "docs-operating-model-90-10~1-o-que-90-significa", "text": "1. O que 90% significa"}, {"level": 2, "id": "docs-operating-model-90-10~2-review-de-decisão", "text": "2. Review de decisão"}, {"level": 2, "id": "docs-operating-model-90-10~3-classificação-de-risco", "text": "3. Classificação de risco"}, {"level": 2, "id": "docs-operating-model-90-10~4-fluxo-operacional-de-ponta-a-ponta", "text": "4. Fluxo operacional de ponta a ponta"}, {"level": 3, "id": "docs-operating-model-90-10~40-entrada-e-triagem", "text": "4.0 Entrada e triagem"}, {"level": 3, "id": "docs-operating-model-90-10~41-discovery-multiagente", "text": "4.1 Discovery multiagente"}, {"level": 3, "id": "docs-operating-model-90-10~42-planejamento-de-produto", "text": "4.2 Planejamento de produto"}, {"level": 3, "id": "docs-operating-model-90-10~43-especificação-técnica", "text": "4.3 Especificação técnica"}, {"level": 3, "id": "docs-operating-model-90-10~44-implementação-autônoma", "text": "4.4 Implementação autônoma"}, {"level": 3, "id": "docs-operating-model-90-10~45-validação-adversarial", "text": "4.5 Validação adversarial"}, {"level": 3, "id": "docs-operating-model-90-10~46-pr-e-decisão-de-merge", "text": "4.6 PR e decisão de merge"}, {"level": 3, "id": "docs-operating-model-90-10~47-homologação-automatizada", "text": "4.7 Homologação automatizada"}, {"level": 3, "id": "docs-operating-model-90-10~48-liberação-em-produção", "text": "4.8 Liberação em produção"}, {"level": 3, "id": "docs-operating-model-90-10~49-observação-e-aprendizado", "text": "4.9 Observação e aprendizado"}, {"level": 3, "id": "docs-operating-model-90-10~410-melhoria-contínua--auto-dream", "text": "4.10 Melhoria contínua — Auto Dream"}, {"level": 2, "id": "docs-operating-model-90-10~5-como-reduzir-ainda-mais-os-reviews", "text": "5. Como reduzir ainda mais os reviews"}, {"level": 2, "id": "docs-operating-model-90-10~6-arquitetura-de-gates", "text": "6. Arquitetura de gates"}, {"level": 3, "id": "docs-operating-model-90-10~61-regras-para-gates-baseados-em-ia", "text": "6.1 Regras para gates baseados em IA"}, {"level": 3, "id": "docs-operating-model-90-10~62-contrato-de-escalonamento", "text": "6.2 Contrato de escalonamento"}, {"level": 2, "id": "docs-operating-model-90-10~7-autonomia-progressiva", "text": "7. Autonomia progressiva"}, {"level": 2, "id": "docs-operating-model-90-10~8-métricas-e-metas", "text": "8. Métricas e metas"}, {"level": 3, "id": "docs-operating-model-90-10~81-métricas-do-modelo", "text": "8.1 Métricas do modelo"}, {"level": 3, "id": "docs-operating-model-90-10~82-meta-inicial-sugerida", "text": "8.2 Meta inicial sugerida"}, {"level": 2, "id": "docs-operating-model-90-10~9-implementação-do-modelo", "text": "9. Implementação do modelo"}, {"level": 3, "id": "docs-operating-model-90-10~91-próximo-detalhamento-recomendado", "text": "9.1 Próximo detalhamento recomendado"}, {"level": 2, "id": "docs-operating-model-90-10~referências-operacionais", "text": "Referências operacionais"}], "text": " agent team — modelo operacional 90/10 como chegar a ~90% do trabalho operacional executado sem intervenção humana, mantendo 100% das decisões de risco sob responsabilidade de uma pessoa. em 2 minutos o modelo 90/10 é o desdobramento operacional do sistema operacional do trio humano . ele responde a uma pergunta específica: onde exatamente o humano entra, por quanto tempo, e o que ele precisa ver para decidir? a resposta é substituir review de processo por review de decisão. ninguém acompanha o diff inteiro nem lê o prd linha por linha. em cada checkpoint, o sistema entrega uma pergunta objetiva, a recomendação dos agentes, as alternativas descartadas, os riscos e as evidências dos gates — e a pessoa responde. são seis checkpoints em todo o ciclo, somando algo entre 30 e 45 minutos de tempo humano por entrega r1/r2. checkpoint decisão quando tempo esperado h1 vale investir? após discovery 5–10 min h2 é isto que construiremos? após prd 10–15 min h3 aceitamos o trade-off? apenas adr, exceção ou r3/r4 10–20 min h4 podemos integrar? antes do merge, conforme risco 5–15 min h5 podemos expor o risco? produção r3/r4 3–10 min h6 o sistema aprendeu corretamente? ciclo semanal do auto dream 10–20 min o que sustenta esses números não é confiança no agente: é a arquitetura de gates . cinco camadas de verificação — local, ci, merge, ambiente e pós-deploy — filtram tudo que é determinístico antes de qualquer pessoa ser chamada. a autonomia sobe de a0 a a4 apenas quando essas camadas demonstram baixo índice de falsos positivos e rollback confiável. mapa do documento seção responde leia se você… 1. o que 90% significa o que o número mede e o que não mede quer evitar a leitura errada da meta 2. review de decisão como o humano decide sem ler tudo vai desenhar o evidence pack 3. classificação de risco r0 a r4 e o que cada classe exige vai definir política de aprovação 4. fluxo operacional o que acontece em cada uma das 11 etapas vai operar o fluxo 5. reduzindo reviews onde cortar intervenção com segurança já rodou alguns ciclos 6. arquitetura de gates as cinco camadas de verificação vai configurar o harness 7. autonomia progressiva a0 a a4 e critérios de subida vai propor elevar autonomia 8. métricas e metas como saber se está funcionando vai instrumentar o fluxo 9. implementação em que ordem construir está começando do zero vizinhos: sistema operacional do trio humano · fluxo visual completo · fluxos por fase · workflows multiagente . as subseções do fluxo operacional indicam o que deve ser feito; os workflows descrevem como os agentes colaboram, fazem handoff, criticam e consolidam cada saída. 1. o que 90% significa o objetivo é automatizar aproximadamente 90% do trabalho operacional, reservando o tempo humano para decisões de valor, risco e responsabilidade. agentes produzem, criticam, corrigem e comprovam o próprio trabalho; reviews extensos dão lugar a checkpoints curtos orientados a evidência; e a autonomia cresce à medida que o fluxo demonstra segurança. a leitura correta do número importa, porque a leitura errada destrói o modelo: 90% significa 90% não significa 90% das atividades executadas sem intervenção manual 90% das decisões delegadas aos agentes redução de tempo humano sem aumento de falhas, risco ou retrabalho eliminação da responsabilidade humana sobre produto e produção gates aplicados a todo trabalho autônomo autorização para agentes ignorarem gates ou ampliarem o próprio acesso medição por tempo e por resultado medição apenas por quantidade de tarefas a divisão de responsabilidade que produz esse número: agentes fazem pesquisa, síntese, especificação, código, testes e evidências; automações fazem validações determinísticas, bloqueios e rastreabilidade; humanos definem prioridade, escolhas irreversíveis, exceções e aceite; e o sistema cuida de roteamento, registro, observação e escalonamento. 2. review de decisão o princípio central é que o humano não revisa o processo — ele responde a uma pergunta objetiva. para cada checkpoint, o sistema apresenta decisão recomendada, alternativas, riscos e evidências, com tempo esperado e critérios explícitos. duas travas protegem o mecanismo: falta de resposta não equivale a aprovação, e mudança material invalida a aprovação relacionada. o evidence pack é o que torna isso viável. ele contém: item conteúdo decisão solicitada uma frase recomendação posição dos agentes alternativas opções consideradas e descartadas riscos e trade-offs o que se aceita ao aprovar delta mudanças desde o último checkpoint evidências resultado dos gates executados pendências exceções e nível de confiança links artefatos completos, código e execução 3. classificação de risco a classe de risco é o que determina quantas aprovações a mudança exige e quanto de automação ela pode usar. classe caracteriza aprovação e entrega r0 — mínimo documentação, texto e formatação; sem mudança de comportamento, dados, secrets ou contratos merge automático após gates; review humano por amostragem r1 — baixo refatoração interna ou mudança localizada, coberta por testes existentes; sem migração, segurança ou integração crítica uma aprovação humana curta no pr; deploy automático com observação r2 — médio novo comportamento de produto ou mudança de contrato interno/integração; impacto reversível mas relevante aprovação de produto ou code owner; canary e rollback automatizados r3 — alto dados persistidos, migrações, contratos públicos, autenticação, autorização, secrets, privacidade, pagamentos, disponibilidade ou operação crítica aprovações humana de produto e técnica; aprovação explícita antes de produção r4 — crítico impacto regulatório, financeiro ou destrutivo; ação irreversível ou de grande alcance plano de mudança e rollback revisados manualmente; dupla aprovação, segregação de função e acompanhamento humano durante a liberação regras da classificação. um agente propõe o risco e outro tenta elevá-lo; o maior risco justificado prevalece. redução manual exige justificativa registrada, mudança de escopo recalcula o risco, paths sensíveis elevam risco automaticamente, e dúvida não resolvida impede classificação como r0 ou r1. 4. fluxo operacional de ponta a ponta 4.0 entrada e triagem intake agent e product manager agent recebem a solicitação. as automações validam campos obrigatórios, identificam duplicidade e dependências, relacionam demanda, produto e repositório, e classificam tipo e risco inicial. a saída é um work item com contexto, prioridade proposta e owner. gate automático: item completo, rastreável e sem duplicidade conhecida. ação humana: priorizar ou rejeitar — 2 a 5 minutos. 4.1 discovery multiagente o agent team reúne product manager agent, ux specification agent e tech lead discovery agent. os três investigam em paralelo e registram hipóteses e evidências; o product manager agent consolida o pb.md e os demais criticam a síntese. as automações validam a estrutura do pb.md , verificam links e fontes, detectam afirmações sem evidência, identificam perguntas e riscos sem owner, e comparam a descoberta com demandas similares. gate automático: problema, usuário, experiência e viabilidade cobertos. h1 — vale avançar? responsável: pm ou sponsor. revisa problema, usuário, valor, restrições e riscos. decide avançar, ajustar, adiar ou encerrar. 5–10 minutos. 4.2 planejamento de produto product manager agent propõe o prd.md ; o adversarial product manager agent procura ambiguidades e gaps; o primeiro responde e revisa o documento. gaps não resolvidos são escalados. as automações validam template e campos obrigatórios, detectam termos vagos ou não mensuráveis, exigem critérios de aceite observáveis, e verificam rastreabilidade pb → prd , escopo, fora de escopo e métricas. gate automático: prd completo e crítica adversarial respondida. h2 — é isto que construiremos? responsável: pm ou stakeholder. revisa decisões e gaps , não o documento linha por linha. decide aprovar, reduzir, ampliar ou devolver. 10–15 minutos. 4.3 especificação técnica o specification tech lead agent propõe arquitetura e decomposição; o adversarial tech lead agent avalia gaps, riscos e trade-offs. as decisões são consolidadas em adr.md e spec.md , e o trabalho é dividido em tarefas verificáveis. as automações validam a estrutura dos artefatos, verificam rastreabilidade prd → spec → tasks , detectam ciclos e violações arquiteturais conhecidas, identificam contratos e paths sensíveis, validam dependências e ordem das tarefas, e geram threat model quando aplicável. gate automático: especificação consistente e gaps críticos tratados. h3 — decisão técnica excepcional. obrigatório em r3, r4, nova adr ou exceção arquitetural; dispensável em r0–r2 sem decisão estrutural nova. responsável: tech lead, arquiteto ou especialista do domínio. revisa decisão, alternativas descartadas e impacto futuro. 10–20 minutos. 4.4 implementação autônoma orchestrator agent e software engineer agents selecionam a próxima tarefa elegível, criam branch ou worktree isolado, implementam a mudança mínima, criam ou atualizam testes, executam validações locais, corrigem falhas automaticamente, registram commits pequenos e rastreáveis, e atualizam a documentação afetada. gate verifica pre-commit formatação, lint e typecheck; unit tests afetados; testes de arquitetura rápidos; secrets e arquivos proibidos; consistência básica dos artefatos pre-push build reproduzível; suíte ampliada de testes; cobertura mínima e mutation delta; análise estática e dependências; código morto e contratos quebrados a correção automática opera até um limite de tentativas e tempo. falha repetida, conflito de requisito ou risco elevado disparam escalonamento. nenhuma ação humana durante o fluxo saudável. 4.5 validação adversarial qa/validation, security review, architecture review e adversarial code reviewer validam cada critério de aceite, testam caminhos felizes, erros e casos-limite, comparam a implementação com prd e spec , procuram regressões, vulnerabilidades e violações, e produzem evidências reproduzíveis. a ci opera em duas faixas: a fast lane (lint, typecheck, unit tests e arquitetura) roda em todo push; a deep lane (integração, taac, mutação e segurança) roda conforme risco, paths e impacto. gate automático: todos os checks obrigatórios aprovados. ação humana: somente para falso positivo, exceção ou gap de requisito. 4.6 pr e decisão de merge pr agent e reviewer agents geram descrição e evidence pack, resumem o comportamento alterado, destacam arquivos e trechos de maior risco, solicitam code owners conforme paths, exigem status checks da fonte autorizada, e invalidam aprovação após mudança material. a revisão dos agentes cobre corretude e completude, segurança e privacidade, arquitetura e contratos, testes e manutenibilidade, documentação e observabilidade. h4 — podemos integrar? o peso da aprovação varia por classe de risco: risco aprovação exigida r0 merge automático; revisão humana por amostragem r1 uma revisão rápida do owner r2 uma aprovação do responsável afetado r3 aprovação técnica + aprovação do owner r4 dupla aprovação com segregação de função o humano revisa evidence pack, hotspots e exceções — 5 a 15 minutos . o gate de merge exige aprovações, ci verde e branch atualizada. 4.7 homologação automatizada release agent e product validation agent operam em preview ou staging isolado. as automações fazem deploy do artefato imutável, seed de dados seguros, smoke, e2e e testes sintéticos, comparação visual quando aplicável, validação automática dos critérios de aceite, e geração de demonstração e evidências. a ação humana se limita a revisar experiência nova ou mudança r2+. a saída é um release candidate aprovado ou devolvido. 4.8 liberação em produção release agent e observability agent aplicam feature flag, canary, blue/green ou rollout progressivo. os gates automáticos exigem artefato assinado e rastreável, ambiente e secrets autorizados, migração validada e compatível, backup e rollback verificados, e slos e alertas configurados. h5 — podemos expor o risco? r0/r1 fazem deploy automático; r2 tem aprovação opcional conforme criticidade do produto; r3/r4 exigem aprovação explícita antes de produção. responsável: product owner mais responsável técnico quando necessário. revisa impacto, plano de rollout, rollback e sinais de saúde. 3–10 minutos. 4.9 observação e aprendizado observability agent e knowledge agent monitoram erros, latência, slos e métricas de produto, comparam baseline e comportamento após deploy, pausam rollout ou revertem automaticamente, atualizam changelog e documentação, e registram falhas e novos itens no backlog. gate pós-deploy: janela de observação sem regressão relevante. ação humana: apenas quando o rollback não for seguro ou automático. 4.10 melhoria contínua — auto dream o auto dream agent roda em agenda semanal, com execução extraordinária após incidente relevante. o objetivo é transformar o histórico operacional em memória e melhorias concretas, com escopo sobre produto, agentes, prompts, processo, harness, skills, scripts, gates e fluxo. entradas: sessões e decisões dos agentes; evidence packs e feedbacks humanos; falhas, retries, bloqueios e escalonamentos; resultados de hooks, ci, homologação e deploy; incidentes, rollbacks e defeitos escapados; métricas de tempo, custo, qualidade e autonomia; demandas de melhoria geradas anteriormente. pipeline. coletar sessões e eventos da semana → remover secrets e dados pessoais → agrupar por etapa, causa e tipo de impacto → identificar padrões recorrentes e ocorrências isoladas → comparar com semanas anteriores → distinguir aprendizado reutilizável de problema operacional → procurar contradições com a memória existente → produzir evidências e nível de confiança → submeter a um critic agent independente → consolidar somente itens confirmados ou explicitamente sinalizados como hipótese. caminho a — aprendizado validado. identifica o que funcionou e em qual contexto, registra evidências e condições de reutilização, verifica duplicidade, contradição e validade temporal, e propõe inclusão, atualização ou remoção no memory.md preservando origem e data. preferência isolada não vira regra global. o gate de memória exige evidência vinculada à conclusão, escopo e contexto explícitos, ausência de secrets ou dados pessoais, nenhuma contradição não resolvida, conhecimento acionável e reutilizável, e aprovação humana para mudança sensível. caminho b — falha ou oportunidade. descreve o sintoma, identifica causa provável e evidências, registra frequência, impacto e etapa afetada, propõe ação corretiva e resultado esperado, classifica o tipo de melhoria (processo, harness, skill ou prompt, script ou ferramenta, hook ou gate, arquitetura do workflow, documentação ou contexto), gera demanda rastreável no backlog, relaciona sessões e incidentes de origem, e vincula duplicadas. campo da demanda conteúdo título orientado ao problema sintoma e impacto o que se observa e o que custa evidências e frequência origem e recorrência hipótese de causa-raiz explicação candidata melhoria proposta ação corretiva critério de aceite mensurável prioridade e risco p0–p3 e classe r owner recomendado quem deveria assumir links sessões e artefatos relacionados priorização. p0 é risco crítico, segurança ou perda de dados; p1, falha recorrente que bloqueia o fluxo; p2, retrabalho, custo ou baixa confiabilidade; p3, otimização incremental. frequência não substitui impacto, e o auto dream recomenda enquanto o responsável humano controla a prioridade final. h6 — o sistema aprendeu corretamente? obrigatório para mudanças sensíveis no memory.md , p0/p1 e alteração de gates; por amostragem para aprendizados de baixo risco e demandas p2/p3. responsável: owner do agent team ou engineering enablement. decide aprovar, ajustar, descartar ou solicitar mais evidências. 10–20 minutos por ciclo semanal. saídas: memory.md atualizado, demandas criadas ou enriquecidas no backlog, relatório semanal curto com padrões e tendências, métricas do sistema atualizadas, e hipóteses inconclusivas mantidas em observação. gate de conclusão: fontes processadas e rastreáveis; aprendizados separados de hipóteses; falhas relevantes convertidas em demandas; duplicidades e contradições tratadas; mudanças sensíveis revisadas; nenhum dado confidencial persistido indevidamente. falhas do próprio ciclo. falha de coleta abre alerta em vez de produzir conclusão parcial silenciosa. baixa confiança mantém o item como hipótese. contradição bloqueia atualização automática da memória. demanda sem evidência permanece como rascunho. o agente não aprova alterações nos próprios gates. e incidentes do auto dream entram no próximo ciclo de análise. 5. como reduzir ainda mais os reviews cada corte abaixo só é seguro depois que o histórico demonstrar que o gate correspondente é confiável. reduzir review antes disso não aumenta autonomia — aumenta risco não observado. movimento pré-requisito combinar h2 e h3 em mudanças pequenas e conhecidas padrão já validado em ciclos anteriores eliminar h3 quando não houver adr, exceção ou risco relevante classificação de risco confiável aplicar h4 por amostragem em r0 histórico de defeitos escapados baixo tornar h5 automático em r0/r1 rollback comprovado em produção mostrar somente diferenças desde a última aprovação evidence pack com delta direcionar o humano aos hotspots, não ao diff completo análise de risco por trecho usar code owners apenas para paths realmente sensíveis mapeamento de paths revisado criar políticas diferentes por risco e tipo de repositório política parametrizável remover gates sem valor medição de falsos positivos 6. arquitetura de gates as cinco camadas formam uma escada de custo crescente. o objetivo é que o feedback barato chegue primeiro e que nada que possa ser verificado por máquina chegue a uma pessoa. camada latência verifica falha bloqueia local segundos a poucos minutos checks determinísticos e de baixo custo, com instrução clara de correção commit ou push ci minutos build, testes, segurança e arquitetura em ambiente limpo; seleciona checks por risco e paths merge merge decisão consolidada aprovações e status checks; proveniência da automação; bypass silencioso e force push; invalidação após mudança material integração ambiente antes da exposição liberação de secrets após autorização; branches e artefatos permitidos; aprovação conforme risco; observabilidade e change management deploy pós-deploy janela de observação comparação com baseline; interrupção diante de regressão; reversão automática quando seguro; incidente quando exigir ação humana rollout 6.1 regras para gates baseados em ia ia pode recomendar, explicar e priorizar achados. bloqueio automático, não — ele exige regra reproduzível e evidência verificável, e achado probabilístico exige confirmação independente. três separações são inegociáveis: o mesmo agente não produz e aprova a própria mudança; agentes não alteram gates dentro do mesmo fluxo avaliado; e mudança em rules, hooks ou ci eleva o risco automaticamente. qualquer bypass exige pessoa autorizada, motivo e prazo de correção. 6.2 contrato de escalonamento o agente para e devolve a decisão diante de requisito contraditório ou sem owner, confiança abaixo do limite definido, duas ou mais tentativas de correção sem progresso, mudança fora do escopo aprovado, necessidade de nova permissão ou acesso externo, falha não reproduzível ou evidência inconsistente, decisão irreversível ou impacto não calculável, ou divergência entre agentes sem critério objetivo de desempate. 7. autonomia progressiva nível o sistema faz o humano faz a0 — assistido executa sob supervisão aprova todas as transições — indicado para início do piloto a1 — execução autônoma implementação e validação mantém h1, h2, h4 e h5 a2 — merge por risco auto-merge em r0 review curto em r1; owners específicos em r2+ a3 — entrega autônoma controlada deploy automático em r0/r1, com rollback e observabilidade obrigatórios atua em exceções e riscos altos a4 — orientado a exceções opera o fluxo saudável sem intervenção recebe apenas decisões e incidentes relevantes; audita por amostragem critério para elevar autonomia. todos os itens abaixo, simultaneamente: volume mínimo de entregas observado; baixa taxa de defeitos escapados; rollback testado e confiável; gates com poucos falsos positivos; risco classificado corretamente; evidências completas e auditáveis; e tempo humano realmente reduzido. 8. métricas e metas 8.1 métricas do modelo dimensão métricas autonomia % de etapas concluídas sem intervenção; % de mudanças por classe de risco tempo humano minutos humanos por entrega; tempo aguardando aprovação; decisões devolvidas por falta de contexto qualidade dos gates aprovação na primeira passagem; falsos positivos por gate; retrabalho após h2, h3 e h4 resultado defeitos escapados para produção; rollbacks automáticos e manuais custo e fluxo custo de agentes por entrega; lead time e cycle time rastreabilidade cobertura entre artefatos 8.2 meta inicial sugerida meta valor atividades executadas por agentes 80–90% tempo humano por entrega r1/r2 até 30–45 minutos aprovações baseadas apenas em confiança no agente zero merges protegidos por gates verificáveis 100% mudanças r3/r4 com owner e rollback definidos 100% auto-merge somente após evidência do piloto 9. implementação do modelo etapa entrega 1 — contrato mínimo classes de risco; responsáveis humanos; templates dos artefatos; formato do evidence pack; condições de escalonamento 2 — harness mínimo agents.md , rules e skills; pre-commit e pre-push; ci fast lane e deep lane; proteção de branch e status checks; codeowners para paths sensíveis — detalhado em repo harness 3 — piloto controlado um fluxo r1 real em autonomia a0/a1; medição de tempo humano e falhas; ajuste de gates e templates; validação de rollback e rastreabilidade 4 — automação do roteamento classificação automática de risco; acionamento de agent teams por etapa; evidence packs automáticos; solicitação apenas dos reviewers necessários; escalonamento com contexto completo 5 — autonomia progressiva auto-merge em r0; deploy automático em r0/r1; ampliação por evidência, não por expectativa; auditoria humana por amostragem 9.1 próximo detalhamento recomendado definir o schema do work item; criar o template do evidence pack; desenhar a matriz risco × gates × aprovações ; especificar os prompts e contratos de cada agente; definir os eventos que movimentam o workflow; criar o primeiro repo harness de referência; e simular uma entrega r1 de ponta a ponta. referências operacionais github rulesets e regras disponíveis github code owners github deployment environments nist secure software development framework "}, {"id": "docs-repo-harness", "path": "docs/repo-harness.md", "section": "Modelo operacional", "title": "Repo harness", "status": "proposed", "updated": "2026-08-09", "html": "<h1 id=\"docs-repo-harness~repo-harness\">Repo harness</h1>\n<blockquote>\n<p>O conjunto de arquivos, verificações e permissões que torna um repositório seguro de operar por um time de agentes — e o que muda quando eles trabalham em paralelo.</p>\n</blockquote>\n<h2 id=\"docs-repo-harness~em-2-minutos\">Em 2 minutos</h2>\n<p>Um agente competente em um repositório sem harness produz código plausível e errado. Ele não sabe qual padrão o time abandonou no ano passado, qual módulo não pode importar qual, quais testes provam o que ele acabou de escrever, nem quando parar e perguntar. Esse conhecimento existe — mas vive na cabeça das pessoas, e a cada execução o agente precisa que alguém o recite de novo. O custo disso não é o erro isolado: é que a revisão humana volta a ser o único gate real, e a autonomia nunca sobe.</p>\n<p>O harness resolve isso convertendo o conhecimento tácito do repositório em <strong>arquivos versionados que o agente lê sozinho e verificações que rodam sem pedir licença</strong>. É um artefato do repositório de código, não do workspace do agente — a organização do trabalho em disco é responsabilidade do <a href=\"#docs-diagrams-tech-lead-workspace\">workspace do Tech Lead</a>; o harness é o que cada repositório carrega dentro de si e viaja junto com o clone.</p>\n<table>\n<thead>\n<tr>\n<th>Camada</th>\n<th>Responde</th>\n<th>Materializa em</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Contexto</strong></td>\n<td>o que este repositório é e quais regras valem</td>\n<td><code>AGENTS.md</code>, <code>docs/rules/</code></td>\n</tr>\n<tr>\n<td><strong>Procedimento</strong></td>\n<td>como executar uma tarefa recorrente do jeito certo</td>\n<td><code>skills/</code>, comandos, scripts</td>\n</tr>\n<tr>\n<td><strong>Verificação</strong></td>\n<td>o que precisa ser verdade antes de avançar</td>\n<td>hooks, CI, políticas de merge</td>\n</tr>\n<tr>\n<td><strong>Permissão</strong></td>\n<td>o que este agente pode tocar e o que exige gente</td>\n<td><code>CODEOWNERS</code>, settings, ambientes</td>\n</tr>\n<tr>\n<td><strong>Evidência</strong></td>\n<td>como provar depois que estava correto</td>\n<td>evidence pack, logs, artefatos</td>\n</tr>\n</tbody>\n</table>\n<p>As camadas são cumulativas e a ordem importa. Verificação sem contexto produz agente que falha rápido sem saber por quê; contexto sem verificação produz agente que acerta às vezes e ninguém sabe quando. A maturidade do harness é o que autoriza subir a autonomia — nunca o contrário.</p>\n<hr>\n<h2 id=\"docs-repo-harness~mapa-do-documento\">Mapa do documento</h2>\n<table>\n<thead>\n<tr>\n<th>Seção</th>\n<th>Responde</th>\n<th>Leia se você…</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-repo-harness~1-o-que-é-e-o-que-não-é\">1. Fronteira</a></td>\n<td>O que pertence ao harness e o que não</td>\n<td>está em dúvida sobre onde algo mora</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~2-as-cinco-camadas\">2. As cinco camadas</a></td>\n<td>O que cada camada garante e o que a quebra custa</td>\n<td>vai avaliar um harness existente</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~3-estrutura-de-arquivos-do-repositório\">3. Estrutura de arquivos</a></td>\n<td>Onde cada peça fica no repositório</td>\n<td>vai montar ou auditar um repo</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~4-camada-de-contexto\">4. Contexto</a></td>\n<td>O que escrever em <code>AGENTS.md</code> e nas rules</td>\n<td>vai escrever o contexto do repo</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~5-camada-de-procedimento\">5. Procedimento</a></td>\n<td>Quando algo vira skill em vez de rule</td>\n<td>vai criar uma skill ou script</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~6-camada-de-verificação\">6. Verificação</a></td>\n<td>Onde cada check pertence na escada</td>\n<td>vai configurar hooks e CI</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~7-camadas-de-permissão-e-evidência\">7. Permissão e evidência</a></td>\n<td>Quem pode o quê e como se prova</td>\n<td>vai definir política de merge e deploy</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~8-o-que-muda-com-agent-teams\">8. Agent Teams</a></td>\n<td>O que quebra quando são vários agentes</td>\n<td>vai rodar agentes em paralelo</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~9-níveis-de-maturidade-hl0hl3\">9. Níveis HL0–HL3</a></td>\n<td>Onde seu repo está e o que falta</td>\n<td>vai propor elevar autonomia</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~10-stack-de-referência\">10. Stack de referência</a></td>\n<td>Uma implementação concreta possível</td>\n<td>quer um ponto de partida executável</td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness~11-checklist-de-conformidade\">11. Checklist</a></td>\n<td>Como validar antes de operar</td>\n<td>vai declarar um repo pronto</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Vizinhos:</strong> <a href=\"#docs-operating-model\">sistema operacional do trio humano</a> · <a href=\"#docs-operating-model-90-10\">modelo operacional 90/10</a> · <a href=\"#docs-diagrams-tech-lead-workspace\">workspace do Tech Lead</a> · <a href=\"#skills-readme\">catálogo de skills</a> · <a href=\"#docs-workflows-readme\">workflows multiagente</a>.</p>\n<hr>\n<h2 id=\"docs-repo-harness~1-o-que-é-e-o-que-não-é\">1. O que é e o que não é</h2>\n<p>O harness é <strong>o contrato executável de um repositório de código</strong>. Ele responde a quatro perguntas que todo agente faz antes de agir — o que é este repositório, como se faz aqui, o que preciso provar, o que não posso tocar — e responde por escrito, dentro do próprio repositório, sem depender de quem está disponível no Slack naquele momento.</p>\n<p>A fronteira mais confundida é com o workspace. Ela vale a pena ser explícita, porque colocar a peça no lado errado gera duplicidade silenciosa: dois lugares descrevem a mesma regra, os dois envelhecem, e o agente lê o errado.</p>\n<table>\n<thead>\n<tr>\n<th>Pergunta</th>\n<th>Mora no harness do repo</th>\n<th>Mora no workspace do agente</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Como este serviço é arquitetado?</td>\n<td>sim, em <code>docs/rules/</code></td>\n<td>não</td>\n</tr>\n<tr>\n<td>Quais são os projetos ativos e suas prioridades?</td>\n<td>não</td>\n<td>sim, em <code>BOARD.md</code> e <code>projects/</code></td>\n</tr>\n<tr>\n<td>Qual o padrão de teste para uma mudança de contrato?</td>\n<td>sim</td>\n<td>não</td>\n</tr>\n<tr>\n<td>Onde está o PRD desta feature?</td>\n<td>não</td>\n<td>sim, em <code>projects/&lt;slug&gt;/product/</code></td>\n</tr>\n<tr>\n<td>Que comando roda a suíte de integração?</td>\n<td>sim, em <code>AGENTS.md</code> ou skill</td>\n<td>não</td>\n</tr>\n<tr>\n<td>Qual branch e worktree este Work Item usa?</td>\n<td>não</td>\n<td>sim, no Work Item</td>\n</tr>\n</tbody>\n</table>\n<p>A regra de decisão: <strong>se a informação continua verdadeira quando outro time clona o repositório, ela é harness</strong>. Se depende de quem está trabalhando, em qual projeto, nesta semana, é workspace.</p>\n<p>O harness também não é a esteira de CI. A esteira é uma das implementações da camada de verificação; um repositório com CI excelente e nenhum <code>AGENTS.md</code> tem meio harness — verifica muito e explica nada, o que produz o pior padrão de todos: o agente descobre a regra por tentativa e erro, gastando ciclos caros para reconstruir informação que já existia.</p>\n<hr>\n<h2 id=\"docs-repo-harness~2-as-cinco-camadas\">2. As cinco camadas</h2>\n<p>Cada camada existe para eliminar uma classe específica de falha. A tabela abaixo é o argumento central do documento: ela liga a camada à falha que ela previne e ao sintoma observável quando ela está ausente.</p>\n<table>\n<thead>\n<tr>\n<th>Camada</th>\n<th>Elimina</th>\n<th>Sintoma quando falta</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Contexto</strong></td>\n<td>agente reconstruindo premissas a cada execução</td>\n<td>soluções plausíveis fora do padrão do repo; mesma correção pedida em PRs diferentes</td>\n</tr>\n<tr>\n<td><strong>Procedimento</strong></td>\n<td>variação entre execuções da mesma tarefa</td>\n<td>dois agentes resolvem o mesmo tipo de tarefa de formas incompatíveis</td>\n</tr>\n<tr>\n<td><strong>Verificação</strong></td>\n<td>confiança substituindo prova</td>\n<td>aprovação baseada em \"o agente parece confiável\"; defeito descoberto em produção</td>\n</tr>\n<tr>\n<td><strong>Permissão</strong></td>\n<td>mudança fora do escopo autorizado</td>\n<td>agente altera migração, secret ou gate sem que ninguém tenha decidido isso</td>\n</tr>\n<tr>\n<td><strong>Evidência</strong></td>\n<td>conclusão sem rastro auditável</td>\n<td>ninguém consegue reconstruir por que aquela mudança foi aprovada</td>\n</tr>\n</tbody>\n</table>\n<p>A ordem de construção segue a mesma sequência, e a razão é econômica. Contexto é o mais barato de escrever e o que mais reduz retrabalho imediato. Verificação é cara de configurar mas é a única camada que permite reduzir revisão humana. Evidência só tem valor quando existe algo verificado para registrar — construída antes, produz arquivos que ninguém lê.</p>\n<p>Pular contexto para ir direto a gates é o erro de sequenciamento mais comum. Ele parece produtivo porque gates dão sinal imediato, mas produz um agente que passa a tratar o pipeline como oráculo: tenta, falha, ajusta, tenta de novo. Cada volta custa tempo de CI e tokens, e nenhuma delas ensina o padrão para a próxima execução.</p>\n<hr>\n<h2 id=\"docs-repo-harness~3-estrutura-de-arquivos-do-repositório\">3. Estrutura de arquivos do repositório</h2>\n<p>A estrutura abaixo é o alvo completo — um repositório em <a href=\"#docs-repo-harness~9-níveis-de-maturidade-hl0hl3\">HL3</a>. Repositórios em níveis anteriores contêm um subconjunto, e a seção de maturidade indica qual.</p>\n<pre><code class=\"language-text\">&lt;repositório&gt;/\n├── AGENTS.md                      # contrato de entrada do agente\n├── README.md                      # uso humano: rodar, buildar, contribuir\n├── CODEOWNERS                     # propriedade por path\n│\n├── docs/\n│   ├── rules/\n│   │   ├── architecture.md        # módulos, fronteiras, dependências permitidas\n│   │   ├── coding.md              # convenções, padrões aceitos e proibidos\n│   │   ├── testing.md             # níveis obrigatórios por tipo de mudança\n│   │   ├── security.md            # dados, secrets, autenticação, privacidade\n│   │   └── operations.md          # SLOs, observabilidade, rollout, rollback\n│   ├── adr/\n│   │   └── ADR-NNN-&lt;slug&gt;.md      # decisões e consequências\n│   └── evidence/\n│       └── &lt;work-item&gt;/           # evidence pack por unidade de trabalho\n│\n├── skills/\n│   └── &lt;skill&gt;/SKILL.md           # procedimentos executáveis do repo\n│\n├── .agent/\n│   ├── settings.json              # tools permitidas, limites, modelos\n│   └── permissions.md             # o que exige humano neste repositório\n│\n├── scripts/\n│   ├── verify.sh                  # entrada única das verificações locais\n│   └── evidence.sh                # coleta e empacota evidência\n│\n├── .hooks/                        # pre-commit e pre-push versionados\n└── .ci/                           # fast lane e deep lane\n</code></pre>\n<p>Três decisões nessa árvore merecem justificativa, porque a alternativa aparente é sempre mais simples e sempre pior no médio prazo.</p>\n<p><strong>Rules em arquivos separados, não em um <code>AGENTS.md</code> gigante.</strong> O <code>AGENTS.md</code> é lido inteiro em toda execução; as rules são lidas sob demanda. Fundir os dois faz cada tarefa trivial pagar o custo de contexto da regra de migração de banco. A separação é uma decisão de orçamento de contexto, não de organização estética.</p>\n<p><strong><code>scripts/verify.sh</code> como entrada única.</strong> Hooks, CI e agente chamam o mesmo script. Sem isso, a verificação local e a de CI divergem, e a divergência aparece na forma mais cara possível — o agente entrega, o CI reprova, e ninguém consegue reproduzir localmente.</p>\n<p><strong><code>docs/evidence/</code> dentro do repositório.</strong> A evidência acompanha o código que ela comprova. Guardada fora, ela sobrevive à mudança de ferramenta de CI mas perde a ligação com o commit; guardada dentro, a ligação é o próprio histórico do Git.</p>\n<table>\n<thead>\n<tr>\n<th>Arquivo</th>\n<th>Carrega</th>\n<th>Não carrega</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>AGENTS.md</code></td>\n<td>como operar o repo, comandos, quando parar</td>\n<td>arquitetura detalhada, histórico de decisões</td>\n</tr>\n<tr>\n<td><code>docs/rules/*.md</code></td>\n<td>a regra e o motivo dela</td>\n<td>instruções de execução passo a passo</td>\n</tr>\n<tr>\n<td><code>docs/adr/</code></td>\n<td>por que a decisão foi tomada e o que ela custa</td>\n<td>a regra vigente resultante</td>\n</tr>\n<tr>\n<td><code>skills/&lt;skill&gt;/SKILL.md</code></td>\n<td>passo a passo verificável de uma tarefa recorrente</td>\n<td>conhecimento geral sobre o domínio</td>\n</tr>\n<tr>\n<td><code>.agent/permissions.md</code></td>\n<td>o que exige autorização humana</td>\n<td>política de risco global do time</td>\n</tr>\n<tr>\n<td><code>CODEOWNERS</code></td>\n<td>quem aprova mudança em cada path</td>\n<td>por que aquele path é sensível</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-repo-harness~4-camada-de-contexto\">4. Camada de contexto</h2>\n<h3 id=\"docs-repo-harness~41-agentsmd--o-contrato-de-entrada\">4.1 <code>AGENTS.md</code> — o contrato de entrada</h3>\n<p>O <code>AGENTS.md</code> é lido antes de qualquer ação, o que torna cada linha dele um custo fixo por execução. Isso impõe uma disciplina que o <code>README.md</code> não tem: ele responde o que o agente precisa para <strong>agir corretamente na primeira tentativa</strong>, e delega o resto por ponteiro.</p>\n<table>\n<thead>\n<tr>\n<th>Bloco</th>\n<th>Conteúdo</th>\n<th>Erro comum</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Identidade</td>\n<td>o que o serviço faz e para quem, em três frases</td>\n<td>reescrever o pitch do produto</td>\n</tr>\n<tr>\n<td>Comandos</td>\n<td>instalar, buildar, testar, verificar, rodar local</td>\n<td>listar comandos que ninguém usa mais</td>\n</tr>\n<tr>\n<td>Fronteiras</td>\n<td>o que não pode ser alterado sem autorização</td>\n<td>descrever a arquitetura inteira</td>\n</tr>\n<tr>\n<td>Verificação</td>\n<td>o que precisa passar antes de considerar pronto</td>\n<td>duplicar a configuração de CI</td>\n</tr>\n<tr>\n<td>Escalonamento</td>\n<td>as condições em que se para e devolve a decisão</td>\n<td>omitir — é o bloco mais esquecido</td>\n</tr>\n<tr>\n<td>Ponteiros</td>\n<td>onde ficam rules, ADRs, skills e evidências</td>\n<td>inlinar o conteúdo apontado</td>\n</tr>\n</tbody>\n</table>\n<p>O bloco de escalonamento é o que mais falta e o que mais importa. Sem ele, um agente diante de requisito contraditório escolhe uma interpretação e segue — e a escolha só aparece na revisão, quando o trabalho já foi feito. O <a href=\"#docs-operating-model-90-10~62-contrato-de-escalonamento\">contrato de escalonamento</a> do modelo operacional define as condições genéricas; o <code>AGENTS.md</code> acrescenta as específicas do repositório.</p>\n<h3 id=\"docs-repo-harness~42-rules--a-regra-e-o-motivo\">4.2 Rules — a regra e o motivo</h3>\n<p>Rules descrevem estado desejado, não procedimento. \"Módulos de domínio não importam de infraestrutura\" é rule; \"para adicionar um adapter, crie a interface em X e a implementação em Y\" é skill. A confusão entre os dois produz rules longas que ninguém lê e skills vagas que não se consegue executar.</p>\n<p>Toda rule carrega o motivo junto. Isso não é cortesia editorial: um agente que conhece a razão de uma regra decide corretamente no caso de borda que a regra não previu, enquanto um agente que só conhece a regra ou a aplica cegamente ou a ignora.</p>\n<p>As rules cobrem quatro frentes, e a divisão existe para que cada uma possa ser carregada isoladamente conforme a tarefa:</p>\n<table>\n<thead>\n<tr>\n<th>Frente</th>\n<th>Define</th>\n<th>Arquivo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Estrutura de código</td>\n<td>arquitetura e fronteiras entre módulos, convenções e nomes, padrões aceitos e proibidos, injeção de dependência e composição</td>\n<td><code>architecture.md</code>, <code>coding.md</code></td>\n</tr>\n<tr>\n<td>Fluxo</td>\n<td>gitflow e estratégia de branches, critérios de validação e homologação, propriedade por paths</td>\n<td><code>coding.md</code>, <code>CODEOWNERS</code></td>\n</tr>\n<tr>\n<td>Risco e dados</td>\n<td>classificação de risco e permissões por fase, segurança, privacidade e uso de dados</td>\n<td><code>security.md</code></td>\n</tr>\n<tr>\n<td>Operação</td>\n<td>SLOs, observabilidade, rollout e rollback</td>\n<td><code>operations.md</code></td>\n</tr>\n<tr>\n<td>Estratégia de testes</td>\n<td>quais níveis são obrigatórios por tipo de mudança</td>\n<td><code>testing.md</code></td>\n</tr>\n</tbody>\n</table>\n<p>A estratégia de testes merece destaque porque é a rule que os gates traduzem diretamente em bloqueio:</p>\n<pre><code class=\"language-text\">unitários → arquitetura → integração / TAAC → contrato → end-to-end → acessibilidade → mutação\n</code></pre>\n<p>A rule define quais níveis são <strong>obrigatórios por tipo de mudança</strong>. Sem esse mapeamento, o agente ou escreve testes de menos, e o gate reprova tarde, ou escreve testes de mais, e o custo por entrega sobe sem ganho de segurança.</p>\n<hr>\n<h2 id=\"docs-repo-harness~5-camada-de-procedimento\">5. Camada de procedimento</h2>\n<p>Uma tarefa vira skill quando três condições se acumulam: ela se repete, ela tem um jeito certo de ser feita, e errá-la custa caro o suficiente para justificar escrever o procedimento. Tarefa que se repete mas tolera variação não precisa de skill — precisa de rule. Tarefa cara mas única não precisa de skill — precisa de um humano.</p>\n<p>O catálogo global em <a href=\"#skills-readme\"><code>skills/</code></a> cobre os procedimentos que valem para qualquer repositório: discovery, especificação, implementação, revisão, publicação e operação de workspace. O repositório acrescenta apenas o que é dele — o procedimento de migração daquele banco, o fluxo de rollout daquele serviço, a forma de gerar aquele client.</p>\n<table>\n<thead>\n<tr>\n<th>Origem</th>\n<th>Contém</th>\n<th>Exemplo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Catálogo global</td>\n<td>procedimento válido em qualquer repo</td>\n<td><code>code-review</code>, <code>commit</code>, <code>create-spec</code></td>\n</tr>\n<tr>\n<td>Skill do repositório</td>\n<td>procedimento específico daquele código</td>\n<td>migração de schema, geração de SDK, rollout do serviço</td>\n</tr>\n</tbody>\n</table>\n<p>Toda skill declara objetivo, inputs, outputs, tools permitidas, critérios de parada, exemplos e testes. O critério de parada é o campo que separa uma skill de um tutorial: sem ele, o agente não sabe se terminou, e a resposta padrão de um agente que não sabe se terminou é continuar.</p>\n<p>Scripts são o degrau abaixo da skill. Quando o procedimento é determinístico o bastante para virar código, ele deve virar código — um script é mais barato de executar, mais fácil de testar e impossível de interpretar errado. A skill existe para o que exige julgamento; o script, para o que não exige.</p>\n<hr>\n<h2 id=\"docs-repo-harness~6-camada-de-verificação\">6. Camada de verificação</h2>\n<p>A escada de gates completa — local, CI, merge, ambiente, pós-deploy — está definida em <a href=\"#docs-operating-model-90-10~6-arquitetura-de-gates\"><code>operating-model-90-10.md</code></a> e não se repete aqui. O que o harness acrescenta é a decisão de <strong>onde cada check pertence</strong>, que é onde a maioria das configurações erra.</p>\n<p>O critério é a razão entre custo de execução e frequência de falha. Um check barato que falha com frequência pertence ao degrau mais baixo possível; um check caro que quase nunca falha pertence ao mais alto. Colocar um check caro cedo trava o agente em cada commit; colocar um check barato tarde desperdiça uma volta inteira de CI para informar algo que se saberia em dois segundos.</p>\n<table>\n<thead>\n<tr>\n<th>Se o check…</th>\n<th>…ele pertence a</th>\n<th>Porque</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>roda em segundos e falha com frequência</td>\n<td>pre-commit</td>\n<td>corrigir custa quase nada e o loop é imediato</td>\n</tr>\n<tr>\n<td>precisa de container ou serviço externo</td>\n<td>pre-push ou CI</td>\n<td>inviável a cada commit</td>\n</tr>\n<tr>\n<td>depende de ambiente limpo ou build completo</td>\n<td>CI</td>\n<td>resultado local não é confiável</td>\n</tr>\n<tr>\n<td>exige julgamento sobre risco ou trade-off</td>\n<td>merge</td>\n<td>é decisão, não verificação</td>\n</tr>\n<tr>\n<td>só é observável com tráfego real</td>\n<td>pós-deploy</td>\n<td>não existe forma de antecipar</td>\n</tr>\n</tbody>\n</table>\n<p>Duas travas se aplicam especificamente a repositórios operados por agentes. A primeira: <strong>o resultado de um gate é input do agente, não apenas do humano</strong> — uma falha de CI precisa produzir mensagem acionável o suficiente para o agente corrigir sozinho, o que na prática significa apontar arquivo, regra violada e correção esperada. Gate que só diz \"falhou\" transfere para a revisão humana o trabalho que ele existia para evitar.</p>\n<p>A segunda: <strong>mudança em rules, hooks ou CI eleva o risco automaticamente</strong>, e nenhum agente altera gates dentro do mesmo fluxo que aqueles gates avaliam. Sem essa separação, o caminho de menor resistência para um agente bloqueado passa a ser afrouxar o bloqueio.</p>\n<hr>\n<h2 id=\"docs-repo-harness~7-camadas-de-permissão-e-evidência\">7. Camadas de permissão e evidência</h2>\n<p>Permissão e evidência são as duas camadas que só existem porque quem opera o repositório não é uma pessoa. Um humano diante de uma migração de banco hesita; um agente, não — a hesitação precisa estar escrita.</p>\n<p>A permissão se expressa em três níveis que se sobrepõem, do mais granular ao mais amplo. <code>CODEOWNERS</code> define quem aprova mudança em cada path, e é a trava mais eficaz porque age no ponto exato do risco. As configurações do agente definem quais tools ele pode invocar e com que limites. As proteções de branch e ambiente definem o que exige autorização independentemente de quem pediu.</p>\n<table>\n<thead>\n<tr>\n<th>Categoria de path</th>\n<th>Tratamento típico</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>migrações, schema, dados persistidos</td>\n<td>owner obrigatório; nunca auto-merge</td>\n</tr>\n<tr>\n<td>autenticação, autorização, secrets</td>\n<td>owner de segurança; risco elevado automaticamente</td>\n</tr>\n<tr>\n<td>contratos públicos e integrações externas</td>\n<td>owner técnico; verificação de compatibilidade</td>\n</tr>\n<tr>\n<td>rules, hooks, CI, <code>AGENTS.md</code></td>\n<td>owner do harness; separado do fluxo avaliado</td>\n</tr>\n<tr>\n<td>código de aplicação coberto por testes</td>\n<td>fluxo normal conforme classe de risco</td>\n</tr>\n</tbody>\n</table>\n<p>A evidência fecha o ciclo. Ela existe para que a aprovação seja sobre fatos verificáveis, e não sobre a impressão que o resumo do agente causou. O evidence pack de uma unidade de trabalho registra o que foi feito, o que foi verificado, o que falhou e foi corrigido, e o que permanece em aberto — com ponteiros para os artefatos originais em vez de reproduzi-los.</p>\n<p>O critério de qualidade é único e severo: <strong>um evidence pack serve se outra pessoa consegue refazer a verificação sem perguntar nada a quem o produziu</strong>. Pack que exige contexto adicional não é evidência, é resumo.</p>\n<hr>\n<h2 id=\"docs-repo-harness~8-o-que-muda-com-agent-teams\">8. O que muda com Agent Teams</h2>\n<p>Um harness dimensionado para um agente por vez falha de formas específicas quando vários agentes operam em paralelo, e as falhas não são de qualidade — são de coordenação. Cada uma tem uma contramedida no harness.</p>\n<table>\n<thead>\n<tr>\n<th>Falha</th>\n<th>O que acontece</th>\n<th>Contramedida no harness</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sobrescrita silenciosa</td>\n<td>dois agentes editam o mesmo arquivo; o último vence</td>\n<td>worktree por Work Item; nunca clone compartilhado</td>\n</tr>\n<tr>\n<td>Auto-aprovação</td>\n<td>o agente que produziu também revisa</td>\n<td>identidade distinta por agente; owner ≠ autor</td>\n</tr>\n<tr>\n<td>Divergência de contexto</td>\n<td>agentes leem versões diferentes da mesma rule</td>\n<td>rules versionadas com o código; sem contexto injetado fora do repo</td>\n</tr>\n<tr>\n<td>Contenção em arquivo comum</td>\n<td>vários agentes atualizam o mesmo board ou log</td>\n<td>um arquivo por unidade de trabalho; consolidação por um coordenador</td>\n</tr>\n<tr>\n<td>Deriva de gate</td>\n<td>um agente afrouxa a verificação que o bloqueia</td>\n<td>mudança em gate sai do fluxo avaliado e exige owner</td>\n</tr>\n<tr>\n<td>Perda de rastro</td>\n<td>não se sabe qual agente produziu o quê</td>\n<td>autoria, modelo e versão registrados em cada commit e evidência</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-repo-harness~81-isolamento-de-execução\">8.1 Isolamento de execução</h3>\n<p>O isolamento é a contramedida de maior impacto e a mais barata de adotar. Cada missão trabalha em um worktree próprio, derivado do clone canônico, com branch dedicada ao Work Item — o padrão de diretórios está definido no <a href=\"#docs-diagrams-tech-lead-workspace~worktrees-para-agentes-concorrentes\">workspace do Tech Lead</a>.</p>\n<p>O que o harness precisa garantir do seu lado é que <strong>o repositório funcione a partir de um worktree limpo sem configuração manual</strong>. Repositório que depende de um <code>.env</code> montado à mão, de um cache local aquecido ou de um passo não documentado quebra o isolamento na prática, mesmo que a estrutura de diretórios esteja correta. O teste é direto: um worktree recém-criado roda <code>scripts/verify.sh</code> com sucesso sem intervenção.</p>\n<h3 id=\"docs-repo-harness~82-separação-entre-produzir-e-aprovar\">8.2 Separação entre produzir e aprovar</h3>\n<p>Nenhum agente aprova a própria mudança. Isso exige que agentes tenham <strong>identidades distintas e verificáveis</strong> no sistema de versionamento — não basta um prompt instruindo o agente revisor a ser rigoroso, porque a proteção precisa ser estrutural, aplicada pela política de merge e não pela boa-fé do modelo.</p>\n<p>A separação vale também entre papéis: o agente que implementa não é o que revisa, e o que revisa não é o que decide o merge em mudanças de risco elevado. A <a href=\"#docs-workflows-05-adversarial-validation\">validação adversarial</a> é o workflow que materializa isso.</p>\n<h3 id=\"docs-repo-harness~83-orçamento-de-contexto-por-agente\">8.3 Orçamento de contexto por agente</h3>\n<p>Com um agente, contexto excedente custa tokens. Com um time, custa consistência: agentes com janelas diferentes de contexto tomam decisões diferentes sobre o mesmo repositório, e a divergência aparece como inconsistência arquitetural que ninguém autorizou.</p>\n<p>A contramedida é estrutural — <code>AGENTS.md</code> enxuto, rules carregadas sob demanda por área, skills que declaram exatamente o que precisam ler. Um harness que exige ler tudo para fazer qualquer coisa não escala para time.</p>\n<hr>\n<h2 id=\"docs-repo-harness~9-níveis-de-maturidade-hl0hl3\">9. Níveis de maturidade HL0–HL3</h2>\n<p>Os níveis descrevem o que existe no repositório, e servem para responder uma pergunta só: <strong>até onde a autonomia pode subir com segurança neste repo</strong>. A nomenclatura <code>HL</code> evita colisão com os checkpoints humanos <code>H1–H6</code> do <a href=\"#docs-operating-model-90-10~2-review-de-decisão\">modelo 90/10</a>.</p>\n<table>\n<thead>\n<tr>\n<th>Nível</th>\n<th>O repositório tem</th>\n<th>Autonomia sustentada</th>\n<th>O que ainda depende de gente</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HL0 — nu</strong></td>\n<td><code>README.md</code>, testes eventuais, CI de build</td>\n<td>nenhuma — assistido</td>\n<td>tudo; revisão humana é o único gate</td>\n</tr>\n<tr>\n<td><strong>HL1 — legível</strong></td>\n<td><code>AGENTS.md</code>, rules mínimas, <code>scripts/verify.sh</code>, pre-commit</td>\n<td><a href=\"#docs-operating-model-90-10~7-autonomia-progressiva\">A0–A1</a></td>\n<td>integração e liberação; revisão de conteúdo ainda ampla</td>\n</tr>\n<tr>\n<td><strong>HL2 — verificável</strong></td>\n<td>CI por risco e paths, <code>CODEOWNERS</code>, proteção de branch, evidence pack</td>\n<td>A2</td>\n<td>merge em R2+; decisões de trade-off</td>\n</tr>\n<tr>\n<td><strong>HL3 — operável por time</strong></td>\n<td>skills do repo, worktree limpo, identidades por agente, gates de ambiente e pós-deploy, rollback testado</td>\n<td>A3–A4</td>\n<td>exceções, incidentes e auditoria por amostragem</td>\n</tr>\n</tbody>\n</table>\n<p>A progressão tem uma regra que a torna útil em vez de decorativa: <strong>o nível do harness é teto da autonomia, nunca consequência dela</strong>. Um repositório em HL1 operando em A2 não está adiantado — está com um gate faltando e ninguém observando. O <a href=\"#docs-operating-model-90-10~7-autonomia-progressiva\">critério para elevar autonomia</a> exige evidência acumulada além do nível do harness.</p>\n<p>A ordem de construção entre níveis segue o retorno decrescente. Sair de HL0 para HL1 é o movimento de maior impacto por esforço — é onde o agente para de reconstruir premissas. De HL1 para HL2 é onde a revisão humana começa a encolher de fato, e é o movimento que mais exige disciplina, porque gates mal calibrados geram falso positivo e o time aprende a ignorá-los. De HL2 para HL3 só compensa quando há mais de um agente em paralelo; antes disso, o custo de isolamento e identidade não se paga.</p>\n<hr>\n<h2 id=\"docs-repo-harness~10-stack-de-referência\">10. Stack de referência</h2>\n<p>As opções abaixo são <strong>uma</strong> implementação possível, não uma decisão de adoção. O contrato do harness não deve depender de marca — o que a tabela oferece é um ponto de partida concreto para quem está montando o primeiro repositório e não quer decidir dez ferramentas antes de começar. A avaliação de qualquer alternativa passa pelo <a href=\"#docs-operating-model~126-contrato-de-avaliação-de-uma-ferramenta\">contrato de avaliação de ferramenta</a>.</p>\n<table>\n<thead>\n<tr>\n<th>Camada</th>\n<th>Implementação de referência</th>\n<th>Papel</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Contexto</td>\n<td><code>AGENTS.md</code> + Markdown em <code>docs/rules/</code></td>\n<td>lido pelo agente e pela pessoa, versionado com o código</td>\n</tr>\n<tr>\n<td>Procedimento</td>\n<td>skills em Markdown + scripts POSIX</td>\n<td>procedimento com julgamento e procedimento determinístico</td>\n</tr>\n<tr>\n<td>Verificação local</td>\n<td>pre-commit framework chamando <code>scripts/verify.sh</code></td>\n<td>mesmo comando local e em CI</td>\n</tr>\n<tr>\n<td>Verificação em CI</td>\n<td>GitHub Actions com fast lane e deep lane</td>\n<td>seleção de checks por risco e paths</td>\n</tr>\n<tr>\n<td>Segurança</td>\n<td>CodeQL, secret scanning, dependency review</td>\n<td>achados com regra reproduzível</td>\n</tr>\n<tr>\n<td>Permissão</td>\n<td><code>CODEOWNERS</code>, branch protection, environments</td>\n<td>trava estrutural, não instrução em prompt</td>\n</tr>\n<tr>\n<td>Evidência</td>\n<td>artefatos de workflow + <code>docs/evidence/&lt;work-item&gt;/</code></td>\n<td>rastro auditável ligado ao commit</td>\n</tr>\n<tr>\n<td>Isolamento</td>\n<td><code>git worktree</code> por Work Item</td>\n<td>execução paralela sem contenção</td>\n</tr>\n<tr>\n<td>Observabilidade</td>\n<td>OpenTelemetry + backend do time</td>\n<td>sinal de pós-deploy que sustenta A3</td>\n</tr>\n</tbody>\n</table>\n<p>Duas escolhas dessa lista costumam ser questionadas, e ambas têm resposta curta. <strong>Markdown em vez de formato estruturado</strong> para rules e skills: o consumidor primário é um modelo de linguagem, e prosa com estrutura leve é lida melhor que YAML aninhado — estrutura rígida só compensa quando há automação lendo o mesmo arquivo. <strong>Duas
