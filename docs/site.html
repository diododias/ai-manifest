n<td>Glossário / domínio</td>\n<td>Entidades-chave</td>\n</tr>\n<tr>\n<td>Fluxos → exceções</td>\n<td>Edge cases</td>\n</tr>\n<tr>\n<td>Fora de escopo</td>\n<td>Out of scope</td>\n</tr>\n</tbody>\n</table>\n<p>RN estruturada ≈ os requisitos funcionais (\"o sistema deve …\" segue a mesma\nestrutura), então a conversão RN→requisito fica quase 1:1.</p>\n<p>As <code>⚠️ Gaps</code> e <code>DA-XX</code> em aberto viram pendências de clarificação no PRD/SPEC —\nresolva na agenda antes de especificar.</p>\n<h2 id=\"skills-business-discovery-skill~antes-da-agenda\">Antes da agenda</h2>\n<p>Use <code>templates/roteiro-agenda.md</code> desta skill para preparar a pauta — ele\nforça explicitar o contexto implícito que senão não entra na transcrição.\nQuanto melhor o roteiro for seguido, menos lacunas a skill precisa sinalizar.</p>", "toc": [{"level": 2, "id": "skills-business-discovery-skill~problema-que-resolve", "text": "Problema que resolve"}, {"level": 2, "id": "skills-business-discovery-skill~input", "text": "Input"}, {"level": 2, "id": "skills-business-discovery-skill~saída", "text": "Saída"}, {"level": 2, "id": "skills-business-discovery-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-business-discovery-skill~passos", "text": "Passos"}, {"level": 3, "id": "skills-business-discovery-skill~1-identificar-a-feature", "text": "1. Identificar a feature"}, {"level": 3, "id": "skills-business-discovery-skill~2-carregar-baseline", "text": "2. Carregar baseline"}, {"level": 3, "id": "skills-business-discovery-skill~25-limpeza-da-transcrição-se-vtt", "text": "2.5. Limpeza da transcrição (se VTT)"}, {"level": 3, "id": "skills-business-discovery-skill~3-extrair-da-transcrição", "text": "3. Extrair da transcrição"}, {"level": 3, "id": "skills-business-discovery-skill~4-diff-contra-o-baseline", "text": "4. Diff contra o baseline"}, {"level": 3, "id": "skills-business-discovery-skill~5-detectar-lacunas-gap-detection", "text": "5. Detectar lacunas (gap detection)"}, {"level": 3, "id": "skills-business-discovery-skill~6-escrever-o-documento", "text": "6. Escrever o documento"}, {"level": 3, "id": "skills-business-discovery-skill~7-reportar-no-chat", "text": "7. Reportar no chat"}, {"level": 2, "id": "skills-business-discovery-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-business-discovery-skill~handoff-pra-review-prd-e-create-spec", "text": "Handoff pra review-prd e create-spec"}, {"level": 2, "id": "skills-business-discovery-skill~antes-da-agenda", "text": "Antes da agenda"}], "text": " skill: business discovery transforma a transcrição de uma agenda (você + pm) em requisitos de negócio estruturados e acumulativos . cada agenda atualiza um documento vivo por feature — não é extração one-shot. problema que resolve transcrições perdem o contexto implícito: como você e a pm já compartilham histórico, a agenda fala só um pedaço da demanda e referencia coisas sem definir (\"aquele fluxo que a gente falou\"). esta skill (a) acumula o contexto das agendas anteriores no documento e (b) sinaliza explicitamente as referências não resolvidas, em vez de inventar. input obrigatório: caminho (ou conteúdo) da transcrição da agenda. opcional: nome/slug da feature (se não der pra inferir, pergunte). opcional: materiais que a pm trouxe (prd, mockup, planilha). saída documento em business-discovery/&lt;feature-slug&gt;/requisitos.md , usando templates/requisitos.md desta skill. consulte templates/exemplo-preenchido.md apenas como referência de preenchimento. contrato de artefatos antes de escrever, siga o contrato compartilhado . o caminho acima é o padrão; use a convenção do repositório consumidor se ela existir. passos 1. identificar a feature infira o slug do conteúdo (ex: lista-de-espera ). se ambíguo, pergunte antes de prosseguir. alvo: business-discovery/&lt;feature-slug&gt;/requisitos.md . 2. carregar baseline se o arquivo já existe, leia-o inteiro — é o contexto acumulado das agendas anteriores. toda extração desta agenda é um delta contra esse baseline. se não existe, esta é a primeira agenda da feature. 2.5. limpeza da transcrição (se vtt) se o arquivo de entrada for um .vtt bruto gerado por ferramentas de reunião (teams, meet, zoom), antes de processar , execute o script de limpeza auxiliar para remover timestamps e reduzir o consumo de tokens. comando a ser executado no terminal: python3 scripts/business-discovery-clean-vtt.py &lt;caminho_do_vtt&gt; -o &lt;caminho_do_vtt_limpo.txt&gt; em seguida, leia o arquivo .txt gerado e use-o como base para a extração. se a transcrição já for texto limpo, pule esta etapa. 3. extrair da transcrição levante (citando trechos quando útil): - user stories — quem, quer o quê, pra quê. capture a prioridade se a agenda deu sinal (p1 = mvp, sem isso não entrega valor; p2/p3 = incrementos). - cenários (dado / quando / então) — pra cada story, os exemplos testáveis ditos na agenda. o então é o resultado observável; se não foi dito, é lacuna — não invente o resultado . inclua o caminho de exceção quando citado. - regras de negócio — atenção ao marcador falado \"regra de negócio:\". normalize cada uma com pré-condição + gatilho + \"o sistema deve\" + resposta. cada regra precisa de exemplo concreto; se faltou o exemplo ou alguma cláusula, registre como lacuna — não invente número, valor nem gatilho . aponte qual cenário a verifica. - critérios de sucesso (mensuráveis) — métrica de negócio com número e sem tecnologia (sc-xx). adjetivo vago (\"rápido\", \"fácil\") sem número é lacuna. - fluxos — happy path e exceções / edge cases (vazio, limite, concorrência). - decisões tomadas na agenda. - dúvidas levantadas e não resolvidas. - termos de domínio novos → glossário (marque unicidade/identidade se dita). - fora de escopo dito explicitamente. 4. diff contra o baseline para cada item, classifique: - novo — não existia no baseline. - alterado — refina/muda um item existente (mostre antes → depois). - contradito — conflita com o baseline. não sobrescreva calado: registre o conflito e levante como dúvida (da-xx) pra confirmar na próxima agenda. reaproveite numerações existentes (rn-xx, us-x); só crie número novo pra item novo. 5. detectar lacunas (gap detection) é a parte que aumenta a assertividade. liste em ⚠️ gaps detectados : - referências não resolvidas — \"aquele fluxo\", \"igual o outro e-mail\", \"do jeito que a gente fez\": algo citado mas não definido nesta transcrição nem no baseline. diga o que assumiu (se assumiu) e marque \"confirmar\". - regras sem exemplo concreto. - cenários sem \"então\" claro — story ou regra sem resultado observável definido. - regra de negócio sem cenário que a verifique (dado/quando/então). - regra incompleta — sem gatilho/pré-condição, ou \"deve\" com resposta vaga. - critério de sucesso sem número — métrica com adjetivo vago em vez de alvo. - dúvidas sem dono/prazo → vira da-xx. se precisou assumir algo pra fechar uma regra, isso é uma lacuna — registre. 6. escrever o documento atualize requisitos.md seguindo o template. regras: - estado atual consolidado: mantenha a versão final e consolidada dos requisitos no topo do documento. se houver mudanças ou contradições resolvidas na nova agenda, atualize este estado consolidado para refletir a decisão final. - changelog é append-only e fica no final: adicione uma entrada nova com a data da agenda e o resumo do delta (novo/alterado/contradito) no final do documento para servir de histórico de auditoria. nunca apague entradas anteriores. - atualize o cabeçalho (data, lista de agendas, status). - mantenha as seções na ordem do template. 7. reportar no chat devolva, curto: - resumo do delta (x regras novas, y alteradas, z contraditas). - a lista de ⚠️ gaps + da-xx — as perguntas pra levar na próxima agenda. não resolva as lacunas inventando; o valor é a lista de perguntas. convenções rn-xx regras de negócio (alinhado com o rn-30 do projeto). us-x user stories (com prioridade p1 / p2 / p3 ) · sc-x critérios de sucesso mensuráveis · da-x dúvidas em aberto (com dono + prazo). cenários em gherkin pt-br: dado / quando / então (+ e / mas ). regras (rn) estruturadas em português (marcador \"o sistema deve \"): enquanto (estado), quando (evento), onde (opcional), se…então (indesejado), ubíqua (sem keyword), composta (enquanto+quando). ⚠️ \"quando/então\" aparecem em regras e em gherkin — a rn é declarativa com \"deve\"; o cenário é a sequência dado→quando→então. status: 🟡 em descoberta · 🟢 pronto pra especificar · ✅ virou spec. escreva em português. prefira exemplo numérico a descrição vaga. handoff pra review-prd e create-spec o requisitos.md é o artefato de descoberta — alimenta a skill review-prd quando a feature vira 🟢, e depois a skill create-spec para a especificação técnica. o formato espelha o prd produzido por essas skills pra a passagem ser direta: business-discovery prd / spec us-x + cenários d/q/e user scenarios → acceptance scenarios prioridade p1/p2/p3 user story priority rn-xx requisitos funcionais sc-xx critérios de sucesso glossário / domínio entidades-chave fluxos → exceções edge cases fora de escopo out of scope rn estruturada ≈ os requisitos funcionais (\"o sistema deve …\" segue a mesma estrutura), então a conversão rn→requisito fica quase 1:1. as ⚠️ gaps e da-xx em aberto viram pendências de clarificação no prd/spec — resolva na agenda antes de especificar. antes da agenda use templates/roteiro-agenda.md desta skill para preparar a pauta — ele força explicitar o contexto implícito que senão não entra na transcrição. quanto melhor o roteiro for seguido, menos lacunas a skill precisa sinalizar. "}, {"id": "skills-write-feature-skill", "path": "skills/write-feature/SKILL.md", "section": "Skills", "title": "write-feature", "status": "", "updated": "", "html": "<h1 id=\"skills-write-feature-skill~write-feature\">write-feature</h1><blockquote><p>Extrai e fatia histórias de produto a partir de requisitos e transcrição de refinamento, mantendo vínculo com regras e critérios. Use após a discovery quando for necessário preparar histórias para o PRD.</p></blockquote><h2 id=\"skills-write-feature-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-write-feature-skill~goal\">Goal</h2>\n<p>Transformar <code>requisitos.md</code> + transcrição da agenda de refinamento em histórias estruturadas, prontas para revisão e geração do PRD.</p>\n<h2 id=\"skills-write-feature-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Antes de criar histórias, siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-write-feature-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>business-discovery/&lt;feature-slug&gt;/requisitos.md</code></li>\n<li><strong>Obrigatório:</strong> transcrição da agenda de refinamento</li>\n<li><strong>Opcional:</strong> nome/slug da feature (inferir de requisitos.md se não fornecido)</li>\n</ul>\n<h2 id=\"skills-write-feature-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-write-feature-skill~1-localizar-a-feature\">1. Localizar a feature</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira de <code>requisitos.md</code>.</li>\n<li>Verifique se <code>business-discovery/&lt;feature-slug&gt;/requisitos.md</code> existe.</li>\n</ul>\n<h3 id=\"skills-write-feature-skill~2-carregar-contexto\">2. Carregar contexto</h3>\n<ul>\n<li>Leia <code>requisitos.md</code> por inteiro — é o baseline de requisitos.</li>\n<li>Leia a transcrição da agenda de refinamento.</li>\n</ul>\n<h3 id=\"skills-write-feature-skill~3-extrair-histórias-da-transcrição\">3. Extrair histórias da transcrição</h3>\n<p>Identifique as histórias discutidas na agenda de refinamento. Para cada uma:</p>\n<ul>\n<li><strong>Contexto:</strong> o que foi discutido, decisões tomadas, dependências citadas.</li>\n<li><strong>Critérios de aceite:</strong> extraídos dos cenários Gherkin e regras de negócio associadas.</li>\n<li><strong>Dependências:</strong> outras histórias, sistemas externos, times dependentes.</li>\n<li><strong>Tamanho estimado:</strong> se discutido na agenda (P1/MVP vs incrementos).</li>\n</ul>\n<h3 id=\"skills-write-feature-skill~4-mapear-para-requisitos-existentes\">4. Mapear para requisitos existentes</h3>\n<p>Para cada história, vincule:\n- RN-XX (regras de negócio) que a história implementa\n- SC-XX (critérios de sucesso) que a história contribui\n- US-X (user story) do <code>requisitos.md</code> que ela detalha</p>\n<h3 id=\"skills-write-feature-skill~5-identificar-histórias-para-fatiamento\">5. Identificar histórias para fatiamento</h3>\n<p>Sinalize histórias que:\n- São grandes demais para um sprint\n- Acoplam múltiplos fluxos sem dependência\n- Precisam de spike técnico antes</p>\n<h3 id=\"skills-write-feature-skill~6-gerar-output\">6. Gerar output</h3>\n<p>Crie o diretório <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/</code> (se não existir).</p>\n<p>Gere <code>historias.md</code> no formato:</p>\n<pre><code class=\"language-markdown\"># Histórias — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n**Baseline:** business-discovery/&lt;feature-slug&gt;/requisitos.md\n**Agenda:** &lt;descrição da agenda de refinamento&gt;\n\n---\n\n## HIST-01: &lt;Título&gt;\n\n**Prioridade:** P1/P2/P3\n**Requisitos vinculados:** RN-XX, US-X\n\n### Contexto\n&lt;o que foi discutido na agenda, decisões, dependências&gt;\n\n### Critérios de Aceite\n- [ ] CA-01: &lt;critério mensurável&gt;\n- [ ] CA-02: &lt;critério mensurável&gt;\n\n### Dependências\n- &lt;outras histórias, sistemas, times&gt;\n\n### Notas\n&lt;observações, riscos, pontos de atenção&gt;\n\n---\n\n## HIST-02: &lt;Título&gt;\n...\n</code></pre>\n<h3 id=\"skills-write-feature-skill~7-reportar-no-chat\">7. Reportar no chat</h3>\n<ul>\n<li>Resumo: X histórias extraídas, Y com dependências, Z marcadas para fatiamento.</li>\n<li>Lista de histórias com prioridade e status.</li>\n<li>Pontos de atenção (histórias grandes, dependências bloqueantes).</li>\n</ul>\n<h2 id=\"skills-write-feature-skill~convenções\">Convenções</h2>\n<ul>\n<li><code>HIST-XX</code> para IDs de histórias (sequencial).</li>\n<li><code>CA-XX</code> para critérios de aceite por história.</li>\n<li>Prioridade: P1 = MVP, P2 = incremento, P3 = futuro.</li>\n<li>Português. Exemplos numéricos &gt; descrições vagas.</li>\n<li>Histórias devem ser independentes quando possível.</li>\n</ul>\n<h2 id=\"skills-write-feature-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] <code>historias.md</code> gerado em <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/</code></li>\n<li>[ ] Cada história vinculada a requisitos existentes (RN, US, SC)</li>\n<li>[ ] Histórias grandes sinalizadas para fatiamento</li>\n<li>[ ] Resumo reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-write-feature-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-write-feature-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-write-feature-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-write-feature-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-write-feature-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-write-feature-skill~1-localizar-a-feature", "text": "1. Localizar a feature"}, {"level": 3, "id": "skills-write-feature-skill~2-carregar-contexto", "text": "2. Carregar contexto"}, {"level": 3, "id": "skills-write-feature-skill~3-extrair-histórias-da-transcrição", "text": "3. Extrair histórias da transcrição"}, {"level": 3, "id": "skills-write-feature-skill~4-mapear-para-requisitos-existentes", "text": "4. Mapear para requisitos existentes"}, {"level": 3, "id": "skills-write-feature-skill~5-identificar-histórias-para-fatiamento", "text": "5. Identificar histórias para fatiamento"}, {"level": 3, "id": "skills-write-feature-skill~6-gerar-output", "text": "6. Gerar output"}, {"level": 3, "id": "skills-write-feature-skill~7-reportar-no-chat", "text": "7. Reportar no chat"}, {"level": 2, "id": "skills-write-feature-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-write-feature-skill~done-when", "text": "Done When"}], "text": " write-feature extrai e fatia histórias de produto a partir de requisitos e transcrição de refinamento, mantendo vínculo com regras e critérios. use após a discovery quando for necessário preparar histórias para o prd. user input $arguments you must consider the user input before proceeding (if not empty). goal transformar requisitos.md + transcrição da agenda de refinamento em histórias estruturadas, prontas para revisão e geração do prd. contrato de artefatos antes de criar histórias, siga o contrato compartilhado . inputs obrigatório: business-discovery/&lt;feature-slug&gt;/requisitos.md obrigatório: transcrição da agenda de refinamento opcional: nome/slug da feature (inferir de requisitos.md se não fornecido) execution steps 1. localizar a feature se $arguments contém slug, use-o. caso contrário, infira de requisitos.md . verifique se business-discovery/&lt;feature-slug&gt;/requisitos.md existe. 2. carregar contexto leia requisitos.md por inteiro — é o baseline de requisitos. leia a transcrição da agenda de refinamento. 3. extrair histórias da transcrição identifique as histórias discutidas na agenda de refinamento. para cada uma: contexto: o que foi discutido, decisões tomadas, dependências citadas. critérios de aceite: extraídos dos cenários gherkin e regras de negócio associadas. dependências: outras histórias, sistemas externos, times dependentes. tamanho estimado: se discutido na agenda (p1/mvp vs incrementos). 4. mapear para requisitos existentes para cada história, vincule: - rn-xx (regras de negócio) que a história implementa - sc-xx (critérios de sucesso) que a história contribui - us-x (user story) do requisitos.md que ela detalha 5. identificar histórias para fatiamento sinalize histórias que: - são grandes demais para um sprint - acoplam múltiplos fluxos sem dependência - precisam de spike técnico antes 6. gerar output crie o diretório teamwork/plan/feature-plan-&lt;feature-slug&gt;/ (se não existir). gere historias.md no formato: # histórias — &lt;feature name&gt; **feature:** &lt;slug&gt; **data:** &lt;yyyy-mm-dd&gt; **baseline:** business-discovery/&lt;feature-slug&gt;/requisitos.md **agenda:** &lt;descrição da agenda de refinamento&gt; --- ## hist-01: &lt;título&gt; **prioridade:** p1/p2/p3 **requisitos vinculados:** rn-xx, us-x ### contexto &lt;o que foi discutido na agenda, decisões, dependências&gt; ### critérios de aceite - [ ] ca-01: &lt;critério mensurável&gt; - [ ] ca-02: &lt;critério mensurável&gt; ### dependências - &lt;outras histórias, sistemas, times&gt; ### notas &lt;observações, riscos, pontos de atenção&gt; --- ## hist-02: &lt;título&gt; ... 7. reportar no chat resumo: x histórias extraídas, y com dependências, z marcadas para fatiamento. lista de histórias com prioridade e status. pontos de atenção (histórias grandes, dependências bloqueantes). convenções hist-xx para ids de histórias (sequencial). ca-xx para critérios de aceite por história. prioridade: p1 = mvp, p2 = incremento, p3 = futuro. português. exemplos numéricos &gt; descrições vagas. histórias devem ser independentes quando possível. done when [ ] historias.md gerado em teamwork/plan/feature-plan-&lt;feature-slug&gt;/ [ ] cada história vinculada a requisitos existentes (rn, us, sc) [ ] histórias grandes sinalizadas para fatiamento [ ] resumo reportado no chat "}, {"id": "skills-review-prd-skill", "path": "skills/review-prd/SKILL.md", "section": "Skills", "title": "review-prd", "status": "", "updated": "", "html": "<h1 id=\"skills-review-prd-skill~review-prd\">review-prd</h1><blockquote><p>Consolida requisitos e histórias em um PRD com objetivos, regras e critérios de sucesso rastreáveis. Use depois da discovery e do refinamento de produto, antes da especificação técnica.</p></blockquote><h2 id=\"skills-review-prd-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-review-prd-skill~goal\">Goal</h2>\n<p>Consolidar o PRD Plan a partir das histórias escritas e do <code>requisitos.md</code>, validando que todos os requisitos estão cobertos.</p>\n<h2 id=\"skills-review-prd-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Antes de criar o PRD, siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-review-prd-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/historias.md</code></li>\n<li><strong>Obrigatório:</strong> <code>business-discovery/&lt;feature-slug&gt;/requisitos.md</code></li>\n<li><strong>Opcional:</strong> transcrição da agenda de refinamento (para contexto adicional)</li>\n</ul>\n<h2 id=\"skills-review-prd-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-review-prd-skill~1-localizar-a-feature\">1. Localizar a feature</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira dos artefatos.</li>\n<li>Verifique se os arquivos de entrada existem.</li>\n</ul>\n<h3 id=\"skills-review-prd-skill~2-carregar-contexto\">2. Carregar contexto</h3>\n<ul>\n<li>Leia <code>historias.md</code> — base para o PRD.</li>\n<li>Leia <code>requisitos.md</code> — baseline de requisitos para validação de cobertura.</li>\n</ul>\n<h3 id=\"skills-review-prd-skill~3-consolidar-o-prd\">3. Consolidar o PRD</h3>\n<p>Crie <code>.agents/prd/&lt;feature-slug&gt;/PRD.md</code> (crie os diretórios se necessário) no formato:</p>\n<pre><code class=\"language-markdown\"># PRD — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Status:** 🟡 Em revisão\n**Data:** &lt;YYYY-MM-DD&gt;\n**Autor:** PM (via review-prd)\n\n---\n\n## 1. Objetivo\n\n&lt;descrição clara do problema de negócio que a feature resolve, extraída do contexto das histórias e requisitos&gt;\n\n## 2. Histórias\n\n| ID | Título | Prioridade | Requisitos |\n|----|--------|------------|------------|\n| HIST-01 | ... | P1 | RN-XX, US-1 |\n| HIST-02 | ... | P2 | RN-YY, US-2 |\n\n### HIST-01: &lt;Título&gt;\n\n&lt;contexto, critérios de aceite, dependências — copiar de historias.md&gt;\n\n## 3. Critérios de Sucesso\n\n| ID | Métrica | Alvo | História |\n|----|---------|------|----------|\n| SC-01 | ... | ... | HIST-XX |\n\n## 4. Regras de Negócio\n\n| ID | Regra | Exemplo | Cenário |\n|----|-------|---------|---------|\n| RN-01 | ... | ... | &lt;cenário Gherkin&gt; |\n\n## 5. Fora de Escopo\n\n&lt;itens explicitamente fora de escopo, extraídos de requisitos.md&gt;\n\n## 6. Gaps e Pendências\n\n| ID | Descrição | Status |\n|----|-----------|--------|\n| DA-01 | ... | ⏳ Aberto |\n\n## 7. Fluxos\n\n### Happy Path\n&lt;fluxo principal&gt;\n\n### Exceções\n&lt;fluxos de exceção e edge cases&gt;\n\n## 8. Glossário\n\n| Termo | Definição |\n|-------|-----------|\n| ... | ... |\n</code></pre>\n<h3 id=\"skills-review-prd-skill~4-validar-cobertura\">4. Validar cobertura</h3>\n<p>Compare o PRD contra <code>requisitos.md</code>:</p>\n<ul>\n<li>Todas as US-X estão vinculadas a pelo menos uma história?</li>\n<li>Todas as RN-XX aparecem no PRD?</li>\n<li>Todos os SC-XX estão vinculados a histórias?</li>\n<li>Gaps/DA-XX foram transferidos?</li>\n</ul>\n<p>Liste cobertos e não cobertos.</p>\n<h3 id=\"skills-review-prd-skill~5-reportar-no-chat\">5. Reportar no chat</h3>\n<ul>\n<li>Resumo: X histórias consolidadas, Y regras vinculadas, Z SC definidos.</li>\n<li>Lista de requisitos não cobertos (se houver).</li>\n<li>Status do PRD (pronto para revisão / precisa de ajustes).</li>\n</ul>\n<h2 id=\"skills-review-prd-skill~convenções\">Convenções</h2>\n<ul>\n<li>PRD segue o formato padrão do time.</li>\n<li>Cada história mantém vínculo rastreável com requisitos (RN, US, SC).</li>\n<li>Status: 🟡 Em revisão → 🟢 Aprovado → ✅ Implementado.</li>\n<li>Português. Gherkin pt-BR para cenários.</li>\n</ul>\n<h2 id=\"skills-review-prd-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] <code>PRD.md</code> criado em <code>.agents/prd/&lt;feature-slug&gt;/</code></li>\n<li>[ ] Cobertura validada: todos os requisitos do <code>requisitos.md</code> mapeados</li>\n<li>[ ] Gaps/DA-XX transferidos para seção de pendências</li>\n<li>[ ] Resumo reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-review-prd-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-review-prd-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-review-prd-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-review-prd-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-review-prd-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-review-prd-skill~1-localizar-a-feature", "text": "1. Localizar a feature"}, {"level": 3, "id": "skills-review-prd-skill~2-carregar-contexto", "text": "2. Carregar contexto"}, {"level": 3, "id": "skills-review-prd-skill~3-consolidar-o-prd", "text": "3. Consolidar o PRD"}, {"level": 3, "id": "skills-review-prd-skill~4-validar-cobertura", "text": "4. Validar cobertura"}, {"level": 3, "id": "skills-review-prd-skill~5-reportar-no-chat", "text": "5. Reportar no chat"}, {"level": 2, "id": "skills-review-prd-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-review-prd-skill~done-when", "text": "Done When"}], "text": " review-prd consolida requisitos e histórias em um prd com objetivos, regras e critérios de sucesso rastreáveis. use depois da discovery e do refinamento de produto, antes da especificação técnica. user input $arguments you must consider the user input before proceeding (if not empty). goal consolidar o prd plan a partir das histórias escritas e do requisitos.md , validando que todos os requisitos estão cobertos. contrato de artefatos antes de criar o prd, siga o contrato compartilhado . inputs obrigatório: teamwork/plan/feature-plan-&lt;feature-slug&gt;/historias.md obrigatório: business-discovery/&lt;feature-slug&gt;/requisitos.md opcional: transcrição da agenda de refinamento (para contexto adicional) execution steps 1. localizar a feature se $arguments contém slug, use-o. caso contrário, infira dos artefatos. verifique se os arquivos de entrada existem. 2. carregar contexto leia historias.md — base para o prd. leia requisitos.md — baseline de requisitos para validação de cobertura. 3. consolidar o prd crie .agents/prd/&lt;feature-slug&gt;/prd.md (crie os diretórios se necessário) no formato: # prd — &lt;feature name&gt; **feature:** &lt;slug&gt; **status:** 🟡 em revisão **data:** &lt;yyyy-mm-dd&gt; **autor:** pm (via review-prd) --- ## 1. objetivo &lt;descrição clara do problema de negócio que a feature resolve, extraída do contexto das histórias e requisitos&gt; ## 2. histórias | id | título | prioridade | requisitos | |----|--------|------------|------------| | hist-01 | ... | p1 | rn-xx, us-1 | | hist-02 | ... | p2 | rn-yy, us-2 | ### hist-01: &lt;título&gt; &lt;contexto, critérios de aceite, dependências — copiar de historias.md&gt; ## 3. critérios de sucesso | id | métrica | alvo | história | |----|---------|------|----------| | sc-01 | ... | ... | hist-xx | ## 4. regras de negócio | id | regra | exemplo | cenário | |----|-------|---------|---------| | rn-01 | ... | ... | &lt;cenário gherkin&gt; | ## 5. fora de escopo &lt;itens explicitamente fora de escopo, extraídos de requisitos.md&gt; ## 6. gaps e pendências | id | descrição | status | |----|-----------|--------| | da-01 | ... | ⏳ aberto | ## 7. fluxos ### happy path &lt;fluxo principal&gt; ### exceções &lt;fluxos de exceção e edge cases&gt; ## 8. glossário | termo | definição | |-------|-----------| | ... | ... | 4. validar cobertura compare o prd contra requisitos.md : todas as us-x estão vinculadas a pelo menos uma história? todas as rn-xx aparecem no prd? todos os sc-xx estão vinculados a histórias? gaps/da-xx foram transferidos? liste cobertos e não cobertos. 5. reportar no chat resumo: x histórias consolidadas, y regras vinculadas, z sc definidos. lista de requisitos não cobertos (se houver). status do prd (pronto para revisão / precisa de ajustes). convenções prd segue o formato padrão do time. cada história mantém vínculo rastreável com requisitos (rn, us, sc). status: 🟡 em revisão → 🟢 aprovado → ✅ implementado. português. gherkin pt-br para cenários. done when [ ] prd.md criado em .agents/prd/&lt;feature-slug&gt;/ [ ] cobertura validada: todos os requisitos do requisitos.md mapeados [ ] gaps/da-xx transferidos para seção de pendências [ ] resumo reportado no chat "}, {"id": "skills-technical-discovery-skill", "path": "skills/technical-discovery/SKILL.md", "section": "Skills", "title": "technical-discovery", "status": "", "updated": "", "html": "<h1 id=\"skills-technical-discovery-skill~technical-discovery\">technical-discovery</h1><blockquote><p>Prepara uma visão técnica baseada no PRD, mapeando componentes, dependências, riscos e decisões abertas. Use antes de uma agenda de refinamento técnico ou de escrever a SPEC de uma feature.</p></blockquote><h2 id=\"skills-technical-discovery-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-technical-discovery-skill~goal\">Goal</h2>\n<p>Gerar a visão técnica estruturada da solução como base para a discussão na agenda de refinamento técnico.</p>\n<h2 id=\"skills-technical-discovery-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Antes de criar a visão técnica, siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-technical-discovery-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>.agents/prd/&lt;feature-slug&gt;/PRD.md</code></li>\n<li><strong>Opcional:</strong> contexto técnico do time (arquitetura existente, stack, convenções)</li>\n<li><strong>Opcional:</strong> <code>requisitos.md</code> para contexto adicional</li>\n</ul>\n<h2 id=\"skills-technical-discovery-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-technical-discovery-skill~1-localizar-a-feature\">1. Localizar a feature</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira do PRD.</li>\n<li>Verifique se o PRD existe.</li>\n</ul>\n<h3 id=\"skills-technical-discovery-skill~2-carregar-contexto\">2. Carregar contexto</h3>\n<ul>\n<li>Leia <code>PRD.md</code> — base para a análise técnica.</li>\n<li>Leia <code>requisitos.md</code> se existir — contexto de negócio adicional.</li>\n<li>Identifique stack, arquitetura e convenções existentes no repositório.</li>\n</ul>\n<h3 id=\"skills-technical-discovery-skill~3-analisar-impacto-técnico\">3. Analisar impacto técnico</h3>\n<p>Para cada história do PRD, avalie:</p>\n<ul>\n<li><strong>Componentes afetados:</strong> quais módulos, serviços, APIs precisam de mudança.</li>\n<li><strong>Dependências externas:</strong> APIs de terceiros, bancos de dados, filas.</li>\n<li><strong>Riscos técnicos:</strong> complexidade, incertezas, spike necessário.</li>\n<li><strong>Estimativa de esforço:</strong> relativa (S/M/L/XL) baseada em complexidade.</li>\n</ul>\n<h3 id=\"skills-technical-discovery-skill~4-mapear-stack-e-decisões\">4. Mapear stack e decisões</h3>\n<ul>\n<li><strong>Tecnologias necessárias:</strong> libs, frameworks, serviços.</li>\n<li><strong>Padrões existentes:</strong> como resolver problemas similares no código atual.</li>\n<li><strong>Decisões abertas:</strong> pontos que precisam de consenso no refinamento.</li>\n</ul>\n<h3 id=\"skills-technical-discovery-skill~5-gerar-output\">5. Gerar output</h3>\n<p>Crie <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/visao-tecnica.md</code> no formato:</p>\n<pre><code class=\"language-markdown\"># Visão Técnica — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n**PRD:** .agents/prd/&lt;feature-slug&gt;/PRD.md\n\n---\n\n## 1. Resumo da Solução\n\n&lt;descrição técnica de alto nível da abordagem&gt;\n\n## 2. Impacto por História\n\n### HIST-01: &lt;Título&gt;\n\n| Dimensão | Detalhe |\n|----------|---------|\n| Componentes | &lt;módulos/serviços afetados&gt; |\n| Dependências | &lt;APIs externas, bancos, filas&gt; |\n| Risco | 🟢 Baixo / 🟡 Médio / 🔴 Alto |\n| Esforço | S / M / L / XL |\n| Decisões abertas | &lt;o que precisa de consenso&gt; |\n\n## 3. Stack e Tecnologias\n\n| Necessidade | Tecnologia | Status |\n|-------------|-----------|--------|\n| ... | ... | Existente / Nova / Avaliar |\n\n## 4. Padrões e Convenções\n\n- &lt;padrões do repositório que devem ser seguidos&gt;\n- &lt;convenções de código, testes, deploy&gt;\n\n## 5. Riscos e Mitigações\n\n| Risco | Impacto | Mitigação |\n|-------|---------|-----------|\n| ... | ... | ... |\n\n## 6. Questões para Refinamento\n\n- &lt;pontos que precisam de decisão coletiva&gt;\n- &lt;alternativas técnicas a considerar&gt;\n- &lt;dependências de outros times&gt;\n</code></pre>\n<h3 id=\"skills-technical-discovery-skill~6-reportar-no-chat\">6. Reportar no chat</h3>\n<ul>\n<li>Resumo: X componentes impactados, Y riscos identificados, Z decisões abertas.</li>\n<li>Riscos de maior atenção.</li>\n<li>Questões para levar ao refinamento técnico.</li>\n</ul>\n<h2 id=\"skills-technical-discovery-skill~convenções\">Convenções</h2>\n<ul>\n<li>Documento interno do Tech Lead — não é entregável para o time externo.</li>\n<li>Risco: 🟢 Baixo (padrão conhecido), 🟡 Médio (complexidade moderada), 🔴 Alto (spike/incerteza).</li>\n<li>Esforço relativo: S (&lt; 1 dia), M (1-3 dias), L (3-5 dias), XL (&gt; 1 semana).</li>\n<li>Português.</li>\n</ul>\n<h2 id=\"skills-technical-discovery-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] <code>visao-tecnica.md</code> criado em <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/</code></li>\n<li>[ ] Cada história do PRD analisada tecnicamente</li>\n<li>[ ] Riscos e decisões abertas documentados</li>\n<li>[ ] Resumo reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-technical-discovery-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-technical-discovery-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-technical-discovery-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-technical-discovery-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-technical-discovery-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-technical-discovery-skill~1-localizar-a-feature", "text": "1. Localizar a feature"}, {"level": 3, "id": "skills-technical-discovery-skill~2-carregar-contexto", "text": "2. Carregar contexto"}, {"level": 3, "id": "skills-technical-discovery-skill~3-analisar-impacto-técnico", "text": "3. Analisar impacto técnico"}, {"level": 3, "id": "skills-technical-discovery-skill~4-mapear-stack-e-decisões", "text": "4. Mapear stack e decisões"}, {"level": 3, "id": "skills-technical-discovery-skill~5-gerar-output", "text": "5. Gerar output"}, {"level": 3, "id": "skills-technical-discovery-skill~6-reportar-no-chat", "text": "6. Reportar no chat"}, {"level": 2, "id": "skills-technical-discovery-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-technical-discovery-skill~done-when", "text": "Done When"}], "text": " technical-discovery prepara uma visão técnica baseada no prd, mapeando componentes, dependências, riscos e decisões abertas. use antes de uma agenda de refinamento técnico ou de escrever a spec de uma feature. user input $arguments you must consider the user input before proceeding (if not empty). goal gerar a visão técnica estruturada da solução como base para a discussão na agenda de refinamento técnico. contrato de artefatos antes de criar a visão técnica, siga o contrato compartilhado . inputs obrigatório: .agents/prd/&lt;feature-slug&gt;/prd.md opcional: contexto técnico do time (arquitetura existente, stack, convenções) opcional: requisitos.md para contexto adicional execution steps 1. localizar a feature se $arguments contém slug, use-o. caso contrário, infira do prd. verifique se o prd existe. 2. carregar contexto leia prd.md — base para a análise técnica. leia requisitos.md se existir — contexto de negócio adicional. identifique stack, arquitetura e convenções existentes no repositório. 3. analisar impacto técnico para cada história do prd, avalie: componentes afetados: quais módulos, serviços, apis precisam de mudança. dependências externas: apis de terceiros, bancos de dados, filas. riscos técnicos: complexidade, incertezas, spike necessário. estimativa de esforço: relativa (s/m/l/xl) baseada em complexidade. 4. mapear stack e decisões tecnologias necessárias: libs, frameworks, serviços. padrões existentes: como resolver problemas similares no código atual. decisões abertas: pontos que precisam de consenso no refinamento. 5. gerar output crie teamwork/plan/feature-plan-&lt;feature-slug&gt;/visao-tecnica.md no formato: # visão técnica — &lt;feature name&gt; **feature:** &lt;slug&gt; **data:** &lt;yyyy-mm-dd&gt; **prd:** .agents/prd/&lt;feature-slug&gt;/prd.md --- ## 1. resumo da solução &lt;descrição técnica de alto nível da abordagem&gt; ## 2. impacto por história ### hist-01: &lt;título&gt; | dimensão | detalhe | |----------|---------| | componentes | &lt;módulos/serviços afetados&gt; | | dependências | &lt;apis externas, bancos, filas&gt; | | risco | 🟢 baixo / 🟡 médio / 🔴 alto | | esforço | s / m / l / xl | | decisões abertas | &lt;o que precisa de consenso&gt; | ## 3. stack e tecnologias | necessidade | tecnologia | status | |-------------|-----------|--------| | ... | ... | existente / nova / avaliar | ## 4. padrões e convenções - &lt;padrões do repositório que devem ser seguidos&gt; - &lt;convenções de código, testes, deploy&gt; ## 5. riscos e mitigações | risco | impacto | mitigação | |-------|---------|-----------| | ... | ... | ... | ## 6. questões para refinamento - &lt;pontos que precisam de decisão coletiva&gt; - &lt;alternativas técnicas a considerar&gt; - &lt;dependências de outros times&gt; 6. reportar no chat resumo: x componentes impactados, y riscos identificados, z decisões abertas. riscos de maior atenção. questões para levar ao refinamento técnico. convenções documento interno do tech lead — não é entregável para o time externo. risco: 🟢 baixo (padrão conhecido), 🟡 médio (complexidade moderada), 🔴 alto (spike/incerteza). esforço relativo: s (&lt; 1 dia), m (1-3 dias), l (3-5 dias), xl (&gt; 1 semana). português. done when [ ] visao-tecnica.md criado em teamwork/plan/feature-plan-&lt;feature-slug&gt;/ [ ] cada história do prd analisada tecnicamente [ ] riscos e decisões abertas documentados [ ] resumo reportado no chat "}, {"id": "skills-create-spec-skill", "path": "skills/create-spec/SKILL.md", "section": "Skills", "title": "create-spec", "status": "", "updated": "", "html": "<h1 id=\"skills-create-spec-skill~create-spec\">create-spec</h1><blockquote><p>Cria uma SPEC técnica a partir de PRD, visão técnica e decisões de refinamento. Use depois do refinamento técnico quando a implementação precisar de componentes, contratos, riscos e critérios técnicos rastreáveis.</p></blockquote><h2 id=\"skills-create-spec-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-create-spec-skill~goal\">Goal</h2>\n<p>Gerar o SPEC Plan consolidando a solução técnica detalhada para cada história, com critérios de aceite técnicos e plano de implementação.</p>\n<h2 id=\"skills-create-spec-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Antes de criar a SPEC, siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-create-spec-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>.agents/prd/&lt;feature-slug&gt;/PRD.md</code></li>\n<li><strong>Obrigatório:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/visao-tecnica.md</code></li>\n<li><strong>Obrigatório:</strong> transcrição da agenda técnica</li>\n<li><strong>Opcional:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/historias.md</code></li>\n</ul>\n<h2 id=\"skills-create-spec-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-create-spec-skill~1-localizar-a-feature\">1. Localizar a feature</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira dos artefatos.</li>\n<li>Verifique se os arquivos de entrada existem.</li>\n</ul>\n<h3 id=\"skills-create-spec-skill~2-carregar-contexto\">2. Carregar contexto</h3>\n<ul>\n<li>Leia <code>PRD.md</code> — requisitos e histórias.</li>\n<li>Leia <code>visao-tecnica.md</code> — análise técnica prévia.</li>\n<li>Leia a transcrição da agenda técnica — decisões e discussões.</li>\n<li>Leia <code>historias.md</code> se existir — contexto adicional.</li>\n</ul>\n<h3 id=\"skills-create-spec-skill~3-para-cada-história-definir-a-solução-técnica\">3. Para cada história, definir a solução técnica</h3>\n<p>Estruture:</p>\n<ul>\n<li><strong>Abordagem técnica:</strong> como resolver (padrões, algoritmos, integrações).</li>\n<li><strong>Componentes:</strong> arquivos, módulos, classes, endpoints a criar/modificar.</li>\n<li><strong>Fluxo de implementação:</strong> ordem das mudanças, dependências internas.</li>\n<li><strong>Critérios de aceite técnicos:</strong> testes unitários, integração, performance.</li>\n<li><strong>Dados:</strong> modelos, migrations, validações.</li>\n</ul>\n<h3 id=\"skills-create-spec-skill~4-definir-contrato-de-interfaces-se-aplicável\">4. Definir contrato de interfaces (se aplicável)</h3>\n<p>Para APIs, endpoints ou contratos entre módulos:\n- Request/response format\n- Validações\n- Códigos de erro</p>\n<h3 id=\"skills-create-spec-skill~5-gerar-output\">5. Gerar output</h3>\n<p>Crie <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code> (crie os diretórios se necessário) no formato:</p>\n<pre><code class=\"language-markdown\"># SPEC — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Status:** 🟡 Em revisão\n**Data:** &lt;YYYY-MM-DD&gt;\n**PRD:** .agents/prd/&lt;feature-slug&gt;/PRD.md\n**Autor:** Tech Lead (via create-spec)\n\n---\n\n## 1. Visão Geral da Solução\n\n&lt;descrição técnica consolidada da abordagem&gt;\n\n## 2. Stack e Dependências\n\n| Necessidade | Tecnologia | Versão | Status |\n|-------------|-----------|--------|--------|\n| ... | ... | ... | Existente / Nova |\n\n## 3. Modelo de Dados\n\n### Entidades\n\n#### &lt;Entidade&gt;\n| Campo | Tipo | Validação | Obrigatório |\n|-------|------|-----------|-------------|\n| ... | ... | ... | Sim/Não |\n\n### Relacionamentos\n&lt;descrição dos relacionamentos entre entidades&gt;\n\n### Migrations\n&lt;estrutura das migrations necessárias&gt;\n\n## 4. Solução por História\n\n### HIST-01: &lt;Título&gt;\n\n#### Componentes\n| Arquivo | Tipo | Ação |\n|---------|------|------|\n| ... | ... | Criar / Modificar |\n\n#### Fluxo de Implementação\n1. &lt;passo 1&gt;\n2. &lt;passo 2&gt;\n\n#### Critérios de Aceite Técnicos\n- [ ] CT-01: &lt;critério técnico testável&gt;\n- [ ] CT-02: &lt;critério técnico testável&gt;\n\n#### Testes\n- Unitários: &lt;o que testar&gt;\n- Integração: &lt;o que testar&gt;\n\n---\n\n## 5. Contratos de Interface (se aplicável)\n\n### &lt;Endpoint/Interface&gt;\n**Método:** GET/POST/...\n\n**Request:**\n```json\n{ ... }\n</code></pre>\n<p><strong>Response:</strong></p>\n<pre><code class=\"language-json\">{ ... }\n</code></pre>\n<p><strong>Erros:</strong>\n| Código | Descrição |\n|--------|-----------|\n| ... | ... |</p>\n<hr>\n<h2 id=\"skills-create-spec-skill~6-fluxo-geral-de-implementação\">6. Fluxo Geral de Implementação</h2>\n<h3 id=\"skills-create-spec-skill~fase-1-setup\">Fase 1: Setup</h3>\n<p><inicialização, configs, dependências></p>\n<h3 id=\"skills-create-spec-skill~fase-2-componentes-fundamentais\">Fase 2: Componentes Fundamentais</h3>\n<p><modelos, services, middlewares></p>\n<h3 id=\"skills-create-spec-skill~fase-3-por-história\">Fase 3+: Por História</h3>\n<p><histórias em ordem de dependência></p>\n<h2 id=\"skills-create-spec-skill~7-riscos-técnicos\">7. Riscos Técnicos</h2>\n<table>\n<thead>\n<tr>\n<th>Risco</th>\n<th>Impacto</th>\n<th>Mitigação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>...</td>\n<td>...</td>\n<td>...</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"skills-create-spec-skill~8-validação\">8. Validação</h2>\n<h3 id=\"skills-create-spec-skill~cenários-de-validação\">Cenários de Validação</h3>\n<p><quickstart: como provar que funciona end-to-end></p>\n<h2 id=\"skills-create-spec-skill~9-gaps-e-pendências\">9. Gaps e Pendências</h2>\n<table>\n<thead>\n<tr>\n<th>ID</th>\n<th>Descrição</th>\n<th>Status</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>...</td>\n<td>...</td>\n<td>⏳ Aberto</td>\n</tr>\n<tr>\n<td>```</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"skills-create-spec-skill~6-reportar-no-chat\">6. Reportar no chat</h3>\n<ul>\n<li>Resumo: X histórias com solução definida, Y componentes a criar/modificar, Z testes planejados.</li>\n<li>Riscos técnicos de maior atenção.</li>\n<li>Pronto para <code>review-spec</code>.</li>\n</ul>\n<h2 id=\"skills-create-spec-skill~convenções\">Convenções</h2>\n<ul>\n<li>SPEC é o contrato técnico — deve ser suficiente para um engenheiro implementar sem perguntas.</li>\n<li>CT-XX para critérios de aceite técnicos.</li>\n<li>Status: 🟡 Em revisão → 🟢 Aprovado → ✅ Implementado.</li>\n<li>Português. Código e nomes técnicos em inglês.</li>\n</ul>\n<h2 id=\"skills-create-spec-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] <code>SPEC.md</code> criado em <code>.agents/spec/&lt;feature-slug&gt;/</code></li>\n<li>[ ] Cada história do PRD com solução técnica definida</li>\n<li>[ ] Modelo de dados documentado</li>\n<li>[ ] Contratos de interface definidos (se aplicável)</li>\n<li>[ ] Fluxo de implementação sequenciado</li>\n<li>[ ] Resumo reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-create-spec-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-create-spec-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-create-spec-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-create-spec-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-create-spec-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-create-spec-skill~1-localizar-a-feature", "text": "1. Localizar a feature"}, {"level": 3, "id": "skills-create-spec-skill~2-carregar-contexto", "text": "2. Carregar contexto"}, {"level": 3, "id": "skills-create-spec-skill~3-para-cada-história-definir-a-solução-técnica", "text": "3. Para cada história, definir a solução técnica"}, {"level": 3, "id": "skills-create-spec-skill~4-definir-contrato-de-interfaces-se-aplicável", "text": "4. Definir contrato de interfaces (se aplicável)"}, {"level": 3, "id": "skills-create-spec-skill~5-gerar-output", "text": "5. Gerar output"}, {"level": 2, "id": "skills-create-spec-skill~6-fluxo-geral-de-implementação", "text": "6. Fluxo Geral de Implementação"}, {"level": 3, "id": "skills-create-spec-skill~fase-1-setup", "text": "Fase 1: Setup"}, {"level": 3, "id": "skills-create-spec-skill~fase-2-componentes-fundamentais", "text": "Fase 2: Componentes Fundamentais"}, {"level": 3, "id": "skills-create-spec-skill~fase-3-por-história", "text": "Fase 3+: Por História"}, {"level": 2, "id": "skills-create-spec-skill~7-riscos-técnicos", "text": "7. Riscos Técnicos"}, {"level": 2, "id": "skills-create-spec-skill~8-validação", "text": "8. Validação"}, {"level": 3, "id": "skills-create-spec-skill~cenários-de-validação", "text": "Cenários de Validação"}, {"level": 2, "id": "skills-create-spec-skill~9-gaps-e-pendências", "text": "9. Gaps e Pendências"}, {"level": 3, "id": "skills-create-spec-skill~6-reportar-no-chat", "text": "6. Reportar no chat"}, {"level": 2, "id": "skills-create-spec-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-create-spec-skill~done-when", "text": "Done When"}], "text": " create-spec cria uma spec técnica a partir de prd, visão técnica e decisões de refinamento. use depois do refinamento técnico quando a implementação precisar de componentes, contratos, riscos e critérios técnicos rastreáveis. user input $arguments you must consider the user input before proceeding (if not empty). goal gerar o spec plan consolidando a solução técnica detalhada para cada história, com critérios de aceite técnicos e plano de implementação. contrato de artefatos antes de criar a spec, siga o contrato compartilhado . inputs obrigatório: .agents/prd/&lt;feature-slug&gt;/prd.md obrigatório: teamwork/plan/feature-plan-&lt;feature-slug&gt;/visao-tecnica.md obrigatório: transcrição da agenda técnica opcional: teamwork/plan/feature-plan-&lt;feature-slug&gt;/historias.md execution steps 1. localizar a feature se $arguments contém slug, use-o. caso contrário, infira dos artefatos. verifique se os arquivos de entrada existem. 2. carregar contexto leia prd.md — requisitos e histórias. leia visao-tecnica.md — análise técnica prévia. leia a transcrição da agenda técnica — decisões e discussões. leia historias.md se existir — contexto adicional. 3. para cada história, definir a solução técnica estruture: abordagem técnica: como resolver (padrões, algoritmos, integrações). componentes: arquivos, módulos, classes, endpoints a criar/modificar. fluxo de implementação: ordem das mudanças, dependências internas. critérios de aceite técnicos: testes unitários, integração, performance. dados: modelos, migrations, validações. 4. definir contrato de interfaces (se aplicável) para apis, endpoints ou contratos entre módulos: - request/response format - validações - códigos de erro 5. gerar output crie .agents/spec/&lt;feature-slug&gt;/spec.md (crie os diretórios se necessário) no formato: # spec — &lt;feature name&gt; **feature:** &lt;slug&gt; **status:** 🟡 em revisão **data:** &lt;yyyy-mm-dd&gt; **prd:** .agents/prd/&lt;feature-slug&gt;/prd.md **autor:** tech lead (via create-spec) --- ## 1. visão geral da solução &lt;descrição técnica consolidada da abordagem&gt; ## 2. stack e dependências | necessidade | tecnologia | versão | status | |-------------|-----------|--------|--------| | ... | ... | ... | existente / nova | ## 3. modelo de dados ### entidades #### &lt;entidade&gt; | campo | tipo | validação | obrigatório | |-------|------|-----------|-------------| | ... | ... | ... | sim/não | ### relacionamentos &lt;descrição dos relacionamentos entre entidades&gt; ### migrations &lt;estrutura das migrations necessárias&gt; ## 4. solução por história ### hist-01: &lt;título&gt; #### componentes | arquivo | tipo | ação | |---------|------|------| | ... | ... | criar / modificar | #### fluxo de implementação 1. &lt;passo 1&gt; 2. &lt;passo 2&gt; #### critérios de aceite técnicos - [ ] ct-01: &lt;critério técnico testável&gt; - [ ] ct-02: &lt;critério técnico testável&gt; #### testes - unitários: &lt;o que testar&gt; - integração: &lt;o que testar&gt; --- ## 5. contratos de interface (se aplicável) ### &lt;endpoint/interface&gt; **método:** get/post/... **request:** ```json { ... } response: { ... } erros: | código | descrição | |--------|-----------| | ... | ... | 6. fluxo geral de implementação fase 1: setup fase 2: componentes fundamentais fase 3+: por história 7. riscos técnicos risco impacto mitigação ... ... ... 8. validação cenários de validação 9. gaps e pendências id descrição status ... ... ⏳ aberto ``` 6. reportar no chat resumo: x histórias com solução definida, y componentes a criar/modificar, z testes planejados. riscos técnicos de maior atenção. pronto para review-spec . convenções spec é o contrato técnico — deve ser suficiente para um engenheiro implementar sem perguntas. ct-xx para critérios de aceite técnicos. status: 🟡 em revisão → 🟢 aprovado → ✅ implementado. português. código e nomes técnicos em inglês. done when [ ] spec.md criado em .agents/spec/&lt;feature-slug&gt;/ [ ] cada história do prd com solução técnica definida [ ] modelo de dados documentado [ ] contratos de interface definidos (se aplicável) [ ] fluxo de implementação sequenciado [ ] resumo reportado no chat "}, {"id": "skills-refine-spec-skill", "path": "skills/refine-spec/SKILL.md", "section": "Skills", "title": "refine-spec", "status": "", "updated": "", "html": "<h1 id=\"skills-refine-spec-skill~refine-spec\">refine-spec</h1><blockquote><p>Transforma uma SPEC aprovada em plano sequencial de implementação, dependências e tracking. Use antes de codificar uma feature para identificar blocos testáveis e a ordem segura de execução.</p></blockquote><h2 id=\"skills-refine-spec-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-refine-spec-skill~goal\">Goal</h2>\n<p>Transformar a SPEC em plano de implementação passo a passo, definindo ordem dos blocos, dependências e criando <code>tracking.md</code> para acompanhar execução.</p>\n<h2 id=\"skills-refine-spec-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Antes de criar plano e tracking, siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-refine-spec-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code></li>\n<li><strong>Opcional:</strong> <code>.agents/prd/&lt;feature-slug&gt;/PRD.md</code> para contexto</li>\n</ul>\n<h2 id=\"skills-refine-spec-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-refine-spec-skill~1-localizar-a-feature\">1. Localizar a feature</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira da SPEC.</li>\n<li>Verifique se a SPEC existe.</li>\n</ul>\n<h3 id=\"skills-refine-spec-skill~2-carregar-contexto\">2. Carregar contexto</h3>\n<ul>\n<li>Leia <code>SPEC.md</code> por inteiro — é o plano técnico.</li>\n<li>Leia <code>PRD.md</code> se existir — contexto de prioridades.</li>\n</ul>\n<h3 id=\"skills-refine-spec-skill~3-extrair-blocos-de-implementação\">3. Extrair blocos de implementação</h3>\n<p>Da SPEC, extraia:\n- <strong>Modelos de dados:</strong> entidades, relações, migrations.\n- <strong>Services/lógica de negócio:</strong> regras, validações, processamento.\n- <strong>Interfaces/APIs:</strong> endpoints, contratos.\n- <strong>Integrações:</strong> bancos externos, filas, serviços.\n- <strong>Frontend (se aplicável):</strong> componentes, fluxos UI.</p>\n<h3 id=\"skills-refine-spec-skill~4-definir-ordem-de-dependências\">4. Definir ordem de dependências</h3>\n<p>Mapeie dependências entre blocos:\n- O que precisa existir antes de quê?\n- Quais blocos são independentes (paralelizáveis)?\n- Qual o caminho mais seguro para ter algo testável cedo?</p>\n<h3 id=\"skills-refine-spec-skill~5-criar-plano-sequencial\">5. Criar plano sequencial</h3>\n<p>Gere <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/plano-implementacao.md</code>:</p>\n<pre><code class=\"language-markdown\"># Plano de Implementação — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n**SPEC:** .agents/spec/&lt;feature-slug&gt;/SPEC.md\n\n---\n\n## Sequência de Implementação\n\n### Bloco 1: &lt;Nome&gt; (Fundação)\n**Depende de:** Nenhum\n**Arquivos:** `caminho/para/arquivo1`, `caminho/para/arquivo2`\n**O que fazer:**\n1. &lt;ação 1&gt;\n2. &lt;ação 2&gt;\n\n**Teste:** &lt;como validar este bloco&gt;\n\n---\n\n### Bloco 2: &lt;Nome&gt; (Core)\n**Depende de:** Bloco 1\n**Arquivos:** `caminho/para/arquivo3`\n**O que fazer:**\n1. &lt;ação 1&gt;\n\n**Teste:** &lt;como validar&gt;\n\n---\n\n### Bloco 3: &lt;Nome&gt; (Paralelizável)\n**Depende de:** Bloco 1\n**Paralelizável com:** Bloco 4\n**Arquivos:** `caminho/para/arquivo4`\n**O que fazer:**\n1. &lt;ação 1&gt;\n\n**Teste:** &lt;como validar&gt;\n\n---\n\n## Grafo de Dependências\n\n</code></pre>\n<p>Bloco 1 (Fundação)\n├── Bloco 2 (Core)\n├── Bloco 3 (Paralelizável) ─┐\n└── Bloco 4 (Paralelizável) ─┘\n                              └── Bloco 5 (Integração)\n                                    └── Bloco 6 (Polimento)</p>\n<pre><code>\n## Ponto de Início Mais Seguro\n\n&lt;Bloco 1&gt; — fundação sem dependências, permite validação imediata.\n\n## Estimativa\n\n| Bloco | Esforço | Dependências |\n|-------|---------|-------------|\n| 1 | S | — |\n| 2 | M | Bloco 1 |\n| ... | ... | ... |\n\n## Tracking\n\nO `tracking.md` será criado ao iniciar a implementação.\n</code></pre>\n<h3 id=\"skills-refine-spec-skill~6-criar-trackingmd\">6. Criar tracking.md</h3>\n<p>Gere <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/tracking.md</code>:</p>\n<pre><code class=\"language-markdown\"># Tracking — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Início:** &lt;YYYY-MM-DD&gt;\n**Status:** 🟡 Em andamento\n\n---\n\n## Progresso\n\n| Bloco | Status | Início | Fim | Notas |\n|-------|--------|--------|-----|-------|\n| 1 - Fundação | ⬜ Não iniciado | — | — | |\n| 2 - Core | ⬜ Não iniciado | — | — | |\n| 3 - ... | ⬜ Não iniciado | — | — | |\n\n**Legenda:** ⬜ Não iniciado | 🟡 Em andamento | ✅ Concluído | ❌ Bloqueado\n\n---\n\n## Log\n\n| Data | Evento |\n|------|--------|\n| — | — |\n</code></pre>\n<h3 id=\"skills-refine-spec-skill~7-reportar-no-chat\">7. Reportar no chat</h3>\n<ul>\n<li>Resumo: X blocos definidos, Y dependências mapeadas, Z paralelizáveis.</li>\n<li>Ponto de início recomendado.</li>\n<li>Estimativa total.</li>\n</ul>\n<h2 id=\"skills-refine-spec-skill~convenções\">Convenções</h2>\n<ul>\n<li>Blocos organizados por ordem de dependência, não por arquivo.</li>\n<li>Cada bloco deve ser testável de forma independente quando possível.</li>\n<li>tracking.md é vivo — atualizado durante implementação.</li>\n<li>Português.</li>\n</ul>\n<h2 id=\"skills-refine-spec-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] <code>plano-implementacao.md</code> gerado com blocos sequenciados</li>\n<li>[ ] <code>tracking.md</code> criado com status inicial</li>\n<li>[ ] Dependências entre blocos mapeadas</li>\n<li>[ ] Ponto de início mais seguro identificado</li>\n<li>[ ] Resumo reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-refine-spec-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-refine-spec-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-refine-spec-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-refine-spec-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-refine-spec-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-refine-spec-skill~1-localizar-a-feature", "text": "1. Localizar a feature"}, {"level": 3, "id": "skills-refine-spec-skill~2-carregar-contexto", "text": "2. Carregar contexto"}, {"level": 3, "id": "skills-refine-spec-skill~3-extrair-blocos-de-implementação", "text": "3. Extrair blocos de implementação"}, {"level": 3, "id": "skills-refine-spec-skill~4-definir-ordem-de-dependências", "text": "4. Definir ordem de dependências"}, {"level": 3, "id": "skills-refine-spec-skill~5-criar-plano-sequencial", "text": "5. Criar plano sequencial"}, {"level": 3, "id": "skills-refine-spec-skill~6-criar-trackingmd", "text": "6. Criar tracking.md"}, {"level": 3, "id": "skills-refine-spec-skill~7-reportar-no-chat", "text": "7. Reportar no chat"}, {"level": 2, "id": "skills-refine-spec-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-refine-spec-skill~done-when", "text": "Done When"}], "text": " refine-spec transforma uma spec aprovada em plano sequencial de implementação, dependências e tracking. use antes de codificar uma feature para identificar blocos testáveis e a ordem segura de execução. user input $arguments you must consider the user input before proceeding (if not empty). goal transformar a spec em plano de implementação passo a passo, definindo ordem dos blocos, dependências e criando tracking.md para acompanhar execução. contrato de artefatos antes de criar plano e tracking, siga o contrato compartilhado . inputs obrigatório: .agents/spec/&lt;feature-slug&gt;/spec.md opcional: .agents/prd/&lt;feature-slug&gt;/prd.md para contexto execution steps 1. localizar a feature se $arguments contém slug, use-o. caso contrário, infira da spec. verifique se a spec existe. 2. carregar contexto leia spec.md por inteiro — é o plano técnico. leia prd.md se existir — contexto de prioridades. 3. extrair blocos de implementação da spec, extraia: - modelos de dados: entidades, relações, migrations. - services/lógica de negócio: regras, validações, processamento. - interfaces/apis: endpoints, contratos. - integrações: bancos externos, filas, serviços. - frontend (se aplicável): componentes, fluxos ui. 4. definir ordem de dependências mapeie dependências entre blocos: - o que precisa existir antes de quê? - quais blocos são independentes (paralelizáveis)? - qual o caminho mais seguro para ter algo testável cedo? 5. criar plano sequencial gere teamwork/plan/feature-plan-&lt;feature-slug&gt;/plano-implementacao.md : # plano de implementação — &lt;feature name&gt; **feature:** &lt;slug&gt; **data:** &lt;yyyy-mm-dd&gt; **spec:** .agents/spec/&lt;feature-slug&gt;/spec.md --- ## sequência de implementação ### bloco 1: &lt;nome&gt; (fundação) **depende de:** nenhum **arquivos:** `caminho/para/arquivo1`, `caminho/para/arquivo2` **o que fazer:** 1. &lt;ação 1&gt; 2. &lt;ação 2&gt; **teste:** &lt;como validar este bloco&gt; --- ### bloco 2: &lt;nome&gt; (core) **depende de:** bloco 1 **arquivos:** `caminho/para/arquivo3` **o que fazer:** 1. &lt;ação 1&gt; **teste:** &lt;como validar&gt; --- ### bloco 3: &lt;nome&gt; (paralelizável) **depende de:** bloco 1 **paralelizável com:** bloco 4 **arquivos:** `caminho/para/arquivo4` **o que fazer:** 1. &lt;ação 1&gt; **teste:** &lt;como validar&gt; --- ## grafo de dependências bloco 1 (fundação) ├── bloco 2 (core) ├── bloco 3 (paralelizável) ─┐ └── bloco 4 (paralelizável) ─┘ └── bloco 5 (integração) └── bloco 6 (polimento) ## ponto de início mais seguro &lt;bloco 1&gt; — fundação sem dependências, permite validação imediata. ## estimativa | bloco | esforço | dependências | |-------|---------|-------------| | 1 | s | — | | 2 | m | bloco 1 | | ... | ... | ... | ## tracking o `tracking.md` será criado ao iniciar a implementação. 6. criar tracking.md gere teamwork/plan/feature-plan-&lt;feature-slug&gt;/tracking.md : # tracking — &lt;feature name&gt; **feature:** &lt;slug&gt; **início:** &lt;yyyy-mm-dd&gt; **status:** 🟡 em andamento --- ## progresso | bloco | status | início | fim | notas | |-------|--------|--------|-----|-------| | 1 - fundação | ⬜ não iniciado | — | — | | | 2 - core | ⬜ não iniciado | — | — | | | 3 - ... | ⬜ não iniciado | — | — | | **legenda:** ⬜ não iniciado | 🟡 em andamento | ✅ concluído | ❌ bloqueado --- ## log | data | evento | |------|--------| | — | — | 7. reportar no chat resumo: x blocos definidos, y dependências mapeadas, z paralelizáveis. ponto de início recomendado. estimativa total. convenções blocos organizados por ordem de dependência, não por arquivo. cada bloco deve ser testável de forma independente quando possível. tracking.md é vivo — atualizado durante implementação. português. done when [ ] plano-implementacao.md gerado com blocos sequenciados [ ] tracking.md criado com status inicial [ ] dependências entre blocos mapeadas [ ] ponto de início mais seguro identificado [ ] resumo reportado no chat "}, {"id": "skills-review-spec-skill", "path": "skills/review-spec/SKILL.md", "section": "Skills", "title": "review-spec", "status": "", "updated": "", "html": "<h1 id=\"skills-review-spec-skill~review-spec\">review-spec</h1><blockquote><p>Revisa uma SPEC contra o PRD para encontrar lacunas, ambiguidades, inconsistências e riscos de implementação. Use antes de aprovar a SPEC ou iniciar o plano de execução.</p></blockquote><h2 id=\"skills-review-spec-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-review-spec-skill~goal\">Goal</h2>\n<p>Analisar a SPEC em busca de gaps, ambiguidades e inconsistências internas, gerando relatório de pontos a resolver classificados por severidade.</p>\n<h2 id=\"skills-review-spec-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Resolva PRD e SPEC conforme <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-review-spec-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code></li>\n<li><strong>Obrigatório:</strong> <code>.agents/prd/&lt;feature-slug&gt;/PRD.md</code></li>\n</ul>\n<h2 id=\"skills-review-spec-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-review-spec-skill~1-localizar-a-feature\">1. Localizar a feature</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira dos artefatos.</li>\n<li>Verifique se os arquivos de entrada existem.</li>\n</ul>\n<h3 id=\"skills-review-spec-skill~2-carregar-artefatos\">2. Carregar artefatos</h3>\n<ul>\n<li>Leia <code>SPEC.md</code> — análise principal.</li>\n<li>Leia <code>PRD.md</code> — referência para validação de cobertura.</li>\n</ul>\n<h3 id=\"skills-review-spec-skill~3-análise-da-spec\">3. Análise da SPEC</h3>\n<p>Verifique sistematicamente:</p>\n<h4 id=\"skills-review-spec-skill~a-cobertura-do-prd\">A. Cobertura do PRD</h4>\n<ul>\n<li>Cada história do PRD tem solução técnica na SPEC?</li>\n<li>Cada regra de negócio (RN-XX) é tratada?</li>\n<li>Cada critério de sucesso (SC-XX) tem equivalente técnico?</li>\n</ul>\n<h4 id=\"skills-review-spec-skill~b-consistência-interna\">B. Consistência Interna</h4>\n<ul>\n<li>Terminologia consistente (mesmo conceito nomeado igual)?</li>\n<li>Modelo de dados coerente com os fluxos?</li>\n<li>Contratos de interface alinhados com o modelo?</li>\n</ul>\n<h4 id=\"skills-review-spec-skill~c-completude\">C. Completude</h4>\n<ul>\n<li>Histórias sem critérios de aceite técnicos?</li>\n<li>Componentes sem definição clara?</li>\n<li>Fluxos de exceção não tratados?</li>\n</ul>\n<h4 id=\"skills-review-spec-skill~d-ambiguidade\">D. Ambiguidade</h4>\n<ul>\n<li>Termos vagos (\"rápido\", \"escalável\") sem métrica?</li>\n<li>Placeholder não resolvido (TODO, TKTK)?</li>\n<li>Decisões técnicas pendentes?</li>\n</ul>\n<h4 id=\"skills-review-spec-skill~e-viabilidade\">E. Viabilidade</h4>\n<ul>\n<li>Dependências externas identificadas?</li>\n<li>Riscos técnicos documentados?</li>\n<li>Estimate de esforço realista?</li>\n</ul>\n<h3 id=\"skills-review-spec-skill~4-classificar-por-severidade\">4. Classificar por severidade</h3>\n<ul>\n<li><strong>CRITICAL:</strong> Bloqueia implementação (história sem solução, contrato inválido)</li>\n<li><strong>HIGH:</strong> Impacta qualidade (exceção não tratada, teste não definido)</li>\n<li><strong>MEDIUM:</strong> Pode causar retrabalho (ambiguidade, terminologia inconsistente)</li>\n<li><strong>LOW:</strong> Melhoria de qualidade (documentação, exemplos)</li>\n</ul>\n<h3 id=\"skills-review-spec-skill~5-gerar-relatório\">5. Gerar relatório</h3>\n<p>Gere <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/review-spec.md</code>:</p>\n<pre><code class=\"language-markdown\"># Review da SPEC — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n**SPEC:** .agents/spec/&lt;feature-slug&gt;/SPEC.md\n\n---\n\n## Resumo\n\n| Severidade | Quantidade |\n|------------|-----------|\n| 🔴 CRITICAL | X |\n| 🟠 HIGH | X |\n| 🟡 MEDIUM | X |\n| 🔵 LOW | X |\n\n**Status:** 🔴 Bloqueado / 🟡 Ajustes necessários / 🟢 Aprovado\n\n---\n\n## Achados\n\n### 🔴 CRITICAL\n\n#### C-01: &lt;Título&gt;\n- **Local:** SPEC §&lt;seção&gt;\n- **Problema:** &lt;descrição&gt;\n- **Recomendação:** &lt;como resolver&gt;\n\n### 🟠 HIGH\n\n#### H-01: &lt;Título&gt;\n...\n\n### 🟡 MEDIUM\n\n#### M-01: &lt;Título&gt;\n...\n\n### 🔵 LOW\n\n#### L-01: &lt;Título&gt;\n...\n\n---\n\n## Cobertura PRD → SPEC\n\n| História PRD | Na SPEC? | Observação |\n|-------------|----------|------------|\n| HIST-01 | ✅ / ❌ | ... |\n\n## Próximos Passos\n\n- &lt;ações para resolver CRITICAL&gt;\n- &lt;ações para resolver HIGH&gt;\n- &lt;recomendações gerais&gt;\n</code></pre>\n<h3 id=\"skills-review-spec-skill~6-reportar-no-chat\">6. Reportar no chat</h3>\n<ul>\n<li>Resumo: X achados (Y críticos, Z alto).</li>\n<li>Bloqueios que precisam de resolução antes de avançar.</li>\n<li>Status geral (bloqueado / ajustes / aprovado).</li>\n</ul>\n<h2 id=\"skills-review-spec-skill~convenções\">Convenções</h2>\n<ul>\n<li>Relatório é read-only — não modifica a SPEC.</li>\n<li>Classificação por severidade é subjetiva mas deve ser consistente.</li>\n<li>Português.</li>\n</ul>\n<h2 id=\"skills-review-spec-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] <code>review-spec.md</code> gerado em <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/</code></li>\n<li>[ ] Todos os achados classificados por severidade</li>\n<li>[ ] Cobertura PRD → SPEC documentada</li>\n<li>[ ] Status e próximos passos reportados</li>\n</ul>", "toc": [{"level": 2, "id": "skills-review-spec-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-review-spec-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-review-spec-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-review-spec-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-review-spec-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-review-spec-skill~1-localizar-a-feature", "text": "1. Localizar a feature"}, {"level": 3, "id": "skills-review-spec-skill~2-carregar-artefatos", "text": "2. Carregar artefatos"}, {"level": 3, "id": "skills-review-spec-skill~3-análise-da-spec", "text": "3. Análise da SPEC"}, {"level": 3, "id": "skills-review-spec-skill~4-classificar-por-severidade", "text": "4. Classificar por severidade"}, {"level": 3, "id": "skills-review-spec-skill~5-gerar-relatório", "text": "5. Gerar relatório"}, {"level": 3, "id": "skills-review-spec-skill~6-reportar-no-chat", "text": "6. Reportar no chat"}, {"level": 2, "id": "skills-review-spec-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-review-spec-skill~done-when", "text": "Done When"}], "text": " review-spec revisa uma spec contra o prd para encontrar lacunas, ambiguidades, inconsistências e riscos de implementação. use antes de aprovar a spec ou iniciar o plano de execução. user input $arguments you must consider the user input before proceeding (if not empty). goal analisar a spec em busca de gaps, ambiguidades e inconsistências internas, gerando relatório de pontos a resolver classificados por severidade. contrato de artefatos resolva prd e spec conforme o contrato compartilhado . inputs obrigatório: .agents/spec/&lt;feature-slug&gt;/spec.md obrigatório: .agents/prd/&lt;feature-slug&gt;/prd.md execution steps 1. localizar a feature se $arguments contém slug, use-o. caso contrário, infira dos artefatos. verifique se os arquivos de entrada existem. 2. carregar artefatos leia spec.md — análise principal. leia prd.md — referência para validação de cobertura. 3. análise da spec verifique sistematicamente: a. cobertura do prd cada história do prd tem solução técnica na spec? cada regra de negócio (rn-xx) é tratada? cada critério de sucesso (sc-xx) tem equivalente técnico? b. consistência interna terminologia consistente (mesmo conceito nomeado igual)? modelo de dados coerente com os fluxos? contratos de interface alinhados com o modelo? c. completude histórias sem critérios de aceite técnicos? componentes sem definição clara? fluxos de exceção não tratados? d. ambiguidade termos vagos (\"rápido\", \"escalável\") sem métrica? placeholder não resolvido (todo, tktk)? decisões técnicas pendentes? e. viabilidade dependências externas identificadas? riscos técnicos documentados? estimate de esforço realista? 4. classificar por severidade critical: bloqueia implementação (história sem solução, contrato inválido) high: impacta qualidade (exceção não tratada, teste não definido) medium: pode causar retrabalho (ambiguidade, terminologia inconsistente) low: melhoria de qualidade (documentação, exemplos) 5. gerar relatório gere teamwork/plan/feature-plan-&lt;feature-slug&gt;/review-spec.md : # review da spec — &lt;feature name&gt; **feature:** &lt;slug&gt; **data:** &lt;yyyy-mm-dd&gt; **spec:** .agents/spec/&lt;feature-slug&gt;/spec.md --- ## resumo | severidade | quantidade | |------------|-----------| | 🔴 critical | x | | 🟠 high | x | | 🟡 medium | x | | 🔵 low | x | **status:** 🔴 bloqueado / 🟡 ajustes necessários / 🟢 aprovado --- ## achados ### 🔴 critical #### c-01: &lt;título&gt; - **local:** spec §&lt;seção&gt; - **problema:** &lt;descrição&gt; - **recomendação:** &lt;como resolver&gt; ### 🟠 high #### h-01: &lt;título&gt; ... ### 🟡 medium #### m-01: &lt;título&gt; ... ### 🔵 low #### l-01: &lt;título&gt; ... --- ## cobertura prd → spec | história prd | na spec? | observação | |-------------|----------|------------| | hist-01 | ✅ / ❌ | ... | ## próximos passos - &lt;ações para resolver critical&gt; - &lt;ações para resolver high&gt; - &lt;recomendações gerais&gt; 6. reportar no chat resumo: x achados (y críticos, z alto). bloqueios que precisam de resolução antes de avançar. status geral (bloqueado / ajustes / aprovado). convenções relatório é read-only — não modifica a spec. classificação por severidade é subjetiva mas deve ser consistente. português. done when [ ] review-spec.md gerado em teamwork/plan/feature-plan-&lt;feature-slug&gt;/ [ ] todos os achados classificados por severidade [ ] cobertura prd → spec documentada [ ] status e próximos passos reportados "}, {"id": "skills-review-cross-prd-spec-skill", "path": "skills/review-cross-prd-spec/SKILL.md", "section": "Skills", "title": "review-cross-prd-spec", "status": "", "updated": "", "html": "<h1 id=\"skills-review-cross-prd-spec-skill~review-cross-prd-spec\">review-cross-prd-spec</h1><blockquote><p>Compara PRD e SPEC, identificando cobertura, conflitos e decisões pendentes sem alterar os artefatos. Use antes do planejamento de sprint ou quando for necessário comprovar o alinhamento entre negócio e solução técnica.</p></blockquote><h2 id=\"skills-review-cross-prd-spec-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-review-cross-prd-spec-skill~goal\">Goal</h2>\n<p>Validar alinhamento entre PRD e SPEC, identificando requisitos do PRD não cobertos na SPEC e conflitos entre os dois artefatos.</p>\n<h2 id=\"skills-review-cross-prd-spec-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Resolva PRD e SPEC conforme <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-review-cross-prd-spec-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>.agents/prd/&lt;feature-slug&gt;/PRD.md</code></li>\n<li><strong>Obrigatório:</strong> <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code></li>\n</ul>\n<h2 id=\"skills-review-cross-prd-spec-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-review-cross-prd-spec-skill~1-localizar-a-feature\">1. Localizar a feature</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira dos artefatos.</li>\n<li>Verifique se os arquivos de entrada existem.</li>\n</ul>\n<h3 id=\"skills-review-cross-prd-spec-skill~2-carregar-artefatos\">2. Carregar artefatos</h3>\n<ul>\n<li>Leia <code>PRD.md</code> — perspectiva de negócio.</li>\n<li>Leia <code>SPEC.md</code> — perspectiva técnica.</li>\n</ul>\n<h3 id=\"skills-review-cross-prd-spec-skill~3-revisão-cruzada\">3. Revisão cruzada</h3>\n<h4 id=\"skills-review-cross-prd-spec-skill~a-cobertura-prd--spec\">A. Cobertura PRD → SPEC</h4>\n<p>Para cada elemento do PRD, verifique se existe correspondente na SPEC:</p>\n<table>\n<thead>\n<tr>\n<th>Elemento PRD</th>\n<th>Tipo</th>\n<th>Na SPEC?</th>\n<th>Observação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>HIST-01</td>\n<td>História</td>\n<td>✅ / ❌ / ⚠️ Parcial</td>\n<td>...</td>\n</tr>\n<tr>\n<td>RN-01</td>\n<td>Regra</td>\n<td>✅ / ❌</td>\n<td>...</td>\n</tr>\n<tr>\n<td>SC-01</td>\n<td>Critério Sucesso</td>\n<td>✅ / ❌</td>\n<td>...</td>\n</tr>\n</tbody>\n</table>\n<h4 id=\"skills-review-cross-prd-spec-skill~b-conflitos-prd--spec\">B. Conflitos PRD ↔ SPEC</h4>\n<p>Identifique onde PRD e SPEC divergem:</p>\n<ul>\n<li><strong>Escopo:</strong> SPEC implementa algo fora do PRD? PRD pede algo não tratado na SPEC?</li>\n<li><strong>Comportamento:</strong> SPEC define comportamento diferente do que o PRD descreve?</li>\n<li><strong>Dados:</strong> Modelo de dados da SPEC suporta todos os fluxos do PRD?</li>\n<li><strong>Performance:</strong> Requisitos não-funcionais do PRD são endereçados na SPEC?</li>\n</ul>\n<h4 id=\"skills-review-cross-prd-spec-skill~c-alinhamento-de-terminologia\">C. Alinhamento de Terminologia</h4>\n<ul>\n<li>Mesmos termos usados nos dois documentos?</li>\n<li>Significado consistente?</li>\n</ul>\n<h4 id=\"skills-review-cross-prd-spec-skill~d-decisões-técnicas-vs-requisitos-de-negócio\">D. Decisões Técnicas vs Requisitos de Negócio</h4>\n<ul>\n<li>A SPEC não deve alterar requisitos de negócio (só pode refinar como implementar).</li>\n<li>Se a SPEC \"muda\" um requisito, é conflito — reportar.</li>\n</ul>\n<h3 id=\"skills-review-cross-prd-spec-skill~4-gerar-relatório\">4. Gerar relatório</h3>\n<p>Gere <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/review-cross.md</code>:</p>\n<pre><code class=\"language-markdown\"># Revisão Cruzada PRD ↔ SPEC — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n**PRD:** .agents/prd/&lt;feature-slug&gt;/PRD.md\n**SPEC:** .agents/spec/&lt;feature-slug&gt;/SPEC.md\n\n---\n\n## Resumo\n\n| Categoria | Quantidade |\n|-----------|-----------|\n| ✅ Alinhados | X |\n| ⚠️ Parcialmente cobertos | X |\n| ❌ Não cobertos (PRD → SPEC) | X |\n| 🔴 Conflitos | X |\n\n**Status:** 🔴 Conflitos encontrados / 🟡 Ajustes necessários / 🟢 Alinhado\n\n---\n\n## Cobertura PRD → SPEC\n\n### Histórias\n| PRD | SPEC | Status | Observação |\n|-----|------|--------|------------|\n| HIST-01 | §4.1 | ✅ / ⚠️ / ❌ | ... |\n\n### Regras de Negócio\n| RN | Status | SPEC ref | Observação |\n|----|--------|----------|------------|\n| RN-01 | ✅ / ❌ | §... | ... |\n\n### Critérios de Sucesso\n| SC | Status | SPEC ref | Observação |\n|----|--------|----------|------------|\n| SC-01 | ✅ / ❌ | §... | ... |\n\n---\n\n## Conflitos Detectados\n\n### CONFLITO-01: &lt;Título&gt;\n- **PRD diz:** &lt;citação do PRD&gt;\n- **SPEC diz:** &lt;citação da SPEC&gt;\n- **Tipo:** Escopo / Comportamento / Dados / Performance\n- **Recomendação:** &lt;como resolver&gt;\n\n---\n\n## Pontos de Alinhamento\n\n- &lt;pontos onde PRD e SPEC estão bem alinhados&gt;\n\n## Recomendações\n\n1. &lt;ação recomendada&gt;\n2. &lt;ação recomendada&gt;\n\n## Próximos Passos\n\n- Resolver conflitos antes do sprint planning\n- Atualizar artefatos conforme resoluções\n</code></pre>\n<h3 id=\"skills-review-cross-prd-spec-skill~5-reportar-no-chat\">5. Reportar no chat</h3>\n<ul>\n<li>Resumo: X alinhados, Y parcialmente cobertos, Z não cobertos, W conflitos.</li>\n<li>Conflitos que bl
