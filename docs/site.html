lanes de CI em vez de uma</strong>: a fast lane existe para devolver sinal ao agente em minutos; uma esteira única e completa transforma cada tentativa em uma espera longa, e o agente ocioso custa tanto quanto o agente errado.</p>\n<p>O que falta hoje neste repositório é o esqueleto executável correspondente — um template copiável com <code>AGENTS.md</code>, rules mínimas, hooks e workflows prontos. Ele está registrado como pendência em <a href=\"#docs-operating-model-90-10~91-próximo-detalhamento-recomendado\"><code>operating-model-90-10.md §9.1</code></a>.</p>\n<hr>\n<h2 id=\"docs-repo-harness~11-checklist-de-conformidade\">11. Checklist de conformidade</h2>\n<p>Antes de declarar um repositório pronto para ser operado por agentes, confirme o nível pretendido item a item. Um repositório que falha em qualquer linha do seu nível opera no nível anterior, independentemente do que o restante tenha.</p>\n<p><strong>HL1 — legível</strong></p>\n<ul>\n<li>[ ] <code>AGENTS.md</code> responde identidade, comandos, fronteiras, verificação, escalonamento e ponteiros</li>\n<li>[ ] Rules cobrem arquitetura, código, testes e segurança, cada uma com o motivo declarado</li>\n<li>[ ] <code>scripts/verify.sh</code> roda a verificação completa e é o mesmo comando usado por hooks e CI</li>\n<li>[ ] Pre-commit bloqueia lint, formatação, typecheck e testes unitários afetados</li>\n<li>[ ] Falha de verificação produz mensagem com arquivo, regra violada e correção esperada</li>\n</ul>\n<p><strong>HL2 — verificável</strong></p>\n<ul>\n<li>[ ] CI seleciona checks por classe de risco e paths alterados</li>\n<li>[ ] <code>CODEOWNERS</code> cobre migrações, segurança, contratos públicos e o próprio harness</li>\n<li>[ ] Proteção de branch impede bypass silencioso e force push, e invalida aprovação após mudança material</li>\n<li>[ ] Evidence pack é gerado automaticamente e permite refazer a verificação sem contexto adicional</li>\n<li>[ ] Mudança em rules, hooks ou CI eleva risco e exige owner do harness</li>\n</ul>\n<p><strong>HL3 — operável por time</strong></p>\n<ul>\n<li>[ ] Worktree limpo roda <code>scripts/verify.sh</code> sem configuração manual</li>\n<li>[ ] Cada agente tem identidade distinta e verificável; autor nunca aprova</li>\n<li>[ ] Skills específicas do repositório existem para os procedimentos caros e recorrentes</li>\n<li>[ ] Gates de ambiente e pós-deploy estão configurados, com rollback testado em produção</li>\n<li>[ ] Autoria, modelo e versão ficam registrados em commits e evidências</li>\n</ul>\n<p>O checklist não substitui o <a href=\"#docs-operating-model-90-10~7-autonomia-progressiva\">critério de elevação de autonomia</a>: ele atesta que a capacidade existe, e não que o histórico já demonstrou que ela funciona.</p>", "toc": [{"level": 2, "id": "docs-repo-harness~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-repo-harness~mapa-do-documento", "text": "Mapa do documento"}, {"level": 2, "id": "docs-repo-harness~1-o-que-é-e-o-que-não-é", "text": "1. O que é e o que não é"}, {"level": 2, "id": "docs-repo-harness~2-as-cinco-camadas", "text": "2. As cinco camadas"}, {"level": 2, "id": "docs-repo-harness~3-estrutura-de-arquivos-do-repositório", "text": "3. Estrutura de arquivos do repositório"}, {"level": 2, "id": "docs-repo-harness~4-camada-de-contexto", "text": "4. Camada de contexto"}, {"level": 3, "id": "docs-repo-harness~41-agentsmd--o-contrato-de-entrada", "text": "4.1 AGENTS.md — o contrato de entrada"}, {"level": 3, "id": "docs-repo-harness~42-rules--a-regra-e-o-motivo", "text": "4.2 Rules — a regra e o motivo"}, {"level": 2, "id": "docs-repo-harness~5-camada-de-procedimento", "text": "5. Camada de procedimento"}, {"level": 2, "id": "docs-repo-harness~6-camada-de-verificação", "text": "6. Camada de verificação"}, {"level": 2, "id": "docs-repo-harness~7-camadas-de-permissão-e-evidência", "text": "7. Camadas de permissão e evidência"}, {"level": 2, "id": "docs-repo-harness~8-o-que-muda-com-agent-teams", "text": "8. O que muda com Agent Teams"}, {"level": 3, "id": "docs-repo-harness~81-isolamento-de-execução", "text": "8.1 Isolamento de execução"}, {"level": 3, "id": "docs-repo-harness~82-separação-entre-produzir-e-aprovar", "text": "8.2 Separação entre produzir e aprovar"}, {"level": 3, "id": "docs-repo-harness~83-orçamento-de-contexto-por-agente", "text": "8.3 Orçamento de contexto por agente"}, {"level": 2, "id": "docs-repo-harness~9-níveis-de-maturidade-hl0hl3", "text": "9. Níveis de maturidade HL0–HL3"}, {"level": 2, "id": "docs-repo-harness~10-stack-de-referência", "text": "10. Stack de referência"}, {"level": 2, "id": "docs-repo-harness~11-checklist-de-conformidade", "text": "11. Checklist de conformidade"}], "text": " repo harness o conjunto de arquivos, verificações e permissões que torna um repositório seguro de operar por um time de agentes — e o que muda quando eles trabalham em paralelo. em 2 minutos um agente competente em um repositório sem harness produz código plausível e errado. ele não sabe qual padrão o time abandonou no ano passado, qual módulo não pode importar qual, quais testes provam o que ele acabou de escrever, nem quando parar e perguntar. esse conhecimento existe — mas vive na cabeça das pessoas, e a cada execução o agente precisa que alguém o recite de novo. o custo disso não é o erro isolado: é que a revisão humana volta a ser o único gate real, e a autonomia nunca sobe. o harness resolve isso convertendo o conhecimento tácito do repositório em arquivos versionados que o agente lê sozinho e verificações que rodam sem pedir licença . é um artefato do repositório de código, não do workspace do agente — a organização do trabalho em disco é responsabilidade do workspace do tech lead ; o harness é o que cada repositório carrega dentro de si e viaja junto com o clone. camada responde materializa em contexto o que este repositório é e quais regras valem agents.md , docs/rules/ procedimento como executar uma tarefa recorrente do jeito certo skills/ , comandos, scripts verificação o que precisa ser verdade antes de avançar hooks, ci, políticas de merge permissão o que este agente pode tocar e o que exige gente codeowners , settings, ambientes evidência como provar depois que estava correto evidence pack, logs, artefatos as camadas são cumulativas e a ordem importa. verificação sem contexto produz agente que falha rápido sem saber por quê; contexto sem verificação produz agente que acerta às vezes e ninguém sabe quando. a maturidade do harness é o que autoriza subir a autonomia — nunca o contrário. mapa do documento seção responde leia se você… 1. fronteira o que pertence ao harness e o que não está em dúvida sobre onde algo mora 2. as cinco camadas o que cada camada garante e o que a quebra custa vai avaliar um harness existente 3. estrutura de arquivos onde cada peça fica no repositório vai montar ou auditar um repo 4. contexto o que escrever em agents.md e nas rules vai escrever o contexto do repo 5. procedimento quando algo vira skill em vez de rule vai criar uma skill ou script 6. verificação onde cada check pertence na escada vai configurar hooks e ci 7. permissão e evidência quem pode o quê e como se prova vai definir política de merge e deploy 8. agent teams o que quebra quando são vários agentes vai rodar agentes em paralelo 9. níveis hl0–hl3 onde seu repo está e o que falta vai propor elevar autonomia 10. stack de referência uma implementação concreta possível quer um ponto de partida executável 11. checklist como validar antes de operar vai declarar um repo pronto vizinhos: sistema operacional do trio humano · modelo operacional 90/10 · workspace do tech lead · catálogo de skills · workflows multiagente . 1. o que é e o que não é o harness é o contrato executável de um repositório de código . ele responde a quatro perguntas que todo agente faz antes de agir — o que é este repositório, como se faz aqui, o que preciso provar, o que não posso tocar — e responde por escrito, dentro do próprio repositório, sem depender de quem está disponível no slack naquele momento. a fronteira mais confundida é com o workspace. ela vale a pena ser explícita, porque colocar a peça no lado errado gera duplicidade silenciosa: dois lugares descrevem a mesma regra, os dois envelhecem, e o agente lê o errado. pergunta mora no harness do repo mora no workspace do agente como este serviço é arquitetado? sim, em docs/rules/ não quais são os projetos ativos e suas prioridades? não sim, em board.md e projects/ qual o padrão de teste para uma mudança de contrato? sim não onde está o prd desta feature? não sim, em projects/&lt;slug&gt;/product/ que comando roda a suíte de integração? sim, em agents.md ou skill não qual branch e worktree este work item usa? não sim, no work item a regra de decisão: se a informação continua verdadeira quando outro time clona o repositório, ela é harness . se depende de quem está trabalhando, em qual projeto, nesta semana, é workspace. o harness também não é a esteira de ci. a esteira é uma das implementações da camada de verificação; um repositório com ci excelente e nenhum agents.md tem meio harness — verifica muito e explica nada, o que produz o pior padrão de todos: o agente descobre a regra por tentativa e erro, gastando ciclos caros para reconstruir informação que já existia. 2. as cinco camadas cada camada existe para eliminar uma classe específica de falha. a tabela abaixo é o argumento central do documento: ela liga a camada à falha que ela previne e ao sintoma observável quando ela está ausente. camada elimina sintoma quando falta contexto agente reconstruindo premissas a cada execução soluções plausíveis fora do padrão do repo; mesma correção pedida em prs diferentes procedimento variação entre execuções da mesma tarefa dois agentes resolvem o mesmo tipo de tarefa de formas incompatíveis verificação confiança substituindo prova aprovação baseada em \"o agente parece confiável\"; defeito descoberto em produção permissão mudança fora do escopo autorizado agente altera migração, secret ou gate sem que ninguém tenha decidido isso evidência conclusão sem rastro auditável ninguém consegue reconstruir por que aquela mudança foi aprovada a ordem de construção segue a mesma sequência, e a razão é econômica. contexto é o mais barato de escrever e o que mais reduz retrabalho imediato. verificação é cara de configurar mas é a única camada que permite reduzir revisão humana. evidência só tem valor quando existe algo verificado para registrar — construída antes, produz arquivos que ninguém lê. pular contexto para ir direto a gates é o erro de sequenciamento mais comum. ele parece produtivo porque gates dão sinal imediato, mas produz um agente que passa a tratar o pipeline como oráculo: tenta, falha, ajusta, tenta de novo. cada volta custa tempo de ci e tokens, e nenhuma delas ensina o padrão para a próxima execução. 3. estrutura de arquivos do repositório a estrutura abaixo é o alvo completo — um repositório em hl3 . repositórios em níveis anteriores contêm um subconjunto, e a seção de maturidade indica qual. &lt;repositório&gt;/ ├── agents.md # contrato de entrada do agente ├── readme.md # uso humano: rodar, buildar, contribuir ├── codeowners # propriedade por path │ ├── docs/ │ ├── rules/ │ │ ├── architecture.md # módulos, fronteiras, dependências permitidas │ │ ├── coding.md # convenções, padrões aceitos e proibidos │ │ ├── testing.md # níveis obrigatórios por tipo de mudança │ │ ├── security.md # dados, secrets, autenticação, privacidade │ │ └── operations.md # slos, observabilidade, rollout, rollback │ ├── adr/ │ │ └── adr-nnn-&lt;slug&gt;.md # decisões e consequências │ └── evidence/ │ └── &lt;work-item&gt;/ # evidence pack por unidade de trabalho │ ├── skills/ │ └── &lt;skill&gt;/skill.md # procedimentos executáveis do repo │ ├── .agent/ │ ├── settings.json # tools permitidas, limites, modelos │ └── permissions.md # o que exige humano neste repositório │ ├── scripts/ │ ├── verify.sh # entrada única das verificações locais │ └── evidence.sh # coleta e empacota evidência │ ├── .hooks/ # pre-commit e pre-push versionados └── .ci/ # fast lane e deep lane três decisões nessa árvore merecem justificativa, porque a alternativa aparente é sempre mais simples e sempre pior no médio prazo. rules em arquivos separados, não em um agents.md gigante. o agents.md é lido inteiro em toda execução; as rules são lidas sob demanda. fundir os dois faz cada tarefa trivial pagar o custo de contexto da regra de migração de banco. a separação é uma decisão de orçamento de contexto, não de organização estética. scripts/verify.sh como entrada única. hooks, ci e agente chamam o mesmo script. sem isso, a verificação local e a de ci divergem, e a divergência aparece na forma mais cara possível — o agente entrega, o ci reprova, e ninguém consegue reproduzir localmente. docs/evidence/ dentro do repositório. a evidência acompanha o código que ela comprova. guardada fora, ela sobrevive à mudança de ferramenta de ci mas perde a ligação com o commit; guardada dentro, a ligação é o próprio histórico do git. arquivo carrega não carrega agents.md como operar o repo, comandos, quando parar arquitetura detalhada, histórico de decisões docs/rules/*.md a regra e o motivo dela instruções de execução passo a passo docs/adr/ por que a decisão foi tomada e o que ela custa a regra vigente resultante skills/&lt;skill&gt;/skill.md passo a passo verificável de uma tarefa recorrente conhecimento geral sobre o domínio .agent/permissions.md o que exige autorização humana política de risco global do time codeowners quem aprova mudança em cada path por que aquele path é sensível 4. camada de contexto 4.1 agents.md — o contrato de entrada o agents.md é lido antes de qualquer ação, o que torna cada linha dele um custo fixo por execução. isso impõe uma disciplina que o readme.md não tem: ele responde o que o agente precisa para agir corretamente na primeira tentativa , e delega o resto por ponteiro. bloco conteúdo erro comum identidade o que o serviço faz e para quem, em três frases reescrever o pitch do produto comandos instalar, buildar, testar, verificar, rodar local listar comandos que ninguém usa mais fronteiras o que não pode ser alterado sem autorização descrever a arquitetura inteira verificação o que precisa passar antes de considerar pronto duplicar a configuração de ci escalonamento as condições em que se para e devolve a decisão omitir — é o bloco mais esquecido ponteiros onde ficam rules, adrs, skills e evidências inlinar o conteúdo apontado o bloco de escalonamento é o que mais falta e o que mais importa. sem ele, um agente diante de requisito contraditório escolhe uma interpretação e segue — e a escolha só aparece na revisão, quando o trabalho já foi feito. o contrato de escalonamento do modelo operacional define as condições genéricas; o agents.md acrescenta as específicas do repositório. 4.2 rules — a regra e o motivo rules descrevem estado desejado, não procedimento. \"módulos de domínio não importam de infraestrutura\" é rule; \"para adicionar um adapter, crie a interface em x e a implementação em y\" é skill. a confusão entre os dois produz rules longas que ninguém lê e skills vagas que não se consegue executar. toda rule carrega o motivo junto. isso não é cortesia editorial: um agente que conhece a razão de uma regra decide corretamente no caso de borda que a regra não previu, enquanto um agente que só conhece a regra ou a aplica cegamente ou a ignora. as rules cobrem quatro frentes, e a divisão existe para que cada uma possa ser carregada isoladamente conforme a tarefa: frente define arquivo estrutura de código arquitetura e fronteiras entre módulos, convenções e nomes, padrões aceitos e proibidos, injeção de dependência e composição architecture.md , coding.md fluxo gitflow e estratégia de branches, critérios de validação e homologação, propriedade por paths coding.md , codeowners risco e dados classificação de risco e permissões por fase, segurança, privacidade e uso de dados security.md operação slos, observabilidade, rollout e rollback operations.md estratégia de testes quais níveis são obrigatórios por tipo de mudança testing.md a estratégia de testes merece destaque porque é a rule que os gates traduzem diretamente em bloqueio: unitários → arquitetura → integração / taac → contrato → end-to-end → acessibilidade → mutação a rule define quais níveis são obrigatórios por tipo de mudança . sem esse mapeamento, o agente ou escreve testes de menos, e o gate reprova tarde, ou escreve testes de mais, e o custo por entrega sobe sem ganho de segurança. 5. camada de procedimento uma tarefa vira skill quando três condições se acumulam: ela se repete, ela tem um jeito certo de ser feita, e errá-la custa caro o suficiente para justificar escrever o procedimento. tarefa que se repete mas tolera variação não precisa de skill — precisa de rule. tarefa cara mas única não precisa de skill — precisa de um humano. o catálogo global em skills/ cobre os procedimentos que valem para qualquer repositório: discovery, especificação, implementação, revisão, publicação e operação de workspace. o repositório acrescenta apenas o que é dele — o procedimento de migração daquele banco, o fluxo de rollout daquele serviço, a forma de gerar aquele client. origem contém exemplo catálogo global procedimento válido em qualquer repo code-review , commit , create-spec skill do repositório procedimento específico daquele código migração de schema, geração de sdk, rollout do serviço toda skill declara objetivo, inputs, outputs, tools permitidas, critérios de parada, exemplos e testes. o critério de parada é o campo que separa uma skill de um tutorial: sem ele, o agente não sabe se terminou, e a resposta padrão de um agente que não sabe se terminou é continuar. scripts são o degrau abaixo da skill. quando o procedimento é determinístico o bastante para virar código, ele deve virar código — um script é mais barato de executar, mais fácil de testar e impossível de interpretar errado. a skill existe para o que exige julgamento; o script, para o que não exige. 6. camada de verificação a escada de gates completa — local, ci, merge, ambiente, pós-deploy — está definida em operating-model-90-10.md e não se repete aqui. o que o harness acrescenta é a decisão de onde cada check pertence , que é onde a maioria das configurações erra. o critério é a razão entre custo de execução e frequência de falha. um check barato que falha com frequência pertence ao degrau mais baixo possível; um check caro que quase nunca falha pertence ao mais alto. colocar um check caro cedo trava o agente em cada commit; colocar um check barato tarde desperdiça uma volta inteira de ci para informar algo que se saberia em dois segundos. se o check… …ele pertence a porque roda em segundos e falha com frequência pre-commit corrigir custa quase nada e o loop é imediato precisa de container ou serviço externo pre-push ou ci inviável a cada commit depende de ambiente limpo ou build completo ci resultado local não é confiável exige julgamento sobre risco ou trade-off merge é decisão, não verificação só é observável com tráfego real pós-deploy não existe forma de antecipar duas travas se aplicam especificamente a repositórios operados por agentes. a primeira: o resultado de um gate é input do agente, não apenas do humano — uma falha de ci precisa produzir mensagem acionável o suficiente para o agente corrigir sozinho, o que na prática significa apontar arquivo, regra violada e correção esperada. gate que só diz \"falhou\" transfere para a revisão humana o trabalho que ele existia para evitar. a segunda: mudança em rules, hooks ou ci eleva o risco automaticamente , e nenhum agente altera gates dentro do mesmo fluxo que aqueles gates avaliam. sem essa separação, o caminho de menor resistência para um agente bloqueado passa a ser afrouxar o bloqueio. 7. camadas de permissão e evidência permissão e evidência são as duas camadas que só existem porque quem opera o repositório não é uma pessoa. um humano diante de uma migração de banco hesita; um agente, não — a hesitação precisa estar escrita. a permissão se expressa em três níveis que se sobrepõem, do mais granular ao mais amplo. codeowners define quem aprova mudança em cada path, e é a trava mais eficaz porque age no ponto exato do risco. as configurações do agente definem quais tools ele pode invocar e com que limites. as proteções de branch e ambiente definem o que exige autorização independentemente de quem pediu. categoria de path tratamento típico migrações, schema, dados persistidos owner obrigatório; nunca auto-merge autenticação, autorização, secrets owner de segurança; risco elevado automaticamente contratos públicos e integrações externas owner técnico; verificação de compatibilidade rules, hooks, ci, agents.md owner do harness; separado do fluxo avaliado código de aplicação coberto por testes fluxo normal conforme classe de risco a evidência fecha o ciclo. ela existe para que a aprovação seja sobre fatos verificáveis, e não sobre a impressão que o resumo do agente causou. o evidence pack de uma unidade de trabalho registra o que foi feito, o que foi verificado, o que falhou e foi corrigido, e o que permanece em aberto — com ponteiros para os artefatos originais em vez de reproduzi-los. o critério de qualidade é único e severo: um evidence pack serve se outra pessoa consegue refazer a verificação sem perguntar nada a quem o produziu . pack que exige contexto adicional não é evidência, é resumo. 8. o que muda com agent teams um harness dimensionado para um agente por vez falha de formas específicas quando vários agentes operam em paralelo, e as falhas não são de qualidade — são de coordenação. cada uma tem uma contramedida no harness. falha o que acontece contramedida no harness sobrescrita silenciosa dois agentes editam o mesmo arquivo; o último vence worktree por work item; nunca clone compartilhado auto-aprovação o agente que produziu também revisa identidade distinta por agente; owner ≠ autor divergência de contexto agentes leem versões diferentes da mesma rule rules versionadas com o código; sem contexto injetado fora do repo contenção em arquivo comum vários agentes atualizam o mesmo board ou log um arquivo por unidade de trabalho; consolidação por um coordenador deriva de gate um agente afrouxa a verificação que o bloqueia mudança em gate sai do fluxo avaliado e exige owner perda de rastro não se sabe qual agente produziu o quê autoria, modelo e versão registrados em cada commit e evidência 8.1 isolamento de execução o isolamento é a contramedida de maior impacto e a mais barata de adotar. cada missão trabalha em um worktree próprio, derivado do clone canônico, com branch dedicada ao work item — o padrão de diretórios está definido no workspace do tech lead . o que o harness precisa garantir do seu lado é que o repositório funcione a partir de um worktree limpo sem configuração manual . repositório que depende de um .env montado à mão, de um cache local aquecido ou de um passo não documentado quebra o isolamento na prática, mesmo que a estrutura de diretórios esteja correta. o teste é direto: um worktree recém-criado roda scripts/verify.sh com sucesso sem intervenção. 8.2 separação entre produzir e aprovar nenhum agente aprova a própria mudança. isso exige que agentes tenham identidades distintas e verificáveis no sistema de versionamento — não basta um prompt instruindo o agente revisor a ser rigoroso, porque a proteção precisa ser estrutural, aplicada pela política de merge e não pela boa-fé do modelo. a separação vale também entre papéis: o agente que implementa não é o que revisa, e o que revisa não é o que decide o merge em mudanças de risco elevado. a validação adversarial é o workflow que materializa isso. 8.3 orçamento de contexto por agente com um agente, contexto excedente custa tokens. com um time, custa consistência: agentes com janelas diferentes de contexto tomam decisões diferentes sobre o mesmo repositório, e a divergência aparece como inconsistência arquitetural que ninguém autorizou. a contramedida é estrutural — agents.md enxuto, rules carregadas sob demanda por área, skills que declaram exatamente o que precisam ler. um harness que exige ler tudo para fazer qualquer coisa não escala para time. 9. níveis de maturidade hl0–hl3 os níveis descrevem o que existe no repositório, e servem para responder uma pergunta só: até onde a autonomia pode subir com segurança neste repo . a nomenclatura hl evita colisão com os checkpoints humanos h1–h6 do modelo 90/10 . nível o repositório tem autonomia sustentada o que ainda depende de gente hl0 — nu readme.md , testes eventuais, ci de build nenhuma — assistido tudo; revisão humana é o único gate hl1 — legível agents.md , rules mínimas, scripts/verify.sh , pre-commit a0–a1 integração e liberação; revisão de conteúdo ainda ampla hl2 — verificável ci por risco e paths, codeowners , proteção de branch, evidence pack a2 merge em r2+; decisões de trade-off hl3 — operável por time skills do repo, worktree limpo, identidades por agente, gates de ambiente e pós-deploy, rollback testado a3–a4 exceções, incidentes e auditoria por amostragem a progressão tem uma regra que a torna útil em vez de decorativa: o nível do harness é teto da autonomia, nunca consequência dela . um repositório em hl1 operando em a2 não está adiantado — está com um gate faltando e ninguém observando. o critério para elevar autonomia exige evidência acumulada além do nível do harness. a ordem de construção entre níveis segue o retorno decrescente. sair de hl0 para hl1 é o movimento de maior impacto por esforço — é onde o agente para de reconstruir premissas. de hl1 para hl2 é onde a revisão humana começa a encolher de fato, e é o movimento que mais exige disciplina, porque gates mal calibrados geram falso positivo e o time aprende a ignorá-los. de hl2 para hl3 só compensa quando há mais de um agente em paralelo; antes disso, o custo de isolamento e identidade não se paga. 10. stack de referência as opções abaixo são uma implementação possível, não uma decisão de adoção. o contrato do harness não deve depender de marca — o que a tabela oferece é um ponto de partida concreto para quem está montando o primeiro repositório e não quer decidir dez ferramentas antes de começar. a avaliação de qualquer alternativa passa pelo contrato de avaliação de ferramenta . camada implementação de referência papel contexto agents.md + markdown em docs/rules/ lido pelo agente e pela pessoa, versionado com o código procedimento skills em markdown + scripts posix procedimento com julgamento e procedimento determinístico verificação local pre-commit framework chamando scripts/verify.sh mesmo comando local e em ci verificação em ci github actions com fast lane e deep lane seleção de checks por risco e paths segurança codeql, secret scanning, dependency review achados com regra reproduzível permissão codeowners , branch protection, environments trava estrutural, não instrução em prompt evidência artefatos de workflow + docs/evidence/&lt;work-item&gt;/ rastro auditável ligado ao commit isolamento git worktree por work item execução paralela sem contenção observabilidade opentelemetry + backend do time sinal de pós-deploy que sustenta a3 duas escolhas dessa lista costumam ser questionadas, e ambas têm resposta curta. markdown em vez de formato estruturado para rules e skills: o consumidor primário é um modelo de linguagem, e prosa com estrutura leve é lida melhor que yaml aninhado — estrutura rígida só compensa quando há automação lendo o mesmo arquivo. duas lanes de ci em vez de uma : a fast lane existe para devolver sinal ao agente em minutos; uma esteira única e completa transforma cada tentativa em uma espera longa, e o agente ocioso custa tanto quanto o agente errado. o que falta hoje neste repositório é o esqueleto executável correspondente — um template copiável com agents.md , rules mínimas, hooks e workflows prontos. ele está registrado como pendência em operating-model-90-10.md §9.1 . 11. checklist de conformidade antes de declarar um repositório pronto para ser operado por agentes, confirme o nível pretendido item a item. um repositório que falha em qualquer linha do seu nível opera no nível anterior, independentemente do que o restante tenha. hl1 — legível [ ] agents.md responde identidade, comandos, fronteiras, verificação, escalonamento e ponteiros [ ] rules cobrem arquitetura, código, testes e segurança, cada uma com o motivo declarado [ ] scripts/verify.sh roda a verificação completa e é o mesmo comando usado por hooks e ci [ ] pre-commit bloqueia lint, formatação, typecheck e testes unitários afetados [ ] falha de verificação produz mensagem com arquivo, regra violada e correção esperada hl2 — verificável [ ] ci seleciona checks por classe de risco e paths alterados [ ] codeowners cobre migrações, segurança, contratos públicos e o próprio harness [ ] proteção de branch impede bypass silencioso e force push, e invalida aprovação após mudança material [ ] evidence pack é gerado automaticamente e permite refazer a verificação sem contexto adicional [ ] mudança em rules, hooks ou ci eleva risco e exige owner do harness hl3 — operável por time [ ] worktree limpo roda scripts/verify.sh sem configuração manual [ ] cada agente tem identidade distinta e verificável; autor nunca aprova [ ] skills específicas do repositório existem para os procedimentos caros e recorrentes [ ] gates de ambiente e pós-deploy estão configurados, com rollback testado em produção [ ] autoria, modelo e versão ficam registrados em commits e evidências o checklist não substitui o critério de elevação de autonomia : ele atesta que a capacidade existe, e não que o histórico já demonstrou que ela funciona. "}, {"id": "docs-end-to-end-journey", "path": "docs/end-to-end-journey.md", "section": "Modelo operacional", "title": "Jornada de ponta a ponta", "status": "reference", "updated": "2026-08-09", "html": "<h1 id=\"docs-end-to-end-journey~agent-team--fluxo-da-jornada\">Agent Team — fluxo da jornada</h1>\n<blockquote>\n<p>O ciclo completo do Agent Team em um único diagrama: onde os agentes trabalham, onde as automações bloqueiam e onde uma pessoa precisa decidir.</p>\n</blockquote>\n<h2 id=\"docs-end-to-end-journey~em-2-minutos\">Em 2 minutos</h2>\n<p>Este é o documento para ver o sistema inteiro de uma vez. O diagrama abaixo cobre as onze etapas, do registro de uma necessidade até o aprendizado que reinicia o ciclo, e usa cor para separar três naturezas de trabalho: o que agentes executam, o que automações verificam e o que exige julgamento humano.</p>\n<p>O ponto a observar na primeira leitura é a <strong>quantidade de amarelo</strong>. São apenas seis pontos de decisão humana (H1 a H6) em todo o ciclo — o resto é executado ou verificado sem intervenção. É essa proporção que o modelo tenta sustentar, e é ela que degrada primeiro quando gates são frouxos ou artefatos ficam ambíguos.</p>\n<table>\n<thead>\n<tr>\n<th>Para ir mais fundo</th>\n<th>Documento</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Papéis, decisões e autonomia</td>\n<td><a href=\"#docs-operating-model\">sistema operacional do trio humano</a></td>\n</tr>\n<tr>\n<td>Gates, risco e níveis A0–A4</td>\n<td><a href=\"#docs-operating-model-90-10\">modelo operacional 90/10</a></td>\n</tr>\n<tr>\n<td>O que o repositório precisa ter para sustentar o fluxo</td>\n<td><a href=\"#docs-repo-harness\">repo harness</a></td>\n</tr>\n<tr>\n<td>O mesmo fluxo, uma fase por vez</td>\n<td><a href=\"#docs-journey-by-phase\">fluxos por fase</a></td>\n</tr>\n<tr>\n<td>O contrato de cada etapa</td>\n<td><a href=\"#docs-workflows-readme\">workflows multiagente</a></td>\n</tr>\n</tbody>\n</table>\n<p>Cada etapa com colaboração entre agentes tem contrato próprio: <a href=\"#docs-workflows-00-intake-and-triage\">intake</a>, <a href=\"#docs-workflows-01-discovery-and-research\">discovery</a>, <a href=\"#docs-workflows-02-product-and-ux-planning\">produto e UX</a>, <a href=\"#docs-workflows-03-technical-specification\">especificação</a>, <a href=\"#docs-workflows-04-autonomous-implementation\">implementação</a>, <a href=\"#docs-workflows-05-adversarial-validation\">validação</a>, <a href=\"#docs-workflows-06-pr-and-merge\">PR</a>, <a href=\"#docs-workflows-07-release-candidate-validation\">homologação</a>, <a href=\"#docs-workflows-08-production-release-and-observation\">produção</a>, <a href=\"#docs-workflows-09-knowledge-curation\">conhecimento</a> e <a href=\"#docs-workflows-10-continuous-improvement\">melhoria contínua</a>.</p>\n<hr>\n<h2 id=\"docs-end-to-end-journey~jornada-de-desenvolvimento\">Jornada de desenvolvimento</h2>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart TD\n    START([Necessidade, problema ou oportunidade])\n\n    subgraph PRODUCT[&quot;Produto e descoberta&quot;]\n        S0[&quot;0. Backlog e triagem&lt;br/&gt;Intake Agent + Product Manager Agent&quot;]\n        G0{{&quot;Gate automático&lt;br/&gt;contexto, owner, duplicidade e risco&quot;}}\n\n        S1[&quot;1. Discovery&lt;br/&gt;PM + UX Specification + Tech Lead&quot;]\n        G1{{&quot;Gate automático&lt;br/&gt;PB completo, evidências e riscos&quot;}}\n        H1{&quot;H1 · Vale investir?&quot;}\n\n        S2[&quot;2. Planejamento de produto&lt;br/&gt;PM + Adversarial PM&quot;]\n        G2{{&quot;Gate automático&lt;br/&gt;PRD claro, testável e rastreável&quot;}}\n        H2{&quot;H2 · É isto que construiremos?&quot;}\n    end\n\n    subgraph DESIGN[&quot;Decisão e especificação técnica&quot;]\n        S3[&quot;3. Especificação técnica&lt;br/&gt;Specification TL + Adversarial TL&quot;]\n        G3{{&quot;Gate automático&lt;br/&gt;SPEC, ADR, tarefas, riscos e trade- BS\n    S2 -. &quot;telemetria&quot; .-&gt; OBS\n    S3 -. &quot;telemetria&quot; .-&gt; OBS\n    S4 -. &quot;telemetria&quot; .-&gt; OBS\n    S5 -. &quot;telemetria&quot; .-&gt; OBS\n    S6 -. &quot;telemetria&quot; .-&gt; OBS\n    S7 -. &quot;telemetria&quot; .-&gt; OBS\n    S8 -. &quot;telemetria&quot; .-&gt; OBS\n    S9 -. &quot;telemetria&quot; .-&gt; OBS\n\n    CLOCK --&gt; S10\n    OBS --&gt; S10 --&gt; D10\n    D10 -- &quot;sim&quot; --&gt; H6 --&gt; LEARN\n    D10 -- &quot;não ou amostragem automática&quot; --&gt; LEARN\n    LEARN -- &quot;funcionou e pode ser reutilizado&quot; --&gt; MEM\n    LEARN -- &quot;deu errado ou gerou atrito&quot; --&gt; IMP\n    IMP --&gt; TYPES\n    TYPES -- &quot;nova demanda priorizável&quot; --&gt; S0\n    MEM -. &quot;contexto para o próximo ciclo&quot; .-&gt; S1\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef knowledge fill:#f3e8ff,stroke:#9333ea,color:#3b0764,stroke-width:1.5px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    classDef failure fill:#fee2e2,stroke:#dc2626,color:#450a0a,stroke-width:1.5px;\n\n    class S0,S1,S2,S3,S4,S5,S6,S7,S8 agent;\n    class G0,G1,G2,G3,D3,L4,G5,M6,G7,D8,G8,D10 automation;\n    class H1,H2,H3,H4,H5,H6 human;\n    class S9,OBS,CLOCK,S10,LEARN,MEM,IMP,TYPES knowledge;\n    class START,END terminal;\n    class ROLLBACK failure;</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart TD\n    START([Necessidade, problema ou oportunidade])\n\n    subgraph PRODUCT[&quot;Produto e descoberta&quot;]\n        S0[&quot;0. Backlog e triagem&lt;br/&gt;Intake Agent + Product Manager Agent&quot;]\n        G0{{&quot;Gate automático&lt;br/&gt;contexto, owner, duplicidade e risco&quot;}}\n\n        S1[&quot;1. go&quot; --&gt; S4\n    H4 -- &quot;ajustes de escopo&quot; --&gt; S2\n    H4 -- &quot;aprovar&quot; --&gt; M6\n    M6 --&gt; S7 --&gt; G7\n    G7 -- &quot;falhou&quot; --&gt; S4\n    G7 -- &quot;aprovado&quot; --&gt; D8\n\n    D8 -- &quot;não · R0/R1&quot; --&gt; S8\n    D8 -- &quot;sim&quot; --&gt; H5\n    H5 -- &quot;aprovar&quot; --&gt; S8\n    H5 -- &quot;revisar release&quot; --&gt; S7\n    S8 --&gt; G8\n    G8 -- &quot;regressão&quot; --&gt; ROLLBACK[&quot;Rollback ou pausa automática&quot;]\n    ROLLBACK --&gt; S4\n    G8 -- &quot;saudável&quot; --&gt; S9 --&gt; END\n\n    S0 -. &quot;telemetria&quot; .-&gt; OBS\n    S1 -. &quot;telemetria&quot; .-&gt; OBS\n    S2 -. &quot;telemetria&quot; .-&gt; OBS\n    S3 -. &quot;telemetria&quot; .-&gt; OBS\n    S4 -. &quot;telemetria&quot; .-&gt; OBS\n    S5 -. &quot;telemetria&quot; .-&gt; OBS\n    S6 -. &quot;telemetria&quot; .-&gt; OBS\n    S7 -. &quot;telemetria&quot; .-&gt; OBS\n    S8 -. &quot;telemetria&quot; .-&gt; OBS\n    S9 -. &quot;telemetria&quot; .-&gt; OBS\n\n    CLOCK --&gt; S10\n    OBS --&gt; S10 --&gt; D10\n    D10 -- &quot;sim&quot; --&gt; H6 --&gt; LEARN\n    D10 -- &quot;não ou amostragem automática&quot; --&gt; LEARN\n    LEARN -- &quot;funcionou e pode ser reutilizado&quot; --&gt; MEM\n    LEARN -- &quot;deu errado ou gerou atrito&quot; --&gt; IMP\n    IMP --&gt; TYPES\n    TYPES -- &quot;nova demanda priorizável&quot; --&gt; S0\n    MEM -. &quot;contexto para o próximo ciclo&quot; .-&gt; S1\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef knowledge fill:#f3e8ff,stroke:#9333ea,color:#3b0764,stroke-width:1.5px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    classDef failure fill:#fee2e2,stroke:#dc2626,color:#450a0a,stroke-width:1.5px;\n\n    class S0,S1,S2,S3,S4,S5,S6,S7,S8 agent;\n    class G0,G1,G2,G3,D3,L4,G5,M6,G7,D8,G8,D10 automation;\n    class H1,H2,H3,H4,H5,H6 human;\n    class S9,OBS,CLOCK,S10,LEARN,MEM,IMP,TYPES knowledge;\n    class START,END terminal;\n    class ROLLBACK failure;</code></pre></details></div>\n<hr>\n<h2 id=\"docs-end-to-end-journey~como-ler-o-fluxo\">Como ler o fluxo</h2>\n<table>\n<thead>\n<tr>\n<th>Cor</th>\n<th>Natureza do trabalho</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>🔵 Azul</td>\n<td>executado pelos Agent Teams</td>\n</tr>\n<tr>\n<td>🟢 Verde</td>\n<td>automações, gates, hooks e decisões por política</td>\n</tr>\n<tr>\n<td>🟡 Amarelo</td>\n<td>checkpoints de decisão humana</td>\n</tr>\n<tr>\n<td>🟣 Roxo</td>\n<td>conhecimento, telemetria e Auto Dream</td>\n</tr>\n<tr>\n<td>🔴 Vermelho</td>\n<td>regressão e caminho de recuperação</td>\n</tr>\n</tbody>\n</table>\n<p>Linha contínua indica fluxo de entrega; linha pontilhada, coleta ou reutilização de conhecimento. As setas de retorno importam tanto quanto as de avanço: elas mostram para onde uma falha devolve o trabalho, e é por isso que um gate frouxo em uma etapa inicial custa caro várias etapas depois.</p>\n<hr>\n<h2 id=\"docs-end-to-end-journey~intervenções-humanas\">Intervenções humanas</h2>\n<p>Os seis checkpoints existem para decisões que não podem ser delegadas — investimento, escopo, trade-off técnico excepcional, integração, exposição de risco e validação de aprendizado.</p>\n<table>\n<thead>\n<tr>\n<th>Checkpoint</th>\n<th>Pergunta</th>\n<th>Quando ocorre</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>H1</strong></td>\n<td>O problema merece investimento?</td>\n<td>após o discovery</td>\n</tr>\n<tr>\n<td><strong>H2</strong></td>\n<td>É isto que construiremos, para quem e com qual resultado?</td>\n<td>após o planejamento de produto e UX</td>\n</tr>\n<tr>\n<td><strong>H3</strong></td>\n<td>Aceitamos os trade-offs?</td>\n<td>apenas em nova ADR, exceção ou risco R3/R4</td>\n</tr>\n<tr>\n<td><strong>H4</strong></td>\n<td>Podemos integrar?</td>\n<td>conforme a classe de risco do PR</td>\n</tr>\n<tr>\n<td><strong>H5</strong></td>\n<td>Podemos expor o risco em produção?</td>\n<td>apenas em exposição crítica ou R3/R4</td>\n</tr>\n<tr>\n<td><strong>H6</strong></td>\n<td>O sistema aprendeu corretamente?</td>\n<td>semanal, ou em P0/P1, memória sensível e mudança de gate</td>\n</tr>\n</tbody>\n</table>\n<p>Note que H3 e H5 são condicionais. Em um item de baixo risco com gates verdes, o fluxo vai de H2 direto a H4 — três decisões humanas em um ciclo completo.</p>\n<hr>\n<h2 id=\"docs-end-to-end-journey~fechamento-do-ciclo\">Fechamento do ciclo</h2>\n<p>O ciclo não termina na entrega. O Knowledge Agent registra o conhecimento específico daquela entrega, e o Auto Dream analisa semanalmente o conjunto das sessões, separando o que virou aprendizado do que virou atrito.</p>\n<p>Aprendizados validados atualizam o <code>MEMORY.md</code> e passam a servir de contexto para os próximos discoveries. Falhas e atritos geram demandas rastreáveis no backlog, que podem melhorar processo, harness, skills, scripts, gates ou o próprio fluxo. O backlog então reinicia o ciclo — com conhecimento e controles melhores do que na volta anterior.</p>", "toc": [{"level": 2, "id": "docs-end-to-end-journey~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-end-to-end-journey~jornada-de-desenvolvimento", "text": "Jornada de desenvolvimento"}, {"level": 2, "id": "docs-end-to-end-journey~como-ler-o-fluxo", "text": "Como ler o fluxo"}, {"level": 2, "id": "docs-end-to-end-journey~intervenções-humanas", "text": "Intervenções humanas"}, {"level": 2, "id": "docs-end-to-end-journey~fechamento-do-ciclo", "text": "Fechamento do ciclo"}], "text": " agent team — fluxo da jornada o ciclo completo do agent team em um único diagrama: onde os agentes trabalham, onde as automações bloqueiam e onde uma pessoa precisa decidir. em 2 minutos este é o documento para ver o sistema inteiro de uma vez. o diagrama abaixo cobre as onze etapas, do registro de uma necessidade até o aprendizado que reinicia o ciclo, e usa cor para separar três naturezas de trabalho: o que agentes executam, o que automações verificam e o que exige julgamento humano. o ponto a observar na primeira leitura é a quantidade de amarelo . são apenas seis pontos de decisão humana (h1 a h6) em todo o ciclo — o resto é executado ou verificado sem intervenção. é essa proporção que o modelo tenta sustentar, e é ela que degrada primeiro quando gates são frouxos ou artefatos ficam ambíguos. para ir mais fundo documento papéis, decisões e autonomia sistema operacional do trio humano gates, risco e níveis a0–a4 modelo operacional 90/10 o que o repositório precisa ter para sustentar o fluxo repo harness o mesmo fluxo, uma fase por vez fluxos por fase o contrato de cada etapa workflows multiagente cada etapa com colaboração entre agentes tem contrato próprio: intake , discovery , produto e ux , especificação , implementação , validação , pr , homologação , produção , conhecimento e melhoria contínua . jornada de desenvolvimento − ajustado + ajustar flowchart td start([necessidade, problema ou oportunidade]) subgraph product[&quot;produto e descoberta&quot;] s0[&quot;0. backlog e triagem&lt;br/&gt;intake agent + product manager agent&quot;] g0{{&quot;gate automático&lt;br/&gt;contexto, owner, duplicidade e risco&quot;}} s1[&quot;1. discovery&lt;br/&gt;pm + ux specification + tech lead&quot;] g1{{&quot;gate automático&lt;br/&gt;pb completo, evidências e riscos&quot;}} h1{&quot;h1 · vale investir?&quot;} s2[&quot;2. planejamento de produto&lt;br/&gt;pm + adversarial pm&quot;] g2{{&quot;gate automático&lt;br/&gt;prd claro, testável e rastreável&quot;}} h2{&quot;h2 · é isto que construiremos?&quot;} end subgraph design[&quot;decisão e especificação técnica&quot;] s3[&quot;3. especificação técnica&lt;br/&gt;specification tl + adversarial tl&quot;] g3{{&quot;gate automático&lt;br/&gt;spec, adr, tarefas, riscos e trade-offs&quot;}} d3{&q ; s2 h1 -- &quot;ajustar&quot; --&gt; s1 h1 -- &quot;adiar ou encerrar&quot; --&gt; s0 s2 --&gt; g2 g2 -- &quot;aprovado&quot; --&gt; h2 g2 -- &quot;ambiguidade&quot; --&gt; s2 h2 -- &quot;aprovar&quot; --&gt; s3 h2 -- &quot;revisar produto&quot; --&gt; s2 s3 --&gt; g3 g3 -- &quot;gap técnico&quot; --&gt; s3 g3 -- &quot;aprovado&quot; --&gt; d3 d3 -- &quot;sim&quot; --&gt; h3 d3 -- &quot;não&quot; --&gt; s4 h3 -- &quot;aceitar&quot; --&gt; s4 h3 -- &quot;revisar decisão&quot; --&gt; s3 s4 --&gt; l4 l4 -- &quot;falhou&quot; --&gt; s4 l4 -- &quot;aprovado&quot; --&gt; s5 s5 --&gt; g5 g5 -- &quot;falhou&quot; --&gt; s4 g5 -- &quot;aprovado&quot; --&gt; s6 s6 --&gt; h4 h4 -- &quot;ajustes de código&quot; --&gt; s4 h4 -- &quot;ajustes de escopo&quot; --&gt; s2 h4 -- &quot;aprovar&quot; --&gt; m6 m6 --&gt; s7 --&gt; g7 g7 -- &quot;falhou&quot; --&gt; s4 g7 -- &quot;aprovado&quot; --&gt; d8 d8 -- &quot;não · r0/r1&quot; --&gt; s8 d8 -- &quot;sim&quot; --&gt; h5 h5 -- &quot;aprovar&quot; --&gt; s8 h5 -- &quot;revisar release&quot; --&gt; s7 s8 --&gt; g8 g8 -- &quot;regressão&quot; --&gt; rollback[&quot;rollback ou pausa automática&quot;] rollback --&gt; s4 g8 -- &quot;saudável&quot; --&gt; s9 --&gt; end s0 -. &quot;telemetria&quot; .-&gt; obs s1 -. &quot;telemetria&quot; .-&gt; obs s2 -. &quot;telemetria&quot; .-&gt; obs s3 -. &quot;telemetria&quot; .-&gt; obs s4 -. &quot;telemetria&quot; .-&gt; obs s5 -. &quot;telemetria&quot; .-&gt; obs s6 -. &quot;telemetria&quot; .-&gt; obs s7 -. &quot;telemetria&quot; .-&gt; obs s8 -. &quot;telemetria&quot; .-&gt; obs s9 -. &quot;telemetria&quot; .-&gt; obs clock --&gt; s10 obs --&gt; s10 --&gt; d10 d10 -- &quot;sim&quot; --&gt; h6 --&gt; learn d10 -- &quot;não ou amostragem automática&quot; --&gt; learn learn -- &quot;funcionou e pode ser reutilizado&quot; --&gt; mem learn -- &quot;deu errado ou gerou atrito&quot; --&gt; imp imp --&gt; types types -- &quot;nova demanda priorizável&quot; --&gt; s0 mem -. &quot;contexto para o próximo ciclo&quot; .-&gt; s1 classdef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px; classdef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px; classdef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px; classdef knowledge fill:#f3e8ff,stroke:#9333ea,color:#3b0764,stroke-width:1.5px; classdef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px; classdef failure fill:#fee2e2,stroke:#dc2626,color:#450a0a,stroke-width:1.5px; class s0,s1,s2,s3,s4,s5,s6,s7,s8 agent; class g0,g1,g2,g3,d3,l4,g5,m6,g7,d8,g8,d10 automation; class h1,h2,h3,h4,h5,h6 human; class s9,obs,clock,s10,learn,mem,imp,types knowledge; class start,end terminal; class rollback failure; como ler o fluxo cor natureza do trabalho 🔵 azul executado pelos agent teams 🟢 verde automações, gates, hooks e decisões por política 🟡 amarelo checkpoints de decisão humana 🟣 roxo conhecimento, telemetria e auto dream 🔴 vermelho regressão e caminho de recuperação linha contínua indica fluxo de entrega; linha pontilhada, coleta ou reutilização de conhecimento. as setas de retorno importam tanto quanto as de avanço: elas mostram para onde uma falha devolve o trabalho, e é por isso que um gate frouxo em uma etapa inicial custa caro várias etapas depois. intervenções humanas os seis checkpoints existem para decisões que não podem ser delegadas — investimento, escopo, trade-off técnico excepcional, integração, exposição de risco e validação de aprendizado. checkpoint pergunta quando ocorre h1 o problema merece investimento? após o discovery h2 é isto que construiremos, para quem e com qual resultado? após o planejamento de produto e ux h3 aceitamos os trade-offs? apenas em nova adr, exceção ou risco r3/r4 h4 podemos integrar? conforme a classe de risco do pr h5 podemos expor o risco em produção? apenas em exposição crítica ou r3/r4 h6 o sistema aprendeu corretamente? semanal, ou em p0/p1, memória sensível e mudança de gate note que h3 e h5 são condicionais. em um item de baixo risco com gates verdes, o fluxo vai de h2 direto a h4 — três decisões humanas em um ciclo completo. fechamento do ciclo o ciclo não termina na entrega. o knowledge agent registra o conhecimento específico daquela entrega, e o auto dream analisa semanalmente o conjunto das sessões, separando o que virou aprendizado do que virou atrito. aprendizados validados atualizam o memory.md e passam a servir de contexto para os próximos discoveries. falhas e atritos geram demandas rastreáveis no backlog, que podem melhorar processo, harness, skills, scripts, gates ou o próprio fluxo. o backlog então reinicia o ciclo — com conhecimento e controles melhores do que na volta anterior. "}, {"id": "docs-journey-by-phase", "path": "docs/journey-by-phase.md", "section": "Modelo operacional", "title": "Jornada por fases", "status": "reference", "updated": "2026-08-09", "html": "<h1 id=\"docs-journey-by-phase~agent-team--jornada-por-fases\">Agent Team — jornada por fases</h1>\n<blockquote>\n<p>O mesmo ciclo do <a href=\"#docs-end-to-end-journey\">fluxo completo</a>, quebrado em cinco blocos que cabem em uma tela — ou em um slide.</p>\n</blockquote>\n<h2 id=\"docs-journey-by-phase~em-2-minutos\">Em 2 minutos</h2>\n<p>O diagrama de ponta a ponta serve para ver o sistema inteiro; este documento serve para <strong>discutir uma parte de cada vez</strong>. Cada bloco traz seu escopo, seu diagrama isolado e as perguntas que costumam surgir naquela discussão.</p>\n<p>A numeração das etapas é idêntica à do fluxo completo, então os dois documentos podem ser usados juntos sem tradução mental.</p>\n<table>\n<thead>\n<tr>\n<th>Bloco</th>\n<th>Etapas</th>\n<th>Checkpoints</th>\n<th>Artefatos centrais</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-journey-by-phase~bloco-1--produto-e-descoberta\">1 — Produto e descoberta</a></td>\n<td>0–2</td>\n<td>H1, H2</td>\n<td><code>PB.md</code>, <code>PRD.md</code></td>\n</tr>\n<tr>\n<td><a href=\"#docs-journey-by-phase~bloco-2--especificação-técnica\">2 — Especificação técnica</a></td>\n<td>3</td>\n<td>H3 (condicional)</td>\n<td><code>PLAN</code>, <code>ADR</code>, <code>SPEC</code>, <code>TASKS</code>, <code>CHECKLIST</code></td>\n</tr>\n<tr>\n<td><a href=\"#docs-journey-by-phase~bloco-3--construção-e-validação\">3 — Construção e validação</a></td>\n<td>4–5</td>\n<td>nenhum (só exceção)</td>\n<td>mudança pronta para PR</td>\n</tr>\n<tr>\n<td><a href=\"#docs-journey-by-phase~bloco-4--integração-e-entrega\">4 — Integração e entrega</a></td>\n<td>6–8</td>\n<td>H4, H5</td>\n<td>PR, release candidate, release</td>\n</tr>\n<tr>\n<td><a href=\"#docs-journey-by-phase~bloco-5--conhecimento-e-melhoria-contínua\">5 — Conhecimento e melhoria</a></td>\n<td>9–10</td>\n<td>H6 (condicional)</td>\n<td><code>MEMORY.md</code>, demandas de melhoria</td>\n</tr>\n</tbody>\n</table>\n<p>Os contratos de interação entre os agentes estão no <a href=\"#docs-workflows-readme\">mapa de workflows</a>.</p>\n<hr>\n<h2 id=\"docs-journey-by-phase~mapa-dos-blocos\">Mapa dos blocos</h2>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    P1[&quot;Bloco 1&lt;br/&gt;Produto e descoberta&lt;br/&gt;Etapas 0–2&quot;]\n    P2[&quot;Bloco 2&lt;br/&gt;Especificação técnica&lt;br/&gt;Etapa 3&quot;]\n    P3[&quot;Bloco 3&lt;br/&gt;Construção e validação&lt;br/&gt;Etapas 4–5&quot;]\n    P4[&quot;Bloco 4&lt;br/&gt;Integração e entrega&lt;br/&gt;Etapas 6–8&quot;]\n    P5[&quot;Bloco 5&lt;br/&gt;Conhecimento e melhoria&lt;br/&gt;Etapas 9–10&quot;]\n\n    P1 --&gt; P2 --&gt; P3 --&gt; P4 --&gt; P5\n    P5 -. &quot;melhorias retornam ao backlog&quot; .-&gt; P1\n\n    classDef phase fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    class P1,P2,P3,P4,P5 phase;</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    P1[&quot;Bloco 1&lt;br/&gt;Produto e descoberta&lt;br/&gt;Etapas 0–2&quot;]\n    P2[&quot;Bloco 2&lt;br/&gt;Especificação técnica&lt;br/&gt;Etapa 3&quot;]\n    P3[&quot;Bloco 3&lt;br/&gt;Construção e validação&lt;br/&gt;Etapas 4–5&quot;]\n    P4[&quot;Bloco 4&lt;br/&gt;Integração e entrega&lt;br/&gt;Etapas 6–8&quot;]\n    P5[&quot;Bloco 5&lt;br/&gt;Conhecimento e melhoria&lt;br/&gt;Etapas 9–10&quot;]\n\n    P1 --&gt; P2 --&gt; P3 --&gt; P4 --&gt; P5\n    P5 -. &quot;melhorias retornam ao backlog&quot; .-&gt; P1\n\n    classDef phase fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    class P1,P2,P3,P4,P5 phase;</code></pre></details></div>\n<hr>\n<h2 id=\"docs-journey-by-phase~bloco-1--produto-e-descoberta\">Bloco 1 — produto e descoberta</h2>\n<p>Do registro de uma necessidade até a aprovação do que será construído. É o bloco onde mais evidência é produzida e onde um erro custa menos para corrigir.</p>\n<table>\n<thead>\n<tr>\n<th>Escopo</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Workflows</strong></td>\n<td><a href=\"#docs-workflows-00-intake-and-triage\">intake</a>, <a href=\"#docs-workflows-01-discovery-and-research\">discovery e research</a>, <a href=\"#docs-workflows-02-product-and-ux-planning\">planejamento de produto e UX</a></td>\n</tr>\n<tr>\n<td><strong>Etapas</strong></td>\n<td>0 backlog e triagem · 1 discovery multiagente · 2 planejamento de produto</td>\n</tr>\n<tr>\n<td><strong>Checkpoints</strong></td>\n<td>H1 e H2</td>\n</tr>\n<tr>\n<td><strong>Artefatos</strong></td>\n<td><code>PB.md</code> e <code>PRD.md</code></td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    IN([Problema ou oportunidade])\n\n    S0[&quot;0. Backlog e triagem&lt;br/&gt;Intake + PM Agents&quot;]\n    G0{{&quot;Gate&lt;br/&gt;contexto, owner, duplicidade e risco&quot;}}\n\n    S1[&quot;1. Discovery&lt;br/&gt;PM + UX Spec + Tech Lead&quot;]\n    G1{{&quot;Gate&lt;br/&gt;problema, usuário, experiência e viabilidade&quot;}}\n    H1{&quot;H1 · Vale investir?&quot;}\n\n    S2[&quot;2. Planejamento&lt;br/&gt;PM + Adversarial PM&quot;]\n    G2{{&quot;Gate&lt;br/&gt;clareza, aceite, escopo e métricas&quot;}}\n    H2{&quot;H2 · É isto que&lt;br/&gt;construiremos?&quot;}\n\n    OUT([PRD aprovado])\n\n    IN --&gt; S0 --&gt; G0\n    G0 -- &quot;incompleto&quot; --&gt; S0\n    G0 -- &quot;aprovado&quot; --&gt; S1 --&gt; G1\n    G1 -- &quot;gap&quot; --&gt; S1\n    G1 -- &quot;aprovado&quot; --&gt; H1\n    H1 -- &quot;ajustar&quot; --&gt; S1\n    H1 -- &quot;adiar&quot; --&gt; S0\n    H1 -- &quot;avançar&quot; --&gt; S2 --&gt; G2\n    G2 -- &quot;ambiguidade&quot; --&gt; S2\n    G2 -- &quot;aprovado&quot; --&gt; H2\n    H2 -- &quot;revisar&quot; --&gt; S2\n    H2 -- &quot;aprovar&quot; --&gt; OUT\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    class S0,S1,S2 agent;\n    class G0,G1,G2 automation;\n    class H1,H2 human;\n    class IN,OUT terminal;</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    IN([Problema ou oportunidade])\n\n    S0[&quot;0. Backlog e triagem&lt;br/&gt;Intake + PM Agents&quot;]\n    G0{{&quot;Gate&lt;br/&gt;contexto, owner, duplicidade e risco&quot;}}\n\n    S1[&quot;1. Discovery&lt;br/&gt;PM + UX Spec + Tech Lead&quot;]\n    G1{{&quot;Gate&lt;br/&gt;problema, usuário, experiência e viabilidade&quot;}}\n    H1{&quot;H1 · Vale investir?&quot;}\n\n    S2[&quot;2. Planejamento&lt;br/&gt;PM + Adversarial PM&quot;]\n    G2{{&quot;Gate&lt;br/&gt;clareza, aceite, escopo e métricas&quot;}}\n    H2{&quot;H2 · É isto que&lt;br/&gt;construiremos?&quot;}\n\n    OUT([PRD aprovado])\n\n    IN --&gt; S0 --&gt; G0\n    G0 -- &quot;incompleto&quot; --&gt; S0\n    G0 -- &quot;aprovado&quot; --&gt; S1 --&gt; G1\n    G1 -- &quot;gap&quot; --&gt; S1\n    G1 -- &quot;aprovado&quot; --&gt; H1\n    H1 -- &quot;ajustar&quot; --&gt; S1\n    H1 -- &quot;adiar&quot; --&gt; S0\n    H1 -- &quot;avançar&quot; --&gt; S2 --&gt; G2\n    G2 -- &quot;ambiguidade&quot; --&gt; S2\n    G2 -- &quot;aprovado&quot; --&gt; H2\n    H2 -- &quot;revisar&quot; --&gt; S2\n    H2 -- &quot;aprovar&quot; --&gt; OUT\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    class S0,S1,S2 agent;\n    class G0,G1,G2 automation;\n    class H1,H2 human;\n    class IN,OUT terminal;</code></pre></details></div>\n<h3 id=\"docs-journey-by-phase~foco-da-discussão\">Foco da discussão</h3>\n<ul>\n<li>O problema está claro antes de discutir solução?</li>\n<li>Usuário, experiência e viabilidade foram analisados juntos?</li>\n<li>O adversarial PM encontrou ambiguidades reais?</li>\n<li>Os humanos decidiram valor e escopo, não detalhes operacionais?</li>\n</ul>\n<hr>\n<h2 id=\"docs-journey-by-phase~bloco-2--especificação-técnica\">Bloco 2 — especificação técnica</h2>\n<p>Transforma produto e UX aprovados em uma estratégia técnica executável, criticada antes de virar tarefa. H3 só é acionado por exceção — em fluxo normal, este bloco vai direto para a implementação.</p>\n<table>\n<thead>\n<tr>\n<th>Escopo</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Workflow</strong></td>\n<td><a href=\"#docs-workflows-03-technical-specification\">especificação técnica</a></td>\n</tr>\n<tr>\n<td><strong>Etapa</strong></td>\n<td>3 especificação e crítica técnica</td>\n</tr>\n<tr>\n<td><strong>Checkpoint</strong></td>\n<td>H3, condicional</td>\n</tr>\n<tr>\n<td><strong>Artefatos</strong></td>\n<td><code>PLAN.md</code>, <code>ADR.md</code>, <code>SPEC.md</code>, <code>TASKS.md</code>, <code>CHECKLIST.md</code></td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    IN([PRD aprovado])\n    S3[&quot;3. Especificação técnica&lt;br/&gt;Specification TL&quot;]\n    ADV[&quot;Crítica técnica&lt;br/&gt;Adversarial TL&quot;]\n    G3{{&quot;Gate&lt;br/&gt;rastreabilidade, riscos, tarefas e trade-offs&quot;}}\n    RISK{&quot;Nova ADR, exceção&lt;br/&gt;ou risco R3/R4?&quot;}\n    H3{&quot;H3 · Aceitamos&lt;br/&gt;os trade-offs?&quot;}\n    OUT([Especificação executável])\n\n    IN --&gt; S3 --&gt; ADV --&gt; G3\n    G3 -- &quot;gap&quot; --&gt; S3\n    G3 -- &quot;aprovado&quot; --&gt; RISK\n    RISK -- &quot;não&quot; --&gt; OUT\n    RISK -- &quot;sim&quot; --&gt; H3\n    H3 -- &quot;revisar&quot; --&gt; S3\n    H3 -- &quot;aceitar&quot; --&gt; OUT\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    class S3,ADV agent;\n    class G3,RISK automation;\n    class H3 human;\n    class IN,OUT terminal;</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    IN([PRD aprovado])\n    S3[&quot;3. Especificação técnica&lt;br/&gt;Specification TL&quot;]\n    ADV[&quot;Crítica técnica&lt;br/&gt;Adversarial TL&quot;]\n    G3{{&quot;Gate&lt;br/&gt;rastreabilidade, riscos, tarefas e trade-offs&quot;}}\n    RISK{&quot;Nova ADR, exceção&lt;br/&gt;ou risco R3/R4?&quot;}\n    H3{&quot;H3 · Aceitamos&lt;br/&gt;os trade-offs?&quot;}\n    OUT([Especificação executável])\n\n    IN --&gt; S3 --&gt; ADV --&gt; G3\n    G3 -- &quot;gap&quot; --&gt; S3\n    G3 -- &quot;aprovado&quot; --&gt; RISK\n    RISK -- &quot;não&quot; --&gt; OUT\n    RISK -- &quot;sim&quot; --&gt; H3\n    H3 -- &quot;revisar&quot; --&gt; S3\n    H3 -- &quot;aceitar&quot; --&gt; OUT\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    class S3,ADV agent;\n    class G3,RISK automation;\n    class H3 human;\n    class IN,OUT terminal;</code></pre></details></div>\n<h3 id=\"docs-journey-by-phase~foco-da-discussão_1\">Foco da discussão</h3>\n<ul>\n<li>A solução responde ao PRD sem ampliar o escopo?</li>\n<li>Alternativas e trade-offs foram registrados?</li>\n<li>As tarefas podem ser implementadas e validadas isoladamente?</li>\n<li>H3 está reservado a decisões realmente estruturais ou arriscadas?</li>\n</ul>\n<hr>\n<h2 id=\"docs-journey-by-phase~bloco-3--construção-e-validação\">Bloco 3 — construção e validação</h2>\n<p>O bloco mais autônomo do ciclo: em fluxo saudável, nenhuma pessoa é acionada entre a tarefa aprovada e o PR. Gates locais e CI é que decidem se o trabalho avança.</p>\n<table>\n<thead>\n<tr>\n<th>Escopo</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Workflows</strong></td>\n<td><a href=\"#docs-workflows-04-autonomous-implementation\">implementação autônoma</a>, <a href=\"#docs-workflows-05-adversarial-validation\">validação adversarial</a></td>\n</tr>\n<tr>\n<td><strong>Etapas</strong></td>\n<td>4 implementação autônoma · 5 validação adversarial</td>\n</tr>\n<tr>\n<td><strong>Checkpoints</strong></td>\n<td>nenhum; intervenção humana somente por exceção</td>\n</tr>\n<tr>\n<td><strong>Saída</strong></td>\n<td>mudança pronta para PR</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    IN([Tarefa elegível])\n    S4[&quot;4. Implementação&lt;br/&gt;Orchestrator + Engineer Agents&quot;]\n    LOCAL{{&quot;Hooks locais&lt;br/&gt;pre-commit + pre-push&quot;}}\n    S5[&quot;5. Validação adversarial&lt;br/&gt;QA + Security + Architecture&quot;]\n    CI{{&quot;CI fast + deep lanes&lt;br/&gt;checks conforme risco&quot;}}\n    HUMAN[&quot;Escalonar com&lt;br/&gt;evidências e contexto&quot;]\n    OUT([Mudança pronta para PR])\n\n    IN --&gt; S4 --&gt; LOCAL\n    LOCAL -- &quot;falhou&quot; --&gt; S4\n    LOCAL -- &quot;aprovado&quot; --&gt; S5 --&gt; CI\n    CI -- &quot;falhou e corrigível&quot; --&gt; S4\n    CI -- &quot;falhou repetidamente&quot; --&gt; HUMAN\n    HUMAN -- &quot;decisão&quot; --&gt; S4\n    CI -- &quot;aprovado&quot; --&gt; OUT\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    class S4,S5 agent;\n    class LOCAL,CI automation;\n    class HUMAN human;\n    class IN,OUT terminal;</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    IN([Tarefa elegível])\n    S4[&quot;4. Implementação&lt;br/&gt;Orchestrator + Engineer Agents&quot;]\n    LOCAL{{&quot;Hooks locais&lt;br/&gt;pre-commit + pre-push&quot;}}\n    S5[&quot;5. Validação adversarial&lt;br/&gt;QA + Security + Architecture&quot;]\n    CI{{&quot;CI fast + deep lanes&lt;br/&gt;checks conforme risco&quot;}}\n    HUMAN[&quot;Escalonar com&lt;br/&gt;evidências e contexto&quot;]\n    OUT([Mudança pronta para PR])\n\n    IN --&gt; S4 --&gt; LOCAL\n    LOCAL -- &quot;falhou&quot; --&gt; S4\n    LOCAL -- &quot;aprovado&quot; --&gt; S5 --&gt; CI\n    CI -- &quot;falhou e corrigível&quot; --&gt; S4\n    CI -- &quot;falhou repetidamente&quot; --&gt; HUMAN\n    HUMAN -- &quot;decisão&quot; --&gt; S4\n    CI -- &quot;aprovado&quot; --&gt; OUT\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    class S4,S5 agent;\n    class LOCAL,CI automation;\n    class HUMAN human;\n    class IN,OUT terminal;</code></pre></details></div>\n<h3 id=\"docs-journey-by-phase~foco-da-discussão_2\">Foco da discussão</h3>\n<ul>\n<li>Quais falhas podem ser corrigidas automaticamente?</li>\n<li>Quais checks pertencem ao hook local ou à CI?</li>\n<li>A deep lane é acionada por risco e paths alterados?</li>\n<li>O escalonamento entrega uma decisão objetiva ao humano?</li>\n</ul>\n<hr>\n<h2 id=\"docs-journey-by-phase~bloco-4--integração-e-entrega\">Bloco 4 — integração e entrega</h2>\n<p>Do PR à observação em produção. É onde a classe de risco pesa mais: R0 atravessa o bloco quase sem parada, R4 exige dupla aprovação e acompanhamento humano.</p>\n<table>\n<thead>\n<tr>\n<th>Escopo</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Workflows</strong></td>\n<td><a href=\"#docs-workflows-06-pr-and-merge\">PR e merge</a>, <a href=\"#docs-workflows-07-release-candidate-validation\">homologação</a>, <a href=\"#docs-workflows-08-production-release-and-observation\">produção e observação</a></td>\n</tr>\n<tr>\n<td><strong>Etapas</strong></td>\n<td>6 PR e decisão de merge · 7 homologação automatizada · 8 produção e observação inicial</td>\n</tr>\n<tr>\n<td><strong>Checkpoints</strong></td>\n<td>H4 e H5</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    IN([Mudança validada])\n    S6[&quot;6. PR + evidence pack&lt;br/&gt;PR + Reviewer Agents&quot;]\n    H4{&quot;H4 · Podemos integrar?&quot;}\n    MERGE[&quot;Merge protegido&lt;br/&gt;checks + approvals&quot;]\n    S7[&quot;7. Homologação&lt;br/&gt;preview + E2E + evidências&quot;]\n    G7{{&quot;Gate&lt;br/&gt;release candidate aprovado&quot;}}\n    RISK{&quot;Política exige&lt;br/&gt;aprovação de produção?&quot;}\n    H5{&quot;H5 · Podemos expor&lt;br/&gt;o risco?&quot;}\n    S8[&quot;8. Produção&lt;br/&gt;rollout progressivo&quot;]\n    HEALTH{{&quot;Gate pós-deploy&lt;br/&gt;SLOs + métricas&quot;}}\n    BACK[&quot;Rollback ou&lt;br/&gt;pausa automática&quot;]\n    REWORK([Retorno à etapa 4])\n    OUT([Entrega saudável])\n\n    IN --&gt; S6 --&gt; H4\n    H4 -- &quot;ajustar&quot; --&gt; REWORK\n    H4 -- &quot;aprovar&quot; --&gt; MERGE --&gt; S7 --&gt; G7\n    G7 -- &quot;falhou&quot; --&gt; REWORK\n    G7 -- &quot;aprovado&quot; --&gt; RISK\n    RISK -- &quot;não&quot; --&gt; S8\n    RISK -- &quot;sim · R3/R4&quot; --&gt; H5\n    H5 -- &quot;revisar&quot; --&gt; S7\n    H5 -- &quot;aprovar&quot; --&gt; S8\n    S8 --&gt; HEALTH\n    HEALTH -- &quot;regressão&quot; --&gt; BACK\n    BACK --&gt; REWORK\n    HEALTH -- &quot;saudável&quot; --&gt; OUT\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    classDef failure fill:#fee2e2,stroke:#dc2626,color:#450a0a,stroke-width:1.5px;\n    class S6,S7,S8 agent;\n    class MERGE,G7,RISK,HEALTH automation;\n    class H4,H5 human;\n    class IN,REWORK,OUT terminal;\n    class BACK failure;</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    IN([Mudança validada])\n    S6[&quot;6. PR + evidence pack&lt;br/&gt;PR + Reviewer Agents&quot;]\n    H4{&quot;H4 · Podemos integrar?&quot;}\n    MERGE[&quot;Merge protegido&lt;br/&gt;checks + approvals&quot;]\n    S7[&quot;7. Homologação&lt;br/&gt;preview + E2E + evidências&quot;]\n    G7{{&quot;Gate&lt;br/&gt;release candidate aprovado&quot;}}\n    RISK{&quot;Política exige&lt;br/&gt;aprovação de produção?&quot;}\n    H5{&quot;H5 · Podemos expor&lt;br/&gt;o risco?&quot;}\n    S8[&quot;8. Produção&lt;br/&gt;rollout progressivo&quot;]\n    HEALTH{{&quot;Gate pós-deploy&lt;br/&gt;SLOs + métricas&quot;}}\n    BACK[&quot;Rollback ou&lt;br/&gt;pausa automática&quot;]\n    REWORK([Retorno à etapa 4])\n    OUT([Entrega saudável])\n\n    IN --&gt; S6 --&gt; H4\n    H4 -- &quot;ajustar&quot; --&gt; REWORK\n    H4 -- &quot;aprovar&quot; --&gt; MERGE --&gt; S7 --&gt; G7\n    G7 -- &quot;falhou&quot; --&gt; REWORK\n    G7 -- &quot;aprovado&quot; --&gt; RISK\n    RISK -- &quot;não&quot; --&gt; S8\n    RISK -- &quot;sim · R3/R4&quot; --&gt; H5\n    H5 -- &quot;revisar&quot; --&gt; S7\n    H5 -- &quot;aprovar&quot; --&gt; S8\n    S8 --&gt; HEALTH\n    HEALTH -- &quot;regressão&quot; --&gt; BACK\n    BACK --&gt; REWORK\n    HEALTH -- &quot;saudável&quot; --&gt; OUT\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    classDef failure fill:#fee2e2,stroke:#dc2626,color:#450a0a,stroke-width:1.5px;\n    class S6,S7,S8 agent;\n    class MERGE,G7,RISK,HEALTH automation;\n    class H4,H5 human;\n    class IN,REWORK,OUT terminal;\n    class BACK failure;</code></pre></details></div>\n<h3 id=\"docs-journey-by-phase~foco-da-discussão_3\">Foco da discussão</h3>\n<ul>\n<li>O evidence pack permite review sem ler todo o diff?</li>\n<li>H4 varia corretamente conforme a classe de risco?</li>\n<li>A homologação comprova critérios de aceite?</li>\n<li>Deploy e rollback foram automatizados antes de reduzir H5?</li>\n</ul>\n<hr>\n<h2 id=\"docs-journey-by-phase~bloco-5--conhecimento-e-melhoria-contínua\">Bloco 5 — conhecimento e melhoria contínua</h2>\n<p>O bloco que fecha o ciclo sobre o próprio sistema: registra o que a entrega ensinou e converte atrito recorrente em demanda priorizável.</p>\n<table>\n<thead>\n<tr>\n<th>Escopo</th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Workflows</strong></td>\n<td><a href=\"#docs-workflows-09-knowledge-curation\">curadoria de conhecimento</a>, <a href=\"#docs-workflows-10-continuous-improvement\">telemetria e melhoria contínua</a></td>\n</tr>\n<tr>\n<td><strong>Etapas</strong></td>\n<td>9 conhecimento específico da entrega · 10 Auto Dream semanal</td>\n</tr>\n<tr>\n<td><strong>Checkpoint</strong></td>\n<td>H6, condicional ou por amostragem</td>\n</tr>\n<tr>\n<td><strong>Saídas</strong></td>\n<td><code>MEMORY.md</code> e demandas de melhoria</td>\n</tr>\n</tbody>\n</table>\n<div class=\"mermaid-wrap\"><div class=\"mermaid-tools\"><button type=\"button\" data-zoom=\"out\" title=\"reduzir\">−</button><span data-zoom-label>ajustado</span><button type=\"button\" data-zoom=\"in\" title=\"ampliar\">+</button><button type=\"button\" data-zoom=\"fit\" title=\"ajustar à largura\">ajustar</button></div><pre class=\"mermaid\">flowchart LR\n    IN([Entrega e sessões concluídas])\n    S9[&quot;9. Conhecimento da entrega&lt;br/&gt;Knowledge Agent&quot;]\n    OBS[&quot;Sessões + feedback + gates&lt;br/&gt;falhas + retries + métricas&quot;]\n    WEEK([Agenda semanal])\n    S10[&quot;10. Auto Dream&lt;br/&gt;análise do sistema de trabalho&quot;]\n    CRITIC[&quot;Critic Agent&lt;br/&gt;confirma ou contesta conclusões&quot;]\n    SENSITIVE{&quot;Memória sensível, P0/P1&lt;br/&gt;ou mudança de gate?&quot;}\n    H6{&quot;H6 · O sistema aprendeu&lt;br/&gt;corretamente?&quot;}\n    TYPE{&quot;Resultado analisado&quot;}\n    MEMORY[&quot;Aprendizado validado&lt;br/&gt;atualizar MEMORY.md&quot;]\n    DEMAND[&quot;Falha ou atrito&lt;br/&gt;gerar demanda no backlog&quot;]\n    BACKLOG([Próximo ciclo])\n\n    IN --&gt; S9 --&gt; OBS\n    IN --&gt; OBS\n    WEEK --&gt; S10\n    OBS --&gt; S10 --&gt; CRITIC --&gt; SENSITIVE\n    SENSITIVE -- &quot;sim&quot; --&gt; H6\n    SENSITIVE -- &quot;não ou amostragem&quot; --&gt; TYPE\n    H6 -- &quot;aprovar&quot; --&gt; TYPE\n    H6 -- &quot;mais evidências&quot; --&gt; S10\n    TYPE -- &quot;funcionou&quot; --&gt; MEMORY\n    TYPE -- &quot;deu errado&quot; --&gt; DEMAND\n    MEMORY -. &quot;contexto reutilizável&quot; .-&gt; BACKLOG\n    DEMAND -- &quot;melhoria priorizável&quot; --&gt; BACKLOG\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef knowledge fill:#f3e8ff,stroke:#9333ea,color:#3b0764,stroke-width:1.5px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    class S9,S10,CRITIC agent;\n    class SENSITIVE,TYPE automation;\n    class H6 human;\n    class OBS,WEEK,MEMORY,DEMAND knowledge;\n    class IN,BACKLOG terminal;</pre><details class=\"mermaid-src\"><summary>ver código do diagrama</summary><pre><code>flowchart LR\n    IN([Entrega e sessões concluídas])\n    S9[&quot;9. Conhecimento da entrega&lt;br/&gt;Knowledge Agent&quot;]\n    OBS[&quot;Sessões + feedback + gates&lt;br/&gt;falhas + retries + métricas&quot;]\n    WEEK([Agenda semanal])\n    S10[&quot;10. Auto Dream&lt;br/&gt;análise do sistema de trabalho&quot;]\n    CRITIC[&quot;Critic Agent&lt;br/&gt;confirma ou contesta conclusões&quot;]\n    SENSITIVE{&quot;Memória sensível, P0/P1&lt;br/&gt;ou mudança de gate?&quot;}\n    H6{&quot;H6 · O sistema aprendeu&lt;br/&gt;corretamente?&quot;}\n    TYPE{&quot;Resultado analisado&quot;}\n    MEMORY[&quot;Aprendizado validado&lt;br/&gt;atualizar MEMORY.md&quot;]\n    DEMAND[&quot;Falha ou atrito&lt;br/&gt;gerar demanda no backlog&quot;]\n    BACKLOG([Próximo ciclo])\n\n    IN --&gt; S9 --&gt; OBS\n    IN --&gt; OBS\n    WEEK --&gt; S10\n    OBS --&gt; S10 --&gt; CRITIC --&gt; SENSITIVE\n    SENSITIVE -- &quot;sim&quot; --&gt; H6\n    SENSITIVE -- &quot;não ou amostragem&quot; --&gt; TYPE\n    H6 -- &quot;aprovar&quot; --&gt; TYPE\n    H6 -- &quot;mais evidências&quot; --&gt; S10\n    TYPE -- &quot;funcionou&quot; --&gt; MEMORY\n    TYPE -- &quot;deu errado&quot; --&gt; DEMAND\n    MEMORY -. &quot;contexto reutilizável&quot; .-&gt; BACKLOG\n    DEMAND -- &quot;melhoria priorizável&quot; --&gt; BACKLOG\n\n    classDef agent fill:#dbeafe,stroke:#2563eb,color:#172554,stroke-width:1.5px;\n    classDef automation fill:#dcfce7,stroke:#16a34a,color:#052e16,stroke-width:1.5px;\n    classDef human fill:#fef3c7,stroke:#d97706,color:#451a03,stroke-width:2px;\n    classDef knowledge fill:#f3e8ff,stroke:#9333ea,color:#3b0764,stroke-width:1.5px;\n    classDef terminal fill:#f1f5f9,stroke:#475569,color:#0f172a,stroke-width:1.5px;\n    class S9,S10,CRITIC agent;\n    class SENSITIVE,TYPE automation;\n    class H6 human;\n    class OBS,WEEK,MEMORY,DEMAND knowledge;\n    class IN,BACKLOG terminal;</code></pre></details></div>\n<h3 id=\"docs-journey-by-phase~foco-da-discussão_4\">Foco da discussão</h3>\n<ul>\n<li>O aprendizado possui evidência e contexto de aplicação?</li>\n<li>O Critic Agent é independente de quem gerou a conclusão?</li>\n<li>Problemas recorrentes viram demandas acionáveis?</li>\n<li>H6 protege somente mudanças sensíveis sem virar gargalo?</li>\n<li>As melhorias retornam efetivamente ao backlog?</li>\n</ul>\n<hr>\n<h2 id=\"docs-journey-by-phase~legenda-comum\">Legenda comum</h2>\n<table>\n<thead>\n<tr>\n<th>Cor</th>\n<th>Significa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>🔵 Azul</td>\n<td>Agent Teams e agentes especializados</td>\n</tr>\n<tr>\n<td>🟢 Verde</td>\n<td>automações, gates, hooks e decisões por política</td>\n</tr>\n<tr>\n<td>🟡 Amarelo</td>\n<td>decisão ou intervenção humana</td>\n</tr>\n<tr>\n<td>🟣 Roxo</td>\n<td>conhecimento, telemetria e melhoria contínua</td>\n</tr>\n<tr>\n<td>🔴 Vermelho</td>\n<td>recuperação ou rollback</td>\n</tr>\n<tr>\n<td>⚪ Cinza</td>\n<td>entrada ou saída do bloco</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"docs-journey-by-phase~uso-sugerido\">Uso sugerido</h2>\n<p>Para apresentar a jornada completa, comece pelo mapa dos blocos e depois use um bloco por slide. A ordem que funciona melhor em discussão é falar primeiro dos objetivos e das decisões humanas de cada bloco, e só depois detalhar agentes, automações e gates — quem escuta precisa entender o porquê antes do mecanismo.</p>\n<p>Mantenha a numeração alinhada ao <a href=\"#docs-end-to-end-journey\">fluxo completo</a>: é o que permite alternar entre os dois documentos sem reexplicar o contexto.</p>", "toc": [{"level": 2, "id": "docs-journey-by-phase~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-journey-by-phase~mapa-dos-blocos", "text": "Mapa dos blocos"}, {"level": 2, "id": "docs-journey-by-phase~bloco-1--produto-e-descoberta", "text": "Bloco 1 — produto e descoberta"}, {"level": 3, "id": "docs-journey-by-phase~foco-da-discussão", "text": "Foco da discussão"}, {"level": 2, "id": "docs-journey-by-phase~bloco-2--especificação-técnica", "text": "Bloco 2 — especificação técnica"}, {"level": 3, "id": "docs-journey-by-phase~foco-da-discussão_1", "text": "Foco da discussão"}, {"level": 2, "id": "docs-journey-by-phase~bloco-3--construção-e-validação", "text": "Bloco 3 — construção e validação"}, {"level": 3, "id": "docs-journey-by-phase~foco-da-discussão_2", "text": "Foco da discussão"}, {"level": 2, "id": "docs-journey-by-phase~bloco-4--integração-e-entrega", "text": "Bloco 4 — integração e entrega"}, {"level": 3, "id": "docs-journey-by-phase~foco-da-discussão_3", "text": "Foco da discussão"}, {"level": 2, "id": "docs-journey-by-phase~bloco-5--conhecimento-e-melhoria-contínua", "text": "Bloco 5 — conhecimento e melhoria contínua"}, {"level": 3, "id": "docs-journey-by-phase~foco-da-discussão_4", "text": "Foco da discussão"}, {"level": 2, "id": "docs-journey-by-phase~legenda-comum", "text": "Legenda comum"}, {"level": 2, "id": "docs-journey-by-phase~uso-sugerido", "text": "Uso sugerido"}], "text": " agent team — jornada por fases o mesmo ciclo do fluxo completo , quebrado em cinco blocos que cabem em uma tela — ou em um slide. em 2 minutos o diagrama de ponta a ponta serve para ver o sistema inteiro; este documento serve para discutir uma parte de cada vez . cada bloco traz seu escopo, seu diagrama isolado e as perguntas que costumam surgir naquela discussão. a numeração das etapas é idêntica à do fluxo completo, então os dois documentos podem
