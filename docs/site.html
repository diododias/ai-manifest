oqueiam sprint planning.</li>\n<li>Recomendações prioritárias.</li>\n</ul>\n<h2 id=\"skills-review-cross-prd-spec-skill~convenções\">Convenções</h2>\n<ul>\n<li>Relatório é read-only — não modifica PRD nem SPEC.</li>\n<li>Conflitos são sempre reportados — nunca resolvidos silenciosamente.</li>\n<li>Português.</li>\n</ul>\n<h2 id=\"skills-review-cross-prd-spec-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] <code>review-cross.md</code> gerado em <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/</code></li>\n<li>[ ] Cobertura PRD → SPEC documentada (histórias, RN, SC)</li>\n<li>[ ] Conflitos detectados e classificados</li>\n<li>[ ] Recomendações e próximos passos reportados</li>\n</ul>", "toc": [{"level": 2, "id": "skills-review-cross-prd-spec-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-review-cross-prd-spec-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-review-cross-prd-spec-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-review-cross-prd-spec-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-review-cross-prd-spec-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-review-cross-prd-spec-skill~1-localizar-a-feature", "text": "1. Localizar a feature"}, {"level": 3, "id": "skills-review-cross-prd-spec-skill~2-carregar-artefatos", "text": "2. Carregar artefatos"}, {"level": 3, "id": "skills-review-cross-prd-spec-skill~3-revisão-cruzada", "text": "3. Revisão cruzada"}, {"level": 3, "id": "skills-review-cross-prd-spec-skill~4-gerar-relatório", "text": "4. Gerar relatório"}, {"level": 3, "id": "skills-review-cross-prd-spec-skill~5-reportar-no-chat", "text": "5. Reportar no chat"}, {"level": 2, "id": "skills-review-cross-prd-spec-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-review-cross-prd-spec-skill~done-when", "text": "Done When"}], "text": " review-cross-prd-spec compara prd e spec, identificando cobertura, conflitos e decisões p uma task, do planejamento à entrega\nlocal. Trate criação de issue, commit, push, PR, merge e limpeza de worktree\ncomo ações separadas, executadas apenas quando autorizadas pelo usuário.</p>\n<h2 id=\"skills-dev-flow-skill~objetivo\">Objetivo</h2>\n<p>Garantir que cada tarefa siga o fluxo:</p>\n<ol>\n<li>PLAN</li>\n<li>TRACKING (se solicitado)</li>\n<li>IMPLEMENT</li>\n<li>TEST</li>\n<li>COMMIT (se autorizado)</li>\n<li>PROPOR PUBLICAÇÃO</li>\n<li>PR / MERGE (se autorizado)</li>\n<li>ENCERRAR COM SEGURANÇA</li>\n<li>PRÓXIMA TASK</li>\n</ol>\n<h2 id=\"skills-dev-flow-skill~uso\">Uso</h2>\n<p>Quando iniciar uma task, siga estes passos em ordem e confirme cada etapa antes\nde passar à seguinte. A convenção local do repositório prevalece sobre exemplos\nde branch, CI ou issue abaixo.</p>\n<h2 id=\"skills-dev-flow-skill~segurança-e-contrato-de-artefatos\">Segurança e contrato de artefatos</h2>\n<p>Siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>. Antes de\nqualquer efeito externo, apresente o alvo e peça autorização explícita:\ncriar/editar issue, commit, push, abrir/editar PR, aplicar labels, mergear,\nfechar issue ou remover worktree. Nunca descarte, faça stash ou remova mudanças\ndo usuário para deixar a árvore limpa.</p>\n<h3 id=\"skills-dev-flow-skill~1-plan\">1. PLAN</h3>\n<ul>\n<li>Leia a task e entenda o escopo, critério de aceitação e restrições.</li>\n<li>Identifique dependências e possíveis impactos nos módulos/backend/storefront.</li>\n<li>Defina o que deve ser feito em um checklist pequeno.</li>\n<li>Escolha/valide o branch name correto se ainda não existir.</li>\n</ul>\n<h3 id=\"skills-dev-flow-skill~2-tracking-se-solicitado\">2. TRACKING (se solicitado)</h3>\n<ul>\n<li>Se a demanda já tem issue, use-a como referência.</li>\n<li>Se o usuário pedir rastreamento, proponha uma issue com título e corpo antes de criá-la.</li>\n<li>Use <code>gh issue create</code> com título objetivo e corpo contendo:</li>\n<li><strong>Contexto</strong>: o \"porquê\" da demanda.</li>\n<li><strong>Escopo</strong>: checklist <code>- [ ]</code> com cada entregável (permite fechamento parcial visível).</li>\n<li><strong>Critério de aceitação</strong>: como validar.</li>\n<li>Capture o número da issue (<code>#N</code>) quando ela existir; não invente nem exija issue para implementar localmente.</li>\n</ul>\n<pre><code class=\"language-bash\">gh issue create \\\n  --title &quot;feat(escopo): descrição curta&quot; \\\n  --body &quot;$(cat &lt;&lt;'EOF'\n## Contexto\n&lt;por que&gt;\n\n## Escopo\n- [ ] item 1\n- [ ] item 2\n\n## Critério de aceitação\n- ...\nEOF\n)&quot;\n</code></pre>\n<ul>\n<li>Se a task já tem issue, reaproveite-a. Proponha a atribuição de responsável, mas não a edite sem autorização.</li>\n</ul>\n<h3 id=\"skills-dev-flow-skill~3-implement\">3. IMPLEMENT</h3>\n<ul>\n<li>Escreva o código para resolver o problema de forma simples e clara.</li>\n<li>Prefira mudanças pequenas e incrementalmente aumente o escopo.</li>\n<li>Siga as convenções do repositório e a arquitetura existente.</li>\n<li>Se precisar mexer em backend e frontend, faça commits pequenos e organizados.</li>\n</ul>\n<h3 id=\"skills-dev-flow-skill~4-test\">4. TEST</h3>\n<ul>\n<li>Crie ou atualize testes para cobrir a nova funcionalidade ou correção.</li>\n<li>Execute testes locais relevantes (<code>pnpm test</code> no package certo ou caso de teste específico).</li>\n<li>Garanta que não há regressão nas áreas afetadas.</li>\n</ul>\n<h3 id=\"skills-dev-flow-skill~5-commit-se-autorizado\">5. COMMIT (se autorizado)</h3>\n<ul>\n<li>Faça commits claros e em português, usando o padrão do repositório:</li>\n<li><code>feat(...)</code>, <code>fix(...)</code>, <code>chore(...)</code>, <code>test(...)</code></li>\n<li>O texto do commit deve descrever o que foi alterado.</li>\n<li>Inclua <code>Co-Authored-By: Claude Sonnet 4.6 &lt;noreply@anthropic.com&gt;</code> quando aplicável.</li>\n<li>Referencie a issue no rodapé do commit quando útil: <code>Refs #N</code>.</li>\n</ul>\n<h3 id=\"skills-dev-flow-skill~6-propor-publicação\">6. PROPOR PUBLICAÇÃO</h3>\n<ul>\n<li>Resuma o diff, os testes e a branch atual. Proponha o commit e a publicação necessários.</li>\n<li>Não assuma que existe CI automático, branch <code>develop</code> ou issue vinculada.</li>\n</ul>\n<h3 id=\"skills-dev-flow-skill~7-pr--merge-se-autorizado\">7. PR / MERGE (se autorizado)</h3>\n<ul>\n<li>Abra ou atualize o PR somente após autorização explícita.</li>\n<li>Descubra a branch-base na configuração do repositório ou no PR; não fixe <code>develop</code>.</li>\n<li><strong>Obrigatório</strong>: o corpo do PR deve conter uma keyword de auto-close apontando para a issue:</li>\n<li><code>Closes #N</code> — fecha a issue ao mergear o PR (entrega completa).</li>\n<li><code>Refs #N</code> — referencia sem fechar (entrega parcial; marque manualmente os itens <code>- [x]</code> concluídos na issue).</li>\n<li>Explique a mudança, onde testar e quais casos de teste foram executados.</li>\n<li>Marque o PR para revisão.</li>\n</ul>\n<pre><code class=\"language-bash\">gh pr create \\\n  --base &lt;branch-base-confirmada&gt; \\\n  --title &quot;feat(escopo): descrição&quot; \\\n  --body &quot;$(cat &lt;&lt;'EOF'\n## Resumo\n&lt;o que mudou e por quê&gt;\n\n## Como testar\n- ...\n\nCloses #N\nEOF\n)&quot;\n</code></pre>\n<ul>\n<li>Antes de mergear, confirme checks requeridos, aprovações, branch-base e o SHA do PR.</li>\n<li>Nunca faça push direto para branch protegida; use o mecanismo de merge do PR após autorização.</li>\n<li>Para entrega parcial, proponha a atualização da issue; não a altere sem autorização.</li>\n</ul>\n<h3 id=\"skills-dev-flow-skill~8-encerrar-com-segurança\">8. ENCERRAR COM SEGURANÇA</h3>\n<ul>\n<li>Informe <code>git status</code> e deixe mudanças não relacionadas intactas.</li>\n<li>Remova somente artefatos temporários criados nesta tarefa e apenas com autorização.</li>\n<li>Não remova worktree, não faça stash e não descarte alterações como etapa automática.</li>\n</ul>\n<h3 id=\"skills-dev-flow-skill~9-próxima-task\">9. PRÓXIMA TASK</h3>\n<ul>\n<li>Atualize <code>TRACKING.md</code> (status, contagem de testes, NEXT → DONE).</li>\n<li>Verifique se a issue foi fechada (ou parcialmente atualizada).</li>\n<li>Não escolha nem inicie uma nova task sem solicitação do usuário.</li>\n<li>Comece o próximo ciclo de PLANEJAMENTO.</li>\n</ul>\n<h2 id=\"skills-dev-flow-skill~resumo-rápido\">Resumo rápido</h2>\n<ul>\n<li>Planejar primeiro.</li>\n<li>Criar ou atualizar issue somente quando solicitado.</li>\n<li>Implementar com foco mínimo viável.</li>\n<li>Testar antes de commitar.</li>\n<li>Propor commit, PR ou merge com alvo e evidências; executar apenas com autorização.</li>\n<li>Preservar a árvore de trabalho e encerrar reportando seu estado.</li>\n</ul>", "toc": [{"level": 2, "id": "skills-dev-flow-skill~objetivo", "text": "Objetivo"}, {"level": 2, "id": "skills-dev-flow-skill~uso", "text": "Uso"}, {"level": 2, "id": "skills-dev-flow-skill~segurança-e-contrato-de-artefatos", "text": "Segurança e contrato de artefatos"}, {"level": 3, "id": "skills-dev-flow-skill~1-plan", "text": "1. PLAN"}, {"level": 3, "id": "skills-dev-flow-skill~2-tracking-se-solicitado", "text": "2. TRACKING (se solicitado)"}, {"level": 3, "id": "skills-dev-flow-skill~3-implement", "text": "3. IMPLEMENT"}, {"level": 3, "id": "skills-dev-flow-skill~4-test", "text": "4. TEST"}, {"level": 3, "id": "skills-dev-flow-skill~5-commit-se-autorizado", "text": "5. COMMIT (se autorizado)"}, {"level": 3, "id": "skills-dev-flow-skill~6-propor-publicação", "text": "6. PROPOR PUBLICAÇÃO"}, {"level": 3, "id": "skills-dev-flow-skill~7-pr--merge-se-autorizado", "text": "7. PR / MERGE (se autorizado)"}, {"level": 3, "id": "skills-dev-flow-skill~8-encerrar-com-segurança", "text": "8. ENCERRAR COM SEGURANÇA"}, {"level": 3, "id": "skills-dev-flow-skill~9-próxima-task", "text": "9. PRÓXIMA TASK"}, {"level": 2, "id": "skills-dev-flow-skill~resumo-rápido", "text": "Resumo rápido"}], "text": " skill: fluxo de desenvolvimento esta skill guia o fluxo padrão ao puxar uma task, do planejamento à entrega local. trate criação de issue, commit, push, pr, merge e limpeza de worktree como ações separadas, executadas apenas quando autorizadas pelo usuário. objetivo garantir que cada tarefa siga o fluxo: plan tracking (se solicitado) implement test commit (se autorizado) propor publicação pr / merge (se autorizado) encerrar com segurança próxima task uso quando iniciar uma task, siga estes passos em ordem e confirme cada etapa antes de passar à seguinte. a convenção local do repositório prevalece sobre exemplos de branch, ci ou issue abaixo. segurança e contrato de artefatos siga o contrato compartilhado . antes de qualquer efeito externo, apresente o alvo e peça autorização explícita: criar/editar issue, commit, push, abrir/editar pr, aplicar labels, mergear, fechar issue ou remover worktree. nunca descarte, faça stash ou remova mudanças do usuário para deixar a árvore limpa. 1. plan leia a task e entenda o escopo, critério de aceitação e restrições. identifique dependências e possíveis impactos nos módulos/backend/storefront. defina o que deve ser feito em um checklist pequeno. escolha/valide o branch name correto se ainda não existir. 2. tracking (se solicitado) se a demanda já tem issue, use-a como referência. se o usuário pedir rastreamento, proponha uma issue com título e corpo antes de criá-la. use gh issue create com título objetivo e corpo contendo: contexto : o \"porquê\" da demanda. escopo : checklist - [ ] com cada entregável (permite fechamento parcial visível). critério de aceitação : como validar. capture o número da issue ( #n ) quando ela existir; não invente nem exija issue para implementar localmente. gh issue create \\ --title &quot;feat(escopo): descrição curta&quot; \\ --body &quot;$(cat &lt;&lt;'eof' ## contexto &lt;por que&gt; ## escopo - [ ] item 1 - [ ] item 2 ## critério de aceitação - ... eof )&quot; se a task já tem issue, reaproveite-a. proponha a atribuição de responsável, mas não a edite sem autorização. 3. implement escreva o código para resolver o problema de forma simples e clara. prefira mudanças pequenas e incrementalmente aumente o escopo. siga as convenções do repositório e a arquitetura existente. se precisar mexer em backend e frontend, faça commits pequenos e organizados. 4. test crie ou atualize testes para cobrir a nova funcionalidade ou correção. execute testes locais relevantes ( pnpm test no package certo ou caso de teste específico). garanta que não há regressão nas áreas afetadas. 5. commit (se autorizado) faça commits claros e em português, usando o padrão do repositório: feat(...) , fix(...) , chore(...) , test(...) o texto do commit deve descrever o que foi alterado. inclua co-authored-by: claude sonnet 4.6 &lt;noreply@anthropic.com&gt; quando aplicável. referencie a issue no rodapé do commit quando útil: refs #n . 6. propor publicação resuma o diff, os testes e a branch atual. proponha o commit e a publicação necessários. não assuma que existe ci automático, branch develop ou issue vinculada. 7. pr / merge (se autorizado) abra ou atualize o pr somente após autorização explícita. descubra a branch-base na configuração do repositório ou no pr; não fixe develop . obrigatório : o corpo do pr deve conter uma keyword de auto-close apontando para a issue: closes #n — fecha a issue ao mergear o pr (entrega completa). refs #n — referencia sem fechar (entrega parcial; marque manualmente os itens - [x] concluídos na issue). explique a mudança, onde testar e quais casos de teste foram executados. marque o pr para revisão. gh pr create \\ --base &lt;branch-base-confirmada&gt; \\ --title &quot;feat(escopo): descrição&quot; \\ --body &quot;$(cat &lt;&lt;'eof' ## resumo &lt;o que mudou e por quê&gt; ## como testar - ... closes #n eof )&quot; antes de mergear, confirme checks requeridos, aprovações, branch-base e o sha do pr. nunca faça push direto para branch protegida; use o mecanismo de merge do pr após autorização. para entrega parcial, proponha a atualização da issue; não a altere sem autorização. 8. encerrar com segurança informe git status e deixe mudanças não relacionadas intactas. remova somente artefatos temporários criados nesta tarefa e apenas com autorização. não remova worktree, não faça stash e não descarte alterações como etapa automática. 9. próxima task atualize tracking.md (status, contagem de testes, next → done). verifique se a issue foi fechada (ou parcialmente atualizada). não escolha nem inicie uma nova task sem solicitação do usuário. comece o próximo ciclo de planejamento. resumo rápido planejar primeiro. criar ou atualizar issue somente quando solicitado. implementar com foco mínimo viável. testar antes de commitar. propor commit, pr ou merge com alvo e evidências; executar apenas com autorização. preservar a árvore de trabalho e encerrar reportando seu estado. "}, {"id": "skills-implement-skill", "path": "skills/implement/SKILL.md", "section": "Skills", "title": "implement", "status": "", "updated": "", "html": "<h1 id=\"skills-implement-skill~implement\">implement</h1><blockquote><p>Implementa um bloco de um plano técnico com validação incremental e tracking atualizado. Use quando houver plano de implementação e SPEC aprovados; não publica commits ou PRs sem pedido explícito.</p></blockquote><h2 id=\"skills-implement-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-implement-skill~goal\">Goal</h2>\n<p>Implementar o código seguindo o plano de implementação, bloco a bloco, com validação incremental.</p>\n<h2 id=\"skills-implement-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Resolva o plano, a SPEC e o tracking conforme <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-implement-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/plano-implementacao.md</code></li>\n<li><strong>Obrigatório:</strong> <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code></li>\n<li><strong>Obrigatório:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/tracking.md</code></li>\n<li><strong>Opcional:</strong> bloco específico para implementar (via <code>$ARGUMENTS</code>)</li>\n</ul>\n<h2 id=\"skills-implement-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-implement-skill~1-localizar-a-feature-e-o-plano\">1. Localizar a feature e o plano</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém slug, use-o. Caso contrário, infira do contexto.</li>\n<li>Leia <code>plano-implementacao.md</code>, <code>SPEC.md</code> e <code>tracking.md</code>.</li>\n</ul>\n<h3 id=\"skills-implement-skill~2-identificar-bloco-a-implementar\">2. Identificar bloco a implementar</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> especifica um bloco, implemente apenas esse.</li>\n<li>Caso contrário, implemente o próximo bloco não concluído do plano.</li>\n<li>Verifique dependências: blocos dependentes devem estar ✅ antes de iniciar.</li>\n</ul>\n<h3 id=\"skills-implement-skill~3-implementar-o-bloco\">3. Implementar o bloco</h3>\n<p>Para cada ação dentro do bloco:</p>\n<ol>\n<li>\n<p><strong>Antes de escrever código:</strong>\n   - Leia os arquivos existentes que serão modificados.\n   - Entenda convenções, padrões e imports existentes.\n   - Verifique se há testes existentes relevantes.</p>\n</li>\n<li>\n<p><strong>Escreva o código:</strong>\n   - Siga convenções do repositório.\n   - Mudanças pequenas e incrementais.\n   - Prefira modificar código existente a criar novo quando possível.</p>\n</li>\n<li>\n<p><strong>Após cada mudança:</strong>\n   - Verifique se o código compila/roda sem erros óbvios.\n   - Execute lint/format se disponível.</p>\n</li>\n</ol>\n<h3 id=\"skills-implement-skill~4-validação-do-bloco\">4. Validação do bloco</h3>\n<p>Após implementar todas as ações do bloco:</p>\n<ul>\n<li>Execute testes relevantes (se existirem).</li>\n<li>Valide contra os critérios de aceite do bloco no plano.</li>\n<li>Se houver erro, corrija antes de avançar.</li>\n</ul>\n<h3 id=\"skills-implement-skill~5-atualizar-tracking\">5. Atualizar tracking</h3>\n<p>Após concluir o bloco:\n- Atualize <code>tracking.md</code>: status → ✅, data de fim.\n- Se bloqueado: status → ❌, descreva o bloqueio no log.</p>\n<h3 id=\"skills-implement-skill~6-progressão\">6. Progressão</h3>\n<ul>\n<li>Após concluir um bloco, prossiga para o próximo (respeitando dependências).</li>\n<li>Se <code>$ARGUMENTS</code> pediu bloco específico, pare ao concluir.</li>\n</ul>\n<h3 id=\"skills-implement-skill~7-reportar-no-chat\">7. Reportar no chat</h3>\n<ul>\n<li>Resumo: bloco implementado, arquivos criados/modificados.</li>\n<li>Testes executados e resultado.</li>\n<li>Próximo bloco recomendado.</li>\n<li>Se bloqueado: descrição do problema e sugestão.</li>\n</ul>\n<h2 id=\"skills-implement-skill~regras\">Regras</h2>\n<ul>\n<li><strong>Não pule blocos</strong> — dependências existem por motivo.</li>\n<li><strong>Valide incrementalmente</strong> — não acumule mudanças sem testar.</li>\n<li><strong>Siga o plano</strong> — se precisar desviar, documente no tracking.</li>\n<li><strong>Commits pequenos</strong> — proponha um commit após cada bloco concluído; só use <code>/commit</code> quando o usuário pedir o registro em Git.</li>\n</ul>\n<h2 id=\"skills-implement-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] Bloco(s) implementado(s) conforme plano</li>\n<li>[ ] Código segue convenções do repositório</li>\n<li>[ ] Testes relevantes executados</li>\n<li>[ ] tracking.md atualizado</li>\n<li>[ ] Próximo bloco identificado (ou feature concluída)</li>\n</ul>", "toc": [{"level": 2, "id": "skills-implement-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-implement-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-implement-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-implement-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-implement-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-implement-skill~1-localizar-a-feature-e-o-plano", "text": "1. Localizar a feature e o plano"}, {"level": 3, "id": "skills-implement-skill~2-identificar-bloco-a-implementar", "text": "2. Identificar bloco a implementar"}, {"level": 3, "id": "skills-implement-skill~3-implementar-o-bloco", "text": "3. Implementar o bloco"}, {"level": 3, "id": "skills-implement-skill~4-validação-do-bloco", "text": "4. Validação do bloco"}, {"level": 3, "id": "skills-implement-skill~5-atualizar-tracking", "text": "5. Atualizar tracking"}, {"level": 3, "id": "skills-implement-skill~6-progressão", "text": "6. Progressão"}, {"level": 3, "id": "skills-implement-skill~7-reportar-no-chat", "text": "7. Reportar no chat"}, {"level": 2, "id": "skills-implement-skill~regras", "text": "Regras"}, {"level": 2, "id": "skills-implement-skill~done-when", "text": "Done When"}], "text": " implement implementa um bloco de um plano técnico com validação incremental e tracking atualizado. use quando houver plano de implementação e spec aprovados; não publica commits ou prs sem pedido explícito. user input $arguments you must consider the user input before proceeding (if not empty). goal implementar o código seguindo o plano de implementação, bloco a bloco, com validação incremental. contrato de artefatos resolva o plano, a spec e o tracking conforme o contrato compartilhado . inputs obrigatório: teamwork/plan/feature-plan-&lt;feature-slug&gt;/plano-implementacao.md obrigatório: .agents/spec/&lt;feature-slug&gt;/spec.md obrigatório: teamwork/plan/feature-plan-&lt;feature-slug&gt;/tracking.md opcional: bloco específico para implementar (via $arguments ) execution steps 1. localizar a feature e o plano se $arguments contém slug, use-o. caso contrário, infira do contexto. leia plano-implementacao.md , spec.md e tracking.md . 2. identificar bloco a implementar se $arguments especifica um bloco, implemente apenas esse. caso contrário, implemente o próximo bloco não concluído do plano. verifique dependências: blocos dependentes devem estar ✅ antes de iniciar. 3. implementar o bloco para cada ação dentro do bloco: antes de escrever código: - leia os arquivos existentes que serão modificados. - entenda convenções, padrões e imports existentes. - verifique se há testes existentes relevantes. escreva o código: - siga convenções do repositório. - mudanças pequenas e incrementais. - prefira modificar código existente a criar novo quando possível. após cada mudança: - verifique se o código compila/roda sem erros óbvios. - execute lint/format se disponível. 4. validação do bloco após implementar todas as ações do bloco: execute testes relevantes (se existirem). valide contra os critérios de aceite do bloco no plano. se houver erro, corrija antes de avançar. 5. atualizar tracking após concluir o bloco: - atualize tracking.md : status → ✅, data de fim. - se bloqueado: status → ❌, descreva o bloqueio no log. 6. progressão após concluir um bloco, prossiga para o próximo (respeitando dependências). se $arguments pediu bloco específico, pare ao concluir. 7. reportar no chat resumo: bloco implementado, arquivos criados/modificados. testes executados e resultado. próximo bloco recomendado. se bloqueado: descrição do problema e sugestão. regras não pule blocos — dependências existem por motivo. valide incrementalmente — não acumule mudanças sem testar. siga o plano — se precisar desviar, documente no tracking. commits pequenos — proponha um commit após cada bloco concluído; só use /commit quando o usuário pedir o registro em git. done when [ ] bloco(s) implementado(s) conforme plano [ ] código segue convenções do repositório [ ] testes relevantes executados [ ] tracking.md atualizado [ ] próximo bloco identificado (ou feature concluída) "}, {"id": "skills-test-integration-local-skill", "path": "skills/test-integration-local/SKILL.md", "section": "Skills", "title": "test-integration-local", "status": "", "updated": "", "html": "<h1 id=\"skills-test-integration-local-skill~test-integration-local\">test-integration-local</h1><blockquote><p>Cria cobertura faltante e executa validação local com evidências rastreáveis. Use após implementar uma feature ou correção, quando for necessário mapear critérios de aceite a testes e relatar resultados.</p></blockquote><h2 id=\"skills-test-integration-local-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-test-integration-local-skill~goal\">Goal</h2>\n<p>Executar validação completa do código implementado — testes unitários, mutação, cobertura — e gerar evidências de que os critérios de aceite são atendidos.</p>\n<h2 id=\"skills-test-integration-local-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Antes de escrever evidências, siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-test-integration-local-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> código implementado (repositório local)</li>\n<li><strong>Obrigatório:</strong> <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code> (critérios de aceite)</li>\n<li><strong>Obrigatório:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/plano-implementacao.md</code></li>\n<li><strong>Opcional:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/tracking.md</code></li>\n</ul>\n<h2 id=\"skills-test-integration-local-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-test-integration-local-skill~1-identificar-escopo-de-testes\">1. Identificar escopo de testes</h3>\n<ul>\n<li>Leia a SPEC para extrair critérios de aceite técnicos (CT-XX).</li>\n<li>Leia o plano de implementação para identificar blocos implementados.</li>\n<li>Identifique arquivos modificados/criados.</li>\n</ul>\n<h3 id=\"skills-test-integration-local-skill~2-gerar-casos-de-teste\">2. Gerar casos de teste</h3>\n<p>Para cada critério de aceite técnico (CT-XX) sem cobertura:</p>\n<ul>\n<li>Crie teste unitário que valida o critério.</li>\n<li>Siga padrão de testes existente no repositório.</li>\n<li>Nomeie seguindo convenção do projeto.</li>\n</ul>\n<p>Para fluxos de exceção:\n- Teste caminhos de erro documentados na SPEC.\n- Teste validações, limites e edge cases.</p>\n<h3 id=\"skills-test-integration-local-skill~3-executar-testes-unitários\">3. Executar testes unitários</h3>\n<pre><code class=\"language-bash\"># Detectar e executar testes do projeto\n# Exemplos por ecossistema:\n# Node.js: npm test / pnpm test / yarn test\n# Python: pytest / python -m pytest\n# Go: go test ./...\n# Rust: cargo test\n</code></pre>\n<ul>\n<li>Execute todos os testes, não apenas os novos.</li>\n<li>Verifique se há regressões.</li>\n</ul>\n<h3 id=\"skills-test-integration-local-skill~4-verificar-cobertura-se-disponível\">4. Verificar cobertura (se disponível)</h3>\n<pre><code class=\"language-bash\"># Exemplos:\n# Node.js: npx jest --coverage\n# Python: pytest --cov\n# Go: go test -cover ./...\n# Rust: cargo tarpaulin\n</code></pre>\n<ul>\n<li>Verifique se os arquivos modificados têm cobertura adequada.</li>\n<li>Identifique linhas/branches sem teste.</li>\n</ul>\n<h3 id=\"skills-test-integration-local-skill~5-testes-de-mutação-se-disponível\">5. Testes de mutação (se disponível)</h3>\n<pre><code class=\"language-bash\"># Exemplos:\n# Node.js: npx Stryker run\n# Python: mutmut run\n</code></pre>\n<ul>\n<li>Valide que testes realmente testam (não apenas passam).</li>\n<li>Corrija testes que não matam mutações.</li>\n</ul>\n<h3 id=\"skills-test-integration-local-skill~6-self-check-dos-critérios-de-aceite\">6. Self-check dos critérios de aceite</h3>\n<p>Para cada CT (critério técnico) e seu CA de negócio relacionado, quando houver:</p>\n<table>\n<thead>\n<tr>\n<th>CT</th>\n<th>CA relacionado</th>\n<th>Critério</th>\n<th>Status</th>\n<th>Evidência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>CT-01</td>\n<td>CA-01</td>\n<td><descrição></td>\n<td>✅ / ❌</td>\n<td><teste que valida></td>\n</tr>\n<tr>\n<td>CT-02</td>\n<td>CA-02</td>\n<td><descrição></td>\n<td>✅ / ❌</td>\n<td><teste que valida></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"skills-test-integration-local-skill~7-gerar-evidências\">7. Gerar evidências</h3>\n<p>Crie <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/evidencias-teste.md</code>:</p>\n<pre><code class=\"language-markdown\"># Evidências de Teste — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n\n---\n\n## Resultado dos Testes\n\n### Unitários\n- **Comando:** `&lt;comando executado&gt;`\n- **Resultado:** ✅ X passando / ❌ Y falhando\n- **Cobertura:** XX%\n\n### Mutação (se aplicável)\n- **Comando:** `&lt;comando executado&gt;`\n- **Score:** XX% (X matados / Y total)\n\n### Regressão\n- **Testes existentes:** ✅ Todos passando / ❌ Falhas\n\n---\n\n## Cobertura por Critério de Aceite\n\n| CT | CA relacionado | Critério | Teste | Status |\n|----|---------------|----------|-------|--------|\n| CT-01 | CA-01 | ... | teste_nome | ✅ |\n| CT-02 | CA-02 | ... | teste_nome | ✅ |\n\n---\n\n## Arquivos Modificados e Cobertos\n\n| Arquivo | Linhas | Cobertura |\n|---------|--------|-----------|\n| ... | ... | XX% |\n\n---\n\n## Pendências\n\n- &lt;testes que não foi possível executar&gt;\n- &lt;cobertura faltante justificada&gt;\n</code></pre>\n<h3 id=\"skills-test-integration-local-skill~8-reportar-no-chat\">8. Reportar no chat</h3>\n<ul>\n<li>Resumo: X testes passando, Y falhando, Z cobertura.</li>\n<li>Critérios de aceite atendidos vs pendentes.</li>\n<li>Pronto para code review ou precisa de ajustes.</li>\n</ul>\n<h2 id=\"skills-test-integration-local-skill~convenções\">Convenções</h2>\n<ul>\n<li>Testes seguem padrão do repositório.</li>\n<li>Evidências são persistentes — ficam no repositório.</li>\n<li>Self-check é obrigatório antes de abrir PR.</li>\n<li>Português para documentação, inglês para código de teste.</li>\n</ul>\n<h2 id=\"skills-test-integration-local-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] Testes unitários executados e passando</li>\n<li>[ ] Cobertura verificada (se ferramenta disponível)</li>\n<li>[ ] Critérios de aceite self-checked com evidências</li>\n<li>[ ] <code>evidencias-teste.md</code> gerado</li>\n<li>[ ] Regressão verificada (testes existentes passando)</li>\n<li>[ ] Resultado reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-test-integration-local-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-test-integration-local-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-test-integration-local-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-test-integration-local-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-test-integration-local-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-test-integration-local-skill~1-identificar-escopo-de-testes", "text": "1. Identificar escopo de testes"}, {"level": 3, "id": "skills-test-integration-local-skill~2-gerar-casos-de-teste", "text": "2. Gerar casos de teste"}, {"level": 3, "id": "skills-test-integration-local-skill~3-executar-testes-unitários", "text": "3. Executar testes unitários"}, {"level": 3, "id": "skills-test-integration-local-skill~4-verificar-cobertura-se-disponível", "text": "4. Verificar cobertura (se disponível)"}, {"level": 3, "id": "skills-test-integration-local-skill~5-testes-de-mutação-se-disponível", "text": "5. Testes de mutação (se disponível)"}, {"level": 3, "id": "skills-test-integration-local-skill~6-self-check-dos-critérios-de-aceite", "text": "6. Self-check dos critérios de aceite"}, {"level": 3, "id": de abrir pr. português para documentação, inglês para código de teste. done when [ ] testes unitários executados e passando [ ] cobertura verificada (se ferramenta disponível) [ ] critérios de aceite self-checked com evidências [ ] evidencias-teste.md gerado [ ] regressão verificada (testes existentes passando) [ ] resultado reportado no chat "}, {"id": "skills-code-review-skill", "path": "skills/code-review/SKILL.md", "section": "Skills", "title": "code-review", "status": "", "updated": "", "html": "<h1 id=\"skills-code-review-skill~code-review\">code-review</h1><blockquote><p>Revisa mudanças de código contra SPEC, testes e riscos, produzindo achados acionáveis sem modificar o código. Use antes de revisão humana ou quando o usuário pedir uma revisão técnica de uma feature ou PR.</p></blockquote><h2 id=\"skills-code-review-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-code-review-skill~goal\">Goal</h2>\n<p>Revisar o código de forma adversarial antes de chegar a revisores humanos, verificando conformidade com a SPEC, qualidade e cobertura de testes.</p>\n<h2 id=\"skills-code-review-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Resolva artefatos conforme <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-code-review-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code></li>\n<li><strong>Obrigatório:</strong> código implementado (diff da branch)</li>\n<li><strong>Obrigatório:</strong> testes executados</li>\n<li><strong>Opcional:</strong> descrição do PR (se já existe)</li>\n</ul>\n<h2 id=\"skills-code-review-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-code-review-skill~1-coletar-contexto\">1. Coletar contexto</h3>\n<ul>\n<li>Leia a SPEC — requisitos técnicos e critérios de aceite.</li>\n<li>Descubra a base do PR (<code>gh pr view --json baseRefName</code>) ou a branch configurada no repositório; então use <code>git diff &lt;base&gt;...HEAD</code>. Não presuma <code>main</code> ou <code>develop</code>.</li>\n<li>Leia testes criados/modificados.</li>\n</ul>\n<h3 id=\"skills-code-review-skill~2-revisão-em-camadas\">2. Revisão em camadas</h3>\n<h4 id=\"skills-code-review-skill~a-conformidade-com-spec\">A. Conformidade com SPEC</h4>\n<p>Para cada bloco implementado:\n- O código implementa o que a SPEC define?\n- Critérios de aceite técnicos (CT-XX) são atendidos?\n- Modelo de dados está correto?\n- Contratos de interface batem com a SPEC?</p>\n<h4 id=\"skills-code-review-skill~b-qualidade-do-código\">B. Qualidade do Código</h4>\n<ul>\n<li>Código segue convenções do repositório?</li>\n<li>Funções/métodos são claros e bem nomeados?</li>\n<li>Não há code duplication desnecessária?</li>\n<li>Tratamento de erros adequado?</li>\n<li>Edge cases tratados?</li>\n</ul>\n<h4 id=\"skills-code-review-skill~c-segurança\">C. Segurança</h4>\n<ul>\n<li>Input validation presente?</li>\n<li>Secrets/credenciais hardcoded?</li>\n<li>SQL injection, XSS, CSRF?</li>\n<li>Aut autorização/autenticação adequada?</li>\n</ul>\n<h4 id=\"skills-code-review-skill~d-performance\">D. Performance</h4>\n<ul>\n<li>Queries N+1?</li>\n<li>Operações bloqueantes?</li>\n<li>Cache adequado?</li>\n<li>Memória/loop infinitos potenciais?</li>\n</ul>\n<h4 id=\"skills-code-review-skill~e-testes\">E. Testes</h4>\n<ul>\n<li>Todos os CT-XX têm teste?</li>\n<li>Testes são significativos (não apenas passam)?</li>\n<li>Edge cases testados?</li>\n<li>Mocks/stubs adequados?</li>\n</ul>\n<h3 id=\"skills-code-review-skill~3-classificar-achados\">3. Classificar achados</h3>\n<ul>\n<li><strong>BLOCKER:</strong> Deve ser corrigido antes do PR (bug, security, SPEC violation)</li>\n<li><strong>REVIEW:</strong> Revisores devem verificar (design, padrão, performance)</li>\n<li><strong>SUGGESTION:</strong> Melhoria opcional (refactoring, otimização)</li>\n<li><strong>PRAISE:</strong> Código bem escrito (reforço positivo)</li>\n</ul>\n<h3 id=\"skills-code-review-skill~4-gerar-relatório\">4. Gerar relatório</h3>\n<p>Gere <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/code-review.md</code>:</p>\n<pre><code class=\"language-markdown\"># Code Review — &lt;Feature Name&gt;\n\n**Feature:** &lt;slug&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n**Branch:** &lt;nome da branch&gt;\n**Commits:** &lt;quantidade&gt;\n\n---\n\n## Resumo\n\n| Categoria | Quantidade |\n|-----------|-----------|\n| 🔴 BLOCKER | X |\n| 🟠 REVIEW | X |\n| 🟡 SUGGESTION | X |\n| 🟢 PRAISE | X |\n\n**Recomendação:** ✅ Aprovar / 🔄 Revisar / ❌ Rejeitar\n\n---\n\n## Conformidade com SPEC\n\n| Bloco | CT-XX | Status | Observação |\n|-------|-------|--------|------------|\n| ... | CT-01 | ✅ / ⚠️ / ❌ | ... |\n\n---\n\n## Achados\n\n### 🔴 BLOCKER\n\n#### B-01: &lt;Título&gt;\n- **Arquivo:** `caminho/linha`\n- **Problema:** &lt;descrição&gt;\n- **Sugestão:** &lt;como corrigir&gt;\n\n### 🟠 REVIEW\n\n#### R-01: &lt;Título&gt;\n...\n\n### 🟡 SUGGESTION\n\n#### S-01: &lt;Título&gt;\n...\n\n### 🟢 PRAISE\n\n#### P-01: &lt;Título&gt;\n&lt;o que está bem e por quê&gt;\n\n---\n\n## Cobertura de Testes\n\n| CT-XX | Critério | Teste | Status |\n|-------|----------|-------|--------|\n| CT-01 | ... | ... | ✅ / ❌ |\n\n---\n\n## Material de Homologação\n\n&lt;se solicitado, gere material seguindo template do time&gt;\n\n### Resumo da Mudança\n&lt;o que mudou e por quê&gt;\n\n### Como Testar\n&lt;passos de validação&gt;\n\n### Impacto\n&lt;áreas afetadas, riscos&gt;\n\n---\n\n## Recomendação Final\n\n&lt;justificativa da recomendação&gt;\n</code></pre>\n<h3 id=\"skills-code-review-skill~5-reportar-no-chat\">5. Reportar no chat</h3>\n<ul>\n<li>Resumo: X blockers, Y review, Z sugestões.</li>\n<li>Recomendação: aprovar, revisar ou rejeitar.</li>\n<li>Bloqueios que precisam de resolução.</li>\n</ul>\n<h2 id=\"skills-code-review-skill~convenções\">Convenções</h2>\n<ul>\n<li>Revisão é adversarial — tente encontrar problemas.</li>\n<li>Nunca silencie blockers — sempre reporte.</li>\n<li>Praise é importante — reforça boas práticas.</li>\n<li>Português para documentação.</li>\n<li>Material de homologação segue template do time quando solicitado.</li>\n</ul>\n<h2 id=\"skills-code-review-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] Revisão em todas as camadas executada</li>\n<li>[ ] Conformidade com SPEC verificada</li>\n<li>[ ] Achados classificados (BLOCKER/REVIEW/SUGGESTION/PRAISE)</li>\n<li>[ ] <code>code-review.md</code> gerado</li>\n<li>[ ] Recomendação de aprovação/revisão/rejeição reportada</li>\n</ul>", "toc": [{"level": 2, "id": "skills-code-review-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-code-review-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-code-review-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-code-review-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-code-review-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-code-review-skill~1-coletar-contexto", "text": "1. Coletar contexto"}, {"level": 3, "id": "skills-code-review-skill~2-revisão-em-camadas", "text": "2. Revisão em camadas"}, {"level": 3, "id": "skills-code-review-skill~3-classificar-achados", "text": "3. Classificar achados"}, {"level": 3, "id": "skills-code-review-skill~4-gerar-relatório", "text": "4. Gerar relatório"}, {"level": 3, "id": "skills-code-review-skill~5-reportar-no-chat", "text": "5. Reportar no chat"}, {"level": 2, "id": "skills-code-review-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-code-review-skill~done-when", "text": "Done When"}], "text": " code-review revisa mudanças de código contra spec, testes e riscos, produzindo achados acionáveis sem modificar o código. use antes de revisão humana ou quando o usuário pedir uma revisão técnica de uma feature ou pr. user input $arguments you must consider the user input before proceeding (if not empty). goal revisar o código de forma adversarial antes de chegar a revisores humanos, verificando conformidade com a spec, qualidade e cobertura de testes. contrato de artefatos resolva artefatos conforme o contrato compartilhado . inputs obrigatório: .agents/spec/&lt;feature-slug&gt;/spec.md obrigatório: código implementado (diff da branch) obrigatório: testes executados opcional: descrição do pr (se já existe) execution steps 1. coletar contexto leia a spec — requisitos técnicos e critérios de aceite. descubra a base do pr ( gh pr view --json baserefname ) ou a branch configurada no repositório; então use git diff &lt;base&gt;...head . não presuma main ou develop . leia testes criados/modificados. 2. revisão em camadas a. conformidade com spec para cada bloco implementado: - o código implementa o que a spec define? - critérios de aceite técnicos (ct-xx) são atendidos? - modelo de dados está correto? - contratos de interface batem com a spec? b. qualidade do código código segue convenções do repositório? funções/métodos são claros e bem nomeados? não há code duplication desnecessária? tratamento de erros adequado? edge cases tratados? c. segurança input validation presente? secrets/credenciais hardcoded? sql injection, xss, csrf? aut autorização/autenticação adequada? d. performance queries n+1? operações bloqueantes? cache adequado? memória/loop infinitos potenciais? e. testes todos os ct-xx têm teste? testes são significativos (não apenas passam)? edge cases testados? mocks/stubs adequados? 3. classificar achados blocker: deve ser corrigido antes do pr (bug, security, spec violation) review: revisores devem verificar (design, padrão, performance) suggestion: melhoria opcional (refactoring, otimização) praise: código bem escrito (reforço positivo) 4. gerar relatório gere teamwork/plan/feature-plan-&lt;feature-slug&gt;/code-review.md : # code review — &lt;feature name&gt; **feature:** &lt;slug&gt; **data:** &lt;yyyy-mm-dd&gt; **branch:** &lt;nome da branch&gt; **commits:** &lt;quantidade&gt; --- ## resumo | categoria | quantidade | |-----------|-----------| | 🔴 blocker | x | | 🟠 review | x | | 🟡 suggestion | x | | 🟢 praise | x | **recomendação:** ✅ aprovar / 🔄 revisar / ❌ rejeitar --- ## conformidade com spec | bloco | ct-xx | status | observação | |-------|-------|--------|------------| | ... | ct-01 | ✅ / ⚠️ / ❌ | ... | --- ## achados ### 🔴 blocker #### b-01: &lt;título&gt; - **arquivo:** `caminho/linha` - **problema:** &lt;descrição&gt; - **sugestão:** &lt;como corrigir&gt; ### 🟠 review #### r-01: &lt;título&gt; ... ### 🟡 suggestion #### s-01: &lt;título&gt; ... ### 🟢 praise #### p-01: &lt;título&gt; &lt;o que está bem e por quê&gt; --- ## cobertura de testes | ct-xx | critério | teste | status | |-------|----------|-------|--------| | ct-01 | ... | ... | ✅ / ❌ | --- ## material de homologação &lt;se solicitado, gere material seguindo template do time&gt; ### resumo da mudança &lt;o que mudou e por quê&gt; ### como testar &lt;passos de validação&gt; ### impacto &lt;áreas afetadas, riscos&gt; --- ## recomendação final &lt;justificativa da recomendação&gt; 5. reportar no chat resumo: x blockers, y review, z sugestões. recomendação: aprovar, revisar ou rejeitar. bloqueios que precisam de resolução. convenções revisão é adversarial — tente encontrar problemas. nunca silencie blockers — sempre reporte. praise é importante — reforça boas práticas. português para documentação. material de homologação segue template do time quando solicitado. done when [ ] revisão em todas as camadas executada [ ] conformidade com spec verificada [ ] achados classificados (blocker/review/suggestion/praise) [ ] code-review.md gerado [ ] recomendação de aprovação/revisão/rejeição reportada "}, {"id": "skills-analyse-bug-skill", "path": "skills/analyse-bug/SKILL.md", "section": "Skills", "title": "analyse-bug", "status": "", "updated": "", "html": "<h1 id=\"skills-analyse-bug-skill~analyse-bug\">analyse-bug</h1><blockquote><p>Analisa evidências de um bug, rastreia causa raiz e documenta impacto sem implementar correções. Use ao receber logs, prints, erros ou descrições de comportamento incorreto.</p></blockquote><h2 id=\"skills-analyse-bug-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-analyse-bug-skill~goal\">Goal</h2>\n<p>Analisar o problema reported, rastrear a causa raiz, identificar componentes afetados e gerar documentação estruturada.</p>\n<h2 id=\"skills-analyse-bug-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Antes de criar um relatório, siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.</p>\n<h2 id=\"skills-analyse-bug-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> evidência do bug (log, print, descrição, erro)</li>\n<li><strong>Opcional:</strong> contexto adicional (quando aconteceu, frequency, impacto)</li>\n</ul>\n<h2 id=\"skills-analyse-bug-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-analyse-bug-skill~1-coletar-evidência\">1. Coletar evidência</h3>\n<ul>\n<li>Colete toda a informação disponível: logs, prints, stack traces,Descrição do comportamento esperado vs obtido.</li>\n<li>Se <code>$ARGUMENTS</code> for vazio, peça evidência ao usuário.</li>\n</ul>\n<h3 id=\"skills-analyse-bug-skill~2-classificar-o-bug\">2. Classificar o bug</h3>\n<table>\n<thead>\n<tr>\n<th>Dimensão</th>\n<th>Opção</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Severidade</td>\n<td>🔴 Crash / 🟠 Funcional / 🟡 UI / 🔵 Cosmético</td>\n</tr>\n<tr>\n<td>Impacto</td>\n<td>Todos usuários / Alguns / Edge case</td>\n</tr>\n<tr>\n<td>Recorrência</td>\n<td>Sempre / Intermitente / Uma vez</td>\n</tr>\n<tr>\n<td>Componente</td>\n<td>Backend / Frontend / Infra / Database</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"skills-analyse-bug-skill~3-rastrear-causa-raiz\">3. Rastrear causa raiz</h3>\n<p>Analise a evidência para identificar:</p>\n<ul>\n<li><strong>Sintoma:</strong> o que o usuário/sistema apresenta.</li>\n<li><strong>Causa imediata:</strong> o que no código/config causou o sintoma.</li>\n<li><strong>Causa raiz:</strong> por que o código/config estava assim (falta de validação, race condition, etc.).</li>\n</ul>\n<p>Use técnicas:\n- Stack trace → arquivo → função → lógica.\n- Log analysis → sequência de eventos.\n- Reprodução → passos para recriar.</p>\n<h3 id=\"skills-analyse-bug-skill~4-identificar-componentes-afetados\">4. Identificar componentes afetados</h3>\n<table>\n<thead>\n<tr>\n<th>Componente</th>\n<th>Arquivo</th>\n<th>Função/Método</th>\n<th>Impacto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>...</td>\n<td>...</td>\n<td>...</td>\n<td>...</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"skills-analyse-bug-skill~5-documentar-o-bug\">5. Documentar o bug</h3>\n<p>Gere <code>bugs/bug-&lt;NOME-SLUG&gt;.md</code>:</p>\n<pre><code class=\"language-markdown\"># Bug: &lt;Título&gt;\n\n**ID:** BUG-&lt;NNN&gt;\n**Data:** &lt;YYYY-MM-DD&gt;\n**Severidade:** 🔴/🟠/🟡/🔵\n**Status:** 🟡 Analisado\n\n---\n\n## Sintoma\n\n&lt;o que acontece — comportamento observável&gt;\n\n## Comportamento Esperado\n\n&lt;o que deveria acontecer&gt;\n\n## Evidência\n\n&lt;logs, prints, stack traces — colar trechos relevantes&gt;\n\n## Causa Raiz\n\n&lt;análise técnica do porquê acontece&gt;\n\n## Componentes Afetados\n\n| Componente | Arquivo | Função |\n|-----------|---------|--------|\n| ... | ... | ... |\n\n## Passos para Reproduzir\n\n1. &lt;passo 1&gt;\n2. &lt;passo 2&gt;\n3. &lt;passo 3&gt;\n\n**Resultado:** &lt;erro/bug&gt;\n**Esperado:** &lt;comportamento correto&gt;\n\n## Impacto\n\n- **Usuários:** &lt;afeta todos/alguns/edge case&gt;\n- **Dados:** &lt;perda/corrupção/dados OK&gt;\n- **Performance:** &lt;sim/não/leve&gt;\n\n## Sugestão de Correção\n\n&lt;direção da correção — não implementar ainda&gt;\n\n## Referências\n\n- &lt;links, issues, PRs relacionados&gt;\n</code></pre>\n<h3 id=\"skills-analyse-bug-skill~6-reportar-no-chat\">6. Reportar no chat</h3>\n<ul>\n<li>Resumo: sintoma, causa raiz, severidade.</li>\n<li>Componentes afetados.</li>\n<li>Caminho para correção sugerido.</li>\n<li>Se precisa de mais informação para análise completa.</li>\n</ul>\n<h2 id=\"skills-analyse-bug-skill~convenções\">Convenções</h2>\n<ul>\n<li>Nunca implemente a correção — apenas analise.</li>\n<li>Documente com evidências, não suposições.</li>\n<li>Causa raiz é \"por que\" — não \"o que\" (sintoma).</li>\n<li>Português.</li>\n</ul>\n<h2 id=\"skills-analyse-bug-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] Evidência coletada e analisada</li>\n<li>[ ] Causa raiz identificada</li>\n<li>[ ] Componentes afetados mapeados</li>\n<li>[ ] <code>bug-&lt;NOME&gt;.md</code> gerado em <code>bugs/</code></li>\n<li>[ ] Resumo reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-analyse-bug-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-analyse-bug-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-analyse-bug-skill~contrato-de-artefatos", "text": "Contrato de artefatos"}, {"level": 2, "id": "skills-analyse-bug-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-analyse-bug-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-analyse-bug-skill~1-coletar-evidência", "text": "1. Coletar evidência"}, {"level": 3, "id": "skills-analyse-bug-skill~2-classificar-o-bug", "text": "2. Classificar o bug"}, {"level": 3, "id": "skills-analyse-bug-skill~3-rastrear-causa-raiz", "text": "3. Rastrear causa raiz"}, {"level": 3, "id": "skills-analyse-bug-skill~4-identificar-componentes-afetados", "text": "4. Identificar componentes afetados"}, {"level": 3, "id": "skills-analyse-bug-skill~5-documentar-o-bug", "text": "5. Documentar o bug"}, {"level": 3, "id": "skills-analyse-bug-skill~6-reportar-no-chat", "text": "6. Reportar no chat"}, {"level": 2, "id": "skills-analyse-bug-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-analyse-bug-skill~done-when", "text": "Done When"}], "text": " analyse-bug analisa evidências de um bug, rastreia causa raiz e documenta impacto sem implementar correções. use ao receber logs, prints, erros ou descrições de comportamento incorreto. user input $arguments you must consider the user input before proceeding (if not empty). goal analisar o problema reported, rastrear a causa raiz, identificar componentes afetados e gerar documentação estruturada. contrato de artefatos antes de criar um relatório, siga o contrato compartilhado . inputs obrigatório: evidência do bug (log, print, descrição, erro) opcional: contexto adicional (quando aconteceu, frequency, impacto) execution steps 1. coletar evidência colete toda a informação disponível: logs, prints, stack traces,descrição do comportamento esperado vs obtido. se $arguments for vazio, peça evidência ao usuário. 2. classificar o bug dimensão opção severidade 🔴 crash / 🟠 funcional / 🟡 ui / 🔵 cosmético impacto todos usuários / alguns / edge case recorrência sempre / intermitente / uma vez componente backend / frontend / infra / database 3. rastrear causa raiz analise a evidência para identificar: sintoma: o que o usuário/sistema apresenta. causa imediata: o que no código/config causou o sintoma. causa raiz: por que o código/config estava assim (falta de validação, race condition, etc.). use técnicas: - stack trace → arquivo → função → lógica. - log analysis → sequência de eventos. - reprodução → passos para recriar. 4. identificar componentes afetados componente arquivo função/método impacto ... ... ... ... 5. documentar o bug gere bugs/bug-&lt;nome-slug&gt;.md : # bug: &lt;título&gt; **id:** bug-&lt;nnn&gt; **data:** &lt;yyyy-mm-dd&gt; **severidade:** 🔴/🟠/🟡/🔵 **status:** 🟡 analisado --- ## sintoma &lt;o que acontece — comportamento observável&gt; ## comportamento esperado &lt;o que deveria acontecer&gt; ## evidência &lt;logs, prints, stack traces — colar trechos relevantes&gt; ## causa raiz &lt;análise técnica do porquê acontece&gt; ## componentes afetados | componente | arquivo | função | |-----------|---------|--------| | ... | ... | ... | ## passos para reproduzir 1. &lt;passo 1&gt; 2. &lt;passo 2&gt; 3. &lt;passo 3&gt; **resultado:** &lt;erro/bug&gt; **esperado:** &lt;comportamento correto&gt; ## impacto - **usuários:** &lt;afeta todos/alguns/edge case&gt; - **dados:** &lt;perda/corrupção/dados ok&gt; - **performance:** &lt;sim/não/leve&gt; ## sugestão de correção &lt;direção da correção — não implementar ainda&gt; ## referências - &lt;links, issues, prs relacionados&gt; 6. reportar no chat resumo: sintoma, causa raiz, severidade. componentes afetados. caminho para correção sugerido. se precisa de mais informação para análise completa. convenções nunca implemente a correção — apenas analise. documente com evidências, não suposições. causa raiz é \"por que\" — não \"o que\" (sintoma). português. done when [ ] evidência coletada e analisada [ ] causa raiz identificada [ ] componentes afetados mapeados [ ] bug-&lt;nome&gt;.md gerado em bugs/ [ ] resumo reportado no chat "}, {"id": "skills-fix-bug-skill", "path": "skills/fix-bug/SKILL.md", "section": "Skills", "title": "fix-bug", "status": "", "updated": "", "html": "<h1 id=\"skills-fix-bug-skill~fix-bug\">fix-bug</h1><blockquote><p>Corrige um bug documentado com teste de regressão e validação local. Use quando houver evidência ou análise de bug e o usuário pedir a implementação da correção; commit e PR exigem pedido de publicação.</p></blockquote><h2 id=\"skills-fix-bug-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-fix-bug-skill~goal\">Goal</h2>\n<p>Implementar a correção do bug seguindo o fluxo padrão (implement → test → commit → PR), garantindo cobertura por teste.</p>\n<h2 id=\"skills-fix-bug-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> <code>bugs/bug-&lt;NOME-SLUG&gt;.md</code> (análise do bug)</li>\n<li><strong>Obrigatório:</strong> código afetado (repositório local)</li>\n</ul>\n<h2 id=\"skills-fix-bug-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-fix-bug-skill~1-carregar-análise\">1. Carregar análise</h3>\n<ul>\n<li>Leia <code>bug-&lt;NOME&gt;.md</code> — causa raiz e componente afetado.</li>\n<li>Identifique arquivos que precisam ser modificados.</li>\n</ul>\n<h3 id=\"skills-fix-bug-skill~2-verificar-se-há-teste-que-reproduz-o-bug\">2. Verificar se há teste que reproduz o bug</h3>\n<ul>\n<li>Execute os testes existentes para o componente afetado.</li>\n<li>Verifique se algum teste já cobre o cenário (e está falhando ou passando incorretamente).</li>\n<li>Se não há teste que reproduza, crie um antes de corrigir (TDD).</li>\n</ul>\n<h3 id=\"skills-fix-bug-skill~3-criar-teste-de-regressão\">3. Criar teste de regressão</h3>\n<p>Crie teste que:\n- Reproduz o bug (deve falhar com o código atual).\n- Valida o comportamento correto (deve passar após a correção).\n- Segue padrão de testes do repositório.</p>\n<h3 id=\"skills-fix-bug-skill~4-implementar-a-correção\">4. Implementar a correção</h3>\n<ul>\n<li>Siga a direção sugerida na análise (ou ajuste se necessário).</li>\n<li>Mudanças mínimas e focadas — não refatore desnecessariamente.</li>\n<li>Siga convenções do repositório.</li>\n</ul>\n<h3 id=\"skills-fix-bug-skill~5-validar\">5. Validar</h3>\n<ul>\n<li>Execute o teste de regressão — deve passar.</li>\n<li>Execute todos os testes do componente — não deve haver regressão.</li>\n<li>Verifique se o bug original está resolvido.</li>\n</ul>\n<h3 id=\"skills-fix-bug-skill~6-propor-publicação\">6. Propor publicação</h3>\n<p>Após a correção estar validada, informe os passos de publicação:</p>\n<ol>\n<li><strong>Commit</strong> — use <code>/commit</code> com mensagem <code>fix(&lt;escopo&gt;): &lt;descrição&gt;</code> + <code>Refs #&lt;issue&gt;</code> se o usuário pedir um commit.</li>\n<li><strong>PR</strong> — use <code>/update-pr</code> ou proponha um novo PR somente se o usuário pedir publicação.</li>\n</ol>\n<h3 id=\"skills-fix-bug-skill~7-atualizar-análise-do-bug\">7. Atualizar análise do bug</h3>\n<p>Atualize <code>bugs/bug-&lt;NOME&gt;.md</code>:\n- Status: 🟡 Analisado → ✅ Corrigido\n- Adicione data de correção\n- Referencie o PR/commit</p>\n<h3 id=\"skills-fix-bug-skill~8-reportar-no-chat\">8. Reportar no chat</h3>\n<ul>\n<li>Resumo: bug corrigido, causa raiz, mudança realizada.</li>\n<li>Teste de regressão criado.</li>\n<li>PR/commit referenciado.</li>\n<li>Se a correção é parcial ou precisa de follow-up.</li>\n</ul>\n<h2 id=\"skills-fix-bug-skill~convenções\">Convenções</h2>\n<ul>\n<li>Sempre crie teste antes de corrigir (ou confirme que existe).</li>\n<li>Correções são mínimas — não refatore durante o fix.</li>\n<li>Commit segue padrão <code>fix(...)</code>.</li>\n<li>Se o bug tem issue, referencie no commit e PR.</li>\n<li>Português.</li>\n</ul>\n<h2 id=\"skills-fix-bug-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] Análise do bug carregada</li>\n<li>[ ] Teste de regressão criado (ou existente validado)</li>\n<li>[ ] Correção implementada e validada</li>\n<li>[ ] Testes executados sem regressão</li>\n<li>[ ] Próximo passo de publicação informado</li>\n<li>[ ] Análise do bug atualizada com status ✅</li>\n<li>[ ] Resultado reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-fix-bug-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-fix-bug-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-fix-bug-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-fix-bug-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-fix-bug-skill~1-carregar-análise", "text": "1. Carregar análise"}, {"level": 3, "id": "skills-fix-bug-skill~2-verificar-se-há-teste-que-reproduz-o-bug", "text": "2. Verificar se há teste que reproduz o bug"}, {"level": 3, "id": "skills-fix-bug-skill~3-criar-teste-de-regressão", "text": "3. Criar teste de regressão"}, {"level": 3, "id": "skills-fix-bug-skill~4-implementar-a-correção", "text": "4. Implementar a correção"}, {"level": 3, "id": "skills-fix-bug-skill~5-validar", "text": "5. Validar"}, {"level": 3, "id": "skills-fix-bug-skill~6-propor-publicação", "text": "6. Propor publicação"}, {"level": 3, "id": "skills-fix-bug-skill~7-atualizar-análise-do-bug", "text": "7. Atualizar análise do bug"}, {"level": 3, "id": "skills-fix-bug-skill~8-reportar-no-chat", "text": "8. Reportar no chat"}, {"level": 2, "id": "skills-fix-bug-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-fix-bug-skill~done-when", "text": "Done When"}], "text": " fix-bug corrige um bug documentado com teste de regressão e validação local. use quando houver evidência ou análise de bug e o usuário pedir a implementação da correção; commit e pr exigem pedido de publicação. user input $arguments you must consider the user input before proceeding (if not empty). goal implementar a correção do bug seguindo o fluxo padrão (implement → test → commit → pr), garantindo cobertura por teste. inputs obrigatório: bugs/bug-&lt;nome-slug&gt;.md (análise do bug) obrigatório: código afetado (repositório local) execution steps 1. carregar análise leia bug-&lt;nome&gt;.md — causa raiz e componente afetado. identifique arquivos que precisam ser modificados. 2. verificar se há teste que reproduz o bug execute os testes existentes para o componente afetado. verifique se algum teste já cobre o cenário (e está falhando ou passando incorretamente). se não há teste que reproduza, crie um antes de corrigir (tdd). 3. criar teste de regressão crie teste que: - reproduz o bug (deve falhar com o código atual). - valida o comportamento correto (deve passar após a correção). - segue padrão de testes do repositório. 4. implementar a correção siga a direção sugerida na análise (ou ajuste se necessário). mudanças mínimas e focadas — não refatore desnecessariamente. siga convenções do repositório. 5. validar execute o teste de regressão — deve passar. execute todos os testes do componente — não deve haver regressão. verifique se o bug original está resolvido. 6. propor publicação após a correção estar validada, informe os passos de publicação: commit — use /commit com mensagem fix(&lt;escopo&gt;): &lt;descrição&gt; + refs #&lt;issue&gt; se o usuário pedir um commit. pr — use /update-pr ou proponha um novo pr somente se o usuário pedir publicação. 7. atualizar análise do bug atualize bugs/bug-&lt;nome&gt;.md : - status: 🟡 analisado → ✅ corrigido - adicione data de correção - referencie o pr/commit 8. reportar no chat resumo: bug corrigido, causa raiz, mudança realizada. teste de regressão criado. pr/commit referenciado. se a correção é parcial ou precisa de follow-up. convenções sempre crie teste antes de corrigir (ou confirme que existe). correções são mínimas — não refatore durante o fix. commit segue padrão fix(...) . se o bug tem issue, referencie no commit e pr. português. done when [ ] análise do bug carregada [ ] teste de regressão criado (ou existente validado) [ ] correção implementada e validada [ ] testes executados sem regressão [ ] próximo passo de publicação informado [ ] análise do bug atualizada com status ✅ [ ] resultado reportado no chat "}, {"id": "skills-commit-skill", "path": "skills/commit/SKILL.md", "section": "Skills", "title": "commit", "status": "", "updated": "", "html": "<h1 id=\"skills-commit-skill~commit\">commit</h1><blockquote><p>Prepara e cria um commit com escopo explícito e convenções do repositório. Use quando o usuário pedir para registrar mudanças em Git; só envie ao remoto se ele pedir push.</p></blockquote><h2 id=\"skills-commit-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-commit-skill~goal\">Goal</h2>\n<p>Criar commits claros seguindo convenções do repositório, com referência à issue quando houver.</p>\n<h2 id=\"skills-commit-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> código modificado (git status)</li>\n<li><strong>Opcional:</strong> mensagem personalizada via <code>$ARGUMENTS</code></li>\n<li><strong>Opcional:</strong> número da issue</li>\n</ul>\n<h2 id=\"skills-commit-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-commit-skill~1-verificar-estado\">1. Verificar estado</h3>\n<pre><code class=\"language-bash\">git status\ngit diff --stat\n</code></pre>\n<ul>\n<li>Identifique todos os arquivos modificados/criados/deletados.</li>\n<li>Verifique se há arquivos que não devem ser commitados (secrets, temp).</li>\n</ul>\n<h3 id=\"skills-commit-skill~2-selecionar-arquivos\">2. Selecionar arquivos</h3>\n<ul>\n<li>Adicione apenas arquivos relevantes para a feature.</li>\n<li>Nunca commite secrets, configs sensíveis ou artefatos temporários.</li>\n<li>Use <code>git add &lt;arquivo&gt;</code> para seleção explícita (evite <code>git add .</code>).</li>\n</ul>\n<h3 id=\"skills-commit-skill~3-montar-mensagem-de-commit\">3. Montar mensagem de commit</h3>\n<p>Siga a convenção do repositório:</p>\n<pre><code>&lt;tipo&gt;(&lt;escopo&gt;): &lt;descrição curta&gt;\n\n&lt;corpo opcional&gt;\n\nRefs #&lt;issue&gt;\nCo-Authored-By: Claude Sonnet 4.6 &lt;noreply@anthropic.com&gt;\n</code></pre>\n<p><strong>Tipos:</strong> <code>feat</code>, <code>fix</code>, <code>chore</code>, <code>test</code>, <code>refactor</code>, <code>docs</code>, <code>style</code>, <code>perf</code></p>\n<p><strong>Regras:</strong>\n- Primera linha: max 72 caracteres, imperativo, sem ponto final.\n- Corpo: explica o \"porquê\" (não o \"o que\").\n- Referência à issue: <code>Refs #N</code> (parcial) ou <code>Closes #N</code> (completo).\n- Co-Authored-By: quando aplicável (trabalho com IA).</p>\n<h3 id=\"skills-commit-skill~4-executar-commit\">4. Executar commit</h3>\n<ul>\n<li>Mostre os arquivos selecionados e a mensagem proposta antes do commit se o\n  usuário não tiver autorizado explicitamente o commit.</li>\n</ul>\n<pre><code class=\"language-bash\">git commit -m &quot;feat(feature-slug): descrição curta\n\nCorpo do commit explicando a mudança.\n\nRefs #N&quot;\n</code></pre>\n<h3 id=\"skills-commit-skill~5-push\">5. Push</h3>\n<ul>\n<li>Faça push apenas quando o usuário o solicitar explicitamente ou quando ele\n  tiver autorizado publicação como parte da tarefa.</li>\n<li>Antes de enviar, confirme branch remota e que não há arquivos não\n  relacionados no índice.</li>\n</ul>\n<pre><code class=\"language-bash\">git push origin &lt;branch-name&gt;\n</code></pre>\n<ul>\n<li>Não presuma que CI abre PR nem que a base é <code>develop</code>.</li>\n<li>Se houver PR manual, proponha o próximo passo; não o abra implicitamente.</li>\n</ul>\n<h3 id=\"skills-commit-skill~6-reportar-no-chat\">6. Reportar no chat</h3>\n<ul>\n<li>Hash do commit curto.</li>\n<li>Arquivos incluídos.</li>\n<li>Branch e status do push.</li>\n</ul>\n<h2 id=\"skills-commit-skill~convenções\">Convenções</h2>\n<ul>\n<li>Um commit lógico = uma unidade de mudança.</li>\n<li>Não commite \"WIP\" ou \"temp\" — limpe antes.</li>\n<li>Mensagens em português (ou inglês se for padrão do repo).</li>\n<li>Sempre referencie a issue quando existir.</li>\n</ul>\n<h2 id=\"skills-commit-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] Arquivos selecionados corretamente</li>\n<li>[ ] Mensagem segue convenção do repositório</li>\n<li>[ ] Commit realizado com sucesso</li>\n<li>[ ] Push concluído, quando solicitado</li>\n<li>[ ] Hash do commit reportado</li>\n</ul>", "toc": [{"level": 2, "id": "skills-commit-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-commit-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-commit-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-commit-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-commit-skill~1-verificar-estado", "text": "1. Verificar estado"}, {"level": 3, "id": "skills-commit-skill~2-selecionar-arquivos", "text": "2. Selecionar arquivos"}, {"level": 3, "id": "skills-commit-skill~3-montar-mensagem-de-commit", "text": "3. Montar mensagem de commit"}, {"level": 3, "id": "skills-commit-skill~4-executar-commit", "text": "4. Executar commit"}, {"level": 3, "id": "skills-commit-skill~5-push", "text": "5. Push"}, {"level": 3, "id": "skills-commit-skill~6-reportar-no-chat", "text": "6. Reportar no chat"}, {"level": 2, "id": "skills-commit-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-commit-skill~done-when", "text": "Done When"}], "text": " commit prepara e cria um commit com escopo explícito e convenções do repositório. use quando o usuário pedir para registrar mudanças em git; só envie ao remoto se ele pedir push. user input $arguments you must consider the user input before proceeding (if not empty). goal criar commits claros seguindo convenções do repositório, com referência à issue quando houver. inputs obrigatório: código modificado (git status) opcional: mensagem personalizada via $arguments opcional: número da issue execution steps 1. verificar estado git status git diff --stat identifique todos os arquivos modificados/criados/deletados. verifique se há arquivos que não devem ser commitados (secrets, temp). 2. selecionar arquivos adicione apenas arquivos relevantes para a feature. nunca commite secrets, configs sensíveis ou artefatos temporários. use git add &lt;arquivo&gt; para seleção explícita (evite git add . ). 3. montar mensagem de commit siga a convenção do repositório: &lt;tipo&gt;(&lt;escopo&gt;): &lt;descrição curta&gt; &lt;corpo opcional&gt; refs #&lt;issue&gt; co-authored-by: claude sonnet 4.6 &lt;noreply@anthropic.com&gt; tipos: feat , fix , chore , test , refactor , docs , style , perf regras: - primera linha: max 72 caracteres, imperativo, sem ponto final. - corpo: explica o \"porquê\" (não o \"o que\"). - referência à issue: refs #n (parcial) ou closes #n (completo). - co-authored-by: quando aplicável (trabalho com ia). 4. executar commit mostre os arquivos selecionados e a mensagem proposta antes do commit se o usuário não tiver autorizado explicitamente o commit. git commit -m &quot;feat(feature-slug): descrição curta corpo do commit explicando a mudança. refs #n&quot; 5. push faça push apenas quando o usuário o solicitar explicitamente ou quando ele tiver autorizado publicação como parte da tarefa. antes de enviar, confirme branch remota e que não há arquivos não relacionados no índice. git push origin &lt;branch-name&gt; não presuma que ci abre pr nem que a base é develop . se houver pr manual, proponha o próximo passo; não o abra implicitamente. 6. reportar no chat hash do commit curto. arquivos incluídos. branch e status do push. convenções um commit lógico = uma unidade de mudança. não commite \"wip\" ou \"temp\" — limpe antes. mensagens em português (ou inglês se for padrão do repo). sempre referencie a issue quando existir. done when [ ] arquivos selecionados corretamente [ ] mensagem segue convenção do repositório [ ] commit realizado com sucesso [ ] push concluído, quando solicitado [ ] hash do commit reportado "}, {"id": "skills-update-pr-skill", "path": "skills/update-pr/SKILL.md", "section": "Skills", "title": "update-pr", "status": "", "updated": "", "html": "<h1 id=\"skills-update-pr-skill~update-pr\">update-pr</h1><blockquote><p>Monta e, mediante confirmação, atualiza a descrição de um pull request com contexto, testes e desvios. Use quando o usuário pedir para preparar ou editar a descrição de um PR aberto.</p></blockquote><h2 id=\"skills-update-pr-skill~user-input\">User Input</h2>\n<pre><code class=\"language-text\">$ARGUMENTS\n</code></pre>\n<p>You <strong>MUST</strong> consider the user input before proceeding (if not empty).</p>\n<h2 id=\"skills-update-pr-skill~goal\">Goal</h2>\n<p>Atualizar a descrição do PR com contexto completo, o que foi implementado, testado e desvios documentados.</p>\n<h2 id=\"skills-update-pr-skill~contrato-de-artefatos-e-publicação\">Contrato de artefatos e publicação</h2>\n<p>Resolva os caminhos conforme <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.\nPrimeiro apresente a descrição proposta; só execute <code>gh pr edit</code> após\nconfirmação explícita. Só adicione labels que existam no repositório e tenham\nsido solicitadas.</p>\n<h2 id=\"skills-update-pr-skill~inputs\">Inputs</h2>\n<ul>\n<li><strong>Obrigatório:</strong> PR aberto (número ou branch)</li>\n<li><strong>Obrigatório:</strong> <code>.agents/spec/&lt;feature-slug&gt;/SPEC.md</code></li>\n<li><strong>Obrigatório:</strong> contexto das tasks implementadas</li>\n<li><strong>Opcional:</strong> <code>teamwork/plan/feature-plan-&lt;feature-slug&gt;/desvios.md</code></li>\n</ul>\n<h2 id=\"skills-update-pr-skill~execution-steps\">Execution Steps</h2>\n<h3 id=\"skills-update-pr-skill~1-localizar-o-pr\">1. Localizar o PR</h3>\n<ul>\n<li>Se <code>$ARGUMENTS</code> contém número, use-o.</li>\n<li>Caso contrário, encontre o PR da branch atual:\n  <code>bash\n  gh pr list --head &lt;branch-name&gt; --json number,title</code></li>\n</ul>\n<h3 id=\"skills-update-pr-skill~2-coletar-contexto\">2. Coletar contexto</h3>\n<ul>\n<li>Leia a SPEC — contexto técnico.</li>\n<li>Leia <code>desvios.md</code> se existir — desvios documentados.</li>\n<li>Extraia lista de commits:\n  <code>bash\n  gh pr view &lt;number&gt; --json commits</code></li>\n<li>Identifique arquivos modificados:\n  <code>bash\n  gh pr diff &lt;number&gt; --stat</code></li>\n</ul>\n<h3 id=\"skills-update-pr-skill~3-montar-descrição-do-pr\">3. Montar descrição do PR</h3>\n<p>Gere a descrição seguindo template do time:</p>\n<pre><code class=\"language-markdown\">## Resumo\n\n&lt;descrição objetiva do que esta PR faz e por quê&gt;\n\n## Contexto\n\n&lt;problema de negócio que a feature resolve, referenciando PRD&gt;\n\n## O que foi implementado\n\n- [x] &lt;item 1&gt;\n- [x] &lt;item 2&gt;\n- [ ] &lt;item 3&gt; (se entrega parcial)\n\n## Como testar\n\n&lt;passos concretos de validação&gt;\n\n1. &lt;passo 1&gt;\n2. &lt;passo 2&gt;\n3. &lt;resultado esperado&gt;\n\n## Testes executados\n\n- [ ] Unitários: &lt;resultado&gt;\n- [ ] Integração: &lt;resultado&gt;\n- [ ] E2E: &lt;resultado&gt; (se aplicável)\n\n## Desvios documentados\n\n&lt;se houver desvios do planejado, documente aqui&gt;\n&lt;referencie desvios.md se extenso&gt;\n\n## Artefatos\n\n- PRD: `.agents/prd/&lt;feature&gt;/PRD.md`\n- SPEC: `.agents/spec/&lt;feature&gt;/SPEC.md`\n- Tracking: `teamwork/plan/feature-plan-&lt;name&gt;/tracking.md`\n\n## Checklist\n\n- [ ] Código segue convenções do repositório\n- [ ] Testes passando\n- [ ] PRD/SPEC atualizados (se aplicável)\n- [ ] Sem secrets ou dados sensíveis\n- [ ] Documentation atualizada (se aplicável)\n\nCloses #N\n</code></pre>\n<h3 id=\"skills-update-pr-skill~4-atualizar-o-pr-após-confirmação\">4. Atualizar o PR após confirmação</h3>\n<pre><code class=\"language-bash\">gh pr edit &lt;number&gt; --body-file &lt;arquivo-temporario-confirmado&gt;\n</code></pre>\n<h3 id=\"skills-update-pr-skill~5-adicionar-labels-solicitadas-se-aplicável\">5. Adicionar labels solicitadas (se aplicável)</h3>\n<pre><code class=\"language-bash\">gh label list\ngh pr edit &lt;number&gt; --add-label &quot;&lt;label-existente-e-solicitada&gt;&quot;\n</code></pre>\n<h3 id=\"skills-update-pr-skill~6-reportar-no-chat\">6. Reportar no chat</h3>\n<ul>\n<li>Número e título do PR.</li>\n<li>Resumo do que foi preenchido.</li>\n<li>Status (pronto para review / precisa de ajustes).</li>\n</ul>\n<h2 id=\"skills-update-pr-skill~convenções\">Convenções</h2>\n<ul>\n<li>Descrição do PR é a fonte de contexto para revisores.</li>\n<li>Sempre referencie a issue com <code>Closes #N</code> ou <code>Refs #N</code>.</li>\n<li>Desvios devem ser transparentes — não esconda.</li>\n<li>Português para documentação.</li>\n</ul>\n<h2 id=\"skills-update-pr-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] Descrição do PR atualizada com template completo</li>\n<li>[ ] Contexto, implementação, testes e desvios documentados</li>\n<li>[ ] Referência à issue incluída</li>\n<li>[ ] Labels aplicadas (se aplicável)</li>\n<li>[ ] Status reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-update-pr-skill~user-input", "text": "User Input"}, {"level": 2, "id": "skills-update-pr-skill~goal", "text": "Goal"}, {"level": 2, "id": "skills-update-pr-skill~contrato-de-artefatos-e-publicação", "text": "Contrato de artefatos e publicação"}, {"level": 2, "id": "skills-update-pr-skill~inputs", "text": "Inputs"}, {"level": 2, "id": "skills-update-pr-skill~execution-steps", "text": "Execution Steps"}, {"level": 3, "id": "skills-update-pr-skill~1-localizar-o-pr", "text": "1. Localizar o PR"}, {"level": 3, "id": "skills-update-pr-skill~2-coletar-contexto", "text": "2. Coletar contexto"}, {"level": 3, "id": "skills-update-pr-skill~3-montar-descrição-do-pr", "text": "3. Montar descrição do PR"}, {"level": 3, "id": "skills-update-pr-skill~4-atualizar-o-pr-após-confirmação", "text": "4. Atualizar o PR após confirmação"}, {"level": 3, "id": "skills-update-pr-skill~5-adicionar-labels-solicitadas-se-aplicável", "text": "5. Adicionar labels solicitadas (se aplicável)"}, {"level": 3, "id": "skills-update-pr-skill~6-reportar-no-chat", "text": "6. Reportar no chat"}, {"level": 2, "id": "skills-update-pr-skill~convenções", "text": "Convenções"}, {"level": 2, "id": "skills-update-pr-skill~done-when", "text": "Done When"}], "text": " update-pr monta e, mediante confirmação, atualiza a descrição de um pull request com contexto, testes e desvios. use quando o usuário pedir para preparar ou editar a descrição de um pr aberto. user input $arguments you must consider the user input before proceeding (if not empty). goal atualizar a descrição do pr com con rário, encontre o PR da branch atual:\n  <code>bash\n  gh pr list --head &lt;branch-name&gt; --json number,title,state</code></li>\n</ul>\n<h3 id=\"skills-check-pr-skill~2-coletar-informações-do-pr\">2. Coletar informações do PR</h3>\n<pre><code class=\"language-bash\"># Status geral\ngh pr view &lt;number&gt; --json state,reviewDecision,mergedAt,closedAt,isDraft\n\n# Reviews\ngh pr view &lt;number&gt; --json reviews --jq '.reviews[] | {author: .author.login, state: .state, body: .body}'\n\n# Repositório das threads\nOWNER=$(gh repo view --json owner --jq '.owner.login')\nREPO=$(gh repo view --json name --jq '.name')\n\n# Threads inline (inclui caminho, linha e resolução)\ngh api graphql -f query='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo) { pullRequest(number:$number) { reviewThreads(first:100) { nodes { isResolved comments(first:100) { nodes { author { login } body path line } } } } } } }' -f owner=&quot;$OWNER&quot; -f repo=&quot;$REPO&quot; -F number=&lt;number&gt;\n\n# Check CI\ngh pr checks &lt;number&gt;\n</code></pre>\n<h3 id=\"skills-check-pr-skill~3-analisar-status\">3. Analisar status</h3>\n<h4 id=\"skills-check-pr-skill~reviews\">Reviews</h4>\n<table>\n<thead>\n<tr>\n<th>Revisor</th>\n<th>Status</th>\n<th>Ação</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>reviewer1</td>\n<td>✅ APPROVED</td>\n<td>—</td>\n</tr>\n<tr>\n<td>reviewer2</td>\n<td>🔄 CHANGES_REQUESTED</td>\n<td>Verificar comentários</td>\n</tr>\n<tr>\n<td>reviewer3</td>\n<td>⏳ PENDING</td>\n<td>Aguardando</td>\n</tr>\n</tbody>\n</table>\n<h4 id=\"skills-check-pr-skill~comentários-não-resolvidos\">Comentários não resolvidos</h4>\n<table>\n<thead>\n<tr>\n<th>Comentário</th>\n<th>Arquivo</th>\n<th>Linha</th>\n<th>Resolvido?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>...</td>\n<td>...</td>\n<td>...</td>\n<td>✅ / ❌</td>\n</tr>\n</tbody>\n</table>\n<h4 id=\"skills-check-pr-skill~cicd\">CI/CD</h4>\n<table>\n<thead>\n<tr>\n<th>Check</th>\n<th>Status</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>build</td>\n<td>✅ / ❌</td>\n</tr>\n<tr>\n<td>test</td>\n<td>✅ / ❌</td>\n</tr>\n<tr>\n<td>lint</td>\n<td>✅ / ❌</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"skills-check-pr-skill~4-identificar-pendências\">4. Identificar pendências</h3>\n<ul>\n<li>Threads inline não resolvidas; não infira resolução a partir de comentários gerais.</li>\n<li>Checks CI falhando.</li>\n<li>Draft status (se aplicável).</li>\n<li>Merge blockers (proteção de branch, approvals faltando).</li>\n</ul>\n<h3 id=\"skills-check-pr-skill~5-gerar-resumo\">5. Gerar resumo</h3>\n<pre><code class=\"language-markdown\"># Status do PR #&lt;number&gt; — &lt;Título&gt;\n\n**Branch:** &lt;branch&gt;\n**Estado:** Open / Draft / Approved / Changes Requested\n\n---\n\n## Reviews\n\n| Revisor | Status | Data |\n|---------|--------|------|\n| ... | ... | ... |\n\n## Pendências\n\n### Comentários a Resolver\n- [ ] &lt;comentário 1&gt; — &lt;arquivo&gt;:&lt;linha&gt;\n- [ ] &lt;comentário 2&gt; — &lt;arquivo&gt;:&lt;linha&gt;\n\n### CI/CD\n- [ ] &lt;check que falhou&gt; — &lt;erro&gt;\n\n### Aprovações\n- ✅ X de Y aprovações necessárias\n\n## Próximos Passos\n\n1. &lt;ação 1&gt;\n2. &lt;ação 2&gt;\n</code></pre>\n<h3 id=\"skills-check-pr-skill~6-reportar-no-chat\">6. Reportar no chat</h3>\n<ul>\n<li>Resumo: status geral, aprovações, pendências.</li>\n<li>Comentários que precisam de ação.</li>\n<li>Checks CI que estão falhando.</li>\n<li>Estimativa de pronto para merge.</li>\n</ul>\n<h2 id=\"skills-check-pr-skill~convenções\">Convenções</h2>\n<ul>\n<li>Não modifique o PR — apenas leitura.</li>\n<li>Status é snapshot no momento da consulta.</li>\n<li>Português.</li>\n</ul>\n<h2 id=\"skills-check-pr-skill~done-when\">Done When</h2>\n<ul>\n<li>[ ] Status do PR verificado (reviews, comments, CI)</li>\n<li>[ ] Pendências identificadas e listadas</li>\n<li>[ ] Resumo de próximos passos gerado</li>\n<li>[ ] Status reportado no chat</li>\n</ul>", "toc": [{"level": 2, "id": "skills-check-pr-skill~us
