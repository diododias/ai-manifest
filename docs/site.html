<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Team — documentação</title>
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f7f8fa; --bg-sunk: #eef1f5;
    --fg: #16191d; --fg-soft: #5b6472; --fg-faint: #8b95a3;
    --line: #e2e6ec; --line-strong: #cbd2dc;
    --accent: #2563eb; --accent-soft: #dbeafe;
    --canonical: #047857; --canonical-bg: #d1fae5;
    --proposed: #b45309; --proposed-bg: #fef3c7;
    --reference: #4f46e5; --reference-bg: #e0e7ff;
    --sidebar: 290px; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --bg-soft: #161a20; --bg-sunk: #1c222a;
      --fg: #e6e9ee; --fg-soft: #a3adba; --fg-faint: #6d7885;
      --line: #262c35; --line-strong: #333b46;
      --accent: #60a5fa; --accent-soft: #1e3a5f;
      --canonical: #6ee7b7; --canonical-bg: #064e3b;
      --proposed: #fcd34d; --proposed-bg: #78350f;
      --reference: #a5b4fc; --reference-bg: #312e81;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- layout ---------- */
  .shell { display: flex; min-height: 100vh; }
  aside {
    width: var(--sidebar); flex: 0 0 var(--sidebar); border-right: 1px solid var(--line);
    background: var(--bg-soft); height: 100vh; position: sticky; top: 0;
    display: flex; flex-direction: column;
  }
  .brand { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 15px; letter-spacing: -0.01em; }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--fg-faint); }
  .search { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .search input {
    width: 100%; padding: 8px 11px; font-size: 13px; font-family: inherit;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--bg); color: var(--fg);
  }
  .search input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  nav { flex: 1; overflow-y: auto; padding: 10px 10px 40px; }
  nav .group {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
    color: var(--fg-faint); padding: 16px 10px 6px;
  }
  nav a {
    display: block; padding: 6px 10px; margin: 1px 0; border-radius: 6px;
    color: var(--fg-soft); text-decoration: none; font-size: 13.5px; line-height: 1.4;
  }
  nav a:hover { background: var(--bg-sunk); color: var(--fg); }
  nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav a.hidden { display: none; }

  main { flex: 1; min-width: 0; display: flex; justify-content: center; }
  .doc { width: 100%; max-width: 860px; padding: 44px 44px 140px; }
  .doc.wide { max-width: 1180px; }

  /* ---------- cabeçalho do documento ---------- */
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .badge {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 20px;
  }
  .badge.canonical { color: var(--canonical); background: var(--canonical-bg); }
  .badge.proposed  { color: var(--proposed);  background: var(--proposed-bg); }
  .badge.reference { color: var(--reference); background: var(--reference-bg); }
  .path { font-family: var(--mono); font-size: 11.5px; color: var(--fg-faint); }

  /* ---------- conteúdo ---------- */
  .doc h1 { font-size: 31px; line-height: 1.2; letter-spacing: -0.02em; margin: 6px 0 20px; }
  .doc h2 {
    font-size: 22px; letter-spacing: -0.01em; margin: 46px 0 14px;
    padding-top: 18px; border-top: 1px solid var(--line);
  }
  .doc h3 { font-size: 17px; margin: 30px 0 10px; }
  .doc h4 { font-size: 14.5px; margin: 22px 0 8px; color: var(--fg-soft); }
  .doc p { margin: 0 0 14px; }
  .doc a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  .doc a:hover { border-bottom-color: currentColor; }
  .doc a.ext { color: var(--fg-soft); border-bottom: 1px dotted var(--line-strong); }
  .doc blockquote {
    margin: 0 0 24px; padding: 12px 18px; border-left: 3px solid var(--accent);
    background: var(--bg-soft); border-radius: 0 8px 8px 0; color: var(--fg-soft);
  }
  .doc blockquote p:last-child { margin: 0; }
  .doc ul, .doc ol { margin: 0 0 16px; padding-left: 22px; }
  .doc li { margin: 4px 0; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 34px 0; }
  .doc code {
    font-family: var(--mono); font-size: .87em; background: var(--bg-sunk);
    padding: 1.5px 5px; border-radius: 4px;
  }
  .doc pre {
    background: var(--bg-sunk); border: 1px solid var(--line); border-radius: 9px;
    padding: 14px 16px; overflow-x: auto; margin: 0 0 20px; font-size: 12.5px; line-height: 1.55;
  }
  .doc pre code { background: none; padding: 0; }
  .doc table {
    border-collapse: collapse; width: 100%; margin: 0 0 22px; font-size: 14px;
    display: block; overflow-x: auto;
  }
  .doc th, .doc td {
    border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top;
  }
  .doc th { background: var(--bg-soft); font-weight: 650; white-space: nowrap; }
  .doc tr:nth-child(even) td { background: var(--bg-soft); }
  .doc details { margin: 0 0 18px; }
  .doc summary { cursor: pointer; font-size: 13px; color: var(--fg-soft); }

  /* ---------- mermaid ---------- */
  .mermaid-wrap {
    position: relative; margin: 0 0 26px; padding: 18px; border: 1px solid var(--line);
    border-radius: 11px; background: var(--bg-soft); overflow-x: auto;
  }
  pre.mermaid { background: none; border: 0; padding: 0; margin: 0; text-align: center; }
  pre.mermaid[data-processed] ~ .mermaid-src { display: block; }
  pre.mermaid svg { max-width: 100%; height: auto; }
  .mermaid-wrap.zoomed pre.mermaid { text-align: left; }
  .mermaid-tools {
    display: none; align-items: center; justify-content: flex-end;
    gap: 5px; margin: -4px 0 10px;
  }
  .mermaid-wrap:has(pre.mermaid[data-processed]) .mermaid-tools { display: flex; }
  .mermaid-tools button {
    font: inherit; font-size: 12px; line-height: 1; color: var(--fg-soft); cursor: pointer;
    background: var(--bg); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 5px 9px; min-width: 28px;
  }
  .mermaid-tools button:hover { border-color: var(--accent); color: var(--accent); }
  .mermaid-tools span {
    font-size: 11px; color: var(--fg-faint); min-width: 58px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .mermaid-src { display: none; margin: 14px 0 0; }
  .mermaid-src pre { margin: 8px 0 0; }

  /* ---------- busca ---------- */
  .results { padding: 4px 0; }
  .results .hit { display: block; padding: 9px 10px; border-radius: 7px; text-decoration: none; }
  .results .hit:hover { background: var(--bg-sunk); }
  .results .hit strong { display: block; font-size: 13.5px; color: var(--fg); }
  .results .hit span { font-size: 11.5px; color: var(--fg-faint); }
  .empty { padding: 14px 10px; font-size: 13px; color: var(--fg-faint); }

  /* ---------- rodapé de navegação ---------- */
  .pager { display: flex; justify-content: space-between; gap: 14px; margin-top: 56px;
           padding-top: 22px; border-top: 1px solid var(--line); }
  .pager a {
    flex: 1; padding: 12px 16px; border: 1px solid var(--line); border-radius: 9px;
    text-decoration: none; color: var(--fg); font-size: 13.5px; background: var(--bg-soft);
  }
  .pager a:hover { border-color: var(--accent); }
  .pager a small { display: block; color: var(--fg-faint); font-size: 11px; margin-bottom: 2px; }
  .pager a.next { text-align: right; }
  .pager .spacer { flex: 1; }

  /* ---------- mobile ---------- */
  .menu-btn {
    display: none; position: fixed; z-index: 30; top: 12px; left: 12px;
    width: 40px; height: 40px; border-radius: 9px; border: 1px solid var(--line-strong);
    background: var(--bg); color: var(--fg); font-size: 17px; cursor: pointer;
  }
  @media (max-width: 900px) {
    .menu-btn { display: block; }
    aside {
      position: fixed; z-index: 25; transform: translateX(-100%);
      transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.18);
    }
    aside.open { transform: none; }
    .doc { padding: 66px 20px 100px; }
  }
  @media print {
    aside, .menu-btn, .pager { display: none; }
    .doc { max-width: none; padding: 0; }
  }
</style>
</head>

<script>
const PAGES = [{"id": "readme", "path": "README.md", "section": "Visão geral", "title": "O que é o Agent Team", "status": "", "updated": "", "html": "<h1 id=\"readme~agent-team\">Agent Team</h1>\n<blockquote>\n<p>Framework operacional para um núcleo humano de <strong>Product Manager, UX e Tech Lead</strong> dirigir agentes especializados ao longo de todo o ciclo de desenvolvimento de software.</p>\n</blockquote>\n<h2 id=\"readme~em-2-minutos\">Em 2 minutos</h2>\n<p>Times pequenos que adotam agentes de IA costumam esbarrar no mesmo limite: a geração de código deixa de ser o gargalo, e o gargalo passa a ser decidir o que construir, garantir que foi construído certo e manter decisões, código e documentação sincronizados. O Agent Team existe para resolver esse segundo problema.</p>\n<p>A proposta é tratar o desenvolvimento como um sistema operado por três pessoas, e não executado por elas. O trio humano define intenção, prioridade, risco e aprovação; agentes especializados pesquisam, especificam, implementam, criticam, validam e documentam dentro de escopo autorizado. Entre uma fase e outra, o contexto não passa por conversa: passa por <strong>artefatos versionados</strong> com owner, gate e evidência.</p>\n<table>\n<thead>\n<tr>\n<th>Peça</th>\n<th>O que é</th>\n<th>Onde vive</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Modelo operacional</strong></td>\n<td>Papéis, direitos de decisão, gates e níveis de autonomia</td>\n<td><a href=\"#docs-operating-model\"><code>docs/operating-model.md</code></a></td>\n</tr>\n<tr>\n<td><strong>Workflows</strong></td>\n<td>Contrato de colaboração multiagente em cada uma das 11 etapas da jornada</td>\n<td><a href=\"#docs-workflows-readme\"><code>docs/workflows/</code></a></td>\n</tr>\n<tr>\n<td><strong>Agentes</strong></td>\n<td>23 papéis com identidade, contrato, permissões e skills esperadas</td>\n<td><a href=\"#docs-agents-catalog\"><code>docs/agents/</code></a></td>\n</tr>\n<tr>\n<td><strong>Skills</strong></td>\n<td>Procedimentos repetíveis de discovery, especificação, implementação e publicação</td>\n<td><a href=\"#skills-readme\"><code>skills/</code></a></td>\n</tr>\n<tr>\n<td><strong>Repo harness</strong></td>\n<td>O que um repositório precisa ter para ser operado por agentes com segurança</td>\n<td><a href=\"#docs-repo-harness\"><code>docs/repo-harness.md</code></a></td>\n</tr>\n<tr>\n<td><strong>Workspaces</strong></td>\n<td>Onde PM, UX e Tech Lead efetivamente pilotam o fluxo</td>\n<td><a href=\"#workspaces-readme\"><code>workspaces/</code></a></td>\n</tr>\n</tbody>\n</table>\n<p>Três ideias sustentam o resto: quem propõe uma mudança não é quem a aprova; aprovação exige evidência explícita, nunca silêncio; e autonomia só cresce quando gates e métricas demonstram que é seguro.</p>\n<hr>\n<h2 id=\"readme~por-onde-começar\">Por onde começar</h2>\n<p>Escolha a trilha pelo tempo que você tem agora.</p>\n<table>\n<thead>\n<tr>\n<th>Você quer…</th>\n<th>Leia</th>\n<th>Tempo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Entender a proposta e decidir se vale investigar</td>\n<td>esta seção e o <a href=\"#docs-readme\">índice da documentação</a></td>\n<td>5 min</td>\n</tr>\n<tr>\n<td>Ver o fluxo de ponta a ponta em diagrama</td>\n<td><a href=\"#docs-end-to-end-journey\">fluxo da jornada</a></td>\n<td>10 min</td>\n</tr>\n<tr>\n<td>Entender papéis, decisões e limites de autonomia</td>\n<td><a href=\"#docs-operating-model\">modelo operacional</a></td>\n<td>25 min</td>\n</tr>\n<tr>\n<td>Executar uma etapa específica com agentes</td>\n<td>o <a href=\"#docs-workflows-readme\">workflow</a> correspondente</td>\n<td>5 min por etapa</td>\n</tr>\n<tr>\n<td>Montar seus próprios agentes</td>\n<td><a href=\"#docs-agents-catalog\">catálogo</a> e <a href=\"#docs-agents-readme\">pacotes importáveis</a></td>\n<td>30 min</td>\n</tr>\n<tr>\n<td>Saber qual procedimento roda em cada etapa</td>\n<td><a href=\"#skills-readme\">catálogo de skills</a></td>\n<td>15 min</td>\n</tr>\n<tr>\n<td>Preparar um repositório para ser operado por agentes</td>\n<td><a href=\"#docs-repo-harness\">repo harness</a></td>\n<td>20 min</td>\n</tr>\n<tr>\n<td>Copiar a estrutura de trabalho para o seu time</td>\n<td><a href=\"#workspaces-readme\">workspaces de exemplo</a></td>\n<td>20 min</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"readme~como-o-sistema-funciona\">Como o sistema funciona</h2>\n<h3 id=\"readme~o-trio-dirige-os-agentes-executam\">O trio dirige, os agentes executam</h3>\n<p>Cada domínio tem um dono humano inequívoco, e essa separação é o que permite delegar sem perder controle.</p>\n<table>\n<thead>\n<tr>\n<th>Papel</th>\n<th>Dirige</th>\n<th>Decide sozinho</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Product Manager</strong></td>\n<td>Valor, prioridade, requisitos e outcome</td>\n<td>prioridade, escopo e aceite de produto</td>\n</tr>\n<tr>\n<td><strong>UX</strong></td>\n<td>Evidência sobre o usuário, jornada e qualidade de uso</td>\n<td>experiência, acessibilidade e aceite de UX</td>\n</tr>\n<tr>\n<td><strong>Tech Lead</strong></td>\n<td>Viabilidade, arquitetura, qualidade técnica e risco</td>\n<td>arquitetura, exceções técnicas, merge e release</td>\n</tr>\n</tbody>\n</table>\n<p>Os agentes não decidem: eles preparam a decisão. Um agente primário conduz e consolida o artefato da fase, agentes adversariais procuram ambiguidade, risco e suposição frágil, e o owner humano resolve as divergências que sobram.</p>\n<h3 id=\"readme~a-jornada-tem-gates-não-etapas-soltas\">A jornada tem gates, não etapas soltas</h3>\n<p>Cada fase declara entrada, saída, owner e critério de passagem. Um item só avança quando o gate anterior produziu evidência.</p>\n<table>\n<thead>\n<tr>\n<th>Fase</th>\n<th>Resultado esperado</th>\n<th>Referência</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Intake e triagem</td>\n<td>necessidade registrada, deduplicada e priorizada</td>\n<td><a href=\"#docs-workflows-00-intake-and-triage\"><code>00</code></a></td>\n</tr>\n<tr>\n<td>Descoberta</td>\n<td>problema, requisitos, regras, cenários, métricas e lacunas explícitas</td>\n<td><a href=\"#docs-workflows-01-discovery-and-research\"><code>01</code></a> · <a href=\"#skills-business-discovery-skill\"><code>business-discovery</code></a></td>\n</tr>\n<tr>\n<td>Produto e UX</td>\n<td>objetivo, escopo, jornada e critérios de aceite observáveis</td>\n<td><a href=\"#docs-workflows-02-product-and-ux-planning\"><code>02</code></a></td>\n</tr>\n<tr>\n<td>Especificação técnica</td>\n<td>opções, riscos, plano técnico e contratos verificáveis</td>\n<td><a href=\"#docs-workflows-03-technical-specification\"><code>03</code></a> · <a href=\"#skills-create-spec-skill\"><code>create-spec</code></a></td>\n</tr>\n<tr>\n<td>Implementação</td>\n<td>código e testes dentro do escopo autorizado</td>\n<td><a href=\"#docs-workflows-04-autonomous-implementation\"><code>04</code></a> · <a href=\"#skills-implement-skill\"><code>implement</code></a></td>\n</tr>\n<tr>\n<td>Validação adversarial</td>\n<td>falhas encontradas por instância independente</td>\n<td><a href=\"#docs-workflows-05-adversarial-validation\"><code>05</code></a> · <a href=\"#skills-code-review-skill\"><code>code-review</code></a></td>\n</tr>\n<tr>\n<td>PR e merge</td>\n<td>mudança rastreável, revisada e integrada</td>\n<td><a href=\"#docs-workflows-06-pr-and-merge\"><code>06</code></a> · <a href=\"#skills-update-pr-skill\"><code>update-pr</code></a></td>\n</tr>\n<tr>\n<td>Homologação</td>\n<td>evidência de aceite antes da exposição</td>\n<td><a href=\"#docs-workflows-07-release-candidate-validation\"><code>07</code></a></td>\n</tr>\n<tr>\n<td>Entrega e observação</td>\n<td>rollout observado, com rollback pronto</td>\n<td><a href=\"#docs-workflows-08-production-release-and-observation\"><code>08</code></a></td>\n</tr>\n<tr>\n<td>Conhecimento</td>\n<td>base atualizada e aprendizado registrado</td>\n<td><a href=\"#docs-workflows-09-knowledge-curation\"><code>09</code></a> · <a href=\"#skills-update-docs-skill\"><code>update-docs</code></a></td>\n</tr>\n<tr>\n<td>Melhoria contínua</td>\n<td>telemetria convertida em demanda priorizada</td>\n<td><a href=\"#docs-workflows-10-continuous-improvement\"><code>10</code></a></td>\n</tr>\n</tbody>\n</table>\n<p>A skill <a href=\"#skills-dev-flow-skill\"><code>dev-flow</code></a> orquestra uma entrega completa quando o item não exige condução manual fase a fase.</p>\n<h3 id=\"readme~o-workspace-é-o-ponto-de-trabalho\">O workspace é o ponto de trabalho</h3>\n<p><code>workspaces/&lt;pm|ux|tech-lead&gt;/</code> não é material de referência: é onde cada papel humano e seus agentes rodam o fluxo de verdade. Cada workspace mantém <code>AGENTS.md</code> (como operar), <code>BOARD.md</code> (Work Items em andamento), <code>memory.md</code> (retomada de contexto) e <code>projects/&lt;project&gt;/</code> (artefatos reais de cada iniciativa).</p>\n<p>Ao iniciar uma missão, o agente lê o <code>AGENTS.md</code> do workspace, identifica as skills aplicáveis e segue a estrutura de <code>projects/</code> em vez de inventar convenções próprias. Três skills sustentam essa operação:</p>\n<table>\n<thead>\n<tr>\n<th>Skill</th>\n<th>Garante</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#skills-workspace-memory-skill\"><code>workspace-memory</code></a></td>\n<td>retomada e registro seguro de memória operacional</td>\n</tr>\n<tr>\n<td><a href=\"#skills-workspace-projects-skill\"><code>workspace-projects</code></a></td>\n<td>fonte canônica correta e assets de sessão isolados em <code>plans/assets/</code></td>\n</tr>\n<tr>\n<td><a href=\"#skills-workspace-board-skill\"><code>workspace-board</code></a></td>\n<td>seleção, transição e reconciliação de Work Items</td>\n</tr>\n</tbody>\n</table>\n<p>As skills de domínio continuam obrigatórias quando se aplicam à missão. O agente declara no resultado e no handoff quais skills usou — o <a href=\"#docs-agents-catalog\">catálogo</a> define, por papel, quais são esperadas em cada etapa.</p>\n<hr>\n<h2 id=\"readme~estrutura-do-repositório\">Estrutura do repositório</h2>\n<pre><code class=\"language-text\">.\n├── docs/\n│   ├── operating-model.md         # fonte canônica: papéis, decisões e ciclo\n│   ├── operating-model-90-10.md   # gates, risco e autonomia progressiva\n│   ├── repo-harness.md            # o contrato executável de um repositório\n│   ├── end-to-end-journey.md      # a jornada completa em um diagrama\n│   ├── journey-by-phase.md        # a mesma jornada, um bloco por vez\n│   ├── documentation-standard.md  # como escrever documentação aqui\n│   ├── site.html                  # documentação navegável em página única\n│   ├── agents/                    # catálogo e pacotes executáveis por agente\n│   ├── workflows/                 # contratos de colaboração multiagente por etapa\n│   └── diagrams/                  # organização do workspace e fontes de verdade\n├── workspaces/        # ponto de trabalho do trio: pm/, ux/, tech-lead/\n├── skills/            # 22 procedimentos: discovery, engenharia, revisão e publicação\n│   ├── README.md      # catálogo por etapa da jornada\n│   └── &lt;skill&gt;/       # SKILL.md com entrada, passos, saída e critério de conclusão\n└── scripts/           # automações de apoio, incluindo o gerador de docs/site.html\n</code></pre>\n<hr>\n<h2 id=\"readme~estado-do-projeto\">Estado do projeto</h2>\n<p>Este é um modelo operacional em evolução. Cada documento declara seu estado no front matter, e o estado define o peso que ele tem em uma decisão.</p>\n<table>\n<thead>\n<tr>\n<th>Estado</th>\n<th>Significado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>canonical</code></td>\n<td>referência principal vigente</td>\n</tr>\n<tr>\n<td><code>proposed</code></td>\n<td>proposta pronta para validação em piloto</td>\n</tr>\n<tr>\n<td><code>reference</code></td>\n<td>material de apoio à compreensão ou apresentação</td>\n</tr>\n</tbody>\n</table>\n<p>O repositório documenta apenas o fluxo vigente. Não há estado <code>archived</code> nem pasta de material histórico: o que deixa de valer é removido no mesmo PR que o substitui, e o histórico fica no Git.</p>\n<hr>\n<h2 id=\"readme~como-contribuir\">Como contribuir</h2>\n<ol>\n<li>Faça um fork e crie uma branch para a mudança.</li>\n<li>Atualize primeiro a fonte canônica relevante e depois os materiais especializados que ela afeta.</li>\n<li>Preserve os contratos entre agentes, os gates e os links de navegação.</li>\n<li>Siga o <a href=\"#docs-documentation-standard\">padrão de documentação</a> — em especial as duas camadas e os limites de formatação.</li>\n<li>Valide os links e abra um Pull Request descrevendo as evidências da alteração.</li>\n</ol>\n<h2 id=\"readme~licença\">Licença</h2>\n<p>Este projeto está sob a licença MIT.</p>", "toc": [{"level": 2, "id": "readme~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "readme~por-onde-começar", "text": "Por onde começar"}, {"level": 2, "id": "readme~como-o-sistema-funciona", "text": "Como o sistema funciona"}, {"level": 3, "id": "readme~o-trio-dirige-os-agentes-executam", "text": "O trio dirige, os agentes executam"}, {"level": 3, "id": "readme~a-jornada-tem-gates-não-etapas-soltas", "text": "A jornada tem gates, não etapas soltas"}, {"level": 3, "id": "readme~o-workspace-é-o-ponto-de-trabalho", "text": "O workspace é o ponto de trabalho"}, {"level": 2, "id": "readme~estrutura-do-repositório", "text": "Estrutura do repositório"}, {"level": 2, "id": "readme~estado-do-projeto", "text": "Estado do projeto"}, {"level": 2, "id": "readme~como-contribuir", "text": "Como contribuir"}, {"level": 2, "id": "readme~licença", "text": "Licença"}], "text": " agent team framework operacional para um núcleo humano de product manager, ux e tech lead dirigir agentes especializados ao longo de todo o ciclo de desenvolvimento de software. em 2 minutos times pequenos que adotam agentes de ia costumam esbarrar no mesmo limite: a geração de código deixa de ser o gargalo, e o gargalo passa a ser decidir o que construir, garantir que foi construído certo e manter decisões, código e documentação sincronizados. o agent team existe para resolver esse segundo problema. a proposta é tratar o desenvolvimento como um sistema operado por três pessoas, e não executado por elas. o trio humano define intenção, prioridade, risco e aprovação; agentes especializados pesquisam, especificam, implementam, criticam, validam e documentam dentro de escopo autorizado. entre uma fase e outra, o contexto não passa por conversa: passa por artefatos versionados com owner, gate e evidência. peça o que é onde vive modelo operacional papéis, direitos de decisão, gates e níveis de autonomia docs/operating-model.md workflows contrato de colaboração multiagente em cada uma das 11 etapas da jornada docs/workflows/ agentes 23 papéis com identidade, contrato, permissões e skills esperadas docs/agents/ skills procedimentos repetíveis de discovery, especificação, implementação e publicação skills/ repo harness o que um repositório precisa ter para ser operado por agentes com segurança docs/repo-harness.md workspaces onde pm, ux e tech lead efetivamente pilotam o fluxo workspaces/ três ideias sustentam o resto: quem propõe uma mudança não é quem a aprova; aprovação exige evidência explícita, nunca silêncio; e autonomia só cresce quando gates e métricas demonstram que é seguro. por onde começar escolha a trilha pelo tempo que você tem agora. você quer… leia tempo entender a proposta e decidir se vale investigar esta seção e o índice da documentação 5 min ver o fluxo de ponta a ponta em diagrama fluxo da jornada 10 min entender papéis, decisões e limites de autonomia modelo operacional 25 min executar uma etapa específica com agentes o workflow correspondente 5 min por etapa montar seus próprios agentes catálogo e pacotes importáveis 30 min saber qual procedimento roda em cada etapa catálogo de skills 15 min preparar um repositório para ser operado por agentes repo harness 20 min copiar a estrutura de trabalho para o seu time workspaces de exemplo 20 min como o vante. Se preferir navegar tudo em uma única página, com busca e diagramas renderizados, abra <a href=\"site.html\" class=\"ext\" title=\"docs/site.html — arquivo do repositório\"><code>site.html</code></a> no navegador.</p>\n<table>\n<thead>\n<tr>\n<th>Corpo</th>\n<th>Responde</th>\n<th>Estado predominante</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-operating-model\">modelo operacional</a></td>\n<td>Como o sistema funciona e quem decide o quê</td>\n<td><code>canonical</code></td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-readme\"><code>workflows/</code></a></td>\n<td>Como cada etapa é executada por agentes</td>\n<td><code>proposed</code></td>\n</tr>\n<tr>\n<td><a href=\"#docs-agents-catalog\"><code>agents/</code></a></td>\n<td>Quem são os agentes e quais contratos seguem</td>\n<td><code>proposed</code></td>\n</tr>\n<tr>\n<td><a href=\"#skills-readme\"><code>skills/</code></a></td>\n<td>Quais procedimentos os agentes executam</td>\n<td><code>canonical</code></td>\n</tr>\n<tr>\n<td><a href=\"#docs-repo-harness\">repo harness</a></td>\n<td>O que um repositório precisa ter para ser operável por agentes</td>\n<td><code>proposed</code></td>\n</tr>\n<tr>\n<td><a href=\"#docs-diagrams-tech-lead-workspace\"><code>diagrams/</code></a></td>\n<td>Como o trabalho se organiza em disco</td>\n<td><code>proposed</code></td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-readme~trilhas-de-leitura\">Trilhas de leitura</h2>\n<h3 id=\"docs-readme~trilha-rápida--15-minutos\">Trilha rápida — 15 minutos</h3>\n<p>Para quem já conhece workflows de desenvolvimento e quer avaliar o projeto antes de investir tempo. Leia apenas o bloco \"Em 2 minutos\" de cada documento.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">Ordem</th>\n<th>Documento</th>\n<th>O que você leva</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1</td>\n<td><a href=\"#readme\">README do repositório</a></td>\n<td>a proposta e as três ideias centrais</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">2</td>\n<td><a href=\"#docs-end-to-end-journey\">Fluxo da jornada</a></td>\n<td>o ciclo completo em diagrama</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">3</td>\n<td><a href=\"#docs-workflows-readme\">Workflows multiagente</a></td>\n<td>como uma etapa vira trabalho de agentes</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">4</td>\n<td><a href=\"#docs-agents-catalog\">Catálogo de agentes</a></td>\n<td>quais papéis existem e o que cada um entrega</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-readme~trilha-completa--leitura-de-referência\">Trilha completa — leitura de referência</h3>\n<p>Para quem vai operar, adaptar ou estender o framework.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">Ordem</th>\n<th>Documento</th>\n<th>Papel</th>\n<th>Estado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1</td>\n<td><a href=\"#docs-operating-model\">Sistema operacional do trio humano</a></td>\n<td>visão canônica do modelo</td>\n<td><code>canonical</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">2</td>\n<td><a href=\"#docs-end-to-end-journey\">Fluxo da jornada</a></td>\n<td>visão de ponta a ponta</td>\n<td><code>reference</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">3</td>\n<td><a href=\"#docs-journey-by-phase\">Jornada por fases</a></td>\n<td>diagramas segmentados por fase</td>\n<td><code>reference</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">4</td>\n<td><a href=\"#docs-operating-model-90-10\">Modelo operacional 90/10</a></td>\n<td>gates, risco e autonomia progressiva</td>\n<td><code>proposed</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">5</td>\n<td><a href=\"#docs-workflows-readme\">Workflows multiagente</a></td>\n<td>colaboração, handoffs e convergência</td>\n<td><code>proposed</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">6</td>\n<td><a href=\"#docs-agents-catalog\">Catálogo de agentes</a></td>\n<td>papéis, contratos e permissões</td>\n<td><code>proposed</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">7</td>\n<td><a href=\"#docs-agents-readme\">Pacotes importáveis dos agentes</a></td>\n<td>identidade, alma e contrato executável</td>\n<td><code>proposed</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">8</td>\n<td><a href=\"#skills-readme\">Catálogo de skills</a></td>\n<td>procedimentos executáveis por etapa</td>\n<td><code>canonical</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">9</td>\n<td><a href=\"#docs-repo-harness\">Repo harness</a></td>\n<td>o que cada repositório carrega para ser operável por agentes</td>\n<td><code>proposed</code></td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">10</td>\n<td><a href=\"#docs-diagrams-tech-lead-workspace\">Workspace do Tech Lead</a></td>\n<td>organização do trabalho multiagente</td>\n<td><code>proposed</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-readme~trilha-de-contribuição\">Trilha de contribuição</h3>\n<table>\n<thead>\n<tr>\n<th>Documento</th>\n<th>Quando usar</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-documentation-standard\">Padrão de documentação</a></td>\n<td>antes de escrever ou reescrever qualquer documento</td>\n</tr>\n<tr>\n<td><a href=\"#skills-readme~3-anatomia-de-uma-skill\">Anatomia de uma skill</a></td>\n<td>antes de criar ou revisar uma skill</td>\n</tr>\n<tr>\n<td><a href=\"#skills-references-workflow-contract\">Contrato de artefatos</a></td>\n<td>ao definir onde uma skill lê e escreve artefatos</td>\n</tr>\n<tr>\n<td><a href=\"agents/registry.yaml\" class=\"ext\" title=\"docs/agents/registry.yaml — arquivo do repositório\">Registro de workspaces</a></td>\n<td>inventário dos agentes materializados para importação</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-readme~fonte-de-verdade\">Fonte de verdade</h2>\n<p>O <a href=\"#docs-operating-model\">sistema operacional do trio humano</a> é a referência conceitual principal. Todos os demais documentos detalham partes específicas dele e devem permanecer compatíveis. Quando um conceito muda, a alteração entra primeiro nesse documento e só depois é propagada para os especializados.</p>", "toc": [{"level": 2, "id": "docs-readme~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-readme~trilhas-de-leitura", "text": "Trilhas de leitura"}, {"level": 3, "id": "docs-readme~trilha-rápida--15-minutos", "text": "Trilha rápida — 15 minutos"}, {"level": 3, "id": "docs-readme~trilha-completa--leitura-de-referência", "text": "Trilha completa — leitura de referência"}, {"level": 3, "id": "docs-readme~trilha-de-contribuição", "text": "Trilha de contribuição"}, {"level": 2, "id": "docs-readme~fonte-de-verdade", "text": "Fonte de verdade"}], "text": " documentação do agent team mapa de navegação da documentação, organizado por perfil de leitor e por profundidade. em 2 minutos a documentação do agent team tem quatro corpos que respondem a perguntas diferentes. os documentos de modelo operacional , na raiz de docs/ , explicam como o sistema pensa: papéis, direitos de decisão, gates e autonomia. workflows/ explica como cada etapa da jornada é executada por um time de agentes. agents/ define quem são esses agentes, com contrato e permissões. diagrams/ mostra como o trabalho se organiza em disco. cada documento carrega duas camadas: um bloco \"em 2 minutos\" no topo, para avaliação rápida, e o desenvolvimento completo abaixo. você nunca precisa ler um documento inteiro para decidir se ele é relevante. se preferir navegar tudo em uma única página, com busca e diagramas renderizados, abra site.html no navegador. corpo responde estado predominante modelo operacional como o sistema funciona e quem decide o quê canonical workflows/ como cada etapa é executada por agentes proposed agents/ quem são os agentes e quais contratos seguem proposed skills/ quais procedimentos os agentes executam canonical repo harness o que um repositório precisa ter para ser operável por agentes proposed diagrams/ como o trabalho se organiza em disco proposed trilhas de leitura trilha rápida — 15 minutos para quem já conhece workflows de desenvolvimento e quer avaliar o projeto antes de investir tempo. leia apenas o bloco \"em 2 minutos\" de cada documento. ordem documento o que você leva 1 readme do repositório a proposta e as três ideias centrais 2 fluxo da jornada o ciclo completo em diagrama 3 workflows multiagente como uma etapa vira trabalho de agentes 4 catálogo de agentes quais papéis existem e o que cada um entrega trilha completa — leitura de referência para quem vai operar, adaptar ou estender o framework. ordem documento papel estado 1 sistema operacional do trio humano visão canônica do modelo canonical 2 fluxo da jornada visão de ponta a ponta reference 3 jornada por fases diagramas segmentados por fase reference 4 modelo operacional 90/10 gates, risco e autonomia progressiva proposed 5 workflows multiagente colaboração, handoffs e convergência proposed 6 catálogo de agentes papéis, contratos e permissões proposed 7 pacotes importáveis dos agentes identidade, alma e contrato executável proposed 8 catálogo de skills procedimentos executáveis por etapa canonical 9 repo harness o que cada repositório carrega para ser operável por agentes proposed 10 workspace do tech lead organização do trabalho multiagente proposed trilha de contribuição documento quando usar padrão de documentação antes de escrever ou reescrever qualquer documento anatomia de uma skill antes de criar ou revisar uma skill contrato de artefatos ao definir onde uma skill lê e escreve artefatos registro de workspaces inventário dos agentes materializados para importação fonte de verdade o sistema operacional do trio humano é a referência conceitual principal. todos os demais documentos detalham partes específicas dele e devem permanecer compatíveis. quando um conceito muda, a alteração entra primeiro nesse documento e só depois é propagada para os especializados. "}, {"id": "docs-operating-model", "path": "docs/operating-model.md", "section": "Modelo operacional", "title": "Sistema operacional do trio humano", "status": "canonical", "updated": "2026-08-09", "html": "<h1 id=\"docs-operating-model~agent-team--sistema-operacional-do-trio-humano\">Agent Team — sistema operacional do trio humano</h1>\n<blockquote>\n<p>Visão canônica do Agent Team: como um núcleo de <strong>Product Manager, UX e Tech Lead</strong> dirige agentes especializados do backlog à produção sem perder controle, evidência ou rastreabilidade.</p>\n</blockquote>\n<h2 id=\"docs-operating-model~em-2-minutos\">Em 2 minutos</h2>\n<p>Quando agentes de IA assumem a produção de código, o gargalo se desloca. Escrever deixa de ser caro; o que fica caro é decidir o que construir, provar que foi construído certo e impedir que decisões, código e documentação se separem. Um time pequeno que não trata esse deslocamento acaba gerando volume sem confiança.</p>\n<p>O Agent Team responde com uma inversão: as três pessoas <strong>operam o sistema</strong> em vez de executar o trabalho. O trio define intenção, prioridade, risco e aprovação; agentes especializados pesquisam, especificam, implementam, criticam, validam e documentam dentro de escopo autorizado. Nenhuma passagem entre fases acontece por conversa — cada uma tem entrada, saída, owner humano, gate e evidência, materializados em artefatos versionados.</p>\n<table>\n<thead>\n<tr>\n<th>Elemento</th>\n<th>O que é</th>\n<th>Por que existe</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Trio humano</strong></td>\n<td>PM, UX e Tech Lead, cada um dono de um domínio</td>\n<td>evita decisão sem responsável</td>\n</tr>\n<tr>\n<td><strong>Agent Team</strong></td>\n<td>Time temporário de agentes montado por fase</td>\n<td>especialização sem custo fixo de headcount</td>\n</tr>\n<tr>\n<td><strong>Agente adversarial</strong></td>\n<td>Instância independente que ataca a proposta</td>\n<td>quem produz não valida a própria mudança</td>\n</tr>\n<tr>\n<td><strong>Gate</strong></td>\n<td>Critério objetivo de passagem entre fases</td>\n<td>impede avanço sem evidência</td>\n</tr>\n<tr>\n<td><strong>Evidence pack</strong></td>\n<td>Pacote curto que sustenta uma decisão humana</td>\n<td>decidir sem reler sessões inteiras</td>\n</tr>\n<tr>\n<td><strong>Classe de risco (R0–R4)</strong></td>\n<td>Peso da mudança</td>\n<td>define quanto de autonomia é permitido</td>\n</tr>\n<tr>\n<td><strong>Nível de autonomia (A0–A4)</strong></td>\n<td>Quanto o sistema roda sem intervenção</td>\n<td>cresce só com histórico e gates confiáveis</td>\n</tr>\n</tbody>\n</table>\n<p>Três regras sustentam o resto: quem propõe não é quem aprova; aprovação exige evidência explícita e silêncio nunca equivale a aprovação; autonomia só aumenta quando métricas e gates demonstram que é seguro.</p>\n<hr>\n<h2 id=\"docs-operating-model~mapa-do-documento\">Mapa do documento</h2>\n<table>\n<thead>\n<tr>\n<th>Parte</th>\n<th>Seções</th>\n<th>Responde</th>\n<th>Leia se você…</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-operating-model~parte-i--fundamentos\">I — Fundamentos</a></td>\n<td>1–3</td>\n<td>Para que o modelo existe e como agentes atuam</td>\n<td>quer entender a lógica antes dos detalhes</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model~parte-ii--quem-decide\">II — Quem decide</a></td>\n<td>4–7</td>\n<td>Papéis, direitos de decisão, handoffs e cerimônias</td>\n<td>vai assumir um dos três papéis</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model~parte-iii--como-o-trabalho-anda\">III — Como o trabalho anda</a></td>\n<td>8–11</td>\n<td>O ciclo de ponta a ponta e o loop de melhoria</td>\n<td>vai executar ou instrumentar o fluxo</td>\n</tr>\n<tr>\n<td><a href=\"#docs-operating-model~parte-iv--o-que-sustenta\">IV — O que sustenta</a></td>\n<td>12–14</td>\n<td>Harness, governança, risco e autonomia</td>\n<td>vai configurar o repositório e os gates</td>\n</tr>\n</tbody>\n</table>\n<p>Para montar ou auditar um repositório operado por agentes, o detalhamento está em <a href=\"#docs-repo-harness\">repo harness</a>.\n| <a href=\"#docs-operating-model~parte-v--evolução\">V — Evolução</a> | 15–18 | Fases de adoção, métricas e pendências | vai implantar o modelo em um time |</p>\n<p><strong>Documentos vizinhos:</strong> <a href=\"#docs-operating-model-90-10\">modelo operacional 90/10</a> · <a href=\"#docs-repo-harness\">repo harness</a> · <a href=\"#docs-end-to-end-journey\">fluxo visual completo</a> · <a href=\"#docs-journey-by-phase\">fluxos por fase</a> · <a href=\"#docs-workflows-readme\">workflows multiagente</a> · <a href=\"#docs-agents-catalog\">catálogo de agentes</a> · <a href=\"#docs-diagrams-tech-lead-workspace\">workspace do Tech Lead</a>.</p>\n<hr>\n<h1 id=\"docs-operating-model~parte-i--fundamentos\">Parte I — Fundamentos</h1>\n<h2 id=\"docs-operating-model~1-propósito\">1. Propósito</h2>\n<p>O objetivo do modelo é transformar uma necessidade de negócio em software validado por meio de um núcleo humano pequeno que dirige uma força de trabalho de agentes especializados. Isso exige combinar agentes, pessoas e automações mantendo decisões, código e documentação sincronizados, produzir evidência em todas as etapas e escalar a entrega sem abrir mão de segurança e governança.</p>\n<p>Duas consequências disso são intencionais. A primeira é que a atenção humana fica reservada para intenção, julgamento, risco e responsabilidade — não para execução repetitiva. A segunda é que execução, validação e coleta de evidências se tornam progressivamente autônomas, e o próprio sistema de trabalho melhora a cada ciclo.</p>\n<p>A divisão de trabalho que torna isso possível é a seguinte:</p>\n<table>\n<thead>\n<tr>\n<th>Ator</th>\n<th>Dirige</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Product Manager</strong></td>\n<td>valor, prioridade e resultado de negócio</td>\n</tr>\n<tr>\n<td><strong>UX</strong></td>\n<td>entendimento do usuário, experiência e qualidade de uso</td>\n</tr>\n<tr>\n<td><strong>Tech Lead</strong></td>\n<td>viabilidade, arquitetura, qualidade técnica e risco operacional</td>\n</tr>\n<tr>\n<td><strong>Agentes</strong></td>\n<td>pesquisa, proposta, implementação, crítica, validação e documentação</td>\n</tr>\n<tr>\n<td><strong>Automações</strong></td>\n<td>verificações determinísticas, bloqueios e rastreabilidade</td>\n</tr>\n</tbody>\n</table>\n<p>O trio não tenta executar manualmente todo o trabalho. Ele opera o sistema que executa.</p>\n<hr>\n<h2 id=\"docs-operating-model~2-princípios-operacionais\">2. Princípios operacionais</h2>\n<p>Os princípios abaixo resolvem, antecipadamente, as disputas mais comuns em um fluxo com agentes. Estão agrupados por aquilo que protegem.</p>\n<p><strong>Autoridade e responsabilidade.</strong> Pessoas definem prioridade, restrições, limites de autonomia e aprovação final; agentes executam trabalho especializado e produzem evidências. Cada etapa tem entrada, saída, owner humano e critério de passagem. O responsável humano decide, o agente primário prepara e recomenda, e divergências relevantes entre agentes são resolvidas pelo owner humano do domínio.</p>\n<p><strong>Integridade da validação.</strong> Quem produz uma mudança não é o único responsável por validá-la. A etapa termina com um artefato coerente, não com análises isoladas. Uma mudança material invalida a aprovação relacionada, e ausência de resposta nunca equivale a aprovação.</p>\n<p><strong>Qualidade da decisão.</strong> Aprovação humana deve receber síntese, alternativas, riscos e evidências — nunca contexto bruto. Comunicação assíncrona é o padrão; reunião existe para decidir, não para narrar status.</p>\n<p><strong>Segurança da evolução.</strong> Mudanças pequenas, reversíveis e rastreáveis reduzem risco e retrabalho. O repositório concentra regras e contexto executável do produto, o harness transforma padrões em verificações repetíveis, e a autonomia aumenta apenas quando métricas e gates demonstram segurança.</p>\n<hr>\n<h2 id=\"docs-operating-model~3-modelo-de-atuação-dos-agent-teams\">3. Modelo de atuação dos Agent Teams</h2>\n<p>Cada fase pode acionar um time temporário de agentes especializados, dissolvido ao final. Isso permite ter dezenas de especializações sem manter nenhuma delas ociosa. O <a href=\"#docs-agents-catalog\">catálogo de agentes</a> define os contratos e limites de cada papel.</p>\n<p>A dinâmica interna do time é sempre a mesma. Um <strong>agente primário</strong> conduz e consolida o artefato da fase, enquanto cada agente analisa o problema a partir de uma responsabilidade explícita. <strong>Agentes adversariais</strong> procuram ambiguidades, gaps, riscos e suposições frágeis. As contribuições e divergências são registradas antes da consolidação, e o owner humano intervém apenas em decisão de valor, experiência, risco ou exceção — não em toda execução.</p>\n<p>O contexto passa entre fases por artefatos versionados e evidence packs. Nenhum agente recebe acesso amplo: cada um opera com acesso mínimo, escopo delimitado e condição objetiva de parada.</p>\n<h3 id=\"docs-operating-model~31-estrutura-mínima-de-uma-missão\">3.1 Estrutura mínima de uma missão</h3>\n<p>Toda missão entregue a um agente declara, no mínimo, os campos abaixo. Missão sem esses campos não deve ser executada.</p>\n<table>\n<thead>\n<tr>\n<th>Campo</th>\n<th>Define</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Objetivo e resultado esperado</td>\n<td>o que a missão precisa produzir</td>\n</tr>\n<tr>\n<td>Contexto e fontes canônicas</td>\n<td>onde está a verdade sobre o tema</td>\n</tr>\n<tr>\n<td>Escopo e fora de escopo</td>\n<td>o limite da autonomia concedida</td>\n</tr>\n<tr>\n<td>Artefato de entrada e de saída</td>\n<td>o que se lê e o que se escreve</td>\n</tr>\n<tr>\n<td>Critérios de aceite</td>\n<td>como saber que terminou</td>\n</tr>\n<tr>\n<td>Gates obrigatórios</td>\n<td>o que precisa passar antes de avançar</td>\n</tr>\n<tr>\n<td>Ferramentas e permissões</td>\n<td>o que o agente pode acionar</td>\n</tr>\n<tr>\n<td>Classe de risco</td>\n<td>quanto de verificação a mudança exige</td>\n</tr>\n<tr>\n<td>Condição de escalonamento</td>\n<td>quando parar e chamar uma pessoa</td>\n</tr>\n<tr>\n<td>Owner humano da decisão</td>\n<td>quem responde pelo resultado</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h1 id=\"docs-operating-model~parte-ii--quem-decide\">Parte II — Quem decide</h1>\n<h2 id=\"docs-operating-model~4-o-trio-humano\">4. O trio humano</h2>\n<p>Cada papel é dono de um domínio e traz decisões próprias para a mesa. Nenhum dos três é um \"tradutor\" passivo dos outros: eles constroem juntos o contrato que os agentes executarão.</p>\n<h3 id=\"docs-operating-model~41-product-manager--dono-do-valor-e-da-prioridade\">4.1 Product Manager — dono do valor e da prioridade</h3>\n<p>O PM responde pela pergunta \"vale a pena construir isto, agora, para este resultado?\". Ele mantém visão, objetivos, outcomes e roadmap, ordena o backlog por valor, urgência, risco e aprendizado, e formula o problema antes de comprometer uma solução. Também identifica stakeholders e restrições comerciais, define escopo, fora de escopo e critérios de sucesso, e garante rastreabilidade entre problema, investimento, entrega e resultado.</p>\n<p>Na operação diária, cabe ao PM decidir avançar, ajustar, adiar ou encerrar um item; homologar valor com stakeholders e registrar pendências; priorizar melhorias originadas pela telemetria; e operar os agentes de intake, discovery, pesquisa, planejamento e validação de produto.</p>\n<table>\n<thead>\n<tr>\n<th>Recebe</th>\n<th>Entrega</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>estratégia e objetivos do negócio</td>\n<td>backlog ordenado e com owner</td>\n</tr>\n<tr>\n<td>necessidades de clientes e stakeholders</td>\n<td>objetivo e outcome esperado</td>\n</tr>\n<tr>\n<td>pesquisas e evidências de UX</td>\n<td><code>PB.md</code> aprovado e <code>PRD.md</code> consolidado</td>\n</tr>\n<tr>\n<td>métricas de produto e operação</td>\n<td>escopo e fora de escopo explícitos</td>\n</tr>\n<tr>\n<td>restrições, riscos e estimativas do Tech Lead</td>\n<td>métricas e critérios de sucesso</td>\n</tr>\n<tr>\n<td>feedback de homologação e produção</td>\n<td>decisões H1, H2 e aceite de produto</td>\n</tr>\n<tr>\n<td>incidentes, custo do fluxo e oportunidades</td>\n<td>prioridade das melhorias e comunicação de resultado</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Não é responsabilidade exclusiva do PM:</strong> desenhar sozinho a experiência, definir arquitetura ou solução técnica, aprovar exceção técnica sem o Tech Lead, ou substituir evidência de usuário por opinião de stakeholder.</p>\n<h3 id=\"docs-operating-model~42-ux--dono-da-experiência-e-da-evidência-sobre-o-usuário\">4.2 UX — dono da experiência e da evidência sobre o usuário</h3>\n<p>O UX responde por \"isto resolve o problema de quem vai usar, e resolve bem?\". Planeja e executa pesquisa proporcional ao risco, representa necessidades, contexto e limitações dos usuários, e mapeia jornadas, fluxos, tarefas e pontos de fricção. Define princípios de experiência, conteúdo e interação, e especifica os estados nominal, vazio, loading, erro, permissão e recuperação — o conjunto que costuma ser esquecido e vira retrabalho.</p>\n<p>Também garante acessibilidade, consistência e usabilidade, produz protótipos na fidelidade necessária para decidir, e valida hipóteses antes e depois da implementação.</p>\n<table>\n<thead>\n<tr>\n<th>Recebe</th>\n<th>Entrega</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>problema, segmento e outcome do PM</td>\n<td>evidência e síntese de pesquisa</td>\n</tr>\n<tr>\n<td>restrições técnicas e de plataforma</td>\n<td>jornada, fluxo e mapa de estados</td>\n</tr>\n<tr>\n<td>feedback de uso, suporte e telemetria</td>\n<td>protótipo na fidelidade adequada</td>\n</tr>\n<tr>\n<td>critérios de negócio e métricas</td>\n<td>especificação de UX e critérios de aceite de experiência</td>\n</tr>\n<tr>\n<td>resultados de homologação</td>\n<td>decisão de aceite de experiência e backlog de melhorias de uso</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Não é responsabilidade exclusiva do UX:</strong> definir prioridade de negócio, escolher arquitetura, ou aprovar escopo sozinho.</p>\n<h3 id=\"docs-operating-model~43-tech-lead--dono-da-integridade-técnica-e-do-risco-operacional\">4.3 Tech Lead — dono da integridade técnica e do risco operacional</h3>\n<p>O Tech Lead responde por \"isto é viável, sustentável e seguro de operar?\". Avalia viabilidade e alternativas, define arquitetura, contratos e fronteiras, estabelece padrões de qualidade, testes e observabilidade, e classifica risco. Também mantém o repo harness — o conjunto de rules, skills, hooks e gates que torna o repositório compreensível e seguro para agentes.</p>\n<p>Na operação, decide sobre exceções arquiteturais, merge e release conforme política, e opera os agentes de especificação, implementação, revisão, segurança e operação.</p>\n<table>\n<thead>\n<tr>\n<th>Recebe</th>\n<th>Entrega</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>problema, escopo candidato e métricas</td>\n<td>viabilidade, alternativas e trade-offs</td>\n</tr>\n<tr>\n<td>especificação de UX e estados</td>\n<td><code>PLAN.md</code>, <code>SPEC.md</code>, <code>TASKS.md</code> e ADRs</td>\n</tr>\n<tr>\n<td>restrições de plataforma e dependências</td>\n<td>classificação de risco e gates aplicáveis</td>\n</tr>\n<tr>\n<td>resultados de CI, validação e incidentes</td>\n<td>evidence pack técnico</td>\n</tr>\n<tr>\n<td>sinais de produção e custo</td>\n<td>decisão de merge, release e rollback</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Não é responsabilidade exclusiva do Tech Lead:</strong> definir valor de negócio, decidir experiência do usuário, ou absorver sozinho decisão de escopo.</p>\n<h3 id=\"docs-operating-model~44-responsabilidade-compartilhada\">4.4 Responsabilidade compartilhada</h3>\n<p>Os três respondem conjuntamente pela qualidade do problema antes da solução, pela coerência entre valor, experiência e viabilidade, por riscos explícitos e decisões rastreáveis, por critérios de aceite observáveis, pela proteção dos dados e dos usuários, pela saúde do fluxo agentico e pelo aprendizado após a entrega.</p>\n<hr>\n<h2 id=\"docs-operating-model~5-direitos-de-decisão\">5. Direitos de decisão</h2>\n<p>A tabela abaixo é a referência para resolver \"quem decide isto?\". Ela existe para que nenhuma decisão fique parada aguardando consenso, e para que nenhuma seja tomada sem a evidência que a sustenta.</p>\n<table>\n<thead>\n<tr>\n<th>Decisão</th>\n<th>Owner</th>\n<th>Consultados</th>\n<th>Evidência mínima</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Prioridade e investimento</td>\n<td>PM</td>\n<td>UX + Tech Lead</td>\n<td>valor, urgência, risco e custo de oportunidade</td>\n</tr>\n<tr>\n<td>Problema e outcome</td>\n<td>PM</td>\n<td>UX + Tech Lead</td>\n<td>evidência do problema e métrica de resultado</td>\n</tr>\n<tr>\n<td>Jornada e experiência</td>\n<td>UX</td>\n<td>PM + Tech Lead</td>\n<td>pesquisa, fluxo, protótipo e critérios de UX</td>\n</tr>\n<tr>\n<td>Escopo da entrega</td>\n<td>PM</td>\n<td>UX + Tech Lead</td>\n<td>outcome, capacidade, dependências e riscos</td>\n</tr>\n<tr>\n<td>Arquitetura e implementação</td>\n<td>Tech Lead</td>\n<td>PM + UX</td>\n<td>alternativas, trade-offs, risco e validação</td>\n</tr>\n<tr>\n<td>Exceção arquitetural</td>\n<td>Tech Lead</td>\n<td>owner afetado</td>\n<td>ADR, prazo, consequência e plano de reversão</td>\n</tr>\n<tr>\n<td>Aceite de produto</td>\n<td>PM</td>\n<td>UX + stakeholder</td>\n<td>critérios de produto e evidências de homologação</td>\n</tr>\n<tr>\n<td>Aceite de experiência</td>\n<td>UX</td>\n<td>PM + Tech Lead</td>\n<td>critérios de UX, acessibilidade e validação</td>\n</tr>\n<tr>\n<td>Merge e release</td>\n<td>Tech Lead por política</td>\n<td>PM + UX conforme risco</td>\n<td>CI, evidence pack, rollout e rollback</td>\n</tr>\n<tr>\n<td>Exposição de risco R3/R4</td>\n<td>PM + Tech Lead</td>\n<td>UX quando houver impacto ao usuário</td>\n<td>impacto, mitigação, observabilidade e rollback</td>\n</tr>\n<tr>\n<td>Prioridade de melhoria</td>\n<td>owner do domínio; PM ordena o backlog</td>\n<td>trio</td>\n<td>telemetria, frequência, impacto e esforço</td>\n</tr>\n<tr>\n<td>Mudança de gate</td>\n<td>Tech Lead + revisor independente</td>\n<td>PM/UX se afetados</td>\n<td>falsos positivos, risco coberto e plano de adoção</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model~51-regra-de-desempate\">5.1 Regra de desempate</h3>\n<p>Quando a discussão trava, o domínio decide: valor, prioridade e outcome com o PM; experiência, usabilidade e acessibilidade com o UX; arquitetura, segurança e confiabilidade com o Tech Lead. Conflitos entre domínios exigem registrar alternativas, impacto e decisão conjunta. Risco irreversível, regulatório ou de grande alcance escala ao sponsor ou responsável formal — não se resolve dentro do trio.</p>\n<hr>\n<h2 id=\"docs-operating-model~6-contrato-de-passagem-entre-os-três-profissionais\">6. Contrato de passagem entre os três profissionais</h2>\n<p>Cada seta entre papéis é um contrato, não uma conversa. O emissor entrega insumos definidos e o receptor devolve um resultado definido.</p>\n<table>\n<thead>\n<tr>\n<th>De</th>\n<th>Para</th>\n<th>Inputs entregues</th>\n<th>Output esperado do receptor</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PM</td>\n<td>UX</td>\n<td>problema, segmento, outcome, restrições e perguntas</td>\n<td>evidência do usuário, jornada, fluxo e critérios de experiência</td>\n</tr>\n<tr>\n<td>PM</td>\n<td>Tech Lead</td>\n<td>problema, escopo candidato, métricas e restrições</td>\n<td>viabilidade, riscos, dependências e opções técnicas</td>\n</tr>\n<tr>\n<td>UX</td>\n<td>PM</td>\n<td>evidências, necessidades, hipóteses e riscos de experiência</td>\n<td>decisão de escopo/prioridade e atualização do PRD</td>\n</tr>\n<tr>\n<td>UX</td>\n<td>Tech Lead</td>\n<td>fluxo, estados, conteúdo, acessibilidade e protótipo</td>\n<td>contratos, tarefas e estratégia de implementação compatíveis</td>\n</tr>\n<tr>\n<td>Tech Lead</td>\n<td>PM</td>\n<td>custo, riscos, dependências, alternativas e impacto operacional</td>\n<td>decisão de investimento, corte ou sequenciamento</td>\n</tr>\n<tr>\n<td>Tech Lead</td>\n<td>UX</td>\n<td>restrições, latência, dados, plataforma e componentes existentes</td>\n<td>adaptação consciente da experiência sem perder o outcome</td>\n</tr>\n<tr>\n<td>Trio</td>\n<td>Agent Team</td>\n<td>artefato aprovado, critérios, gates, risco e permissões</td>\n<td>mudança executada, validada, documentada e evidenciada</td>\n</tr>\n<tr>\n<td>Agent Team</td>\n<td>Trio</td>\n<td>evidence pack, divergências e decisões pendentes</td>\n<td>aprovação, correção, adiamento ou escalonamento</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model~61-definition-of-ready-para-execução-agentica\">6.1 Definition of Ready para execução agentica</h3>\n<p>Um item só entra em execução por agentes quando problema e usuário estão explícitos, outcome e métrica definidos, owner humano conhecido, e escopo e fora de escopo claros. Do lado do detalhe, exige fluxo e estados de UX suficientes para a tarefa, contratos e restrições técnicas suficientes, critérios de aceite verificáveis, classe de risco e gates definidos, acessos e ferramentas autorizados, e dúvidas críticas resolvidas ou assumidas de forma explícita.</p>\n<h3 id=\"docs-operating-model~62-definition-of-done-do-ciclo\">6.2 Definition of Done do ciclo</h3>\n<p>O ciclo fecha quando os critérios de produto, UX e engenharia estão cobertos; testes e gates obrigatórios aprovados; impacto arquitetural avaliado; riscos e limitações conhecidos; documentação e fontes canônicas atualizadas; aprovações humanas e automatizadas identificadas; backlog, artefatos, commits, PR, release e telemetria vinculados; rollout observado sem regressão relevante ou com plano de correção; e aprendizados encaminhados ao loop correto.</p>\n<hr>\n<h2 id=\"docs-operating-model~7-cerimônias-humanas\">7. Cerimônias humanas</h2>\n<p>As cerimônias são <strong>pontos de decisão</strong>, não pontos de relato. Preparação, análise, atualização de status e geração de artefatos ficam com os agentes e automações; a pessoa entra para decidir. Os marcos H1 a H6 aparecem no ciclo da <a href=\"#docs-operating-model~8-ciclo-de-desenvolvimento-de-ponta-a-ponta\">Parte III</a> como gates com nome.</p>\n<h3 id=\"docs-operating-model~71-ritmo-contínuo\">7.1 Ritmo contínuo</h3>\n<table>\n<thead>\n<tr>\n<th>Cerimônia</th>\n<th>Cadência</th>\n<th>Owner</th>\n<th>Decide</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pulso assíncrono diário</td>\n<td>diária, ≤10 min de leitura</td>\n<td>trio</td>\n<td>o que está bloqueado e quem desbloqueia</td>\n</tr>\n<tr>\n<td>Triagem e prioridade</td>\n<td>semanal, 30–45 min</td>\n<td>PM</td>\n<td>o que entra, o que sai e o que precisa de discovery</td>\n</tr>\n</tbody>\n</table>\n<p>O pulso diário é alimentado por agentes com estado do fluxo, mudanças, bloqueios, risco e decisões requeridas. A pauta cobre apenas bloqueios, novas informações e pedidos de decisão, e o resultado registra owners, prazo da decisão e replanejamento. <strong>Não deve virar</strong> reunião diária de relato individual.</p>\n<p>A triagem recebe novos itens, métricas, feedback, incidentes, dependências e capacidade, e devolve backlog ordenado com owner, risco inicial e próximos discoveries. O gate é ter contexto, prioridade e responsável minimamente claros.</p>\n<h3 id=\"docs-operating-model~72-marcos-de-decisão-h1h6\">7.2 Marcos de decisão H1–H6</h3>\n<table>\n<thead>\n<tr>\n<th>Marco</th>\n<th>Cerimônia</th>\n<th>Owner</th>\n<th>Cadência</th>\n<th>Gate</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>H1</strong></td>\n<td>Kickoff de discovery</td>\n<td>PM</td>\n<td>por oportunidade, 30–45 min</td>\n<td>missão, timebox e agentes definidos</td>\n</tr>\n<tr>\n<td><strong>H2</strong></td>\n<td>Refinamento de produto e experiência</td>\n<td>PM (UX co-owner)</td>\n<td>por item candidato, 45–60 min</td>\n<td>gaps críticos tratados e sucesso mensurável</td>\n</tr>\n<tr>\n<td><strong>H3</strong></td>\n<td>Revisão de solução e risco</td>\n<td>Tech Lead</td>\n<td>sob demanda, 30–60 min</td>\n<td>rastreabilidade e validação viável</td>\n</tr>\n<tr>\n<td><strong>H4</strong></td>\n<td>Review de entrega</td>\n<td>PM/UX/Tech Lead por critério</td>\n<td>por incremento, 20–30 min</td>\n<td>revisão aprovada, CI verde, sem bloqueadores</td>\n</tr>\n<tr>\n<td><strong>H5</strong></td>\n<td>Decisão de release</td>\n<td>Tech Lead (PM coaprova R3/R4)</td>\n<td>por release, 10–20 min</td>\n<td>ambiente, migração, observabilidade e rollback verificados</td>\n</tr>\n<tr>\n<td><strong>H6</strong></td>\n<td>Telemetria e melhoria</td>\n<td>trio, facilitação rotativa</td>\n<td>semanal, 45–60 min</td>\n<td>evidência rastreável e hipótese separada de aprendizado</td>\n</tr>\n</tbody>\n</table>\n<p><strong>H1 — Kickoff de discovery.</strong> Parte do intake consolidado, evidências existentes e perguntas abertas. O PM traz problema, valor, stakeholders e outcome; o UX traz as lacunas sobre o usuário e o plano de pesquisa; o Tech Lead traz restrições, dependências e risco de viabilidade. Sai com missão de discovery, <code>PB.md</code> inicial, agentes acionados e timebox. A decisão final é avançar, ajustar, adiar ou encerrar.</p>\n<p><strong>H2 — Refinamento de produto e experiência.</strong> A pergunta é \"é isto que construiremos, para quem e com qual resultado?\". Entram <code>PB.md</code>, pesquisa, jornada, protótipo, PRD proposto e crítica adversarial. Saem <code>PRD.md</code>, especificação de UX, critérios de aceite e escopo aprovado.</p>\n<p><strong>H3 — Revisão de solução e risco.</strong> Obrigatória para ADR, exceção ou risco elevado. Entram <code>PLAN.md</code>, <code>SPEC.md</code>, ADR, alternativas, threat model, plano de testes e crítica adversarial. O PM avalia impacto em outcome, prazo e escopo; o UX avalia impacto em jornada, conteúdo, acessibilidade e estados. Saem decisão técnica, trade-offs aceitos, tarefas executáveis e riscos com owner.</p>\n<p><strong>H4 — Review de entrega.</strong> A pergunta é \"entrega o outcome acordado, funciona bem e pode ser integrada?\". Entram demo preparada por agentes, evidence pack, critérios de aceite e mudanças desde H2/H3. Saem aceite, ajustes, novos itens ou rejeição justificada.</p>\n<p><strong>H5 — Decisão de release.</strong> Síncrona apenas quando o risco exigir. Entram release candidate, risco, rollout, rollback, SLOs e sinais de saúde. Saem liberar, pausar, reduzir exposição ou retornar à implementação.</p>\n<p><strong>H6 — Telemetria e melhoria.</strong> A pergunta é \"o sistema aprendeu corretamente e qual melhoria merece investimento?\". Entram relatório de telemetria, padrões, incidentes, custo, feedback e propostas do Auto Dream. Saem memória validada, demandas P0–P3, owners, experimentos e alterações de processo.</p>\n<h3 id=\"docs-operating-model~73-revisões-periódicas\">7.3 Revisões periódicas</h3>\n<p>A <strong>revisão mensal do sistema</strong> (60–90 min, trio mais sponsor ou enablement quando necessário) olha tendências de outcome, qualidade, fluxo, custo, autonomia e falsos positivos dos gates, e ajusta capacidade, políticas, ferramentas, gates e nível de autonomia. A regra que protege essa reunião: nunca usar uma métrica isolada para elevar autonomia.</p>\n<p>A <strong>quarterly outcome review</strong> (60–90 min, owner PM) revisa outcomes, estratégia, pesquisas, saúde técnica, custo e aprendizados acumulados, e define prioridades do próximo ciclo, apostas encerradas e capacidades a desenvolver.</p>\n<hr>\n<h1 id=\"docs-operating-model~parte-iii--como-o-trabalho-anda\">Parte III — Como o trabalho anda</h1>\n<h2 id=\"docs-operating-model~8-ciclo-de-desenvolvimento-de-ponta-a-ponta\">8. Ciclo de desenvolvimento de ponta a ponta</h2>\n<p>O ciclo tem dez etapas, cada uma com workflow próprio, owner humano, time de agentes e gate. A visão em diagrama está em <a href=\"#docs-end-to-end-journey\">fluxo da jornada</a>; o detalhamento por fase, em <a href=\"#docs-journey-by-phase\">jornada por fases</a>.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">#</th>\n<th>Etapa</th>\n<th>Owner humano</th>\n<th>Agentes</th>\n<th>Gate</th>\n<th>Cerimônia</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">0</td>\n<td><a href=\"#docs-workflows-00-intake-and-triage\">Intake e triagem</a></td>\n<td>PM</td>\n<td>Intake + Product Manager</td>\n<td>problema, prioridade e responsável claros</td>\n<td>Triagem</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">1</td>\n<td><a href=\"#docs-workflows-01-discovery-and-research\">Discovery</a></td>\n<td>PM (UX e TL por domínio)</td>\n<td>Product Discovery Team</td>\n<td>problema validado e viabilidade avaliada</td>\n<td>H1</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">2</td>\n<td><a href=\"#docs-workflows-02-product-and-ux-planning\">Produto e experiência</a></td>\n<td>PM / UX</td>\n<td>Product Planning Team</td>\n<td>gaps tratados e critérios aprovados</td>\n<td>H2</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">3</td>\n<td><a href=\"#docs-workflows-03-technical-specification\">Especificação técnica</a></td>\n<td>Tech Lead</td>\n<td>Technical Specification Team</td>\n<td>trade-offs registrados e tarefas executáveis</td>\n<td>H3</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">4</td>\n<td><a href=\"#docs-workflows-04-autonomous-implementation\">Implementação</a></td>\n<td>Tech Lead por exceção</td>\n<td>Orchestrator + Software Engineer</td>\n<td>verificações locais aprovadas</td>\n<td>—</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">5</td>\n<td><a href=\"#docs-workflows-05-adversarial-validation\">Validação adversarial</a></td>\n<td>Tech Lead (PM/UX por critério)</td>\n<td>QA, Security, Architecture, Reviewer</td>\n<td>checklist completo, sem bloqueadores</td>\n<td>—</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">6</td>\n<td><a href=\"#docs-workflows-06-pr-and-merge\">PR e merge</a></td>\n<td>Tech Lead ou Code Owner</td>\n<td>PR + Reviewer</td>\n<td>CI verde e aprovações válidas</td>\n<td>H4</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">7</td>\n<td><a href=\"#docs-workflows-07-release-candidate-validation\">Homologação</a></td>\n<td>PM / UX</td>\n<td>Release + Product Validation</td>\n<td>critérios validados ou plano de correção</td>\n<td>—</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">8</td>\n<td><a href=\"#docs-workflows-08-production-release-and-observation\">Entrega e observação</a></td>\n<td>Tech Lead (PM em R3/R4)</td>\n<td>Release + Observability</td>\n<td>janela pós-deploy sem regressão</td>\n<td>H5</td>\n</tr>\n<tr>\n<td style=\"text-align: right;\">9</td>\n<td><a href=\"#docs-workflows-09-knowledge-curation\">Curadoria de conhecimento</a></td>\n<td>owner do domínio alterado</td>\n<td>Knowledge</td>\n<td>documentação atual e sem contradições</td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model~80-intake-e-triagem-de-backlog\">8.0 Intake e triagem de backlog</h3>\n<p>Registra, deduplica, contextualiza e prioriza necessidades. Recebe problema, oportunidade, solicitação, feedback, incidente ou melhoria; valida campos, relaciona produto e repositório, identifica duplicidade e propõe risco. Entrega Work Item priorizável com contexto inicial, owner e risco preliminar.</p>\n<h3 id=\"docs-operating-model~81-discovery\">8.1 Discovery</h3>\n<p>Compreende problema, usuário, contexto, valor e viabilidade inicial. O <strong>Product Discovery Team</strong> reúne Product Manager Agent, UX Specification Agent e Tech Lead Discovery Agent em investigação paralela: cada um registra hipóteses no seu domínio, o Product Manager Agent sintetiza e os demais criticam a síntese.</p>\n<p>Entrega <code>PB.md</code> com problema, usuários, jornada, valor, restrições e riscos, acompanhado de evidências e perguntas abertas. O gate exige problema validado, experiência desejada compreendida e viabilidade inicial avaliada.</p>\n<h3 id=\"docs-operating-model~82-planejamento-de-produto-e-experiência\">8.2 Planejamento de produto e experiência</h3>\n<p>Transforma o problema em proposta clara, testável e utilizável. O <strong>Product Planning Team</strong> reúne Product Manager Agent, UX Specification Agent e Adversarial Product Manager Agent, mais agentes de pesquisa, conteúdo ou prototipação quando necessários. A dinâmica é proposta → protótipo e especificação de UX → crítica adversarial → revisão → consolidação.</p>\n<p>Entrega <code>PRD.md</code>, jornada e fluxo desejados, wireframe ou protótipo na fidelidade necessária, estados, conteúdo e critérios de acessibilidade, e critérios de sucesso e aceite. O conteúdo mínimo do PRD cobre objetivos, usuários, jornadas, escopo, fora de escopo, requisitos e métricas.</p>\n<h3 id=\"docs-operating-model~83-especificação-técnica\">8.3 Especificação técnica</h3>\n<p>Define como construir, validar, liberar e operar a solução. O <strong>Technical Specification Team</strong> reúne Specification Tech Lead Agent e Adversarial Tech Lead Agent, com Security, Data ou Platform Agent quando o risco exigir. A dinâmica é especificação → revisão crítica → resposta aos gaps → decisão.</p>\n<table>\n<thead>\n<tr>\n<th>Artefato</th>\n<th>Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>PLAN.md</code></td>\n<td>estratégia de implementação</td>\n</tr>\n<tr>\n<td><code>ADR.md</code></td>\n<td>decisões arquiteturais relevantes e consequências</td>\n</tr>\n<tr>\n<td><code>SPEC.md</code></td>\n<td>comportamento e contratos técnicos</td>\n</tr>\n<tr>\n<td><code>TASKS.md</code></td>\n<td>unidades pequenas de execução</td>\n</tr>\n<tr>\n<td><code>CHECKLIST.md</code></td>\n<td>critérios verificáveis de aceite</td>\n</tr>\n<tr>\n<td>Planos complementares</td>\n<td>testes, rollout, rollback e observabilidade conforme risco</td>\n</tr>\n</tbody>\n</table>\n<p>O gate exige gaps críticos tratados, trade-offs registrados e tarefas executáveis.</p>\n<h3 id=\"docs-operating-model~84-implementação\">8.4 Implementação</h3>\n<p>Implementa <strong>uma tarefa pequena por vez</strong>. O Orchestrator Agent distribui e os Software Engineer Agents executam, apoiados pelo repo harness, pelas skills e pelas ferramentas de código. Recebe tarefa, SPEC, critérios, contexto, permissões e gates; entrega código, testes, documentação, commits e evidências em um diff rastreável. A ação humana só ocorre diante de decisão, exceção ou escalonamento.</p>\n<h3 id=\"docs-operating-model~85-validação-adversarial\">8.5 Validação adversarial</h3>\n<p>Prova aderência à especificação e procura falhas que o autor não encontrou. Agentes de Validation/QA, Security, Architecture e Reviewer executam testes, verificação de segurança, análise arquitetural, acessibilidade, regressão e mutation testing quando aplicável. Entrega evidências vinculadas a cada critério e achados classificados. O gate exige checklist completo e ausência de bloqueadores.</p>\n<h3 id=\"docs-operating-model~86-code-review-pr-e-decisão-de-merge\">8.6 Code review, PR e decisão de merge</h3>\n<p>Avalia qualidade, risco, manutenibilidade e prontidão para integração. PR Agent e Reviewer Agent analisam diff, commits, resultados de validação e evidence pack, cobrindo código, testes, impacto arquitetural, contratos e documentação. O gate exige revisão aprovada, CI verde, branch atualizada e aprovações válidas.</p>\n<h3 id=\"docs-operating-model~87-homologação\">8.7 Homologação</h3>\n<p>Confirma valor e comportamento em cenário representativo. Release Agent e Product Validation Agent preparam preview, smoke, E2E, acessibilidade e demonstração, e coletam evidências. O PM responde por valor, o UX por experiência e o stakeholder participa quando necessário. O gate exige critérios de aceite validados ou plano de correção explícito.</p>\n<h3 id=\"docs-operating-model~88-entrega-e-observação\">8.8 Entrega e observação</h3>\n<p>Libera com exposição controlada e prova saúde no uso real. Release Agent e Observability Agent conduzem deploy progressivo, feature flag quando aplicável, monitoramento e comparação com baseline. Entrega versão liberada, sinais de saúde, changelog e — quando necessário — rollback ou pausa. O gate exige ambiente autorizado, migração compatível e janela pós-deploy sem regressão relevante.</p>\n<h3 id=\"docs-operating-model~89-atualização-da-base-de-conhecimento\">8.9 Atualização da base de conhecimento</h3>\n<p>Mantém a documentação alinhada ao produto real, de forma contínua e com revisão automatizada semanal. O Knowledge Agent consolida decisões, aprendizados e mudanças a partir de decisões, código, PR, homologação, release e incidentes, e procura contradições e obsolescência. O gate exige documentação atual, rastreável e sem contradições não resolvidas.</p>\n<hr>\n<h2 id=\"docs-operating-model~10-telemetria-e-melhoria-contínua--auto-dream\">10. Telemetria e melhoria contínua — Auto Dream</h2>\n<p>Esta é a etapa que fecha o ciclo sobre o próprio sistema de trabalho. O <a href=\"#docs-workflows-10-continuous-improvement\">workflow de telemetria e melhoria contínua</a> roda com coleta contínua, síntese semanal e execução extraordinária após incidente relevante. Os agentes envolvidos são Telemetry/Observability Agent, Auto Dream Agent e um Critic Agent independente; o owner é o trio, e cada demanda retorna ao owner do domínio. A cerimônia associada é H6.</p>\n<p>O escopo é deliberadamente amplo: produto, UX, engenharia, agentes, prompts, processo, harness, skills, scripts, ferramentas, hooks, gates, documentação e arquitetura do workflow.</p>\n<h3 id=\"docs-operating-model~101-por-que-telemetria-e-melhoria\">10.1 Por que \"Telemetria e melhoria\"</h3>\n<p>\"Auto Dream\" descreve um mecanismo; \"Telemetria e melhoria\" descreve o resultado operacional: enxergar como o sistema se comporta, distinguir sinal de ruído e converter evidência em aprendizado ou ação. Sem telemetria, melhoria contínua vira opinião. Sem retorno ao backlog e à memória, telemetria vira dashboard decorativo.</p>\n<h3 id=\"docs-operating-model~102-eventos-e-correlação-mínima\">10.2 Eventos e correlação mínima</h3>\n<p>Cada evento relevante carrega, quando aplicável, os campos abaixo. O padrão recomendado é instrumentar logs, métricas e traces correlacionáveis, com taxonomia versionada e política de retenção.</p>\n<table>\n<thead>\n<tr>\n<th>Dimensão</th>\n<th>Campos</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Identidade</td>\n<td><code>work_item_id</code>, produto, repositório, session/run ID, timestamp</td>\n</tr>\n<tr>\n<td>Execução</td>\n<td>fase, agente, modelo, versão de prompt/skill, tool usada</td>\n</tr>\n<tr>\n<td>Resultado</td>\n<td>input, output, status, retry, fallback, bloqueio, escalonamento</td>\n</tr>\n<tr>\n<td>Custo</td>\n<td>duração, tokens, custo, tamanho de contexto</td>\n</tr>\n<tr>\n<td>Verificação</td>\n<td>gate, resultado, evidência e duração</td>\n</tr>\n<tr>\n<td>Decisão</td>\n<td>decisão humana, owner e motivo</td>\n</tr>\n<tr>\n<td>Rastreio</td>\n<td>commit, PR, release, ambiente, classe de risco, nível de autonomia</td>\n</tr>\n<tr>\n<td>Proteção</td>\n<td>anonimização e tratamento de dados sensíveis</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"docs-operating-model~103-entradas-do-ciclo\">10.3 Entradas do ciclo</h3>\n<p>O ciclo consome sessões e decisões dos agentes, evidence packs e feedbacks humanos, falhas, retries, bloqueios e escalonamentos, resultados de hooks, CI, homologação e deploy, incidentes, rollbacks e defeitos escapados, métricas de tempo, custo, qualidade, UX e autonomia, feedback de usuário e sinais de produto, e as demandas de melhoria geradas anteriormente.</p>\n<h3 id=\"docs-operating-model~104-pipeline-automatizado\">10.4 Pipeline automatizado</h3>\n<ol>\n<li>Coletar sessões e eventos continuamente.</li>\n<li>Remover secrets e dados pessoais antes da análise.</li>\n<li>Validar completude, correlação e qualidade dos dados.</li>\n<li>Agrupar eventos por etapa, causa e tipo de impacto.</li>\n<li>Identificar padrões recorrentes e ocorrências isoladas.</li>\n<li>Comparar resultados com baseline e períodos anteriores.</li>\n<li>Distinguir aprendizado reutilizável de problema operacional.</li>\n<li>Procurar duplicidade, contradição e obsolescência na memória.</li>\n<li>Produzir evidências e nível de confiança para cada conclusão.</li>\n<li>Submeter conclusões a um Critic Agent independente.</li>\n<li>Consolidar itens confirmados e manter hipóteses inconclusivas em observação.</li>\n</ol>\n<h3 id=\"docs-operating-model~105-loop-a--aprendizado-validado\">10.5 Loop A — aprendizado validado</h3>\n<p>Identifica o que funcionou, para quem e em qual contexto, e registra evidências, origem, data e condições de reutilização. Antes de propor inclusão, atualização ou remoção no <code>MEMORY.md</code>, verifica duplicidade, contradição e validade temporal. Duas travas protegem esse loop: preferência isolada não vira regra global, e memória sensível exige aprovação humana.</p>\n<p><strong>Gate de memória:</strong> evidência vinculada à conclusão, escopo e contexto de aplicação explícitos, ausência de secrets ou dados pessoais, nenhuma contradição não resolvida, conhecimento acionável e reutilizável, e mudança sensível revisada por pessoa responsável.</p>\n<h3 id=\"docs-operating-model~106-loop-b--falha-ou-oportunidade-de-melhoria\">10.6 Loop B — falha ou oportunidade de melhoria</h3>\n<p>Descreve sintoma, impacto e etapa afetada; identifica causa provável e evidências; registra frequência e alcance; propõe ação corretiva e resultado esperado; gera demanda rastreável no backlog; relaciona sessões, execuções e incidentes de origem; e detecta e vincula duplicidades.</p>\n<p>Os tipos de melhoria previstos cobrem produto ou experiência, processo ou cerimônia, harness, skill ou prompt, script, ferramenta ou integração, hook ou gate, arquitetura do workflow, documentação, contexto ou memória, e observabilidade, segurança ou custo.</p>\n<table>\n<thead>\n<tr>\n<th>Campo da demanda</th>\n<th>Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Título</td>\n<td>orientado ao problema</td>\n</tr>\n<tr>\n<td>Sintoma e impacto</td>\n<td>o que se observa e o que custa</td>\n</tr>\n<tr>\n<td>Evidências e frequência</td>\n<td>origem e recorrência</td>\n</tr>\n<tr>\n<td>Hipótese de causa-raiz</td>\n<td>explicação candidata</td>\n</tr>\n<tr>\n<td>Melhoria proposta</td>\n<td>ação corretiva</td>\n</tr>\n<tr>\n<td>Critério de aceite</td>\n<td>mensurável</td>\n</tr>\n<tr>\n<td>Prioridade e risco sugeridos</td>\n<td>P0–P3 e classe R</td>\n</tr>\n<tr>\n<td>Owner recomendado</td>\n<td>quem deveria assumir</td>\n</tr>\n<tr>\n<td>Links</td>\n<td>sessões e artefatos relacionados</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Priorização.</strong> P0 é risco crítico, segurança ou perda de dados; P1, falha recorrente que bloqueia o fluxo; P2, retrabalho, custo ou baixa confiabilidade; P3, otimização incremental. Frequência não substitui impacto. O Auto Dream recomenda, o owner humano decide e o PM ordena o backlog.</p>\n<h3 id=\"docs-operating-model~107-painel-mínimo-do-trio\">10.7 Painel mínimo do trio</h3>\n<table>\n<thead>\n<tr>\n<th>Dimensão</th>\n<th>Owner</th>\n<th>Indicadores</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Produto e UX</strong></td>\n<td>PM + UX</td>\n<td>outcome e adoção; conversão ou conclusão da tarefa principal; erros de usuário, abandono e tempo na tarefa; feedback qualitativo e defeitos de experiência; acessibilidade e critérios de UX não atendidos</td>\n</tr>\n<tr>\n<td><strong>Fluxo</strong></td>\n<td>trio</td>\n<td>lead time (backlog→homologação); cycle time (implementação→merge); tempo por fase e tempo esperando decisão humana; aprovação na primeira passagem por gate; retrabalho após validação; bloqueios, retries e escalonamentos; % de gates automatizados; % de execução autônoma por classe de risco</td>\n</tr>\n<tr>\n<td><strong>Engenharia</strong></td>\n<td>Tech Lead</td>\n<td>falhas de build, testes e CI; defeitos e regressões pós-entrega; cobertura dos critérios de aceite; c
