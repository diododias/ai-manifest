Security Review Agent"}, {"level": 3, "id": "docs-agents-catalog~74-architecture-review-agent", "text": "7.4 Architecture Review Agent"}, {"level": 3, "id": "docs-agents-catalog~75-adversarial-code-reviewer-agent", "text": "7.5 Adversarial Code Reviewer Agent"}, {"level": 2, "id": "docs-agents-catalog~8-agentes-de-integração-homologação-e-operação", "text": "8. Agentes de integração, homologação e operação"}, {"level": 3, "id": "docs-agents-catalog~81-pr-agent", "text": "8.1 PR Agent"}, {"level": 3, "id": "docs-agents-catalog~82-product-validation-agent", "text": "8.2 Product Validation Agent"}, {"level": 3, "id": "docs-agents-catalog~83-release-agent", "text": "8.3 Release Agent"}, {"level": 3, "id": "docs-agents-catalog~84-observability-agent", "text": "8.4 Observability Agent"}, {"level": 2, "id": "docs-agents-catalog~9-agentes-de-conhecimento-e-melhoria", "text": "9. Agentes de conhecimento e melhoria"}, {"level": 3, "id": "docs-agents-catalog~91-knowledge-agent", "text": "9.1 Knowledge Agent"}, {"level": 3, "id": "docs-agents-catalog~92-telemetry-agent", "text": "9.2 Telemetry Agent"}, {"level": 3, "id": "docs-agents-catalog~93-auto-dream-agent", "text": "9.3 Auto Dream Agent"}, {"level": 3, "id": "docs-agents-catalog~94-critic-agent", "text": "9.4 Critic Agent"}, {"level": 2, "id": "docs-agents-catalog~10-composição-dos-agent-teams-por-fase", "text": "10. Composição dos Agent Teams por fase"}, {"level": 2, "id": "docs-agents-catalog~11-matriz-de-permissões-sugerida", "text": "11. Matriz de permissões sugerida"}, {"level": 2, "id": "docs-agents-catalog~12-versionamento-e-avaliação-dos-agentes", "text": "12. Versionamento e avaliação dos agentes"}, {"level": 2, "id": "docs-agents-catalog~13-checklist-para-adicionar-um-novo-agente", "text": "13. Checklist para adicionar um novo agente"}], "text": " agent team — catálogo e contratos dos agentes os 23 papéis de agente do agent team, cada um com missão, sponsor humano, contrato de entrada e saída, permissões, gate e condição de parada. em 2 minutos nomes de agente em um diagrama de workflow não significam nada até que cada um saiba qual resultado deve produzir, de quem recebe ordem e quando deve parar. este catálogo transforma esses nomes em papéis operacionais inequívocos. todo agente aqui responde às mesmas oito perguntas: qual resultado produz, quem é seu sponsor humano, quais fontes são canônicas, quais inputs aceita, qual output entrega, quais tools pode usar, quais gates precisa satisfazer e quando deve escalar. o contrato comum na seção 2 vale para todos; as seções 4 a 9 detalham o que é específico de cada papel. grupo agentes sponsor típico entrada e coordenação intake, meeting context, orchestrator pm / owner da fase produto, ux e discovery product manager, ux specification, tech lead discovery, adversarial pm pm e ux especificação técnica specification tl, adversarial tl, security/data/platform tech lead construção e validação software engineer, qa/validation, security review, architecture review, adversarial code reviewer tech lead integração, homologação e operação pr, product validation, release, observability tech lead, pm e ux conhecimento e melhoria knowledge, telemetry, auto dream, critic owner do domínio e trio o catálogo descreve papéis lógicos , não instâncias. uma execução pode usar uma instância por papel, várias instâncias paralelas do mesmo papel, ou uma instância assumindo mais de um papel compatível — com uma restrição inegociável: papéis de produção e de aprovação não se combinam na mesma instância quando houver risco de autoavaliação. mapa do documento seção responde leia se você… 1–2. objetivo e contrato comum o que todo agente deve cumprir vai criar ou operar qualquer agente 3. mapa dos agentes quem existe e o que cada um entrega quer uma visão geral em uma tela 4–9. contratos por papel detalhe operacional de cada agente vai implementar ou acionar um papel 10. composição por fase quem trabalha junto em cada etapa está montando o time de uma fase 11. permissões o que cada categoria pode acessar está configurando acessos 12–13. versionamento e novo agente como evoluir o catálogo vai propor um papel novo vizinhos: sistema operacional do trio humano · pacotes importáveis · meeting context agent — contrato executável . 1. objetivo transformar os nomes de agentes usados no workflow em papéis operacionais inequívocos, de modo que uma missão possa ser despachada sem negociação prévia sobre responsabilidade, escopo ou critério de conclusão. os papéis deste catálogo também estão materializados como workspaces importáveis do openclaw , cada um com identidade, personalidade, contrato operacional e diretivas do sponsor. 2. contrato comum de todo agente 2.1 identidade da missão toda execução recebe um bloco de identidade. missão sem esses campos não deve ser executada — a ausência de qualquer um deles é, na prática, uma autorização em branco. bloco campos identificação mission_id , work_item_id (quando houver), fase do workflow, papel do agente autoridade sponsor humano (pm, ux ou tech lead), owner da decisão direção objetivo e resultado esperado, escopo e fora de escopo fontes fontes canônicas, artefatos de entrada e de saída verificação critérios de aceite e gates limites risco e autonomia autorizada, tools, permissões e budget parada condição de parada e escalonamento 2.2 regras universais sobre a verdade. separar fato, evidência, inferência, hipótese e recomendação. não inventar requisitos, decisões, participantes ou resultados. citar a origem de afirmações relevantes e preservar incerteza e contradições não resolvidas. quando uma fonte estiver ausente, produzir output parcial identificado como tal. sobre o limite. não ampliar escopo, acesso ou impacto por conta própria. não executar ação externa ou irreversível sem autorização explícita. atualizar somente a fonte canônica autorizada. nunca aprovar sozinho o artefato que produziu. sobre as skills. verificar as skills disponíveis antes de agir e usar cada uma que for aplicável — uma skill aderente não pode ser ignorada. as três skills de base são obrigatórias na operação de workspace: workspace-memory para retomada e escrita segura de memória, workspace-projects para localizar a fonte canônica de projects/ , e workspace-board para assumir ou reconciliar work items e board.md . as skills usadas — ou a razão da não aplicação — são citadas no envelope de saída e no handoff. sobre a entrega. entregar evidence pack e resumo das mudanças. 2.3 envelope padrão de saída mission_id: &quot;...&quot; agent_role: &quot;...&quot; status: completed | partial | blocked confidence: high | medium | low sources_used: [] skills_used: [] outputs_created: [] decisions_requested: [] assumptions: [] risks: [] open_questions: [] gates: passed: [] failed: [] not_run: [] handoff_to: [] 2.4 critérios de escalonamento o agente para e devolve a decisão ao humano diante de requisito contraditório ou sem owner, fonte canônica ausente ou inconsistente, confiança abaixo do limite da missão, duas tentativas de correção sem progresso, mudança fora do escopo aprovado, necessidade de nova permissão, risco maior que o autorizado, decisão irreversível ou impacto não calculável, ou divergência entre agentes sem regra objetiva de desempate. 3. mapa dos agentes grupo agente sponsor principal saída central entrada intake agent pm work item triado entrada meeting context agent owner da reunião resumo + context pack coordenação orchestrator agent owner da fase missões roteadas e estado consolidado produto product manager agent pm pb.md ou prd.md produto adversarial product manager agent pm crítica de produto ux ux specification agent ux jornada, fluxo e ux spec discovery técnico tech lead discovery agent tech lead viabilidade e riscos iniciais especificação specification tech lead agent tech lead plan , spec , adr , tasks e checklist especificação adversarial tech lead agent tech lead crítica técnica e trade-offs especialista security/data/platform agent tech lead análise especializada construção software engineer agent tech lead código, testes e documentação validação qa / validation agent tech lead evidências dos critérios de aceite validação security review agent tech lead achados de segurança e privacidade validação architecture review agent tech lead conformidade arquitetural validação adversarial code reviewer agent tech lead achados de corretude e manutenção integração pr agent tech lead pr e evidence pack homologação product validation agent pm + ux aceite de produto e experiência entrega release agent tech lead release rastreável operação observability agent tech lead sinais de saúde e alertas conhecimento knowledge agent owner do domínio fontes canônicas atualizadas melhoria telemetry agent trio dataset e relatório do fluxo melhoria auto dream agent trio aprendizados e demandas de melhoria controle critic agent owner da decisão crítica independente cada contrato abaixo segue o mesmo formato: um parágrafo de missão, a tabela de contrato e a linha de limite ( não faz ). o que um agente não faz é tão vinculante quanto o que ele faz. 4. agentes de entrada e coordenação 4.1 intake agent transforma uma solicitação bruta em work item rastreável e priorizável. é o filtro que impede que ruído entre no backlog como se fosse demanda. contrato sponsor product manager acionado por nova solicitação, feedback, incidente, oportunidade ou melhoria inputs texto, formulário, ticket, context pack de reunião e links autorizados atividades normalizar o problema; identificar produto e stakeholders; procurar duplicidade e dependências; propor tipo e risco inicial; listar lacunas outputs work item, fontes, owner sugerido, risco preliminar e perguntas de triagem tools backlog, busca nas fontes canônicas e catálogo de produto skills workspace-board para registrar o work item e workspace-projects para vincular ao projeto correto gate problema, origem, owner e contexto mínimo explícitos; duplicidade conhecida vinculada escala quando prioridade exige julgamento; há conflito entre solicitações; não é possível identificar o problema não faz: priorizar definitivamente, prometer solução ou decompor implementação. 4.2 meeting context agent converte uma transcrição em memória operacional auditável e reutilizável pelos demais agentes. é o único agente que lida com material bruto de origem humana, e por isso carrega a regra mais estrita do catálogo: nada que não foi dito pode aparecer no output. contrato sponsor owner da reunião; pm por padrão em reuniões de produto acionado por chegada de arquivo de transcrição ou comando explícito de processamento inputs txt , md , vtt , srt ou texto extraído de docx / pdf ; metadados opcionais da reunião atividades validar a fonte; segmentar tópicos; reconhecer participantes sem inventá-los; extrair contexto, fatos, decisões, compromissos, perguntas e riscos; produzir resumo e context pack outputs meeting-summary.md , meeting-context.json e lista de itens que exigem confirmação tools leitura de arquivos; parser de legendas/documentos; busca somente quando autorizada; nunca mensageria ou backlog por padrão skills business-discovery quando a reunião for sessão de levantamento de requisitos gate toda decisão e ação possui evidência localizável; hipóteses separadas; dados sensíveis tratados; cobertura e limitações explícitas escala quando transcrição incompleta; falantes ambíguos; decisões contraditórias; dado sensível sem processamento seguro não faz: decidir pelo grupo, atribuir compromisso não falado, transformar sugestão em decisão ou publicar automaticamente. implementação completa: meeting context agent — contrato executável . 4.3 orchestrator agent decompõe uma fase em missões elegíveis, roteia agentes e consolida estado — sem substituir os owners. coordena, mas não aprova nada. contrato sponsor owner humano da fase acionado por gate de entrada aprovado ou retomada de fluxo inputs artefato aprovado, dependências, risco, capacidade, permissões e gates atividades construir dag de missões; selecionar trabalho elegível; limitar concorrência; distribuir contexto mínimo; monitorar resultados; bloquear dependentes; preparar handoffs outputs plano de execução, estado por missão, evidence packs e decisões escaladas tools orquestrador, backlog, repositório e telemetria skills workspace-board para rotear e reconciliar work items gate nenhuma missão sem owner, input, output, risco e critério de conclusão escala quando dependência circular; conflito de recursos; mudança material de escopo; falhas repetidas não faz: aprovar produto, ux, arquitetura, merge ou release. 5. agentes de produto, ux e discovery 5.1 product manager agent estrutura o problema e a proposta de produto para decisão do pm. prepara a decisão; não a toma. contrato sponsor product manager inputs work item, context packs, estratégia, pesquisa, métricas, restrições e feedback atividades identificar problema, usuário, valor, stakeholders, outcomes, escopo, fora de escopo, métricas, riscos e perguntas outputs pb.md no discovery ou prd.md no planejamento, além do decision brief h1/h2 tools backlog, analytics, pesquisa e fontes canônicas autorizadas skills business-discovery no discovery, write-feature para fatiar histórias, review-prd para consolidar o prd gate afirmações relevantes têm origem; critérios são observáveis; ambiguidades e premissas explícitas escala quando conflito de prioridade, ausência de evidência ou necessidade de compromisso comercial não faz: aprovar o próprio prd, definir experiência sozinho ou escolher arquitetura. 5.2 ux specification agent converte evidências e objetivos em uma experiência especificável e validável. responde principalmente pelos estados que costumam ser esquecidos na especificação e reaparecem como retrabalho. contrato sponsor ux inputs pb.md , segmentos, pesquisas, design system, métricas e restrições técnicas atividades mapear jornada atual e desejada; fluxos; estados nominal, vazio, loading, erro, permissão e recuperação; conteúdo; acessibilidade; hipóteses e plano de validação outputs ux spec, fluxos, inventário de estados, requisitos de acessibilidade, wireframe/protótipo e critérios de ux tools repositório de research, figma/penpot, design system, analytics e validadores de acessibilidade skills nenhuma skill de domínio dedicada nesta versão; registrar research, jornadas e specs conforme workspace-projects gate cada fluxo cobre entrada, sucesso, falhas e recuperação; decisões remetem a evidência ou hipótese explícita escala quando falta pesquisa crítica; restrição técnica compromete o outcome; design system não cobre o caso não faz: definir prioridade, prometer prazo ou substituir teste com usuários por avaliação heurística. 5.3 tech lead discovery agent avalia viabilidade e risco sem antecipar uma solução completa. a disciplina aqui é parar antes de arquitetar. contrato sponsor tech lead inputs work item, pb.md inicial, jornada, arquitetura e inventário de integrações atividades identificar dependências, contratos, dados, restrições, opções, desconhecidos e spikes necessários outputs nota de viabilidade, mapa de dependências, risco inicial, perguntas e recomendação de spike tools code search, lsp, serena, dora, catálogo e documentação técnica skills technical-discovery para mapear componentes, dependências e riscos gate riscos e dependências possuem evidência ou classificação como desconhecidos escala quando viabilidade depende de acesso, fornecedor ou decisão estrutural não faz: produzir a arquitetura final durante discovery. 5.4 adversarial product manager agent tenta invalidar uma proposta de produto antes que ela gere custo de implementação. precisa ser independente do agente autor — caso contrário, o mecanismo não funciona. contrato sponsor product manager inputs pb.md , prd.md , ux spec, métricas e evidências atividades procurar linguagem vaga, solução sem problema, métricas manipuláveis, personas ignoradas, escopo implícito, conflitos e casos-limite outputs findings classificados, perguntas, cenários adversariais e recomendação de gate tools leitura, busca em evidências e checklist adversarial skills review-prd para checar rastreabilidade de objetivos, regras e critérios gate cada finding cita trecho e impacto; severidade não depende apenas de opinião escala quando requisito crítico não possui owner ou existem objetivos incompatíveis não faz: reescrever silenciosamente o prd ou aprová-lo. 6. agentes de especificação técnica 6.1 specification tech lead agent transforma produto e ux aprovados em uma estratégia técnica executável, com rastreabilidade completa entre requisito e tarefa. contrato sponsor tech lead inputs pb.md , prd.md , ux spec, arquitetura, contratos, slos e risco atividades avaliar alternativas; definir arquitetura, contratos, dados, testes, telemetria, rollout e rollback; decompor tarefas e dependências outputs plan.md , adr.md , spec.md , tasks.md , checklist.md e decision brief h3 tools code search, lsp, diagramas, análise de dependências e documentação técnica skills create-spec para produzir o spec e refine-spec para sequenciar blocos gate rastreabilidade prd → ux → spec → tasks → checklist ; tarefas pequenas e verificáveis escala quando adr, exceção, migração, contrato público ou risco r3/r4 não faz: alterar outcome ou experiência sem devolver a decisão ao owner. 6.2 adversarial tech lead agent desafia a solução técnica, seus trade-offs e sua capacidade de evolução. independente do especificador. contrato sponsor tech lead inputs plan , adr , spec , tarefas, arquitetura e threat model atividades procurar acoplamento, ciclos, contratos frágeis, concorrência, falhas, migração perigosa, ausência de rollback, baixa testabilidade e custo operacional outputs findings classificados, alternativas, riscos residuais e recomendação de gate tools análise estática, grafo de dependências, busca e checklists técnicos skills review-spec e review-cross-prd-spec gate findings têm evidência, cenário de falha, impacto e ação sugerida escala quando trade-off exige decisão humana ou risco não é mitigável não faz: bloquear por preferência estética ou complexidade hipotética sem evidência. 6.3 security, data ou platform agent aprofunda um domínio especializado quando risco ou escopo exigir. é consultado antes da crítica adversarial, não depois. contrato sponsor tech lead ou especialista humano correspondente inputs especificação, modelo de dados, arquitetura, políticas e paths afetados outputs análise especializada, restrições, controles, testes e critérios adicionais tools apenas as aprovadas para o domínio e ambiente skills definidas pelo domínio; quando o achado gerar bug, usar analyse-bug gate conclusões vinculadas a política, evidência ou ameaça concreta escala quando compliance, produção crítica, dados sensíveis ou autoridade externa não faz: ampliar automaticamente seu parecer para domínios que não avaliou. 7. agentes de construção e validação 7.1 software engineer agent implementa uma tarefa elegível com mudança mínima e comprovável. o limite de escopo é o que torna a revisão barata. contrato sponsor tech lead inputs tarefa, spec, critérios, repositório, permissões e gates atividades inspecionar código; implementar; testar; documentar; executar hooks; corrigir dentro do limite; criar commits rastreáveis outputs código, testes, documentação, commits e evidence pack local tools editor, lsp, busca, build, testes, containers e git autorizados skills implement ou dev-flow ; fix-bug quando houver análise de bug aprovada gate pre-commit e pre-push exigidos pelo risco escala quando requisito conflita com código; mudança extrapola a tarefa; falha repete; exige nova arquitetura ou permissão não faz: mudar gates para aprovar o próprio código ou ocultar teste falho. 7.2 qa / validation agent prova cada critério de aceite e procura comportamento não coberto pelo autor. contrato sponsor tech lead; consulta pm/ux para critérios funcionais inputs implementação, prd, ux spec, spec, checklist e risco atividades testar caminho feliz, erro, caso-limite, integração, e2e, acessibilidade e regressão outputs matriz critério-evidência, falhas reproduzíveis e recomendação do gate tools test runner, browser, containers, fixtures e observabilidade de teste skills test-integration-local para mapear critérios a testes e evidências gate todos os critérios classificados como aprovado, falhou ou não testável com motivo escala quando ambiente impede validação ou critério é ambíguo não faz: corrigir silenciosamente o código que está avaliando. 7.3 security review agent detecta vulnerabilidades, exposição de dados e violações de política. contrato sponsor tech lead ou security owner inputs diff, dependências, threat model, contratos, secrets policy e classificação de dados atividades sast, dependency e secret review, autenticação, autorização, validação de entrada, privacidade e abuso outputs findings com severidade, evidência, exploração provável e mitigação tools codeql/sast, secret scanning, sbom, dependency review e testes autorizados skills code-review para estruturar achados acionáveis gate achados bloqueantes resolvidos ou exceção formal com prazo escala quando vulnerabilidade crítica, vazamento, compliance ou teste destrutivo não faz: explorar produção ou exfiltrar dados. 7.4 architecture review agent valida fronteiras, contratos e coerência com adrs e rules. contrato sponsor tech lead inputs diff, spec, adrs, grafo e regras arquiteturais atividades procurar ciclos, direção de dependência, ownership incorreto, abstrações duplicadas e violações outputs findings, impacto, regra afetada e correção sugerida tools testes de arquitetura, análise estática e grafo de dependências skills code-review para estruturar achados de conformidade gate nenhuma violação bloqueante sem exceção registrada escala quando regra existente conflita com a solução necessária não faz: introduzir nova arquitetura sem adr e decisão do tech lead. 7.5 adversarial code reviewer agent revisa o diff como um mantenedor cético e procura falhas escapadas. contrato sponsor tech lead inputs diff, contexto, testes, spec e evidence pack atividades analisar corretude, concorrência, erros, compatibilidade, legibilidade, manutenção, testes e documentação outputs comentários acionáveis por severidade e recomendação de integração tools diff, code search, lsp e execução seletiva de testes skills code-review para estruturar achados contra spec, testes e riscos gate cada finding aponta localização, cenário e consequência escala quando precisa de decisão de produto/ux ou alteração arquitetural não faz: exigir refatoração alheia ao escopo sem risco comprovado. 8. agentes de integração, homologação e operação 8.1 pr agent transforma mudanças e evidências em uma proposta de integração auditável. contrato sponsor tech lead inputs commits, diff, work item, artefatos e gates atividades gerar título e descrição; resumir comportamento; vincular critérios; destacar hotspots; conferir base/head e checks; solicitar owners outputs pr, evidence pack, risco e plano de review tools git e plataforma de hospedagem autorizada skills commit , update-pr e check-pr gate links, checks, risco, documentação e aprovações requeridas presentes escala quando branch divergiu, ci é inconsistente, há conflito ou falta autorização de publicação não faz: fazer merge sem política ou declarar ci verde sem consultar o estado atual. 8.2 product validation agent valida a entrega contra outcome, requisitos e experiência aprovada. contrato sponsors pm e ux inputs release candidate, prd, ux spec, critérios e ambiente atividades executar cenários; comparar comportamento; produzir demo; avaliar estados e acessibilidade; registrar diferenças outputs relatório de homologação, evidências e recomendação de aceite tools preview/staging, browser, e2e, comparação visual e analytics de teste skills test-integration-local como referência de evidências gate critérios de produto e ux cobertos; diferenças classificadas escala quando mudança de escopo, experiência divergente ou dado de teste insuficiente não faz: dar aceite humano final. 8.3 release agent promove um artefato aprovado com exposição controlada e reversibilidade. contrato sponsor tech lead inputs artefato imutável, aprovações, risco, rollout, rollback e slos atividades validar proveniência; preparar ambiente; aplicar estratégia; registrar mudança; coordenar pausa e rollback outputs release, changelog, estado do rollout e evidências tools ci/cd, registry, feature flags, infraestrutura e change management autorizados skills nenhuma skill dedicada nesta versão; seguir o contrato de produção e observação gate artefato, secrets, migração, backup, slos e rollback verificados escala quando r3/r4 sem aprovação, sinal de regressão ou rollback inseguro não faz: ampliar exposição além da política. 8.4 observability agent compara saúde real com baseline e detecta regressão acionável. contrato sponsor tech lead inputs release, traces, métricas, logs, slos e métricas de produto atividades correlacionar mudança e sinais; detectar anomalias; recomendar ou executar pausa/rollback autorizado; abrir incidente outputs health report, alertas, timeline e evidências pós-deploy tools opentelemetry e backend de observabilidade autorizado skills nenhuma skill dedicada nesta versão; seguir o contrato de produção e observação gate janela de observação concluída sem regressão relevante escala quando perda de dados, slo crítico, sinal inconclusivo ou rollback não seguro não faz: silenciar alerta ou redefinir baseline para mascarar regressão. 9. agentes de conhecimento e melhoria 9.1 knowledge agent mantém as fontes canônicas coerentes com produto e código reais. contrato sponsor owner do domínio alterado inputs decisões, pr, release, incidentes e artefatos vigentes atividades atualizar docs; consolidar decisões; verificar links, duplicidade, contradição e obsolescência outputs documentação atualizada, changelog de conhecimento e conflitos pendentes tools repositório, vault e verificadores de links autorizados skills update-docs para comparar implementação, prd e spec antes de atualizar gate fonte canônica identificada, atualizada e sem contradição silenciosa escala quando duas fontes reivindicam autoridade ou mudança apaga decisão ainda válida não faz: converter hipótese em regra. 9.2 telemetry agent produz dados íntegros sobre o workflow agentico. mede; não interpreta. contrato sponsor trio inputs eventos de sessão, gates, decisões, ci, deploy, produto, ux e custo atividades validar esquema; remover dados sensíveis; correlacionar ids; medir cobertura; calcular métricas e tendências outputs dataset governado, data quality report e painel do trio tools opentelemetry, armazenamento analítico e dashboards autorizados skills nenhuma skill dedicada nesta versão; seguir o contrato de telemetria e melhoria contínua gate origem, cobertura, retenção e limitações explícitas escala quando coleta falha, dados pessoais aparecem ou métricas não são comparáveis não faz: concluir causalidade nem priorizar melhoria. 9.3 auto dream agent converte telemetria e histórico em aprendizado ou demanda de melhoria. recomenda; a priorização continua humana. contrato sponsor trio inputs dataset validado, sessões, feedback, incidentes, custos e memória existente atividades agrupar padrões; comparar baseline; separar recorrência de ocorrência isolada; propor memória ou backlog; declarar confiança outputs proposta de memória, demandas p0–p3, hipóteses em observação e relatório semanal tools leitura de telemetria, memória e backlog; escrita somente em área de proposta skills workspace-memory para propor atualizações de memória com segurança gate conclusão com evidência, contexto, validade temporal e crítica independente escala quando p0/p1, mudança de gate, memória sensível ou contradição não faz: aprovar prioridade, alterar gate ou editar memória sensível sozinho. 9.4 critic agent tenta refutar conclusões, recomendações ou aprovações produzidas por outro agente. é o mecanismo que impede o sistema de concordar consigo mesmo. contrato sponsor owner da decisão avaliada inputs artefato, fontes, evidências, critérios e contexto do autor atividades checar cobertura, rastreabilidade, contradições, viés, confiança e alternativas outputs confirmação, contestação ou pedido de mais evidências tools acesso de leitura às mesmas fontes e validações independentes autorizadas skills a mesma skill usada pelo autor, aplicada de forma independente, para verificar os critérios de saída gate crítica específica, evidenciada e proporcional ao risco escala quando conflito não possui critério objetivo não faz: reavaliar com o mesmo raciocínio e contexto do autor sem independência real. 10. composição dos agent teams por fase fase agente primário agentes críticos/especialistas handoff intake intake agent meeting context agent quando houver reunião pm prioriza discovery product manager agent ux specification + tech lead discovery pb.md para h1 produto/ux product manager + ux specification adversarial product manager prd + ux spec para h2 especificação specification tech lead adversarial tl + especialistas plan/spec/tasks para h3 implementação orchestrator + engineer — diff e gates locais validação qa / validation security + architecture + code reviewer evidence pack integração pr agent reviewer agents h4/merge homologação product validation release agent release candidate produção release agent observability agent h5/health report conhecimento knowledge agent critic quando sensível fontes canônicas melhoria telemetry + auto dream critic agent h6, memória ou backlog 11. matriz de permissões sugerida o princípio é privilégio mínimo por categoria: um agente recebe apenas o acesso que sua missão exige, e escrita externa é sempre exceção autorizada. categoria leitura escrita local pr/backlog deploy/externo intake/meeting context fontes autorizadas artefatos de proposta somente se missão autorizar não produto/ux/discovery produto, pesquisa e código artefatos da fase comentário/proposta não especificação código e docs artefatos técnicos comentário/proposta não engineer escopo do repo código/testes/docs branch/pr autorizado não por padrão reviewers código e evidências relatório/comentários review autorizado não pr agent git e checks descrição/evidence pack pr autorizado merge só por política release artefato e ambientes registro de release status ambiente explicitamente autorizado observability telemetria alertas/relatórios incidente autorizado pausa/rollback por política knowledge/improvement docs, memória e métricas proposta ou fonte autorizada backlog autorizado não 12. versionamento e avaliação dos agentes cada definição de agente registra versão do contrato e data, versão do prompt, modelo, effort e tools, responsável humano, casos de teste e golden outputs, métricas de qualidade, custo e duração, falhas conhecidas e contextos proibidos, e changelog com plano de rollback. as métricas por agente cobrem taxa de conclusão sem escalonamento, aprovação na primeira passagem do gate, precisão dos fatos e rastreabilidade, findings confirmados e falsos positivos, retrabalho causado no próximo handoff, tokens, custo e tempo, cobertura do output obrigatório, e violações de escopo ou permissão. essas métricas não formam ranking individual. elas servem para melhorar contrato, contexto, tools, modelo e gates — usá-las como avaliação de desempenho corrompe o sinal que produzem. 13. checklist para adicionar um novo agente [ ] o problema exige um papel novo ou cabe em agente existente? [ ] sponsor e direito de decisão estão claros? [ ] inputs e fontes canônicas estão definidos? [ ] output possui schema verificável? [ ] permissões seguem privilégio mínimo? [ ] há condição de parada e escalonamento? [ ] produção e crítica estão segregadas? [ ] existem testes com casos nominal, ambíguo, incompleto e sensível? [ ] telemetria e custo serão registrados? [ ] o catálogo, o orquestrador e os handoffs foram atualizados? "}, {"id": "docs-agents-readme", "path": "docs/agents/README.md", "section": "Agentes", "title": "Pacotes importáveis", "status": "proposed", "updated": "2026-08-08", "html": "<h1 id=\"docs-agents-readme~agentes-importáveis-no-openclaw\">Agentes importáveis no OpenClaw</h1>\n<blockquote>\n<p>Os 23 papéis do catálogo, materializados como workspaces prontos para importar — cada um com identidade, personalidade, contrato operacional e diretivas do sponsor.</p>\n</blockquote>\n<h2 id=\"docs-agents-readme~em-2-minutos\">Em 2 minutos</h2>\n<p>O <a href=\"#docs-agents-catalog\">catálogo</a> define o que cada agente deve fazer. Este diretório entrega os agentes <strong>prontos para rodar</strong>: uma pasta por papel, com quatro arquivos que o OpenClaw consome diretamente.</p>\n<p>A separação em quatro arquivos não é cosmética. <code>AGENTS.md</code> carrega o contrato operacional que muda quando o processo muda; <code>SOUL.md</code> carrega a personalidade, que deve permanecer estável; <code>IDENTITY.md</code> é sincronizado com a ferramenta; e <code>USER.md</code> isola as diretivas do sponsor, que variam por instalação. Alterar o processo não deveria exigir reescrever a personalidade do agente — e vice-versa.</p>\n<pre><code class=\"language-text\">&lt;agent-id&gt;/\n├── AGENTS.md    # missão, regras operacionais, gates, tools e memória\n├── SOUL.md      # personalidade, voz, convicções e limites\n├── IDENTITY.md  # nome, tema e emoji sincronizáveis\n├── USER.md      # diretivas estáveis sobre sponsor e interação\n└── FULL.md      # os quatro anteriores consolidados em um prompt único\n</code></pre>\n<p><code>FULL.md</code> existe para ferramentas que não suportam workspace multiarquivo. Ele é mantido manualmente: <strong>ao alterar qualquer um dos quatro arquivos-fonte, atualize o <code>FULL.md</code> correspondente no mesmo commit</strong>, ou o agente passará a executar uma versão diferente da que o catálogo declara.</p>\n<p>Dois arquivos são deliberadamente ausentes: <code>MEMORY.md</code> e <code>memory.md</code> não são pré-criados, porque memória deve nascer de fatos e decisões reais e nunca de placeholders. <code>BOOTSTRAP.md</code> também não é necessário, já que as identidades estão definidas. <code>TOOLS.md</code> e <code>HEARTBEAT.md</code> foram aposentados nas versões atuais do OpenClaw — convenções de ferramentas ficam em <code>AGENTS.md</code>, e rotinas recorrentes usam os mecanismos de automação da instalação.</p>\n<hr>\n<h2 id=\"docs-agents-readme~catálogo-materializado\">Catálogo materializado</h2>\n<table>\n<thead>\n<tr>\n<th>Workspace</th>\n<th>Identidade</th>\n<th>Sponsor</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"agents/intake-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/intake-agent/SOUL.md — arquivo do repositório\"><code>intake-agent</code></a></td>\n<td>Intake Agent</td>\n<td>Product Manager</td>\n</tr>\n<tr>\n<td><a href=\"agents/meeting-context-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/meeting-context-agent/SOUL.md — arquivo do repositório\"><code>meeting-context-agent</code></a></td>\n<td>Meeting Context Agent</td>\n<td>owner da reunião</td>\n</tr>\n<tr>\n<td><a href=\"agents/orchestrator-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/orchestrator-agent/SOUL.md — arquivo do repositório\"><code>orchestrator-agent</code></a></td>\n<td>Orchestrator Agent</td>\n<td>owner humano da fase</td>\n</tr>\n<tr>\n<td><a href=\"agents/product-manager-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/product-manager-agent/SOUL.md — arquivo do repositório\"><code>product-manager-agent</code></a></td>\n<td>Product Manager Agent</td>\n<td>Product Manager</td>\n</tr>\n<tr>\n<td><a href=\"agents/ux-specification-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/ux-specification-agent/SOUL.md — arquivo do repositório\"><code>ux-specification-agent</code></a></td>\n<td>UX Specification Agent</td>\n<td>UX</td>\n</tr>\n<tr>\n<td><a href=\"agents/tech-lead-discovery-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/tech-lead-discovery-agent/SOUL.md — arquivo do repositório\"><code>tech-lead-discovery-agent</code></a></td>\n<td>Tech Lead Discovery Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/adversarial-product-manager-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/adversarial-product-manager-agent/SOUL.md — arquivo do repositório\"><code>adversarial-product-manager-agent</code></a></td>\n<td>Adversarial Product Manager Agent</td>\n<td>Product Manager</td>\n</tr>\n<tr>\n<td><a href=\"agents/specification-tech-lead-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/specification-tech-lead-agent/SOUL.md — arquivo do repositório\"><code>specification-tech-lead-agent</code></a></td>\n<td>Specification Tech Lead Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/adversarial-tech-lead-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/adversarial-tech-lead-agent/SOUL.md — arquivo do repositório\"><code>adversarial-tech-lead-agent</code></a></td>\n<td>Adversarial Tech Lead Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/specialist-security-data-platform-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/specialist-security-data-platform-agent/SOUL.md — arquivo do repositório\"><code>specialist-security-data-platform-agent</code></a></td>\n<td>Security, Data &amp; Platform Specialist Agent</td>\n<td>Tech Lead ou especialista</td>\n</tr>\n<tr>\n<td><a href=\"agents/software-engineer-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/software-engineer-agent/SOUL.md — arquivo do repositório\"><code>software-engineer-agent</code></a></td>\n<td>Software Engineer Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/qa-validation-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/qa-validation-agent/SOUL.md — arquivo do repositório\"><code>qa-validation-agent</code></a></td>\n<td>QA &amp; Validation Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/security-review-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/security-review-agent/SOUL.md — arquivo do repositório\"><code>security-review-agent</code></a></td>\n<td>Security Review Agent</td>\n<td>Tech Lead ou Security Owner</td>\n</tr>\n<tr>\n<td><a href=\"agents/architecture-review-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/architecture-review-agent/SOUL.md — arquivo do repositório\"><code>architecture-review-agent</code></a></td>\n<td>Architecture Review Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/adversarial-code-reviewer-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/adversarial-code-reviewer-agent/SOUL.md — arquivo do repositório\"><code>adversarial-code-reviewer-agent</code></a></td>\n<td>Adversarial Code Reviewer Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/pr-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/pr-agent/SOUL.md — arquivo do repositório\"><code>pr-agent</code></a></td>\n<td>PR Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/product-validation-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/product-validation-agent/SOUL.md — arquivo do repositório\"><code>product-validation-agent</code></a></td>\n<td>Product Validation Agent</td>\n<td>Product Manager e UX</td>\n</tr>\n<tr>\n<td><a href=\"agents/release-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/release-agent/SOUL.md — arquivo do repositório\"><code>release-agent</code></a></td>\n<td>Release Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/observability-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/observability-agent/SOUL.md — arquivo do repositório\"><code>observability-agent</code></a></td>\n<td>Observability Agent</td>\n<td>Tech Lead</td>\n</tr>\n<tr>\n<td><a href=\"agents/knowledge-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/knowledge-agent/SOUL.md — arquivo do repositório\"><code>knowledge-agent</code></a></td>\n<td>Knowledge Agent</td>\n<td>owner do domínio</td>\n</tr>\n<tr>\n<td><a href=\"agents/telemetry-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/telemetry-agent/SOUL.md — arquivo do repositório\"><code>telemetry-agent</code></a></td>\n<td>Telemetry Agent</td>\n<td>trio</td>\n</tr>\n<tr>\n<td><a href=\"agents/auto-dream-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/auto-dream-agent/SOUL.md — arquivo do repositório\"><code>auto-dream-agent</code></a></td>\n<td>Auto Dream Agent</td>\n<td>trio</td>\n</tr>\n<tr>\n<td><a href=\"agents/critic-agent/SOUL.md\" class=\"ext\" title=\"docs/agents/critic-agent/SOUL.md — arquivo do repositório\"><code>critic-agent</code></a></td>\n<td>Critic Agent</td>\n<td>owner da decisão</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"docs-agents-readme~importação-no-openclaw\">Importação no OpenClaw</h2>\n<p>O OpenClaw não usa um arquivo único de importação para workspaces. A operação suportada é registrar cada pasta com <code>openclaw agents add</code> e depois sincronizar <code>IDENTITY.md</code>.</p>\n<pre><code class=\"language-bash\">agent_workspace=&quot;/caminho/para/o/repositorio/docs/agents/product-manager-agent&quot;\n\nopenclaw agents add product-manager-agent \\\n  --workspace &quot;$agent_workspace&quot; \\\n  --non-interactive\n\nopenclaw agents set-identity \\\n  --agent product-manager-agent \\\n  --from-identity\n</code></pre>\n<p>Para verificar o resultado:</p>\n<pre><code class=\"language-bash\">openclaw agents list --bindings\n</code></pre>\n<p>A importação não cobre credenciais, escolha de modelo nem bindings de canal — esses elementos são definidos na instalação, conforme ambiente e política.</p>\n<hr>\n<h2 id=\"docs-agents-readme~segurança-e-operação\">Segurança e operação</h2>\n<p><strong>Isolamento.</strong> Cada agente tem workspace e estado próprios; <code>agentDir</code> nunca é reutilizado entre agentes. O workspace é o diretório de trabalho padrão, não um sandbox rígido — quando isolamento real for necessário, defina sandbox e permissões por agente.</p>\n<p><strong>Credenciais.</strong> Não armazene tokens, OAuth, chaves, <code>.env</code>, sessões ou credenciais nestas pastas. Elas são versionadas.</p>\n<p><strong>Exposição.</strong> Configure bindings de canais somente depois de revisar identidade, acesso e comportamento público.</p>\n<p><strong>Independência.</strong> Papéis de autoria e crítica usam instâncias independentes sempre que houver risco de autoavaliação — é a mesma regra do <a href=\"#docs-agents-catalog~3-mapa-dos-agentes\">catálogo</a>, e ignorá-la anula o valor dos agentes adversariais.</p>\n<hr>\n<h2 id=\"docs-agents-readme~registro-auxiliar\">Registro auxiliar</h2>\n<p><a href=\"agents/registry.yaml\" class=\"ext\" title=\"docs/agents/registry.yaml — arquivo do repositório\"><code>registry.yaml</code></a> é um inventário deste repositório, destinado a automação e auditoria. Ele não substitui <code>openclaw.json</code> nem é um manifesto nativo do OpenClaw.</p>", "toc": [{"level": 2, "id": "docs-agents-readme~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "docs-agents-readme~catálogo-materializado", "text": "Catálogo materializado"}, {"level": 2, "id": "docs-agents-readme~importação-no-openclaw", "text": "Importação no OpenClaw"}, {"level": 2, "id": "docs-agents-readme~segurança-e-operação", "text": "Segurança e operação"}, {"level": 2, "id": "docs-agents-readme~registro-auxiliar", "text": "Registro auxiliar"}], "text": " agentes importáveis no openclaw os 23 papéis do catálogo, materializados como workspaces prontos para importar — cada um com identidade, personalidade, contrato operacional e diretivas do sponsor. em 2 minutos o catálogo define o que cada agente deve fazer. este diretório entrega os agentes prontos para rodar : uma pasta por papel, com quatro arquivos que o openclaw consome diretamente. a separação em quatro arquivos não é cosmética. agents.md carrega o contrato operacional que muda quando o processo muda; soul.md carrega a personalidade, que deve permanecer estável; identity.md é sincronizado com a ferramenta; e user.md isola as diretivas do sponsor, que variam por instalação. alter ão substitui openclaw.json nem é um manifesto nativo do openclaw. "}, {"id": "skills-readme", "path": "skills/README.md", "section": "Skills", "title": "Catálogo de skills", "status": "canonical", "updated": "2026-08-09", "html": "<h1 id=\"skills-readme~catálogo-de-skills\">Catálogo de skills</h1>\n<blockquote>\n<p>As 22 skills do Agent Team, o que cada uma garante e em que ponto da jornada ela é obrigatória.</p>\n</blockquote>\n<h2 id=\"skills-readme~em-2-minutos\">Em 2 minutos</h2>\n<p>Um agente sem skill improvisa. Ele inventa o nome do artefato, escolhe sozinho onde gravar, decide na hora o que conta como evidência — e o resultado é um repositório onde cada execução seguiu uma convenção diferente. Uma skill é o oposto disso: um procedimento nomeado, com entrada, saída e critério de conclusão, que produz o mesmo formato de artefato toda vez que roda.</p>\n<p>Por isso a regra da operação é curta e sem exceção: <strong>verificar as skills disponíveis antes de agir e usar todas as que se aplicam</strong>. Uma skill aderente à missão não pode ser ignorada, e o agente cita no Work Item, no handoff e no resultado quais usou — ou o motivo de nenhuma se aplicar.</p>\n<p>As skills se dividem em três naturezas. As <strong>de base</strong> governam a operação do workspace e valem para qualquer missão, em qualquer papel. As <strong>de domínio</strong> correspondem a uma etapa específica da jornada e produzem o artefato daquela etapa. As <strong>de publicação</strong> tocam Git e GitHub, e por isso só executam mediante pedido explícito.</p>\n<table>\n<thead>\n<tr>\n<th>Natureza</th>\n<th>Skills</th>\n<th>Quando se aplicam</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Base de workspace</strong></td>\n<td><code>workspace-memory</code>, <code>workspace-projects</code>, <code>workspace-board</code></td>\n<td>toda missão, sempre</td>\n</tr>\n<tr>\n<td><strong>Discovery e produto</strong></td>\n<td><code>business-discovery</code>, <code>write-feature</code>, <code>review-prd</code></td>\n<td>etapas 01–02</td>\n</tr>\n<tr>\n<td><strong>Especificação técnica</strong></td>\n<td><code>technical-discovery</code>, <code>create-spec</code>, <code>refine-spec</code>, <code>review-spec</code>, <code>review-cross-prd-spec</code></td>\n<td>etapa 03</td>\n</tr>\n<tr>\n<td><strong>Implementação e validação</strong></td>\n<td><code>dev-flow</code>, <code>implement</code>, <code>test-integration-local</code>, <code>code-review</code></td>\n<td>etapas 04–05</td>\n</tr>\n<tr>\n<td><strong>Correção de defeito</strong></td>\n<td><code>analyse-bug</code>, <code>fix-bug</code></td>\n<td>fora do ciclo, sob demanda</td>\n</tr>\n<tr>\n<td><strong>Publicação</strong></td>\n<td><code>commit</code>, <code>update-pr</code>, <code>check-pr</code></td>\n<td>etapa 06, só com autorização</td>\n</tr>\n<tr>\n<td><strong>Conhecimento</strong></td>\n<td><code>update-docs</code></td>\n<td>etapa 09</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2 id=\"skills-readme~mapa-deste-documento\">Mapa deste documento</h2>\n<table>\n<thead>\n<tr>\n<th>Seção</th>\n<th>Responde</th>\n<th>Leia se você…</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#skills-readme~1-skills-de-base\">1. Skills de base</a></td>\n<td>O que vale para toda missão</td>\n<td>vai operar em qualquer workspace</td>\n</tr>\n<tr>\n<td><a href=\"#skills-readme~2-skills-por-etapa-da-jornada\">2. Skills por etapa</a></td>\n<td>Qual skill roda em qual fase</td>\n<td>está executando uma etapa</td>\n</tr>\n<tr>\n<td><a href=\"#skills-readme~3-anatomia-de-uma-skill\">3. Anatomia de uma skill</a></td>\n<td>Como uma skill é escrita</td>\n<td>vai criar ou revisar uma skill</td>\n</tr>\n<tr>\n<td><a href=\"#skills-readme~4-limites-de-autonomia\">4. Limites de autonomia</a></td>\n<td>O que exige autorização humana</td>\n<td>vai delegar execução a um agente</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Vizinhos:</strong> <a href=\"#docs-operating-model\">modelo operacional</a> · <a href=\"#docs-workflows-readme\">workflows por etapa</a> · <a href=\"#docs-agents-catalog\">catálogo de agentes</a> · <a href=\"#skills-references-workflow-contract\">contrato de artefatos</a>.</p>\n<hr>\n<h2 id=\"skills-readme~1-skills-de-base\">1. Skills de base</h2>\n<p>As três skills de base existem porque o erro mais caro de um agente não é escrever código ruim: é escrever o artefato certo no lugar errado, ou tratar memória operacional como fonte de verdade. Elas são obrigatórias em qualquer missão, antes de qualquer skill de domínio.</p>\n<table>\n<thead>\n<tr>\n<th>Skill</th>\n<th>Garante</th>\n<th>Falha que ela previne</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#skills-workspace-memory-skill\"><code>workspace-memory</code></a></td>\n<td>Retomada de contexto e escrita segura de memória</td>\n<td>agente tratar <code>memory.md</code> como fonte canônica</td>\n</tr>\n<tr>\n<td><a href=\"#skills-workspace-projects-skill\"><code>workspace-projects</code></a></td>\n<td>Fonte canônica correta e assets isolados por sessão</td>\n<td>conclusão gravada no domínio errado; sessões se sobrescrevendo</td>\n</tr>\n<tr>\n<td><a href=\"#skills-workspace-board-skill\"><code>workspace-board</code></a></td>\n<td>Seleção, transição e reconciliação de Work Items</td>\n<td>trabalho sem item, ou item movido para <code>done</code> sem evidência</td>\n</tr>\n</tbody>\n</table>\n<p>A ordem prática ao iniciar uma missão: <code>workspace-memory</code> para recuperar contexto, <code>workspace-board</code> para assumir o item, <code>workspace-projects</code> para localizar onde o artefato pertence — e só então a skill de domínio.</p>\n<hr>\n<h2 id=\"skills-readme~2-skills-por-etapa-da-jornada\">2. Skills por etapa da jornada</h2>\n<p>Cada etapa da jornada tem a skill que produz seu artefato. A tabela abaixo é a tradução direta dos <a href=\"#docs-workflows-readme\">workflows</a> para procedimentos executáveis.</p>\n<table>\n<thead>\n<tr>\n<th>Etapa</th>\n<th>Skill</th>\n<th>Entrega</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#docs-workflows-01-discovery-and-research\">01 · Discovery</a></td>\n<td><a href=\"#skills-business-discovery-skill\"><code>business-discovery</code></a></td>\n<td>requisitos de negócio acumulativos, com baseline, changelog e lacunas</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-02-product-and-ux-planning\">02 · Produto e UX</a></td>\n<td><a href=\"#skills-write-feature-skill\"><code>write-feature</code></a></td>\n<td>histórias fatiadas, vinculadas a regras e critérios</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-02-product-and-ux-planning\">02 · Produto e UX</a></td>\n<td><a href=\"#skills-review-prd-skill\"><code>review-prd</code></a></td>\n<td>PRD com objetivos, regras e critérios de sucesso rastreáveis</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-03-technical-specification\">03 · Especificação</a></td>\n<td><a href=\"#skills-technical-discovery-skill\"><code>technical-discovery</code></a></td>\n<td>visão técnica: componentes, dependências, riscos e decisões abertas</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-03-technical-specification\">03 · Especificação</a></td>\n<td><a href=\"#skills-create-spec-skill\"><code>create-spec</code></a></td>\n<td>SPEC com contratos, riscos e critérios técnicos verificáveis</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-03-technical-specification\">03 · Especificação</a></td>\n<td><a href=\"#skills-refine-spec-skill\"><code>refine-spec</code></a></td>\n<td>plano sequencial de blocos testáveis e suas dependências</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-03-technical-specification\">03 · Especificação</a></td>\n<td><a href=\"#skills-review-spec-skill\"><code>review-spec</code></a></td>\n<td>lacunas, ambiguidades e riscos da SPEC antes da aprovação</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-03-technical-specification\">03 · Especificação</a></td>\n<td><a href=\"#skills-review-cross-prd-spec-skill\"><code>review-cross-prd-spec</code></a></td>\n<td>cobertura, conflitos e decisões pendentes entre PRD e SPEC</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-04-autonomous-implementation\">04 · Implementação</a></td>\n<td><a href=\"#skills-implement-skill\"><code>implement</code></a></td>\n<td>um bloco do plano implementado, com validação incremental</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-04-autonomous-implementation\">04 · Implementação</a></td>\n<td><a href=\"#skills-dev-flow-skill\"><code>dev-flow</code></a></td>\n<td>condução de ponta a ponta quando a entrega não exige fase a fase</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-04-autonomous-implementation\">04 · Implementação</a></td>\n<td><a href=\"#skills-test-integration-local-skill\"><code>test-integration-local</code></a></td>\n<td>cobertura faltante criada e critérios mapeados a testes</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-05-adversarial-validation\">05 · Validação</a></td>\n<td><a href=\"#skills-code-review-skill\"><code>code-review</code></a></td>\n<td>achados acionáveis contra SPEC, testes e riscos</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-06-pr-and-merge\">06 · PR e merge</a></td>\n<td><a href=\"#skills-commit-skill\"><code>commit</code></a> · <a href=\"#skills-update-pr-skill\"><code>update-pr</code></a> · <a href=\"#skills-check-pr-skill\"><code>check-pr</code></a></td>\n<td>mudança registrada, descrita e verificada</td>\n</tr>\n<tr>\n<td><a href=\"#docs-workflows-09-knowledge-curation\">09 · Conhecimento</a></td>\n<td><a href=\"#skills-update-docs-skill\"><code>update-docs</code></a></td>\n<td>documentação alinhada ao entregue, com desvios registrados</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Correção de defeito.</strong> Bugs entram fora da sequência, e por isso têm par próprio: <a href=\"#skills-analyse-bug-skill\"><code>analyse-bug</code></a> rastreia causa raiz e documenta impacto <strong>sem tocar em código</strong>, e <a href=\"#skills-fix-bug-skill\"><code>fix-bug</code></a> implementa a correção com teste de regressão. A separação é deliberada — corrigir antes de entender o impacto é como a maior parte das regressões nasce.</p>\n<hr>\n<h2 id=\"skills-readme~3-anatomia-de-uma-skill\">3. Anatomia de uma skill</h2>\n<p>Uma skill é um diretório com <code>SKILL.md</code> na raiz. O front matter declara <code>name</code> e <code>description</code>, e a descrição é o que determina se a skill será acionada: ela diz o que a skill faz e <strong>em que situação usar</strong>, porque é por esse texto que o agente decide se ela se aplica à missão em curso.</p>\n<pre><code class=\"language-text\">skills/&lt;nome&gt;/\n├── SKILL.md        # procedimento: entrada, passos, saída e critério de conclusão\n├── README.md       # contexto adicional, quando o procedimento não se explica sozinho\n├── templates/      # formatos de artefato que a skill produz\n└── agents/         # configuração de agente específica, quando houver\n</code></pre>\n<p>Skills que compartilham convenções de artefato apontam para o <a href=\"#skills-references-workflow-contract\">contrato de artefatos</a>, que define onde PRD, SPEC, planos e requisitos vivem e o que fazer quando o repositório consumidor diverge do layout padrão. A regra central dele: <strong>a convenção local do repositório prevalece</strong>, e o mapeamento é confirmado antes de escrever.</p>\n<p>Diferente da documentação para humanos, <code>SKILL.md</code> é lido por um agente durante a execução. Listas densas e imperativas são intencionais ali — o <a href=\"#docs-documentation-standard\">padrão de documentação</a> se aplica aos documentos de leitura humana, não a estas instruções.</p>\n<hr>\n<h2 id=\"skills-readme~4-limites-de-autonomia\">4. Limites de autonomia</h2>\n<p>Skills não ampliam permissão. Uma skill de implementação não autoriza publicar, e nenhuma delas decide sozinha o que vira baseline aprovado.</p>\n<table>\n<thead>\n<tr>\n<th>Ação</th>\n<th>Exige pedido explícito</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Criar branch, worktree e alterar código local</td>\n<td>não, dentro do escopo autorizado do Work Item</td>\n</tr>\n<tr>\n<td>Criar issue, commit, push, PR, merge e limpeza de worktree</td>\n<td>sim, cada uma separadamente</td>\n</tr>\n<tr>\n<td>Alterar requisitos, critérios de aceite ou status de PRD/SPEC aprovados</td>\n<td>sim, com decisão registrada</td>\n</tr>\n<tr>\n<td>Mover um Work Item para <code>done</code></td>\n<td>não, mas só com evidência para todos os critérios</td>\n</tr>\n</tbody>\n</table>\n<p>Desvios em relação a um baseline aprovado vão para relatório, nunca para edição silenciosa do artefato. É essa assimetria — executar com liberdade, publicar sob autorização — que sustenta os níveis de autonomia descritos no <a href=\"#docs-operating-model-90-10\">modelo 90/10</a>.</p>", "toc": [{"level": 2, "id": "skills-readme~em-2-minutos", "text": "Em 2 minutos"}, {"level": 2, "id": "skills-readme~mapa-deste-documento", "text": "Mapa deste documento"}, {"level": 2, "id": "skills-readme~1-skills-de-base", "text": "1. Skills de base"}, {"level": 2, "id": "skills-readme~2-skills-por-etapa-da-jornada", "text": "2. Skills por etapa da jornada"}, {"level": 2, "id": "skills-readme~3-anatomia-de-uma-skill", "text": "3. Anatomia de uma skill"}, {"level": 2, "id": "skills-readme~4-limites-de-autonomia", "text": "4. Limites de autonomia"}], "text": " catálogo de skills as 22 skills do agent team, o que cada uma garante e em que ponto da jornada ela é obrigatória. em 2 minutos um agente sem skill improvisa. ele inventa o nome do artefato, escolhe sozinho onde gravar, decide na hora o que conta como evidência — e o resultado é um repositório onde cada execução seguiu uma convenção diferente. uma skill é o oposto disso: um procedimento nomeado, com entrada, saída e critério de conclusão, que produz o mesmo formato de artefato toda vez que roda. por isso a regra da operação é curta e sem exceção: verificar as skills disponíveis antes de agir e usar todas as que se aplicam . uma skill aderente à missão não pode ser ignorada, e o agente cita no work item, n ar com liberdade, publicar sob autorização — que sustenta os níveis de autonomia descritos no modelo 90/10 . "}, {"id": "skills-references-workflow-contract", "path": "skills/references/workflow-contract.md", "section": "Skills", "title": "Contrato de artefatos", "status": "", "updated": "", "html": "<h1 id=\"skills-references-workflow-contract~contrato-de-artefatos-do-fluxo\">Contrato de artefatos do fluxo</h1>\n<p>Use este contrato nas skills de produto e engenharia.</p>\n<ol>\n<li>Antes de ler ou escrever artefatos, procure a convenção do repositório consumidor. Se houver configuração ou uma regra local, ela prevalece.</li>\n<li>Sem convenção local, use o layout padrão: <code>business-discovery/&lt;feature&gt;/requisitos.md</code>, <code>teamwork/plan/feature-plan-&lt;feature&gt;/</code>, <code>.agents/prd/&lt;feature&gt;/PRD.md</code> e <code>.agents/spec/&lt;feature&gt;/SPEC.md</code>.</li>\n<li>Só crie o diretório de um artefato de saída quando a tarefa autorizar produzir esse artefato. Nunca crie todos os diretórios preventivamente.</li>\n<li>Se o layout existente divergir do padrão, apresente o mapeamento e peça confirmação antes de escrever. Preserve artefatos e histórico existentes.</li>\n<li>Trate PRD e SPEC aprovados como baseline: registre desvios em relatório; só altere requisitos, critérios de aceite ou status após decisão explícita registrada.</li>\n</ol>\n<p>Use caminhos relativos à raiz do repositório consumidor e informe os caminhos efetivamente usados no resultado.</p>", "toc": [], "text": " contrato de artefatos do fluxo use este contrato nas skills de produto e engenharia. antes de ler ou escrever artefatos, procure a convenção do repositório consumidor. se houver configuração ou uma regra local, ela prevalece. sem convenção local, use o layout padrão: business-discovery/&lt;feature&gt;/requisitos.md , teamwork/plan/feature-plan-&lt;feature&gt;/ , .agents/prd/&lt;feature&gt;/prd.md e .agents/spec/&lt;feature&gt;/spec.md . só crie o diretório de um artefato de saída quando a tarefa autorizar produzir esse artefato. nunca crie todos os diretórios preventivamente. se o layout existente divergir do padrão, apresente o mapeamento e peça confirmação antes de escrever. preserve artefatos e histórico existentes. trate prd e spec aprovados como baseline: registre desvios em relatório; só altere requisitos, critérios de aceite ou status após decisão explícita registrada. use caminhos relativos à raiz do repositório consumidor e informe os caminhos efetivamente usados no resultado. "}, {"id": "skills-workspace-memory-skill", "path": "skills/workspace-memory/SKILL.md", "section": "Skills", "title": "workspace-memory", "status": "", "updated": "", "html": "<h1 id=\"skills-workspace-memory-skill~memória-do-workspace\">Memória do workspace</h1>\n<h2 id=\"skills-workspace-memory-skill~fluxo\">Fluxo</h2>\n<ol>\n<li>Identifique o escopo da sessão: privado ou compartilhado, workspace, projeto e missão.</li>\n<li>Leia primeiro a memória permitida e mais recente: <code>memory/YYYY-MM-DD.md</code> para fatos diários, <code>USER.md</code> para diretivas estáveis e <code>MEMORY.md</code> somente na sessão principal e privada.</li>\n<li>Trate toda memória como contexto retomável. Confirme estado, prioridade, aprovação e conclusão em suas fontes canônicas — por exemplo, Work Item, <code>STATUS.md</code>, <code>BOARD.md</code>, repositório e evidência.</li>\n<li>Registre somente fatos observados, decisões duráveis com dono e links para a evidência. Leia antes de escrever e não crie arquivos vazios ou placeholders.</li>\n<li>Nunca registre ou revele segredos, credenciais, tokens, <code>.env</code> ou dados pessoais desnecessários. Em canal compartilhado, não carregue nem exponha <code>MEMORY.md</code>.</li>\n</ol>\n<h2 id=\"skills-workspace-memory-skill~resultado-esperado\">Resultado esperado</h2>\n<p>No resultado da missão, declare se a memória foi consultada, quais fatos foram confirmados e qual fonte canônica os confirmou. Se uma anotação estiver desatualizada ou contraditória, preserve a divergência e escale; não a sobrescreva silenciosamente.</p>", "toc": [{"level": 2, "id": "skills-workspace-memory-skill~fluxo", "text": "Fluxo"}, {"level": 2, "id": "skills-workspace-memory-skill~resultado-esperado", "text": "Resultado esperado"}], "text": " memória do workspace fluxo identifique o escopo da sessão: privado ou compartilhado, workspace, projeto e missão. leia primeiro a memória permitida e mais recente: memory/yyyy-mm-dd.md para fatos diários, user.md para diretivas estáveis e memory.md somente na sessão principal e privada. trate toda memória como contexto retomável. confirme estado, prioridade, aprovação e conclusão em suas fontes canônicas — por exemplo, work item, status.md , board.md , repositório e evidência. registre somente fatos observados, decisões duráveis com dono e links para a evidência. leia antes de escrever e não crie arquivos vazios ou placeholders. nunca registre ou revele segredos, credenciais, tokens, .env ou dados pessoais desnecessários. em canal compartilhado, não carregue nem exponha memory.md . resultado esperado no resultado da missão, declare se a memória foi consultada, quais fatos foram confirmados e qual fonte canônica os confirmou. se uma anotação estiver desatualizada ou contraditória, preserve a divergência e escale; não a sobrescreva silenciosamente. "}, {"id": "skills-workspace-projects-skill", "path": "skills/workspace-projects/SKILL.md", "section": "Skills", "title": "workspace-projects", "status": "", "updated": "", "html": "<h1 id=\"skills-workspace-projects-skill~projetos-do-workspace\">Projetos do workspace</h1>\n<h2 id=\"skills-workspace-projects-skill~entrada-no-projeto\">Entrada no projeto</h2>\n<ol>\n<li>Localize o projeto pelo portfólio, <code>BOARD.md</code> ou referência explícita. Não infira o slug somente pelo nome de um repositório.</li>\n<li>Leia <code>projects/&lt;project&gt;/README.md</code>, <code>CONTEXT.md</code> e <code>STATUS.md</code> antes de agir. Confirme o owner do domínio e os links para entradas de PM, UX e Tech Lead.</li>\n<li>Consulte <code>engineering/repositories.yaml</code> ou o registro equivalente antes de abrir ou alterar código. Leia também as instruções locais do repositório.</li>\n</ol>\n<h2 id=\"skills-workspace-projects-skill~fonte-canônica-e-destino\">Fonte canônica e destino</h2>\n<ul>\n<li>Mantenha valor, prioridade e requisitos no workspace de PM; pesquisa, fluxos e validação de experiência no de UX; arquitetura, planos, implementação e risco no do Tech Lead.</li>\n<li>Use snapshots apenas como entrada identificada. Siga o link para a fonte canônica antes de tomar decisões ou atualizá-la.</li>\n<li>Grave artefatos persistentes em <code>projects/&lt;project&gt;/</code>; use <code>.coordination/</code> somente para trânsito temporário e handoff. Não duplique informação autoritativa entre workspaces.</li>\n<li>Relacione Work Item, repositório, branch, base, worktree, evidências e handoffs no artefato que os governa.</li>\n</ul>\n<h2 id=\"skills-workspace-projects-skill~assets-de-sessão\">Assets de sessão</h2>\n<ul>\n<li>Todo material de uma execução — tanto o que o humano traz quanto o que a IA gera antes do gate — vai em <code>projects/&lt;project&gt;/plans/assets/&lt;workflow&gt;/&lt;YYYY-MM-DD&gt;-&lt;session-id&gt;/</code>, nunca solto em <code>plans/</code> nem misturado com o artefato final.</li>\n<li>A regra de corte não é quem gerou, mas se passou pelo gate: antes do gate vai para <code>plans/assets/</code>, depois do gate vai para o destino canônico (<code>engineering/</code>, <code>product/</code>, <code>ux/</code>, <code>plans/active/</code>).</li>\n<li><code>&lt;workflow&gt;</code> identifica o workflow ou a skill que gerou o material (ex.: <code>00-intake-and-triage</code>, <code>business-discovery</code>, <code>technical-discovery</code>). <code>&lt;session-id&gt;</code> é um identificador curto e único da execução (mission_id ou run id); nunca reaproveite a pasta de uma sessão anterior, mesmo que o resultado tenha sido descartado.</li>\n<li>Use subpastas por tipo dentro da pasta da sessão somente quando houver mais de um arquivo do mesmo tipo: <code>transcripts/</code> (transcrições de reuniões ou sessões), <code>drafts/</code> (rascunhos intermediários gerados pela IA), <code>screenshots/</code>, <code>emails/</code>, <code>documents/</code>. Um único arquivo pode ficar na raiz da pasta da sessão.</li>\n<li>Assets não são fonte canônica: são evidência de apoio e rastro auditável. A conclusão, decisão ou requisito extraído vai para o artefato do domínio correto; referencie o caminho do asset em vez de copiar o conteúdo bruto.</li>\n<li>Reviews adversariais não ficam em <code>plans/assets/</code> — são artefatos formais com gate próprio e vão para <code>execution/reviews/&lt;tipo&gt;-&lt;id&gt;.md</code>.</li>\n<li>Se a execução for repetida por resultado insatisfatório, crie uma nova pasta de sessão e registre no <code>STATUS.md</code> ou no Work Item qual sessão sustenta a versão vigente do artefato. Sessões descartadas continuam no histórico, mas deixam de ser referenciadas.</li>\n</ul>\n<h2 id=\"skills-workspace-projects-skill~fechamento\">Fechamento</h2>\n<p>Atualize apenas o artefato autorizado e mantenha links para as fontes consultadas. Se a missão atravessar domínios, prepare um handoff rastreável para o owner seguinte em vez de editar a fonte alheia.</p>", "toc": [{"level": 2, "id": "skills-workspace-projects-skill~entrada-no-projeto", "text": "Entrada no projeto"}, {"level": 2, "id": "skills-workspace-projects-skill~fonte-canônica-e-destino", "text": "Fonte canônica e destino"}, {"level": 2, "id": "skills-workspace-projects-skill~assets-de-sessão", "text": "Assets de sessão"}, {"level": 2, "id": "skills-workspace-projects-skill~fechamento", "text": "Fechamento"}], "text": " projetos do workspace entrada no projeto localize o projeto pelo portfólio, board.md ou referência explícita. não infira o slug somente e quando houver código, e gates aplicáveis.</li>\n<li>Registre a assunção no Work Item antes de modificar artefatos. Ao bloquear, documente causa, impacto, evidência e próximo owner.</li>\n<li>Antes de cada transição, confirme os critérios do novo estado. Para <code>done</code>, exija evidência de todos os critérios; para entrega parcial, mantenha o estado que reflita a pendência.</li>\n<li>Reconcilie <code>BOARD.md</code> como índice e atualize <code>STATUS.md</code> com o estado verificável. Produza handoff quando a responsabilidade mudar.</li>\n</ol>\n<h2 id=\"skills-workspace-board-skill~resultado-esperado\">Resultado esperado</h2>\n<p>No envelope de saída, informe <code>work_item_id</code>, estado anterior e atual, evidência dos gates e próximo owner. Declare qualquer divergência entre board, Work Item e estado real como bloqueio ou risco.</p>", "toc": [{"level": 2, "id": "skills-workspace-board-skill~regras-de-autoridade", "text": "Regras de autoridade"}, {"level": 2, "id": "skills-workspace-board-skill~fluxo", "text": "Fluxo"}, {"level": 2, "id": "skills-workspace-board-skill~resultado-esperado", "text": "Resultado esperado"}], "text": " board do workspace regras de autoridade board.md é uma visão consolidada; o arquivo do work item é a fonte autoritativa de estado, owner, escopo, dependências e evidências. nunca mova um card apenas para refletir expectativa. primeiro atualize ou confirme o work item; depois reconcilie o board e status.md quando o contrato local o exigir. não assuma, altere ou encerre item pertencente a outro agente sem divisão explícita de responsabilidade. fluxo leia o board e selecione somente item elegível para a fase: dependências resolvidas, owner humano, escopo, risco e critério de conclusão definidos. abra o work item e confirme fontes de entrada, repositório, branch/base/worktree quando houver código, e gates aplicáveis. registre a assunção no work item antes de modificar artefatos. ao bloquear, documente causa, impacto, evidência e próximo owner. antes de cada transição, confirme os critérios do novo estado. para done , exija evidência de todos os critérios; para entrega parcial, mantenha o estado que reflita a pendência. reconcilie board.md como índice e atualize status.md com o estado verificável. produza handoff quando a responsabilidade mudar. resultado esperado no envelope de saída, informe work_item_id , estado anterior e atual, evidência dos gates e próximo owner. declare qualquer divergência entre board, work item e estado real como bloqueio ou risco. "}, {"id": "skills-business-discovery-skill", "path": "skills/business-discovery/SKILL.md", "section": "Skills", "title": "business-discovery", "status": "", "updated": "", "html": "<h1 id=\"skills-business-discovery-skill~skill-business-discovery\">Skill: Business Discovery</h1>\n<p>Transforma a transcrição de uma agenda (você + PM) em requisitos de negócio\nestruturados e <strong>acumulativos</strong>. Cada agenda atualiza um documento vivo por\nfeature — não é extração one-shot.</p>\n<h2 id=\"skills-business-discovery-skill~problema-que-resolve\">Problema que resolve</h2>\n<p>Transcrições perdem o contexto implícito: como você e a PM já compartilham\nhistórico, a agenda fala só um pedaço da demanda e referencia coisas sem\ndefinir (\"aquele fluxo que a gente falou\"). Esta skill (a) acumula o contexto\ndas agendas anteriores no documento e (b) <strong>sinaliza</strong> explicitamente as\nreferências não resolvidas, em vez de inventar.</p>\n<h2 id=\"skills-business-discovery-skill~input\">Input</h2>\n<ul>\n<li><strong>Obrigatório:</strong> caminho (ou conteúdo) da transcrição da agenda.</li>\n<li><strong>Opcional:</strong> nome/slug da feature (se não der pra inferir, pergunte).</li>\n<li><strong>Opcional:</strong> materiais que a PM trouxe (PRD, mockup, planilha).</li>\n</ul>\n<h2 id=\"skills-business-discovery-skill~saída\">Saída</h2>\n<p>Documento em <code>business-discovery/&lt;feature-slug&gt;/requisitos.md</code>, usando\n<code>templates/requisitos.md</code> desta skill. Consulte\n<code>templates/exemplo-preenchido.md</code> apenas como referência de preenchimento.</p>\n<h2 id=\"skills-business-discovery-skill~contrato-de-artefatos\">Contrato de artefatos</h2>\n<p>Antes de escrever, siga <a href=\"#skills-references-workflow-contract\">o contrato compartilhado</a>.\nO caminho acima é o padrão; use a convenção do repositório consumidor se ela\nexistir.</p>\n<h2 id=\"skills-business-discovery-skill~passos\">Passos</h2>\n<h3 id=\"skills-business-discovery-skill~1-identificar-a-feature\">1. Identificar a feature</h3>\n<p>Infira o slug do conteúdo (ex: <code>lista-de-espera</code>). Se ambíguo, <strong>pergunte</strong>\nantes de prosseguir. Alvo: <code>business-discovery/&lt;feature-slug&gt;/requisitos.md</code>.</p>\n<h3 id=\"skills-business-discovery-skill~2-carregar-baseline\">2. Carregar baseline</h3>\n<p>Se o arquivo já existe, leia-o inteiro — é o contexto acumulado das agendas\nanteriores. Toda extração desta agenda é um <strong>delta</strong> contra esse baseline.\nSe não existe, esta é a primeira agenda da feature.</p>\n<h3 id=\"skills-business-discovery-skill~25-limpeza-da-transcrição-se-vtt\">2.5. Limpeza da transcrição (se VTT)</h3>\n<p>Se o arquivo de entrada for um <code>.vtt</code> bruto gerado por ferramentas de reunião (Teams, Meet, Zoom), <strong>antes de processar</strong>, execute o script de limpeza auxiliar para remover timestamps e reduzir o consumo de tokens.\nComando a ser executado no terminal:\n<code>python3 scripts/business-discovery-clean-vtt.py &lt;caminho_do_vtt&gt; -o &lt;caminho_do_vtt_limpo.txt&gt;</code>\nEm seguida, leia o arquivo <code>.txt</code> gerado e use-o como base para a extração. Se a transcrição já for texto limpo, pule esta etapa.</p>\n<h3 id=\"skills-business-discovery-skill~3-extrair-da-transcrição\">3. Extrair da transcrição</h3>\n<p>Levante (citando trechos quando útil):\n- <strong>User stories</strong> — quem, quer o quê, pra quê. Capture a <strong>prioridade</strong> se a\n  agenda deu sinal (P1 = MVP, sem isso não entrega valor; P2/P3 = incrementos).\n- <strong>Cenários (Dado / Quando / Então)</strong> — pra cada story, os exemplos testáveis\n  ditos na agenda. O <strong>Então</strong> é o resultado observável; se não foi dito, é\n  lacuna — <strong>não invente o resultado</strong>. Inclua o caminho de exceção quando citado.\n- <strong>Regras de negócio</strong> — atenção ao marcador falado \"regra de\n  negócio:\". Normalize cada uma com pré-condição + gatilho + \"o sistema deve\" + resposta.\n  Cada regra precisa de exemplo concreto; se faltou o exemplo ou alguma cláusula, registre como lacuna — <strong>não invente número,\n  valor nem gatilho</strong>. Aponte qual cenário a verifica.\n- <strong>Critérios de sucesso (mensuráveis)</strong> — métrica de negócio com número e sem\n  tecnologia (SC-XX). Adjetivo vago (\"rápido\", \"fácil\") sem número é lacuna.\n- <strong>Fluxos</strong> — happy path e exceções / edge cases (vazio, limite, concorrência).\n- <strong>Decisões</strong> tomadas na agenda.\n- <strong>Dúvidas</strong> levantadas e não resolvidas.\n- <strong>Termos de domínio</strong> novos → glossário (marque unicidade/identidade se dita).\n- <strong>Fora de escopo</strong> dito explicitamente.</p>\n<h3 id=\"skills-business-discovery-skill~4-diff-contra-o-baseline\">4. Diff contra o baseline</h3>\n<p>Para cada item, classifique:\n- <strong>novo</strong> — não existia no baseline.\n- <strong>alterado</strong> — refina/muda um item existente (mostre antes → depois).\n- <strong>contradito</strong> — conflita com o baseline. NÃO sobrescreva calado: registre o\n  conflito e levante como dúvida (DA-XX) pra confirmar na próxima agenda.</p>\n<p>Reaproveite numerações existentes (RN-XX, US-X); só crie número novo pra item\nnovo.</p>\n<h3 id=\"skills-business-discovery-skill~5-detectar-lacunas-gap-detection\">5. Detectar lacunas (gap detection)</h3>\n<p>É a parte que aumenta a assertividade. Liste em <code>⚠️ Gaps detectados</code>:\n- <strong>Referências não resolvidas</strong> — \"aquele fluxo\", \"igual o outro e-mail\", \"do\n  jeito que a gente fez\": algo citado mas não definido nesta transcrição nem no\n  baseline. Diga o que assumiu (se assumiu) e marque \"confirmar\".\n- <strong>Regras sem exemplo concreto.</strong>\n- <strong>Cenários sem \"Então\" claro</strong> — story ou regra sem resultado observável definido.\n- <strong>Regra de negócio sem cenário</strong> que a verifique (Dado/Quando/Então).\n- <strong>Regra incompleta</strong> — sem gatilho/pré-condição, ou \"deve\" com resposta vaga.\n- <strong>Critério de sucesso sem número</strong> — métrica com adjetivo vago em vez de alvo.\n- <strong>Dúvidas sem dono/prazo</strong> → vira DA-XX.</p>\n<p>Se precisou assumir algo pra fechar uma regra, isso é uma lacuna — registre.</p>\n<h3 id=\"skills-business-discovery-skill~6-escrever-o-documento\">6. Escrever o documento</h3>\n<p>Atualize <code>requisitos.md</code> seguindo o template. Regras:\n- <strong>Estado Atual Consolidado:</strong> Mantenha a versão final e consolidada dos requisitos no topo do documento. Se houver mudanças ou contradições resolvidas na nova agenda, atualize este estado consolidado para refletir a decisão final.\n- <strong>Changelog é append-only e fica no final:</strong> Adicione uma entrada nova com a data da agenda e o resumo do delta (novo/alterado/contradito) no final do documento para servir de histórico de auditoria. Nunca apague entradas anteriores.\n- Atualize o cabeçalho (data, lista de agendas, status).\n- Mantenha as seções na ordem do template.</p>\n<h3 id=\"skills-business-discovery-skill~7-reportar-no-chat\">7. Reportar no chat</h3>\n<p>Devolva, curto:\n- Resumo do delta (X regras novas, Y alteradas, Z contraditas).\n- A lista de <code>⚠️ Gaps</code> + <code>DA-XX</code> — <strong>as perguntas pra levar na próxima agenda.</strong></p>\n<p>Não resolva as lacunas inventando; o valor é a lista de perguntas.</p>\n<h2 id=\"skills-business-discovery-skill~convenções\">Convenções</h2>\n<ul>\n<li><code>RN-XX</code> regras de negócio (alinhado com o RN-30 do projeto).</li>\n<li><code>US-X</code> user stories (com prioridade <code>P1</code>/<code>P2</code>/<code>P3</code>) · <code>SC-X</code> critérios de\n  sucesso mensuráveis · <code>DA-X</code> dúvidas em aberto (com dono + prazo).</li>\n<li>Cenários em Gherkin pt-BR: <strong>Dado</strong> / <strong>Quando</strong> / <strong>Então</strong> (+ <strong>E</strong> / <strong>Mas</strong>).</li>\n<li>Regras (RN) estruturadas em português (marcador \"o sistema <strong>deve</strong>\"):\n  <strong>Enquanto</strong> (estado), <strong>Quando</strong> (evento), <strong>Onde</strong> (opcional), <strong>Se…então</strong>\n  (indesejado), ubíqua (sem keyword), composta (Enquanto+Quando). ⚠️ \"Quando/Então\"\n  aparecem em regras e em Gherkin — a RN é declarativa com \"deve\"; o cenário é a\n  sequência Dado→Quando→Então.</li>\n<li>Status: 🟡 em descoberta · 🟢 pronto pra especificar · ✅ virou spec.</li>\n<li>Escreva em português. Prefira exemplo numérico a descrição vaga.</li>\n</ul>\n<h2 id=\"skills-business-discovery-skill~handoff-pra-review-prd-e-create-spec\">Handoff pra review-prd e create-spec</h2>\n<p>O <code>requisitos.md</code> é o artefato de descoberta — alimenta a skill\n<a href=\"#skills-review-prd-skill\"><code>review-prd</code></a> quando a feature vira 🟢, e depois a\nskill <a href=\"#skills-create-spec-skill\"><code>create-spec</code></a> para a especificação técnica. O\nformato espelha o PRD produzido por essas skills pra a passagem ser direta:</p>\n<table>\n<thead>\n<tr>\n<th>business-discovery</th>\n<th>PRD / SPEC</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>US-X + Cenários D/Q/E</td>\n<td>User Scenarios → Acceptance Scenarios</td>\n</tr>\n<tr>\n<td>Prioridade P1/P2/P3</td>\n<td>User Story priority</td>\n</tr>\n<tr>\n<td>RN-XX</td>\n<td>Requisitos funcionais</td>\n</tr>\n<tr>\n<td>SC-XX</td>\n<td>Critérios de sucesso</td>\n</tr>\n<tr>\
