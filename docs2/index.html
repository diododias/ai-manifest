<style>
:root{
  --bg:#0f1115; --panel:#161a21; --panel2:#1b2029; --border:#262c37;
  --text:#e6e9ef; --muted:#9aa4b2; --accent:#7c9cff; --accent2:#a58bff;
  --code-bg:#0b0d11; --hover:#20262f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; min-height:100vh;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}

/* Sidebar */
#sidebar{
  width:300px; min-width:300px; background:var(--panel); border-right:1px solid var(--border);
  height:100vh; position:sticky; top:0; overflow-y:auto; padding:0;
}
.brand{padding:20px 22px 14px; border-bottom:1px solid var(--border)}
.brand h1{font-size:16px;margin:0;letter-spacing:.2px}
.brand p{font-size:12px;color:var(--muted);margin:6px 0 0}
#search{width:100%;margin-top:12px;padding:9px 12px;background:var(--panel2);
  border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
#search:focus{border-color:var(--accent)}
nav{padding:10px 12px 40px}
.sec{margin:6px 0}
.sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  padding:12px 10px 6px;font-weight:600}
.nav-link{display:block;padding:7px 12px;border-radius:7px;color:var(--text);font-size:13.5px;cursor:pointer}
.nav-link:hover{background:var(--hover);text-decoration:none}
.nav-link.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b0d11;font-weight:600}
.nav-link.tldr{color:var(--accent)}
.nav-link.active.tldr{color:#0b0d11}

/* Content */
#main{flex:1;min-width:0;display:flex;justify-content:center}
#content{max-width:820px;width:100%;padding:44px 48px 120px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px}
.md h1{font-size:30px;line-height:1.25;margin:.2em 0 .6em;border-bottom:1px solid var(--border);padding-bottom:.35em}
.md h2{font-size:22px;margin:1.6em 0 .5em;padding-top:.2em}
.md h3{font-size:17px;margin:1.4em 0 .4em;color:#cfd6e2}
.md p{margin:.7em 0}
.md ul,.md ol{padding-left:1.4em}
.md li{margin:.3em 0}
.md blockquote{margin:1em 0;padding:.5em 1em;border-left:3px solid var(--accent);
  background:var(--panel2);color:#c7cfdb;border-radius:0 8px 8px 0}
.md code{background:var(--code-bg);border:1px solid var(--border);padding:1px 6px;border-radius:5px;
  font-family:"SF Mono",Menlo,Consolas,monospace;font-size:.88em}
.md pre{background:var(--code-bg);border:1px solid var(--border);padding:16px;border-radius:10px;overflow-x:auto}
.md pre code{background:none;border:none;padding:0}
.md table{border-collapse:collapse;width:100%;margin:1.1em 0;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:8px 12px;text-align:left;vertical-align:top}
.md th{background:var(--panel2);font-weight:600}
.md tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.md hr{border:none;border-top:1px solid var(--border);margin:2em 0}
.md img{max-width:100%}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.pager a{flex:1;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  color:var(--text)}
.pager a:hover{border-color:var(--accent);text-decoration:none;background:var(--panel2)}
.pager .lab{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.pager .ttl{display:block;margin-top:3px;font-size:14px}
.pager .next{text-align:right}
#menuBtn{display:none}

    color:#0b0d11;border:none;border-radius:8px;padding:10px 13px;font-size:14px;font-weight:600;cursor:pointer}

}

<script>
const PAGES = [{"id": "home", "section": "Início", "title": "Início", "body": "# Wiki do Agent Team\n\n> Material educativo para aprender a operar o Agent Team: um núcleo humano de **Product Manager, UX e Tech Lead** que dirige agentes especializados do backlog à produção, sem perder controle, evidência ou rastreabilidade.\n\nBem-vindo. Esta wiki foi escrita para **ensinar**, não apenas para documentar. Cada seção parte de \"por que isto existe\", mostra \"como funciona\" e termina em \"como você usa no dia a dia\". Se você está chegando agora, leia na ordem. Se já conhece o modelo, use o índice para saltar direto ao que precisa.\n\n## Como esta wiki é organizada\n\nCada macroassunto é uma pasta com duas camadas de leitura. A **pista rápida** (`TLDR.md`) resume a seção inteira em poucos minutos — começo, meio e fim — e aponta para as páginas de detalhe. As **páginas de detalhe** aprofundam um subassunto por vez. Você nunca precisa ler tudo para decidir se algo é relevante: comece pelo TLDR e desça só onde o assunto interessar.\n\n```text\nmacroAssunto/\n├── TLDR.md          # pista rápida: resumo da seção + para onde ir\n└── subAssunto.md    # detalhe de um tema específico\n```\n\n## Trilha de aprendizado\n\nA ordem abaixo leva de \"o que é isto\" até \"como preparo meu repositório e meu workspace para operar com agentes\". É a trilha recomendada para quem está aprendendo o modelo do zero.\n\n| # | Seção | O que você aprende | Comece por |\n|---:|---|---|---|\n| 1 | [Visão geral](1-visao-geral/TLDR.md) | O problema que o Agent Team resolve e como dar o primeiro passo | [TLDR](1-visao-geral/TLDR.md) · [Introdução](1-visao-geral/introducao.md) · [Quick start](1-visao-geral/quick-start.md) |\n| 2 | [Modelo operacional](2-modelo-operacional/TLDR.md) | Quem decide o quê, os gates da jornada e como a autonomia cresce | [TLDR](2-modelo-operacional/TLDR.md) |\n| 3 | [Skills](3-skills/TLDR.md) | Os procedimentos repetíveis que padronizam o trabalho dos agentes | [TLDR](3-skills/TLDR.md) |\n| 4 | [Agentes](4-agentes/TLDR.md) | Os papéis que pesquisam, especificam, implementam, criticam e validam | [TLDR](4-agentes/TLDR.md) |\n| 5 | [Workflows](5-workflows/TLDR.md) | Como os agentes colaboram em cada etapa da jornada | [TLDR](5-workflows/TLDR.md) |\n| 6 | [Workspace](6-workspace/TLDR.md) | Onde o trio e seus agentes efetivamente pilotam o fluxo | [TLDR](6-workspace/TLDR.md) |\n| 7 | [Repositório da aplicação (harness)](7-repo-harness/TLDR.md) | O que um repositório de código precisa para ser operado com segurança | [TLDR](7-repo-harness/TLDR.md) |\n\n## As três ideias que sustentam tudo\n\nSe você guardar apenas três frases desta wiki, guarde estas. Elas reaparecem em cada seção, aplicadas a um contexto diferente.\n\nPrimeiro: **quem propõe uma mudança não é quem a aprova**. A crítica sempre vem de uma instância independente de quem produziu o artefato. Segundo: **aprovação exige evidência explícita, e silêncio nunca equivale a aprovação**. Nenhuma passagem entre fases acontece por conversa — passa por artefatos versionados com owner, gate e evidência. Terceiro: **a autonomia só cresce quando gates e métricas demonstram que é seguro** — nunca por otimismo.\n\n## Antes de escrever ou editar\n\nEsta wiki é material de leitura humana. Ela prioriza prosa e tabelas sobre listas densas, abre cada seção com contexto antes de qualquer bullet, e mantém um tom que favorece o aprendizado. Ao contribuir, atualize primeiro a pista rápida da seção, depois as páginas de detalhe, e preserve os links relativos entre páginas.", "folder": ""}, {"id": "1-visao-geral__TLDR", "section": "Visão geral", "title": "Visão geral — pista rápida", "label": "Resumo (TLDR)", "body": "# Visão geral · TLDR\n\n> A pista rápida da seção. Em poucos minutos você entende o problema que o Agent Team resolve, a proposta central e por onde começar. Os detalhes ficam nas páginas ao final.\n\n## Qual problema estamos resolvendo\n\nQuando agentes de IA passam a produzir código, o gargalo de um time se desloca. Escrever deixa de ser caro. O que fica caro é **decidir o que construir, provar que foi construído certo e impedir que decisões, código e documentação se separem**. Um time pequeno que ignora esse deslocamento gera muito volume e pouca confiança.\n\nO Agent Team existe para resolver exatamente esse segundo problema — não a geração de código, mas a operação em torno dela.\n\n## A proposta em uma frase\n\nA ideia central é uma inversão de papéis: **as pessoas operam o sistema em vez de executar o trabalho**. Um trio humano — Product Manager, UX e Tech Lead — define intenção, prioridade, risco e aprovação. Agentes especializados pesquisam, especificam, implementam, criticam, validam e documentam, sempre dentro de escopo autorizado. Entre uma fase e outra, o contexto não passa por conversa: passa por artefatos versionados com owner, gate e evidência.\n\n| Peça | O que é | Você aprende em |\n|---|---|---|\n| **Trio humano** | PM, UX e Tech Lead, cada um dono de um domínio | [Modelo operacional](../2-modelo-operacional/TLDR.md) |\n| **Skills** | procedimentos repetíveis que padronizam o trabalho | [Skills](../3-skills/TLDR.md) |\n| **Agentes** | os papéis que executam pesquisa, código e crítica | [Agentes](../4-agentes/TLDR.md) |\n| **Workflows** | como os agentes colaboram em cada etapa | [Workflows](../5-workflows/TLDR.md) |\n| **Workspace** | onde o trio e os agentes pilotam o fluxo | [Workspace](../6-workspace/TLDR.md) |\n| **Repo harness** | o que o repositório de código carrega para ser operável | [Repo harness](../7-repo-harness/TLDR.md) |\n\n## As três regras que sustentam tudo\n\nTodo o resto deriva de três regras. **Quem propõe não é quem aprova** — a crítica vem sempre de uma instância independente. **Aprovação exige evidência explícita** — silêncio nunca conta como aprovação. E **autonomia só cresce com prova** — gates e métricas precisam demonstrar que é seguro antes de o sistema rodar mais sozinho.\n\n## Continue por aqui\n\nPara entender a lógica antes de qualquer detalhe, leia a [Introdução](introducao.md). Quando quiser colocar a mão na massa e rodar um primeiro ciclo, siga o [Quick start](quick-start.md).", "folder": "1-visao-geral"}, {"id": "1-visao-geral__introducao", "section": "Visão geral", "title": "Introdução ao Agent Team", "label": "Introdução ao Agent Team", "body": "# Introdução ao Agent Team\n\n> Por que o modelo existe, qual filosofia ele adota e quais conceitos você vai reencontrar em todas as seções seguintes.\n\n## O deslocamento do gargalo\n\nVale começar por uma observação simples sobre o que muda quando um time adota agentes de IA para escrever código. Antes, o gargalo natural era a produção: escrever, testar e revisar código consome tempo, e é aí que a maioria dos times investe processo. Quando os agentes assumem boa parte dessa produção, esse gargalo encolhe — e outro, que sempre esteve lá, fica visível.\n\nEsse outro gargalo tem três faces. A primeira é **decidir o que construir**: com capacidade de produção quase ilimitada, priorizar bem passa a valer mais do que produzir rápido. A segunda é **provar que foi construído certo**: um agente entrega código plausível com facilidade, e distinguir \"plausível\" de \"correto\" exige verificação estruturada. A terceira é **manter decisões, código e documentação sincronizados**: quando muita coisa é gerada rápido, a documentação e as decisões se descolam da realidade em semanas.\n\nO Agent Team é um modelo operacional desenhado para atacar esse segundo gargalo. Ele não tenta fazer os agentes escreverem melhor — assume que escrevem bem o suficiente — e concentra energia em governar a operação ao redor.\n\n## A inversão central: operar, não executar\n\nA decisão de design mais importante do modelo é tratar o desenvolvimento como um sistema **operado** por três pessoas, e não **executado** por elas.\n\nIsso significa que a atenção humana fica reservada para o que só uma pessoa deveria fazer: definir intenção, julgar valor, avaliar risco e assumir responsabilidade. A execução repetitiva — pesquisar, redigir especificação, implementar, testar, criticar, documentar — vai para os agentes. Duas consequências decorrem disso de propósito. As pessoas deixam de gastar tempo com execução mecânica, e a própria execução se torna progressivamente mais autônoma a cada ciclo.\n\nA divisão de trabalho que torna isso possível é clara e sem sobreposição:\n\n| Ator | Dirige |\n|---|---|\n| **Product Manager** | valor, prioridade e resultado de negócio |\n| **UX** | entendimento do usuário, experiência e qualidade de uso |\n| **Tech Lead** | viabilidade, arquitetura, qualidade técnica e risco operacional |\n| **Agentes** | pesquisa, proposta, implementação, crítica, validação e documentação |\n| **Automações** | verificações determinísticas, bloqueios e rastreabilidade |\n\nRepare que os agentes **não decidem** — eles preparam a decisão. Um agente primário conduz e consolida o artefato de cada fase; agentes adversariais atacam a proposta em busca de ambiguidade, risco e suposição frágil; e o owner humano resolve as divergências que sobram.\n\n## O que passa entre as fases: artefatos, não conversas\n\nEm um time tradicional, muito contexto viaja por conversa: alguém explica na reunião, outro anota, um terceiro deduz. Isso não escala quando parte dos participantes são agentes, e mesmo entre humanos gera perda silenciosa de informação.\n\nNo Agent Team, cada passagem entre fases é um **contrato**, não um bate-papo. A fase declara o que recebe (entrada), o que produz (saída), quem responde por ela (owner humano) e qual critério objetivo autoriza avançar (gate). O contexto que atravessa a fronteira vem empacotado em artefatos versionados — um `PRD.md`, uma especificação de UX, um `SPEC.md` — acompanhados de um evidence pack curto que sustenta a decisão sem obrigar ninguém a reler sessões inteiras.\n\nUm vocabulário mínimo aparece o tempo todo, e vale fixá-lo desde já:\n\n| Termo | Significado |\n|---|---|\n| **Gate** | critério objetivo que autoriza um item a avançar de fase |\n| **Evidence pack** | pacote curto que sustenta uma decisão humana |\n| **Handoff** | passagem de contexto entre agentes ou fases, sempre por artefato |\n| **Classe de risco (R0–R4)** | o peso de uma mudança; define quanta verificação ela exige |\n| **Nível de autonomia (A0–A4)** | quanto o sistema roda sem intervenção humana |\n\n## As três regras que você verá em toda parte\n\nTrês princípios resolvem, antecipadamente, as disputas mais comuns de um fluxo com agentes. Cada seção desta wiki é, no fundo, uma aplicação deles.\n\nO primeiro é a **separação entre produzir e aprovar**: quem faz uma mudança nunca é o único responsável por validá-la. O segundo é a **integridade da evidência**: aprovação exige síntese, alternativas, riscos e provas — e ausência de resposta jamais equivale a aprovação. O terceiro é a **autonomia condicionada**: o sistema só ganha permissão para rodar mais sozinho quando métricas e gates demonstram que é seguro, e nenhum indicador isolado autoriza essa subida.\n\n## Para onde ir agora\n\nVocê já tem o mapa mental do modelo. Se quiser experimentá-lo na prática, o [Quick start](quick-start.md) mostra como montar um piloto de três pessoas e rodar um ciclo completo. Se preferir aprofundar a lógica de decisão antes, vá para o [Modelo operacional](../2-modelo-operacional/TLDR.md).", "folder": "1-visao-geral"}, {"id": "1-visao-geral__quick-start", "section": "Visão geral", "title": "Quick start — seu primeiro ciclo", "label": "Quick start — seu primeiro ciclo", "body": "# Quick start — seu primeiro ciclo\n\n> Um roteiro prático para montar um piloto de três pessoas e rodar um ciclo completo, do backlog à observação em produção. Pensado para quem aprende fazendo.\n\n## Antes de começar: o que você precisa\n\nO Agent Team não exige nenhuma ferramenta específica para o primeiro ciclo — exige clareza de papéis e um caso pequeno o suficiente para caber em uma iteração. A recomendação é começar com um repositório real e uma mudança de **baixo risco** (classe R1): uma refatoração localizada ou uma feature pequena, coberta por testes existentes, sem migração de dados nem integração crítica. O objetivo do piloto não é entregar valor grande; é provar o contrato de ponta a ponta.\n\nTrês pessoas assumem os papéis do trio. Não precisam ser dedicadas em tempo integral, mas cada uma precisa saber que é dona do seu domínio: o PM responde por valor e prioridade, o UX pela experiência, o Tech Lead pela viabilidade e pelo risco. Se o assunto de decisão não estiver claro, a página [Trio humano](../2-modelo-operacional/trio-humano.md) resolve.\n\n## Os dez passos do piloto\n\nO roteiro abaixo é sequencial. Cada passo prepara o terreno do próximo, e o valor do piloto está em completar o ciclo inteiro pelo menos uma vez — não em fazer cada passo perfeito.\n\n1. **Escolha o repositório e um caso R1 real.** Pequeno, reversível, com testes já existentes.\n2. **Nomeie PM, UX e Tech Lead** e registre, por escrito, os direitos de decisão de cada um.\n3. **Mapeie o fluxo atual** e os principais gargalos, para ter uma linha de base contra a qual comparar.\n4. **Defina o conjunto mínimo de agentes** e as permissões de cada um — o [catálogo de agentes](../4-agentes/TLDR.md) ajuda a escolher.\n5. **Crie os templates mínimos** de `PB`, `PRD`, especificação de UX, `SPEC` e evidence pack.\n6. **Implemente os gates essenciais** no repositório — comece pelo básico do [repo harness](../7-repo-harness/TLDR.md).\n7. **Instrumente IDs, eventos, custo, duração e resultados dos gates**, para que o ciclo produza dados.\n8. **Execute um ciclo completo de ponta a ponta**, do intake à observação.\n9. **Faça a cerimônia H6** com os dados do ciclo e crie no máximo três melhorias prioritárias.\n10. **Repita por três ciclos** antes de elevar autonomia ou adicionar cerimônias.\n\n## Como o trabalho flui no ciclo\n\nPara acompanhar o que acontece em cada passo, vale ter em mente a espinha dorsal da jornada. Um item entra pelo intake, passa por discovery, ganha um plano de produto e UX, recebe uma especificação técnica, é implementado, validado de forma adversarial, integrado por PR, homologado, liberado com observação e, por fim, vira aprendizado documentado. Cada uma dessas etapas tem um workflow próprio, detalhado em [Workflows](../5-workflows/TLDR.md).\n\n```mermaid\nflowchart LR\n  A[Intake] --> B[Discovery]\n  B --> C[Produto e UX]\n  C --> D[Especificação técnica]\n  D --> E[Implementação]\n  E --> F[Validação adversarial]\n  F --> G[PR e merge]\n  G --> H[Homologação]\n  H --> I[Entrega e observação]\n  I --> J[Conhecimento]\n```\n\n## O erro mais comum no primeiro ciclo\n\nTimes novos costumam querer subir a autonomia cedo demais — deixar os agentes integrarem sozinhos porque \"funcionou nas primeiras vezes\". Resista. A autonomia é uma consequência de evidência acumulada, não uma aposta. No piloto, mantenha aprovação humana em todas as transições (nível A0). Só depois de três ciclos com gates confiáveis e baixa taxa de falha faz sentido conversar sobre elevar. A lógica completa está em [Risco e autonomia](../2-modelo-operacional/risco-e-autonomia.md).\n\n## Depois do piloto\n\nCom um ciclo rodado e medido, você terá evidência real para as decisões seguintes: quais gates automatizar, quais skills faltam, onde os agentes escalam mais para humanos. A partir daí, as seções [Skills](../3-skills/TLDR.md), [Workspace](../6-workspace/TLDR.md) e [Repo harness](../7-repo-harness/TLDR.md) deixam de ser teoria e passam a responder perguntas concretas que o seu piloto levantou.", "folder": "1-visao-geral"}, {"id": "2-modelo-operacional__TLDR", "section": "Modelo operacional", "title": "Modelo operacional — pista rápida", "label": "Resumo (TLDR)", "body": "# Modelo operacional · TLDR\n\n> A pista rápida da seção. Você vai entender quem decide o quê, como a jornada é dividida em gates com owner e como a autonomia do sistema cresce sem virar aposta. Os detalhes ficam nas páginas ao final.\n\n## O que o modelo operacional resolve\n\nDelegar trabalho a agentes é fácil; delegar **sem perder controle** é o problema. O modelo operacional é o conjunto de regras que responde a uma pergunta recorrente — \"quem decide isto, com base em qual evidência?\" — antes que ela trave o fluxo. Ele existe para que nenhuma decisão fique parada esperando consenso e nenhuma seja tomada sem a prova que a sustenta.\n\n## As três engrenagens\n\nO modelo se apoia em três engrenagens que trabalham juntas. A primeira é **quem decide**: cada domínio tem um dono humano inequívoco, e uma tabela de direitos de decisão resolve os casos de fronteira. A segunda é **como o trabalho anda**: a jornada é uma sequência de gates com owner e critério de passagem, marcada por cerimônias de decisão (H1 a H6) onde a pessoa entra para decidir, não para ouvir relato. A terceira é **quanto o sistema pode fazer sozinho**: uma escala de risco (R0 a R4) define quanta verificação cada mudança exige, e uma escala de autonomia (A0 a A4) define quanto o fluxo roda sem intervenção.\n\n| Engrenagem | Pergunta que responde | Você aprende em |\n|---|---|---|\n| **Trio humano** | quem é dono de cada decisão | [Trio humano](trio-humano.md) |\n| **Gates e cerimônias** | como o trabalho avança e onde a pessoa decide | [Gates e cerimônias](gates-e-cerimonias.md) |\n| **Risco e autonomia** | quanto verificar e quanto delegar | [Risco e autonomia](risco-e-autonomia.md) |\n\n## A regra que protege o modelo\n\nAcima de qualquer tabela, vale uma trava de segurança: **nenhuma métrica isolada eleva a autonomia**. Subir o quanto o sistema roda sozinho exige, ao mesmo tempo, histórico suficiente, baixa taxa de falha, gates confiáveis, poucos falsos positivos, rollback testado e telemetria íntegra. É essa exigência combinada que impede o modelo de confundir sorte com maturidade.\n\n## Continue por aqui\n\nComece por [Trio humano](trio-humano.md) para entender os papéis e os direitos de decisão. Depois veja [Gates e cerimônias](gates-e-cerimonias.md) para o ciclo de ponta a ponta, e feche com [Risco e autonomia](risco-e-autonomia.md).", "folder": "2-modelo-operacional"}, {"id": "2-modelo-operacional__trio-humano", "section": "Modelo operacional", "title": "O trio humano e os direitos de decisão", "label": "O trio humano e os direitos de decisão", "body": "# O trio humano e os direitos de decisão\n\n> Como três papéis — PM, UX e Tech Lead — dividem a autoridade sem sobreposição, e como a tabela de direitos de decisão resolve os casos de fronteira.\n\n## Por que exatamente três donos\n\nA escolha de ter três papéis não é arbitrária. Todo produto de software vive de responder bem a três perguntas independentes: **vale a pena construir isto?**, **isto resolve bem o problema de quem usa?** e **isto é viável e seguro de operar?**. Quando uma única pessoa responde às três, ela inevitavelmente favorece a que domina e negligencia as outras. Quando ninguém é claramente dono de uma delas, a pergunta fica sem resposta até virar problema.\n\nO trio dá a cada pergunta um dono inequívoco. E o mais importante: nenhum dos três é um \"tradutor\" passivo dos outros. Eles constroem **juntos** o contrato que os agentes vão executar.\n\n## O que cada papel dirige\n\nCada papel traz decisões próprias para a mesa e responde por uma pergunta central.\n\nO **Product Manager** responde por \"vale a pena construir isto, agora, para este resultado?\". Mantém visão, objetivos e roadmap, ordena o backlog por valor, urgência, risco e aprendizado, e formula o problema antes de comprometer uma solução. Decide avançar, ajustar, adiar ou encerrar um item, e homologa valor com stakeholders.\n\nO **UX** responde por \"isto resolve o problema de quem vai usar, e resolve bem?\". Planeja pesquisa proporcional ao risco, mapeia jornadas e fluxos, e especifica os estados que costumam ser esquecidos — nominal, vazio, loading, erro, permissão e recuperação — justamente o conjunto que vira retrabalho quando ninguém cuida dele. Garante acessibilidade, consistência e usabilidade.\n\nO **Tech Lead** responde por \"isto é viável, sustentável e seguro de operar?\". Avalia alternativas, define arquitetura, contratos e fronteiras, estabelece padrões de qualidade e testes, e classifica risco. Também mantém o repo harness — o conjunto de rules, skills, hooks e gates que torna o repositório compreensível e seguro para agentes.\n\n| Papel | Dirige | Decide sozinho |\n|---|---|---|\n| **Product Manager** | valor, prioridade, requisitos e outcome | prioridade, escopo e aceite de produto |\n| **UX** | evidência sobre o usuário, jornada e qualidade de uso | experiência, acessibilidade e aceite de UX |\n| **Tech Lead** | viabilidade, arquitetura, qualidade técnica e risco | arquitetura, exceção técnica, merge e release |\n\n## O que cada papel deliberadamente não faz\n\nTão importante quanto saber o que um papel decide é saber o que ele **não** decide sozinho — é aí que a separação protege o time. O PM não desenha a experiência nem escolhe a arquitetura, e não substitui evidência de usuário por opinião de stakeholder. O UX não define prioridade de negócio nem aprova escopo sozinho. O Tech Lead não define valor de negócio nem decide a experiência do usuário. Cada limite empurra a decisão para quem tem o contexto certo.\n\n## A tabela de direitos de decisão\n\nEsta é a referência que você consulta quando surge a pergunta \"quem decide isto?\". Ela existe para que nenhuma decisão fique parada aguardando consenso, e para que nenhuma seja tomada sem a evidência que a sustenta. Cada linha nomeia o owner, quem deve ser consultado e a evidência mínima que a decisão exige.\n\n| Decisão | Owner | Consultados | Evidência mínima |\n|---|---|---|---|\n| Prioridade e investimento | PM | UX + Tech Lead | valor, urgência, risco e custo de oportunidade |\n| Problema e outcome | PM | UX + Tech Lead | evidência do problema e métrica de resultado |\n| Jornada e experiência | UX | PM + Tech Lead | pesquisa, fluxo, protótipo e critérios de UX |\n| Escopo da entrega | PM | UX + Tech Lead | outcome, capacidade, dependências e riscos |\n| Arquitetura e implementação | Tech Lead | PM + UX | alternativas, trade-offs, risco e validação |\n| Exceção arquitetural | Tech Lead | owner afetado | ADR, prazo, consequência e plano de reversão |\n| Aceite de produto | PM | UX + stakeholder | critérios de produto e evidências de homologação |\n| Aceite de experiência | UX | PM + Tech Lead | critérios de UX, acessibilidade e validação |\n| Merge e release | Tech Lead por política | PM + UX conforme risco | CI, evidence pack, rollout e rollback |\n| Exposição de risco R3/R4 | PM + Tech Lead | UX quando houver impacto ao usuário | impacto, mitigação, observabilidade e rollback |\n\n## Quando a discussão trava: a regra de desempate\n\nNenhum time escapa de impasses, então o modelo define de antemão como sair deles. A regra é: **o domínio decide**. Valor, prioridade e outcome ficam com o PM; experiência, usabilidade e acessibilidade com o UX; arquitetura, segurança e confiabilidade com o Tech Lead. Conflitos entre domínios exigem registrar alternativas, impacto e decisão conjunta — nunca resolver no boca a boca. E há um limite: risco irreversível, regulatório ou de grande alcance **escala ao sponsor ou responsável formal**; não se resolve dentro do trio.\n\n## Como isso se conecta aos agentes\n\nEntender os papéis humanos é o pré-requisito para entender os agentes. Cada agente tem um **sponsor humano** — um dos três — que responde por seu resultado. O agente prepara e recomenda; o sponsor decide. Quando você chegar em [Agentes](../4-agentes/TLDR.md), verá que a coluna \"sponsor\" de cada contrato é simplesmente a aplicação da tabela acima ao nível de cada missão.\n\nPara ver como essas decisões se distribuem ao longo da jornada, siga para [Gates e cerimônias](gates-e-cerimonias.md).", "folder": "2-modelo-operacional"}, {"id": "2-modelo-operacional__risco-e-autonomia", "section": "Modelo operacional", "title": "Risco e autonomia progressiva", "label": "Risco e autonomia progressiva", "body": "# Risco e autonomia progressiva\n\n> Como o modelo mede o peso de uma mudança (R0 a R4) e como decide quanto o sistema pode rodar sozinho (A0 a A4) — sem transformar autonomia em aposta.\n\n## Duas escalas que trabalham juntas\n\nO modelo separa duas perguntas que costumam ser confundidas. A primeira é \"**quão arriscada é esta mudança?**\", respondida pela classe de risco (R0 a R4). A segunda é \"**quanto o sistema pode fazer sem intervenção humana?**\", respondida pelo nível de autonomia (A0 a A4). Uma é sobre a mudança; a outra é sobre o sistema que a processa. Separá-las é o que permite dar autonomia alta para mudanças triviais e manter controle rígido sobre as perigosas — ao mesmo tempo, no mesmo time.\n\n## Classes de risco: quanto verificar\n\nA classe de risco define quanta verificação uma mudança exige antes de avançar. Quanto maior o risco, mais provas e mais aprovação humana. A classificação não é opinião: paths sensíveis elevam o risco automaticamente, e a dúvida não resolvida impede as classes mais baixas.\n\n| Classe | Caracteriza | Exige |\n|---|---|---|\n| **R0 — mínimo** | documentação, texto e formatação; sem mudança de comportamento ou dados | merge automático após gates; review por amostragem |\n| **R1 — baixo** | refatoração interna coberta por testes, sem migração nem integração crítica | aprovação curta; deploy automático com observação |\n| **R2 — médio** | novo comportamento ou mudança de contrato interno; impacto reversível mas relevante | aprovação de produto ou Code Owner; canary e rollback |\n| **R3 — alto** | dados persistidos, migrações, contratos públicos, autenticação, pagamentos | aprovação humana de produto e técnica antes de produção |\n| **R4 — crítico** | impacto regulatório, financeiro, destrutivo ou de grande alcance | dupla aprovação, segregação de função e acompanhamento humano |\n\nA regra de classificação tem uma proteção embutida contra otimismo: **um agente propõe o risco e outro tenta elevá-lo**, e o maior risco justificado prevalece. Reduzir a classe manualmente exige justificativa registrada, e qualquer mudança de escopo recalcula o risco do zero.\n\n## Níveis de autonomia: quanto delegar\n\nO nível de autonomia descreve quanto do fluxo acontece sem intervenção humana. Ele sobe devagar, e cada degrau troca uma aprovação manual por uma garantia estrutural.\n\n| Nível | Significa |\n|---|---|\n| **A0 — assistido** | pessoas aprovam todas as transições |\n| **A1 — execução autônoma** | agentes executam; pessoas aprovam decisões e merge |\n| **A2 — merge por risco** | R0/R1 podem integrar por política |\n| **A3 — entrega autônoma controlada** | baixo risco chega à produção com rollback comprovado |\n| **A4 — orientado a exceções** | o fluxo saudável ocorre sem intervenção; pessoas tratam decisões e anomalias |\n\n## A trava que impede a aposta\n\nEste é o coração da página, e a regra que mais protege o modelo a longo prazo. **Elevar a autonomia exige seis condições ao mesmo tempo**: histórico suficiente, baixa taxa de falha, gates confiáveis, poucos falsos positivos, rollback testado e telemetria íntegra. Nenhuma delas, sozinha, autoriza a subida.\n\nO motivo é que qualquer indicador isolado pode enganar. \"Funcionou nas últimas dez vezes\" pode ser sorte com amostra pequena. \"A taxa de falha é baixa\" pode significar que os gates não estão pegando os problemas. Só a combinação das seis condições transforma confiança em evidência. Por isso a revisão mensal do sistema tem uma regra própria: **nunca usar uma métrica isolada para elevar autonomia**.\n\n## O elo com o repositório: a maturidade é o teto\n\nHá um último princípio que conecta esta página ao [repo harness](../7-repo-harness/TLDR.md): a maturidade do harness é o **teto** da autonomia, nunca a consequência dela. Um repositório sem contexto, verificação, permissão e evidência adequados não pode operar com autonomia alta, por mais que o histórico pareça bom — porque falta a estrutura que tornaria esse histórico confiável. Se você encontrar um repositório operando acima do que seu harness sustenta, não é um repositório adiantado: é um gate faltando que ninguém percebeu ainda.\n\n## Continue por aqui\n\nCom risco e autonomia claros, o próximo passo é entender os **procedimentos** que padronizam o trabalho dos agentes em cada nível de risco — as [Skills](../3-skills/TLDR.md).", "folder": "2-modelo-operacional"}, {"id": "2-modelo-operacional__gates-e-cerimonias", "section": "Modelo operacional", "title": "Gates e cerimônias — como o trabalho anda", "label": "Gates e cerimônias — como o trabalho anda", "body": "# Gates e cerimônias — como o trabalho anda\n\n> A jornada de ponta a ponta como uma sequência de gates com owner, e as cerimônias humanas (H1 a H6) como pontos de decisão — não de relato.\n\n## A ideia de gate: avançar exige prova\n\nO conceito mais importante desta página cabe em uma frase: **um item só avança quando o gate anterior produziu evidência**. Um gate é um critério objetivo de passagem entre fases. Ele não pergunta \"todos concordam?\"; pergunta \"a evidência que autoriza avançar existe?\". Essa diferença é o que impede o fluxo de avançar por otimismo ou por cansaço.\n\nCada fase da jornada declara quatro coisas: o que recebe (entrada), o que produz (saída), quem responde por ela (owner humano) e qual o critério de passagem (gate). Se você entender esse formato, entende a jornada inteira.\n\n## As dez etapas da jornada\n\nA jornada tem dez etapas, cada uma com workflow próprio, owner humano, time de agentes e gate. A tabela abaixo é o mapa completo — você vai reencontrar cada linha, detalhada, na seção [Workflows](../5-workflows/TLDR.md).\n\n| # | Etapa | Owner humano | Gate |\n|---:|---|---|---|\n| 0 | Intake e triagem | PM | problema, prioridade e responsável claros |\n| 1 | Discovery | PM (UX e TL por domínio) | problema validado e viabilidade avaliada |\n| 2 | Produto e experiência | PM / UX | gaps tratados e critérios aprovados |\n| 3 | Especificação técnica | Tech Lead | trade-offs registrados e tarefas executáveis |\n| 4 | Implementação | Tech Lead por exceção | verificações locais aprovadas |\n| 5 | Validação adversarial | Tech Lead (PM/UX por critério) | checklist completo, sem bloqueadores |\n| 6 | PR e merge | Tech Lead ou Code Owner | CI verde e aprovações válidas |\n| 7 | Homologação | PM / UX | critérios validados ou plano de correção |\n| 8 | Entrega e observação | Tech Lead (PM em R3/R4) | janela pós-deploy sem regressão |\n| 9 | Curadoria de conhecimento | owner do domínio alterado | documentação atual e sem contradições |\n\nUma décima primeira etapa — telemetria e melhoria contínua — fecha o ciclo sobre o próprio sistema de trabalho, convertendo dados de operação em aprendizado e demanda priorizada.\n\n```mermaid\nflowchart LR\n  I[0 Intake] --> D[1 Discovery] --> P[2 Produto e UX] --> S[3 Especificação]\n  S --> IM[4 Implementação] --> V[5 Validação] --> PR[6 PR e merge]\n  PR --> H[7 Homologação] --> E[8 Entrega] --> K[9 Conhecimento] --> M[10 Melhoria]\n  M -.retroalimenta.-> I\n```\n\n## Dois portões que emolduram o ciclo\n\nAlém dos gates de fase, dois portões maiores protegem o começo e o fim da execução. O **Definition of Ready** decide se um item pode entrar em execução por agentes: problema e usuário explícitos, outcome e métrica definidos, owner humano conhecido, escopo claro, contratos e critérios de aceite verificáveis, classe de risco definida e dúvidas críticas resolvidas ou assumidas. O **Definition of Done** decide se o ciclo pode fechar: critérios cobertos, gates aprovados, riscos conhecidos, documentação atualizada, rastreabilidade entre backlog, commits, PR e release, e rollout observado sem regressão relevante.\n\n## Cerimônias são pontos de decisão, não de relato\n\nAqui está a inversão que mais diferencia o Agent Team de um processo tradicional: as cerimônias existem para **decidir**, não para narrar status. Preparação, análise, atualização de status e geração de artefatos ficam com os agentes e automações. A pessoa entra para tomar a decisão que só ela pode tomar. Uma cerimônia que virou relato individual de progresso perdeu a razão de existir.\n\nO ritmo contínuo tem duas cerimônias leves. O **pulso assíncrono diário** (até 10 minutos de leitura, para o trio) cobre apenas bloqueios, novas informações e pedidos de decisão — nunca vira reunião diária de relato. A **triagem semanal** (30 a 45 minutos, owner PM) decide o que entra, o que sai e o que precisa de discovery.\n\n## Os marcos de decisão H1 a H6\n\nAo longo do ciclo, seis marcos concentram as decisões humanas de maior peso. Cada um tem um owner, uma cadência e um gate próprio.\n\n| Marco | Cerimônia | Owner | Gate |\n|---|---|---|---|\n| **H1** | Kickoff de discovery | PM | missão, timebox e agentes definidos |\n| **H2** | Refinamento de produto e experiência | PM (UX co-owner) | gaps críticos tratados e sucesso mensurável |\n| **H3** | Revisão de solução e risco | Tech Lead | rastreabilidade e validação viável |\n| **H4** | Review de entrega | PM/UX/Tech Lead por critério | revisão aprovada, CI verde, sem bloqueadores |\n| **H5** | Decisão de release | Tech Lead (PM coaprova R3/R4) | ambiente, migração, observabilidade e rollback verificados |\n| **H6** | Telemetria e melhoria | trio, facilitação rotativa | evidência rastreável e hipótese separada de aprendizado |\n\nVale entender o papel de cada um em uma frase. **H1** abre uma oportunidade com missão e timebox. **H2** responde \"é isto que vamos construir, para quem e com qual resultado?\". **H3** é obrigatório quando há ADR, exceção ou risco elevado. **H4** pergunta \"entrega o outcome, funciona bem e pode ser integrada?\". **H5** decide liberar, pausar, reduzir exposição ou voltar à implementação. **H6** pergunta \"o sistema aprendeu corretamente e qual melhoria merece investimento?\".\n\n## O evidence pack: o que a pessoa recebe para decidir\n\nToda decisão humana chega embrulhada em um pacote curto, desenhado para permitir decidir **sem reler todas as sessões** — mas preservando os links para auditoria. Esse é o mecanismo que torna as cerimônias rápidas sem torná-las superficiais.\n\n| Item | Conteúdo |\n|---|---|\n| Pergunta de decisão | uma frase |\n| Recomendação | a posição dos agentes |\n| Alternativas | opções consideradas e descartadas |\n| Riscos e trade-offs | o que se ganha e o que se aceita |\n| Delta | mudanças desde a última aprovação |\n| Evidências | resultado dos gates executados |\n| Pendências | exceções e nível de confiança |\n| Links | artefatos completos, código e execução |\n\n## Continue por aqui\n\nVocê viu como o trabalho avança e onde as pessoas decidem. O que ainda falta é entender **quanto** o sistema pode fazer sozinho em cada tipo de mudança — o assunto de [Risco e autonomia](risco-e-autonomia.md).", "folder": "2-modelo-operacional"}, {"id": "3-skills__TLDR", "section": "Skills", "title": "Skills — pista rápida", "label": "Resumo (TLDR)", "body": "# Skills · TLDR\n\n> A pista rápida da seção. Você vai entender o que é uma skill, por que ela é obrigatória, os três tipos que existem e como uma skill é escrita por dentro. Os detalhes ficam nas páginas ao final.\n\n## O problema que a skill resolve\n\nUm agente sem skill improvisa. Ele inventa o nome do artefato, escolhe sozinho onde gravar e decide na hora o que conta como evidência. O resultado é um repositório em que cada execução seguiu uma convenção diferente — e ninguém consegue mais confiar em nada sem reler tudo. Esse é o problema que a skill resolve.\n\nUma **skill** é o oposto da improvisação: um procedimento nomeado, com entrada, saída e critério de conclusão, que produz o mesmo formato de artefato toda vez que roda. Ela transforma \"faça um review\" em \"faça este review, com estes passos, produzindo este artefato, que termina quando estes critérios forem satisfeitos\".\n\n## A regra e os três tipos\n\nA regra de operação é curta e sem exceção: **verificar as skills disponíveis antes de agir e usar todas as que se aplicam**. Uma skill aderente à missão não pode ser ignorada, e o agente sempre cita quais usou — ou por que nenhuma se aplicava.\n\nAs skills se dividem em três naturezas, e saber distingui-las é metade do aprendizado.\n\n| Natureza | O que fazem | Quando se aplicam | Você aprende em |\n|---|---|---|---|\n| **De base** | governam a operação do workspace | toda missão, sempre | [Skills de base](skills-de-base.md) |\n| **De domínio** | produzem o artefato de uma etapa | na etapa correspondente | [Skills por etapa](skills-por-etapa.md) |\n| **De publicação** | tocam Git e GitHub | só com autorização explícita | [Skills por etapa](skills-por-etapa.md) |\n\n## Skills não ampliam permissão\n\nUm mal-entendido comum vale corrigir desde já: **uma skill não concede poder**. Uma skill de implementação não autoriza publicar; nenhuma delas decide sozinha o que vira baseline aprovado. Executar com liberdade dentro do escopo, mas publicar apenas sob autorização — essa assimetria é o que sustenta os níveis de autonomia do modelo.\n\n## Continue por aqui\n\nComece por [Skills de base](skills-de-base.md), que valem para qualquer missão. Depois veja [Skills por etapa](skills-por-etapa.md) para saber qual procedimento roda em cada fase, e feche com [Anatomia de uma skill](anatomia-de-uma-skill.md) se for criar ou revisar uma.", "folder": "3-skills"}, {"id": "3-skills__anatomia-de-uma-skill", "section": "Skills", "title": "Anatomia de uma skill", "label": "Anatomia de uma skill", "body": "# Anatomia de uma skill\n\n> Como uma skill é estruturada em disco, o que a descrição precisa comunicar para ser acionada e por que uma skill se lê diferente de documentação para humanos.\n\n## Uma skill é um diretório\n\nNo nível mais concreto, uma skill é um diretório com um arquivo `SKILL.md` na raiz. Esse arquivo carrega o procedimento; os demais existem para dar suporte a ele quando necessário.\n\n```text\nskills/<nome>/\n├── SKILL.md        # o procedimento: entrada, passos, saída e critério de conclusão\n├── README.md       # contexto adicional, quando o procedimento não se explica sozinho\n├── templates/      # formatos de artefato que a skill produz\n└── agents/         # configuração de agente específica, quando houver\n```\n\nO `SKILL.md` começa com um front matter que declara `name` e `description`. Desses dois, a **descrição é o campo mais importante** — e a razão surpreende quem está começando.\n\n## A descrição é o que aciona a skill\n\nA descrição não é um resumo cosmético. Ela é o texto que um agente lê para decidir se a skill se aplica à missão em curso. Uma descrição que só diz **o que** a skill faz, sem dizer **em que situação usá-la**, produz uma skill que existe mas nunca é acionada no momento certo.\n\nPor isso a descrição precisa responder duas coisas ao mesmo tempo: o que a skill faz e quando ela deve ser usada. \"Revisa um PRD\" é fraco. \"Revisa um PRD verificando rastreabilidade de objetivos, regras e critérios; use antes de aprovar qualquer PRD ou quando gaps de requisito são suspeitos\" é o que faz a skill ser encontrada quando importa.\n\n## O critério de parada separa skill de tutorial\n\nToda skill declara objetivo, inputs, outputs, tools permitidas, critérios de parada, exemplos e testes. De todos esses campos, o **critério de parada** é o que mais distingue uma skill de um tutorial genérico.\n\nO motivo é comportamental: um agente que não sabe se terminou continua. Sem um critério explícito de conclusão — \"a skill termina quando cada critério de aceite tem evidência vinculada\" —, o agente ou para cedo demais, deixando trabalho pela metade, ou tarde demais, gerando ruído. O critério de parada é o que torna a conclusão verificável em vez de subjetiva.\n\n## Convenções de artefato: a regra local prevalece\n\nSkills que compartilham convenções de onde gravam artefatos apontam para um contrato de artefatos comum, que define onde PRD, SPEC, planos e requisitos vivem. Esse contrato carrega uma regra central que vale memorizar: **a convenção local do repositório prevalece**. Quando o repositório consumidor organiza os artefatos de um jeito diferente do padrão, a skill se adapta ao layout local e confirma o mapeamento antes de escrever — nunca impõe sua própria estrutura por cima.\n\n## Por que uma skill se lê diferente desta wiki\n\nSe você abrir um `SKILL.md`, vai notar que ele parece o oposto do que esta wiki prega: listas densas, imperativas, sem a prosa que suaviza a leitura humana. Isso é intencional, e a razão é o leitor. Esta wiki é lida por **pessoas** que estão aprendendo; um `SKILL.md` é lido por um **agente durante a execução**, que se beneficia de instruções compactas e diretas.\n\nEm outras palavras: o padrão de documentação que favorece prosa e tabelas se aplica aos documentos de leitura humana. Instruções executadas por agentes — os `SKILL.md` e os pacotes de agente — seguem regras próprias de concisão, e listas densas ali são uma escolha correta, não um descuido.\n\n## Continue por aqui\n\nVocê entende agora o que é uma skill, quando ela é acionada e como é escrita. O passo natural é conhecer **quem** executa essas skills — os [Agentes](../4-agentes/TLDR.md).", "folder": "3-skills"}, {"id": "3-skills__skills-de-base", "section": "Skills", "title": "Skills de base — o alicerce de toda missão", "label": "Skills de base — o alicerce de toda missão", "body": "# Skills de base — o alicerce de toda missão\n\n> As três skills que valem para qualquer missão, em qualquer papel, e por que são obrigatórias antes de qualquer skill de domínio.\n\n## Por que existem skills que valem sempre\n\nVale começar por uma observação contraintuitiva: o erro mais caro de um agente **não** é escrever código ruim. É escrever o artefato certo no lugar errado, ou tratar memória operacional como se fosse fonte de verdade. Um review excelente gravado na pasta errada some; uma conclusão registrada como memória temporária, em vez de artefato canônico, é perdida no próximo ciclo.\n\nAs três skills de base existem para eliminar essa classe de erro. Elas não produzem o entregável da fase — produzem as **condições** para que o entregável seja gravado no lugar certo, no item certo, sem sobrescrever o trabalho de outra sessão. Por isso são obrigatórias em qualquer missão, antes de qualquer skill de domínio.\n\n## As três skills e o que cada uma garante\n\n| Skill | Garante | Falha que ela previne |\n|---|---|---|\n| **`workspace-memory`** | retomada de contexto e escrita segura de memória | tratar `memory.md` como fonte canônica |\n| **`workspace-projects`** | fonte canônica correta e assets isolados por sessão | conclusão gravada no domínio errado; sessões se sobrescrevendo |\n| **`workspace-board`** | seleção, transição e reconciliação de Work Items | trabalho sem item, ou item movido para `done` sem evidência |\n\nCada uma cobre uma pergunta que o agente precisa responder antes de agir. `workspace-memory` responde \"o que eu já sabia sobre isto?\" e, principalmente, \"onde é seguro anotar o que aprendi?\". `workspace-projects` responde \"onde este artefato pertence de verdade?\" — e mantém o material bruto de cada sessão isolado, para que reexecutar um workflow nunca sobrescreva a tentativa anterior. `workspace-board` responde \"qual Work Item estou executando e como movo ele com segurança?\".\n\n## A ordem prática ao iniciar uma missão\n\nExiste uma sequência recomendada, e segui-la evita quase todos os tropeços de início de missão. Primeiro `workspace-memory`, para recuperar o contexto do que já foi feito. Depois `workspace-board`, para assumir formalmente o item de trabalho. Em seguida `workspace-projects`, para localizar onde o artefato pertence. E **só então** a skill de domínio que produz o entregável da fase.\n\n```mermaid\nflowchart LR\n  M[workspace-memory] --> B[workspace-board] --> P[workspace-projects] --> D[skill de domínio]\n```\n\n## Onde as skills de base se conectam ao workspace\n\nEssas três skills são, na prática, o **harness do workspace** em ação — o conjunto de convenções que torna o espaço de trabalho do trio operável por agentes sem que cada execução reinvente a organização. Elas fazem mais sentido depois de você conhecer a estrutura do workspace, então, se algo aqui parecer abstrato, a página [Harness do workspace](../6-workspace/harness-do-workspace.md) fecha o círculo.\n\n## Continue por aqui\n\nCom o alicerce claro, veja [Skills por etapa](skills-por-etapa.md) para conhecer os procedimentos que produzem o artefato de cada fase da jornada.", "folder": "3-skills"}, {"id": "3-skills__skills-por-etapa", "section": "Skills", "title": "Skills por etapa da jornada", "label": "Skills por etapa da jornada", "body": "# Skills por etapa da jornada\n\n> Qual procedimento produz o artefato de cada fase, como bugs entram fora da sequência e por que as skills de publicação são tratadas à parte.\n\n## A tradução direta da jornada para procedimentos\n\nCada etapa da jornada tem a skill que produz o seu artefato. Se você já conhece a jornada de [Gates e cerimônias](../2-modelo-operacional/gates-e-cerimonias.md), esta página é a tradução dela para procedimentos executáveis: onde antes você via \"etapa de especificação\", agora vê a skill concreta que gera o `SPEC.md`.\n\n| Etapa | Skill | Entrega |\n|---|---|---|\n| 01 · Discovery | `business-discovery` | requisitos de negócio acumulativos, com baseline, changelog e lacunas |\n| 02 · Produto e UX | `write-feature` | histórias fatiadas, vinculadas a regras e critérios |\n| 02 · Produto e UX | `review-prd` | PRD com objetivos, regras e critérios de sucesso rastreáveis |\n| 03 · Especificação | `technical-discovery` | visão técnica: componentes, dependências, riscos e decisões abertas |\n| 03 · Especificação | `create-spec` | SPEC com contratos, riscos e critérios técnicos verificáveis |\n| 03 · Especificação | `refine-spec` | plano sequencial de blocos testáveis e suas dependências |\n| 03 · Especificação | `review-spec` | lacunas, ambiguidades e riscos da SPEC antes da aprovação |\n| 03 · Especificação | `review-cross-prd-spec` | cobertura, conflitos e decisões pendentes entre PRD e SPEC |\n| 04 · Implementação | `implement` | um bloco do plano implementado, com validação incremental |\n| 04 · Implementação | `dev-flow` | condução de ponta a ponta quando a entrega não exige fase a fase |\n| 04 · Implementação | `test-integration-local` | cobertura faltante criada e critérios mapeados a testes |\n| 05 · Validação | `code-review` | achados acionáveis contra SPEC, testes e riscos |\n| 06 · PR e merge | `commit` · `update-pr` · `check-pr` | mudança registrada, descrita e verificada |\n| 09 · Conhecimento | `update-docs` | documentação alinhada ao entregue, com desvios registrados |\n\n## Correção de defeito: um par que roda fora da sequência\n\nBugs não seguem a jornada linear — eles aparecem quando aparecem. Por isso têm um par de skills próprio, e a separação entre elas é deliberada. `analyse-bug` rastreia a causa raiz e documenta o impacto **sem tocar em código**. Só depois `fix-bug` implementa a correção, com teste de regressão.\n\nEssa ordem parece burocrática até você entender o motivo: corrigir antes de entender o impacto é como nasce a maior parte das regressões. A disciplina de analisar primeiro protege contra a \"correção\" que conserta o sintoma e quebra outra coisa.\n\n## Skills de publicação: liberdade para executar, autorização para publicar\n\nUm subconjunto de skills toca Git e GitHub — `commit`, `update-pr`, `check-pr` — e por isso recebe tratamento especial: elas só executam **mediante pedido explícito**. Um agente pode implementar, testar e preparar tudo com liberdade dentro do escopo do Work Item, mas criar commit, abrir PR ou fazer merge são ações separadas, cada uma exigindo autorização.\n\nA tabela abaixo torna essa fronteira precisa — é a mesma assimetria que sustenta os níveis de autonomia do modelo.\n\n| Ação | Exige pedido explícito |\n|---|---|\n| Criar branch, worktree e alterar código local | não, dentro do escopo autorizado do Work Item |\n| Criar issue, commit, push, PR, merge e limpeza de worktree | sim, cada uma separadamente |\n| Alterar requisitos ou status de PRD/SPEC aprovados | sim, com decisão registrada |\n| Mover um Work Item para `done` | não, mas só com evidência para todos os critérios |\n\n## Por que \"usar todas que se aplicam\" importa\n\nUm agente que ignora uma skill aplicável reintroduz exatamente o problema que as skills existem para resolver: variação entre execuções. Por isso a regra não admite exceção conveniente. Se duas skills se aplicam à mesma missão, ambas rodam. E quando o agente conclui a missão, ele declara no resultado e no handoff quais skills usou — tornando auditável se o procedimento correto foi seguido.\n\n## Continue por aqui\n\nVocê já sabe qual skill roda em cada momento. Para entender como uma skill é construída por dentro — e criar as suas —, vá para [Anatomia de uma skill](anatomia-de-uma-skill.md).", "folder": "3-skills"}, {"id": "4-agentes__TLDR", "section": "Agentes", "title": "Agentes — pista rápida", "label": "Resumo (TLDR)", "body": "# Agentes · TLDR\n\n> A pista rápida da seção. Você vai entender o que é um agente no Agent Team, o contrato comum que todos seguem, como se agrupam por função e quem trabalha junto em cada fase. Os detalhes ficam nas páginas ao final.\n\n## Nome em diagrama não é papel\n\nUm nome de agente em um diagrama de workflow não significa nada até que ele saiba qual resultado deve produzir, de quem recebe ordem e quando deve parar. \"Security Review Agent\" é só um rótulo até você definir o que ele lê, o que entrega, qual gate precisa satisfazer e em que condição escala para um humano.\n\nO catálogo de agentes existe para transformar rótulos em **papéis operacionais inequívocos** — de modo que uma missão possa ser despachada sem negociação prévia sobre responsabilidade, escopo ou critério de conclusão.\n\n## Um contrato comum e seis grupos\n\nTodo agente responde às mesmas oito perguntas — qual resultado produz, quem é seu sponsor humano, quais fontes são canônicas, o que aceita de entrada, o que entrega, quais tools pode usar, quais gates satisfaz e quando escala. Esse é o [contrato comum](contrato-comum.md).\n\nOs 23 papéis se organizam em seis grupos, por função na jornada.\n\n| Grupo | Exemplos | Sponsor típico |\n|---|---|---|\n| Entrada e coordenação | Intake, Meeting Context, Orchestrator | PM / owner da fase |\n| Produto, UX e discovery | Product Manager, UX Specification, Adversarial PM | PM e UX |\n| Especificação técnica | Specification TL, Adversarial TL, Security/Data/Platform | Tech Lead |\n| Construção e validação | Software Engineer, QA, Security Review, Code Reviewer | Tech Lead |\n| Integração e operação | PR, Product Validation, Release, Observability | Tech Lead, PM e UX |\n| Conhecimento e melhoria | Knowledge, Telemetry, Auto Dream, Critic | owner do domínio e trio |\n\nO [catálogo por grupo](catalogo-por-grupo.md) detalha cada papel, e a [composição por fase](composicao-por-fase.md) mostra quem trabalha junto.\n\n## Papéis lógicos, com uma restrição inegociável\n\nO catálogo descreve **papéis lógicos**, não instâncias. Uma execução pode usar uma instância por papel, várias instâncias paralelas do mesmo papel, ou uma instância assumindo mais de um papel compatível. A restrição que nunca se quebra: **papéis de produção e de aprovação não se combinam na mesma instância** quando houver risco de autoavaliação. Quem produz não aprova.\n\n## Continue por aqui\n\nComece por [Contrato comum](contrato-comum.md), a base que vale para todos. Depois explore o [Catálogo por grupo](catalogo-por-grupo.md) e feche com a [Composição por fase](composicao-por-fase.md).", "folder": "4-agentes"}, {"id": "4-agentes__contrato-comum", "section": "Agentes", "title": "O contrato comum de todo agente", "label": "O contrato comum de todo agente", "body": "# O contrato comum de todo agente\n\n> A identidade mínima de uma missão, as regras universais que todo agente respeita, o envelope padrão de saída e as condições em que qualquer agente para e escala.\n\n## Por que existe um contrato comum\n\nAntes de detalhar qualquer papel específico, o modelo define o que **todos** os agentes têm em comum. A razão é econômica e de segurança: se cada agente inventasse seu próprio formato de missão, de saída e de escalonamento, o sistema seria impossível de auditar e de orquestrar. O contrato comum é o denominador que permite despachar qualquer missão, para qualquer papel, com a mesma estrutura.\n\n## A identidade de uma missão\n\nToda execução recebe um bloco de identidade. A ausência de qualquer um desses campos é, na prática, uma autorização em branco — e por isso uma missão incompleta **não deve ser executada**.\n\n| Bloco | Campos |\n|---|---|\n| Identificação | `mission_id`, `work_item_id` (quando houver), fase do workflow, papel do agente |\n| Autoridade | sponsor humano (PM, UX ou Tech Lead), owner da decisão |\n| Direção | objetivo e resultado esperado, escopo e fora de escopo |\n| Fontes | fontes canônicas, artefatos de entrada e de saída |\n| Verificação | critérios de aceite e gates |\n| Limites | risco e autonomia autorizada, tools, permissões e budget |\n| Parada | condição de parada e escalonamento |\n\nRepare que esse bloco é a aplicação, no nível da missão, dos conceitos que você já viu: o sponsor vem da [tabela de direitos de decisão](../2-modelo-operacional/trio-humano.md), o risco vem das [classes R0–R4](../2-modelo-operacional/risco-e-autonomia.md), e os gates vêm da [jornada](../2-modelo-operacional/gates-e-cerimonias.md).\n\n## As regras universais\n\nQuatro conjuntos de regras valem para qualquer agente, sempre. Elas resolvem antecipadamente os comportamentos que mais comprometem confiança.\n\nSobre a **verdade**: separar fato, evidência, inferência, hipótese e recomendação; não inventar requisitos, decisões ou resultados; citar a origem de afirmações relevantes; e, quando uma fonte estiver ausente, produzir output parcial identificado como tal em vez de preencher a lacuna com suposição.\n\nSobre o **limite**: não ampliar escopo, acesso ou impacto por conta própria; não executar ação externa ou irreversível sem autorização; atualizar somente a fonte canônica autorizada; e nunca aprovar sozinho o artefato que produziu.\n\nSobre as **skills**: verificar as disponíveis antes de agir e usar cada uma que se aplique — as três skills de base são obrigatórias, como detalhado em [Skills de base](../3-skills/skills-de-base.md).\n\nSobre a **entrega**: entregar sempre um evidence pack e um resumo das mudanças, não apenas o artefato cru.\n\n## O envelope padrão de saída\n\nToda missão termina com um envelope padronizado. Ele é o que permite ao orquestrador e ao owner humano entender o resultado sem reler a execução inteira.\n\n```yaml\nmission_id: \"...\"\nagent_role: \"...\"\nstatus: completed | partial | blocked\nconfidence: high | medium | low\nsources_used: []\nskills_used: []\noutputs_created: []\ndecisions_requested: []\nassumptions: []\nrisks: []\nopen_questions: []\ngates:\n  passed: []\n  failed: []\n  not_run: []\nhandoff_to: []\n```\n\nDois campos merecem atenção especial. `confidence` obriga o agente a declarar quão seguro está — e confiança baixa é, por si só, uma condição de escalonamento. `skills_used` torna auditável se o procedimento correto foi seguido.\n\n## Quando qualquer agente para e escala\n\nO contrato define, de forma universal, quando um agente deve **parar e devolver a decisão** a um humano. Essas condições não são falhas — são o sistema funcionando como deveria. Um agente escala diante de requisito contraditório ou sem owner, fonte canônica ausente ou inconsistente, confiança abaixo do limite da missão, duas tentativas de correção sem progresso, mudança fora do escopo aprovado, necessidade de nova permissão, risco maior que o autorizado, decisão irreversível ou impacto não calculável, ou divergência entre agentes sem regra objetiva de desempate.\n\nA lógica por trás de todas elas é a mesma: quando o custo de errar sozinho supera o custo de perguntar, o agente pergunta.\n\n## Continue por aqui\n\nCom o contrato comum claro, cada papel específico vira \"o contrato comum, mais estas particularidades\". Veja o [Catálogo por grupo](catalogo-por-grupo.md).", "folder": "4-agentes"}, {"id": "4-agentes__catalogo-por-grupo", "section": "Agentes", "title": "Catálogo de agentes por grupo", "label": "Catálogo de agentes por grupo", "body": "# Catálogo de agentes por grupo\n\n> Os 23 papéis organizados por função na jornada, com a saída central de cada um e o que ele deliberadamente não faz.\n\n## Como ler este catálogo\n\nCada agente aqui é o [contrato comum](contrato-comum.md) mais um conjunto de particularidades: uma missão, um sponsor, uma saída central e um limite explícito. Neste guia educativo, apresentamos os papéis agrupados por função, com foco no que você precisa para escolher e acionar cada um. O que um agente **não** faz é tão vinculante quanto o que ele faz — por isso essa coluna aparece em cada grupo.\n\n## Entrada e coordenação\n\nEstes três agentes ficam nas bordas do fluxo: recebem o que chega de fora e organizam o trabalho dos demais. Nenhum deles decide ou aprova nada — eles preparam e roteiam.\n\n| Agente | Sponsor | Saída central | Não faz |\n|---|---|---|---|\n| **Intake Agent** | PM | Work Item triado e priorizável | priorizar definitivamente ou prometer solução |\n| **Meeting Context Agent** | owner da reunião | resumo e context pack de uma transcrição | atribuir compromisso não falado; publicar sozinho |\n| **Orchestrator Agent** | owner da fase | missões roteadas e estado consolidado | aprovar produto, UX, arquitetura, merge ou release |\n\nO Meeting Context Agent carrega a regra mais estrita do catálogo, e vale entender por quê: ele é o único que lida com material bruto de origem humana. Por isso, nada que não foi dito pode aparecer no output — a disciplina protege contra a \"decisão\" que ninguém tomou virar fato registrado.\n\n## Produto, UX e discovery\n\nEste grupo estrutura o problema antes de qualquer solução. Repare no par produção/crítica: o Product Manager Agent propõe, e o Adversarial PM tenta invalidar — sempre como instância independente.\n\n| Agente | Sponsor | Saída central | Não faz |\n|---|---|---|---|\n| **Product Manager Agent** | PM | `PB.md` ou `PRD.md` | aprovar o próprio PRD ou escolher arquitetura |\n| **UX Specification Agent** | UX | jornada, fluxo e UX spec | definir prioridade ou substituir teste com usuários por heurística |\n| **Tech Lead Discovery Agent** | Tech Lead | viabilidade e riscos iniciais | produzir a arquitetura final durante o discovery |\n| **Adversarial Product Manager Agent** | PM | crítica de produto classificada | reescrever silenciosamente o PRD ou aprová-lo |\n\nUma disciplina se destaca aqui: o Tech Lead Discovery Agent **para antes de arquitetar**. Discovery é para avaliar viabilidade e risco, não para desenhar a solução — antecipar isso compromete a fase seguinte.\n\n## Especificação técnica\n\nAqui o produto aprovado vira estratégia técnica executável. O mesmo padrão de produção e crítica independente se repete.\n\n| Agente | Sponsor | Saída central | Não faz |\n|---|---|---|---|\n| **Specification Tech Lead Agent** | Tech Lead | `PLAN`, `SPEC`, `ADR`, `TASKS`, `CHECKLIST` | alterar outcome sem devolver a decisão ao owner |\n| **Adversarial Tech Lead Agent** | Tech Lead | crítica técnica e trade-offs | bloquear por preferência estética sem evidência |\n| **Security / Data / Platform Agent** | Tech Lead | análise especializada | ampliar o parecer para domínios que não avaliou |\n\nO agente especialista tem uma regra de timing importante: é consultado **antes** da crítica adversarial, não depois. Trazer segurança ou dados ao final, quando a especificação já está fechada, transforma achado em retrabalho.\n\n## Construção e validação\n\nO maior grupo, e onde a separação entre produzir e aprovar fica mais visível: quem implementa não é quem valida.\n\n| Agente | Sponsor | Saída central | Não faz |\n|---|---|---|---|\n| **Software Engineer Agent** | Tech Lead | código, testes e documentação | mudar gates para aprovar o próprio código |\n| **QA / Validation Agent** | Tech Lead | matriz critério-evidência | corrigir silenciosamente o código que avalia |\n| **Security Review Agent** | Tech Lead | achados de segurança e privacidade | explorar produção ou exfiltrar dados |\n| **Architecture Review Agent** | Tech Lead | conformidade arquitetural | introduzir nova arquitetura sem ADR |\n| **Adversarial Code Reviewer Agent** | Tech Lead | achados de corretude e manutenção | exigir refatoração fora do escopo sem risco comprovado |\n\nO Software Engineer Agent trabalha sob uma restrição que parece limitante, mas é o que torna a revisão barata: **mudança mínima e comprovável, uma tarefa por vez**. Diffs pequenos são revisáveis; diffs grandes escondem defeitos.\n\n## Integração, homologação e operação\n\nEste grupo leva a mudança validada até a produção e observa sua saúde.\n\n| Agente | Sponsor | Saída central | Não faz |\n|---|---|---|---|\n| **PR Agent** | Tech Lead | PR e evidence pack | fazer merge sem política ou declarar CI verde sem checar |\n| **Product Validation Agent** | PM e UX | aceite de produto e experiência | dar o aceite humano final |\n| **Release Agent** | Tech Lead | release rastreável | ampliar exposição além da política |\n| **Observability Agent** | Tech Lead | sinais de saúde e alertas | silenciar alerta ou redefinir baseline para mascarar regressão |\n\nO Product Validation Agent ilustra bem a fronteira agente/humano: ele valida, produz evidências e recomenda o aceite — mas o **aceite final é humano**. O agente prepara a decisão; não a toma.\n\n## Conhecimento e melhoria\n\nO grupo que fecha o ciclo sobre o próprio sistema, mantendo a documentação viva e convertendo telemetria em aprendizado.\n\n| Agente | Sponsor | Saída central | Não faz |\n|---|---|---|---|\n| **Knowledge Agent** | owner do domínio | fontes canônicas atualizadas | converter hipótese em regra |\n| **Telemetry Agent** | trio | dataset e relatório do fluxo | concluir causalidade ou priorizar melhoria |\n| **Auto Dream Agent** | trio | aprendizados e demandas P0–P3 | aprovar prioridade ou editar memória sensível sozinho |\n| **Critic Agent** | owner da decisão | crítica independente | reavaliar com o mesmo raciocínio do autor |\n\nO Critic Agent é o mecanismo que **impede o sistema de concordar consigo mesmo**. Ele tenta refutar conclusões produzidas por outro agente, e sua regra fundamental é a independência real: reavaliar com o mesmo raciocínio e contexto do autor não é crítica, é eco.\n\n## Continue por aqui\n\nVocê conhece os papéis. Falta ver como eles se combinam em times temporários a cada fase — a [Composição por fase](composicao-por-fase.md).", "folder": "4-agentes"}, {"id": "4-agentes__composicao-por-fase", "section": "Agentes", "title": "Composição dos times por fase", "label": "Composição dos times por fase", "body": "# Composição dos times por fase\n\n> Como os papéis se combinam em times temporários a cada etapa, quem consolida a saída e por que a crítica vem sempre de uma instância independente.\n\n## Times que se montam e se dissolvem\n\nUma ideia central do Agent Team é que **cada fase aciona um time temporário de agentes, dissolvido ao final**. Isso permite ter dezenas de especializações disponíveis sem manter nenhuma delas ociosa. Você não paga por um \"Security Review Agent\" parado — ele só existe quando a fase de validação de uma mudança sensível o exige.\n\nDentro de cada time, a dinâmica é sempre a mesma. Um **agente primário** conduz e consolida o artefato da fase. Um ou mais agentes **colaboram ou desafiam** a partir de uma responsabilidade explícita. E os agentes adversariais procuram ambiguidade, gaps, risco e suposição frágil — sempre como instâncias independentes de quem produziu.\n\n## A composição etapa a etapa\n\nA tabela abaixo mostra, para cada fase, quem consolida a saída, quem colabora ou critica, e o que atravessa a fronteira no handoff.\n\n| Fase | Agente primário | Agentes críticos/especialistas | Handoff |\n|---|---|---|---|\n| Intake | Intake Agent | Meeting Context quando houver reunião | PM prioriza |\n| Discovery | Product Manager Agent | UX Specification + Tech Lead Discovery | `PB.md` para H1 |\n| Produto/UX | Product Manager + UX Specification | Adversarial Product Manager | PRD + UX spec para H2 |\n| Especificação | Specification Tech Lead | Adversarial TL + especialistas | PLAN/SPEC/TASKS para H3 |\n| Implementação | Orchestrator + Engineer | — | diff e gates locais |\n| Validação | QA / Validation | Security + Architecture + Code Reviewer | evidence pack |\n| Integração | PR Agent | Reviewer Agents | H4 / merge |\n| Homologação | Product Validation | Release Agent | release candidate |\n| Produção | Release Agent | Observability Agent | H5 / health report |\n| Conhecimento | Knowledge Agent | Critic quando sensível | fontes canônicas |\n| Melhoria | Telemetry + Auto Dream | Critic Agent | H6, memória ou backlog |\n\n## Por que a crítica é sempre independente\n\nSe você observar a tabela, notará um padrão deliberado: em quase toda fase, quem consolida não é quem critica. Na especificação, o Specification Tech Lead produz e o Adversarial Tech Lead ataca. Na validação, o Engineer implementou antes, e agora QA, Security, Architecture e Code Reviewer procuram o que ele não viu.\n\nIsso não é redundância — é a primeira das três regras do modelo aplicada ao nível do time: **quem propõe não é quem aprova**. Um agente que revisasse o próprio trabalho tenderia a confirmar suas próprias suposições. A independência estrutural, e não a boa-fé do modelo, é o que faz a crítica valer.\n\n## O papel do orquestrador\n\nEm fases com paralelismo, o Orchestrator Agent distribui contexto mínimo e controla dependências — mas há um limite que vale gravar: ele **não substitui** o consolidado do agente primário nem a decisão do owner humano. O orquestrador organiza o trânsito; não decide o destino.\n\n## Como isso vira execução real\n\nEsta página descreve a composição lógica. O **como** ela roda — onde os artefatos são gravados, como um handoff se conclui, o que atravessa a fronteira em cada etapa — é o assunto da próxima seção. Se você quer entender o Agent Team em movimento, siga para [Workflows](../5-workflows/TLDR.md).", "folder": "4-agentes"}, {"id": "5-workflows__TLDR", "section": "Workflows", "title": "Workflows — pista rápida", "label": "Resumo (TLDR)", "body": "# Workflows · TLDR\n\n> A pista rápida da seção. Você vai entender o que um workflow define que o catálogo de agentes não define, o contrato comum que todo workflow segue e onde a execução realmente acontece. Os detalhes ficam nas páginas ao final.\n\n## O que acontece *entre* os agentes\n\nA seção [Agentes](../4-agentes/TLDR.md) define cada papel isoladamente. Mas um papel sozinho não entrega nada — o valor aparece na colaboração. Um **workflow** define exatamente o que acontece *entre* os agentes: a sequência de missões, os artefatos que atravessam as fronteiras, como contribuições independentes convergem em um único artefato e o ponto em que uma decisão deve ser escalada ao humano.\n\nSe o catálogo é o elenco, o workflow é o roteiro.\n\n## Um contrato comum e uma jornada de 11 etapas\n\nTodo workflow explicita seis coisas, e a ausência de qualquer uma torna o workflow inexecutável por um agente sem negociação humana.\n\n| Item do contrato | Define |\n|---|---|\n| Entrada | artefatos de entrada e critérios para iniciar |\n| Missões | dependências e o que pode rodar em paralelo |\n| Consolidação | o único agente responsável pela saída |\n| Handoffs | fatos, evidências, hipóteses, riscos e perguntas em aberto |\n| Saída | gate de saída e destino em caso de falha |\n| Escalonamento | condição de parada e owner humano |\n\nA jornada tem 11 etapas, do intake à melhoria contínua. Cada uma é um workflow, com um agente que consolida e outros que colaboram ou desafiam. O detalhe está em [A jornada completa](a-jornada-completa.md).\n\n## Catálogo e execução são coisas diferentes\n\nA distinção que resolve a maior parte das dúvidas na prática: o **catálogo de workflows** é canônico e versionado; a **execução** acontece no workspace do owner, em `projects/<project>/`. Nada de uma execução concreta — nenhum `PRD`, plano ou evidência — é gravado no catálogo. Entender essa separação é o que evita que a documentação e o trabalho real se misturem. O tema é aprofundado em [Onde a execução acontece](onde-a-execucao-acontece.md).\n\n## Continue por aqui\n\nComece por [O contrato de workflow](contrato-de-workflow.md) para o formato comum. Depois veja [A jornada completa](a-jornada-completa.md) e feche com [Onde a execução acontece](onde-a-execucao-acontece.md).", "folder": "5-workflows"}, {"id": "5-workflows__a-jornada-completa", "section": "Workflows", "title": "A jornada completa, workflow a workflow", "label": "A jornada completa, workflow a workflow", "body": "# A jornada completa, workflow a workflow\n\n> As onze etapas da jornada em detalhe: quem consolida, quem colabora, o que cada etapa entrega e qual gate autoriza avançar.\n\n## O mapa da jornada\n\nA jornada completa vai de uma necessidade bruta até aprendizado documentado, passando por produção. Cada etapa é um workflow com um agente que consolida a saída e outros que colaboram ou desafiam. Este é o mapa que a página inteira detalha.\n\n| Etapa | Workflow | Consolida | Colaboram ou desafiam |\n|---:|---|---|---|\n| 0 | Intake e triagem | Intake Agent | Product Manager; Meeting Context quando houver reunião |\n| 1 | Discovery e research | Product Manager Agent | UX Specification; Tech Lead Discovery; Adversarial PM |\n| 2 | Produto e UX | Product Manager + UX Specification | Adversarial PM; especialistas de pesquisa/conteúdo |\n| 3 | Especificação técnica | Specification Tech Lead | Adversarial TL; Security/Data/Platform |\n| 4 | Implementação autônoma | Orchestrator Agent | Software Engineer Agents |\n| 5 | Validação adversarial | QA / Validation Agent | Security; Architecture; Adversarial Code Reviewer |\n| 6 | PR e merge | PR Agent | Reviewer Agents |\n| 7 | Homologação | Product Validation Agent | Release Agent |\n| 8 | Produção e observação | Release Agent | Observability Agent |\n| 9 | Curadoria de conhecimento | Knowledge Agent | Critic Agent quando sensível |\n| 10 | Telemetria e melhoria | Auto Dream Agent | Telemetry; Observability; Critic |\n\n## Da necessidade ao plano (etapas 0 a 3)\n\nAs primeiras etapas transformam uma necessidade vaga em um plano executável, e o padrão de produção-e-crítica aparece já aqui.\n\nO **intake** registra, deduplica, contextualiza e prioriza. Ele é o filtro que impede ruído de entrar no backlog como se fosse demanda: entrega um Work Item priorizável com contexto inicial, owner e risco preliminar. O gate exige problema, origem, owner e contexto mínimo explícitos.\n\nO **discovery** compreende problema, usuário, contexto, valor e viabilidade inicial. Três agentes investigam em paralelo — cada um no seu domínio — e o Product Manager Agent sintetiza enquanto os demais criticam a síntese. Entrega o `PB.md` com problema, usuários, jornada, valor, restrições e riscos. O gate exige problema validado e viabilidade avaliada.\n\nO **planejamento de produto e UX** transforma o problema em uma proposta clara, testável e utilizável. A dinâmica é proposta → protótipo e UX spec → crítica adversarial → revisão → consolidação. Entrega o `PRD.md`, a jornada e o fluxo desejados, os estados e critérios de acessibilidade, e os critérios de sucesso. O gate exige gaps tratados e critérios aprovados.\n\nA **especificação técnica** define como construir, validar, liberar e operar. Entrega um conjunto de artefatos que se sustentam mutuamente:\n\n| Artefato | Conteúdo |\n|---|---|\n| `PLAN.md` | estratégia de implementação |\n| `ADR.md` | decisões arquiteturais e consequências |\n| `SPEC.md` | comportamento e contratos técnicos |\n| `TASKS.md` | unidades pequenas de execução |\n| `CHECKLIST.md` | critérios verificáveis de aceite |\n\nO gate exige gaps críticos tratados, trade-offs registrados e tarefas executáveis — com rastreabilidade completa de `PRD → UX → SPEC → TASKS → CHECKLIST`.\n\n## Do plano ao merge (etapas 4 a 6)\n\nAqui o plano vira código integrado, sob a disciplina de mudanças pequenas e crítica independente.\n\nA **implementação** trabalha *uma tarefa pequena por vez*. O Orchestrator distribui e os Software Engineer Agents executam, apoiados pelo repo harness, pelas skills e pelas ferramentas de código. O resultado é código, testes, documentação e commits em um diff rastreável. A ação humana só ocorre diante de decisão, exceção ou escalonamento.\n\nA **validação adversarial** prova aderência à especificação e procura falhas que o autor não encontrou. Agentes de QA, Security, Architecture e Code Review executam testes, verificação de segurança, análise arquitetural, acessibilidade e regressão. O gate exige checklist completo e ausência de bloqueadores.\n\nO **PR e merge** avalia qualidade, risco, manutenibilidade e prontidão para integração. O gate exige revisão aprovada, CI verde, branch atualizada e aprovações válidas — e é aqui que o marco H4 acontece.\n\n## Do merge ao aprendizado (etapas 7 a 10)\n\nAs etapas finais levam a mudança à produção com segurança e fecham o ciclo sobre o próprio sistema.\n\nA **homologação** confirma valor e comportamento em cenário representativo, com o PM respondendo por valor e o UX por experiência. O gate exige critérios de aceite validados ou um plano de correção explícito.\n\nA **entrega e observação** libera com exposição controlada e prova saúde no uso real — deploy progressivo, feature flag quando aplicável, monitoramento e comparação com baseline. O gate exige janela pós-deploy sem regressão relevante, e é onde ocorre o H5.\n\nA **curadoria de conhecimento** mantém a documentação alinhada ao produto real, de forma contínua. O Knowledge Agent consolida decisões e aprendizados e procura contradições e obsolescência. O gate exige documentação atual, rastreável e sem contradições.\n\nA **telemetria e melhoria contínua** fecha o ciclo sobre o sistema de trabalho: converte dados de operação em aprendizado validado ou em demanda priorizada. Ela é a etapa que faz o próximo ciclo ser mais seguro, rápido e autônomo que o anterior — e conecta-se diretamente ao marco H6.\n\n```mermaid\nflowchart LR\n  N[Necessidade] --> P[Plano: 0-3]\n  P --> C[Código integrado: 4-6]\n  C --> Pr[Produção: 7-8]\n  Pr --> A[Aprendizado: 9-10]\n  A -.melhora o sistema.-> N\n```\n\n## Continue por aqui\n\nVocê viu o *quê* de cada etapa. Falta o *onde*: em que pasta cada artefato é gravado e como um handoff se conclui. Esse é o assunto de [Onde a execução acontece](onde-a-execucao-acontece.md).", "folder": "5-workflows"}, {"id": "5-workflows__contrato-de-workflow", "section": "Workflows", "title": "O contrato de um workflow", "label": "O contrato de um workflow", "body": "# O contrato de um workflow\n\n> As seis coisas que todo workflow explicita, as convenções de execução que valem para todos e o modo dry-run para experimentar sem gerar artefatos.\n\n## O que um workflow adiciona ao catálogo\n\nVale reforçar a fronteira antes de entrar no detalhe. Os workflows **não substituem** nada do que você já viu: não substituem os contratos individuais do [catálogo de agentes](../4-agentes/catalogo-por-grupo.md), nem a autoridade do [modelo operacional](../2-modelo-operacional/TLDR.md), nem os gates da jornada. O que eles adicionam é a **coreografia**: a ordem das missões, o que atravessa cada fronteira e como as contribuições convergem.\n\n## As seis cláusulas do contrato\n\nTodo workflow explicita seis coisas. Pense nelas como as perguntas que precisam estar re
