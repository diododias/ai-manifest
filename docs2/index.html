spondidas para que um agente execute a etapa sem ter que negociar com um humano no meio do caminho.\n\n| Item | Define |\n|---|---|\n| Entrada | artefatos de entrada e critérios para iniciar |\n| Missões | dependências e o que pode rodar em paralelo |\n| Consolidação | o único agente responsável pela saída |\n| Handoffs | fatos, evidências, hipóteses, riscos e perguntas em aberto |\n| Saída | gate de saída e destino em caso de falha |\n| Escalonamento | condição de parada e owner humano da decisão |\n\nDuas cláusulas costumam ser subestimadas. **Consolidação** exige um único agente responsável pela saída — não um comitê — para que sempre exista alguém que responde pelo artefato final. E **saída** precisa declarar o destino *em caso de falha*, não só de sucesso: um workflow que só sabe o que fazer quando tudo dá certo trava no primeiro imprevisto.\n\n## As convenções que valem para todo workflow\n\nAlém das seis cláusulas, três convenções de execução se aplicam a todos os workflows e merecem ser compreendidas de uma vez.\n\nA convenção de **formato** determina que toda missão usa o envelope de saída padrão (o mesmo que você viu no [contrato comum dos agentes](../4-agentes/contrato-comum.md)) e que um handoff **referencia** artefatos versionados em vez de copiar o contexto inteiro. Copiar contexto gera divergência silenciosa quando o original muda; referenciar mantém uma única fonte de verdade.\n\nA convenção de **convergência** estabelece que uma contribuição não vira decisão só por estar no consolidado. Divergências e riscos residuais permanecem explícitos, e o workflow termina com um artefato coerente e um evidence pack — nunca com respostas isoladas dos agentes empilhadas.\n\nA convenção de **revisão** determina que nova informação material devolve o workflow ao agente responsável pela revisão e invalida a aprovação relacionada quando a política assim determinar. É a aplicação, no fluxo, da regra de que silêncio não aprova e que uma mudança relevante reabre a decisão.\n\n## O modo dry-run: experimentar sem consequências\n\nHá uma capacidade que ajuda muito no aprendizado: workflows podem rodar em **modo dry-run**, um modo de experimentação que não gera artefatos persistentes. Nele, o agente executa todo o raciocínio, análises e rascunhos normalmente, mas não cria nem modifica arquivos em `projects/` ou em qualquer pasta de artefatos, e não atualiza board, status ou handoffs. Ele pode imprimir na conversa o que *teria* gerado.\n\nO dry-run é ideal para três situações: explorar um workflow que você não conhece, testar uma abordagem antes de comprometê-la, ou validar o comportamento de um agente sem efeitos colaterais. Para ativar, passa-se `mode: dry-run` no início da missão ou prefixa-se o comando com `--dry-run`.\n\n## Continue por aqui\n\nCom o contrato claro, veja como ele se aplica às onze etapas concretas em [A jornada completa](a-jornada-completa.md).", "folder": "5-workflows"}, {"id": "5-workflows__onde-a-execucao-acontece", "section": "Workflows", "title": "Onde a execução acontece", "label": "Onde a execução acontece", "body": "# Onde a execução acontece\n\n> A diferença entre o catálogo canônico e a execução no workspace, onde cada artefato é gravado por workflow e por que um handoff só termina na fonte canônica.\n\n## Catálogo versus execução: a distinção que evita bagunça\n\nEsta é a distinção mais importante para não misturar documentação com trabalho real. O **catálogo de workflows** é canônico e versionado — ele descreve como cada etapa deveria acontecer, e não recebe artefatos de nenhuma execução concreta. A **execução** acontece dentro do workspace de cada owner, em `projects/<project>/`.\n\nEm outras palavras: o catálogo é a receita; a execução é o prato. Você nunca escreve no verso da receita o que aconteceu no jantar de ontem. Um agente nunca grava no catálogo global um `PB`, `PRD`, plano, evidência ou handoff de uma execução.\n\n## Como o agente resolve onde trabalhar\n\nAntes de iniciar qualquer missão, o agente segue uma cadeia de resolução fixa para descobrir onde ler e onde escrever:\n\n```text\nworkspace do owner → projects/<project> → Work Item → fontes canônicas\n```\n\nCada usuário ou papel executa o workflow dentro do seu próprio workspace. A instalação desse workspace mantém uma pasta `docs/workflows/` que **referencia** o workflow canônico — registrando qual versão está habilitada, permissões, integrações e adaptações locais. Essa camada local aponta para o catálogo; nunca o copia nem vira uma fonte de verdade concorrente.\n\n## Onde cada workflow grava seus artefatos\n\nCada etapa grava seus artefatos persistentes na fonte canônica do domínio dono daquele conteúdo. A tabela abaixo mostra o mapa — repare que produto vai para o workspace do PM, experiência para o do UX, e engenharia para o do Tech Lead.\n\n| Workflow | Artefatos persistentes | Trânsito temporário |\n|---|---|---|\n| Intake | `<pm>/projects/<project>/work-items/` | `.coordination/inbox/` e `handoffs/` |\n| Discovery | PM: `discovery/`; UX: `research/` e `journeys/`; TL: `engineering/architecture/` | `.coordination/handoffs/` |\n| Produto e UX | PM: `requirements/prd/`, `strategy/`, `decisions/`; UX: `flows/`, `specifications/`, `prototypes/`, `validation/` | `handoffs/` de cada workspace |\n| Especificação | TL: `plans/active/`, `engineering/specs/`, `engineering/adr/`, `work-items/` | `execution/handoffs/` |\n| Implementação | TL: `work-items/`, `execution/evidence/`, `repos/worktrees/<org>/<repo>/<work-item>/` | `.coordination/active/` |\n| Validação e PR | TL: `execution/reviews/` e `execution/evidence/` | `.coordination/blockers/` |\n| Homologação | PM, UX e TL: cada um em seu `validation/` ou `evidence/` | handoff para release |\n| Produção | TL: `execution/evidence/`, `LEARNINGS.md`, registro de release | incidente e rollback em `.coordination/` |\n| Conhecimento | fonte canônica do domínio; TL: `LEARNINGS.md`; PM: novo `work-item/` | propostas em `.coordination/` |\n\n## Persistente versus trânsito: quando um handoff termina\n\nA coluna da direita da tabela merece atenção, porque expõe uma regra sutil. As pastas `.coordination/` e o `memory.md` são **auxiliares** — trânsito temporário, não fonte de verdade. Um handoff só se torna **concluído** quando seu artefato final chegou à fonte canônica do projeto.\n\nIsso significa que um trabalho parado em `.coordination/` não está pronto, por mais completo que pareça. Ele ainda está a caminho. A conclusão é definida pela chegada ao destino canônico, não pela existência de um rascunho em trânsito.\n\n## Bindings locais podem restringir, nunca ampliar\n\nHá uma última assimetria, intencional, que conecta esta página ao modelo de autonomia. O binding local em `<workspace>/docs/workflows/` declara a versão do workflow canônico e pode **restringir** ferramentas, permissões e integrações. O que ele **não pode** fazer é ampliar autonomia ou alterar gates sem a decisão prevista no modelo operacional.\n\nA lógica é a mesma que protege todo o sistema: afrouxar uma proteção exige decisão explícita e owner; apertá-la, não. O caminho de menor resistência nunca pode ser reduzir a segurança.\n\n## Continue por aqui\n\nVocê viu que a execução vive no workspace de cada owner. A próxima seção abre esse workspace por dentro: sua estrutura, seu ownership e o harness que o torna operável. Siga para [Workspace](../6-workspace/TLDR.md).", "folder": "5-workflows"}, {"id": "6-workspace__TLDR", "section": "Workspace", "title": "Workspace — pista rápida", "label": "Resumo (TLDR)", "body": "# Workspace · TLDR\n\n> A pista rápida da seção. Você vai entender o que é um workspace, como ele se organiza por papel, como o ownership é dividido entre workspaces e o que é o harness que o torna operável por agentes. Os detalhes ficam nas páginas ao final.\n\n## Onde o trabalho realmente acontece\n\nDepois de entender modelo, skills, agentes e workflows, falta o lugar onde tudo isso roda. Esse lugar é o **workspace**. Ele não é material de referência — é o ponto de trabalho onde cada papel humano e seus agentes executam o fluxo de verdade.\n\nExiste um workspace por papel: `pm/`, `ux/` e `tech-lead/`. Cada um tem uma raiz independente para que seus contratos, exemplos e fontes de verdade evoluam sem misturar responsabilidades.\n\n## As três engrenagens do workspace\n\nTrês ideias organizam qualquer workspace, e cada uma tem uma página própria.\n\n| Engrenagem | O que resolve | Você aprende em |\n|---|---|---|\n| **Estrutura** | onde cada artefato de uma execução vive | [Estrutura do workspace](estrutura-do-workspace.md) |\n| **Ownership** | qual workspace é dono de qual verdade | [Ownership entre workspaces](ownership-entre-workspaces.md) |\n| **Harness do workspace** | o que torna o espaço operável por agentes | [Harness do workspace](harness-do-workspace.md) |\n\nCada workspace mantém um `AGENTS.md` (como operar), um `BOARD.md` (Work Items em andamento), um `memory.md` (retomada de contexto) e uma pasta `projects/<project>/` (os artefatos reais de cada iniciativa).\n\n## Dois harnesses que não se confundem\n\nUma distinção fecha esta seção e conecta com a próxima. O **harness do workspace** organiza o trabalho do agente *fora* do código — Work Items, memória, projetos, coordenação. O **repo harness** vive *dentro* de cada repositório de código e viaja com o clone. A regra que separa os dois: se a informação continua verdadeira quando outro time clona o repositório, ela é repo harness; se ela é sobre como o trabalho está organizado esta semana, é workspace.\n\n## Continue por aqui\n\nComece por [Estrutura do workspace](estrutura-do-workspace.md). Depois entenda o [Ownership entre workspaces](ownership-entre-workspaces.md) e feche com o [Harness do workspace](harness-do-workspace.md), que prepara o terreno para a seção do [repo harness](../7-repo-harness/TLDR.md).", "folder": "6-workspace"}, {"id": "6-workspace__estrutura-do-workspace", "section": "Workspace", "title": "A estrutura de um workspace", "label": "A estrutura de um workspace", "body": "# A estrutura de um workspace\n\n> Os arquivos que todo workspace mantém, como `projects/` organiza cada iniciativa e por que material bruto e trânsito temporário ficam separados da fonte canônica.\n\n## Um workspace por papel\n\nO trabalho do trio não mora em um único lugar compartilhado — cada papel tem sua própria raiz. Essa separação existe para que as responsabilidades não se misturem: o PM registra valor e requisitos, o UX registra evidência e experiência, o Tech Lead registra arquitetura e execução. Três raízes independentes evoluem sem pisar uma na outra.\n\n```text\nworkspaces/\n├── pm/           # valor, prioridade, requisitos e resultados de produto\n├── ux/           # pesquisa, experiência, acessibilidade e validação\n└── tech-lead/    # viabilidade, arquitetura, implementação e risco\n```\n\n## Os quatro arquivos que todo workspace mantém\n\nIndependentemente do papel, todo workspace mantém quatro peças. Conhecê-las é o suficiente para se orientar em qualquer um dos três.\n\n| Peça | Responde | Natureza |\n|---|---|---|\n| `AGENTS.md` | como operar neste workspace | contrato de operação |\n| `BOARD.md` | quais Work Items estão em andamento | estado do trabalho |\n| `memory.md` | onde retomo o contexto | auxiliar, nunca fonte canônica |\n| `projects/<project>/` | os artefatos reais de cada iniciativa | fonte canônica |\n\nQuando um agente inicia uma missão, ele lê o `AGENTS.md` do workspace, identifica as skills aplicáveis e segue a estrutura de `projects/` — em vez de inventar convenções próprias. É por isso que as três skills de base ([Skills de base](../3-skills/skills-de-base.md)) existem: elas ensinam o agente a navegar essa estrutura com segurança.\n\n## Onde os artefatos de uma execução vivem\n\nOs artefatos persistentes de uma execução nunca ficam soltos nem no catálogo global — eles vivem em `projects/<project>/`, no workspace dono do domínio. O PM registra ali discovery, PRD, decisões e Work Items; o UX registra research, jornadas, fluxos, especificações e validações; o Tech Lead registra planos em `plans/active/`, specs, ADRs, evidências, reviews e worktrees.\n\nUm detalhe importante: `projects/` de um workflow **não** fica em `docs/workflows/`. A pasta `docs/workflows/` do workspace é apenas a camada de binding local — quais workflows estão habilitados, em qual versão, com quais permissões. O trabalho real fica em `projects/`.\n\n## Material bruto e trânsito: separados de propósito\n\nDuas categorias de conteúdo ficam deliberadamente fora da fonte canônica, e entender por quê evita confusão.\n\nO **material bruto** que sustenta as análises — transcrições, prints, e-mails, PDFs, documentos — fica em `projects/<project>/plans/assets/<workflow>/<YYYY-MM-DD>-<session-id>/`. Cada execução usa sua própria pasta de sessão. Isso resolve um problema real: reexecutar um workflow porque o resultado não ficou bom **nunca** sobrescreve nem mistura o material da tentativa anterior. O asset permanece como rastro auditável, e a conclusão vai para o artefato do domínio correto.\n\nO **trânsito temporário** — handoffs e bloqueios em `.coordination/` — é só passagem. Como você viu em [Onde a execução acontece](../5-workflows/onde-a-execucao-acontece.md), um handoff só se conclui quando o artefato final chega à fonte canônica. `.coordination/` guarda o que está a caminho, não o que está pronto.\n\n## Continue por aqui\n\nVocê sabe onde as coisas ficam dentro de um workspace. Falta entender como os três workspaces se relacionam — quem é dono de qual verdade. Vá para [Ownership entre workspaces](ownership-entre-workspaces.md).", "folder": "6-workspace"}, {"id": "6-workspace__harness-do-workspace", "section": "Workspace", "title": "O harness do workspace", "label": "O harness do workspace", "body": "# O harness do workspace\n\n> O que torna um workspace operável por agentes de forma repetível: as convenções, as skills de base e as garantias de coordenação quando vários agentes trabalham ao mesmo tempo.\n\n## O que \"harness do workspace\" significa\n\nVocê já encontrou a palavra *harness* algumas vezes. Vale defini-la com precisão aqui, porque ela tem dois sentidos que não podem se confundir. Um harness, de forma geral, é o conjunto de arquivos, convenções e verificações que torna um espaço **compreensível e seguro** para um agente operar sem precisar que alguém recite o contexto toda vez.\n\nO **harness do workspace** é esse conjunto aplicado ao espaço de trabalho do trio — o que organiza o trabalho do agente *fora* do código. Ele é diferente do repo harness, que vive dentro do repositório de código e é o assunto da [seção 7](../7-repo-harness/TLDR.md). A regra de decisão que separa os dois: se a informação continua verdadeira quando outro time clona o repositório de código, ela é repo harness; se ela descreve como o trabalho está organizado — quais projetos existem, quem faz o quê esta semana, em qual Work Item —, ela é workspace.\n\n## As convenções que o workspace impõe\n\nO harness do workspace se materializa nas convenções que você já viu nas páginas anteriores desta seção, agora reunidas sob um nome. São elas que permitem a um agente chegar a um workspace desconhecido e operar corretamente.\n\nA primeira convenção é a **cadeia de resolução**: `workspace do owner → projects/<project> → Work Item → fontes canônicas`. Um agente sempre resolve onde trabalhar por esse caminho, nunca por adivinhação. A segunda é a **separação entre persistente e trânsito**: fontes canônicas em `projects/`, auxiliares em `.coordination/` e `memory.md`. A terceira é o **isolamento de sessão**: cada execução usa sua própria pasta em `plans/assets/`, de modo que reexecuções não se sobrescrevem.\n\n## As skills de base são o harness em ação\n\nAqui as peças se encaixam. As três skills de base — [`workspace-memory`, `workspace-projects` e `workspace-board`](../3-skills/skills-de-base.md) — são, na prática, o harness do workspace executável. Elas não produzem o entregável de nenhuma fase; elas garantem que o agente respeite as convenções do workspace antes de produzir qualquer coisa.\n\n| Skill de base | Convenção que aplica |\n|---|---|\n| `workspace-memory` | retomar contexto e nunca tratar `memory.md` como fonte canônica |\n| `workspace-projects` | localizar a fonte canônica correta e isolar assets por sessão |\n| `workspace-board` | assumir e reconciliar Work Items com evidência |\n\nPor isso elas são obrigatórias em toda missão: sem elas, o harness do workspace seria apenas uma convenção documentada, não uma convenção seguida.\n\n## Quando vários agentes operam ao mesmo tempo\n\nO harness do workspace ganha importância extra quando **vários agentes** trabalham em paralelo. As falhas que aparecem aí não são de qualidade — são de coordenação, e cada uma tem uma contramedida.\n\n| Falha de coordenação | O que acontece | Contramedida |\n|---|---|---|\n| Sobrescrita silenciosa | dois agentes editam o mesmo arquivo; o último vence | um arquivo por unidade de trabalho; worktree por Work Item |\n| Contenção em arquivo comum | vários atualizam o mesmo board ou log | consolidação por um coordenador |\n| Perda de rastro | não se sabe qual agente produziu o quê | autoria e versão registradas em cada artefato |\n| Handoff perdido | trabalho fica preso em trânsito | handoff só conclui na fonte canônica |\n\nNote o paralelo com o repo harness: lá, o mesmo tipo de problema (vários agentes sobre o mesmo código) é resolvido por worktrees e identidades distintas. A ideia é a mesma dos dois lados da fronteira — **isolar a execução para que a colaboração não vire colisão**.\n\n## Continue por aqui\n\nVocê fechou o lado de *fora* do código: como o trabalho do agente é organizado no workspace. A próxima seção atravessa a fronteira para o lado de *dentro* — o que um repositório de código carrega para ser operado por agentes com segurança. Siga para [Repositório da aplicação (harness)](../7-repo-harness/TLDR.md).", "folder": "6-workspace"}, {"id": "6-workspace__ownership-entre-workspaces", "section": "Workspace", "title": "Ownership entre workspaces", "label": "Ownership entre workspaces", "body": "# Ownership entre workspaces\n\n> Qual workspace é a fonte canônica de cada tipo de verdade, o que os demais recebem e como um agente busca contexto de outro domínio sem duplicá-lo.\n\n## Uma verdade, um dono\n\nO princípio que governa a relação entre os três workspaces é simples e rígido: **uma informação autoritativa não deve ser mantida em dois lugares**. Cada tipo de verdade tem exatamente um workspace dono, e os demais recebem apenas o que precisam — uma decisão aprovada, um handoff, um snapshot.\n\nA razão é evitar o pior problema de documentação distribuída: duas versões da mesma verdade que divergem com o tempo, sem que ninguém saiba qual vale. Com um dono único por domínio, sempre há uma resposta para \"qual é a versão correta?\".\n\n## O mapa de ownership\n\nA tabela abaixo é a referência. Ela diz, para cada domínio de verdade, qual workspace é a fonte canônica e o que os outros dois recebem dele.\n\n| Domínio | Fonte canônica | Os demais recebem |\n|---|---|---|\n| Valor, prioridade, outcome e requisitos | `pm/` | decisão aprovada e handoff de produto |\n| Evidência de usuário, jornada e experiência | `ux/` | UX spec, critérios e handoff de experiência |\n| Arquitetura, implementação e risco operacional | `tech-lead/` | viabilidade, contratos técnicos e evidence pack |\n\nRepare que isso é a mesma [tabela de direitos de decisão](../2-modelo-operacional/trio-humano.md) do modelo operacional, agora expressa em termos de arquivos e pastas. O PM é dono do valor tanto na decisão quanto no disco; o UX, da experiência; o Tech Lead, da técnica. A organização física do trabalho espelha a autoridade humana.\n\n## Como um agente busca contexto de outro domínio\n\nNa prática, um agente frequentemente precisa de contexto que pertence a outro workspace. Um Software Engineer Agent, no workspace do Tech Lead, precisa consultar o PRD, que vive no workspace do PM. Como fazer isso sem criar uma cópia que vai divergir?\n\nA regra tem duas opções, ambas seguras. A primeira é **seguir o link até a fonte** — ler o artefato onde ele realmente vive, no workspace dono. A segunda, quando o link direto não é viável, é usar um **snapshot identificado como não autoritativo** e confirmar sua validade antes de agir. O que nunca se faz é copiar a informação para o próprio workspace e passar a tratá-la como verdade local — porque no dia em que a original mudar, a cópia mente.\n\n## Por que os exemplos são fictícios\n\nSe você abrir os workspaces de exemplo do repositório, encontrará nomes, organizações, repositórios e estados fictícios. Isso é intencional: eles demonstram a estrutura, não o trabalho de produção de uma equipe real. Ao copiar a estrutura para o seu time, esses valores devem ser substituídos pelos seus.\n\n## Continue por aqui\n\nVocê entende a estrutura e o ownership. Falta a peça que torna tudo isso *operável por agentes* de forma repetível — o [Harness do workspace](harness-do-workspace.md).", "folder": "6-workspace"}, {"id": "7-repo-harness__TLDR", "section": "Repositório (harness)", "title": "Repositório da aplicação (harness) — pista rápida", "label": "Resumo (TLDR)", "body": "# Repositório da aplicação · TLDR\n\n> A pista rápida da seção. Você vai entender o que é o repo harness, as cinco camadas que o compõem, como ele se estrutura em arquivos e os níveis de maturidade que definem o teto da autonomia. Os detalhes ficam nas páginas ao final.\n\n## Um agente competente em um repo sem harness\n\nColoque um agente excelente em um repositório sem harness e ele produzirá **código plausível e errado**. Ele não sabe qual padrão o time abandonou no ano passado, qual módulo não pode importar qual, quais testes provam o que ele acabou de escrever, nem quando parar e perguntar. Esse conhecimento existe — mas vive na cabeça das pessoas, e a cada execução alguém precisa recitá-lo de novo.\n\nO custo real disso não é o erro isolado. É que a revisão humana volta a ser o único gate de verdade, e a autonomia nunca sobe.\n\n## Converter conhecimento tácito em arquivos e verificações\n\nO repo harness resolve isso convertendo o conhecimento tácito do repositório em **arquivos versionados que o agente lê sozinho e verificações que rodam sem pedir licença**. Ele se organiza em cinco camadas cumulativas, e a ordem importa.\n\n| Camada | Responde | Materializa em |\n|---|---|---|\n| **Contexto** | o que este repositório é e quais regras valem | `AGENTS.md`, `docs/rules/` |\n| **Procedimento** | como executar uma tarefa recorrente do jeito certo | skills, comandos, scripts |\n| **Verificação** | o que precisa ser verdade antes de avançar | hooks, CI, políticas de merge |\n| **Permissão** | o que este agente pode tocar e o que exige gente | `CODEOWNERS`, settings, ambientes |\n| **Evidência** | como provar depois que estava correto | evidence pack, logs, artefatos |\n\nAs camadas e a estrutura de arquivos são detalhadas em [As cinco camadas](as-cinco-camadas.md) e [Estrutura de arquivos](estrutura-de-arquivos.md).\n\n## A maturidade é o teto da autonomia\n\nA regra que amarra esta seção ao modelo inteiro: **a maturidade do harness é o teto da autonomia, nunca a consequência dela**. Os níveis HL0 a HL3 medem o que o repositório tem, e cada nível autoriza um teto de autonomia. Um repositório não fica seguro porque você decidiu confiar nele — ele fica seguro porque construiu as camadas que tornam a confiança verificável. Os níveis estão em [Níveis de maturidade](niveis-de-maturidade.md).\n\n## Continue por aqui\n\nComece por [As cinco camadas](as-cinco-camadas.md) para a lógica. Depois veja a [Estrutura de arquivos](estrutura-de-arquivos.md) para montar um repo, e feche com os [Níveis de maturidade](niveis-de-maturidade.md).", "folder": "7-repo-harness"}, {"id": "7-repo-harness__as-cinco-camadas", "section": "Repositório (harness)", "title": "As cinco camadas do repo harness", "label": "As cinco camadas do repo harness", "body": "# As cinco camadas do repo harness\n\n> O que cada camada elimina, por que a ordem de construção importa e qual é o erro de sequenciamento mais comum.\n\n## O manual de bordo do repositório\n\nUma boa metáfora para o repo harness é o **manual de bordo**: tudo que uma pessoa nova precisaria saber para trabalhar no repositório sem atrapalhar ninguém, só que escrito para ser lido e seguido por um agente. Ele mora dentro do repositório de código, viaja com o clone, e existe para responder quatro perguntas antes que o agente precise agir — o que é este repositório, como se faz as coisas aqui, o que preciso provar antes de dizer que terminei, e o que não posso tocar sem autorização.\n\nVale saber também o que o harness **não** é. Ele não é a esteira de CI — a esteira é apenas uma implementação de uma das cinco camadas. Ele não é a documentação de arquitetura em si — ele aponta para ela. E ele não é sobre como o trabalho é organizado fora do código — isso é o [workspace](../6-workspace/harness-do-workspace.md).\n\n## Cada camada elimina uma classe de falha\n\nO harness tem cinco camadas, e cada uma existe para eliminar um tipo específico de falha. A melhor forma de entendê-las é olhar o sintoma que aparece quando a camada está ausente — é assim que você reconhece, num repositório real, qual camada está faltando.\n\n| Camada | Elimina | Sintoma quando falta |\n|---|---|---|\n| **Contexto** | agente reconstruindo premissas a cada execução | soluções fora do padrão do repo; mesma correção pedida em PRs diferentes |\n| **Procedimento** | variação entre execuções da mesma tarefa | dois agentes resolvem a mesma tarefa de formas incompatíveis |\n| **Verificação** | confiança substituindo prova | aprovação baseada em \"o agente parece confiável\"; defeito em produção |\n| **Permissão** | mudança fora do escopo autorizado | agente altera migração ou secret sem que ninguém tenha decidido |\n| **Evidência** | conclusão sem rastro auditável | ninguém reconstrói por que a mudança foi aprovada |\n\n## A ordem de construção segue o retorno decrescente\n\nAs camadas são cumulativas, e a ordem de construção não é estética — é econômica. Você constrói na sequência contexto → procedimento → verificação → permissão → evidência, e há uma razão para cada posição.\n\n**Contexto é o mais barato de escrever e o que mais reduz retrabalho imediato.** Um `AGENTS.md` e algumas rules custam pouco e já fazem o agente parar de reconstruir premissas. **Verificação é cara de configurar, mas é a única camada que permite reduzir a revisão humana** — sem gates, a pessoa continua sendo o único filtro. **Evidência só tem valor quando existe algo verificado para registrar** — construída antes das outras, ela produz arquivos que ninguém lê.\n\n## O erro de sequenciamento mais comum\n\nVale um alerta explícito, porque quase todo time novo comete o mesmo erro: **pular contexto para ir direto aos gates**. Parece produtivo, porque gates dão sinal imediato — o agente tenta, falha, ajusta, tenta de novo. Mas cada volta custa tempo de CI e tokens, e nenhuma delas ensina o padrão para a próxima execução.\n\nO resultado é um agente que trata o pipeline como oráculo: nunca aprende por que algo está errado, só descobre *que* está. Verificação sem contexto produz um agente que falha rápido sem saber por quê; contexto sem verificação produz um agente que acerta às vezes e ninguém sabe quando. As duas camadas se sustentam mutuamente, e contexto vem primeiro.\n\n## As duas camadas que só existem por causa dos agentes\n\nDuas das cinco camadas — permissão e evidência — merecem uma observação final. Elas existem precisamente porque quem opera o repositório **não é uma pessoa**. Um humano diante de uma migração de banco hesita naturalmente; um agente, não — então a hesitação precisa estar escrita, na forma de permissão. E a aprovação humana precisa ser sobre fatos verificáveis, não sobre a impressão que o resumo do agente causou — daí a evidência.\n\n## Continue por aqui\n\nVocê entende a lógica das camadas. Para vê-las materializadas em arquivos concretos, vá para [Estrutura de arquivos](estrutura-de-arquivos.md).", "folder": "7-repo-harness"}, {"id": "7-repo-harness__estrutura-de-arquivos", "section": "Repositório (harness)", "title": "A estrutura de arquivos do repo harness", "label": "A estrutura de arquivos do repo harness", "body": "# A estrutura de arquivos do repo harness\n\n> Onde cada peça do harness fica no repositório, o que vai em `AGENTS.md` e nas rules, e as decisões de organização que parecem burocráticas mas evitam custo no médio prazo.\n\n## O alvo completo\n\nA árvore abaixo é o alvo de um repositório maduro — o nível HL3 que você verá em [Níveis de maturidade](niveis-de-maturidade.md). Repositórios em níveis anteriores têm um subconjunto dela. Use-a como referência do que existe quando o harness está completo, não como checklist a cumprir de uma vez.\n\n```text\n<repositório>/\n├── AGENTS.md                      # contrato de entrada do agente\n├── README.md                      # uso humano: rodar, buildar, contribuir\n├── CODEOWNERS                     # propriedade por path\n│\n├── docs/\n│   ├── rules/\n│   │   ├── architecture.md        # módulos, fronteiras, dependências permitidas\n│   │   ├── coding.md              # convenções, padrões aceitos e proibidos\n│   │   ├── testing.md             # níveis obrigatórios por tipo de mudança\n│   │   ├── security.md            # dados, secrets, autenticação, privacidade\n│   │   └── operations.md          # SLOs, observabilidade, rollout, rollback\n│   ├── adr/\n│   │   └── ADR-NNN-<slug>.md      # decisões e consequências\n│   └── evidence/\n│       └── <work-item>/           # evidence pack por unidade de trabalho\n│\n├── skills/\n│   └── <skill>/SKILL.md           # procedimentos executáveis do repo\n│\n├── .agent/\n│   ├── settings.json              # tools permitidas, limites, modelos\n│   └── permissions.md             # o que exige humano neste repositório\n│\n├── scripts/\n│   ├── verify.sh                  # entrada única das verificações locais\n│   └── evidence.sh                # coleta e empacota evidência\n│\n├── .hooks/                        # pre-commit e pre-push versionados\n└── .ci/                           # fast lane e deep lane\n```\n\n## Três decisões que parecem burocráticas e não são\n\nTrês escolhas dessa árvore têm uma alternativa mais simples e aparentemente melhor — que se revela pior no médio prazo. Entender o porquê ajuda a não \"simplificar\" no lugar errado.\n\nA primeira: **rules em arquivos separados, não em um `AGENTS.md` gigante**. O `AGENTS.md` é lido inteiro em toda execução; as rules são lidas sob demanda. Fundir os dois faz cada tarefa trivial pagar o custo de contexto da regra de migração de banco. É uma decisão de orçamento de contexto, não de estética.\n\nA segunda: **`scripts/verify.sh` como entrada única**. Hooks, CI e agente chamam o mesmo script. Sem isso, a verificação local e a de CI divergem — e a divergência aparece na forma mais cara possível: o agente entrega, o CI reprova, e ninguém consegue reproduzir localmente.\n\nA terceira: **`docs/evidence/` dentro do repositório**. A evidência acompanha o código que ela comprova. Guardada fora, sobrevive à troca de ferramenta de CI mas perde a ligação com o commit; guardada dentro, a ligação é o próprio histórico do Git.\n\n## O que cada arquivo carrega — e o que não carrega\n\nCada peça do harness tem um escopo preciso. Colocar conteúdo na peça errada é o defeito mais comum de um harness mal montado, então vale a tabela.\n\n| Arquivo | Carrega | Não carrega |\n|---|---|---|\n| `AGENTS.md` | como operar o repo, comandos, quando parar | arquitetura detalhada, histórico de decisões |\n| `docs/rules/*.md` | a regra e o motivo dela | instruções de execução passo a passo |\n| `docs/adr/` | por que a decisão foi tomada e o que custa | a regra vigente resultante |\n| `skills/<skill>/SKILL.md` | passo a passo verificável de uma tarefa recorrente | conhecimento geral sobre o domínio |\n| `.agent/permissions.md` | o que exige autorização humana | política de risco global do time |\n| `CODEOWNERS` | quem aprova mudança em cada path | por que aquele path é sensível |\n\n## O bloco mais esquecido do `AGENTS.md`\n\nO `AGENTS.md` é lido antes de qualquer ação, o que torna cada linha dele um custo fixo por execução. Ele responde ao que o agente precisa para agir corretamente **na primeira tentativa** e delega o resto por ponteiro. Seus blocos são identidade, comandos, fronteiras, verificação, escalonamento e ponteiros.\n\nDe todos, o bloco de **escalonamento** é o que mais falta e o que mais importa. Sem ele, um agente diante de um requisito contraditório escolhe uma interpretação e segue — e a escolha só aparece na revisão, quando o trabalho já foi feito. As condições genéricas de escalonamento vêm do [contrato comum dos agentes](../4-agentes/contrato-comum.md); o `AGENTS.md` acrescenta as específicas do repositório.\n\n## Rules descrevem estado; skills descrevem procedimento\n\nUma confusão vale desfazer, porque ela produz rules longas que ninguém lê e skills vagas que não se consegue executar. **Rules descrevem o estado desejado; skills descrevem o procedimento.** \"Módulos de domínio não importam de infraestrutura\" é uma rule. \"Para adicionar um adapter, crie a interface em X e a implementação em Y\" é uma skill.\n\nE toda rule carrega o motivo junto — não por cortesia, mas por eficácia: um agente que conhece a razão de uma regra decide corretamente no caso de borda que a regra não previu. Um agente que só conhece a regra ou a aplica cegamente ou a ignora.\n\n## Continue por aqui\n\nVocê tem a estrutura. Falta saber quanto dela seu repositório precisa ter para operar com um dado nível de autonomia — os [Níveis de maturidade](niveis-de-maturidade.md).", "folder": "7-repo-harness"}, {"id": "7-repo-harness__niveis-de-maturidade", "section": "Repositório (harness)", "title": "Níveis de maturidade HL0–HL3", "label": "Níveis de maturidade HL0–HL3", "body": "# Níveis de maturidade HL0–HL3\n\n> Como medir onde um repositório está, quanto de autonomia cada nível sustenta e por que a progressão segue o retorno decrescente.\n\n## Para que servem os níveis\n\nOs níveis de maturidade descrevem o que existe em um repositório, e servem para responder **uma única pergunta**: até onde a autonomia pode subir com segurança neste repo? Eles não são um selo de qualidade — são uma medida de teto. Um repositório em um dado nível pode operar até um certo nível de autonomia, e não além.\n\nA nomenclatura usa `HL` (harness level) de propósito, para não colidir com os checkpoints humanos `H1–H6` que você viu em [Gates e cerimônias](../2-modelo-operacional/gates-e-cerimonias.md). São coisas diferentes: `H` é um marco de decisão humana; `HL` é um nível de maturidade de repositório.\n\n## Os quatro níveis\n\nCada nível acrescenta camadas do harness e, com elas, autoriza um teto maior de autonomia. A última coluna — o que ainda depende de gente — é a mais útil no dia a dia: ela diz o que você ainda não pode delegar.\n\n| Nível | O repositório tem | Autonomia sustentada | O que ainda depende de gente |\n|---|---|---|---|\n| **HL0 — nu** | `README.md`, testes eventuais, CI de build | nenhuma — assistido | tudo; revisão humana é o único gate |\n| **HL1 — legível** | `AGENTS.md`, rules mínimas, `verify.sh`, pre-commit | A0–A1 | integração e liberação; revisão ainda ampla |\n| **HL2 — verificável** | CI por risco e paths, `CODEOWNERS`, proteção de branch, evidence pack | A2 | merge em R2+; decisões de trade-off |\n| **HL3 — operável por time** | skills do repo, worktree limpo, identidades por agente, gates de ambiente e pós-deploy, rollback testado | A3–A4 | exceções, incidentes e auditoria por amostragem |\n\n## A regra que evita o autoengano\n\nExiste uma regra que vale gravar, porque ela contradiz a tentação natural de todo time: **o nível do harness é o teto da autonomia, nunca a consequência dela**.\n\nO que isso quer dizer na prática? Se você encontrar um repositório em HL1 operando com autonomia A2, isso **não** é um repositório adiantado — é um repositório com um gate faltando que ninguém percebeu ainda. A autonomia não pode ultrapassar o que o harness sustenta, por melhor que o histórico pareça, porque falta a estrutura que tornaria esse histórico confiável. E mesmo dentro do teto, elevar autonomia exige a evidência acumulada descrita em [Risco e autonomia](../2-modelo-operacional/risco-e-autonomia.md) — o nível do harness autoriza, mas não basta sozinho.\n\n## Por que a progressão segue o retorno decrescente\n\nA ordem de construção entre níveis não é linear em esforço nem em ganho — e saber disso ajuda a priorizar.\n\nSair de **HL0 para HL1** é o movimento de maior impacto por esforço: é onde o agente para de reconstruir premissas a cada execução. Se você só puder fazer um movimento, faça este. De **HL1 para HL2** é onde a revisão humana começa a encolher de verdade, e é o que mais exige disciplina — gates mal calibrados geram falso positivo, e um time que aprende a ignorar gates perdeu a proteção que eles davam. De **HL2 para HL3** só compensa quando há mais de um agente em paralelo; antes disso, o custo de isolamento e identidade não se paga.\n\n## O checklist como atestado de capacidade\n\nCada nível tem um checklist de conformidade — itens verificáveis como \"`AGENTS.md` responde identidade, comandos, fronteiras, verificação, escalonamento e ponteiros\" ou \"worktree limpo roda `scripts/verify.sh` sem configuração manual\". Um repositório que falha em qualquer linha do seu nível opera, na prática, no nível anterior.\n\nMas cuidado com o que o checklist prova. Ele atesta que a **capacidade existe** — não que o histórico já demonstrou que ela funciona. Capacidade é pré-requisito da autonomia; evidência acumulada é o que a autoriza. Os dois são necessários, e o checklist cobre só o primeiro.\n\n## Você chegou ao fim da trilha\n\nEsta é a última seção da wiki. Se você leu na ordem, agora tem o quadro completo: por que o Agent Team existe, quem decide o quê, quais procedimentos e agentes executam o trabalho, como eles colaboram nos workflows, onde tudo roda no workspace e o que um repositório carrega para ser operado com segurança. Para revisar qualquer peça, volte ao [índice da wiki](../README.md).", "folder": "7-repo-harness"}];
const byId = Object.fromEntries(PAGES.map(p=>[p.id,p]));
marked.setOptions({gfm:true, breaks:false});

// build nav
const nav = document.getElementById('nav');
let curSec=null, secEl=null;
PAGES.forEach(p=>{
  if(p.section!==curSec){
    curSec=p.section;
    const st=document.createElement('div');st.className='sec-title';st.textContent=curSec;nav.appendChild(st);
  }
  const a=document.createElement('a');
  a.className='nav-link'+((p.label&&p.label.includes('TLDR'))?' tldr':'');
  a.textContent = p.label || p.title;
  a.dataset.id=p.id;
  a.onclick=()=>{show(p.id);history.pushState({},'','#'+p.id);document.getElementById('sidebar').classList.remove('open');};
  nav.appendChild(a);
});

function show(id){
  const p=byId[id]||PAGES[0];
  const md=document.getElementById('md');
  md.innerHTML='<div class="crumb">'+p.section+'</div>'+marked.parse(p.body);
  // rewrite relative .md links to hashes
  md.querySelectorAll('a[href]').forEach(a=>{
    let h=a.getAttribute('href');
    if(/^https?:/.test(h)) {a.target='_blank';return;}
    if(!/\.md/.test(h)) return;
    let frag=h.replace(/#.*$/,'');
    // resolve relative to current page folder
    let baseParts = p.folder ? p.folder.split('/') : [];
    let parts = frag.split('/');
    let stack = baseParts.slice();
    for(let seg of parts){
      if(seg==='.'||seg==='') continue;
      if(seg==='..'){ stack.pop(); continue; }
      stack.push(seg);
    }
    let resolved = stack.join('/').replace(/\.md$/,'');
    let key = resolved.replace(/\//g,'__');
    if(resolved==='README'||resolved==='') key='home';
    if(byId[key]){a.onclick=e=>{e.preventDefault();show(key);history.pushState({},'','#'+key);};a.setAttribute('href','#'+key);}
  });
  document.querySelectorAll('.nav-link').forEach(n=>n.classList.toggle('active',n.dataset.id===p.id));
  // pager
  const idx=PAGES.findIndex(x=>x.id===p.id);
  const prev=PAGES[idx-1], next=PAGES[idx+1];
  let ph='';
  if(prev) ph+='<a onclick="show(\''+prev.id+'\');history.pushState({},\'\',\'#'+prev.id+'\')"><span class="lab">Anterior</span><span class="ttl">'+(prev.title)+'</span></a>'; else ph+='<span style="flex:1"></span>';
  if(next) ph+='<a class="next" onclick="show(\''+next.id+'\');history.pushState({},\'\',\'#'+next.id+'\')"><span class="lab">Próximo</span><span class="ttl">'+(next.title)+'</span></a>';
  document.getElementById('pager').innerHTML='<div class="pager">'+ph+'</div>';
  window.scrollTo(0,0);
}

// search
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  document.querySelectorAll('.nav-link').forEach(a=>{
    const p=byId[a.dataset.id];
    const hit=!q||(p.title+p.section+p.body).toLowerCase().includes(q);
    a.style.display=hit?'block':'none';
  });
  document.querySelectorAll('.sec-title').forEach(st=>{
    let n=st.nextElementSibling,vis=false;
    while(n&&n.classList.contains('nav-link')){if(n.style.display!=='none')vis=true;n=n.nextElementSibling;}
    st.style.display=vis?'block':'none';
  });
});

window.addEventListener('popstate',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'home');
</script>
